        cx.fill()
        cx.fillStyle = '#1a0f08'
        cx.beginPath(); cx.ellipse(X + 20, ey, 1.5, 2.6, 0, 0, 7); cx.fill()
      }
      cx.font = 'bold 7px Verdana'; cx.textAlign = 'center'
      const st = MOB_STATS[m.type]
      const plate = st ? (m.type + '  ' + m.hp + '/' + st.maxHp + ' hp  hits ' + st.maxHit)
                       : m.type
      cx.fillStyle = 'rgba(0,0,0,.45)'; cx.fillText(plate, X + 20.7, Y - 2.3)
      cx.fillStyle = '#ffe08a'; cx.fillText(plate, X + 20, Y - 3)
      const hop = engaged ? Math.abs(Math.sin(now / 160)) * 2 : Math.sin(now / 700 + m.x) * 0.7
      shadow(X, Y, 9)
      if ((m.rootedUntil ?? 0) > s.tick) rootBind(X, Y)
      if (m.type === 'dragon') {
        // IT IS BIGGER THAN ITS TILE, and it should be. Everything else in
        // this world fits inside forty pixels; the one thing that kills a
        // maxed citizen does not. The sprite overflows deliberately, the way
        // the cottage smoke does, so that seeing it at the edge of the screen
        // is itself the warning.
        const breathe = Math.sin(now / 1100) * 1.5
        const beat = Math.sin(now / 640)
        // IT TURNS TO WHAT IT IS BURNING.
        //
        // `MF` is the facing the caller works out from movement, which is
        // fine for a beast that is walking and wrong for one that is standing
        // still and breathing: the fire came out of its tail. A dragon that
        // has somebody in mind looks at them.
        const _tgt = m.mad ? s.players?.[m.mad] : null
        const F = _tgt ? (_tgt.x >= m.x ? -1 : 1) : (MF < 0 ? -1 : 1)
        const HX = X + 20 - F * 24, HY = Y - 12 + breathe   // the head
        cx.fillStyle = 'rgba(0,0,0,.32)'
        cx.beginPath(); cx.ellipse(X + 20, Y + 34, 30, 8, 0, 0, 7); cx.fill()

        // ---- WINGS: a bone arc, then membrane hung between fingers ----
        for (const side of [-1, 1]) {
          const sp = 1 + beat * 0.22                    // the beat opens them
          const tipX = X + 20 + side * 34 * sp, tipY = Y - 6 - beat * 7
          const elbX = X + 20 + side * 20, elbY = Y - 14 - beat * 5
          cx.fillStyle = side * F > 0 ? '#3d2430' : '#331e29'   // far wing darker
          cx.beginPath()
          cx.moveTo(X + 20, Y + 10 + breathe)
          cx.quadraticCurveTo(elbX, elbY, tipX, tipY)           // leading edge
          for (let k = 3; k >= 1; k--) {                        // scalloped trailing edge
            const fx = X + 20 + (tipX - X - 20) * (k / 4), fy = tipY + (Y + 22 - tipY) * (1 - k / 4)
            cx.quadraticCurveTo(fx + side * 3, fy + 7, fx, fy + 2)
          }
          cx.closePath(); cx.fill()
          cx.strokeStyle = 'rgba(140,86,104,.55)'; cx.lineWidth = 1.4     // the finger bones
          for (let k = 1; k <= 3; k++) {
            const fx = X + 20 + (tipX - X - 20) * (k / 4), fy = tipY + (Y + 22 - tipY) * (1 - k / 4)
            cx.beginPath(); cx.moveTo(X + 20, Y + 11 + breathe); cx.lineTo(fx, fy + 2); cx.stroke()
          }
          cx.strokeStyle = '#5a3444'; cx.lineWidth = 2.2                   // the arm itself
          cx.beginPath(); cx.moveTo(X + 20, Y + 10 + breathe)
          cx.quadraticCurveTo(elbX, elbY, tipX, tipY); cx.stroke()
        }

        // ---- TAIL: out behind, with a spade ----
        const tw = Math.sin(now / 900) * 6
        cx.strokeStyle = '#4a2a20'; cx.lineWidth = 7; cx.lineCap = 'round'
        cx.beginPath(); cx.moveTo(X + 20, Y + 26)
        cx.quadraticCurveTo(X + 20 + F * 22, Y + 34 + tw * 0.4, X + 20 + F * 34, Y + 14 + tw)
        cx.stroke(); cx.lineWidth = 3
        cx.beginPath(); cx.moveTo(X + 20 + F * 34, Y + 14 + tw)
        cx.lineTo(X + 20 + F * 40, Y + 6 + tw); cx.stroke(); cx.lineCap = 'butt'
        poly([[X+20+F*40,Y+6+tw],[X+20+F*47,Y+2+tw],[X+20+F*41,Y+12+tw]], '#6b3a2a')

        // ---- BODY: a barrel chest, not a lump ----
        cx.fillStyle = '#5a3226'
        cx.beginPath(); cx.ellipse(X + 20, Y + 19 + breathe, 13, 11, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#241009'; cx.lineWidth = 1.4; cx.stroke()
        cx.fillStyle = '#7a4a34'                                   // lit along the top
        cx.beginPath(); cx.ellipse(X + 20, Y + 15 + breathe, 10, 6, 0, 0, 7); cx.fill()
        cx.fillStyle = '#c9a86a'                                   // belly plates
        for (let r = 0; r < 3; r++) cx.fillRect(X + 15, Y + 22 + r * 3 + breathe, 10 - r * 2, 1.8)
        // haunch and a foot planted
        cx.fillStyle = '#4a2a20'
        cx.beginPath(); cx.ellipse(X + 20 + F * 9, Y + 26 + breathe, 7, 6, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#c9b98a'; cx.lineWidth = 1.6
        for (const cw of [-3, 0, 3]) { cx.beginPath()
          cx.moveTo(X + 20 + F * 12 + cw * 0.4, Y + 31); cx.lineTo(X + 20 + F * 14 + cw, Y + 34); cx.stroke() }

        // ---- SPINE: a ridge of plates from shoulder to tail ----
        cx.fillStyle = '#8a5a3a'
        for (let r = 0; r < 5; r++) {
          const sx = X + 20 + F * (r * 4 - 4), sy = Y + 12 + r * 2.4 + breathe
          poly([[sx - 2.5, sy], [sx, sy - 5 + r * 0.5], [sx + 2.5, sy]], '#8a5a3a')
        }

        // ---- NECK and HEAD: long, out over the tile edge ----
        cx.strokeStyle = '#5a3226'; cx.lineWidth = 9; cx.lineCap = 'round'
        cx.beginPath(); cx.moveTo(X + 20 - F * 4, Y + 14 + breathe)
        cx.quadraticCurveTo(X + 20 - F * 18, Y + 2 + breathe, HX + F * 4, HY + 4)
        cx.stroke(); cx.lineCap = 'butt'
        // skull: a wedge with a snout, not a ball
        poly([[HX + F * 8, HY - 1], [HX - F * 6, HY - 5], [HX - F * 11, HY + 1],
              [HX - F * 6, HY + 6], [HX + F * 7, HY + 5]], '#6e4030', '#241009')
        poly([[HX - F * 6, HY + 2], [HX - F * 12, HY + 2], [HX - F * 6, HY + 6]], '#4a2a20')  // jaw
        cx.strokeStyle = '#c9b98a'; cx.lineWidth = 2.2                    // horns, swept back
        for (const hh of [-2.5, 2.5]) {
          cx.beginPath(); cx.moveTo(HX + F * 4, HY - 3 + hh * 0.6)
          cx.quadraticCurveTo(HX + F * 11, HY - 8 + hh, HX + F * 15, HY - 5 + hh * 1.4); cx.stroke()
        }
        cx.fillStyle = engaged ? '#ff6a1f' : '#e2a63e'                    // the eye
        cx.beginPath(); cx.ellipse(HX - F * 2, HY - 1, 2.6, 1.8, 0, 0, 7); cx.fill()
        cx.fillStyle = '#1a0d06'
        cx.fillRect(HX - F * 2 - 0.5, HY - 2.6, 1, 3.2)                   // a slit pupil
        cx.fillStyle = 'rgba(255,140,40,' + (engaged ? 0.22 : 0.10) + ')'
        cx.beginPath(); cx.arc(HX - F * 2, HY - 1, 8, 0, 7); cx.fill()

        // ---- BREATH: smoke always, fire when it is fighting ----
        for (let k = 0; k < 4; k++) {
          const t2 = ((now / (1400 + k * 380)) + k * 0.25) % 1
          const bx = HX - F * (11 + t2 * 16), by = HY + 3 - t2 * 7
          cx.fillStyle = engaged
            ? 'rgba(255,' + (90 + k * 34) + ',' + (20 + k * 10) + ',' + (0.55 * (1 - t2)) + ')'
            : 'rgba(158,148,140,' + (0.20 * (1 - t2)) + ')'
          cx.beginPath(); cx.arc(bx, by, 1.8 + t2 * (engaged ? 6 : 4.5), 0, 7); cx.fill()
        }

        // ---- §6w: THE FIRE ----
        //
        // It does fourteen through armour from five tiles and there was
        // nothing on the screen to say so. A citizen crossing that ground was
        // taking damage from a creature that appeared to be standing still,
        // which is the worst kind of unfair: not hard, illegible.
        //
        // Everything needed is in the state. A beast now carries `lastSwing`,
        // so the window knows the tick it last struck; `mad` says who it
        // struck at; and the distance says whether that was a claw or a
        // breath. No new field, no message -- the world already recorded it.
        {
          const meD = s.players?.[myId]
          const since = s.tick - (m.lastSwing ?? -99)
          const dist = meD ? Math.max(Math.abs(meD.x - m.x), Math.abs(meD.y - m.y)) : 99
          // a breath, not a claw: it reached me from further than arm's length
          if (meD && m.mad === myId && since >= 0 && since <= 3 && dist > 1 && dist <= 5) {
            const life = 1 - (since + ((now / 600) % 1)) / 4      // fades over its four ticks
            if (life > 0) {
              const ang = Math.atan2(meD.y - m.y, meD.x - m.x)
              const reach = dist * TILE
              cx.save()
              cx.translate(HX - F * 6, HY + 2)
              cx.rotate(ang)
              // the cone: bright at the mouth, thinning and reddening outward
              const grad = cx.createLinearGradient(0, 0, reach, 0)
              grad.addColorStop(0, 'rgba(255,236,170,' + (0.85 * life) + ')')
              grad.addColorStop(0.25, 'rgba(255,168,50,' + (0.7 * life) + ')')
              grad.addColorStop(0.7, 'rgba(226,74,26,' + (0.4 * life) + ')')
              grad.addColorStop(1, 'rgba(120,30,12,0)')
              cx.fillStyle = grad
              cx.beginPath()
              cx.moveTo(0, -3)
              cx.quadraticCurveTo(reach * 0.5, -10 - life * 6, reach, -14 - life * 8)
              cx.lineTo(reach, 14 + life * 8)
              cx.quadraticCurveTo(reach * 0.5, 10 + life * 6, 0, 3)
              cx.closePath(); cx.fill()
              // embers riding it outward
              for (let k = 0; k < 7; k++) {
                const t3 = ((now / 300 + k * 0.17) % 1)
                const ex = t3 * reach, ey = Math.sin(k * 2.3 + now / 200) * (4 + t3 * 12)
                cx.fillStyle = 'rgba(255,' + (190 - k * 14) + ',90,' + (life * (1 - t3) * 0.9) + ')'
                cx.beginPath(); cx.arc(ex, ey, 1 + (1 - t3) * 2.4, 0, 7); cx.fill()
              }
              cx.restore()
              // and the mouth itself, lit
              cx.fillStyle = 'rgba(255,220,140,' + (0.9 * life) + ')'
              cx.beginPath(); cx.arc(HX - F * 6, HY + 2, 3.5 + life * 2, 0, 7); cx.fill()
            }
          }
        }

        cx.fillStyle = '#4a1008'; cx.fillRect(X + 2, Y - 34, 36, 4.4)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 2, Y - 34, 36 * Math.max(0, m.hp / 420), 4.4)
        cx.fillStyle = 'rgba(226,182,62,.9)'
        cx.font = '600 8px ui-monospace,monospace'; cx.textAlign = 'center'
        cx.fillText('THE DRAGON', X + 20, Y - 37); cx.textAlign = 'left'
        return
      }
      if (m.type === 'siren') {
        // SHE WEARS THE FACE OF WHOEVER TOOK HER.
        //
        // Every other creature here looks like itself. She looks like a
        // citizen — the same silhouette, the same proportions — and that is
        // the whole idea, so it has to be the first thing you see. When she
        // is bound she takes that citizen's colours; unbound she is the
        // colour of the water she came out of.
        const mine2 = m.bound && m.bound === myId
        const taken = m.bound && m.bound !== myId
        const boundP = m.bound ? s.players?.[m.bound] : null
        const sway = Math.sin(now / 1100 + m.x) * 1.4
        const shimmer = 0.5 + 0.5 * Math.sin(now / 700)
        // the water at her feet never quite settles
        for (let r = 0; r < 3; r++) {
          const t3 = ((now / 1600) + r * 0.33) % 1
          cx.strokeStyle = 'rgba(150,200,220,' + (0.22 * (1 - t3)) + ')'
          cx.lineWidth = 1
          cx.beginPath(); cx.ellipse(X + 20, Y + 32, 6 + t3 * 16, 2 + t3 * 5, 0, 0, 7); cx.stroke()
        }
        const dim = taken ? 0.34 : 1     // already taken: she is not for you
        const body = boundP ? (capeOf(boundP) ? '#6a5a86' : '#3f5f8a') : '#4a7a8c'
        const skinC = '#cfe4ea'
        // the shape of a citizen, and deliberately the same proportions
        cx.globalAlpha = dim
        cx.fillStyle = body
        cx.fillRect(X + 15 + sway * 0.3, Y + 16, 10, 15)
        cx.fillStyle = skinC
        cx.beginPath(); cx.arc(X + 20 + sway * 0.4, Y + 11, 5.2, 0, 7); cx.fill()
        // hair, which is the part that is wrong: it moves like water
        cx.strokeStyle = 'rgba(120,180,200,' + (0.55 + 0.25 * shimmer) + ')'
        cx.lineWidth = 1.6
        for (let k = 0; k < 6; k++) {
          const off = (k - 2.5) * 1.9
          cx.beginPath()
          cx.moveTo(X + 20 + off + sway * 0.4, Y + 7)
          cx.quadraticCurveTo(X + 20 + off * 1.7 + Math.sin(now / 500 + k) * 3, Y + 17,
                              X + 20 + off * 2.1 + Math.sin(now / 430 + k) * 4, Y + 27)
          cx.stroke()
        }
        // no face. Two lights where eyes would be.
        cx.fillStyle = 'rgba(226,246,255,' + (0.7 + 0.3 * shimmer) + ')'
        for (const ex of [-1.9, 1.9]) {
          cx.beginPath(); cx.arc(X + 20 + ex + sway * 0.4, Y + 10.5, 1.1, 0, 7); cx.fill()
        }
        cx.globalAlpha = 1
        // and what she is holding, if she has taken somebody's shape
        if (boundP?.equipment?.weapon?.item) {
          cx.globalAlpha = dim
          cx.save(); cx.translate(X + 27, Y + 24); cx.rotate(0.7)
          const wi = boundP.equipment.weapon.item
          cx.strokeStyle = 'rgba(190,225,240,.8)'; cx.lineWidth = 1.6
          if (RANGED_ITEMS.has(wi)) {
            cx.beginPath(); cx.moveTo(-1, -6); cx.quadraticCurveTo(4.4, 1, -1, 8); cx.stroke()
          } else {
            cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, 9); cx.stroke()
          }
          cx.restore(); cx.globalAlpha = 1
        }
        if (taken) {                       // somebody else's fight
          cx.fillStyle = 'rgba(150,200,220,.75)'
          cx.font = '600 7px ui-monospace,monospace'; cx.textAlign = 'center'
          cx.fillText('taken', X + 20, Y - 4); cx.textAlign = 'left'
        }
        cx.fillStyle = '#1c3038'; cx.fillRect(X + 6, Y - 1, 28, 3.4)
        cx.fillStyle = mine2 ? '#7fd4e8' : '#4a8a9c'
        cx.fillRect(X + 6, Y - 1, 28 * Math.max(0, m.hp / 60), 3.4)
        return
      }
      if (m.type === 'great-spider') {
        // wide, low, and eight-legged. It should read as a thing that has been
        // sitting here a long time.
        const twitch = Math.sin(now / 380 + m.x) * 1.6
        const breathe = Math.sin(now / 1300) * 1.2
        shadow(X, Y, 16)
        // LEGS: four a side, jointed, reaching well past the tile
        for (const side of [-1, 1]) {
          cx.strokeStyle = '#2e2028'; cx.lineWidth = 2.2; cx.lineCap = 'round'
          for (let k = 0; k < 4; k++) {
            const lift = Math.sin(now / 300 + k * 1.7 + (side > 0 ? 0 : 2.4)) * 1.8
            const spread = 12 + k * 4
            const kneeY = Y + 12 + k * 3 - 5 - lift
            cx.beginPath()
            cx.moveTo(X + 20 + side * 5, Y + 18 + k * 2.2)
            cx.quadraticCurveTo(X + 20 + side * (spread * 0.6), kneeY,
                                X + 20 + side * spread, Y + 26 + k * 2 + lift)
            cx.stroke()
          }
          cx.lineCap = 'butt'
        }
        // ABDOMEN, the big part, behind
        cx.fillStyle = '#3d2b34'
        cx.beginPath(); cx.ellipse(X + 20, Y + 24 + breathe, 12, 10, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#1e1418'; cx.lineWidth = 1.3; cx.stroke()
        cx.fillStyle = '#5a3f4c'                       // the pale mark on its back
        cx.beginPath(); cx.ellipse(X + 20, Y + 21 + breathe, 6, 5, 0, 0, 7); cx.fill()
        cx.fillStyle = '#c9b08a'
        poly([[X + 20, Y + 17 + breathe], [X + 23, Y + 24 + breathe],
              [X + 20, Y + 22 + breathe], [X + 17, Y + 24 + breathe]], '#c9b08a')
        // CEPHALOTHORAX and the eyes
        cx.fillStyle = '#4a3540'
        cx.beginPath(); cx.ellipse(X + 20, Y + 13 + twitch * 0.3, 8, 6.5, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#1e1418'; cx.lineWidth = 1.1; cx.stroke()
        cx.fillStyle = '#0f0a0c'                       // eight eyes, in two rows
        for (const [ex, ey, r] of [[-4,-2,1.5],[-1.4,-3,1.9],[1.4,-3,1.9],[4,-2,1.5],
                                   [-2.6,0.6,1.1],[-0.9,1.2,1.3],[0.9,1.2,1.3],[2.6,0.6,1.1]]) {
          cx.beginPath(); cx.arc(X + 20 + ex, Y + 13 + ey + twitch * 0.3, r, 0, 7); cx.fill()
        }
        cx.fillStyle = 'rgba(226,90,110,.55)'
        for (const [ex, ey] of [[-1.4,-3],[1.4,-3]]) {
          cx.beginPath(); cx.arc(X + 20 + ex, Y + 13 + ey + twitch * 0.3, 0.8, 0, 7); cx.fill()
        }
        // fangs
        cx.strokeStyle = '#c9b08a'; cx.lineWidth = 1.6; cx.lineCap = 'round'
        for (const fx of [-2.6, 2.6]) {
          cx.beginPath(); cx.moveTo(X + 20 + fx, Y + 18)
          cx.lineTo(X + 20 + fx * 0.6, Y + 22 + twitch * 0.4); cx.stroke()
        }
        cx.lineCap = 'butt'
        // and the strand it hangs from, going up out of the tile
        cx.strokeStyle = 'rgba(226,232,240,.22)'; cx.lineWidth = 1
        cx.beginPath(); cx.moveTo(X + 20, Y + 7); cx.lineTo(X + 20, Y - 20); cx.stroke()
        cx.fillStyle = '#2b1a20'; cx.fillRect(X + 2, Y - 8, 36, 4.4)
        cx.fillStyle = '#a8446a'; cx.fillRect(X + 2, Y - 8, 36 * Math.max(0, m.hp / 300), 4.4)
        cx.fillStyle = 'rgba(226,182,62,.9)'
        cx.font = '600 8px ui-monospace,monospace'; cx.textAlign = 'center'
        cx.fillText('THE SPIDER', X + 20, Y - 11); cx.textAlign = 'left'
        return
      }
      if (m.type === 'shore-crab') {
        // wide, low and armoured: it should read as a thing you have to open
        // rather than a thing you have to survive
        const sway = Math.sin(now / 700 + m.x) * 1.4
        const claw = Math.sin(now / 420 + m.y) * 2.2
        shadow(X, Y, 13)
        for (const side of [-1, 1]) {                       // legs, four a side
          cx.strokeStyle = '#7a3b2a'; cx.lineWidth = 1.8; cx.lineCap = 'round'
          for (let k = 0; k < 4; k++) {
            const ly = Y + 19 + k * 3
            cx.beginPath(); cx.moveTo(X + 20 + side * 7, ly)
            cx.quadraticCurveTo(X + 20 + side * (13 + k), ly + 2, X + 20 + side * (15 + k * 0.6), ly + 6)
            cx.stroke()
          }
          cx.lineCap = 'butt'
        }
        // the shell
        cx.fillStyle = '#a34a2c'
        cx.beginPath(); cx.ellipse(X + 20, Y + 20 + sway * 0.4, 13, 9, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#5e2415'; cx.lineWidth = 1.4; cx.stroke()
        cx.fillStyle = '#c46340'
        cx.beginPath(); cx.ellipse(X + 20, Y + 17 + sway * 0.4, 10, 5.4, 0, 0, 7); cx.fill()
        cx.fillStyle = 'rgba(94,36,21,.35)'                  // plates
        for (const px2 of [-6, 0, 6]) cx.fillRect(X + 20 + px2 - 0.7, Y + 14, 1.4, 12)
        // eyes on stalks
        for (const ex of [-4, 4]) {
          cx.strokeStyle = '#7a3b2a'; cx.lineWidth = 1.4
          cx.beginPath(); cx.moveTo(X + 20 + ex, Y + 14); cx.lineTo(X + 20 + ex, Y + 9 + sway); cx.stroke()
          cx.fillStyle = '#1a0f0a'
          cx.beginPath(); cx.arc(X + 20 + ex, Y + 8 + sway, 1.8, 0, 7); cx.fill()
        }
        // the claws, opening and closing
        for (const side of [-1, 1]) {
          const cxp = X + 20 + side * 15, cyp = Y + 15
          cx.fillStyle = '#b3542f'
          poly([[cxp, cyp], [cxp + side * 7, cyp - 3 - claw * side], [cxp + side * 8, cyp + 1],
                [cxp + side * 6, cyp + 4]], '#b3542f', '#5e2415')
          cx.fillStyle = '#8e3d22'
          poly([[cxp + side * 3, cyp + 1], [cxp + side * 8, cyp + 1],
                [cxp + side * 7, cyp + 4 + claw * side * 0.4]], '#8e3d22')
          cx.strokeStyle = '#7a3b2a'; cx.lineWidth = 2
          cx.beginPath(); cx.moveTo(X + 20 + side * 9, Y + 18); cx.lineTo(cxp, cyp + 1); cx.stroke()
        }
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 8, Y + 2, 24, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 8, Y + 2, 24 * Math.max(0, m.hp / 45), 3)
        return
      }
      if (m.type === 'troll') {
        const heave = Math.sin(now / 800 + m.x) * 1
        poly([[X+6,Y+33],[X+8,Y+12+heave],[X+20,Y+6+heave],[X+32,Y+12+heave],[X+34,Y+33]], '#5c6b52', '#2a3324')
        poly([[X+10,Y+30],[X+12,Y+14+heave],[X+20,Y+10+heave],[X+28,Y+14+heave],[X+30,Y+30]], '#6b7a5e')
        cx.fillStyle = 'rgba(0,0,0,.2)'; cx.fillRect(X + 12, Y + 20 + heave, 16, 2)
        cx.fillStyle = '#c9302c'
        cx.fillRect(X + 15 + MF * 1.5, Y + 15 + heave, 2.8, 2.8); cx.fillRect(X + 22 + MF * 1.5, Y + 15 + heave, 2.8, 2.8)
        cx.save(); cx.translate(X + (MF > 0 ? 33 : 7), Y + 22 + heave)
        cx.rotate(MF * (engaged ? Math.sin(now / 200) * 0.6 : 0.3))
        cx.fillStyle = '#4a3a26'; cx.fillRect(-2, -14, 4, 16)
        cx.fillStyle = '#5c4a32'; cx.beginPath(); cx.arc(0, -14, 4.4, 0, 7); cx.fill()
        cx.restore()
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 10, Y + 1, 20, 3.4)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 10, Y + 1, 20 * (m.hp / 20), 3.4)
        return
      }
      if (m.type === 'bear') {
        const lum = Math.sin(now / 500 + m.x) * 0.8
        poly([[X+5,Y+31],[X+8,Y+15+lum],[X+20,Y+10+lum],[X+32,Y+15+lum],[X+35,Y+31]], '#6b4a2e', '#33220f')
        poly([[X+9,Y+28],[X+12,Y+17+lum],[X+20,Y+13+lum],[X+28,Y+17+lum],[X+31,Y+28]], '#7d5a3a')
        const hx2 = MF > 0 ? 29 : 11
        cx.fillStyle = '#6b4a2e'; cx.beginPath(); cx.arc(X + hx2 - MF * 3, Y + 11 + lum, 3, 0, 7); cx.arc(X + hx2 + MF * 3, Y + 11 + lum, 3, 0, 7); cx.fill()
        cx.fillStyle = '#c9302c'; cx.fillRect(X + hx2 + MF * 2, Y + 17 + lum, 2.2, 2.2)
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 11, Y + 4, 18, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 11, Y + 4, 18 * (m.hp / 14), 3)
        return
      }
      if (m.type === 'wolf') {
        const lope = Math.sin(now / 300 + m.x) * 0.8
        poly([[X+7,Y+28+lope],[X+12,Y+21+lope],[X+27,Y+21+lope],[X+33,Y+26+lope],[X+29,Y+31],[X+11,Y+31]], '#6e6e72', '#3a3a3e')
        poly([[X+9,Y+24+lope],[X+13,Y+22+lope],[X+26,Y+22+lope],[X+29,Y+25+lope],[X+26,Y+29],[X+12,Y+29]], '#82828a')
        const hx2 = MF > 0 ? 30 : 10
        poly([[X+hx2-MF*2,Y+24+lope],[X+hx2+MF*7,Y+22+lope],[X+hx2+MF*8,Y+26+lope],[X+hx2,Y+27+lope]], '#6e6e72', '#3a3a3e')
        poly([[X+hx2+MF*2,Y+21+lope],[X+hx2+MF*5,Y+17+lope],[X+hx2+MF*6,Y+22+lope]], '#5a5a5e')
        cx.fillStyle = '#c9302c'; cx.fillRect(X + hx2 + MF * 4, Y + 23 + lope, 1.8, 1.8)
        const tx2 = MF > 0 ? 6 : 34
        poly([[X+tx2,Y+26+lope],[X+tx2-MF*5,Y+22+lope+Math.sin(now/250)*1.5],[X+tx2-MF*2,Y+28]], '#5a5a5e')
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 13, Y + 14, 14, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 13, Y + 14, 14 * (m.hp / 8), 3)
        return
      }
      if (m.type === 'skeleton-knight') {
        const march = engaged ? Math.abs(Math.sin(now / 150)) * 2 : Math.sin(now / 650 + m.x) * 0.7
        // legs (bone)
        cx.fillStyle = '#c9c2ae'; cx.fillRect(X + 16, Y + 27, 3, 7); cx.fillRect(X + 21, Y + 27, 3, 7)
        cx.fillStyle = '#8a8371'; cx.fillRect(X + 16, Y + 33, 3, 1.4); cx.fillRect(X + 21, Y + 33, 3, 1.4)
        // torso: ribcage, two-tone with a spine and ribs
        poly([[X+15,Y+14-march],[X+25,Y+14-march],[X+24,Y+28],[X+16,Y+28]], '#d8d2c0', '#5a5348')
        poly([[X+17,Y+15-march],[X+23,Y+15-march],[X+22,Y+27],[X+18,Y+27]], '#e6e0d0')
        cx.fillStyle = '#7a7362'
        for (let r = 0; r < 3; r++) cx.fillRect(X + 17, Y + 17 - march + r * 3.2, 6, 1.1) // ribs
        cx.fillStyle = '#5a5348'; cx.fillRect(X + 19.4, Y + 15 - march, 1.2, 12) // spine
        // the round wooden shield, on the arm away from the sword
        const shX = MF > 0 ? X + 12 : X + 28
        cx.fillStyle = '#5c4023'; cx.beginPath(); cx.arc(shX, Y + 21 - march, 6.5, 0, 7); cx.fill()
        cx.strokeStyle = '#3a2716'; cx.lineWidth = 1.4; cx.stroke()
        cx.fillStyle = '#6e5433'; cx.beginPath(); cx.arc(shX, Y + 21 - march, 4.4, 0, 7); cx.fill()
        cx.fillStyle = '#9a9a94'; cx.beginPath(); cx.arc(shX, Y + 21 - march, 1.6, 0, 7); cx.fill() // boss
        // the skull
        cx.fillStyle = '#e6e0d0'; cx.beginPath(); cx.arc(X + 20, Y + 9 - march, 5.4, 0, 7); cx.fill()
        cx.fillStyle = '#c9c2ae'; cx.fillRect(X + 17.5, Y + 11 - march, 5, 3) // jaw
        cx.fillStyle = '#2b2620'; cx.fillRect(X + 17.6, Y + 8 - march, 2, 2.2); cx.fillRect(X + 20.4, Y + 8 - march, 2, 2.2) // sockets
        cx.fillStyle = '#e2452e'; cx.fillRect(X + 18.1 + MF * 0.4, Y + 8.4 - march, 1, 1); cx.fillRect(X + 20.9 + MF * 0.4, Y + 8.4 - march, 1, 1) // ember eyes
        // the horned helm
        cx.fillStyle = '#6b6660'; cx.fillRect(X + 15.3, Y + 4.4 - march, 9.4, 3.6)
        poly([[X+15.5,Y+6-march],[X+9,Y+1.5-march],[X+13,Y+7.5-march]], '#d9c9a0', '#3a3226') // left horn
        poly([[X+24.5,Y+6-march],[X+31,Y+1.5-march],[X+27,Y+7.5-march]], '#d9c9a0', '#3a3226') // right horn
        // the longsword, raised and swinging when engaged
        cx.save(); cx.translate(X + (MF > 0 ? 27 : 13), Y + 20 - march)
        cx.rotate(MF * (engaged ? -0.4 + Math.sin(now / 150) * 0.7 : 0.35))
        cx.fillStyle = '#6a5433'; cx.fillRect(-1.2, 0, 2.4, 5)   // hilt
        cx.fillStyle = '#4a3a26'; cx.fillRect(-3.6, -1, 7.2, 2)  // crossguard
        poly([[-1.6,-1],[1.6,-1],[1.6,-16],[0,-19],[-1.6,-16]], '#cfd2cc', '#7a7d78') // blade
        cx.restore()
        // hp bar
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 11, Y, 18, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 11, Y, 18 * (m.hp / 18), 3)
        return
      }
      // the goblin: two-tone body, ears, club
      poly([[X+20,Y+11-hop],[X+28,Y+20-hop],[X+24,Y+34],[X+16,Y+34],[X+12,Y+20-hop]], '#4e7d2a', '#2c4a15')
      poly([[X+20,Y+13-hop],[X+25,Y+21-hop],[X+22,Y+33],[X+18,Y+33],[X+15,Y+21-hop]], '#5c8f35')
      poly([[X+12,Y+15-hop],[X+9,Y+9-hop],[X+15,Y+13-hop]], '#4e7d2a') // ears
      poly([[X+28,Y+15-hop],[X+31,Y+9-hop],[X+25,Y+13-hop]], '#4e7d2a')
      cx.fillStyle = '#c9302c'
      cx.fillRect(X + 15.5 + MF * 1.2, Y + 15 - hop, 2.4, 2.4); cx.fillRect(X + 22 + MF * 1.2, Y + 15 - hop, 2.4, 2.4)
      cx.save(); cx.translate(X + (MF > 0 ? 28 : 12), Y + 24 - hop)
      cx.rotate(MF * (engaged ? Math.sin(now / 160) * 0.5 : 0.4))
      cx.fillStyle = '#5c4023'; cx.fillRect(-1.2, -8, 2.4, 10)
      cx.fillStyle = '#6e5433'; cx.beginPath(); cx.arc(0, -9, 3, 0, 7); cx.fill()
      cx.restore()
      cx.fillStyle = '#4a1008'; cx.fillRect(X + 13, Y + 4, 14, 3)
      cx.fillStyle = '#c0392b'; cx.fillRect(X + 13, Y + 4, 14 * (m.hp / 5), 3)
    }})
  }

  const HIDE_AFTER = 144000 // ~24h of ticks: the long-departed stop cluttering spawn
  for (const [pid, p] of (s._playersE ?? Object.entries(s.players))) {
    if (pid !== myId && p.hp > 0 && s.tick - (p.lastInput ?? 0) > HIDE_AFTER) continue // long gone
    const o = prevState?.players[pid]
    const ix = o ? lerp(o.x, p.x, t) : p.x
    const iy = o ? lerp(o.y, p.y, t) : p.y
    if (p.action) {
      // you face what you fight (and what you work)
      const tgt = s.nodes[p.action.nodeId] ?? s.mobs[p.action.mobId]
      // A citizen faces what they are working on. When the tree is directly
      // north or south there is no side to turn to, and this used to snap to
      // hard right: chopping something above you turned you away from it.
      // Keep the way you were already facing instead.
      if (tgt) facing[pid] = tgt.x !== p.x ? Math.sign(tgt.x - p.x) : (facing[pid] ?? 1)
    } else if (o && p.x !== o.x) facing[pid] = Math.sign(p.x - o.x)
    const moving = o && (p.x !== o.x || p.y !== o.y) && t < 1
    const anim = moving ? 'walk' : p.action?.type === 'gather' ? 'gather'
               : p.action?.type === 'attack' ? 'fight' : 'idle'
    const workNode = p.action?.nodeId ? s.nodes[p.action.nodeId] : null
    const tool = workNode?.type === 'fishing-spot' ? 'rod'
               : (workNode?.type === 'rock' || workNode?.type === 'magic-rock') ? 'pick' : 'axe'
    const wep = p.equipment?.weapon?.item
    const bronzeTool = (workNode?.type === 'tree' && wep === 'bronze-hatchet')
                    || ((workNode?.type === 'rock' || workNode?.type === 'magic-rock') && wep === 'bronze-pickaxe')
    const awake = isAwake(p, s.tick)
    const dying = p.hp <= 0, deadStart = (p.deadUntil ?? s.tick) - 5
    if ((p.stilledUntil ?? 0) > s.tick) layer.push({ z: Z(iy, 5), draw: () => { // the truce, over a citizen
      const X = px(ix), Y = py(iy)
      cx.fillStyle = 'rgba(215,222,230,.30)'
      cx.fillRect(X + 4, Y - 6, 24, 40)
      const ph9 = (now / 600) % 1
      cx.strokeStyle = 'rgba(240,244,248,' + (0.5 - ph9 * 0.35) + ')'
      cx.lineWidth = 1.4
      cx.beginPath(); cx.arc(X + 16, Y + 16, 10 + ph9 * 8, 0, 7); cx.stroke()
    } })
    layer.push({ z: Z(iy, 4), draw: () => {
      if (dying) {
        // the fall (spec 6c): the body tips where it fell and fades, and a pale
        // soul lifts away, the 5 ticks the world holds its breath.
        const prog = Math.max(0, Math.min(1, (s.tick + t - deadStart) / 5))
        const fx = px(ix) + 20, fy = py(iy) + 34
        cx.save()
        cx.translate(fx, fy); cx.rotate((facing[pid] ?? 1) * prog * 1.45); cx.translate(-fx, -fy)
        cx.globalAlpha = 1 - prog * 0.75
        drawCitizen(px(ix), py(iy), { now, pid, face: facing[pid] ?? 1, anim: 'idle', tool,
          mine: pid === myId, cape: capeOf(p), helm: !!p.equipment?.head, plate: !!p.equipment?.body,
          starHelm: p.equipment?.head?.item === 'star-helm', starPlate: p.equipment?.body?.item === 'star-plate',
          wepItem: wep, name: '', hp: 1, maxHp: 1 })
        cx.restore()
        cx.globalAlpha = 0.7 * (1 - prog); cx.fillStyle = '#e8e6d2' // the soul
        cx.beginPath(); cx.arc(px(ix) + 20, py(iy) + 8 - prog * 26, 2.5 + prog * 2.5, 0, 7); cx.fill()
        cx.globalAlpha = 1
        return
      }
      if (!awake) cx.globalAlpha = 0.55
      drawCitizen(px(ix), py(iy), {
        now, pid, face: facing[pid] ?? 1, anim, tool, mine: pid === myId,
      exchange: (p.action?.type === 'attack' || p.action?.type === 'attackp')
        && (p.equipment?.weapon?.item === 'old-chain' || (s.tick - (p.action.since ?? 0)) % 2 === 0),
      chain: p.equipment?.weapon?.item === 'old-chain',
      starSword: p.equipment?.weapon?.item === 'star-sword',
      cape: capeOf(p),
      // EVERY BOW IS A BOW. This read `=== 'wooden-bow'`, so a citizen
      // holding a horn-bow, a crossbow, a sigil-bow or the dragonbow was
      // drawn empty-handed and never nocked an arrow. The finest weapon in
      // the world was invisible on the person carrying it.
      bow: RANGED_ITEMS.has(p.equipment?.weapon?.item),
      shooting: RANGED_ITEMS.has(p.equipment?.weapon?.item) && p.action
        && (p.action.type === 'attack' || p.action.type === 'attackp')
        && (() => { const t2 = p.action.mobId ? s.mobs[p.action.mobId] : s.players[p.action.targetId]
          return t2 && Math.abs(p.x - t2.x) + Math.abs(p.y - t2.y) > 1 })(),
      helm: !!p.equipment?.head, plate: !!p.equipment?.body,
      starHelm: p.equipment?.head?.item === 'star-helm',
      starPlate: p.equipment?.body?.item === 'star-plate',
        sword: wep === 'bronze-sword', wepItem: wep, bronzeTool,
        name: (p.name ?? pid.slice(0, 6)) + ' \u00b7 ' + callingOf(p) + ' (' + standingOf(p) + ')',
      hp: p.hp, maxHp: XP_TO_LVL(p.skills.hitpoints),
        hitAt: hitFlash[pid], branded: (p.brandedUntil ?? 0) > s.tick,
      })
      if ((p.rootedUntil ?? 0) > s.tick) rootBind(px(ix), py(iy))
      if ((p.brandedUntil ?? 0) > s.tick) {
        // The Brand (spec 6u): a citizen who struck the unprovoked in the Wilds
        // wears a hot-iron mark. No mechanical weight, the state records it, the
        // window paints it, the rest of us decide what it means.
        const bp = 0.5 + Math.sin(now / 300) * 0.5
        cx.save(); cx.globalAlpha = 0.22 + bp * 0.18 // a red stain at the feet, seen from afar
        cx.fillStyle = '#c0392b'
        cx.beginPath(); cx.ellipse(px(ix) + 20, py(iy) + 34, 12, 4.5, 0, 0, 7); cx.fill()
        cx.restore()
        cx.save(); cx.translate(px(ix) + 20, py(iy) - 9); cx.globalAlpha = 0.85 + bp * 0.15
        cx.fillStyle = '#7a1512'; cx.beginPath(); cx.arc(0, 0, 5, 0, 7); cx.fill()       // the burned seal
        cx.strokeStyle = '#e8452e'; cx.lineWidth = 1.4; cx.lineCap = 'round'             // the mark: a scar
        cx.beginPath(); cx.moveTo(-2.3, -2.3); cx.lineTo(2.3, 2.3); cx.moveTo(2.3, -2.3); cx.lineTo(-2.3, 2.3); cx.stroke()
        cx.strokeStyle = 'rgba(232,69,46,' + (0.35 + bp * 0.4) + ')'; cx.lineWidth = 1    // the heat still rising
        cx.beginPath(); cx.arc(0, 0, 6.5 + bp * 1.6, 0, 7); cx.stroke()
        cx.restore(); cx.globalAlpha = 1
      }
      if (!awake) { // dreaming: a little z drifts up and away
        const zt = (now / 1400 + p.x) % 1
        cx.globalAlpha = 0.8 * (1 - zt)
        cx.fillStyle = '#d9c9a3'
        cx.font = 'bold ' + Math.round(8 + zt * 4) + 'px Verdana'
        cx.textAlign = 'center'
        cx.fillText('z', px(ix) + 26 + zt * 6, py(iy) + 4 - zt * 10)
      }
      cx.globalAlpha = 1
    }})
  }

  drawGoalMarker(s, t)
  layer.sort((a, b) => a.z - b.z)
  for (const item of layer) item.draw()

  // hit splats: the red star of damage, 700ms — and a pale nought for a blow
  // that found nothing, which is the difference between armour working and
  // the world being broken
  // SPLATS THAT ARRIVE TOGETHER MUST NOT SIT ON TOP OF EACH OTHER.
  //
  // Three beasts can set about one citizen, and with the miss nought there
  // are now up to three marks landing on the same tile in the same tick.
  // Drawn at the same point they are one mark, and the citizen sees a single
  // hit where three things happened — which is the same illegibility the
  // arcs and noughts were added to cure.
  //
  // Fanned at draw time rather than at push time, so it works however many
  // arrive and needs nothing remembered.
  {
    const cluster = new Map()
    for (const sp of splats) {
      const k = sp.x + ',' + sp.y
      let c = cluster.get(k); if (!c) { c = []; cluster.set(k, c) }
      c.push(sp)
    }
    for (const c of cluster.values()) {
      c.sort((a, b) => a.at - b.at)
      c.forEach((sp, i) => {
        sp._n = i; sp._of = c.length
      })
    }
  }
  for (let i = splats.length - 1; i >= 0; i--) {
    const sp = splats[i]
    const age = now - sp.at
    if (age > 700) { splats.splice(i, 1); continue }
    // spread them along an arc: one sits centred, several open out, and the
    // order is the order they landed
    const n = sp._n ?? 0, of = sp._of ?? 1
    const spread = of > 1 ? ((n - (of - 1) / 2) * 13) : 0
    const lift = of > 1 ? Math.abs(n - (of - 1) / 2) * 4 : 0
    const SX = px(sp.x) + 20 + spread, SY = py(sp.y) + 18 - lift - age / 90
    cx.globalAlpha = age > 500 ? (700 - age) / 200 : 1
    // a MISS is a pale ring, not a red star: the shape says at a glance
    // whether anything got through, without reading the number
    if (sp.amount === 0) {
      cx.strokeStyle = 'rgba(190,205,220,.75)'; cx.lineWidth = 1.6
      cx.beginPath(); cx.arc(SX, SY, 7, 0, 7); cx.stroke()
      cx.fillStyle = 'rgba(220,232,244,.9)'
      cx.font = 'bold 9px Verdana'; cx.textAlign = 'center'
      cx.fillText('0', SX, SY + 3.2); cx.textAlign = 'left'
      cx.globalAlpha = 1
      continue
    }
    cx.fillStyle = '#a11212'
    cx.beginPath()
    for (let k = 0; k < 8; k++) {
      const r2 = k % 2 ? 5.5 : 9, ang = k * Math.PI / 4 + 0.4
      cx[k ? 'lineTo' : 'moveTo'](SX + Math.cos(ang) * r2, SY + Math.sin(ang) * r2)
    }
    cx.closePath(); cx.fill()
    cx.fillStyle = '#fff'; cx.font = 'bold 9px Verdana'; cx.textAlign = 'center'
    cx.fillText(sp.amount, SX, SY + 3.4)
    cx.globalAlpha = 1
  }

  // rites: brief particle truths
  for (let i = effects.length - 1; i >= 0; i--) {
    const ef = effects[i]
    const life = ef.kind === 'arrowshot' ? 380 : ef.kind === 'click' ? 420 : 800
    const age = now - ef.at
    if (age > life) { effects.splice(i, 1); continue }
    const p2 = age / life
    const EX = px(ef.x) + 20, EY = py(ef.y) + 20
    cx.globalAlpha = 1 - p2
    if (ef.kind === 'click') {
      const CX2 = px(ef.x) + 20, CY2 = py(ef.y) + 20
      const sh = 14 * (1 - p2)
      cx.strokeStyle = ef.act ? 'rgba(232,110,58,.95)' : 'rgba(255,232,58,.9)'
      cx.lineWidth = 2.6
      cx.beginPath()
      for (const [dx2, dy2] of [[-1,-1],[1,-1],[1,1],[-1,1]]) {
        cx.moveTo(CX2 + dx2 * sh, CY2 + dy2 * (sh - 5))
        cx.lineTo(CX2 + dx2 * sh, CY2 + dy2 * sh)
        cx.lineTo(CX2 + dx2 * (sh - 5), CY2 + dy2 * sh)
      }
      cx.stroke()
    } else if (ef.kind === 'bury') {
      cx.fillStyle = '#e8e4d0'
      for (let k = 0; k < 5; k++) cx.fillRect(EX - 10 + k * 5 + Math.sin(p2 * 6 + k) * 2, EY + 8 - p2 * 22 - k * 2, 1.8, 1.8)
    } else if (ef.kind === 'invoke') {
      // three stones remember being one: motes spiral INWARD, then a cold flash
      cx.fillStyle = '#8ce0ff'
      for (let k = 0; k < 8; k++) {
        const ang = k * 0.9 - p2 * 4, r = 20 * (1 - p2)
        cx.globalAlpha = 0.4 + 0.6 * p2
        cx.fillRect(EX + Math.cos(ang) * r - 1, EY - 4 + Math.sin(ang) * r, 2.4, 2.4)
      }
      if (p2 > 0.75) { cx.globalAlpha = (1 - p2) / 0.25; cx.fillStyle = '#dffaff'
        cx.beginPath(); cx.arc(EX, EY - 4, 3 + (p2 - 0.75) * 40, 0, 7); cx.fill() }
      cx.globalAlpha = 1
    } else if (ef.kind === 'mend') {
      // knit whole: a warm GREEN pulse + a plus of light + rising motes ,
      // unmistakable mid-fight, never confused with the cyan of a spell
      cx.globalAlpha = (1 - p2) * 0.9
      cx.strokeStyle = '#5ef08a'; cx.lineWidth = 2.5
      cx.beginPath(); cx.arc(EX, EY - 2, 4 + p2 * 16, 0, 7); cx.stroke()
      cx.fillStyle = '#baffce'; const pl = 5 * (1 - p2)
      cx.fillRect(EX - pl, EY - 3, pl * 2, 2.6); cx.fillRect(EX - 1.3, EY - 3 - pl, 2.6, pl * 2)
      cx.fillStyle = '#7ef29a'
      for (let k = 0; k < 5; k++) { cx.globalAlpha = (1 - p2) * 0.8
        cx.fillRect(EX + ((k * 37) % 20) - 10, EY + 6 - p2 * 26 - k * 2, 2, 2) }
      cx.globalAlpha = 1
    } else if (ef.kind === 'cast') {
      // return to Anchor: expanding rings + a rising column of light
      cx.globalAlpha = 1 - p2
      cx.strokeStyle = '#8ce0ff'; cx.lineWidth = 2
      cx.beginPath(); cx.arc(EX, EY, 6 + p2 * 26, 0, 7); cx.stroke()
      cx.beginPath(); cx.arc(EX, EY, 2 + p2 * 16, 0, 7); cx.stroke()
      cx.fillStyle = 'rgba(140,224,255,' + (0.5 * (1 - p2)) + ')'
      cx.fillRect(EX - 3, EY - 40 * p2, 6, 40 * p2)
      cx.globalAlpha = 1
    } else if (ef.kind === 'arrowshot') {
      const fx2 = px(ef.x) + 20, fy2 = py(ef.y) + 16
      const tx2 = px(ef.tx) + 20, ty2 = py(ef.ty) + 16
      const ax = fx2 + (tx2 - fx2) * p2, ay = fy2 + (ty2 - fy2) * p2
      const ang = Math.atan2(ty2 - fy2, tx2 - fx2)
      cx.save(); cx.translate(ax, ay); cx.rotate(ang)
      cx.strokeStyle = '#8a5a2a'; cx.lineWidth = 1.8
      cx.beginPath(); cx.moveTo(-6, 0); cx.lineTo(4, 0); cx.stroke()
      cx.fillStyle = '#c9c2b2'
      cx.beginPath(); cx.moveTo(6, 0); cx.lineTo(2, -2); cx.lineTo(2, 2); cx.closePath(); cx.fill()
      cx.fillStyle = '#e8e4d0'; cx.fillRect(-7, -1.4, 2.4, 2.8)
      cx.restore()
    } else if (ef.kind === 'fletch') {
      cx.fillStyle = '#c9a86a'
      for (let k = 0; k < 4; k++) cx.fillRect(EX - 6 + k * 4, EY + 2 + p2 * 10 + k, 2.4, 1.6)
    }
    cx.globalAlpha = 1
  }

  // speech bubbles: gold text over heads, RS-style, ~4s
  for (const [pid, b] of Object.entries(bubbles)) {
    if (now - b.at > 4000) { delete bubbles[pid]; continue }
    const p = s.players[pid]; if (!p) continue
    const o = prevState?.players[pid]
    const bx2 = px(o ? lerp(o.x, p.x, t) : p.x) + 20
    const by2 = py(o ? lerp(o.y, p.y, t) : p.y) - 12
    cx.globalAlpha = now - b.at > 3400 ? (4000 - (now - b.at)) / 600 : 1
    cx.fillStyle = '#ffff9c'; cx.font = 'bold 11px Verdana'; cx.textAlign = 'center'
    cx.fillText(b.text, bx2, by2)
    cx.globalAlpha = 1
  }

  // arrows in flight: a bright line that fades as it flies (280ms)
  arrowShots = arrowShots.filter(a2 => now - a2.at < 280)
  for (const a2 of arrowShots) {
    const f2 = (now - a2.at) / 280, f3 = Math.max(0, f2 - 0.22)
    const ax = px(lerp(a2.x0, a2.x1, f2)) + 8, ay = py(lerp(a2.y0, a2.y1, f2)) + 8
    const bx = px(lerp(a2.x0, a2.x1, f3)) + 8, by = py(lerp(a2.y0, a2.y1, f3)) + 8
    cx.strokeStyle = 'rgba(232,228,208,' + (1 - f2 * 0.6) + ')'
    cx.lineWidth = 1.4
    cx.beginPath(); cx.moveTo(bx, by); cx.lineTo(ax, ay); cx.stroke()
  }
  // the stilling's ring: everything else adds motion; this removes it
  stillRings = stillRings.filter(r2 => now - r2.at < 900)
  for (const r2 of stillRings) {
    const f2 = (now - r2.at) / 900
    cx.strokeStyle = 'rgba(235,240,245,' + (0.8 * (1 - f2)) + ')'
    cx.lineWidth = 2 - f2
    cx.beginPath(); cx.arc(px(r2.x) + 16, py(r2.y) + 16, 6 + f2 * 46, 0, 7); cx.stroke()
  }
  // floating xp drops (world coords, so drawn before restore)
  xpDrops = xpDrops.filter(d => now - d.at < 1100)
  for (const d of xpDrops) {
    const age = (now - d.at) / 1100
    cx.globalAlpha = 1 - age
    cx.fillStyle = '#e2b63e'; cx.font = 'bold 11px Verdana'; cx.textAlign = 'center'
    cx.fillText('+' + d.amt + ' xp', px(d.x) + 20, py(d.y) - 6 - age * 16)
    cx.globalAlpha = 1
  }

  cx.restore()

  // level-up: fireworks over your head + a banner, ~2.4s
  if (celebrate && now - celebrate.at < 2400) {
    const age = (now - celebrate.at) / 2400
    const meC = s.players[myId]
    if (meC) {
      const bx = px(meC.x - cam.x) + 20, by = py(meC.y - cam.y) + 6
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2 + i
        const d = age * 26 + (i % 3) * 4
        cx.fillStyle = ['#e2b63e', '#ff6b35', '#fff'][i % 3]
        cx.globalAlpha = 1 - age
        cx.fillRect(bx + Math.cos(a) * d, by + Math.sin(a) * d - age * 14, 2.4, 2.4)
      }
      cx.globalAlpha = 1
    }
    // banner rectangle now drawn on the topmost overlay (drawBanner) so it rides above GL + minimap
  } else if (celebrate && now - celebrate.at >= 2400) celebrate = null

  // ---- clouds: three soft shadows crossing the land, day only ----
  {
    const dayness = 1 - Math.min(1, (((s.tick + t) % DAY) / DAY < 0.5 ? 0 : 1) + 0)
    const cyc0 = dayCyc((((s.tick + t) % DAY) / DAY))
    const bright0 = (Math.sin(cyc0 * Math.PI * 2) + 1) / 2
    if (bright0 > 0.35) {
      const alpha = (bright0 - 0.35) * 0.11
      for (let ci = 0; ci < 3; ci++) {
        const span = (W + 40) * TILE
        const wx = ((now * (0.010 + ci * 0.004) + ci * span / 3) % span) - 20 * TILE
        const wy = ((ci * 37.7) % H) * TILE + Math.sin(now / 9000 + ci) * 60
        const sxp = wx - cam.x * TILE, syp = wy - cam.y * TILE
        if (sxp < -260 || sxp > cv.width + 260 || syp < -260 || syp > cv.height + 260) continue
        const cg = cx.createRadialGradient(sxp, syp, 30, sxp, syp, 200 + ci * 40)
        cg.addColorStop(0, 'rgba(20,30,40,' + alpha + ')')
        cg.addColorStop(1, 'rgba(20,30,40,0)')
        cx.fillStyle = cg; cx.beginPath(); cx.arc(sxp, syp, 200 + ci * 40, 0, 7); cx.fill()
      }
    }
  }

  // ---- day/night: a pure function of the shared tick ----
  const cyc = dayCyc((((s.tick + t) % DAY) / DAY))          // 0 dawn · .25 noon · .5 dusk · .75 midnight
  const brightness = (Math.sin(cyc * Math.PI * 2) + 1) / 2
  const darkness = (1 - brightness) * 0.58
  if (HD) { // the sun writes the shadows: long at the golden hours, gone at noon
    sunDirX = -Math.cos(cyc * Math.PI * 2)
    shadowLen = brightness > 0.45 ? (1 - brightness) * 16 + 1 : 0
  }
  if (GLON) { // gather the world's lights for the shader
    glLights.length = 0
    glNight = darkness / 0.58
    const push = (wx, wy, r, i2, c2) => {
      const u = ((wx - cam.x) * TILE + 20) * ZOOM / cv.width
      const v2 = ((wy - cam.y) * TILE + 16) * ZOOM / cv.height
      if (u < -0.2 || u > 1.2 || v2 < -0.2 || v2 > 1.2 || glLights.length >= 24) return
      glLights.push({ u, v: v2, r, i: i2, c: c2 })
    }
    // lights only matter where the camera is looking: this walked the whole
    // island three times a frame to find the fires in one screenful
    for (const [, n] of nodesNear(s, cam.x - 8, cam.y - 8,
        cam.x + Math.ceil(cv.width / (TILE * ZR)) + 8,
        cam.y + Math.ceil(cv.height / (TILE * ZR)) + 8)) {
      if (n.type === 'watchfire' && n.fuelUntil > s.tick) push(n.x, n.y, 0.62, 0.95 + glNight * 0.6, [1, 0.68, 0.3])
      else if (n.type === 'campfire' || (n.type === 'fire' && n.expiresAt > s.tick)) push(n.x, n.y, 0.26, 0.75 + glNight * 0.5, [1, 0.62, 0.24])
      else if (n.type === 'magic-rock' && n.depletedUntil <= s.tick) push(n.x, n.y, 0.13, 0.4, [0.4, 0.85, 1])
    }
    for (const p of Object.values(s.players)) {
      if (p.equipment?.head?.item === 'star-helm' || p.equipment?.body?.item === 'star-plate' || p.equipment?.weapon?.item === 'star-sword')
        push(p.x, p.y, 0.11, 0.3, [0.55, 0.88, 1])
    }
  }
  const duskiness = Math.max(0, 1 - Math.abs(brightness - 0.42) * 6) // the golden hours
  {
    const rising = Math.cos(cyc * Math.PI * 2) > 0
    glWarm = duskiness * (rising ? 1 : -0.9) // the shader grades the hours
    if (!GLON && duskiness > 0.02) {
      cx.fillStyle = rising
        ? 'rgba(224,140,40,' + (duskiness * 0.15) + ')'
        : 'rgba(120,70,170,' + (duskiness * 0.14) + ')'
      cx.fillRect(0, 0, cv.width / ZR, cv.height / ZR)
    }
  }
  if (darkness > 0.03) {
    // resizing a canvas reallocates it; do that only when the size changed
    if (lightCv.width !== cv.width || lightCv.height !== cv.height) {
      lightCv.width = cv.width; lightCv.height = cv.height
    }
    const L = lightCv.getContext('2d')
    L.globalCompositeOperation = 'source-over'
    L.clearRect(0, 0, cv.width, cv.height)
    L.fillStyle = 'rgba(8,12,38,' + darkness + ')'
    L.fillRect(0, 0, cv.width, cv.height)
    // light holds back the night: one punch pass, destination-out THROUGHOUT.
    // (A reset mid-loop once turned every later fire into painted darkness.)
    L.globalCompositeOperation = 'destination-out'
    // lights only matter where the camera is looking: this walked the whole
    // island three times a frame to find the fires in one screenful
    for (const [, n] of nodesNear(s, cam.x - 8, cam.y - 8,
        cam.x + Math.ceil(cv.width / (TILE * ZR)) + 8,
        cam.y + Math.ceil(cv.height / (TILE * ZR)) + 8)) {
      const isWatch = n.type === 'watchfire' && n.fuelUntil > s.tick
      const isFire = n.type === 'campfire' || n.type === 'fire' || isWatch
      const isGlow = n.type === 'magic-rock' && n.depletedUntil <= s.tick
      if (!isFire && !isGlow) continue
      const fx = px(n.x - cam.x) + 20, fy = py(n.y - cam.y) + (isFire ? 24 : 20)
      if (fx < -120 || fx > cv.width + 120 || fy < -120 || fy > cv.height + 120) continue
      const r = isWatch ? 232 + Math.sin(now / 140 + n.x) * 10 : isFire ? 96 + Math.sin(now / 140 + n.x) * 5 : 42 + Math.sin(now / 600 + n.x) * 4
      const grad = L.createRadialGradient(fx, fy, isFire ? 8 : 4, fx, fy, r)
      grad.addColorStop(0, 'rgba(0,0,0,' + (isFire ? 1 : 0.6) + ')')
      grad.addColorStop(1, 'rgba(0,0,0,0)')
      L.fillStyle = grad; L.beginPath(); L.arc(fx, fy, r, 0, 7); L.fill()
    }
    L.globalCompositeOperation = 'source-over'
    if (!GLON) cx.drawImage(lightCv, 0, 0)
    // colored halos on top of the cut: warm for flame, cool for the stones
    // lights only matter where the camera is looking: this walked the whole
    // island three times a frame to find the fires in one screenful
    for (const [, n] of nodesNear(s, cam.x - 8, cam.y - 8,
        cam.x + Math.ceil(cv.width / (TILE * ZR)) + 8,
        cam.y + Math.ceil(cv.height / (TILE * ZR)) + 8)) {
      const isFire = n.type === 'campfire' || n.type === 'fire'
      const isGlow = n.type === 'magic-rock' && n.depletedUntil <= s.tick
      if (!isFire && !isGlow) continue
      const fx = px(n.x - cam.x) + 20, fy = py(n.y - cam.y) + (isFire ? 24 : 20)
      if (fx < -120 || fx > cv.width + 120 || fy < -120 || fy > cv.height + 120) continue
      const R = isFire ? 60 : 40
      const grad2 = cx.createRadialGradient(fx, fy, 4, fx, fy, R)
      grad2.addColorStop(0, isFire
        ? 'rgba(230,126,34,' + (darkness * 0.3) + ')'
        : 'rgba(120,210,255,' + (darkness * 0.22) + ')')
      grad2.addColorStop(1, isFire ? 'rgba(230,126,34,0)' : 'rgba(120,210,255,0)')
      cx.fillStyle = grad2; cx.beginPath(); cx.arc(fx, fy, R, 0, 7); cx.fill()
    }
  }

  cx.setTransform(1, 0, 0, 1, 0, 0) // the panel world ends; flat space resumes
  if (GLON) glComposite(now)
  drawSunMap(s, now)
  drawTravel(curState ?? world)
  drawBanner(now)

  // soft vignette: the old-monitor glow (built once, reused every frame)
  if (!vignette) {
    vignette = cx.createRadialGradient(cv.width/2, cv.height/2, cv.height*0.55, cv.width/2, cv.height/2, cv.height*1.05)
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(10,14,6,.34)')
  }
  if (!GLON) { cx.fillStyle = vignette; cx.fillRect(0, 0, cv.width / ZR, cv.height / ZR) }

  const phase = cyc < 0.06 ? 'dawn' : cyc < 0.44 ? 'day' : cyc < 0.56 ? 'dusk'
              : cyc < 0.94 ? 'night' : 'dawn'
  cx.fillStyle = 'rgba(217,201,163,.75)'; cx.font = '10px Verdana'; cx.textAlign = 'left'
  cx.fillText('world ' + curWorldId.slice(0, 12) + '\u2026' + '  \u00b7  tick ' + s.tick + '  \u00b7  ' + phase + '  \u00b7  ' + BUILD + meterText, 6, cv.height - 6)
}
requestAnimationFrame(function frame(now) {
  if (document.hidden) { requestAnimationFrame(frame); return }
  if (lastFrameAt) worstFrame = Math.max(worstFrame, now - lastFrameAt)
  lastFrameAt = now
  if (now - meterAt > 2000) { // meter: worst frame gap + broadcast jitter, 2s window
    meterText = '  \u00b7  frame ' + Math.round(worstFrame) + 'ms  \u00b7  jit \u00b1' + Math.round(worstJitter) + 'ms'
    worstFrame = 0; worstJitter = 0; meterAt = now
  } drawScene(now); requestAnimationFrame(frame) })

let panelSig = ''
function panel(s) {
  const me = s.players[myId]; if (!me) return
  // walking changes nothing here; rebuilding anyway stole frames
  // 'is a counter beside me' walked the whole island, sixty times a second
  const nearStoreSig = nodesNear(s, me.x - 2, me.y - 2, me.x + 2, me.y + 2)
    .some(([, n]) => n.type === 'store' && Math.abs(me.x - n.x) + Math.abs(me.y - n.y) === 1)
  const sig = JSON.stringify([me.hp, me.name, me.skills, me.inventory, me.equipment, me.gold, nearStoreSig,
    me.bank, me.trade,
    Object.values(s.players).filter(p => p.trade?.to === myId).map(p => [p.trade, p.name])])
  if (sig === panelSig) return
  panelSig = sig
  document.getElementById('whoami').textContent = me.name ?? '(unnamed)'
  const maxHp = XP_TO_LVL(me.skills.hitpoints)
  document.getElementById('hpfill').style.width = (100 * me.hp / maxHp) + '%'
  document.getElementById('hptext').textContent = 'HP ' + me.hp + ' / ' + maxHp
  const trainingNode = me.action?.nodeId ? s.nodes[me.action.nodeId] : null
  const training = me.action?.type === 'attack' ? 'attack'
    : trainingNode ? SKILL_OF_NODE[trainingNode.type] : null
  document.getElementById('skills').innerHTML = Object.entries(me.skills)
    .map(([k, xp]) => {
      const lvl = XP_TO_LVL(xp)
      const pct = lvl >= 99 ? 100
        : Math.floor(100 * (xp - XP_TABLE[lvl]) / (XP_TABLE[lvl + 1] - XP_TABLE[lvl]))
      const hot = k === training
      return '<div' + (hot ? ' style="outline:1px solid var(--gold)"' : '') + '>'
        + '<svg class="skico" width="20" height="20" viewBox="0 0 10 10"><use href="#sk-' + k + '"/></svg>'
        + '<span class="skname">' + k + '</span><b style="' + (lvl >= 99 ? 'color:#e2b63e;text-shadow:0 0 6px rgba(226,182,62,.5)' : '') + '">' + lvl + '</b>'
        + '<div style="height:3px;background:#1c1710;margin-top:3px">'
        + '<div style="height:3px;width:' + pct + '%;background:' + (hot ? '#e2b63e' : '#8a7a4a') + '"></div></div></div>'
    }).join('')
  // Only rewrite the inventory DOM when it actually changes. It used to be
  // rebuilt every animation frame (~60/s), which destroyed the slot elements
  // between a tap's press and release so the click event almost never fired.
  const invSig = me.inventory.slice(0, 28).map(it => it ? it.item + 'x' + (it.qty || 1) : '-').join(',')
  if (invSig !== _invSig) {
    _invSig = invSig
    document.getElementById('inv').innerHTML = me.inventory.slice(0, 28)
    .map((it, i) => '<div class="slot" data-i="' + i + '" title="' + (it ? it.item : '') + '">'
      + (it ? (ICONS[it.item] ?? '?')
        + (it.qty > 1 ? '<div style="position:absolute;bottom:1px;right:2.4px;font-size:8px;color:#ffe08a">' + it.qty + '</div>' : '')
        + '<div style="position:absolute;top:1.4px;left:2.4px;right:1px;font-size:6.4px;color:#9a8c6a;line-height:1;overflow:hidden;white-space:nowrap;text-align:left">' + it.item.replace(/-/g, ' ') + '</div>'
        : '')
      + '</div>').join('')
  }
  // trade offers: incoming (accept) and outgoing (cancel)
  const offers = []
  for (const [pid, p] of Object.entries(s.players)) {
    if (pid === myId || p.trade?.to !== myId) continue
    // the engine stores giveSlotS: an ARRAY. This read `giveSlot`, singular,
    // which is undefined -- so inventory[undefined] was undefined and every
    // incoming offer hit the `continue` below and vanished. The offer landed
    // in the world correctly the whole time; nobody was ever shown it.
    const gslots = p.trade.giveSlots ?? (p.trade.giveSlot != null ? [p.trade.giveSlot] : [])
    const giveNames = gslots.map(i => p.inventory[i]?.item).filter(Boolean)
    if (!giveNames.length) continue
    const giveItem = giveNames.join(' + ')
    const haveWant = me.inventory.some(sl => sl && sl.item === p.trade.wantItem)
    offers.push('<div class="stone" style="padding:5px 7px;margin-top:4px">'
      + '<b style="color:var(--gold)">' + (p.name ?? pid.slice(0, 6)) + '</b> offers '
      + giveItem.replace('-', ' ') + ' for your ' + p.trade.wantItem.replace('-', ' ') + ' '
      + (haveWant ? '<button data-accept="' + pid + '">accept</button>'
                  : '<span style="color:var(--dim)">(you have none)</span>')
      + '</div>')
  }
  if (me.trade) {
    const _gs = me.trade.giveSlots ?? (me.trade.giveSlot != null ? [me.trade.giveSlot] : [])
    const gi = _gs.map(i => me.inventory[i]?.item).filter(Boolean).join(' + ') || '?'
    offers.push('<div style="padding:4px 7px;margin-top:4px;background:var(--stone-dk)">your offer: '
      + gi.replace('-', ' ') + ' for ' + me.trade.wantItem.replace('-', ' ')
      + ' <button data-cancel="1">cancel</button></div>')
  }
  document.getElementById('offers').innerHTML = offers.join('')

  // the vault: visible while standing at a bank
  const vaultEl = document.getElementById('vault')
  const atBank = nodesNear(s, me.x - 2, me.y - 2, me.x + 2, me.y + 2).some(([, n]) => n.type === 'bank'
    && Math.abs(me.x - n.x) + Math.abs(me.y - n.y) === 1)
  const vaulted = Object.entries(me.bank ?? {})
  if (atBank) {
    vaultEl.style.display = 'block'
    vaultEl.innerHTML = '<b style="color:var(--gold)">Your vault</b> <span style="color:var(--dim)">(tap inventory to deposit)</span><br>'
      + (vaulted.length
        ? vaulted.map(([item, q]) => '<button data-wd="' + item + '" style="margin:3px 3px 0 0">'
            + (ICONS[item] ?? '') + ' ' + item.replace('-', ' ') + ' \u00d7' + q + '</button>').join('')
        : '<span style="color:var(--dim)">empty. Your fortune starts here</span>')
  } else vaultEl.style.display = 'none'

  const wep = me.equipment?.weapon
  let gearLine = wep
    ? 'Weapon: ' + (ICONS[wep.item] ?? '') + ' ' + wep.item.replace('-', ' ') + ' <span style="color:var(--dim)">(tap to sheathe)</span>'
    : 'Weapon: <span style="color:var(--dim)">bare hands</span>'
  const hd = me.equipment.head, bd = me.equipment.body
  if (hd || bd) gearLine += '<br>' + [hd && ('Head: ' + hd.item.replace(/-/g, ' ')),
    bd && ('Body: ' + bd.item.replace(/-/g, ' '))].filter(Boolean).join(' \u00b7 ')
  document.getElementById('equip').innerHTML = gearLine
    + '<br>Gold: <b style="color:#e2b63e">' + (me.gold ?? 0) + '</b> ' + ICONS['gold-coin']
  const PRICES_C = PRICES // the constitutional ledger, not a copy of part of it
  const nearStore = Object.values(s.nodes).some(n => n.type === 'store' && Math.abs(me.x - n.x) + Math.abs(me.y - n.y) === 1)
  const sellBar = document.getElementById('sellbar') ?? (() => {
    const d = document.createElement('div'); d.id = 'sellbar'
    document.getElementById('inv').parentNode.insertBefore(d, document.getElementById('inv'))
    return d
  })()
  sellBar.innerHTML = !nearStore ? '' :
    '<div style="color:var(--gold);font-size:11px;margin:4px 0 2px">THE KEEPER BUYS:</div>'
    + me.inventory.map((sl, i) => sl && PRICES_C[sl.item]
      ? '<button data-sell="' + i + '" style="margin:1px;background:#3a3126;color:#e8d9a0;border:1px solid #6e5433;padding:3px 6px;font-family:inherit;font-size:10px;cursor:pointer">'
        + sl.item.replace(/-/g, ' ') + (sl.qty > 1 ? ' \u00d7' + sl.qty : '') + ' \u2192 ' + (PRICES_C[sl.item] * (sl.qty ?? 1)) + 'g</button>'
      : '').join('')
  // and what the keeper SELLS. The flat window could take your goods but never
  // hand anything back, so a citizen at a store could not buy here at all.
  // The stock is the constitution's, not a guess: the world sells seeds and
  // nothing else, because everything else is meant to be made or found.
  if (nearStore) {
    // the keeper's SHELF (v0.74) finally reaches this window: what
    // citizens sold and nobody carried off is for sale beside the
    // keeper's own seeds, priced by the constitution's ask
    const storeN = Object.values(world.nodes).find(n => n.type === 'store'
      && Math.abs(me.x - n.x) + Math.abs(me.y - n.y) === 1)
    const ask = (it2) => (PRICES[it2] ?? 1) + Math.max(1, Math.floor((PRICES[it2] ?? 1) / 10))
    const wares = { ...STORE_SELLS }
    for (const [it2, q2] of Object.entries(storeN?.shelf ?? {}))
      if (q2 > 0 && !(it2 in wares)) wares[it2] = ask(it2)
    sellBar.innerHTML += '<div style="color:var(--gold);font-size:11px;margin:6px 0 2px">AND SELLS:</div>'
      + Object.entries(wares).map(([it, pr]) => '<button data-buy="' + it + '" style="margin:1px;'
        + 'background:#3a3126;color:#e8d9a0;border:1px solid #6e5433;padding:3px 6px;font-family:inherit;'
        + 'font-size:10px;cursor:pointer' + ((me.gold ?? 0) < pr ? ';opacity:.4' : '') + '">'
        + it.replace(/-/g, ' ') + ' \u2190 ' + pr + 'g'
        + (storeN?.shelf?.[it] ? ' (\u00d7' + storeN.shelf[it] + ')' : '') + '</button>').join('')
  }
  sellBar.onclick = (e) => {
    const i = e.target?.dataset?.sell
    if (i !== undefined) { send({ do: 'sell', slot: +i }); feed('The keeper counts out your coin.') }
    const b = e.target?.dataset?.buy
    if (b !== undefined) {
      const askB = STORE_SELLS[b] ?? ((PRICES[b] ?? 1) + Math.max(1, Math.floor((PRICES[b] ?? 1) / 10)))
      if ((me.gold ?? 0) < askB) { feed('Not enough coin for that.'); return }
      send({ do: 'buy', item: b }); feed(kFromId(Object.entries(world.nodes).find(([, n2]) => n2.type === 'store' && Math.abs(me.x - n2.x) + Math.abs(me.y - n2.y) === 1)?.[0]) + ' slides it across.')
    }
  }
  document.getElementById('status').textContent =
    me.action ? 'busy: ' + me.action.type : 'idle: click the world'
}

document.getElementById('equip').addEventListener('click', () => {
  if (world?.players[myId]?.equipment?.weapon) { send({ do: 'unwield' }); feed('You sheathe your weapon.') }
})

function openTrade(pid) {
  const me = world?.players[myId], them = world?.players[pid]
  if (!me || !them) return
  const mine = me.inventory.map((sl, i) => sl ? { i, item: sl.item } : null).filter(Boolean)
  if (!mine.length) { feed('You have nothing to offer.'); return }
  const theirs = [...new Set(them.inventory.filter(Boolean).map(sl => sl.item))]
  if (!theirs.length) { feed((them.name ?? 'They') + ' carries nothing you could ask for.'); return }
  const box = document.getElementById('trade')
  box.style.display = 'block'
  box.innerHTML = '<b style="color:var(--gold)">Trade with ' + (them.name ?? pid.slice(0, 6)) + '</b><br>'

      Ca[i*3] = l.c[0]; Ca[i*3+1] = l.c[1]; Ca[i*3+2] = l.c[2]
    }
    gl.uniform1f(glU.T, now / 1000); gl.uniform1f(glU.N, glNight); gl.uniform1f(glU.W2, glWarm)
    gl.uniform2f(glU.R, glCv.width, glCv.height)
    gl.uniform2f(glU.CAM, (cam?.x ?? 0) * TILE * ZOOM, (cam?.y ?? 0) * TILE * ZOOM)
    gl.uniform4fv(glU.L, La); gl.uniform3fv(glU.C, Ca)
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
  } catch (e) { GLON = false; glCv.style.display = 'none' }
}

function fadeMusicOut(ms) { // the theme belongs to the DOOR: it bows out at the threshold
  const a = MUSIC; if (!a) return
  MUSIC = null // released now, so nothing restarts it
  const v0 = a.volume, t0 = performance.now()
  const step = () => {
    const k = 1 - (performance.now() - t0) / ms
    if (k <= 0) { a.pause(); return }
    a.volume = v0 * k; requestAnimationFrame(step)
  }
  step()
}

document.getElementById('say').addEventListener('keydown', (e) => {
  e.stopPropagation() // while typing, the world hears nothing
  if (e.key === 'Escape') { e.target.blur(); return }
  if (e.key !== 'Enter') return
  // Enter must do NOTHING but speak. Without this the browser is still free
  // to act on the key afterwards, and what it does is scroll the page to
  // wherever it thinks the focus ought to be -- which yanks the world out
  // from under you every time you finish a sentence.
  e.preventDefault()
  const t = e.target.value.trim()
  if (t) send({ do: 'chat', text: t })
  e.target.value = ''
  e.target.blur() // hands back to the world, so the next keystroke is speech again
})

// ---- speak without stopping ----
// You should not have to put down what you are doing and find a box with the
// mouse in order to say something. This window walks by tapping, so no letter
// is spoken for by movement: begin typing and you are simply talking. Enter
// opens an empty line, Escape steps back out.
document.addEventListener('keydown', (e) => {
  // the view opens and closes. Bracket keys, because +/- belong to chat.
  if (!e.metaKey && !e.ctrlKey && !e.altKey && document.activeElement?.tagName !== 'INPUT') {
    if (e.key === ']') { setZoom(zoomIx - 1); e.preventDefault(); return }
    if (e.key === '[') { setZoom(zoomIx + 1); e.preventDefault(); return }
  }
  const say = document.getElementById('say')
  if (!say || say.offsetParent === null) return          // not in the world yet
  const el = document.activeElement
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return
  if (e.ctrlKey || e.metaKey || e.altKey) return         // leave shortcuts alone
  // focus() SCROLLS the element into view -- that is its documented
  // behaviour, and with the box at the foot of a tall page it drags the
  // whole window down. preventScroll gives the box the caret and leaves the
  // view exactly where the citizen put it.
  if (e.key === 'Enter') { e.preventDefault(); say.focus({ preventScroll: true }); return }
  if (e.key === 'Escape') { say.value = ''; say.blur(); return }
  if (e.key.length !== 1) return                         // not a printable key
  e.preventDefault()
  say.focus({ preventScroll: true })
  if (say.value.length < say.maxLength) say.value += e.key
})

    if (lvl('magic') >= 20) opts.push({ label: 'cast: mend (heal)', act: () => {

    } })
    opts.push({ label: 'cast: return to Anchor', act: () => {

  if (it.item === 'arrows') {

cv.addEventListener('click', (e) => {
  if (!world) return
  const r = cv.getBoundingClientRect()
  // raw canvas pixels first: the minimap is drawn in them, the world is not
  const px = (e.clientX - r.left) * (cv.width / r.width)
  const py = (e.clientY - r.top) * (cv.height / r.height)
  // THE MINIMAP IS A CONTROL NOW. Click the far side of the island and the
  // citizen sets off, with the mark to steer by. This has to be tested
  // BEFORE the world hit-test or a tap on the chart would swing an axe at
  // whatever happened to be under it in the viewport.
  if (miniRect) {
    const { mx, my, MW, MH } = miniRect
    if (px >= mx - 2 && px <= mx + MW + 2 && py >= my - 2 && py <= my + MH + 2) {
      const wx = Math.max(1, Math.min(W - 2, Math.round((px - mx) * W / MW)))
      const wy = Math.max(1, Math.min(H - 2, Math.round((py - my) * H / MH)))
      const meM = world.players[myId]
      if (meM) {
        travelMark = { x: wx, y: wy }
        intent = { kind: 'walk', x: wx, y: wy }
        const d = Math.round(Math.hypot(wx - meM.x, wy - meM.y))
        const where = (typeof localeAt4 === 'function' && IS_EXPANSE4())
          ? (localeAt4(wx, wy) ?? '') : ''
        feed('Setting out' + (where ? ' for ' + where : '') + ' \u2014 about '
          + (d * 0.6 / 60).toFixed(1) + ' minutes\u2019 walk.')
      }
      return
    }
  }
  const sx = px / ZR, sy = py / ZR
  const x = Math.floor(sx / TILE + cam.x), y = Math.floor(sy / TILE + cam.y)
  if (x < 0 || x >= W || y < 0 || y >= H) return
  const me = world.players[myId]; if (!me) return
  const adj = (o) => Math.abs(me.x - o.x) + Math.abs(me.y - o.y) === 1

  // a new order interrupts the old work by REPLACING it: the engine
  // honors the latest input natively. (An explicit stop sent alongside
  // the new action once tripped the one-input-per-tick rule: both
  // dropped, and the citizen froze mid-swing, deaf to all clicks.)
  pendingLight = null
  // hit-test against RENDERED positions: a goblin mid-stride is clickable
  // where its body is, not where the grid will say it is in 300ms
  const fxT = sx / TILE + cam.x, fyT = sy / TILE + cam.y
  const tc = renderT(performance.now())
  const lp = (a, b) => a + (b - a) * tc
  let best = null
  for (const [id, m] of Object.entries(world.mobs)) {
    if (m.hp <= 0) continue
    const o = prevState?.mobs?.[id]
    const ix = o ? lp(o.x, m.x) : m.x, iy = o ? lp(o.y, m.y) : m.y
    const d = Math.hypot(ix + 0.5 - fxT, iy + 0.5 - fyT)
    if (d < 0.8 && (!best || d < best.d)) best = { d, kind: 'mob', id, m }
  }
  for (const [pid, p] of Object.entries(world.players)) {
    if (pid === myId) continue
    const o = prevState?.players?.[pid]
    const ix = o ? lp(o.x, p.x) : p.x, iy = o ? lp(o.y, p.y) : p.y
    const d = Math.hypot(ix + 0.5 - fxT, iy + 0.5 - fyT)
    if (d < 0.8 && (!best || d < best.d)) best = { d, kind: 'citizen', id: pid, p }
  }
  if (window.__stillArm && best && (best.kind === 'mob' || best.kind === 'citizen')) {
    window.__stillArm = false
    const tid = best.id
    const tx = best.kind === 'mob' ? best.m.x : best.p.x, ty = best.kind === 'mob' ? best.m.y : best.p.y
    if (Math.max(Math.abs(me.x - tx), Math.abs(me.y - ty)) > 6) { feed('Too far. The stilling reaches six tiles.'); return }
    send({ do: 'still', target: tid })
    feed('You speak the truce. The fight simply stops , for them, and for you.')
    stillRings.push({ x: tx, y: ty, at: performance.now() })
    tone(220, 0.5, { type: 'sine', vol: 0.05 }); tone(110, 0.8, { type: 'sine', vol: 0.04, at: 0.15 }) // a bell, descending into quiet
    flashClick(tx, ty, false)
    return
  }
  if (best?.kind === 'mob') {
    const { id, m } = best
    flashClick(m.x, m.y, true)
    if (me.action?.mobId === id) return                        // already fighting it: silent
    if (adj(m)) { send({ do: 'attack', mobId: id }); feed('You attack the ' + m.type + '!') }
    else intent = { kind: 'attack', id }                       // hunt it down, then engage
    return

  if (best?.kind === 'citizen') {

          else { intent = { kind: 'pvpattack', id: pid }; feed('You go for ' + nm + '. The Wilds allow it.') }
        } },

    else { intent = { kind: 'meet', id: pid }; feed('You approach ' + (p.name ?? 'the stranger') + '.') }

        const opts = []
        if (gi !== -1) opts.push({ label: 'brew ale (grain)', act: () => { send({ do: 'brew', nodeId: id, slot: gi }); feed('You set grain to ferment. Ale, in time.') } })
        if (fi !== -1) opts.push({ label: 'brew broth (fish)', act: () => { send({ do: 'brew', nodeId: id, slot: fi }); feed('You set fish to steep. Broth, in time.') } })
        opts.push({ label: 'dismantle brewpot', act: () => { send({ do: 'dismantle', nodeId: id }); feed('You take the brewpot apart, recovering some of its makings.') } })
        opts.push({ label: 'never mind', act: () => {} }); chooseAction(opts); return
      }
      if (n.type === 'house') {
        if (!adj(n)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }; feed('You approach the house.'); return }
        const bc = world?.genesis?.brew
        const owned = Object.values(world.nodes).filter(nn => nn.type === 'brewpot' && nn.by === myId).length
        const logs = me.inventory.filter(s => s?.item === 'logs').length, ore = me.inventory.filter(s => s?.item === 'ore').length
        if (bc && owned < bc.potCap && logs >= bc.buildLogs && ore >= bc.buildOre) {
          chooseAction([
            { label: 'build brewpot (' + bc.buildLogs + ' logs, ' + bc.buildOre + ' ore)', act: () => { send({ do: 'build_brewpot' }); feed('You raise a brewpot by the house. A brewhouse begins.') } },
            { label: 'never mind', act: () => {} },
          ]); return
        }
        feed(bc && owned >= bc.potCap ? 'You already run ' + bc.potCap + ' brewpots.' : 'A brewpot needs ' + (bc?.buildLogs ?? 4) + ' logs and ' + (bc?.buildOre ?? 2) + ' ore, raised beside a house.')
        return
      }
      if (n.type === 'keeper') {
        if (id === 'kpr-wizard-oberon') {
          // His teaching stands among the stones now, in the world, where the
          // hash covers it and every window reads the same words. It used to
          // live here and only here -- one HTML file's JavaScript, cycling on
          // click -- which meant it was never part of the founding at all.
          // The last thing he says is about exactly that.
          feed('Oberon looks at you, and then at the stones.')
          flashClick(n.x, n.y, false)
          return
        }
        // the world names them now; the window only reads
        const nm9 = n.name ?? kFromId(id)
        feed(nm9 + ': ' + ['\u201cFine day for it.\u201d', '\u201cMind the step.\u201d',
          '\u201cBeen here since the founding, and I\u2019ll be here after you.\u201d'][tileHash(n.x, n.y, 3) % 3])
        flashClick(n.x, n.y, false)
        return
      }
      if (n.type === 'landmark' && n.kind === 'tally-half') {
        feed(n.founderKey
          ? 'Half of the first tally. Its other half stands in Anchor\u2019s plaza, near where souls arrive, and each proves the other. Along the grain, the founder\u2019s whole key, cut small: ' + n.founderKey + '.'
          : 'Half of the first tally. Its other half stands across the water, on Shrine Isle, and each proves the other.')
        flashClick(n.x, n.y, false)
        return
      }
      if (n.type === 'landmark') {
        // landmarks answer with their STORY, never their materials
        feed({ 'elder-tree': 'The Elder Tree. It was here before the roads, and the roads bent around it.',
               'old-oak': 'The Old Oak. Its children feed the axe; the Oak itself is forever.',
               'standing-stone': 'A standing stone. Nobody remembers who raised them, and nobody dares quarry them.',
               'broken-tower': 'The Ruined Tower. Whoever kept watch here kept it long before the towns.',
               'sentinel': 'The Sentinel. Miners swear it moves when nobody climbs.',
               'drowned-bell': 'The Drowned Bell. Nobody remembers the town it called to prayer. On some mornings, the mud still rings.',
               'shipwreck': 'A wreck, broken on the shore. Somewhere there is a sea worth sailing, and this ship sailed it.' }[n.kind]
          ?? 'It stands. It has always stood.')
        flashClick(n.x, n.y, false)
        return
      }
      if (!me.inventory.some(sl => sl === null)) {
        feed('Your pack is full: bank it, drop it, or use it.')
        return
      }
      const msg = { 'tree': 'You swing your axe at the tree.',
                    'rock': 'You take a swing at the rock.',
                    'fishing-spot': 'You cast your line\u2026' }[n.type] ?? 'You begin gathering.'
      flashClick(n.x, n.y, true)
      if (adj(n)) { send({ do: 'gather', nodeId: id }); feed(msg) }
      else intent = { kind: 'gather', id, msg }                // one click does it all
      return
    }

  if (blockedAt(world, x, y)) return
  flashClick(x, y, false)
  intent = { kind: 'walk', x, y }
  if (me.action) send({ do: 'stop' })
})
</script>
