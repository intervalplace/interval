        cx.fillStyle = cg; cx.beginPath(); cx.arc(sxp, syp, 200 + ci * 40, 0, 7); cx.fill()
      }
    }
  }

  // ---- day/night: a pure function of the shared tick ----
  const cyc = dayCyc((((s.tick + t) % DAY) / DAY))          // 0 dawn · .25 noon · .5 dusk · .75 midnight
  const brightness = (Math.sin(cyc * Math.PI * 2) + 1) / 2
  const darkness = (1 - brightness) * 0.58
  if (HD) { // the sun writes the shadows: long at the golden hours, gone at noon
    sunDirX = -Math.cos(cyc * Math.PI * 2)
    shadowLen = brightness > 0.45 ? (1 - brightness) * 16 + 1 : 0
  }
  if (GLON) { // gather the world's lights for the shader
    glLights.length = 0
    glNight = darkness / 0.58
    const push = (wx, wy, r, i2, c2) => {
      const u = ((wx - cam.x) * TILE + 20) * ZOOM / cv.width
      const v2 = ((wy - cam.y) * TILE + 16) * ZOOM / cv.height
      if (u < -0.2 || u > 1.2 || v2 < -0.2 || v2 > 1.2 || glLights.length >= 24) return
      glLights.push({ u, v: v2, r, i: i2, c: c2 })
    }
    // lights only matter where the camera is looking: this walked the whole
    // island three times a frame to find the fires in one screenful
    for (const [, n] of nodesNear(s, cam.x - 8, cam.y - 8,
        cam.x + Math.ceil(cv.width / (TILE * ZR)) + 8,
        cam.y + Math.ceil(cv.height / (TILE * ZR)) + 8)) {
      if (n.type === 'watchfire' && n.fuelUntil > s.tick) push(n.x, n.y, 0.62, 0.95 + glNight * 0.6, [1, 0.68, 0.3])
      else if (n.type === 'campfire' || (n.type === 'fire' && n.expiresAt > s.tick)) push(n.x, n.y, 0.26, 0.75 + glNight * 0.5, [1, 0.62, 0.24])
      else if (famOf(n.type) === 'magic-rock' && n.depletedUntil <= s.tick) push(n.x, n.y, 0.13, 0.4, [0.4, 0.85, 1])
    }
    for (const p of Object.values(s.players)) {
      if (p.equipment?.head?.item === 'star-helm' || p.equipment?.body?.item === 'star-plate' || p.equipment?.weapon?.item === 'star-sword')
        push(p.x, p.y, 0.11, 0.3, [0.55, 0.88, 1])
    }
  }
  const duskiness = Math.max(0, 1 - Math.abs(brightness - 0.42) * 6) // the golden hours
  {
    const rising = Math.cos(cyc * Math.PI * 2) > 0
    glWarm = duskiness * (rising ? 1 : -0.9) // the shader grades the hours
    if (!GLON && duskiness > 0.02) {
      cx.fillStyle = rising
        ? 'rgba(224,140,40,' + (duskiness * 0.15) + ')'
        : 'rgba(120,70,170,' + (duskiness * 0.14) + ')'
      cx.fillRect(0, 0, cv.width / ZR, cv.height / ZR)
    }
  }
  if (darkness > 0.03) {
    // resizing a canvas reallocates it; do that only when the size changed
    if (lightCv.width !== cv.width || lightCv.height !== cv.height) {
      lightCv.width = cv.width; lightCv.height = cv.height
    }
    const L = lightCv.getContext('2d')
    L.globalCompositeOperation = 'source-over'
    L.clearRect(0, 0, cv.width, cv.height)

    sellBar.innerHTML += '<div style="color:var(--gold);font-size:11px;margin:6px 0 2px">YOUR STALL: '
      + (good ? qty + ' \u00d7 ' + good.replace(/-/g, ' ') : 'empty')
      + (mk.ask > 0 ? ' at ' + mk.ask + 'g' : ' \u2014 UNPRICED, nothing sells')
      + ' \u00b7 taken ' + (mk.coin ?? 0) + 'g</div>'
      + (canPut ? '<button data-stallput="1" style="' + BTN + '">put something on it</button>' : '')
      + '<button data-stallask="-10" style="' + BTN + '">price -10</button>'
      + '<button data-stallask="-1" style="' + BTN + '">-1</button>'
      + '<button data-stallask="1" style="' + BTN + '">+1</button>'
      + '<button data-stallask="10" style="' + BTN + '">+10</button>'
      + '<button data-stalltake="1" style="' + BTN + '">take ' + (mk.coin ?? 0) + 'g</button>'
      + '<button data-stalldown="1" style="' + BTN + '">pull it down</button>'
  }
  const stallN = Object.values(s.nodes).find(n => n.type === 'stall'
    && Math.abs(me.x - n.x) + Math.abs(me.y - n.y) === 1)
  if (stallN) {
    const stock = STALL_SELLS[stallN.kind] ?? {}
    const who = STALL_NAME[stallN.kind] ?? 'the trader'
    sellBar.innerHTML += '<div style="color:var(--gold);font-size:11px;margin:6px 0 2px">'
      + who.toUpperCase() + ' SELLS:</div>'
      + Object.entries(stock).map(([it, pr]) => '<button data-buy="' + it + '" style="margin:1px;'
        + 'background:#3a3126;color:#e8d9a0;border:1px solid #6e5433;padding:3px 6px;font-family:inherit;'
        + 'font-size:10px;cursor:pointer' + ((me.gold ?? 0) < pr ? ';opacity:.4' : '') + '">'
        + it.replace(/-/g, ' ') + ' \u2190 ' + pr + 'g</button>').join('')
  }
  // §6l: the keeper's shelf pane is repealed with the shelf. What is bought
  // from now is a STALL, above, and a citizen's own stall.
  sellBar.onclick = (e) => {
    // §6al: the citizen's own stall
    const mkE = Object.entries(world.nodes).find(([, n]) => n.type === 'market' && n.by === myId
      && Math.abs(me.x - n.x) + Math.abs(me.y - n.y) <= 1)
    if (e.target?.dataset?.stallput !== undefined && mkE) {
      const good0 = mkE[1].shelf ? Object.keys(mkE[1].shelf)[0] : null
      const slot = (me.inventory ?? []).findIndex(sl => sl && sl.item !== 'dragonbow'
        && (!good0 || sl.item === good0))
      if (slot === -1) { feed('Nothing in your pack belongs on that shelf.'); return }
      send({ do: 'stock_market', slot })
      feed('You set it on the shelf. It can only leave by being sold.')
      return
    }
    const dAsk = e.target?.dataset?.stallask
    if (dAsk !== undefined && mkE) {
      askDraft = Math.max(0, (mkE[1].ask ?? 0) + (+dAsk))
      send({ do: 'price_market', ask: askDraft })
      feed('You ask ' + askDraft + ' gold.')
      return
    }
    if (e.target?.dataset?.stalltake !== undefined && mkE) {
      send({ do: 'take_market' }); feed('You take the takings.'); return
    }
    if (e.target?.dataset?.stalldown !== undefined && mkE) {
      send({ do: 'dismantle_market' })
      feed('You pull the stall down. What was on it lies in the grass.')
      return
    }
    // §11b: the counter
    if (e.target?.dataset?.consign !== undefined) {
      const slots = (me.inventory ?? []).map((sl, k) => sl ? k : -1).filter((k) => k >= 0)
      if (!slots.length) { feed('Nothing in your pack to consign.'); return }
      send({ do: 'consign', slots })
      feed('Sealed. The road is committed \u2014 and so are you.')
      return
    }
    if (e.target?.dataset?.release !== undefined) {
      // §11b: releasing forfeits the DRAWN ROUTE, not just the load -- the next
      // consignment draws a new one. A button that reads like putting a bag
      // down should not quietly undo an hour of walking.
      if (!_releaseArmed) {
        _releaseArmed = true
        feed('That forfeits the route you have walked \u2014 the next consignment draws a new one. '
          + 'Tap again to set it down.')
        setTimeout(() => { _releaseArmed = false }, 6000)
        return
      }
      _releaseArmed = false
      send({ do: 'release' }); feed('You set the container down. Your hands are your own again.'); return
    }
    const dv = e.target?.dataset?.deliver
    if (dv !== undefined) {
      send({ do: 'deliver', slot: +dv })
      feed('Discharged. The goods are off your hands and the road is paid for.')
      return
    }
    const b = e.target?.dataset?.buy
    if (b !== undefined) {
      // §6l: a stall's price is its own, and a stall is the only counter that
      // sells anything now
      const stallB = Object.values(world.nodes).find(n => n.type === 'stall'
        && Math.abs(me.x - n.x) + Math.abs(me.y - n.y) === 1)
      const askB = stallB ? (STALL_SELLS[stallB.kind] ?? {})[b] : undefined
      if (askB === undefined) { feed('Nobody here sells that.'); return }
      if ((me.gold ?? 0) < askB) { feed('Not enough coin for that.'); return }
      send({ do: 'buy', item: b })
      feed((STALL_NAME[stallB.kind] ?? 'the trader') + ' slides it across.')
    }
  }
  // §11c: THE ROAD, WHEREVER YOU ARE. A hauler needs this on the road, not at
  // the counter they have already left, so it stands under the skills.
  const hb = document.getElementById('haulbar') ?? (() => {
    const d = document.createElement('div'); d.id = 'haulbar'
    d.style.cssText = 'margin:4px 0;padding:4px 6px;border:1px solid #6e5433;background:#2a2418;'
      + 'color:#e2b63e;font-size:11px;line-height:1.5'
    document.getElementById('sellbar').parentNode.insertBefore(d, document.getElementById('sellbar'))
    return d
  })()
  if (!me.consignment) hb.style.display = 'none'
  else {
    hb.style.display = 'block'
    const c9 = me.consignment
    const load9 = (c9.items ?? []).filter(Boolean).length
    // §11c: A LEG IS REACHED BY STANDING BESIDE ITS OWN COUNTER, orthogonally,
    // and the engine only checks it on an interval you ACT on. That is three
    // conditions a citizen cannot see: which counter, which side of it, and
    // that standing still is not enough. Somebody walked a whole leg, stood in
    // the right town, watched "leg 1 of 2" refuse to move, and gave up. So the
    // bar names the node, points at it, and counts the tiles.
    const dest9 = c9.route?.[c9.leg] ? s.nodes[c9.route[c9.leg]] : null
    const d9 = dest9 ? Math.abs(me.x - dest9.x) + Math.abs(me.y - dest9.y) : null
    const bear9 = dest9
      ? ((Math.abs(dest9.y - me.y) > Math.abs(dest9.x - me.x))
          ? (dest9.y < me.y ? 'north' : 'south') : (dest9.x < me.x ? 'west' : 'east'))
      : ''
    hb.innerHTML = 'CARRYING \u00b7 ' + load9 + ' slot' + (load9 === 1 ? '' : 's')
      + (haulAtEndC(c9)
        ? ' \u00b7 <b style="color:#8ce08c">discharge here at ' + (haulLast(s, c9) ?? 'this counter') + '</b>'
        : '<br><span style="color:#e8d9a0">Next: the counter at ' + (haulNext(s, c9) ?? '?') + '</span>'
          + '<span style="color:#8a7f68"> \u00b7 leg ' + ((c9.leg ?? 0) + 1) + ' of '
          + (c9.route ?? []).length + ' \u00b7 discharge at ' + (haulLast(s, c9) ?? '?') + '</span>'
          + (d9 === null ? ''
            : d9 <= 1
              ? '<br><span style="color:#8ce08c">You are beside it. Take one step, or any deed, and the leg counts.</span>'
              : '<br><span style="color:#a89a7c;font-size:10px">' + d9 + ' tiles ' + bear9
                + ' \u2014 stand directly beside that counter (not on it, not corner-on).</span>'))
      + '<br><span style="color:#a89a7c;font-size:10px">No bank, no recall. Anyone else carrying may strike you.</span>'
  }
  document.getElementById('status').textContent =
    me.action ? 'busy: ' + me.action.type : 'idle: click the world'
}

// §6bv: THE SKILL GUIDE. Click a skill, see what it opens.
//
// Every gate in this world was public and unreachable at the same time: the
// numbers were all in engine.js, exported by `skillUnlocks()`, and the only
// way to read them was to open the file. A citizen deciding whether to push
// mining from seventy-eight to ninety-two could not find out what waited at
// ninety-two without leaving the game.
function openSkillGuide(skill) {
  document.getElementById('skillguide')?.remove()
  const me = world?.players?.[myId]
  const lvl = XP_TO_LVL(me?.skills?.[skill] ?? 0)
  const xp = me?.skills?.[skill] ?? 0
  const rows = SKILL_UNLOCKS[skill] ?? []
  const box = document.createElement('div')
  box.id = 'skillguide'
  box.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);'
    + 'z-index:60;background:#241f18;border:3px solid #8a6f45;padding:10px 12px;'
    + 'max-height:78%;overflow-y:auto;min-width:340px;max-width:min(92vw,520px);'
    + 'font:12px Verdana;color:#e2d6b8'
  const toNext = lvl >= MASTERY ? null : XP_TABLE[lvl + 1] - xp
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
    + '<b style="color:#e2b63e">' + skill.toUpperCase() + ' \u00b7 ' + lvl + '</b>'
    + (CALLINGS_OF[skill] ? '<span style="color:#8a7f68;font-size:10px;margin-left:8px">'
      + CALLINGS_OF[skill].join(' \u00b7 ') + '</span>' : '')
    + '<span id="skgx" style="cursor:pointer;color:#a89a7c;padding:0 6px">close</span></div>'
    + '<div style="color:#8a7f68;font-size:10px;margin-bottom:8px">'
    + xp.toLocaleString() + ' experience'
    // §5k: the ceiling, said where the bar is, because a citizen who does not
    // know they stop at fifty will think the world broke
    + (() => { const m = world && world.players && world.players[myId]
        const cap = capOfSkill(m, skill)
        return cap === 0 ? ' \u00b7 <span style="color:#e2b63e">no ceiling: yours</span>'
          : ' \u00b7 stops at ' + cap + (m && m.calling ? ', sworn elsewhere' : ' until you swear') })()
    + (toNext === null ? ' \u00b7 mastered' : ' \u00b7 ' + toNext.toLocaleString() + ' to ' + (lvl + 1))
    + '</div>'
  if (SKILL_NOTE[skill]) {
    html += '<div style="color:#a89a7c;font-size:10px;margin:0 0 8px;line-height:1.5">'
      + SKILL_NOTE[skill] + '</div>'
  }
  if (!rows.length) {
    html += '<div style="color:#8a7f68;font-size:11px">Nothing in this world is locked behind it.</div>'
  } else {
    const done = rows.filter(([l]) => l <= lvl), todo = rows.filter(([l]) => l > lvl)
    const line = ([l, t], open) => '<div style="display:flex;gap:8px;padding:2px 0;'
      + (open ? 'color:#8a7f68' : 'color:#e2d6b8') + '">'
      + '<b style="min-width:26px;text-align:right;'
      + (open ? 'color:#6e6355' : 'color:#e2b63e') + '">' + l + '</b>'
      + '<span>' + t + '</span></div>'
    if (todo.length) {
      html += '<div style="color:#8a7f68;margin:4px 0 2px;letter-spacing:1px;font-size:10px">AHEAD</div>'
        + todo.map((r) => line(r, false)).join('')
    }
    if (done.length) {
      html += '<div style="color:#8a7f68;margin:10px 0 2px;letter-spacing:1px;font-size:10px">OPEN TO YOU</div>'
        + done.map((r) => line(r, true)).join('')
    }
  }
  // §6bv again, said to the citizen rather than to the maintainer: the guide
  // is deliberately incomplete, and saying so is part of the design.
  html += '<div style="color:#6e6355;font-size:9px;margin-top:10px;line-height:1.5;border-top:1px solid #3a3126;padding-top:6px">'
    + 'Gates only. What a seam YIELDS, how often the rare thing answers, what a '
    + 'blow is worth \u2014 those are not here, and they are not hidden either. '
    + 'Stand at a tree and count.</div>'
  box.innerHTML = html
  document.getElementById('view')?.parentNode?.appendChild(box) ?? document.body.appendChild(box)
  box.querySelector('#skgx').onclick = () => box.remove()
}

function openTrade(pid) {
  const me = world?.players[myId], them = world?.players[pid]
  if (!me || !them) return
  const mine = me.inventory.map((sl, i) => sl ? { i, item: sl.item } : null).filter(Boolean)
  if (!mine.length) { feed('You have nothing to offer.'); return }
  const theirs = [...new Set(them.inventory.filter(Boolean).map(sl => sl.item))]
  if (!theirs.length) { feed((them.name ?? 'They') + ' carries nothing you could ask for.'); return }
  const box = document.getElementById('trade')
  box.style.display = 'block'
  box.innerHTML = '<b style="color:var(--gold)">Trade with ' + (them.name ?? pid.slice(0, 6)) + '</b><br>'
    + 'give <select id="tgive">' + mine.map(o => '<option value="' + o.i + '">' + o.item.replace('-', ' ') + '</option>').join('') + '</select> '
    + 'for <select id="twant">' + theirs.map(it => '<option value="' + it + '">' + it.replace('-', ' ') + '</option>').join('') + '</select> '
    + '<button id="toffer">offer</button> <button id="tclose">close</button>'
  document.getElementById('toffer').onclick = () => {
    send({ do: 'offer_trade', to: pid, giveSlot: +document.getElementById('tgive').value,
           wantItem: document.getElementById('twant').value })
    feed('You make your offer. Now they must accept.')
    box.style.display = 'none'
  }
  document.getElementById('tclose').onclick = () => { box.style.display = 'none' }
}

function validateGateName(s) {
  const inp = document.getElementById('gatename')
  const btn = document.getElementById('gatebtn')
  const nm = inp.value.toLowerCase().trim()
  const takenBy = nm && s?.names?.[nm]
  if (takenBy && takenBy !== myId) {
    inp.style.borderColor = '#a11212'
    btn.textContent = '"' + nm + '" is taken: try another'
    btn.disabled = true
  } else if (!entered) {
    inp.style.borderColor = ''

    const me2 = world?.players[myId]
    btn.textContent = me2
      ? 'Enter as ' + (me2.name ?? 'citizen ' + myId.slice(0, 6) + '\u2026')
      : 'Enter the world'
  }
}

let arrivalTold = false
function tellArrival() {
  if (arrivalTold || !curState || !myId) return
  const me9 = curState.players[myId]
  if (!me9) return
  arrivalTold = true
  const asleep = curState.tick - (me9.lastInput ?? curState.tick)
  // §0: NOT WHILE IN NOUGHT. A resident's local body is freshly made and so has
  // lastInput 0, which read as a first waking in a world they have not reached.
  if (inNought) return
  if ((me9.lastInput ?? 0) === 0 || asleep < 8) { feed('You wake in Tallyholm for the first time.'); return }
  const s9 = Math.round(asleep * 0.6)
  const t9 = s9 >= 172800 ? Math.round(s9 / 86400) + ' days' : s9 >= 86400 ? 'a day'
    : s9 >= 7200 ? Math.round(s9 / 3600) + ' hours' : s9 >= 3600 ? 'an hour'
    : s9 >= 120 ? Math.round(s9 / 60) + ' minutes' : 'a moment'
  feed('You wake. You slept for ' + t9 + '; the world did not.')
}
function enterWorld() {
  if (!myId) return
  wakeAudio()
  // §0e: A CROSSING IS NOT COMPLETED ON A SINGLE ACTION. The first press arms
  // it and says what is about to happen; the second one does it.
  if (crossingOpen) {
    const w0 = myWait(world)
    if (!w0 || !w0.ripe || !keyExported()) return
    if (!crossArmed) { crossArmed = true; updateGate(world, null); return }
    crossSentAt = world.tick
    send({ do: 'spawn' })
    feed('You draw from the fountain in Anchor.')
    updateGate(world, null)
    return                        // Nought does not end until the world says so
  }
  if (inNought) {
    // walking in. The wait is already running; the island is simply open.
    entered = true
    document.getElementById('gate').style.display = 'none'
    feed('You are in Nought: Tallyholm before anyone walked it.')
    feed('Nothing you do here is in the world. Return to the fountain when you are ready.')
    return
  }
  const nm = document.getElementById('gatename').value.toLowerCase().trim()
  if (nm && world?.names?.[nm] && world.names[nm] !== myId) return // taken: the button already says so
  if (/^[a-z0-9-]{1,12}$/.test(nm) && !nm.startsWith('-') && !nm.endsWith('-')) loginName = nm
  entered = true
  // (door music is the DOOR's: entering fades it out, and nothing here restarts it)
  document.getElementById('gate').style.display = 'none'
  feed('The interval begins.')
}
const sndEl = document.getElementById('sndtoggle')
const sndLabel = () => sndEl.textContent = 'sound: ' + (soundOn ? 'on' : 'off') + ' (tap to toggle)'
// ---- the WebGL composite: initialize, or fall back without fuss ----
if (HD) try {
  glCv = document.createElement('canvas')
  glCv.width = 1120; glCv.height = 800
  glCv.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges'
  cv.parentNode.appendChild(glCv)
  gl = glCv.getContext('webgl', { antialias: false })

    const vsrc = 'attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}'
    const fsrc = 'precision mediump float;varying vec2 v;uniform sampler2D t;uniform float T,N,W2;uniform vec2 R,CAM;' +
      'uniform vec4 L[24];uniform vec3 C[24];' +
      'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}' +
      'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);' +
      'return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}' +
      'void main(){float asp=R.x/R.y;vec2 p2=vec2(v.x*asp,v.y);' +
      // heat shimmer: the air above every warm light bends

      'if(l.z>0.001&&C[i].r>.8&&C[i].b<.5){float d=distance(p2,vec2(l.x*asp,l.y));' +
      'float ab=smoothstep(.02,-.06,v.y-l.y);' +
      'uvo.x+=sin(v.y*180.+T*8.)*.0005*smoothstep(l.z*.9,0.,d)*ab;}}' +
      'vec2 sv=v+uvo;vec3 b=texture2D(t,sv).rgb;' +
      // the ground gains grain: world-anchored, it does not swim with the camera
      'vec2 wp=sv*R*.5+CAM;' +
      'float gn=vn(wp/23.)*.65+vn(wp/8.5)*.35;' +
      'b*=.96+.06*gn;' +
      // caustics: light webs dance on anything that reads as water
      'float wm=smoothstep(.04,.14,b.b-b.r)*smoothstep(.0,.08,b.b-b.g);' +
      'if(wm>.01){float c1=vn(wp/13.+vec2(T*.55,T*.33));float c2=vn(wp/9.-vec2(T*.4,T*.52));' +
      'float ca=pow(c1*c2*2.6,2.4);b+=wm*ca*vec3(.30,.50,.55);}' +
      // the lights
      'vec3 acc=vec3(0.);for(int i=0;i<24;i++){vec4 l=L[i];if(l.z>0.001){' +
      'float fl=.95+.05*sin(T*9.+float(i)*7.31);' +
      'float d=distance(p2,vec2(l.x*asp,l.y));' +
      'float f=smoothstep(l.z,0.,d)*l.w*fl;acc+=C[i]*f;}}' +
      'float amb=mix(1.,.30,N);vec3 tint=mix(vec3(1.),vec3(.60,.71,1.28),N*.85);' +
      'vec3 lit=b*(amb*tint)+b*acc;' +
      'vec3 bl=vec3(0.);vec2 o=3.0/R;' +
      'bl+=max(vec3(0.),texture2D(t,sv+vec2(o.x,0.)).rgb-.85);bl+=max(vec3(0.),texture2D(t,sv-vec2(o.x,0.)).rgb-.85);' +
      'bl+=max(vec3(0.),texture2D(t,sv+vec2(0.,o.y)).rgb-.85);bl+=max(vec3(0.),texture2D(t,sv-vec2(0.,o.y)).rgb-.85);' +
      'lit+=bl*.18*vec3(1.,.92,.72);' +
      'lit*=vec3(1.+W2*.16,1.+W2*.05,1.-W2*.13);' +
      'float vg=smoothstep(.96,.42,distance(v,vec2(.5)));lit*=mix(.80,1.,vg);' +
      'gl_FragColor=vec4(lit,1.);}'
    const sh = (ty, src) => { const s2 = gl.createShader(ty); gl.shaderSource(s2, src); gl.compileShader(s2); return s2 }
    const pr = gl.createProgram()
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, vsrc)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fsrc))
    gl.linkProgram(pr); gl.useProgram(pr)

    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW)
    const loc = gl.getAttribLocation(pr, 'p')
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex)
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST) // crisp:
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST) // pixels are the art
    glU = { T: gl.getUniformLocation(pr, 'T'), N: gl.getUniformLocation(pr, 'N'), W2: gl.getUniformLocation(pr, 'W2'),
      R: gl.getUniformLocation(pr, 'R'), CAM: gl.getUniformLocation(pr, 'CAM'),
      L: gl.getUniformLocation(pr, 'L'), C: gl.getUniformLocation(pr, 'C') }
    gl.viewport(0, 0, glCv.width, glCv.height)
    GLON = true
  }
} catch (e) { GLON = false; if (glCv) glCv.style.display = 'none' }

  if (x < 0 || x >= W || y < 0 || y >= H) return
  const me = world.players[myId]; if (!me) return
  const adj = (o) => Math.abs(me.x - o.x) + Math.abs(me.y - o.y) === 1

  // a new order interrupts the old work by REPLACING it: the engine
  // honors the latest input natively. (An explicit stop sent alongside
  // the new action once tripped the one-input-per-tick rule: both
  // dropped, and the citizen froze mid-swing, deaf to all clicks.)
  pendingLight = null
  // hit-test against RENDERED positions: a goblin mid-stride is clickable
  // where its body is, not where the grid will say it is in 300ms
  const fxT = sx / TILE + cam.x, fyT = sy / TILE + cam.y
  const tc = renderT(performance.now())
  const lp = (a, b) => a + (b - a) * tc
  let best = null
  for (const [id, m] of Object.entries(world.mobs)) {
    if (m.hp <= 0) continue
    const o = prevState?.mobs?.[id]
    const ix = o ? lp(o.x, m.x) : m.x, iy = o ? lp(o.y, m.y) : m.y
    const d = Math.hypot(ix + 0.5 - fxT, iy + 0.5 - fyT)
    if (d < 0.8 && (!best || d < best.d)) best = { d, kind: 'mob', id, m }
  }
  for (const [pid, p] of Object.entries(world.players)) {
    if (pid === myId) continue
    const o = prevState?.players?.[pid]
    const _hp2 = (!o || teleported(o, p)) ? { x: p.x, y: p.y } : { x: lp(o.x, p.x), y: lp(o.y, p.y) }
    const ix = _hp2.x, iy = _hp2.y
    const d = Math.hypot(ix + 0.5 - fxT, iy + 0.5 - fyT)
    if (d < 0.8 && (!best || d < best.d)) best = { d, kind: 'citizen', id: pid, p }
  }
  if (window.__stillArm && best && (best.kind === 'mob' || best.kind === 'citizen')) {
    window.__stillArm = false
    const tid = best.id
    const tx = best.kind === 'mob' ? best.m.x : best.p.x, ty = best.kind === 'mob' ? best.m.y : best.p.y
    if (Math.max(Math.abs(me.x - tx), Math.abs(me.y - ty)) > 6) { feed('Too far. The stilling reaches six tiles.'); return }
    send({ do: 'still', target: tid })
    feed('You speak the truce. The fight simply stops , for them, and for you.')
    stillRings.push({ x: tx, y: ty, at: performance.now() })
    tone(220, 0.5, { type: 'sine', vol: 0.05 }); tone(110, 0.8, { type: 'sine', vol: 0.04, at: 0.15 }) // a bell, descending into quiet
    flashClick(tx, ty, false)
    return
  }
  if (best?.kind === 'mob') {
    const { id, m } = best
    flashClick(m.x, m.y, true)
    // §7cq: an armed spell lands on a beast too. Three of the four barrow
    // spells work on anything with hitpoints, and the gibbet-dead behind its
    // railing can be reached by nothing else.
    if (spellArmed) { castArmed(id, m); return }
    if (me.action?.mobId === id) return                        // already fighting it: silent
    if (adj(m)) { send({ do: 'prowess', mobId: id }); feed('You attack the ' + m.type + '!') }
    else intent = { kind: 'prowess', id }                       // hunt it down, then engage
    return
  }
  if (best?.kind === 'citizen') {
    const { id: pid, p } = best
    if (specArmed && SPEC_OF[me.equipment?.weapon?.item]) {
      specArmed = false
      send({ do: 'special', targetId: pid })

    }
    flashClick(p.x, p.y, true)
    // A MENDING, SENT. A wand sends what a bare hand keeps: a sigil spent to
    // heal somebody four tiles off. Offered everywhere, because helping
    // somebody is not a thing the Wilds should gate -- and this window could
    // not do it at all, so an alchemist here had a wand and no use for it.
    const mendOpt = (() => {
      const wand = me.equipment?.weapon?.item === 'wand'
      const sig = (me.inventory ?? []).some(sl => sl?.item === 'sigil')
      const near = Math.max(Math.abs(me.x - p.x), Math.abs(me.y - p.y)) <= 4
      if (!wand || !sig || !near) return []
      const nm2 = p.name ?? pid.slice(0, 6)
      return [{ label: 'mend ' + nm2, act: () => {
        send({ do: 'mendp', target: pid })
        feed('You send a mending to ' + nm2 + '. The sigil goes with it.')
      } }]
    })()
    if (mayStrikeC(me, p)) {
      const nm = p.name ?? pid.slice(0, 6)
      const why = (me.consignment && p.consignment) ? 'You are both carrying.' : 'The Wilds allow it.'
      const social = socialOpts(pid, p, me)
      if (spellArmed) { castArmed(pid, p); return }
      chooseAction([
        ...mendOpt,
        { label: 'attack ' + nm, act: () => {
          const q2 = world.players[pid]
          if (q2 && Math.abs(me.x - q2.x) + Math.abs(me.y - q2.y) <= 1) { send({ do: 'attackp', targetId: pid }); feed('You turn on ' + nm + '. ' + why) }
          else { intent = { kind: 'pvpattack', id: pid }; feed('You go for ' + nm + '. ' + why) }
        } },
        { label: 'trade', act: () => { if (Math.abs(me.x - p.x) + Math.abs(me.y - p.y) === 1) openTrade(pid); else { intent = { kind: 'meet', id: pid }; feed('You approach ' + nm + '.') } } },
        ...social,
      ]); return
    }
    // §7cq: an armed spell lands on whoever you tapped, whatever else the tap
    // would have offered -- the same way an armed special does.
    if (spellArmed) { castArmed(pid, p); return }
    if (mendOpt.length) {
      const nm3 = p.name ?? pid.slice(0, 6)
      chooseAction([
        ...mendOpt,
        { label: 'trade with ' + nm3, act: () => {
          if (Math.abs(me.x - p.x) + Math.abs(me.y - p.y) === 1) openTrade(pid)
          else { intent = { kind: 'meet', id: pid }; feed('You approach ' + nm3 + '.') } } },
        ...socialOpts(pid, p, me),
      ]); return
    }
    // §7cn: a plain stranger still gets the social choices -- remembering
    // somebody and falling in behind them are not combat and not trade, and
    // before this there was no way to do either from a tap.
    if (spellArmed) { castArmed(pid, p); return }
    chooseAction([
      { label: 'trade with ' + (p.name ?? 'the stranger'), act: () => {
        if (Math.abs(me.x - p.x) + Math.abs(me.y - p.y) === 1) openTrade(pid)
        else { intent = { kind: 'meet', id: pid }; feed('You approach ' + (p.name ?? 'the stranger') + '.') } } },
      ...socialOpts(pid, p, me),
    ])
    return
  }

  {
    // A PILE IS NOT ONE THING, and the dearest is what anybody wants first.
    // This took whichever entry the object happened to hold first, so a
    // citizen standing over a spilled pack got an ore and left the plate.
    const here = Object.entries(world.ground ?? {})
      .filter(([, g2]) => g2.x === x && g2.y === y)
      .sort((A, B) => worthRank(B[1].item) - worthRank(A[1].item) || (A[0] < B[0] ? -1 : 1))
    if (here.length > 1) {
      // A SCRIPT MAY NAME ANY OF THEM, SO A PERSON MUST BE ABLE TO REACH ANY
      // OF THEM. This took here[0] and nothing else -- the dearest thing, with
      // no way to choose -- while an automated citizen could lift the
      // twenty-seventh item in a heap by naming its id. A window that offers
      // less than the rules allow is a window that disadvantages the person
      // using it.
      const meP = world.players[myId]
      const wep9 = meP.equipment?.weapon?.item
      // §6bn: ONE STAFF, TWO VERBS, AND THE WINDOW MUST NOT CHOOSE. Both are
      // offered as separate lines, worded so that nobody clicks the wrong one
      // by reflex: one says nobody will have it, the other says whose it is.
      const staffed9 = wep9 === 'goo-staff'
        && (meP.inventory ?? []).some(sl => sl?.item === 'sigil')
        && Math.max(Math.abs(meP.x - x), Math.abs(meP.y - y)) <= 5
      const canUnmake = staffed9
      const sealable9 = staffed9 && here.filter(([, g3]) => g3.by && !g3.sealSpent && !g3.sealedBy)
      chooseAction([
        ...here.slice(0, 10).map(([gid2, g3]) => ({
          label: 'take the ' + g3.item.replace(/-/g, ' ') + ((g3.qty ?? 1) > 1 ? ' (' + g3.qty + ')' : '')
            + (g3.sealedBy ? (g3.by === myId ? ' \u2014 sealed for you' : ' \u2014 sealed, not yours') : ''),
          act: () => {
            if (g3.sealedBy && g3.by !== myId) {
              feed('It is sealed for whoever dropped it. Your hand closes on nothing.'); return }
            if (!meP.inventory.some(sl => sl === null)) { feed('Your pack is full.'); return }
            intent = { kind: 'pickup', id: gid2 }
          } })),
        ...(sealable9 && sealable9.length ? [{
          label: 'seal the ' + sealable9[0][1].item.replace(/-/g, ' ') + ' for whoever dropped it (a sigil)',
          act: () => { send({ do: 'seal', groundId: sealable9[0][0] })
            feed('You seal it where it lies. Only the hand that dropped it may lift it, '
               + 'and only while you stand here.') } }] : []),
        ...(canUnmake ? [{ label: 'unmake the ' + here[0][1].item.replace(/-/g, ' ') + ' (a sigil)',
          act: () => { send({ do: 'unmake', groundId: here[0][0] })
            feed('You unmake it where it lies. Nobody will have it now.') } }] : []),
      ])
      return
    }
    if (here.length) {
      const [gid, g2] = here[0]
      // §6aj/§6bn: a goo staff and a sigil reach it where it lies, five tiles
      // off. TWO verbs now come out of that one staff and they are opposites,
      // so a single click may no longer pick one.
      //
      // It used to fire `unmake` outright on any distant pile. With `seal` on
      // the same staff that is a thumb slip away from destroying the pack you
      // meant to protect -- and the cost lands on a third party who never
      // touched a button. So: a menu, always, and the pickup stays the default

      const wep9 = me.equipment?.weapon?.item
      const near9 = Math.max(Math.abs(me.x - x), Math.abs(me.y - y)) <= 5
      if (wep9 === 'goo-staff' && near9
          && (me.inventory ?? []).some(sl => sl?.item === 'sigil')) {
        const canSeal9 = g2.by && !g2.sealSpent && !g2.sealedBy
        chooseAction([
          ...(canSeal9 ? [{ label: 'seal the ' + g2.item.replace(/-/g, ' ')
              + ' for whoever dropped it (a sigil)',
            act: () => { send({ do: 'seal', groundId: gid })
              feed('You seal it where it lies. Only the hand that dropped it may lift it, '
                 + 'and only while you stand here.') } }] : []),
          { label: 'unmake the ' + g2.item.replace(/-/g, ' ') + ' (a sigil)',
            act: () => { send({ do: 'unmake', groundId: gid })
              feed('You unmake the ' + g2.item.replace(/-/g, ' ')
                 + ' where it lies. Nobody will have it now.') } },
          { label: 'leave it', act: () => {} },
        ])
        return
      }
      if (!me.inventory.some(sl => sl === null)) { feed('Your pack is full: no room to pick that up.'); return }
      intent = { kind: 'pickup', id: gid }; return
    }
  }

  for (const [id, n] of Object.entries(world.nodes))
    if (n.type === 'plot' && n.x === x && n.y === y) {
      flashClick(x, y, true)
      // §6o: your row, not the plot's. Everyone may work the same ground.
      const sown = (me.crops ?? {})[id] ?? 0
      const el2 = world.tick - sown
      if (!sown) {
        const sSlot = me.inventory.findIndex(sl => sl?.item === 'seeds')
        if (sSlot === -1) { feed('Bare, tilled earth. It waits for seeds. (Goblins hoard them.)'); return }
        if (Object.keys(me.crops ?? {}).length >= 32) { feed('You have all the rows you can tend.'); return }
        intent = { kind: 'plant', id, slot: sSlot }
      } else if (el2 >= 1200) {
        intent = { kind: 'harvest', id }
      } else {
        feed(el2 < 400 ? 'A sprout. The interval provides, slowly.'
          : el2 < 800 ? 'Green rows, knee-high. Patience.'
          : 'Flowering. Nearly.')
        return
      }
      return
    }
  for (const [id, n] of Object.entries(world.nodes))
    if (n.x === x && n.y === y) {
      if (me.action?.nodeId === id) return                     // already working it: silent
      // §6dd: A DRY WELL IS NOT AN EXHAUSTED SEAM. This guard was written when
      // `depletedUntil` only ever appeared on something you gather from, so the
      // moment a well started carrying one (§6dd) clicking it answered
      // "Nothing left here." and returned before the well's own branch below.
      if (n.type === 'well' && (n.depletedUntil ?? 0) > world.tick) {
        const secs = Math.max(1, Math.round((n.depletedUntil - world.tick) * 0.6))
        feed('The bucket comes up wet and empty. The well draws down again in about '
          + secs + ' second' + (secs === 1 ? '' : 's') + '.')
        flashClick(n.x, n.y, false)
        return
      }
      if (n.type !== 'campfire' && n.type !== 'fire' && n.type !== 'vault' && n.type !== 'anvil'
          && n.type !== 'well' && n.type !== 'store' && n.type !== 'stall' && n.type !== 'market'
          && n.type !== 'hearth' && n.type !== 'waystone' && n.depletedUntil > world.tick) {
        feed({ 'tree': 'The tree is felled. It will regrow.',
               'rock': 'The rock is mined out. Give it a moment.',
               'magic-rock': 'The hum has gone out of it. It will come back.',
               'fishing-spot': "The fish aren't biting here yet." }[n.type] ?? 'Nothing left here.')
        return
      }
      if (n.type === 'anvil') {
        if (!adj(n)) { intent = { kind: 'anvilgo', id }; feed('You head to the anvil.'); return }
        smithBest(me); return
      }
      // 6ch: the standing stone, and the recall it offered, are gone.
      if (n.type === 'guard') { feed('The guard nods. "The road is watched, citizen."'); return }
      if (n.type === 'smith') { feed('The smith gestures at the anvil. "Ore and logs. The rest is rhythm."'); return }
      if (n.type === 'well') {
        // A WELL IS FOR DRINKING, and this window only ever peered into one.
        // Free, no waiting, restores you to full: the cost was paid in
        // geography long before you got here, because a well stands in a town
        // and a town is tens of tiles from anywhere worth hunting.
        const meW = world.players[myId]
        const adj = Math.abs(meW.x - n.x) + Math.abs(meW.y - n.y) === 1
        if (!adj) { feed('You peer into the well. Somewhere far below, a tick echoes.'); return }
        send({ do: 'drink' })
        // §6dd: it restores you to full and spends your arm, and the well is
        // dry behind you for a hundred intervals
        feed('You drink. The cold of it goes all the way down, and you are whole \u2014 '
          + 'and the well is drawn down behind you.')
        flashClick(n.x, n.y, false)
        return
      }
      if (n.type === 'market') {
        // A CITIZEN'S STALL: trestles, a cloth, a post with their mark, and
        // whatever is actually on the shelf standing on the board.
        shadow(X, Y, 11)
        cx.fillStyle = '#4a3a24'
        cx.fillRect(X + 7, Y + 20, 2.4, 8); cx.fillRect(X + 30, Y + 20, 2.4, 8)
        poly([[X+4,Y+20],[X+20,Y+13],[X+36,Y+20],[X+20,Y+27]], '#7a6038', '#2e2414')
        cx.fillStyle = '#4a3a20'; cx.fillRect(X + 4, Y + 20, 16, 5)
        cx.fillStyle = '#3a2c18'; cx.fillRect(X + 20, Y + 20, 16, 5)
        poly([[X+4,Y+20],[X+12,Y+16],[X+13,Y+23],[X+5,Y+26]], '#6a3030', '#331414')
        cx.fillStyle = '#3a2f1e'; cx.fillRect(X + 32, Y + 2, 2.2, 18)
        poly([[X+34,Y+2],[X+42,Y+4],[X+42,Y+10],[X+34,Y+8]], '#8a6a2a', '#3a2c12')
        const g9 = n.shelf ? Object.keys(n.shelf)[0] : null
        if (g9) { try { cx.drawImage(itemSprite(g9), X + 13, Y + 6, 16, 16) } catch {} }
        return
      }
      if (n.type === 'market') {
        const meS = world.players[myId]
        const good = n.shelf ? Object.keys(n.shelf)[0] : null
        const qty = good ? n.shelf[good] : 0
        const adj = Math.abs(meS.x - n.x) + Math.abs(meS.y - n.y) <= 1
        if (n.by === myId) {
          if (!adj) { feed('Your stall: ' + (good ? qty + ' ' + good.replace(/-/g, ' ') : 'empty') + '. Walk to it to tend it.'); return }
          openMyStall(id); return
        }
        if (!good) { feed('A stall, and nothing on it.'); return }
        if (!(n.ask > 0)) { feed('A stall of ' + qty + ' ' + good.replace(/-/g,' ') + ', unpriced. Nothing is for sale.'); return }
        if (!adj) { feed(qty + ' ' + good.replace(/-/g,' ') + ' at ' + n.ask + ' gold. Walk to it to buy.'); return }
        send({ do: 'buy', item: good })
        feed('You buy the ' + good.replace(/-/g, ' ') + ' for ' + n.ask + ' gold.')
        return
      }
      if (n.type === 'ossuary') {
        // §7cj: AND THE TURNING IS OFFERED HERE. `turn` had no button anywhere
        // -- the verb, the SDK and both windows' input mapping all knew it and
        // no thumb could reach it. Same debt as saw, smelt and nock: a verb
        // that only an SDK can speak is a verb citizens do not have.
        //
        // It follows the furnace's shape, not a menu: walk if you are not
        // beside it, act if you are. (I wrote `menu(...)` first, which is not a
        // function this window has -- there is no menu helper here, and every
        // other work in the world does it this way.)
        const meO = world.players[myId]
        if (!adj(n)) {
          intent = { kind: 'walk', x: n.x, y: n.y + 1 }
          feed('The ossuary. Bones laid here are worth more than bones laid in a field.')
          return
        }
        const onBarrow = (meO.book ?? 'common') === 'barrow'
        send({ do: 'turn' })
        // §7cr: the ossuary answers -- a ring going IN, not out
        spellMarks.push({ kind: 'turn', x: n.x, y: n.y, at: performance.now() })
        tone(70, 1.1, { type: 'sine', vol: 0.05 })
        tone(52, 1.4, { type: 'sine', vol: 0.04, at: 0.2 })
        feed(onBarrow
          ? 'You close the barrow-work. The waking, the rot and the taking are gone; '
            + 'the stilling, the mending, the sealing, the alching and the recall come back.'
          : 'You turn to the barrow-work. The stilling, the mending, the sealing, the alching '
            + 'and the recall are closed to you. What is left will not refuse a fight.')
        flashClick(n.x, n.y, false); return
      }
      // §7t: THE TRAINING YARD, which this window did not know existed.
      //
      // `dummy` and `butt` are in NODE_TYPES *and* in MOB_STATS, and the engine
      // note says why: "a dummy and a butt are MOBS, not furniture, and that is
      // the whole trick" -- attack, the specials, a drawn bow and the damage
      // readout all work on them unchanged. So a click on the frame finds the
      // thing standing in it and swings at that, rather than sending a refused
      // input and saying nothing.
      if (n.type === 'dummy' || n.type === 'butt') {
        const tgt = Object.entries(world.mobs ?? {})
          .find(([, m]) => m.x === n.x && m.y === n.y && m.hp > 0)
        const bow = RANGED_ITEMS.has(meNow?.equipment?.weapon?.item)
        if (!tgt) { feed(n.type === 'butt' ? 'An archery butt. Straw and canvas, and nothing in it.'
                                           : 'A pell of oak. Nobody has set a dummy on it.'); return }
        if (n.type === 'butt' && !bow) {
          feed('A butt takes an ARROW. Wield a bow and it will teach you the first rungs of ranged; '
             + 'the pell beside it is the one you hit with steel.'); return }
        if (n.type === 'dummy' && bow) {
          feed('A pell takes a BLOW. Put the bow away, or shoot the butt instead.'); return }
        intent = { kind: 'prowess', id: tgt[0] }
        feed('You set about the ' + (n.type === 'butt' ? 'butt' : 'pell') + '. It never hits back, and '
           + 'past the twentieth level it has nothing left to teach you.')
        flashClick(n.x, n.y, false); return
      }
      if (n.type === 'rampart') { feed('A curtain wall. Dressed stone, battered at the foot, and old.'); return }
      if (n.type === 'signpost') { feed(n.text || 'West: Westhearth. East: Eastmere. North: Anchor.'); return }
      if (n.type === 'crier') { feed((n.name ? n.name + ': "' : '"') + (n.text || 'Hear ye.') + '"'); return }
      // a carved stone is read the same way a sign is: the words are in the
      // world, on the stone, not in this file
      if (n.type === 'landmark' && n.text) { feed(n.text); flashClick(n.x, n.y, false); return }
      if (n.type === 'wall') { feed('The wall is old, and it is not going anywhere.'); return }
      // §7ad: THE WORKS. These five were written into drawScene by mistake --
      // the DRAWING function -- so every furnace, altar, rockfall, mill and
      // sawpit ran its interaction logic on every animation frame, calling an
      // adj() that exists only here and throwing the moment one came on
      // screen. A citizen crashed the window by WALKING PAST a thing.
      //
      // Worse than the crash: had it not thrown, `send()` would have fired
      // sixty times a second. Interaction belongs where the clicks are.
      // §7bs: (arrows are nocked from the pack, not from the map -- see the
      // inventory handler; this note is here so the two are read together)
      if (n.type === 'furnace') {
        const meF = world.players[myId]
        if (!adj(n)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }
          feed('The bloomery. Ore and coal go in; iron comes out.'); return }
        const lit = (n.fuelUntil ?? 0) > (world?.tick ?? 0)
        const ci = (meF.inventory || []).findIndex(sl => sl?.item === 'coal' || sl?.item === 'charcoal')
        if (!lit) {
          if (ci === -1) { feed('The furnace is cold, and you have no coal to light it.'); return }
          // §7dc: and say which fuel is which, since they are no longer the same
          const isCoal = meF.inventory[ci]?.item === 'coal'
          feed(isCoal ? 'Coal. It burns half again as long as charcoal in a furnace.'
            : 'Charcoal. It burns clean, but coal burns longer here \u2014 keep the charcoal for powder.')
          send({ do: 'stoke', nodeId: id, slot: ci }); feed('The bloom catches.')
          flashClick(n.x, n.y, false); return
        }
        // §7co: ALL FOUR SMELTS, NOT JUST IRON. The furnace had a button and it
        // could only make one of the four things the engine smelts -- so steel,
        // star-ingots and gold bars were reachable from an SDK and from nowhere
        // else. A verb with one of its four recipes wired is not a wired verb.
        //
        // It offers what you can actually make, and says what is short when you
        // cannot make anything.
        const have = (it) => (meF.inventory || [])
          .reduce((t, sl) => t + (sl?.item === it ? (sl.qty ?? 1) : 0), 0)
        const SMELTS = [
          { r: 'iron',       needs: { 'iron-ore': 2 },     says: 'Two of ore run down into a bar.' },
          { r: 'steel',      needs: { 'iron': 1 },         says: 'The bar goes back in, and comes out steel.' },
          { r: 'star-ingot', needs: { 'magic-stone': 20 }, says: 'Twenty stones, and one ingot of starmetal.' },
          { r: 'gold-bar',   needs: { 'gold-ore': 5 },     says: 'The gold runs.' },   // GOLD_ORE_PER_BAR
        ]
        const can = SMELTS.filter((sm) =>
          Object.entries(sm.needs).every(([it, q]) => have(it) >= q))
        if (can.length > 1) {
          chooseAction([
            ...can.map((sm) => ({ label: 'smelt ' + sm.r,

      }
      if (n.type === 'watchfire') {
        // (restored to its rightful scope, v0.79b: a merge had stranded

        const li = me.inventory.findIndex(sl => sl?.item === 'logs')
        const lit = n.fuelUntil > (world?.tick ?? 0)
        const mins = Math.max(0, Math.round((n.fuelUntil - (world?.tick ?? 0)) * 0.6 / 60))
        const opts = []
        if (li !== -1) opts.push({ label: 'stoke the fire (1 log)', act: () => {
          send({ do: 'stoke', nodeId: id, slot: li })

        } })
        // §6bo: THE CLAMP. Offered only when it would work, and it names both

        // else's fire, because the second one is not yours to spend quietly.
        const wt9 = world?.genesis?.watch
        const bark9 = (me.inventory ?? []).reduce((a, sl) => a + (sl?.item === 'ironbark' ? (sl.qty ?? 1) : 0), 0)
        // §5m: firemaking is woodcraft

          opts.push(bark9 >= wt9.charWood

                send({ do: 'char', nodeId: id })

        }

          feed(lit ? 'The watchfire burns. Its light is nobody\u2019s and everybody\u2019s.'
                   : 'Cold ash. It wants wood.')
        } })

      }
      if (n.type === 'cart') {
        // §6bq: a caravan came apart here. One slot an interval, dearest

        const load = Object.entries(n.shelf ?? {})
          .sort((A, B) => worthRank(B[0]) - worthRank(A[0]) || (A[0] < B[0] ? -1 : 1))
        const mins9 = Math.max(0, Math.round((n.expiresAt - (world?.tick ?? 0)) * 0.6 / 60))
        const opts = []

        else if (load.length)
          opts.push({ label: 'your pack is full', act: () => feed('No room. The cart keeps it.') })
        opts.push({ label: 'look it over (' + load.map(([it, q]) => q + ' ' + it.replace(/-/g, ' ')).join(', ') + ')',
          act: () => feed('A spilled consignment, standing where it fell. It will be here about '

        chooseAction(opts); return
      }
      if (n.type === 'dedication') {

        return

      if (n.type === 'brewpot') {

        // This window refused every unowned pot outright ("belongs to another

        // unusable from the window most citizens play in.
        const housePot = n.by === undefined

        if (!adj(n) && !(me.x === n.x && me.y === n.y)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }; return }
        const mine = housePot ? me.brewing
          : (n.readyAt !== undefined ? { kind: n.brewKind, readyAt: n.readyAt } : undefined)
        if (mine && (world?.tick ?? 0) >= mine.readyAt) {
          send({ do: 'collect', nodeId: id }); feed('You draw off the finished ' + (mine.kind ?? 'brew') + '.'); return }
        if (mine) { feed('Still fermenting. Come back when it is ready.'); return }
        const gi = me.inventory.findIndex(s => s?.item === 'grain'), fi = me.inventory.findIndex(s => s?.item === 'raw-fish')
        const opts = []
        if (gi !== -1) opts.push({ label: 'brew ale (grain)', act: () => { send({ do: 'brew', nodeId: id, slot: gi }); feed('You set grain to ferment. Ale, in time.') } })
        if (fi !== -1) opts.push({ label: 'brew broth (fish)', act: () => { send({ do: 'brew', nodeId: id, slot: fi }); feed('You set fish to steep. Broth, in time.') } })
        if (!opts.length && housePot) feed('The house pot, scoured and waiting. You have nothing to put in it.')
        if (!housePot) opts.push({ label: 'dismantle brewpot', act: () => { send({ do: 'dismantle', nodeId: id }); feed('You take the brewpot apart, recovering some of its makings.') } })
        opts.push({ label: 'never mind', act: () => {} }); chooseAction(opts); return
      }
      if (n.type === 'house') {
        if (!adj(n)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }; feed('You approach the house.'); return }
        const bc = world?.genesis?.brew
        const owned = Object.values(world.nodes).filter(nn => nn.type === 'brewpot' && nn.by === myId).length
        const logs = me.inventory.filter(s => s?.item === 'logs').length, ore = me.inventory.filter(s => s?.item === 'ore').length

          // click -- which meant it was never part of the founding at all.

          feed('Oberon looks at you, and then at the stones.')
          flashClick(n.x, n.y, false)
          return
        }
        // the world names them now; the window only reads
        // NAME AND CALLING. The name was here already; the job was not, so a
        // banker, a shepherd and somebody's neighbour all sounded alike.
        const nm9 = n.name ?? kFromId(id)
        const call9 = n.kind && CALLING_NAMES[n.kind]
        const who9 = call9 ? nm9 + ', ' + call9 : nm9
        const line9 = (n.kind && CALLING_LINE_W[n.kind])
          ? CALLING_LINE_W[n.kind]
          : ['\u201cFine day for it.\u201d', '\u201cMind the step.\u201d',
             '\u201cBeen here since the founding, and I\u2019ll be here after you.\u201d'][tileHash(n.x, n.y, 3) % 3]
        feed(who9 + ': ' + line9)
        flashClick(n.x, n.y, false)
        return
      }
      // §0d/§0e: THE FOUNTAIN. To a resident it is the one door in the world;

          // nothing at all. It needs no rule to be a memorial; it needs
          // somebody to say so.
          feed('The fountain. You came through here, and it will not take you again \u2014 it takes nobody twice.')
          feed('Somebody is standing in Nought right now, looking at this same water, in an Anchor with nothing in it.')
          return

        if (!adj(n)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }; feed('You make for the fountain.'); return }
        if (!nought) { feed('Nought is still being built here.'); return }
        openCrossing()
        return
      }
      if (n.type === 'landmark' && n.kind === 'tally-half') {
        feed(n.founderKey
          ? 'Half of the first tally. Its other half stands in Anchor\u2019s plaza, near where souls arrive, and each proves the other. Along the grain, the founder\u2019s whole key, cut small: ' + n.founderKey + '.'
          : 'Half of the first tally. Its other half stands across the water, on Shrine Isle, and each proves the other.')
        flashClick(n.x, n.y, false)
        return
      }
      if (n.type === 'landmark') {
        // landmarks answer with their STORY, never their materials
        feed({ 'elder-tree': 'The Elder Tree. It was here before the roads, and the roads bent around it.',
               'old-oak': 'The Old Oak. Its children feed the axe; the Oak itself is forever.',
               'standing-stone': 'A standing stone. Nobody remembers who raised them, and nobody dares quarry them.',
               'broken-tower': 'The Ruined Tower. Whoever kept watch here kept it long before the towns.',
               'sentinel': 'The Sentinel. Miners swear it moves when nobody climbs.',
               'drowned-bell': 'The Drowned Bell. Nobody remembers the town it called to prayer. On some mornings, the mud still rings.',
               'shipwreck': 'A wreck, broken on the shore. Somewhere there is a sea worth sailing, and this ship sailed it.' }[n.kind]
          // §6c-ii: THE WELLSPRING IS NOT IN THIS TABLE, ON PURPOSE. Every
          // other landmark answers with its story; this one answers with the
          // default, because it has no story anybody has been told. What it
          // does is discoverable by drinking, and that is the only way it is
          // meant to be discovered. Do not add a row here.
          ?? 'It stands. It has always stood.')
        flashClick(n.x, n.y, false)
        return
      }
      if (!me.inventory.some(sl => sl === null)) {
        feed('Your pack is full: bank it, drop it, or use it.')
        return
      }
      if (famOf(n.type) === 'magic-rock') {
        const lv = XP_TO_LVL(me.skills?.earthcraft ?? 0)   // §5m: mining is earthcraft
        if (lv < MAGIC_ROCK_MINING) {
          feed('The rock hums and your pick slides off it. Mining ' + MAGIC_ROCK_MINING
               + ' opens the magic-rocks of the Wilds \u2014 you have ' + lv + '.')
          flashClick(n.x, n.y, false)
          return
        }
      }
      const msg = { 'tree': 'You swing your axe at the tree.',
                    'rock': 'You take a swing at the rock.',
                    'fishing-spot': 'You cast your line\u2026' }[n.type] ?? 'You begin gathering.'
      flashClick(n.x, n.y, true)
      if (adj(n)) { send({ do: 'gather', nodeId: id }); feed(msg) }
      else intent = { kind: 'gather', id, msg }                // one click does it all
      return
    }

  if (blockedAt(world, x, y)) return
  flashClick(x, y, false)
  intent = { kind: 'walk', x, y }
  if (me.action) send({ do: 'stop' })
})

<script>
// ---- the key travels (v0.78): the key IS the citizen, and a citizen
// is not a hostage of one browser. EXPORT copies a self-labeled string
// (interval-key-v1.<pkcs8>.<pub>); IMPORT verifies the pair by signing
// a test message before it will replace anything, and warns before
// replacing a citizen this browser already holds. The string is a
// BEARER INSTRUMENT: whoever holds it is the citizen, share it only
// with your own devices.
// §0e: HAS THIS KEY BEEN TAKEN OUT OF THIS BROWSER? Recorded per public key,
// so importing a different citizen does not inherit the last one's answer, and
// a key that was imported from elsewhere already exists somewhere else and
// counts as exported.
function keyExported() {
  try {
    const saved = localStorage.getItem('interval-ownkey')
    if (!saved) return false
    const { pub } = JSON.parse(saved)
    return localStorage.getItem('interval-keyout:' + pub) === 'yes'
  } catch { return false }
}
function markKeyExported() {
  try {
    const saved = localStorage.getItem('interval-ownkey')
    if (!saved) return
    const { pub } = JSON.parse(saved)
    localStorage.setItem('interval-keyout:' + pub, 'yes')
  } catch {}
}
const IK_hex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)))
async function IK_verify(pk8, pub) {
  try {
    const priv = await crypto.subtle.importKey('pkcs8', IK_hex(pk8), { name: 'Ed25519' }, false, ['sign'])
    const pubk = await crypto.subtle.importKey('raw', IK_hex(pub), { name: 'Ed25519' }, false, ['verify'])
    const msg = new TextEncoder().encode('interval-key-check')
    const sig = await crypto.subtle.sign('Ed25519', priv, msg)
    return await crypto.subtle.verify('Ed25519', pubk, sig, msg)
  } catch { return false }
}
async function exportOwnKey() {
  const saved = localStorage.getItem('interval-ownkey')
  if (!saved) { alert('no key in this browser yet: enter the world once first'); return }
  const { pk8, pub } = JSON.parse(saved)
  const str = 'interval-key-v1.' + pk8 + '.' + pub
  try { await navigator.clipboard.writeText(str); alert('key copied. It IS your citizen: paste it only into your own devices.') }
  catch { prompt('copy your key (it IS your citizen):', str) }
  markKeyExported()
}
async function importOwnKey() {
  const str = (prompt('paste a key (interval-key-v1.\u2026 or an executor identity JSON):') ?? '').trim()
  if (!str) return
  let m9 = /^interval-key-v1\.([0-9a-f]+)\.([0-9a-f]+)$/.exec(str)
  if (!m9 && str.startsWith('{')) {
    // the executor's own tongue (v0.78): identities/*.json speaks
    // {playerId, privateKey} where privateKey is the raw 32-byte seed.
    // PKCS8 for Ed25519 is that same seed behind a fixed 16-byte
    // prefix, so the two formats are one key in two coats.
    try {
      const j9 = JSON.parse(str)
      if (/^[0-9a-f]{64}$/.test(j9.privateKey ?? '') && /^[0-9a-f]{64}$/.test(j9.playerId ?? ''))
        m9 = [null, '302e020100300506032b657004220420' + j9.privateKey, j9.playerId]
    } catch {}
  }
  if (!m9) { alert('that is not an interval key (paste interval-key-v1.\u2026 or the executor JSON)'); return }
  if (!(await IK_verify(m9[1], m9[2]))) { alert('this key does not prove itself: the pair does not match'); return }
  const cur = localStorage.getItem('interval-ownkey')
  if (cur) {
    const curPub = JSON.parse(cur).pub ?? ''
    if (curPub && curPub !== m9[2]
      && !confirm('this browser already holds citizen ' + curPub.slice(0, 8) + '\u2026 replace with '
        + m9[2].slice(0, 8) + '\u2026? Export the current key first if it has a life worth keeping.')) return
  }
  localStorage.setItem('interval-ownkey', JSON.stringify({ pk8: m9[1], pub: m9[2] }))
  location.reload()
}
for (const b9 of document.querySelectorAll('[data-ik]'))
  b9.addEventListener('click', (e9) => { e9.stopPropagation(); (b9.dataset.ik === 'export' ? exportOwnKey : importOwnKey)() })
</script>
</body>
</html>
