  // legs (alternate while walking)

  // and the citizen reads as somebody stood behind a horse rather than on it.
  if (o.mounted) {

    // rather than to the citizen: the hip is at the hem (which is now the
    // horse's back), the knee is forward over the barrel, and the boot hangs
    // at the girth. Drawn DARK -- the first cut used the breeches' own brown
    // over a brown barrel and the rider came out legless, which reads as
    // floating just as badly as standing does.
    const F3 = o.face ?? 1

    cx.lineTo(kneeX, Y + 36); cx.lineTo(hipX - F3 * 2, Y + 32); cx.closePath(); cx.fill()

      cx.moveTo(hipX - F3 * 2, Y + 28); cx.lineTo(kneeX, Y + 33)
      cx.lineTo(kneeX, Y + 34); cx.lineTo(hipX - F3 * 2, Y + 29); cx.closePath(); cx.fill()
    }
    cx.fillStyle = o.legs ? '#e8b93a' : '#2b2016'
    cx.fillRect(kneeX - 1.8, Y + 34, 3.6, 5)              // the shin
    cx.fillStyle = '#2b2016'
    cx.fillRect(kneeX - 2.3, Y + 38.4, 4.6, 2.2)          // boot, in the stirrup
  } else {

        const fl = 0.6 + 0.4 * Math.sin(now / 190 + n.x * 2.1)

        cx.beginPath()

        cx.fillStyle = nightH ? 'rgba(255,232,150,.85)' : 'rgba(230,150,60,.5)'

        // logs on the fire

        if (dr) {

          cx.beginPath(); cx.moveTo(bx + 20, by - 2); cx.lineTo(bx + 20, by + 7); cx.stroke()

            cx.beginPath(); cx.arc(bx + 20, by + 16, 7, 0, 7); cx.fill()

            cx.strokeStyle = '#41290f'; cx.lineWidth = 1.2; cx.stroke()

        poly([[X+5,Y+33],[X+35,Y+33],[X+35,Y+17],[X+5,Y+17]], '#4a3f2e', '#1c1710')  // the counter

    layer.push({ z: Z(g2.y, 1), draw: () => {

      cx.font = '6.5px Verdana'; cx.textAlign = 'center'

      // Three beasts set about a citizen at once and they swing every other

      if ((m.rootedUntil ?? 0) > s.tick) rootBind(X, Y)
      if (m.type === 'dragon') {

        const _tgt = m.mad ? s.players?.[m.mad] : null
        const F = _tgt ? (_tgt.x >= m.x ? -1 : 1) : (MF < 0 ? -1 : 1)

        cx.beginPath(); cx.ellipse(X + 20, Y + 34, 30, 8, 0, 0, 7); cx.fill()

        for (const side of [-1, 1]) {

          const elbX = X + 20 + side * 20, elbY = Y - 14 - beat * 5

            const fx = X + 20 + (tipX - X - 20) * (k / 4), fy = tipY + (Y + 22 - tipY) * (1 - k / 4)

          cx.strokeStyle = 'rgba(140,86,104,.55)'; cx.lineWidth = 1.4     // the finger bones

            const fx = X + 20 + (tipX - X - 20) * (k / 4), fy = tipY + (Y + 22 - tipY) * (1 - k / 4)

        const tw = Math.sin(now / 900) * 6
        cx.strokeStyle = '#4a2a20'; cx.lineWidth = 7; cx.lineCap = 'round'
        cx.beginPath(); cx.moveTo(X + 20, Y + 26)
        cx.quadraticCurveTo(X + 20 + F * 22, Y + 34 + tw * 0.4, X + 20 + F * 34, Y + 14 + tw)
        cx.stroke(); cx.lineWidth = 3
        cx.beginPath(); cx.moveTo(X + 20 + F * 34, Y + 14 + tw)
        cx.lineTo(X + 20 + F * 40, Y + 6 + tw); cx.stroke(); cx.lineCap = 'butt'
        poly([[X+20+F*40,Y+6+tw],[X+20+F*47,Y+2+tw],[X+20+F*41,Y+12+tw]], '#6b3a2a')

        // ---- BODY: a barrel chest, not a lump ----
        cx.fillStyle = '#5a3226'
        cx.beginPath(); cx.ellipse(X + 20, Y + 19 + breathe, 13, 11, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#241009'; cx.lineWidth = 1.4; cx.stroke()
        cx.fillStyle = '#7a4a34'                                   // lit along the top
        cx.beginPath(); cx.ellipse(X + 20, Y + 15 + breathe, 10, 6, 0, 0, 7); cx.fill()
        cx.fillStyle = '#c9a86a'                                   // belly plates
        for (let r = 0; r < 3; r++) cx.fillRect(X + 15, Y + 22 + r * 3 + breathe, 10 - r * 2, 1.8)
        // haunch and a foot planted
        cx.fillStyle = '#4a2a20'
        cx.beginPath(); cx.ellipse(X + 20 + F * 9, Y + 26 + breathe, 7, 6, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#c9b98a'; cx.lineWidth = 1.6
        for (const cw of [-3, 0, 3]) { cx.beginPath()
          cx.moveTo(X + 20 + F * 12 + cw * 0.4, Y + 31); cx.lineTo(X + 20 + F * 14 + cw, Y + 34); cx.stroke() }

        // ---- SPINE: a ridge of plates from shoulder to tail ----
        cx.fillStyle = '#8a5a3a'
        for (let r = 0; r < 5; r++) {
          const sx = X + 20 + F * (r * 4 - 4), sy = Y + 12 + r * 2.4 + breathe
          poly([[sx - 2.5, sy], [sx, sy - 5 + r * 0.5], [sx + 2.5, sy]], '#8a5a3a')
        }

        // ---- NECK and HEAD: long, out over the tile edge ----
        cx.strokeStyle = '#5a3226'; cx.lineWidth = 9; cx.lineCap = 'round'
        cx.beginPath(); cx.moveTo(X + 20 - F * 4, Y + 14 + breathe)
        cx.quadraticCurveTo(X + 20 - F * 18, Y + 2 + breathe, HX + F * 4, HY + 4)
        cx.stroke(); cx.lineCap = 'butt'
        // skull: a wedge with a snout, not a ball
        poly([[HX + F * 8, HY - 1], [HX - F * 6, HY - 5], [HX - F * 11, HY + 1],
              [HX - F * 6, HY + 6], [HX + F * 7, HY + 5]], '#6e4030', '#241009')
        poly([[HX - F * 6, HY + 2], [HX - F * 12, HY + 2], [HX - F * 6, HY + 6]], '#4a2a20')  // jaw
        cx.strokeStyle = '#c9b98a'; cx.lineWidth = 2.2                    // horns, swept back
        for (const hh of [-2.5, 2.5]) {
          cx.beginPath(); cx.moveTo(HX + F * 4, HY - 3 + hh * 0.6)
          cx.quadraticCurveTo(HX + F * 11, HY - 8 + hh, HX + F * 15, HY - 5 + hh * 1.4); cx.stroke()
        }
        cx.fillStyle = engaged ? '#ff6a1f' : '#e2a63e'                    // the eye
        cx.beginPath(); cx.ellipse(HX - F * 2, HY - 1, 2.6, 1.8, 0, 0, 7); cx.fill()
        cx.fillStyle = '#1a0d06'
        cx.fillRect(HX - F * 2 - 0.5, HY - 2.6, 1, 3.2)                   // a slit pupil
        cx.fillStyle = 'rgba(255,140,40,' + (engaged ? 0.22 : 0.10) + ')'
        cx.beginPath(); cx.arc(HX - F * 2, HY - 1, 8, 0, 7); cx.fill()

        // ---- BREATH: smoke always, fire when it is fighting ----
        for (let k = 0; k < 4; k++) {
          const t2 = ((now / (1400 + k * 380)) + k * 0.25) % 1
          const bx = HX - F * (11 + t2 * 16), by = HY + 3 - t2 * 7
          cx.fillStyle = engaged
            ? 'rgba(255,' + (90 + k * 34) + ',' + (20 + k * 10) + ',' + (0.55 * (1 - t2)) + ')'
            : 'rgba(158,148,140,' + (0.20 * (1 - t2)) + ')'
          cx.beginPath(); cx.arc(bx, by, 1.8 + t2 * (engaged ? 6 : 4.5), 0, 7); cx.fill()
        }

        // ---- §6w: THE FIRE ----
        //
        // It does fourteen through armour from five tiles and there was
        // nothing on the screen to say so. A citizen crossing that ground was
        // taking damage from a creature that appeared to be standing still,
        // which is the worst kind of unfair: not hard, illegible.
        //
        // Everything needed is in the state. A beast now carries `lastSwing`,
        // so the window knows the tick it last struck; `mad` says who it
        // struck at; and the distance says whether that was a claw or a
        // breath. No new field, no message -- the world already recorded it.
        {
          const meD = s.players?.[myId]
          const since = s.tick - (m.lastSwing ?? -99)
          const dist = meD ? Math.max(Math.abs(meD.x - m.x), Math.abs(meD.y - m.y)) : 99
          // a breath, not a claw: it reached me from further than arm's length
          if (meD && m.mad === myId && since >= 0 && since <= 3 && dist > 1 && dist <= 5) {
            const life = 1 - (since + ((now / 600) % 1)) / 4      // fades over its four ticks
            if (life > 0) {
              const ang = Math.atan2(meD.y - m.y, meD.x - m.x)
              const reach = dist * TILE
              cx.save()
              cx.translate(HX - F * 6, HY + 2)
              cx.rotate(ang)
              // the cone: bright at the mouth, thinning and reddening outward
              const grad = cx.createLinearGradient(0, 0, reach, 0)
              grad.addColorStop(0, 'rgba(255,236,170,' + (0.85 * life) + ')')
              grad.addColorStop(0.25, 'rgba(255,168,50,' + (0.7 * life) + ')')
              grad.addColorStop(0.7, 'rgba(226,74,26,' + (0.4 * life) + ')')
              grad.addColorStop(1, 'rgba(120,30,12,0)')
              cx.fillStyle = grad
              cx.beginPath()
              cx.moveTo(0, -3)
              cx.quadraticCurveTo(reach * 0.5, -10 - life * 6, reach, -14 - life * 8)
              cx.lineTo(reach, 14 + life * 8)
              cx.quadraticCurveTo(reach * 0.5, 10 + life * 6, 0, 3)
              cx.closePath(); cx.fill()
              // embers riding it outward
              for (let k = 0; k < 7; k++) {
                const t3 = ((now / 300 + k * 0.17) % 1)
                const ex = t3 * reach, ey = Math.sin(k * 2.3 + now / 200) * (4 + t3 * 12)
                cx.fillStyle = 'rgba(255,' + (190 - k * 14) + ',90,' + (life * (1 - t3) * 0.9) + ')'
                cx.beginPath(); cx.arc(ex, ey, 1 + (1 - t3) * 2.4, 0, 7); cx.fill()
              }
              cx.restore()
              // and the mouth itself, lit
              cx.fillStyle = 'rgba(255,220,140,' + (0.9 * life) + ')'
              cx.beginPath(); cx.arc(HX - F * 6, HY + 2, 3.5 + life * 2, 0, 7); cx.fill()
            }
          }
        }

        cx.fillStyle = '#4a1008'; cx.fillRect(X + 2, Y - 34, 36, 4.4)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 2, Y - 34, 36 * Math.max(0, m.hp / 420), 4.4)
        cx.fillStyle = 'rgba(226,182,62,.9)'
        cx.font = '600 8px ui-monospace,monospace'; cx.textAlign = 'center'
        cx.fillText('THE DRAGON', X + 20, Y - 37); cx.textAlign = 'left'
        return
      }
      if (m.type === 'siren') {
        // SHE WEARS THE FACE OF WHOEVER TOOK HER.
        //
        // Every other creature here looks like itself. She looks like a
        // citizen — the same silhouette, the same proportions — and that is
        // the whole idea, so it has to be the first thing you see. When she
        // is bound she takes that citizen's colours; unbound she is the
        // colour of the water she came out of.
        const mine2 = m.bound && m.bound === myId
        const taken = m.bound && m.bound !== myId
        const boundP = m.bound ? s.players?.[m.bound] : null
        const sway = Math.sin(now / 1100 + m.x) * 1.4
        const shimmer = 0.5 + 0.5 * Math.sin(now / 700)
        // the water at her feet never quite settles
        for (let r = 0; r < 3; r++) {
          const t3 = ((now / 1600) + r * 0.33) % 1
          cx.strokeStyle = 'rgba(150,200,220,' + (0.22 * (1 - t3)) + ')'
          cx.lineWidth = 1
          cx.beginPath(); cx.ellipse(X + 20, Y + 32, 6 + t3 * 16, 2 + t3 * 5, 0, 0, 7); cx.stroke()
        }
        const dim = taken ? 0.34 : 1     // already taken: she is not for you
        const body = boundP ? (capeOf(boundP) ? '#6a5a86' : '#3f5f8a') : '#4a7a8c'
        const skinC = '#cfe4ea'
        // the shape of a citizen, and deliberately the same proportions
        cx.globalAlpha = dim
        cx.fillStyle = body
        cx.fillRect(X + 15 + sway * 0.3, Y + 16, 10, 15)
        cx.fillStyle = skinC
        cx.beginPath(); cx.arc(X + 20 + sway * 0.4, Y + 11, 5.2, 0, 7); cx.fill()
        // hair, which is the part that is wrong: it moves like water
        cx.strokeStyle = 'rgba(120,180,200,' + (0.55 + 0.25 * shimmer) + ')'
        cx.lineWidth = 1.6
        for (let k = 0; k < 6; k++) {
          const off = (k - 2.5) * 1.9
          cx.beginPath()
          cx.moveTo(X + 20 + off + sway * 0.4, Y + 7)
          cx.quadraticCurveTo(X + 20 + off * 1.7 + Math.sin(now / 500 + k) * 3, Y + 17,
                              X + 20 + off * 2.1 + Math.sin(now / 430 + k) * 4, Y + 27)
          cx.stroke()
        }
        // no face. Two lights where eyes would be.
        cx.fillStyle = 'rgba(226,246,255,' + (0.7 + 0.3 * shimmer) + ')'
        for (const ex of [-1.9, 1.9]) {
          cx.beginPath(); cx.arc(X + 20 + ex + sway * 0.4, Y + 10.5, 1.1, 0, 7); cx.fill()
        }
        cx.globalAlpha = 1
        // and what she is holding, if she has taken somebody's shape
        if (boundP?.equipment?.weapon?.item) {
          cx.globalAlpha = dim
          cx.save(); cx.translate(X + 27, Y + 24); cx.rotate(0.7)
          const wi = boundP.equipment.weapon.item
          cx.strokeStyle = 'rgba(190,225,240,.8)'; cx.lineWidth = 1.6
          if (RANGED_ITEMS.has(wi)) {
            cx.beginPath(); cx.moveTo(-1, -6); cx.quadraticCurveTo(4.4, 1, -1, 8); cx.stroke()
          } else {
            cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, 9); cx.stroke()
          }
          cx.restore(); cx.globalAlpha = 1
        }
        if (taken) {                       // somebody else's fight
          cx.fillStyle = 'rgba(150,200,220,.75)'
          cx.font = '600 7px ui-monospace,monospace'; cx.textAlign = 'center'
          cx.fillText('taken', X + 20, Y - 4); cx.textAlign = 'left'
        }
        cx.fillStyle = '#1c3038'; cx.fillRect(X + 6, Y - 1, 28, 3.4)
        cx.fillStyle = mine2 ? '#7fd4e8' : '#4a8a9c'
        cx.fillRect(X + 6, Y - 1, 28 * Math.max(0, m.hp / 60), 3.4)
        return
      }
      if (m.type === 'great-spider') {
        // wide, low, and eight-legged. It should read as a thing that has been
        // sitting here a long time.
        const twitch = Math.sin(now / 380 + m.x) * 1.6
        const breathe = Math.sin(now / 1300) * 1.2
        shadow(X, Y, 16)
        // LEGS: four a side, jointed, reaching well past the tile
        for (const side of [-1, 1]) {
          cx.strokeStyle = '#2e2028'; cx.lineWidth = 2.2; cx.lineCap = 'round'
          for (let k = 0; k < 4; k++) {
            const lift = Math.sin(now / 300 + k * 1.7 + (side > 0 ? 0 : 2.4)) * 1.8
            const spread = 12 + k * 4
            const kneeY = Y + 12 + k * 3 - 5 - lift
            cx.beginPath()
            cx.moveTo(X + 20 + side * 5, Y + 18 + k * 2.2)
            cx.quadraticCurveTo(X + 20 + side * (spread * 0.6), kneeY,
                                X + 20 + side * spread, Y + 26 + k * 2 + lift)
            cx.stroke()
          }
          cx.lineCap = 'butt'
        }
        // ABDOMEN, the big part, behind
        cx.fillStyle = '#3d2b34'
        cx.beginPath(); cx.ellipse(X + 20, Y + 24 + breathe, 12, 10, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#1e1418'; cx.lineWidth = 1.3; cx.stroke()
        cx.fillStyle = '#5a3f4c'                       // the pale mark on its back
        cx.beginPath(); cx.ellipse(X + 20, Y + 21 + breathe, 6, 5, 0, 0, 7); cx.fill()
        cx.fillStyle = '#c9b08a'
        poly([[X + 20, Y + 17 + breathe], [X + 23, Y + 24 + breathe],
              [X + 20, Y + 22 + breathe], [X + 17, Y + 24 + breathe]], '#c9b08a')
        // CEPHALOTHORAX and the eyes
        cx.fillStyle = '#4a3540'
        cx.beginPath(); cx.ellipse(X + 20, Y + 13 + twitch * 0.3, 8, 6.5, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#1e1418'; cx.lineWidth = 1.1; cx.stroke()
        cx.fillStyle = '#0f0a0c'                       // eight eyes, in two rows
        for (const [ex, ey, r] of [[-4,-2,1.5],[-1.4,-3,1.9],[1.4,-3,1.9],[4,-2,1.5],
                                   [-2.6,0.6,1.1],[-0.9,1.2,1.3],[0.9,1.2,1.3],[2.6,0.6,1.1]]) {
          cx.beginPath(); cx.arc(X + 20 + ex, Y + 13 + ey + twitch * 0.3, r, 0, 7); cx.fill()
        }
        cx.fillStyle = 'rgba(226,90,110,.55)'
        for (const [ex, ey] of [[-1.4,-3],[1.4,-3]]) {
          cx.beginPath(); cx.arc(X + 20 + ex, Y + 13 + ey + twitch * 0.3, 0.8, 0, 7); cx.fill()
        }
        // fangs
        cx.strokeStyle = '#c9b08a'; cx.lineWidth = 1.6; cx.lineCap = 'round'
        for (const fx of [-2.6, 2.6]) {
          cx.beginPath(); cx.moveTo(X + 20 + fx, Y + 18)
          cx.lineTo(X + 20 + fx * 0.6, Y + 22 + twitch * 0.4); cx.stroke()
        }
        cx.lineCap = 'butt'
        // and the strand it hangs from, going up out of the tile
        cx.strokeStyle = 'rgba(226,232,240,.22)'; cx.lineWidth = 1
        cx.beginPath(); cx.moveTo(X + 20, Y + 7); cx.lineTo(X + 20, Y - 20); cx.stroke()
        cx.fillStyle = '#2b1a20'; cx.fillRect(X + 2, Y - 8, 36, 4.4)
        cx.fillStyle = '#a8446a'; cx.fillRect(X + 2, Y - 8, 36 * Math.max(0, m.hp / 300), 4.4)
        cx.fillStyle = 'rgba(226,182,62,.9)'
        cx.font = '600 8px ui-monospace,monospace'; cx.textAlign = 'center'
        cx.fillText('THE SPIDER', X + 20, Y - 11); cx.textAlign = 'left'
        return
      }
      if (m.type === 'boar') {
        cx.fillStyle = '#4a3a2c'; cx.beginPath(); cx.ellipse(X + 20, Y + 25, 13, 8, 0, 0, 7); cx.fill()
        cx.fillStyle = '#3a2c20'; cx.beginPath(); cx.ellipse(X + 30, Y + 22, 7, 6, 0, 0, 7); cx.fill()
        cx.fillStyle = '#ddd6c4'                                        // tusks
        cx.beginPath(); cx.moveTo(X + 35, Y + 23); cx.lineTo(X + 38, Y + 19); cx.lineTo(X + 36, Y + 24); cx.fill()
        cx.fillStyle = '#2a1f16'
        for (const bx of [13, 18, 24, 28]) cx.fillRect(X + bx, Y + 31, 3, 6)
        cx.fillStyle = '#c46a2a'; cx.beginPath(); cx.arc(X + 32, Y + 20, 1.6, 0, 7); cx.fill()
        return
      }
      if (m.type === 'mountain-goat') {
        cx.fillStyle = '#cdc3b0'; cx.beginPath(); cx.ellipse(X + 19, Y + 24, 11, 7, 0, 0, 7); cx.fill()
        cx.fillStyle = '#e4dcc9'; cx.beginPath(); cx.arc(X + 29, Y + 20, 6, 0, 7); cx.fill()
        cx.strokeStyle = '#6b5a44'; cx.lineWidth = 2                    // swept horns
        cx.beginPath(); cx.moveTo(X + 29, Y + 15); cx.quadraticCurveTo(X + 35, Y + 11, X + 32, Y + 8); cx.stroke()
        cx.fillStyle = '#8a7f6c'
        for (const bx of [13, 18, 23]) cx.fillRect(X + bx, Y + 30, 2, 7)
        return
      }
      if (m.type === 'carrion-crow') {
        const flap = Math.sin(((world?.tick ?? 0) + m.x * 5) * 0.4) * 2
        cx.fillStyle = '#1c1c22'; cx.beginPath(); cx.ellipse(X + 20, Y + 24, 8, 6, 0, 0, 7); cx.fill()
        cx.beginPath(); cx.moveTo(X + 13, Y + 22 - flap); cx.lineTo(X + 20, Y + 20)
        cx.lineTo(X + 27, Y + 22 + flap); cx.lineTo(X + 20, Y + 26); cx.fill()
        cx.fillStyle = '#2a2a32'; cx.beginPath(); cx.arc(X + 26, Y + 18, 4, 0, 7); cx.fill()
        cx.fillStyle = '#c9a03a'
        cx.beginPath(); cx.moveTo(X + 29, Y + 18); cx.lineTo(X + 34, Y + 19); cx.lineTo(X + 29, Y + 20); cx.fill()
        return
      }
      // §7cn: THE MERE-LAMPREY. A mouth on a rope, half out of the reed-water.
      //
      // It has no face and no jaw -- a funnel of rasping rings, which is what
      // the animal actually is -- and it never leaves the water entirely. The
      // rings turn, because a lamprey's mouth is the part that moves.
      //
      // AND A SPENT ONE IS DRAWN. `spent` means this body will never rise
      // again, and the window must not answer that with an empty tile: the
      // reed-bed stays, the thing lies in it, grey and still, and a citizen
      // who walks out here finds the PLACE rather than nothing. §7a's rule --
      // the road still arrives at the rock -- said this first.
      if (m.type === 'mere-lamprey') {
        const spent = (m.spent ?? 0) === 1
        const t9 = (world?.tick ?? 0)
        const rise = spent ? 0 : Math.sin(now / 900 + m.x) * 2.4
        shadow(X, Y, 11)
        // the water it stands in, always
        cx.fillStyle = 'rgba(58,84,74,.55)'
        cx.beginPath(); cx.ellipse(X + 20, Y + 29, 13, 4.6, 0, 0, 7); cx.fill()
        cx.strokeStyle = 'rgba(120,150,120,.4)'; cx.lineWidth = 1
        cx.beginPath(); cx.ellipse(X + 20, Y + 29, 9, 3, 0, 0, 7); cx.stroke()
        // the body: a rope, not a fish. No fins anywhere on it.
        cx.strokeStyle = spent ? '#4e5148' : '#3f4a3a'
        cx.lineWidth = 6; cx.lineCap = 'round'
        cx.beginPath(); cx.moveTo(X + 20, Y + 30)
        if (spent) cx.quadraticCurveTo(X + 27, Y + 28, X + 33, Y + 29)
        else cx.quadraticCurveTo(X + 16, Y + 20 + rise, X + 21, Y + 10 - rise)
        cx.stroke()
        cx.strokeStyle = spent ? 'rgba(120,124,112,.5)' : 'rgba(96,112,86,.7)'
        cx.lineWidth = 1.4
        cx.beginPath(); cx.moveTo(X + 20, Y + 29)
        if (spent) cx.quadraticCurveTo(X + 27, Y + 27, X + 32, Y + 28)
        else cx.quadraticCurveTo(X + 17, Y + 20 + rise, X + 21, Y + 11 - rise)
        cx.stroke()
        // the gill pores, seven a side, which is the giveaway
        cx.fillStyle = spent ? 'rgba(70,72,64,.8)' : 'rgba(24,32,22,.85)'
        for (let k = 0; k < 7; k++) {
          const gy = spent ? Y + 28.5 : Y + 15 + k * 1.7 - rise * 0.5
          const gx = spent ? X + 25 + k * 1.3 : X + 19.2 + k * 0.28
          cx.beginPath(); cx.arc(gx, gy, 0.85, 0, 7); cx.fill()
        }
        // THE MOUTH. Rings of teeth, and they turn.
        const mx = spent ? X + 20 : X + 21, my = spent ? Y + 30 : Y + 9 - rise
        const spin = spent ? 0 : now / 1400
        cx.fillStyle = spent ? '#5c5f54' : '#7d8a6a'
        cx.beginPath(); cx.arc(mx, my, 6.2, 0, 7); cx.fill()
        cx.fillStyle = spent ? '#2e302a' : '#241c18'
        cx.beginPath(); cx.arc(mx, my, 4.2, 0, 7); cx.fill()
        if (!spent) {
          cx.fillStyle = '#e8e2cc'
          for (let ring = 0; ring < 2; ring++) {
            const rad = 5.4 - ring * 1.9
            for (let k = 0; k < 9; k++) {
              const a = spin * (ring ? -1 : 1) + (k / 9) * Math.PI * 2
              cx.beginPath()
              cx.arc(mx + Math.cos(a) * rad, my + Math.sin(a) * rad, 0.75, 0, 7)
              cx.fill()
            }
          }
        }
        if (spent) {
          cx.fillStyle = 'rgba(150,150,138,.7)'
          cx.font = '600 7px ui-monospace,monospace'; cx.textAlign = 'center'
          cx.fillText('spent', X + 20, Y - 4); cx.textAlign = 'left'
          return
        }
        // the hitpoint bar, and UNDER it the tally -- how many lives this one
        // has left of the sixty-four it was born with. It is the only number
        // in this world that only ever goes down.
        const left = 64 - (m.slain ?? 0)
        cx.fillStyle = '#22301e'; cx.fillRect(X + 6, Y - 1, 28, 3.4)
        cx.fillStyle = '#8fbf6a'
        cx.fillRect(X + 6, Y - 1, 28 * Math.max(0, m.hp / 44), 3.4)
        cx.fillStyle = '#4a5a3a'; cx.fillRect(X + 6, Y + 3, 28, 2)
        cx.fillStyle = left <= 8 ? '#d8a03a' : '#7a9a5a'
        cx.fillRect(X + 6, Y + 3, 28 * Math.max(0, left / 64), 2)
        cx.fillStyle = left <= 8 ? '#e8c060' : 'rgba(180,200,160,.8)'
        cx.font = '600 7px ui-monospace,monospace'; cx.textAlign = 'center'
        cx.fillText(left + ' left', X + 20, Y - 4); cx.textAlign = 'left'
        return
      }
      if (m.type === 'fen-adder') {
        cx.strokeStyle = '#5a6b34'; cx.lineWidth = 4; cx.lineCap = 'round'
        cx.beginPath(); cx.moveTo(X + 9, Y + 30)
        cx.quadraticCurveTo(X + 20, Y + 20, X + 31, Y + 27); cx.stroke()
        cx.lineWidth = 1.6; cx.strokeStyle = '#2f3a1c'
        cx.beginPath(); cx.moveTo(X + 12, Y + 28); cx.quadraticCurveTo(X + 20, Y + 22, X + 29, Y + 26); cx.stroke()
        cx.fillStyle = '#6d8140'; cx.beginPath(); cx.arc(X + 32, Y + 27, 3.4, 0, 7); cx.fill()
        cx.fillStyle = '#d8b83c'; cx.beginPath(); cx.arc(X + 33, Y + 26, 1.2, 0, 7); cx.fill()
        return
      }
      // §7cr: THE GIBBET-DEAD, which was drawing NOTHING. The same fault the
      // scree-imps had two notes down: a creature in the world that the window
      // does not know about is empty air with hitpoints, and this one stands in
      // a lit cage in the Moorgrave where everybody will look at it.
      //
      // It is hunched, wrong, and it winds up to throw -- the hurl is on the
      // beat of `every: 4`, so what you see is the arm coming back before the
      // stone lands, which is the only warning a citizen gets at four tiles.
      if (m.type === 'gibbet-dead') {
        const t7 = (world?.tick ?? 0)
        const phase = ((t7 % 4) + 4) % 4              // matches MOB_STATS.every
        const wind = phase === 3 ? 1 : phase === 0 ? -0.6 : 0
        const sway = Math.sin((t7 + m.y * 5) * 0.09) * 1.2
        cx.fillStyle = 'rgba(70,90,60,.28)'           // the smell of it
        cx.beginPath(); cx.ellipse(X + 20, Y + 26, 12, 14, 0, 0, 7); cx.fill()
        cx.fillStyle = '#4a4738'                       // the shroud, gone to rags
        cx.beginPath(); cx.moveTo(X + 11, Y + 37); cx.lineTo(X + 14 + sway, Y + 15)
        cx.lineTo(X + 26 + sway, Y + 15); cx.lineTo(X + 29, Y + 37)
        for (let k = 0; k < 4; k++) cx.lineTo(X + 27 - k * 5, Y + 34 + (k % 2) * 3)
        cx.closePath(); cx.fill()
        cx.fillStyle = '#6a6752'                       // the arm, winding back
        cx.save(); cx.translate(X + 20 + sway, Y + 20); cx.rotate(wind * 0.9)
        cx.fillRect(-2, -2, 14, 4)
        cx.fillStyle = '#8a8578'                       // and what is in the hand
        cx.beginPath(); cx.arc(13, 0, 3, 0, 7); cx.fill()
        cx.restore()
        cx.fillStyle = '#b8b09a'                       // the skull
        cx.beginPath(); cx.arc(X + 20 + sway, Y + 14, 5.5, 0, 7); cx.fill()
        cx.fillStyle = '#2a1c14'                       // sockets, and the jaw hanging
        cx.beginPath(); cx.arc(X + 18 + sway, Y + 13, 1.7, 0, 7); cx.fill()
        cx.beginPath(); cx.arc(X + 22.4 + sway, Y + 13, 1.7, 0, 7); cx.fill()
        cx.fillRect(X + 18.5 + sway, Y + 17, 3, 3)
        return
      }
      if (m.type === 'barrow-wight') {
        const drift = Math.sin(((world?.tick ?? 0) + m.y * 3) * 0.12) * 1.4
        cx.fillStyle = 'rgba(120,150,140,.22)'
        cx.beginPath(); cx.ellipse(X + 20, Y + 26 + drift, 11, 13, 0, 0, 7); cx.fill()
        cx.fillStyle = '#6d7b72'
        cx.beginPath(); cx.moveTo(X + 12, Y + 36); cx.lineTo(X + 15, Y + 12 + drift)
        cx.lineTo(X + 25, Y + 12 + drift); cx.lineTo(X + 28, Y + 36); cx.fill()
        cx.fillStyle = '#c9c2ac'; cx.beginPath(); cx.arc(X + 20, Y + 13 + drift, 5.5, 0, 7); cx.fill()
        cx.fillStyle = '#1a2420'
        cx.beginPath(); cx.arc(X + 18, Y + 13 + drift, 1.5, 0, 7); cx.fill()
        cx.beginPath(); cx.arc(X + 22, Y + 13 + drift, 1.5, 0, 7); cx.fill()
        return
      }
      if (m.type === 'scree-imp') {
        // §12: the four things living in the South Pass rockfall. Small, grey,
        // and made of the same stone the diggers are breaking -- they were
        // drawing NOTHING, so a citizen a week into the dig would have been
        // bitten by empty air.
        const bob = Math.sin(((world?.tick ?? 0) + m.x * 7 + m.y * 3) * 0.18) * 1.6
        cx.fillStyle = '#5d5a52'
        cx.beginPath(); cx.arc(X + 20, Y + 24 + bob, 8, 0, 7); cx.fill()
        cx.fillStyle = '#6e6b61'
        cx.beginPath(); cx.moveTo(X + 13, Y + 19 + bob); cx.lineTo(X + 16, Y + 10 + bob)
        cx.lineTo(X + 19, Y + 18 + bob); cx.closePath(); cx.fill()
        cx.beginPath(); cx.moveTo(X + 21, Y + 18 + bob); cx.lineTo(X + 25, Y + 10 + bob)
        cx.lineTo(X + 27, Y + 19 + bob); cx.closePath(); cx.fill()
        cx.fillStyle = '#d8963c'
        cx.beginPath(); cx.arc(X + 17, Y + 23 + bob, 1.7, 0, 7); cx.fill()
        cx.beginPath(); cx.arc(X + 24, Y + 23 + bob, 1.7, 0, 7); cx.fill()
        return
      }
      if (m.type === 'dummy' || m.type === 'butt') {
        // §7t: THE YARD. Not creatures -- a straw man on a post and a bound
        // straw butt. They are mobs so that `attack`, the specials and a drawn
        // bow all work on them unchanged, but nothing about them should read
        // as alive: no eyes, no idle sway, and they never move.
        if (m.type === 'dummy') {
          cx.fillStyle = '#6b5334'; cx.fillRect(X + 18, Y + 24, 5, 15)
          cx.fillStyle = '#a8863a'; cx.fillRect(X + 8, Y + 17, 25, 5)     // the crossbar
          cx.fillStyle = '#c9a94e'
          cx.beginPath(); cx.arc(X + 20, Y + 13, 8, 0, 7); cx.fill()      // the straw head
          cx.strokeStyle = '#5a4a2a'; cx.lineWidth = 1.6
          cx.strokeRect(X + 12, Y + 8, 16, 12)
          cx.strokeStyle = 'rgba(90,70,40,.6)'
          for (let i = 0; i < 3; i++) { cx.beginPath()
            cx.moveTo(X + 13 + i * 5, Y + 9); cx.lineTo(X + 13 + i * 5, Y + 19); cx.stroke() }
        } else {
          cx.fillStyle = '#6b5334'; cx.fillRect(X + 18, Y + 28, 4, 11)
          const rings = [[13, '#d8c07a'], [10, '#b8983f'], [6.5, '#8a6f2a'], [3, '#c4561a']]
          for (const [r, col] of rings) { cx.fillStyle = col
            cx.beginPath(); cx.arc(X + 20, Y + 18, r, 0, 7); cx.fill() }
        }
        return
      }
      if (m.type === 'sheep') {
        // a low woolly bundle with a dark face: it should read at a glance as
        // the one thing out here that is not going to do anything to you
        const graze = Math.sin(now / 1300 + m.x * 0.7) * 1.6      // the head dips
        const drift = Math.sin(now / 1900 + m.y * 0.5) * 0.8
        shadow(X, Y, 11)
        cx.strokeStyle = '#6b6355'; cx.lineWidth = 1.6           // four legs
        for (const lx of [-6, -2, 3, 7]) {
          cx.beginPath(); cx.moveTo(X + 20 + lx, Y + 24); cx.lineTo(X + 20 + lx, Y + 30); cx.stroke()
        }
        cx.fillStyle = '#e8e4d8'                                  // the fleece
        cx.beginPath(); cx.ellipse(X + 19 + drift, Y + 20, 12, 8.5, 0, 0, 7); cx.fill()
        cx.fillStyle = '#d4cfc0'                                  // clumps of it
        for (const [wx, wy, wr] of [[-7, -4, 4], [0, -6, 4.6], [7, -3, 4], [-4, 3, 3.6], [5, 3, 3.6]]) {
          cx.beginPath(); cx.arc(X + 19 + drift + wx, Y + 20 + wy, wr, 0, 7); cx.fill()
        }
        cx.strokeStyle = '#b8b2a2'; cx.lineWidth = 1
        cx.beginPath(); cx.ellipse(X + 19 + drift, Y + 20, 12, 8.5, 0, 0, 7); cx.stroke()
        cx.fillStyle = '#3a352e'                                  // the face, dipped to the grass
        cx.beginPath(); cx.ellipse(X + 31 + drift, Y + 20 + graze, 4.4, 3.6, 0.3, 0, 7); cx.fill()
        cx.fillStyle = '#2a251f'                                  // ears
        for (const ey of [-3, 3]) {
          cx.beginPath(); cx.ellipse(X + 29 + drift, Y + 18 + graze + ey, 2.2, 1.2, 0.4, 0, 7); cx.fill()
        }
        cx.fillStyle = '#f0ece0'                                  // one eye
        cx.beginPath(); cx.arc(X + 32 + drift, Y + 19 + graze, 0.9, 0, 7); cx.fill()
        return
      }
      if (m.type === 'shore-crab') {
        // wide, low and armoured: it should read as a thing you have to open
        // rather than a thing you have to survive
        const sway = Math.sin(now / 700 + m.x) * 1.4
        const claw = Math.sin(now / 420 + m.y) * 2.2
        shadow(X, Y, 13)
        for (const side of [-1, 1]) {                       // legs, four a side
          cx.strokeStyle = '#7a3b2a'; cx.lineWidth = 1.8; cx.lineCap = 'round'
          for (let k = 0; k < 4; k++) {
            const ly = Y + 19 + k * 3
            cx.beginPath(); cx.moveTo(X + 20 + side * 7, ly)
            cx.quadraticCurveTo(X + 20 + side * (13 + k), ly + 2, X + 20 + side * (15 + k * 0.6), ly + 6)
            cx.stroke()
          }
          cx.lineCap = 'butt'
        }
        // the shell
        cx.fillStyle = '#a34a2c'
        cx.beginPath(); cx.ellipse(X + 20, Y + 20 + sway * 0.4, 13, 9, 0, 0, 7); cx.fill()
        cx.strokeStyle = '#5e2415'; cx.lineWidth = 1.4; cx.stroke()
        cx.fillStyle = '#c46340'
        cx.beginPath(); cx.ellipse(X + 20, Y + 17 + sway * 0.4, 10, 5.4, 0, 0, 7); cx.fill()
        cx.fillStyle = 'rgba(94,36,21,.35)'                  // plates
        for (const px2 of [-6, 0, 6]) cx.fillRect(X + 20 + px2 - 0.7, Y + 14, 1.4, 12)
        // eyes on stalks
        for (const ex of [-4, 4]) {
          cx.strokeStyle = '#7a3b2a'; cx.lineWidth = 1.4
          cx.beginPath(); cx.moveTo(X + 20 + ex, Y + 14); cx.lineTo(X + 20 + ex, Y + 9 + sway); cx.stroke()
          cx.fillStyle = '#1a0f0a'
          cx.beginPath(); cx.arc(X + 20 + ex, Y + 8 + sway, 1.8, 0, 7); cx.fill()
        }
        // the claws, opening and closing
        for (const side of [-1, 1]) {
          const cxp = X + 20 + side * 15, cyp = Y + 15
          cx.fillStyle = '#b3542f'
          poly([[cxp, cyp], [cxp + side * 7, cyp - 3 - claw * side], [cxp + side * 8, cyp + 1],
                [cxp + side * 6, cyp + 4]], '#b3542f', '#5e2415')
          cx.fillStyle = '#8e3d22'
          poly([[cxp + side * 3, cyp + 1], [cxp + side * 8, cyp + 1],
                [cxp + side * 7, cyp + 4 + claw * side * 0.4]], '#8e3d22')
          cx.strokeStyle = '#7a3b2a'; cx.lineWidth = 2
          cx.beginPath(); cx.moveTo(X + 20 + side * 9, Y + 18); cx.lineTo(cxp, cyp + 1); cx.stroke()
        }
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 8, Y + 2, 24, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 8, Y + 2, 24 * Math.max(0, m.hp / 45), 3)
        return
      }
      if (m.type === 'troll') {
        const heave = Math.sin(now / 800 + m.x) * 1
        poly([[X+6,Y+33],[X+8,Y+12+heave],[X+20,Y+6+heave],[X+32,Y+12+heave],[X+34,Y+33]], '#5c6b52', '#2a3324')
        poly([[X+10,Y+30],[X+12,Y+14+heave],[X+20,Y+10+heave],[X+28,Y+14+heave],[X+30,Y+30]], '#6b7a5e')
        cx.fillStyle = 'rgba(0,0,0,.2)'; cx.fillRect(X + 12, Y + 20 + heave, 16, 2)
        cx.fillStyle = '#c9302c'
        cx.fillRect(X + 15 + MF * 1.5, Y + 15 + heave, 2.8, 2.8); cx.fillRect(X + 22 + MF * 1.5, Y + 15 + heave, 2.8, 2.8)
        cx.save(); cx.translate(X + (MF > 0 ? 33 : 7), Y + 22 + heave)
        cx.rotate(MF * (engaged ? Math.sin(now / 200) * 0.6 : 0.3))
        cx.fillStyle = '#4a3a26'; cx.fillRect(-2, -14, 4, 16)
        cx.fillStyle = '#5c4a32'; cx.beginPath(); cx.arc(0, -14, 4.4, 0, 7); cx.fill()
        cx.restore()
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 10, Y + 1, 20, 3.4)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 10, Y + 1, 20 * (m.hp / 20), 3.4)
        return
      }
      if (m.type === 'bear') {
        const lum = Math.sin(now / 500 + m.x) * 0.8
        poly([[X+5,Y+31],[X+8,Y+15+lum],[X+20,Y+10+lum],[X+32,Y+15+lum],[X+35,Y+31]], '#6b4a2e', '#33220f')
        poly([[X+9,Y+28],[X+12,Y+17+lum],[X+20,Y+13+lum],[X+28,Y+17+lum],[X+31,Y+28]], '#7d5a3a')
        const hx2 = MF > 0 ? 29 : 11
        cx.fillStyle = '#6b4a2e'; cx.beginPath(); cx.arc(X + hx2 - MF * 3, Y + 11 + lum, 3, 0, 7); cx.arc(X + hx2 + MF * 3, Y + 11 + lum, 3, 0, 7); cx.fill()
        cx.fillStyle = '#c9302c'; cx.fillRect(X + hx2 + MF * 2, Y + 17 + lum, 2.2, 2.2)
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 11, Y + 4, 18, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 11, Y + 4, 18 * (m.hp / 14), 3)
        return
      }
      if (m.type === 'wolf') {
        const lope = Math.sin(now / 300 + m.x) * 0.8
        poly([[X+7,Y+28+lope],[X+12,Y+21+lope],[X+27,Y+21+lope],[X+33,Y+26+lope],[X+29,Y+31],[X+11,Y+31]], '#6e6e72', '#3a3a3e')
        poly([[X+9,Y+24+lope],[X+13,Y+22+lope],[X+26,Y+22+lope],[X+29,Y+25+lope],[X+26,Y+29],[X+12,Y+29]], '#82828a')
        const hx2 = MF > 0 ? 30 : 10
        poly([[X+hx2-MF*2,Y+24+lope],[X+hx2+MF*7,Y+22+lope],[X+hx2+MF*8,Y+26+lope],[X+hx2,Y+27+lope]], '#6e6e72', '#3a3a3e')
        poly([[X+hx2+MF*2,Y+21+lope],[X+hx2+MF*5,Y+17+lope],[X+hx2+MF*6,Y+22+lope]], '#5a5a5e')
        cx.fillStyle = '#c9302c'; cx.fillRect(X + hx2 + MF * 4, Y + 23 + lope, 1.8, 1.8)
        const tx2 = MF > 0 ? 6 : 34
        poly([[X+tx2,Y+26+lope],[X+tx2-MF*5,Y+22+lope+Math.sin(now/250)*1.5],[X+tx2-MF*2,Y+28]], '#5a5a5e')
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 13, Y + 14, 14, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 13, Y + 14, 14 * (m.hp / 8), 3)
        return
      }
      if (m.type === 'skeleton-knight') {
        const march = engaged ? Math.abs(Math.sin(now / 150)) * 2 : Math.sin(now / 650 + m.x) * 0.7
        // legs (bone)
        cx.fillStyle = '#c9c2ae'; cx.fillRect(X + 16, Y + 27, 3, 7); cx.fillRect(X + 21, Y + 27, 3, 7)
        cx.fillStyle = '#8a8371'; cx.fillRect(X + 16, Y + 33, 3, 1.4); cx.fillRect(X + 21, Y + 33, 3, 1.4)
        // torso: ribcage, two-tone with a spine and ribs
        poly([[X+15,Y+14-march],[X+25,Y+14-march],[X+24,Y+28],[X+16,Y+28]], '#d8d2c0', '#5a5348')
        poly([[X+17,Y+15-march],[X+23,Y+15-march],[X+22,Y+27],[X+18,Y+27]], '#e6e0d0')
        cx.fillStyle = '#7a7362'
        for (let r = 0; r < 3; r++) cx.fillRect(X + 17, Y + 17 - march + r * 3.2, 6, 1.1) // ribs
        cx.fillStyle = '#5a5348'; cx.fillRect(X + 19.4, Y + 15 - march, 1.2, 12) // spine
        // the round wooden shield, on the arm away from the sword
        const shX = MF > 0 ? X + 12 : X + 28
        cx.fillStyle = '#5c4023'; cx.beginPath(); cx.arc(shX, Y + 21 - march, 6.5, 0, 7); cx.fill()
        cx.strokeStyle = '#3a2716'; cx.lineWidth = 1.4; cx.stroke()
        cx.fillStyle = '#6e5433'; cx.beginPath(); cx.arc(shX, Y + 21 - march, 4.4, 0, 7); cx.fill()
        cx.fillStyle = '#9a9a94'; cx.beginPath(); cx.arc(shX, Y + 21 - march, 1.6, 0, 7); cx.fill() // boss
        // the skull
        cx.fillStyle = '#e6e0d0'; cx.beginPath(); cx.arc(X + 20, Y + 9 - march, 5.4, 0, 7); cx.fill()
        cx.fillStyle = '#c9c2ae'; cx.fillRect(X + 17.5, Y + 11 - march, 5, 3) // jaw
        cx.fillStyle = '#2b2620'; cx.fillRect(X + 17.6, Y + 8 - march, 2, 2.2); cx.fillRect(X + 20.4, Y + 8 - march, 2, 2.2) // sockets
        cx.fillStyle = '#e2452e'; cx.fillRect(X + 18.1 + MF * 0.4, Y + 8.4 - march, 1, 1); cx.fillRect(X + 20.9 + MF * 0.4, Y + 8.4 - march, 1, 1) // ember eyes
        // the horned helm
        cx.fillStyle = '#6b6660'; cx.fillRect(X + 15.3, Y + 4.4 - march, 9.4, 3.6)
        poly([[X+15.5,Y+6-march],[X+9,Y+1.5-march],[X+13,Y+7.5-march]], '#d9c9a0', '#3a3226') // left horn
        poly([[X+24.5,Y+6-march],[X+31,Y+1.5-march],[X+27,Y+7.5-march]], '#d9c9a0', '#3a3226') // right horn
        // the longsword, raised and swinging when engaged
        cx.save(); cx.translate(X + (MF > 0 ? 27 : 13), Y + 20 - march)
        cx.rotate(MF * (engaged ? -0.4 + Math.sin(now / 150) * 0.7 : 0.35))
        cx.fillStyle = '#6a5433'; cx.fillRect(-1.2, 0, 2.4, 5)   // hilt
        cx.fillStyle = '#4a3a26'; cx.fillRect(-3.6, -1, 7.2, 2)  // crossguard
        poly([[-1.6,-1],[1.6,-1],[1.6,-16],[0,-19],[-1.6,-16]], '#cfd2cc', '#7a7d78') // blade
        cx.restore()
        // hp bar
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 11, Y, 18, 3)
        cx.fillStyle = '#c0392b'; cx.fillRect(X + 11, Y, 18 * (m.hp / 18), 3)
        return
      }
      // §6cz: THE INCURSION. One silhouette -- a tall, hunched, hooded thing
      // that walks out of the dark and fixes on one citizen -- wearing the
      // MATERIAL of the country it came from. woodwraith (bark & leaf), gargoyle
      // (stone & ore), drownling (drowned green, dripping), wilds-shade (near
      // black), haunt (pale, translucent). Drawn by m.face, not m.type, so all
      // five read as the same event in different skins.
      if (m.type === 'incursion') {
        const FACE = {
          woodwraith:   { body: '#4a5a2c', dark: '#2c3a18', hi: '#6a7d3c', eye: '#c8e070', mote: '#7a9a3a' },
          gargoyle:     { body: '#5a5650', dark: '#343029', hi: '#7c766a', eye: '#e0b050', mote: '#8a8478' },
          drownling:    { body: '#2f5a52', dark: '#183430', hi: '#3f7a6c', eye: '#7ce0d0', mote: '#4a8a7a' },
          'wilds-shade':{ body: '#241f2a', dark: '#0e0b12', hi: '#3a3244', eye: '#c060e0', mote: '#5a4a6a' },
          haunt:        { body: '#6a6a72', dark: '#3e3e46', hi: '#8e8e98', eye: '#d0d0e0', mote: '#8a8a94' },
        }
        const f = FACE[m.face] || FACE.haunt
        const sway = engaged ? Math.sin(now / 130 + m.x) * 1.6 : Math.sin(now / 620 + m.x) * 1.0
        const hover = Math.sin(now / 780 + m.y) * 1.4       // it drifts; it has no feet
        const lean = MF * 2.2
        // a faint seep on the ground instead of a solid shadow -- nothing stands here
        cx.globalAlpha = 0.22; cx.fillStyle = f.dark
        cx.beginPath(); cx.ellipse(X + 20, Y + 33, 8, 2.4, 0, 0, 7); cx.fill(); cx.globalAlpha = 1
        // drifting motes of the material
        cx.fillStyle = f.mote
        for (let k = 0; k < 5; k++) {
          const a = now / 700 + k * 1.5 + m.x
          cx.globalAlpha = 0.3 + 0.25 * Math.sin(a * 1.3)
          cx.fillRect(X + 20 + Math.cos(a) * (8 + k * 1.6), Y + 17 + Math.sin(a * 1.2) * 8 + hover, 1.5, 1.5)
        }
        cx.globalAlpha = 1
        // THE CLOAK: narrow hooded shoulders that TAPER to a ragged, legless hem.
        // Not a bucket -- the sides pull inward and the bottom is torn into
        // points, so it reads as a hanging robe with nothing under it.
        const topY = Y + 6 + hover, hemY = Y + 30 + hover
        // main silhouette: narrow at the shoulders (x 13..27), pulling in to a
        // narrow waist and flaring only slightly, then torn at the hem
        poly([[X + 20 + lean, topY], [X + 26, Y + 12 + hover], [X + 24, Y + 22 + hover],
              [X + 25, hemY], [X + 20, hemY - 1], [X + 15, hemY],
              [X + 16, Y + 22 + hover], [X + 14, Y + 12 + hover]], f.body, f.dark)
        // inner highlight, a slimmer version of the same shape
        poly([[X + 20 + lean, topY + 3], [X + 23, Y + 14 + hover], [X + 22, Y + 24 + hover],
              [X + 20, hemY - 2], [X + 18, Y + 24 + hover], [X + 17, Y + 14 + hover]], f.hi)
        // the ragged hem: four torn points hanging below, in the dark tone
        for (const hx of [14.5, 18, 21.5, 25]) {
          poly([[X + hx - 1.4, hemY - 2], [X + hx + 1.4, hemY - 2],
                [X + hx + Math.sin(now / 300 + hx) * 0.8, hemY + 3.5]], f.dark)
        }
        // THE HOOD: a distinct dark cowl above the shoulders -- a peaked hollow,
        // not a lid. Narrower than the shoulders, coming to a point at the top.
        poly([[X + 20 + lean, Y + 2 + hover], [X + 24, Y + 9 + hover],
              [X + 20 + lean * 0.5, Y + 13 + hover], [X + 16, Y + 9 + hover]], f.dark)
        // two burning eyes deep in the cowl, with a soft glow
        const ex = X + 20 + lean * 0.6 + MF * 0.5, ey = Y + 8 + hover
        cx.globalAlpha = 0.4; cx.fillStyle = f.eye
        cx.beginPath(); cx.arc(ex - 2.2, ey, 2.4, 0, 7); cx.arc(ex + 2.2, ey, 2.4, 0, 7); cx.fill()
        cx.globalAlpha = 1
        cx.fillRect(ex - 3, ey - 0.9, 1.9, 1.9); cx.fillRect(ex + 1.1, ey - 0.9, 1.9, 1.9)
        // a reaching wisp of an arm toward the target when engaged
        if (engaged) {
          cx.strokeStyle = f.dark; cx.lineWidth = 2.6; cx.lineCap = 'round'
          cx.beginPath(); cx.moveTo(X + 20, Y + 16 + hover); cx.lineTo(X + 20 + MF * (11 + sway), Y + 19 + sway + hover); cx.stroke()
          cx.strokeStyle = f.hi; cx.lineWidth = 1.2
          cx.beginPath(); cx.moveTo(X + 20, Y + 16 + hover); cx.lineTo(X + 20 + MF * (11 + sway), Y + 19 + sway + hover); cx.stroke()
        }
        // hp bar (scaled body: bar tracks hp against m.maxHp)
        const mh = m.maxHp || 120
        cx.fillStyle = '#4a1008'; cx.fillRect(X + 10, Y - 1, 20, 3)
        cx.fillStyle = '#b83a86'; cx.fillRect(X + 10, Y - 1, 20 * Math.max(0, m.hp / mh), 3)
        return
      }
      // §6cz: THE RISEN. What the Gibbet King calls up -- shambling moor-dead,
      // weak alone. Kin to him but rough and small: a lurching corpse, grave-
      // stained, that crumbles when he falls.
      if (m.type === 'risen') {
        const lurch = engaged ? Math.abs(Math.sin(now / 170 + m.x)) * 2.4 : Math.sin(now / 560 + m.x) * 1.2
        cx.fillStyle = 'rgba(0,0,0,0.25)'; cx.beginPath(); cx.ellipse(X + 20, Y + 33, 7, 2.4, 0, 0, 7); cx.fill()
        // legs, dragging
        cx.fillStyle = '#4a4038'; cx.fillRect(X + 16, Y + 27, 3, 7); cx.fillRect(X + 21, Y + 27 - lurch * 0.3, 3, 7)
        // hunched torso, grave-green grey
        poly([[X+15, Y+14-lurch], [X+25, Y+15-lurch], [X+24, Y+28], [X+16, Y+28]], '#5a6150', '#2e332a')
        poly([[X+17, Y+16-lurch], [X+23, Y+16-lurch], [X+22, Y+27], [X+18, Y+27]], '#6e755f')
        // a hanging arm reaching forward
        cx.strokeStyle = '#4a4038'; cx.lineWidth = 2.6
        cx.beginPath(); cx.moveTo(X + 20, Y + 17 - lurch); cx.lineTo(X + 20 + MF * 9, Y + 24 + (engaged ? lurch : 0)); cx.stroke()
        // gaunt head, hollow eyes, ember spark of the King's will
        cx.fillStyle = '#7a7a68'; cx.beginPath(); cx.arc(X + 20, Y + 9 - lurch, 4.6, 0, 7); cx.fill()
        cx.fillStyle = '#20221c'; cx.fillRect(X + 17.6, Y + 8 - lurch, 1.9, 2); cx.fillRect(X + 20.5, Y + 8 - lurch, 1.9, 2)
        cx.fillStyle = '#b060c0'; cx.fillRect(X + 18 + MF * 0.4, Y + 8.3 - lurch, 0.9, 0.9); cx.fillRect(X + 20.9 + MF * 0.4, Y + 8.3 - lurch, 0.9, 0.9)
        cx.fillStyle = '#3a1010'; cx.fillRect(X + 13, Y + 2, 14, 2.4)
        cx.fillStyle = '#8a4a9a'; cx.fillRect(X + 13, Y + 2, 14 * Math.max(0, m.hp / 12), 2.4)
        return
      }
      // §6cz: THE GIBBET KING. One of him, like the dragon -- a crowned dead
      // king at his gibbet in the Moor, who does not chase and barely strikes;
      // his threat is the dead he raises. Tall, robed, skeletal, crowned, with a
      // gallows-frame behind and a violet will burning where his eyes were.
      if (m.type === 'gibbet-king') {
        const breathe = Math.sin(now / 900) * 0.8
        // the gibbet: a gallows frame he stands beneath
        cx.strokeStyle = '#2a2018'; cx.lineWidth = 3
        cx.beginPath(); cx.moveTo(X + 6, Y + 34); cx.lineTo(X + 6, Y - 6); cx.lineTo(X + 30, Y - 6); cx.stroke()
        cx.strokeStyle = '#1a130d'; cx.lineWidth = 1.4
        cx.beginPath(); cx.moveTo(X + 28, Y - 6); cx.lineTo(X + 28, Y + 2); cx.stroke()  // the noose rope
        cx.fillStyle = '#1a130d'; cx.beginPath(); cx.arc(X + 28, Y + 3, 1.8, 0, 7); cx.fill()
        // ground shadow
        cx.fillStyle = 'rgba(30,10,40,0.35)'; cx.beginPath(); cx.ellipse(X + 19, Y + 34, 12, 3.4, 0, 0, 7); cx.fill()
        // the long royal robe, deep death-purple with bone trim
        poly([[X+19, Y+6+breathe], [X+30, Y+16], [X+27, Y+35], [X+11, Y+35], [X+8, Y+16]], '#3a2440', '#1c1020')
        poly([[X+19, Y+9+breathe], [X+26, Y+17], [X+24, Y+33], [X+14, Y+33], [X+12, Y+17]], '#4e3356')
        // bone hands crossed at the front
        cx.fillStyle = '#d8d0c0'
        cx.fillRect(X + 15, Y + 20, 4, 2.4); cx.fillRect(X + 21, Y + 20, 4, 2.4)
        // ribcage showing at the chest
        cx.strokeStyle = '#c8c0b0'; cx.lineWidth = 1
        for (let r = 0; r < 3; r++) { cx.beginPath(); cx.moveTo(X + 16, Y + 13 + r * 2.4 + breathe); cx.lineTo(X + 23, Y + 13 + r * 2.4 + breathe); cx.stroke() }
        // the skull
        cx.fillStyle = '#e6e0cd'
        cx.beginPath(); cx.arc(X + 19, Y + 8 + breathe, 5.6, 0, 7); cx.fill()
        cx.fillStyle = '#cfc7b4'; cx.fillRect(X + 16.2, Y + 10 + breathe, 5.6, 3)  // jaw
        cx.fillStyle = '#1a0a20'; cx.fillRect(X + 16.4, Y + 7 + breathe, 2.4, 2.6); cx.fillRect(X + 19.8, Y + 7 + breathe, 2.4, 2.6)  // sockets
        // the violet will burning in the sockets
        const pulse = 0.6 + 0.4 * Math.sin(now / 240)
        cx.fillStyle = '#c060e0'; cx.globalAlpha = pulse
        cx.fillRect(X + 16.9, Y + 7.6 + breathe, 1.3, 1.5); cx.fillRect(X + 20.3, Y + 7.6 + breathe, 1.3, 1.5)
        cx.globalAlpha = 1
        // the crown, gold points above the skull
        cx.fillStyle = '#d8b03a'
        cx.fillRect(X + 13.6, Y + 2.4 + breathe, 11, 2.2)
        poly([[X+14, Y+3+breathe], [X+15.5, Y-2+breathe], [X+17, Y+3+breathe]], '#e8c84a')
        poly([[X+17.4, Y+3+breathe], [X+19, Y-3.4+breathe], [X+20.6, Y+3+breathe]], '#f0d45a')
        poly([[X+21, Y+3+breathe], [X+22.5, Y-2+breathe], [X+24, Y+3+breathe]], '#e8c84a')
        // hp bar (his 200)
        cx.fillStyle = '#2a0820'; cx.fillRect(X + 6, Y - 10, 28, 3.4)
        cx.fillStyle = '#a040c0'; cx.fillRect(X + 6, Y - 10, 28 * Math.max(0, m.hp / (m.maxHp || 200)), 3.4)
        return
      }
      // the goblin: two-tone body, ears, club
      poly([[X+20,Y+11-hop],[X+28,Y+20-hop],[X+24,Y+34],[X+16,Y+34],[X+12,Y+20-hop]], '#4e7d2a', '#2c4a15')
      poly([[X+20,Y+13-hop],[X+25,Y+21-hop],[X+22,Y+33],[X+18,Y+33],[X+15,Y+21-hop]], '#5c8f35')
      poly([[X+12,Y+15-hop],[X+9,Y+9-hop],[X+15,Y+13-hop]], '#4e7d2a') // ears
      poly([[X+28,Y+15-hop],[X+31,Y+9-hop],[X+25,Y+13-hop]], '#4e7d2a')
      cx.fillStyle = '#c9302c'
      cx.fillRect(X + 15.5 + MF * 1.2, Y + 15 - hop, 2.4, 2.4); cx.fillRect(X + 22 + MF * 1.2, Y + 15 - hop, 2.4, 2.4)
      cx.save(); cx.translate(X + (MF > 0 ? 28 : 12), Y + 24 - hop)
      cx.rotate(MF * (engaged ? Math.sin(now / 160) * 0.5 : 0.4))
      cx.fillStyle = '#5c4023'; cx.fillRect(-1.2, -8, 2.4, 10)
      cx.fillStyle = '#6e5433'; cx.beginPath(); cx.arc(0, -9, 3, 0, 7); cx.fill()
      cx.restore()
      cx.fillStyle = '#4a1008'; cx.fillRect(X + 13, Y + 4, 14, 3)
      cx.fillStyle = '#c0392b'; cx.fillRect(X + 13, Y + 4, 14 * (m.hp / 5), 3)
    }})
  }

  const HIDE_AFTER = 144000 // ~24h of ticks: the long-departed stop cluttering spawn
  for (const [pid, p] of (s._playersE ?? Object.entries(s.players))) {
    if (pid !== myId && p.hp > 0 && s.tick - (p.lastInput ?? 0) > HIDE_AFTER) continue // long gone
    const o = prevState?.players[pid]
    const _pp = lerpPos(o, p, t)   // §3.3: a death moves a body; it does not walk it
    const ix = _pp.x
    const iy = o ? lerp(o.y, p.y, t) : p.y
    if (p.action) {
      // you face what you fight (and what you work)
      const tgt = s.nodes[p.action.nodeId] ?? s.mobs[p.action.mobId]
      // A citizen faces what they are working on. When the tree is directly
      // north or south there is no side to turn to, and this used to snap to
      // hard right: chopping something above you turned you away from it.
      // Keep the way you were already facing instead.
      if (tgt) facing[pid] = tgt.x !== p.x ? Math.sign(tgt.x - p.x) : (facing[pid] ?? 1)
    } else if (o && p.x !== o.x) facing[pid] = Math.sign(p.x - o.x)
    const moving = o && (p.x !== o.x || p.y !== o.y) && t < 1
    // raising a stall reads as work, not as standing still: a builder who
      // looked idle would be indistinguishable from somebody asleep
      const anim = moving ? 'walk' : p.action?.type === 'raise' ? 'gather'
        : p.action?.type === 'gather' ? 'gather'
               : p.action?.type === 'prowess' ? 'fight' : 'idle'
    const workNode = p.action?.nodeId ? s.nodes[p.action.nodeId] : null
    // §7an: A SPADE IS NOT A HATCHET. Digging a muck heap drew the citizen
    // swinging an axe -- the fallback -- so the one trade that pays a farmer
    // looked exactly like felling a tree, and the spade that pays STRENGTH
    // looked like nothing at all.
    const tool = famOf(workNode?.type) === 'fishing-spot' ? 'rod'
               : workNode?.type === 'muck-heap' || workNode?.type === 'rockfall'
                 ? (p.equipment?.weapon?.item === 'spade' ? 'spade' : 'hands')
               : (famOf(workNode?.type) === 'rock' || famOf(workNode?.type) === 'magic-rock') ? 'pick' : 'axe'
    const wep = p.equipment?.weapon?.item
    const ironTool = (famOf(workNode?.type) === 'tree' && wep === 'iron-hatchet')
                    || ((famOf(workNode?.type) === 'rock' || famOf(workNode?.type) === 'magic-rock') && wep === 'iron-pickaxe')
    const awake = isAwake(p, s.tick)
    const dying = p.hp <= 0, deadStart = (p.deadUntil ?? s.tick) - 5
    if ((p.stilledUntil ?? 0) > s.tick) layer.push({ z: Z(iy, 5), draw: () => { // the truce, over a citizen
      const X = px(ix), Y = py(iy)
      cx.fillStyle = 'rgba(215,222,230,.30)'
      cx.fillRect(X + 4, Y - 6, 24, 40)
      const ph9 = (now / 600) % 1
      cx.strokeStyle = 'rgba(240,244,248,' + (0.5 - ph9 * 0.35) + ')'
      cx.lineWidth = 1.4
      cx.beginPath(); cx.arc(X + 16, Y + 16, 10 + ph9 * 8, 0, 7); cx.stroke()
    } })
    layer.push({ z: Z(iy, 4), draw: () => {
      if (dying) {
        // the fall (spec 6c): the body tips where it fell and fades, and a pale
        // soul lifts away, the 5 ticks the world holds its breath.
        const prog = Math.max(0, Math.min(1, (s.tick + t - deadStart) / 5))
        const fx = px(ix) + 20, fy = py(iy) + 34
        cx.save()
        cx.translate(fx, fy); cx.rotate((facing[pid] ?? 1) * prog * 1.45); cx.translate(-fx, -fy)
        cx.globalAlpha = 1 - prog * 0.75
        drawCitizen(px(ix), py(iy), { now, pid, player: p, face: facing[pid] ?? 1, anim: 'idle', tool,
          mine: pid === myId, cape: capeOf(p), helm: !!p.equipment?.head && p.equipment?.head?.item !== 'cinder-crown', plate: !!p.equipment?.body,
          starHelm: p.equipment?.head?.item === 'star-helm', starPlate: p.equipment?.body?.item === 'star-plate',
          headItem: p.equipment?.head?.item ?? null, bodyItem: p.equipment?.body?.item ?? null,
          hooded: !!p.hooded,
          crown: p.equipment?.head?.item === 'cinder-crown',   // §6da
          // §6cz: DERIVED, NOT STORED. A citizen is mounted because of where
          // they are standing, so the window works it out from the road it is
          // already drawing. Nothing enters the state, no rule changes, and a
          // terminal that cannot draw a horse loses nothing but a horse.
          mounted: mountedNow(pid, p, now),
          // §11: WHO IS CARRYING. `mayStrike` lets two consignment-bearers
          // fight ANYWHERE, safe country included -- so a citizen's carrying
          // is the single fact that decides whether they may be struck where
          // they stand, and no window drew it. You could not tell a hauler
          // from a walker, which meant you could not tell whether the person
          // approaching you on the road was allowed to hit you.
          hauling: !!p.consignment,
          haulLoad: p.consignment ? (p.consignment.items ?? []).filter(Boolean).length : 0,
          // §7bz: and what it is worth, which is the thing that makes them a mark
          haulWorth: p.consignment ? (p.consignment.items ?? []).filter(Boolean)
            .reduce((t, it) => t + (PRICES[it.item] ?? 0) * (it.qty ?? 1), 0) : 0,
          burning: (p.burnUntil ?? 0) > (world?.tick ?? 0),
          // §7ch: which book, and whether they are holding anything to read it from
          book: p.book ?? 'common',
          wand: /wand|staff/.test(p.equipment?.weapon?.item ?? ''),
          rotting: (p.rottingUntil ?? 0) > (world?.tick ?? 0),
          shield: p.equipment?.offhand?.item ?? null, legs: p.equipment?.legs?.item ?? null,
          goldHelm: p.equipment?.head?.item === 'gold-helm', goldPlate: p.equipment?.body?.item === 'gold-plate',
          wepItem: wep, name: '', hp: 1, maxHp: 1 })
        cx.restore()
        cx.globalAlpha = 0.7 * (1 - prog); cx.fillStyle = '#e8e6d2' // the soul
        cx.beginPath(); cx.arc(px(ix) + 20, py(iy) + 8 - prog * 26, 2.5 + prog * 2.5, 0, 7); cx.fill()
        cx.globalAlpha = 1
        return
      }
      if (!awake) cx.globalAlpha = 0.55
      drawCitizen(px(ix), py(iy), {
        now, pid, player: p, face: facing[pid] ?? 1, anim, tool, mine: pid === myId,
      exchange: (p.action?.type === 'prowess' || p.action?.type === 'attackp')
        && (p.equipment?.weapon?.item === 'old-chain' || (s.tick - (p.action.since ?? 0)) % 2 === 0),
      chain: p.equipment?.weapon?.item === 'old-chain',
      starSword: p.equipment?.weapon?.item === 'star-sword',
      cape: capeOf(p),
      // EVERY BOW IS A BOW. This read `=== 'wooden-bow'`, so a citizen
      // holding a horn-bow, a crossbow, a sigil-bow or the dragonbow was
      // drawn empty-handed and never nocked an arrow. The finest weapon in
      // the world was invisible on the person carrying it.
      bow: RANGED_ITEMS.has(p.equipment?.weapon?.item),
      shooting: RANGED_ITEMS.has(p.equipment?.weapon?.item) && p.action
        && (p.action.type === 'prowess' || p.action.type === 'attackp')
        && (() => { const t2 = p.action.mobId ? s.mobs[p.action.mobId] : s.players[p.action.targetId]
          return t2 && Math.abs(p.x - t2.x) + Math.abs(p.y - t2.y) > 1 })(),
      helm: !!p.equipment?.head && p.equipment?.head?.item !== 'cinder-crown', plate: !!p.equipment?.body,
      starHelm: p.equipment?.head?.item === 'star-helm',
      starPlate: p.equipment?.body?.item === 'star-plate',
      // §6da: the cinder-crown is its own head-branch, not a generic helm
      crown: p.equipment?.head?.item === 'cinder-crown',
      // 6ce: the off hand and the legs
      shield: p.equipment?.offhand?.item ?? null,
      legs: p.equipment?.legs?.item ?? null,
      goldHelm: p.equipment?.head?.item === 'gold-helm',
      goldPlate: p.equipment?.body?.item === 'gold-plate',
      // §6cz/§11: MOUNTED AND LADEN, ON THE BRANCH THAT DRAWS THE LIVING.
      //
      // There are two `drawCitizen` calls here -- one for a citizen who is
      // FALLING and one for everybody else -- and these two fields went onto
      // the falling one, because it comes first in the file and matched first.
      // The result: no living citizen was ever mounted or ever carried a pack,
      // and the only thing in Interval that could be seen on a horse was a
      // corpse. It looked like the feature had simply not been written.
      mounted: mountedNow(pid, p, now),
      hauling: !!p.consignment,
      haulLoad: p.consignment ? (p.consignment.items ?? []).filter(Boolean).length : 0,
        sword: wep === 'iron-sword', wepItem: wep, ironTool,
        // A COMMA, NOT AN INTERPUNCT. "Rosamund, banker (412)" is a person
        // with a job; "Rosamund . banker (412)" is two fields in a table. The
        // lantern window has always used the comma; this one had not.
        name: (p.name ?? pid.slice(0, 6)) + ', ' + callingOf(p) + ' (' + standingOf(p) + ')',
      hp: p.hp, maxHp: maxHpOf(p),   // §5j
        hitAt: hitFlash[pid], branded: (p.brandedUntil ?? 0) > s.tick,
      })
      if ((p.rootedUntil ?? 0) > s.tick) rootBind(px(ix), py(iy))
      if ((p.brandedUntil ?? 0) > s.tick) {
        // The Brand (spec 6u): a citizen who struck the unprovoked in the Wilds
        // wears a hot-iron mark. No mechanical weight, the state records it, the
        // window paints it, the rest of us decide what it means.
        const bp = 0.5 + Math.sin(now / 300) * 0.5
        cx.save(); cx.globalAlpha = 0.22 + bp * 0.18 // a red stain at the feet, seen from afar
        cx.fillStyle = '#c0392b'
        cx.beginPath(); cx.ellipse(px(ix) + 20, py(iy) + 34, 12, 4.5, 0, 0, 7); cx.fill()
        cx.restore()
        cx.save(); cx.translate(px(ix) + 20, py(iy) - 9); cx.globalAlpha = 0.85 + bp * 0.15
        cx.fillStyle = '#7a1512'; cx.beginPath(); cx.arc(0, 0, 5, 0, 7); cx.fill()       // the burned seal
        cx.strokeStyle = '#e8452e'; cx.lineWidth = 1.4; cx.lineCap = 'round'             // the mark: a scar
        cx.beginPath(); cx.moveTo(-2.3, -2.3); cx.lineTo(2.3, 2.3); cx.moveTo(2.3, -2.3); cx.lineTo(-2.3, 2.3); cx.stroke()
        cx.strokeStyle = 'rgba(232,69,46,' + (0.35 + bp * 0.4) + ')'; cx.lineWidth = 1    // the heat still rising
        cx.beginPath(); cx.arc(0, 0, 6.5 + bp * 1.6, 0, 7); cx.stroke()
        cx.restore(); cx.globalAlpha = 1
      }
      if (!awake) { // dreaming: a little z drifts up and away
        const zt = (now / 1400 + p.x) % 1
        cx.globalAlpha = 0.8 * (1 - zt)
        cx.fillStyle = '#d9c9a3'
        cx.font = 'bold ' + Math.round(8 + zt * 4) + 'px Verdana'
        cx.textAlign = 'center'
        cx.fillText('z', px(ix) + 26 + zt * 6, py(iy) + 4 - zt * 10)
      }
      cx.globalAlpha = 1
    }})
  }

  drawHaulMarker(s, t)

  drawGoalMarker(s, t)
  layer.sort((a, b) => a.z - b.z)
  for (const item of layer) item.draw()

  // §6af: A BIG BLOW LINGERS. Seven hundred milliseconds is right for a swing
  // and wrong for a flurry: forty points arrived, flashed once, and were gone
  // before a citizen looked up. A splat now lasts in proportion to what it
  // says, to a ceiling, so the number that mattered is the number you can read.
  // hit splats: the red star of damage — and a pale nought for a blow
  // that found nothing, which is the difference between armour working and
  // the world being broken
  // SPLATS THAT ARRIVE TOGETHER MUST NOT SIT ON TOP OF EACH OTHER.
  //
  // Three beasts can set about one citizen, and with the miss nought there
  // are now up to three marks landing on the same tile in the same tick.
  // Drawn at the same point they are one mark, and the citizen sees a single
  // hit where three things happened — which is the same illegibility the
  // arcs and noughts were added to cure.
  //
  // Fanned at draw time rather than at push time, so it works however many
  // arrive and needs nothing remembered.
  {
    const cluster = new Map()
    for (const sp of splats) {
      const k = sp.x + ',' + sp.y
      let c = cluster.get(k); if (!c) { c = []; cluster.set(k, c) }
      c.push(sp)
    }
    for (const c of cluster.values()) {
      c.sort((a, b) => a.at - b.at)
      c.forEach((sp, i) => {
        sp._n = i; sp._of = c.length
      })
    }
  }
  for (let i = splats.length - 1; i >= 0; i--) {
    const sp = splats[i]
    const age = now - sp.at
    // a splat lasts in proportion to what it says: seven hundred for an
    // ordinary blow, up to sixteen hundred for the kind of number that decides
    // a fight. Twenty points is where a blow stops being ordinary.
    const life = Math.min(1600, 700 + Math.max(0, (sp.amount ?? 0) - 20) * 30)
    if (age > life) { splats.splice(i, 1); continue }
    // spread them along an arc: one sits centred, several open out, and the
    // order is the order they landed
    const n = sp._n ?? 0, of = sp._of ?? 1
    // §7ca: a burst opens wider than an ordinary cluster -- six numbers at
    // thirteen apart overlap, and a flurry that reads as a smear is no better
    // than the one number it replaced.
    const spread = sp.fan !== undefined ? sp.fan * 1.6
      : of > 1 ? ((n - (of - 1) / 2) * 13) : 0
    const lift = sp.burst ? Math.abs(sp.fan ?? 0) * 0.5 + 3
      : of > 1 ? Math.abs(n - (of - 1) / 2) * 4 : 0
    const SX = px(sp.x) + 20 + spread, SY = py(sp.y) + 18 - lift - age / 90
    cx.globalAlpha = age > life - 200 ? (life - age) / 200 : 1
    // a MISS is a pale ring, not a red star: the shape says at a glance
    // whether anything got through, without reading the number
    if (sp.amount === 0) {
      cx.strokeStyle = 'rgba(190,205,220,.75)'; cx.lineWidth = 1.6
      cx.beginPath(); cx.arc(SX, SY, 7, 0, 7); cx.stroke()
      cx.fillStyle = 'rgba(220,232,244,.9)'
      cx.font = 'bold 9px Verdana'; cx.textAlign = 'center'
      cx.fillText('0', SX, SY + 3.2); cx.textAlign = 'left'
      cx.globalAlpha = 1
      continue
    }
    cx.fillStyle = '#a11212'
    cx.beginPath()
    for (let k = 0; k < 8; k++) {
      const r2 = k % 2 ? 5.5 : 9, ang = k * Math.PI / 4 + 0.4
      cx[k ? 'lineTo' : 'moveTo'](SX + Math.cos(ang) * r2, SY + Math.sin(ang) * r2)
    }
    cx.closePath(); cx.fill()
    cx.fillStyle = '#fff'; cx.font = 'bold 9px Verdana'; cx.textAlign = 'center'
    cx.fillText(sp.amount, SX, SY + 3.4)
    cx.globalAlpha = 1
  }

  // rites: brief particle truths
  for (let i = effects.length - 1; i >= 0; i--) {
    if (effects[i].kind === 'special') {
      const ef = effects[i], ag = now - ef.at
      if (ag > 620) { effects.splice(i, 1); continue }
      const t9 = ag / 620
      const EX = px(ef.x) + 20, EY = py(ef.y) + 18
      // a ring thrown outward, and three marks struck through it
      cx.strokeStyle = 'rgba(255,190,90,' + (0.8 * (1 - t9)) + ')'
      cx.lineWidth = 2.4 * (1 - t9) + 0.6
      cx.beginPath(); cx.arc(EX, EY, 6 + t9 * 22, 0, 7); cx.stroke()
      cx.strokeStyle = 'rgba(255,236,170,' + (0.9 * (1 - t9)) + ')'
      cx.lineWidth = 2
      for (let k = 0; k < 3; k++) {
        const a9 = -0.9 + k * 0.9
        cx.beginPath()
        cx.moveTo(EX + Math.cos(a9) * (4 + t9 * 10), EY + Math.sin(a9) * (4 + t9 * 10))
        cx.lineTo(EX + Math.cos(a9) * (13 + t9 * 16), EY + Math.sin(a9) * (13 + t9 * 16))
        cx.stroke()
      }
      continue
    }
    const ef = effects[i]
    const life = ef.kind === 'arrowshot' ? 380 : ef.kind === 'click' ? 420
      : ef.kind === 'volley' ? 260 + ((ef.n ?? 1) - 1) * 60 + 80
      : ef.kind === 'specialhit' ? 700 : 800
    const age = now - ef.at
    if (age > life) { effects.splice(i, 1); continue }
    const p2 = age / life
    const EX = px(ef.x) + 20, EY = py(ef.y) + 20
    cx.globalAlpha = 1 - p2
    if (ef.kind === 'click') {
      const CX2 = px(ef.x) + 20, CY2 = py(ef.y) + 20
      const sh = 14 * (1 - p2)
      cx.strokeStyle = ef.act ? 'rgba(232,110,58,.95)' : 'rgba(255,232,58,.9)'
      cx.lineWidth = 2.6
      cx.beginPath()
      for (const [dx2, dy2] of [[-1,-1],[1,-1],[1,1],[-1,1]]) {
        cx.moveTo(CX2 + dx2 * sh, CY2 + dy2 * (sh - 5))
        cx.lineTo(CX2 + dx2 * sh, CY2 + dy2 * sh)
        cx.lineTo(CX2 + dx2 * (sh - 5), CY2 + dy2 * sh)
      }
      cx.stroke()
    } else if (ef.kind === 'seal') {
      // §6bn: THE OPPOSITE PICTURE TO UNMAKING, on purpose. Unmaking scatters
      // upward and outward; this closes DOWNWARD over the pile and stays. A
      // dome that settles, then a slow bead running round its rim -- so that
      // at a glance, across a field, nobody has to guess which of the two
      // verbs a mage just used.
      const dome = Math.min(1, p2 / .5)
      cx.strokeStyle = 'rgba(150,214,120,' + (.85 * (1 - p2 * .35)).toFixed(2) + ')'
      cx.lineWidth = 2.2
      cx.beginPath(); cx.ellipse(EX, EY - 4, 13 * dome, 9 * dome, 0, Math.PI, 0); cx.stroke()
      cx.fillStyle = 'rgba(150,214,120,' + (.20 * dome * (1 - p2 * .5)).toFixed(2) + ')'
      cx.beginPath(); cx.ellipse(EX, EY - 4, 13 * dome, 9 * dome, 0, Math.PI, 0); cx.fill()
      if (p2 > .35) {                       // the bead, running the rim
        const q = (p2 - .35) / .65, a2 = Math.PI + q * Math.PI
        cx.fillStyle = 'rgba(191,232,154,' + (.9 * (1 - q)).toFixed(2) + ')'
        cx.beginPath(); cx.arc(EX + Math.cos(a2) * 13, EY - 4 + Math.sin(a2) * 9, 2.2, 0, 7); cx.fill()
      }
      cx.fillStyle = 'rgba(191,232,154,' + (.5 * (1 - p2)).toFixed(2) + ')'
      for (let k = 0; k < 3; k++) {         // and three drips, falling in
        const q = Math.max(0, p2 * 1.3 - k * .12)
        if (q <= 0 || q > 1) continue
        cx.fillRect(EX - 8 + k * 8, EY - 16 + q * 12, 1.8, 3.4)
      }
    } else if (ef.kind === 'unmake') {
      // A THING COMING APART: it lifts and turns, the edges let go, and what
      // it was worth falls back as coin.
      if (p2 < .45) {
        const q = p2 / .45
        for (let k = 0; k < 5; k++) {
          const a2 = q * 5 + k * 1.257, r2 = 7 * (1 - q * .3)
          cx.fillStyle = 'rgba(244,222,158,' + (.6 - q * .25).toFixed(2) + ')'
          cx.fillRect(EX + Math.cos(a2) * r2 - 1.5, EY - 14 - q * 12 + Math.sin(a2) * r2 * .45, 3, 3)
        }
      }
      if (p2 > .3 && p2 < .72) {
        const q = (p2 - .3) / .42
        for (let k = 0; k < 14; k++) {
          const a2 = (k / 14) * 6.283 + k * .7, r2 = q * (14 + (k % 5) * 6)
          cx.fillStyle = 'rgba(255,' + (210 - k * 5) + ',120,' + (.8 * (1 - q)).toFixed(2) + ')'
          cx.fillRect(EX + Math.cos(a2) * r2 - 1, EY - 20 + Math.sin(a2) * r2 * .5 - 1, 2.2, 2.2)
        }
      }
      if (p2 > .5) {
        const q = (p2 - .5) / .5
        for (let k = 0; k < 4; k++) {
          const t2 = Math.max(0, q * 1.4 - k * .1)
          if (t2 <= 0) continue
          cx.fillStyle = 'rgba(240,206,110,' + (.9 * (1 - t2 * .5)).toFixed(2) + ')'
          cx.beginPath()
          cx.ellipse(EX + (k - 1.5) * 6 * (1 - t2 * .3), EY - 20 + t2 * t2 * 26,
            2.4 * Math.abs(Math.cos(t2 * 9 + k)) + .8, 2.4, 0, 0, 7)
          cx.fill()
        }
      }
    } else if (ef.kind === 'drink') {
      // rings on the water, and the cold of it going down
      cx.strokeStyle = 'rgba(150,206,224,' + (1 - p2).toFixed(2) + ')'
      cx.lineWidth = 1.6
      for (let k = 0; k < 3; k++) {
        const r2 = (p2 * 22) + k * 6
        cx.beginPath(); cx.ellipse(EX, EY + 6, r2, r2 * .42, 0, 0, 7); cx.stroke()
      }
    } else if (ef.kind === 'eat') {
      // a small warmth, and crumbs
      cx.fillStyle = 'rgba(226,182,62,' + (.7 * (1 - p2)).toFixed(2) + ')'
      for (let k = 0; k < 4; k++)
        cx.fillRect(EX - 6 + k * 4, EY - 8 - p2 * 12 + Math.sin(p2 * 5 + k) * 2, 1.8, 1.8)
    } else if (ef.kind === 'bury') {
      cx.fillStyle = '#e8e4d0'
      for (let k = 0; k < 5; k++) cx.fillRect(EX - 10 + k * 5 + Math.sin(p2 * 6 + k) * 2, EY + 8 - p2 * 22 - k * 2, 1.8, 1.8)
    } else if (ef.kind === 'invoke') {
      // three stones remember being one: motes spiral INWARD, then a cold flash
      cx.fillStyle = '#8ce0ff'
      for (let k = 0; k < 8; k++) {
        const ang = k * 0.9 - p2 * 4, r = 20 * (1 - p2)
        cx.globalAlpha = 0.4 + 0.6 * p2
        cx.fillRect(EX + Math.cos(ang) * r - 1, EY - 4 + Math.sin(ang) * r, 2.4, 2.4)
      }
      if (p2 > 0.75) { cx.globalAlpha = (1 - p2) / 0.25; cx.fillStyle = '#dffaff'
        cx.beginPath(); cx.arc(EX, EY - 4, 3 + (p2 - 0.75) * 40, 0, 7); cx.fill() }
      cx.globalAlpha = 1
    } else if (ef.kind === 'mend') {
      // knit whole: a warm GREEN pulse + a plus of light + rising motes ,
      // unmistakable mid-fight, never confused with the cyan of a spell
      cx.globalAlpha = (1 - p2) * 0.9
      cx.strokeStyle = '#5ef08a'; cx.lineWidth = 2.5
      cx.beginPath(); cx.arc(EX, EY - 2, 4 + p2 * 16, 0, 7); cx.stroke()
      cx.fillStyle = '#baffce'; const pl = 5 * (1 - p2)
      cx.fillRect(EX - pl, EY - 3, pl * 2, 2.6); cx.fillRect(EX - 1.3, EY - 3 - pl, 2.6, pl * 2)
      cx.fillStyle = '#7ef29a'
      for (let k = 0; k < 5; k++) { cx.globalAlpha = (1 - p2) * 0.8
        cx.fillRect(EX + ((k * 37) % 20) - 10, EY + 6 - p2 * 26 - k * 2, 2, 2) }
      cx.globalAlpha = 1
    } else if (ef.kind === 'cast') {
      // return to Anchor: expanding rings + a rising column of light
      cx.globalAlpha = 1 - p2
      cx.strokeStyle = '#8ce0ff'; cx.lineWidth = 2
      cx.beginPath(); cx.arc(EX, EY, 6 + p2 * 26, 0, 7); cx.stroke()
      cx.beginPath(); cx.arc(EX, EY, 2 + p2 * 16, 0, 7); cx.stroke()
      cx.fillStyle = 'rgba(140,224,255,' + (0.5 * (1 - p2)) + ')'
      cx.fillRect(EX - 3, EY - 40 * p2, 6, 40 * p2)
      cx.globalAlpha = 1
    } else if (ef.kind === 'arrowshot') {
      const fx2 = px(ef.x) + 20, fy2 = py(ef.y) + 16
      const tx2 = px(ef.tx) + 20, ty2 = py(ef.ty) + 16
      const ax = fx2 + (tx2 - fx2) * p2, ay = fy2 + (ty2 - fy2) * p2
      const ang = Math.atan2(ty2 - fy2, tx2 - fx2)
      cx.save(); cx.translate(ax, ay); cx.rotate(ang)
      cx.strokeStyle = '#8a5a2a'; cx.lineWidth = 1.8
      cx.beginPath(); cx.moveTo(-6, 0); cx.lineTo(4, 0); cx.stroke()
      cx.fillStyle = '#c9c2b2'
      cx.beginPath(); cx.moveTo(6, 0); cx.lineTo(2, -2); cx.lineTo(2, 2); cx.closePath(); cx.fill()
      cx.fillStyle = '#e8e4d0'; cx.fillRect(-7, -1.4, 2.4, 2.8)
      cx.restore()
    } else if (ef.kind === 'volley') {
      // §6af: ONE SHAFT PER BLOW, staggered, so six reads as six. Each flies
      // its own 260ms; the last leaves 60ms after the one before it.
      const fx3 = px(ef.x) + 20, fy3 = py(ef.y) + 16
      const tx3 = px(ef.tx) + 20, ty3 = py(ef.ty) + 16
      const ang3 = Math.atan2(ty3 - fy3, tx3 - fx3)
      const perp = ang3 + Math.PI / 2
      for (let k = 0; k < (ef.n ?? 1); k++) {
        const t3 = (age - k * 60) / 260
        if (t3 < 0 || t3 > 1) continue
        // a little spread across the flight, so a volley looks loosed and not printed
        const sp = ((k % 2 ? 1 : -1) * (1 + (k >> 1)) * 2.4) * Math.sin(t3 * Math.PI)
        const ax3 = fx3 + (tx3 - fx3) * t3 + Math.cos(perp) * sp
        const ay3 = fy3 + (ty3 - fy3) * t3 + Math.sin(perp) * sp
        cx.save(); cx.translate(ax3, ay3); cx.rotate(ang3)
        cx.globalAlpha = Math.min(1, (1 - t3) * 3)
        cx.strokeStyle = ef.self ? '#c9a86a' : '#d08a5a'; cx.lineWidth = 1.8
        cx.beginPath(); cx.moveTo(-7, 0); cx.lineTo(4, 0); cx.stroke()
        cx.fillStyle = '#e6e2d2'
        cx.beginPath(); cx.moveTo(7, 0); cx.lineTo(2, -2.2); cx.lineTo(2, 2.2); cx.closePath(); cx.fill()
        cx.restore()
      }
      cx.globalAlpha = 1
    } else if (ef.kind === 'specialhit') {
      // and it lands: a struck ring at the TARGET, one tick mark per blow
      // around it, so the person being hit can see what hit them.
      const t4 = age / 700
      if (t4 <= 1) {
        cx.strokeStyle = 'rgba(255,120,90,' + (0.85 * (1 - t4)) + ')'
        cx.lineWidth = 3 * (1 - t4) + 0.8
        cx.beginPath(); cx.arc(EX, EY, 4 + t4 * 17, 0, 7); cx.stroke()
        const n4 = ef.n ?? 1
        cx.strokeStyle = 'rgba(255,224,200,' + (0.9 * (1 - t4)) + ')'
        cx.lineWidth = 1.8
        for (let k = 0; k < n4; k++) {
          const a4 = (k / n4) * Math.PI * 2 - 1.2
          const r0 = 6 + t4 * 12, r1 = r0 + 5
          cx.beginPath()
          cx.moveTo(EX + Math.cos(a4) * r0, EY + Math.sin(a4) * r0)
          cx.lineTo(EX + Math.cos(a4) * r1, EY + Math.sin(a4) * r1)
          cx.stroke()
        }
      }
    } else if (ef.kind === 'fletch') {
      cx.fillStyle = '#c9a86a'
      for (let k = 0; k < 4; k++) cx.fillRect(EX - 6 + k * 4, EY + 2 + p2 * 10 + k, 2.4, 1.6)
    }
    cx.globalAlpha = 1
  }

  // speech bubbles: gold text over heads, RS-style, ~4s
  for (const [pid, b] of Object.entries(bubbles)) {
    if (now - b.at > 4000) { delete bubbles[pid]; continue }
    const p = s.players[pid]; if (!p) continue
    const o = prevState?.players[pid]
    const bx2 = px(lerpPos(o, p, t).x) + 20
    const by2 = py(o ? lerp(o.y, p.y, t) : p.y) - 12
    cx.globalAlpha = now - b.at > 3400 ? (4000 - (now - b.at)) / 600 : 1
    cx.fillStyle = '#ffff9c'; cx.font = 'bold 11px Verdana'; cx.textAlign = 'center'
    cx.fillText(b.text, bx2, by2)
    cx.globalAlpha = 1
  }

  // arrows in flight: a bright line that fades as it flies (280ms)
  arrowShots = arrowShots.filter(a2 => now - a2.at < 280)
  for (const a2 of arrowShots) {
    const f2 = (now - a2.at) / 280, f3 = Math.max(0, f2 - 0.22)
    const ax = px(lerp(a2.x0, a2.x1, f2)) + 8, ay = py(lerp(a2.y0, a2.y1, f2)) + 8
    const bx = px(lerp(a2.x0, a2.x1, f3)) + 8, by = py(lerp(a2.y0, a2.y1, f3)) + 8
    cx.strokeStyle = 'rgba(232,228,208,' + (1 - f2 * 0.6) + ')'
    cx.lineWidth = 1.4
    cx.beginPath(); cx.moveTo(bx, by); cx.lineTo(ax, ay); cx.stroke()
  }
  // the stilling's ring: everything else adds motion; this removes it
  // §7db: THE NAMES OF THINGS NEAR YOU.
  //
  // Drawn as its own pass, over the world and under the interface, so it does
  // not have to be threaded through nine drawing routines that each know how to
  // paint one kind of rock. Only within NAME_RANGE, and only for gatherables:
  // the map stays clean at distance and legible at hand.
  {
    const meN = world?.players?.[myId]
    if (meN) {
      cx.font = '10px Verdana'; cx.textAlign = 'center'
      for (const n of (world._nodesV ?? Object.values(world.nodes ?? {}))) {
        const nm = NODE_NAME[n.type]; if (!nm) continue
        const d = Math.max(Math.abs(n.x - meN.x), Math.abs(n.y - meN.y))
        if (d > NAME_RANGE) continue
        const fade = d > NAME_RANGE - 2 ? (NAME_RANGE - d) / 2 : 1
        const LX = px(n.x) + 20, LY = py(n.y) - 2
        cx.fillStyle = 'rgba(0,0,0,' + (0.55 * fade) + ')'
        const w = cx.measureText(nm).width
        cx.fillRect(LX - w / 2 - 3, LY - 9, w + 6, 12)
        cx.fillStyle = (n.depletedUntil ?? 0) > (world.tick ?? 0)
          ? 'rgba(150,140,120,' + fade + ')' : 'rgba(226,214,180,' + fade + ')'
        cx.fillText(nm, LX, LY)
      }
      cx.textAlign = 'left'
    }
  }
  stillRings = stillRings.filter(r2 => now - r2.at < 900)
  for (const r2 of stillRings) {
    const f2 = (now - r2.at) / 900
    cx.strokeStyle = 'rgba(235,240,245,' + (0.8 * (1 - f2)) + ')'
    cx.lineWidth = 2 - f2
    cx.beginPath(); cx.arc(px(r2.x) + 16, py(r2.y) + 16, 6 + f2 * 46, 0, 7); cx.stroke()
  }
  // §7cr: the marks the other spells leave
  spellMarks = spellMarks.filter((k) => now - k.at < (k.kind === 'wither' ? 1400 : 1000))
  for (const k of spellMarks) {
    const life = k.kind === 'wither' ? 1400 : 1000
    const f = (now - k.at) / life
    const CX = px(k.x) + 16, CY = py(k.y) + 16
    if (k.kind === 'taking') {
      // a line, from them to you: the life is going somewhere
      const TX = px(k.tx) + 16, TY = py(k.ty) + 16
      cx.strokeStyle = 'rgba(190,60,70,' + (0.85 * (1 - f)) + ')'
      cx.lineWidth = 3 - f * 2
      cx.beginPath(); cx.moveTo(CX, CY)
      cx.lineTo(CX + (TX - CX) * Math.min(1, f * 2), CY + (TY - CY) * Math.min(1, f * 2)); cx.stroke()
      cx.fillStyle = 'rgba(220,90,90,' + (1 - f) + ')'
      cx.beginPath(); cx.arc(CX + (TX - CX) * Math.min(1, f * 2), CY + (TY - CY) * Math.min(1, f * 2), 4 * (1 - f), 0, 7); cx.fill()
    } else if (k.kind === 'waking') {
      // a ring that opens where the clump is, and a second inside it
      for (const mul of [1, 0.55]) {
        cx.strokeStyle = 'rgba(150,120,200,' + (0.8 * (1 - f) * mul) + ')'
        cx.lineWidth = 3 - f * 2
        cx.beginPath(); cx.arc(CX, CY, 4 + f * 52 * mul, 0, 7); cx.stroke()
      }
    } else if (k.kind === 'rot') {
      cx.fillStyle = 'rgba(110,150,80,' + (0.5 * (1 - f)) + ')'
      cx.beginPath(); cx.arc(CX, CY, 8 + f * 14, 0, 7); cx.fill()
    } else if (k.kind === 'wither') {
      // bars closing: the door being shut
      for (let b = 0; b < 5; b++) {
        const off = (1 - f) * 26
        cx.strokeStyle = 'rgba(40,30,45,' + (0.9 * (1 - f * 0.6)) + ')'
        cx.lineWidth = 2.5
        cx.beginPath(); cx.moveTo(CX - 12 + b * 6, CY - 18 - off); cx.lineTo(CX - 12 + b * 6, CY + 18 + off); cx.stroke()
      }
    } else if (k.kind === 'turn') {
      // the ossuary answering: a dark ring going IN rather than out
      cx.strokeStyle = 'rgba(60,40,60,' + (0.9 * (1 - f)) + ')'
      cx.lineWidth = 3
      cx.beginPath(); cx.arc(CX, CY, 50 * (1 - f) + 4, 0, 7); cx.stroke()
      cx.fillStyle = 'rgba(150,130,160,' + (0.5 * (1 - f)) + ')'
      for (let q = 0; q < 6; q++) {
        const a = q * 1.05 + f * 2
        cx.beginPath(); cx.arc(CX + Math.cos(a) * (46 * (1 - f)), CY + Math.sin(a) * (46 * (1 - f)), 2.5, 0, 7); cx.fill()
      }
    }
  }
  // floating xp drops (world coords, so drawn before restore)
  xpDrops = xpDrops.filter(d => now - d.at < 1100)
  for (const d of xpDrops) {
    const age = (now - d.at) / 1100
    cx.globalAlpha = 1 - age
    cx.fillStyle = '#e2b63e'; cx.font = 'bold 11px Verdana'; cx.textAlign = 'center'
    cx.fillText('+' + d.amt + ' xp', px(d.x) + 20, py(d.y) - 6 - age * 16)
    cx.globalAlpha = 1
  }

  cx.restore()

  // level-up: fireworks over your head + a banner, ~2.4s
  if (celebrate && now - celebrate.at < 2400) {
    const age = (now - celebrate.at) / 2400
    const meC = s.players[myId]
    if (meC) {
      const bx = px(meC.x - cam.x) + 20, by = py(meC.y - cam.y) + 6
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2 + i
        const d = age * 26 + (i % 3) * 4
        cx.fillStyle = ['#e2b63e', '#ff6b35', '#fff'][i % 3]
        cx.globalAlpha = 1 - age
        cx.fillRect(bx + Math.cos(a) * d, by + Math.sin(a) * d - age * 14, 2.4, 2.4)
      }
      cx.globalAlpha = 1
    }
    // banner rectangle now drawn on the topmost overlay (drawBanner) so it rides above GL + minimap
  } else if (celebrate && now - celebrate.at >= 2400) celebrate = null

  // ---- clouds: three soft shadows crossing the land, day only ----
  {
    const dayness = 1 - Math.min(1, (((s.tick + t) % DAY) / DAY < 0.5 ? 0 : 1) + 0)
    const cyc0 = dayCyc((((s.tick + t) % DAY) / DAY))
    const bright0 = (Math.sin(cyc0 * Math.PI * 2) + 1) / 2
    if (bright0 > 0.35) {
      const alpha = (bright0 - 0.35) * 0.11
      for (let ci = 0; ci < 3; ci++) {
        const span = (W + 40) * TILE
        const wx = ((now * (0.010 + ci * 0.004) + ci * span / 3) % span) - 20 * TILE
        const wy = ((ci * 37.7) % H) * TILE + Math.sin(now / 9000 + ci) * 60
        const sxp = wx - cam.x * TILE, syp = wy - cam.y * TILE
        if (sxp < -260 || sxp > cv.width + 260 || syp < -260 || syp > cv.height + 260) continue
        const cg = cx.createRadialGradient(sxp, syp, 30, sxp, syp, 200 + ci * 40)
        cg.addColorStop(0, 'rgba(20,30,40,' + alpha + ')')
        cg.addColorStop(1, 'rgba(20,30,40,0)')
