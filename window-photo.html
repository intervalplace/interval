    } else if (child === g.userData.cloak) {
      g.remove(child); chestCarrier.add(child)
    }
  }
  g.add(core.mesh)
  // the animator finds the same names it always knew, now they are bones
  core.shL.userData.joint = core.fkL
  core.shR.userData.joint = core.fkR
  core.thL.userData.joint = core.snL
  core.thR.userData.joint = core.snR
  core.shL.rotation.z = 0.10; core.shL.userData.restZ = 0.10
  core.shR.rotation.z = -0.10; core.shR.userData.restZ = -0.10
  g.userData.arms = [core.shL, core.shR]
  g.userData.legs = [core.thL, core.thR]
  g.userData.torso = core.spine
  g.userData.headGrp = headGrp
  g.__skinnedMat = core.mat
  g.__spineBone = core.spine
  // the pelvis, and the height it rests at: the contact pass drops it
  // under load and the leg solve has to know it moved
  g.__hips = core.hips
  g.__hipsY = core.hips.position.y
  g.__ank = [core.ankL, core.ankR]
  g.__toe = [core.toeL, core.toeR]
  // plate recolors the CLOTH vertices and only those: the skin stays skin
  const colAttr = core.merged.attributes.color
  const tunicRGB = [tunic.r, tunic.g, tunic.b]
  g.userData.setPlate = (hex) => {
    const c = new THREE.Color(hex ?? 0)
    const [r2, g2, b2] = hex == null ? tunicRGB : [c.r, c.g, c.b]
    for (const [a, b] of core.plateRanges)
      for (let i = a; i < b; i++) { colAttr.setXYZ(i, r2, g2, b2) }
    colAttr.needsUpdate = true
  }
  // proportion is a fact about a key, not a costume
  g.scale.setScalar(0.96 + ((hv >>> 13) % 10) / 90)
  g.__sewn = true
  return g
}

// =====================================================================
// THE CONTACT PASS. Three things separate a body that walks from a body
// that is played a walk animation, and not one of them is polygons.
//
//   THE STRIDE IS DRIVEN BY GROUND COVERED, not by elapsed time. The
//   old cadence was `phase += speed * dt * 5.4`, and 5.4 is a number
//   somebody liked: the foot's sweep speed therefore equalled the
//   body's speed at exactly one velocity and skated at every other.
//   Advance the phase by distance/stride instead and the contract is
//   satisfied by construction, at a walk, at a run, and through every
//   acceleration between them.
//
//   THE STANCE FOOT IS PLANTED. The root already follows groundYAt, but
//   the feet were children at a fixed height swung by a sine, so on any
//   slope one boot was buried in the hill and the other hung in air. A
//   two-bone solve puts each foot on the ground actually beneath it and
//   lets the knee absorb the difference.
//
//   THE BOB IS ZERO-MEAN AND LIVES OFF THE INTERPOLATED ROOT. The old
//   `g.position.y += |cos| * 0.045` only ever ADDED, into a value the
//   glide pass exponentially lerps toward the terrain. That is a leaky
//   integrator: it settles at ground + bob/k, and k is a function of
//   dt, so every body floated, by 6cm at 30fps and 26cm at 120fps. The
//   bob now oscillates about zero and is subtracted before each lerp.
// =====================================================================
const BOB_MEAN = 2 / Math.PI // the mean of |cos| over a cycle
// How far in front of its hip a foot plants, as a fraction of the leg.
// This one number decides everything else: a foot plants at +STEP_F,
// carries the body through its whole stance, and lifts at -STEP_F, so
// the ground covered per stance is 2, and per full cycle 4, times it.
// Cadence and footfall are therefore the SAME number seen twice, and
// cannot drift apart the way a hand-picked constant and a hand-picked
// amplitude always eventually do.
const STEP_F = 0.58
// A foot carries weight for 38% of the cycle, not 60%. The world moves
// a body one tile per 600ms tick and has NO second speed: at 1.667
// units per second under a 1.15-unit body that is 1.45 body-heights a
// second, which is a run, not a walk. A walk is defined by double
// support, two feet down at once, and a walk played at running speed
// can only ever read as scurrying. A run is defined by FLIGHT, and
// flight is what buys the stride: the body covers ground with nothing
// planted, so the step lengthens without the legs spreading wider, and
// the cadence falls from 4.6 steps a second to about 3.
const DUTY = 0.38
const ANK_H = 0.05                   // the ankle joint, above the sole
const HEEL_Z = -0.04, TOE_Z = 0.075  // where a boot actually touches, fore and aft
const stepHalf = (g) => STEP_F * (RIG.kneeDrop + RIG.ankleDrop) * (g.scale?.x || 1)

function strideOf(g) {
  if (g.__stride !== undefined) return g.__stride
  const sc = g.scale?.x || 1
  // The quad animator runs its gait at `an.ph * 1.15`, so a full cycle
  // arrives after ph advances 2*PI/1.15 -- which means the ground it
  // must cover per cycle is 1.15 TIMES the base figure, not a 1.15th of
  // it. I had it upside down: wolves and bears were taking 32% too many
  // steps for the distance, which is the same skate I came here to kill,
  // introduced by the fix for it.
  const s = g.__quad ? 4 * (g.__quad.bodyH ?? 0.45) * Math.sin(0.55) * 1.15 * sc
    : g.__adventurer ? (2 / DUTY) * stepHalf(g)
      : 4 * RIG.thighY * (g.__legScale ?? 0.8) * Math.sin(0.55) * sc
  g.__stride = Math.max(0.25, s)
  return g.__stride
}

// the ankle through one cycle: down at the heel, flat, up onto the toe,
// then carried back over. Positive is toe-down, the way a bone rotates.
function ankleRoll(stance, u) {
  if (stance) {
    if (u < 0.16) { const w = 1 - u / 0.16; return -0.30 * w * w }
    if (u < 0.70) return 0
    const w = (u - 0.70) / 0.30; return 0.55 * w * w
  }
  const e = u * u * (3 - 2 * u)
  return 0.55 + (-0.30 - 0.55) * e
}

// A two-bone solve in the leg's own plane. Given how far forward of the
// hip and how far below it the foot has to sit, return the thigh pitch
// and the knee bend that put it exactly there. The knee bends backward,
// the way a knee does, so the thigh always leads the hip-to-foot line
// rather than trailing it; that one sign is the difference between a
// person and a wading bird.
function solveLeg(tf, tv, l1, l2) {
  const dMax = (l1 + l2) * 0.999, dMin = Math.abs(l1 - l2) + 1e-3
  const d0 = Math.hypot(tf, tv)
  const d = Math.min(dMax, Math.max(dMin, d0))
  if (d0 > 1e-6 && d !== d0) { const k = d / d0; tf *= k; tv *= k }
  const cl = (x) => Math.min(1, Math.max(-1, x))
  const knee = Math.PI - Math.acos(cl((l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2)))
  const beta = Math.acos(cl((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)))
  return { thigh: -(Math.atan2(tf, Math.max(1e-4, tv)) + beta), knee }
}

function animateBeing(g, thing, id, dt, now, t) {
  const an = g.userData.an
  if (!an || !thing) return
  const s = world
  an.spd = lerpN(an.spd, Math.min(4, g.__speed ?? 0), 0.18)
  const moving = (g.__speed ?? 0) > 0.12
  an.mv = lerpN(an.mv, moving ? 1 : 0, 1 - Math.exp(-dt * 9))
  // the stride is a function of the ground, not the clock: measure what
  // the body actually covered since the last frame and spend exactly
  // that much cycle. A body that is not moving does not advance its
  // gait, which is why stopping now reads as stopping.
  const dxs = g.position.x - (an.lastX || g.position.x)
  const dzs = g.position.z - (an.lastZ || g.position.z)
  an.lastX = g.position.x; an.lastZ = g.position.z
  an.ph += (Math.min(0.6, Math.hypot(dxs, dzs)) / strideOf(g)) * Math.PI * 2
  const mvA = an.mv, s5 = Math.sin(an.ph)
  const t2 = Math.min(1, Math.max(0, (now - clock.at) / TICK_MS))

  // beasts first: fewer bones, same intent
  if (!g.__adventurer) {
    if (g.__dragon) {
      // Everything it does hangs off ONE clock: the beat of the wings.
      // The body rises on the downstroke and settles on the up, the
      // neck lags behind the chest the way a heavy thing on a long
      // neck does, the tail answers the neck, and the ground remembers
      // each stroke for about a third of a second.
      const d = g.__dragon
      const hunting = thing.action?.type === 'attackp' || thing.action?.type === 'attack'
      d.wing += dt * (hunting ? 3.9 : moving ? 3.2 : 2.15)
      const beat = Math.sin(d.wing), down = Math.max(0, -Math.cos(d.wing))
      for (let wi = 0; wi < 2; wi++) {
        const sd = wi === 0 ? -1 : 1, w = d.wings[wi]
        w.rotation.z = -sd * (beat * 0.62 + 0.14)     // the stroke
        w.rotation.y = sd * (0.12 + down * 0.30)      // and the cup it takes
        w.rotation.x = beat * 0.16
      }
      // the trunk rides its own downwash. On __yOff, so the glide lerp
      // strips it before the terrain follow and it cannot accumulate.
      g.__yOff = (beat * 0.5 + 0.5 - 0.5) * 0.34
      g.position.y += g.__yOff
      // the neck arcs, each link taking a little less of the wave than
      // the one before, and the whole of it leads toward what it wants
      let yawT = 0, pitT = 0
      const foe0 = thing.action?.type === 'attackp' ? s.players?.[thing.action.targetId] : null
      if (foe0) {
        let rem = Math.atan2(wx(foe0.x) - g.position.x, wz(foe0.y) - g.position.z) - g.rotation.y
        while (rem > Math.PI) rem -= Math.PI * 2
        while (rem < -Math.PI) rem += Math.PI * 2
        yawT = Math.max(-0.9, Math.min(0.9, rem)); pitT = 0.34
      }
      an.hYaw = lerpN(an.hYaw, yawT, 1 - Math.exp(-dt * 3.4))
      an.hPit = lerpN(an.hPit, pitT, 1 - Math.exp(-dt * 3.4))
      for (let i = 0; i < d.neck.length; i++) {
        const k = 1 - i / d.neck.length
        d.neck[i].rotation.x = (-0.30 + i * 0.055) + Math.sin(d.wing * 0.5 - i * 0.5) * 0.045 * k + an.hPit * (0.22 + i * 0.06)
        d.neck[i].rotation.y = an.hYaw * (0.1 + i * 0.055)
      }
      for (let i = 0; i < d.tail.length; i++) {
        const k = (i + 1) / d.tail.length
        d.tail[i].rotation.y = Math.sin(d.wing * 0.45 - i * 0.42 + an.seed) * 0.16 * k
        d.tail[i].rotation.x = 0.05 + Math.sin(d.wing * 0.5 - i * 0.3) * 0.05 * k - beat * 0.05 * k
      }
      // legs: it is mostly a walking thing, and it walks on the same
      // distance-driven phase as everything else in this window
      for (let li = 0; li < d.legs.length; li++) {
        const sgn = (li === 0 || li === 3) ? 0 : Math.PI
        const s7 = Math.sin(an.ph * 0.85 + sgn)
        d.legs[li][0].rotation.x = s7 * 0.34 * mvA
        d.legs[li][1].rotation.x = -0.18 - Math.max(0, -s7) * 0.5 * mvA
      }
      // THE FURNACE. It idles like a banked hearth and it opens when
      // the thing decides to kill you: the jaw comes down, the throat
      // throws real light onto real ground, and the eyes come up with it.
      const roar = hunting && t2 > 0.32 && t2 < 0.78
      if (roar && now - d.roarAt > TICK_MS * 1.4) {
        d.roarAt = now; sndX('growl', g.position)
        burst(g.position.x, g.position.y + 2.6, g.position.z, 'spark')
        QUAKE = Math.min(1, QUAKE + 0.55)
      }
      const fk = lerpN(d.fk ?? 0, roar ? 1 : 0, 1 - Math.exp(-dt * (roar ? 14 : 4)))
      d.fk = fk
      const idleGlow = 0.42 + Math.sin(now / 620 + an.seed) * 0.16
      d.jaw.rotation.x = 0.06 + fk * 0.62
      d.furnace.scale.setScalar(0.7 + idleGlow * 0.4 + fk * 1.5)
      d.furnace.material.opacity = 0.55 + fk * 0.45
      d.throat.intensity = idleGlow * 5 + fk * 62
      d.throat.distance = 16 + fk * 22
      if (g.userData.eyeMat) g.userData.eyeMat.color.setHex(fk > 0.4 ? 0xffd08a : EYE_LAMPS.dragon)
      // and the ground keeps the beat: each downstroke lands on the
      // world, not just on the animation
      if (down > 0.985 && now - (d.thumpAt ?? 0) > 260) {
        d.thumpAt = now
        const near = camera.position.distanceTo(g.position)
        if (near < 46) QUAKE = Math.min(1, QUAKE + 0.42 * (1 - near / 46))
        for (const sx3 of [-1, 1])
          burst(g.position.x + sx3 * 3.2 * Math.cos(g.rotation.y),
            g.position.y + 0.1, g.position.z - sx3 * 3.2 * Math.sin(g.rotation.y), 'dust')
      }
      const hitK3 = Math.max(0, 1 - (now - (g.__hurtAt ?? -1e9)) / 220)
      g.rotation.x = -hitK3 * 0.09
      return
    }
    if (g.__quad) { // the sewn quadruped: diagonal pairs, a tail of moods
      const q = g.__quad
      const gaitPh = an.ph * 1.15
      const pairs = [0, Math.PI, Math.PI, 0] // FL+BR against FR+BL
      for (let li = 0; li < 4; li++) {
        const s6 = Math.sin(gaitPh + pairs[li])
        q.legsQ[li][0].rotation.x = s6 * 0.55 * mvA
        q.legsQ[li][1].rotation.x = Math.max(0, -s6) * 0.9 * mvA
      }
      q.hips.position.y = q.bodyH + Math.abs(Math.cos(gaitPh)) * 0.03 * mvA
      q.chest.rotation.x = mvA * 0.05 + Math.sin(now / 900 + an.seed) * 0.02 * (1 - mvA) // breath in the ribs
      const wag = (g.userData.act ? 2.2 : mvA * 1.4 + 0.3)
      q.tail1.rotation.y = Math.sin(t * wag * 2.2 + an.seed) * (q.wolf ? 0.35 : 0.15)
      q.tail2.rotation.y = Math.sin(t * wag * 2.2 + an.seed - 0.6) * (q.wolf ? 0.4 : 0.18)
      q.neck.rotation.x = -mvA * 0.12 + Math.sin(now / 1400 + an.seed) * 0.05 * (1 - mvA)
      const hitK2 = Math.max(0, 1 - (now - (g.__hurtAt ?? -1e9)) / 160)
      if (hitK2 > 0) g.rotation.x = -hitK2 * 0.12
      else g.rotation.x = 0
      g.__yOff = (Math.abs(Math.cos(gaitPh)) - BOB_MEAN) * 0.03 * mvA
      g.position.y += g.__yOff
      return
    }
    if (g.__spineRest !== undefined) { // sewn goblin & troll: the hunch breathes
      ;(g.__spineBone).rotation.x = g.__spineRest + Math.sin(now / 800 + an.seed) * 0.03
    }
    // `now / 130` is a wall clock: a fixed 130ms period whatever the
    // speed, so these legs skated at every pace but one, snapped on and
    // off a boolean instead of blending, and -- having no per-creature
    // seed -- every four-legged thing in the county stepped in perfect
    // unison. On the shared distance-driven phase, with the diagonal
    // pairing a trot actually uses, and a seed each.
    if (g.userData.legs4) {
      const pairs4 = [0, Math.PI, Math.PI, 0]
      for (let li = 0; li < 4; li++)
        g.userData.legs4[li].rotation.x = Math.sin(an.ph * 1.15 + pairs4[li] + an.seed) * 0.6 * mvA
    }
    // built, pushed onto the group, and then never touched by anything:
    // the hinged goblin walked the whole world on frozen legs
    if (g.userData.legs2) {
      g.userData.legs2[0].rotation.x = s5 * 0.5 * mvA
      g.userData.legs2[1].rotation.x = -s5 * 0.5 * mvA
    }
    if (g.userData.hunch) g.userData.hunch.rotation.x = 0.32 + Math.sin(now / 700 + an.seed * 3) * 0.04
    // §6cz: a rider's legs do not walk. When the horse is up it takes the
    // gait -- the same diagonal-paired quad trot every four-legged thing
    // here uses -- and the citizen's legs settle forward into a seat
    // instead of striding in mid-air above the saddle.
    const horse0 = g.userData.horse
    const riding0 = !!(horse0 && horse0.visible)
    if (riding0) {
      const pairsH = [0, Math.PI, Math.PI, 0]
      for (let li = 0; li < 4; li++)
        horse0.userData.legs4[li].rotation.x = Math.sin(an.ph * 1.15 + pairsH[li] + an.seed) * 0.55 * mvA
      if (horse0.userData.tail)
        horse0.userData.tail.rotation.z = 0.5 + Math.sin(an.ph * 0.6 + an.seed) * 0.1
    }
    if (g.userData.legs && g.userData.legs[0]?.userData?.joint) {
      if (riding0) {
        // knees forward over the barrel, boots hanging: a seat, not a stride
        g.userData.legs[0].rotation.x = -0.62
        g.userData.legs[1].rotation.x = -0.62
        g.userData.legs[0].userData.joint.rotation.x = 0.95
        g.userData.legs[1].userData.joint.rotation.x = 0.95
      } else {
      g.userData.legs[0].rotation.x = s5 * 0.55 * mvA
      g.userData.legs[1].rotation.x = -s5 * 0.55 * mvA
      g.userData.legs[0].userData.joint.rotation.x = (0.04 + Math.max(0, -s5) * 0.9) * mvA
      g.userData.legs[1].userData.joint.rotation.x = (0.04 + Math.max(0, s5) * 0.9) * mvA
      }
    }
    if (g.userData.arms && g.userData.arms[0]?.rotation) {
      const fighting0 = thing.action?.type === 'attackp' || g.__lungeAt && (now - g.__lungeAt) < 400
      // `Math.sin(t * 12)` with no seed in it: continuous air-fencing at
      // twelve radians a second, and every goblin in the county doing it
      // on the same frame. The citizens were taken off this months ago;
      // the things hunting them never were. One blow per tick now, on
      // the beat combat is actually resolved on, wound up and brought
      // down, with a breath of scatter so a pack is not a metronome.
      const b0 = Math.min(1, Math.max(0, t2 + Math.sin(an.seed * 7) * 0.05))
      const sw0 = b0 < 0.5 ? -0.6 - (b0 / 0.5) * 1.5
        : 0.5 - Math.max(0, 1 - (b0 - 0.5) / 0.35) * 2.6
      g.userData.arms[0].rotation.x = fighting0 ? sw0 : -s5 * 0.45 * mvA
      g.userData.arms[1].rotation.x = fighting0 ? (0.2 + Math.max(0, -sw0) * 0.12) : s5 * 0.45 * mvA
    }
    g.__yOff = (Math.abs(Math.cos(an.ph)) - BOB_MEAN) * 0.05 * mvA
    g.position.y += g.__yOff
    return
  }

  const fighting = thing.action?.type === 'attack' || thing.action?.type === 'attackp'
  const working = thing.action?.type === 'gather'
  const nd2 = working ? s.nodes?.[thing.action.nodeId] : null
  const fishingW = famOf(nd2?.type) === 'fishing-spot'
  const foe = thing.action?.type === 'attack' ? s.mobs?.[thing.action.mobId]
    : thing.action?.type === 'attackp' ? s.players?.[thing.action.targetId] : null
  if (foe) g.userData.foePos = { x: foe.x, y: foe.y }
  const look0 = lookOf(thing.equipment?.weapon?.item)
  // an exchange is a LANDED blow: the swing plays only when the wound
  // appeared (syncAll stamps __hitAt off the hp drop). Between hits
  // the arms hold guard, no more air-fencing at animation speed.
  const hitAgo = g.__hitAt ? (now - g.__hitAt) : 1e9
  // A blow lands every `every` ticks -- the table has said so all along
  // and the animator never read it, normalising every strike to a flat
  // TICK_MS. So a maul swung no slower than a dagger flicked and then
  // stood in guard for the remaining 1200ms of its own cadence. Weight
  // IS cadence; a heave that finishes in 600ms is not heavy, it is
  // hurried. Each style now gets the share of its weapon's interval
  // that suits it: a maul fills nearly all of 1800ms, a dagger spends
  // half of 1200 and waits out the rest.
  const STYLE_DUR = { heave: 0.95, swing: 0.80, thrust: 0.70, quick: 0.50, whip: 0.55, draw: 0.90 }
  const STYLE_HIT = { heave: 0.66, swing: 0.55, thrust: 0.45, quick: 0.28, whip: 0.42, draw: 0.52 }
  const span = TICK_MS * Math.max(1, look0.every ?? 2) * (STYLE_DUR[look0.style] ?? 0.8)
  const exch = fighting && hitAgo < span
  let strikeA = -1.1, strikeT2 = 0, drawK = 0, strikeP = 0

  // the strike, in six acts (heave / quick / thrust / whip / draw / swing)
  if (exch) {
    const raw = Math.min(1, hitAgo / span)
    // A BEAT OF HOLD AT CONTACT. The arc used to pass through the
    // landing at constant speed, which is most of why it read as waving
    // rather than hitting. Time now runs at a third pace either side of
    // the moment of impact and recovers over a sixth of the swing --
    // monotonic, so nothing pops, and about 90ms of hitstop, which is
    // the cheapest thing in the whole of game feel.
    const c = STYLE_HIT[look0.style] ?? 0.55, d = raw - c
    const t2 = c + d * (0.32 + 0.68 * Math.min(1, Math.abs(d) / 0.16))
    strikeP = t2
    const st = look0.style
    if (st === 'heave') {
      if (t2 < 0.55) { const u = t2 / 0.55, e = u * u * (3 - 2 * u); strikeA = -1.1 - e * 1.9 }
      else if (t2 < 0.7) { const u = (t2 - 0.55) / 0.15; strikeA = -3.0 + u * u * 3.7 }
      else { const u = (t2 - 0.7) / 0.3; strikeA = 0.7 - u * u * (3 - 2 * u) * 1.8 }
      strikeT2 = Math.max(0, Math.sin(Math.min(1, Math.max(0, (t2 - 0.5) / 0.4)) * Math.PI))
    } else if (st === 'quick') {
      if (t2 < 0.16) { const u = t2 / 0.16; strikeA = -1.1 - u * 0.5 }
      else if (t2 < 0.3) { const u = (t2 - 0.16) / 0.14; strikeA = -1.6 + u * u * 1.9 }
      else { const u = Math.min(1, (t2 - 0.3) / 0.35); strikeA = 0.3 - u * u * (3 - 2 * u) * 1.4 }
      strikeT2 = Math.max(0, Math.sin(Math.min(1, Math.max(0, (t2 - 0.14) / 0.3)) * Math.PI))
    } else if (st === 'thrust') {
      const u = t2 < 0.4 ? t2 / 0.4 : Math.max(0, 1 - (t2 - 0.4) / 0.45)
      strikeA = -1.35 + (t2 < 0.4 ? -0.25 * u : 0.5 * (1 - u))
      g.userData.lunge = t2 >= 0.4 && t2 < 0.62 ? 0.22 : 0
      strikeT2 = Math.max(0, Math.sin(Math.min(1, Math.max(0, (t2 - 0.38) / 0.28)) * Math.PI))
    } else if (st === 'whip') {
      // the chain has no edge to land: it is wound over and lashed down,
      // and it is the only weapon in the table that strikes every tick
      const a2 = t2 * Math.PI * 2
      strikeA = -1.1 - Math.sin(a2) * 1.5 - Math.max(0, Math.sin(a2 * 0.5)) * 0.6

// comes back the moment it steps off it.

          : s9 >= 7200 ? Math.round(s9 / 3600) + ' hours' : s9 >= 3600 ? 'an hour'

    // safe to repeat; `spawn` is the birth itself and is never ours to send.
    // One soul in two intervals is admitted, so a knock that does not take is
    // normal and simply sent again -- throttled, so a busy evening is not a
    // flood. The crossing waits at the fountain for the resident to make it.
    if (entered && ownKey && !m.state.players[ownKey.pub]) keepAttending(m.state)
    // the verb appears only for a soul with no body, and its label says

    // in perfect agreement. Your own gets the full ceremony: banner,
    // rockets over your head, THE fanfare. A stranger's gets rockets
    // over THEIR head, the fanfare from their true direction fading

    // from its true direction, if you were close enough to deserve it

// ---- the day, the frame ----
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpV3 = new THREE.Vector3()

  const now = performance.now()
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now
  const t = now / 1000

  // the constitutional day drives a scattered sky; PMREM feeds it back
  // into every material as the light of the world
  const dayF = world ? (((world.tick % DAY) + Math.min(1, (now - clock.at) / TICK_MS)) / DAY) : 0.3
  const elev = Math.sin(dayF * Math.PI * 2) // + by day

  // every photo window over this world watches the same storm arrive.

    : povMode ? fovOfFocal(focalMM()) + mySpd * 4.5 * (1 - spyZoom) : 46
  if (Math.abs(camera.fov - fovT) > 0.02) {
    camera.fov += (fovT - camera.fov) * Math.min(1, dt * 3)
    camera.updateProjectionMatrix()
  }
  // a long lens shows every heartbeat: the frame breathes harder the
  // more of it you have magnified. This is the handheld tell.
  if (povMode && entered) {
    const tele = focalIdx / (FOCALS.length - 1)
    const br = 0.00042 * (1 + tele * 7)
    camera.position.x += Math.sin(t * 1.31) * br + Math.sin(t * 0.47) * br * 0.6
    camera.position.y += Math.sin(t * 1.07 + 1.7) * br * 1.2
    camera.position.z += Math.cos(t * 1.19 + 0.4) * br
  }
  pollLight(now)
  renderFinder()
  QUAKE = Math.max(0, QUAKE - dt * 2.6)
  const shake = ownHurt * 0.05 + flash * 0.05 * Math.min(1, rainAmt * 2) + QUAKE * 0.055
  if (shake > 0.002) camera.position.add(tmpV3.set(
    (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake * 0.6, (Math.random() - 0.5) * shake))
  // the stone stands aside, now that the camera has settled for the frame
  if (entered && !povMode) ghostOccluders(focus.x, focus.y + 0.9, focus.z, dt)
  if (entered) liftRoofs(focus.x, focus.z, dt)
  sun.position.copy(focus).addScaledVector(sunDir, 60)
  sun.target.position.copy(focus)
  moon.position.copy(focus).addScaledVector(sunDir, -60)
  // the rim rides opposite whichever light is key, lifted so it grazes
  // silhouettes from above-behind; it dims under overcast (no sky to
  // bounce) and hands over to the moon's own blue at night
  rim.position.copy(focus).addScaledVector(sunDir, -50).y += 26
  rim.target.position.copy(focus)
  rim.intensity = (dayAmt * 0.5 + nightAmt * 0.12) * (1 - overcast * 0.75) * TUNE.rim
  moon.target.position.copy(focus)
  skyAnchor.position.copy(focus)

  // the sun (or the moon, after dark) projected onto the film plane:
  // the shafts only pour when the light is actually in frame, and they
  // pour hardest at the golden hour, when there is the most air to
  // catch them and the most reason to stand still.
  const sunUp = dayAmt > 0.06
  tmpV2.copy(focus).addScaledVector(sunDir, sunUp ? 280 : -280).project(camera)
  const inFrame = tmpV2.z < 1 && Math.abs(tmpV2.x) < 1.35 && Math.abs(tmpV2.y) < 1.35
  raysPass.uniforms.uSun.value.set(tmpV2.x * 0.5 + 0.5, tmpV2.y * 0.5 + 0.5)
  // the raymarcher doesn't care whether the light is in frame, that's
  // the whole point: stand SIDEWAYS to a sunbeam and watch it hang in
  // the air as a body. Density rises with the damp (rain, overcast,
  // the low golden air, the night's held breath); the shadow map is
  // the sculptor. On desktop the screen-space shafts stand down.
  if (volPass && volPass.enabled) {
    const vu = volPass.uniforms
    vu.tDepth.value = gtao.depthTexture
    vu.tShadow.value = sun.shadow.map ? sun.shadow.map.texture : null
    vu.uShadowMat.value.copy(sun.shadow.matrix)
    vu.uProjInv.value.copy(camera.projectionMatrixInverse)
    vu.uCamMat.value.copy(camera.matrixWorld)
    vu.uLightDir.value.copy(sunDir).multiplyScalar(sunUp ? 1 : -1)
    vu.uLightCol.value.copy(sunUp ? sun.color : moon.color)
    vu.uDens.value = (0.028 + rainAmt * 0.03 + overcast * 0.018 + warm * 0.035 + nightAmt * 0.02) * TUNE.volDens
    const volT = !vu.tShadow.value ? 0 : sunUp
      ? (0.55 + warm * 1.0) * dayAmt * (1 - overcast * 0.8) + flash * 0.4
      : nightAmt * 0.26 * (1 - overcast * 0.7)
    vu.uAmt.value += (volT * TUNE.vol - vu.uAmt.value) * Math.min(1, dt * 4)
  }
  // the cumulus deck rides the same weather, the same wind, the same
  // sun -- and the same borrowed depth buffer
  if (cloudPass && cloudPass.enabled) {
    const cu = cloudPass.uniforms
    cu.tDepth.value = gtao.depthTexture
    cu.uProjInv.value.copy(camera.projectionMatrixInverse)
    cu.uCamMat.value.copy(camera.matrixWorld)
    cu.uLightDir.value.copy(sunDir).multiplyScalar(sunUp ? 1 : -1)
    cu.uSunCol.value.copy(sunUp ? sun.color : moon.color).multiplyScalar(sunUp ? 1 : 0.45)
    cu.uHazeCol.value.copy(scene.fog.color).multiplyScalar(1.7)
    cu.uTime.value = t
    cu.uWind.value = uWindA.value
    cu.uCover.value = 0.3 + overcast * 0.55 + rainAmt * 0.1 + TUNE.cover
    cu.uAmt.value += ((dayAmt + nightAmt * 0.55) * 0.92 * TUNE.cloud - cu.uAmt.value) * Math.min(1, dt * 2)
  }
  const rayTarget = ((volPass && volPass.enabled) || !inFrame) ? 0 : sunUp
    ? (0.16 + warm * 0.55) * dayAmt * (1 - overcast) + flash * 0.25
    : nightAmt * 0.1 * (1 - overcast * 0.7)
  raysPass.uniforms.uAmt.value += (rayTarget - raysPass.uniforms.uAmt.value) * Math.min(1, dt * 5)
  raysPass.uniforms.uTint.value.setHSL(sunUp ? 0.09 - warm * 0.045 : 0.62, sunUp ? 0.55 + warm * 0.2 : 0.35, 0.55)
  // the lens confesses: ghosts walk the axis while the light is in frame
  const ghostT = (inFrame ? (sunUp ? dayAmt * (1 - overcast) * (0.35 + warm * 0.4) : nightAmt * 0.12) : 0) + flash * 0.55
  lensPass.uniforms.uAmt.value += (ghostT * TUNE.ghost - lensPass.uniforms.uAmt.value) * Math.min(1, dt * 5)
  lensPass.uniforms.uWeave.value.set(
    (Math.sin(t * 1.7) + Math.sin(t * 2.63)) * 0.0006 * cineAmt,
    (Math.sin(t * 1.31) + Math.sin(t * 2.11)) * 0.0006 * cineAmt)

  // ---- the rest of the atmosphere hangs from the same numbers ----
  moonSp.position.copy(focus).addScaledVector(sunDir, -300)
  moonSp.material.opacity = nightAmt * (1 - overcast * 0.85)
  flareAnchor.position.copy(focus).addScaledVector(sunDir, 280)
  lensflare.visible = dayAmt > 0.12 && overcast < 0.55
  for (const sp of clouds) {
    sp.position.x += sp.userData.speed * (0.5 + uWindA.value) * dt * 2.2
    if (sp.position.x > 195) sp.position.x = -195
    sp.material.opacity = Math.min(0.88, sp.userData.base * (0.5 + overcast * 1.1) * (0.3 + dayAmt * 0.7))
    sp.material.color.setHSL(0.06, warm * 0.5, Math.max(0.06, 0.2 + dayAmt * 0.66 - overcast * 0.2) + flash * 0.3)
  }
  // tomorrow's storm shows itself today: the wall on the horizon
  const wNext = wOf(dayIdx + 1)
  const frontAmt = Math.max(0, wNext - wthr) * THREE.MathUtils.smoothstep(dayF, 0.5, 0.92) * (1 - wk)
  const frontAz = (tileHash(dayIdx + 1, 55, 66) % 628) / 100
  for (const sp of frontSprites) {
    const az2 = frontAz + sp.userData.az
    const dist2 = 265 - frontAmt * 75 // it closes as the hour nears
    sp.position.set(focus.x + Math.sin(az2) * dist2, sp.userData.h,
      focus.z + Math.cos(az2) * dist2)
    sp.material.opacity = frontAmt * 0.55
    sp.material.color.setHSL(0.6, 0.18, 0.12 + dayAmt * 0.22)
  }
  if (flies) {
    flyUniforms.uTime.value = t
    flyUniforms.uNight.value = nightAmt * (1 - rainAmt)
    flyUniforms.uDay.value = dayAmt * (1 - overcast) * 0.8
  }
  // over the high country the same weather falls as snow: slower,
  // whiter, shorter flecks that barely lean. Same hash, same day ,
  // only the altitude changes what the sky decides to send down.
  const snowy = winAmt > 0.5 || !!(me && ['mountain', 'scree', 'crags'].includes(
    terrainOf(Math.min(W - 1, Math.max(0, me.x)), Math.min(H - 1, Math.max(0, me.y)))))
  rain.material.color.setHex(snowy ? 0xf0f5ff : 0x9fb4c8)
  rain.material.opacity = rainAmt * (snowy ? 0.75 : 0.5)
  if (rainAmt > 0.02) {
    const lean = (Math.sin(uWindT.value * 0.5) * 0.6 + uWindA.value * 0.4) * (snowy ? 0.55 : 1)
    const fall = snowy ? 0.24 : 1, seg = snowy ? 0.09 : 0.42
    for (let i = 0; i < rainN; i++) {
      const y = rainPos[i * 6 + 1]
      if (y < focus.y - 2.5 || y > focus.y + 30) {
        rainPos[i * 6] = focus.x + (Math.random() * 34 - 17)
        rainPos[i * 6 + 1] = focus.y + 9 + Math.random() * 6
        rainPos[i * 6 + 2] = focus.z + (Math.random() * 34 - 17)
      } else {
        rainPos[i * 6 + 1] = y - (13 + (i % 5)) * fall * dt
        rainPos[i * 6] += lean * dt + (snowy ? Math.sin(t * 2 + i) * 0.3 * dt : 0)
      }
      rainPos[i * 6 + 3] = rainPos[i * 6] + lean * 0.06
      rainPos[i * 6 + 4] = rainPos[i * 6 + 1] - seg
      rainPos[i * 6 + 5] = rainPos[i * 6 + 2]
    }
    rain.geometry.attributes.position.needsUpdate = true
  }
  const auroraOf = (d2) => (tileHash(d2, 5, 888) % 100) < 28 ? 1 : 0
  const auroraAmt = (auroraOf(dayIdx) * (1 - wk) + auroraOf(dayIdx + 1) * wk) * nightAmt * (1 - overcast)
  auroraMat.uniforms.uTime.value = t
  auroraMat.uniforms.uAlpha.value = auroraAmt * 0.5
  for (const p of auroras) p.visible = auroraAmt > 0.02
  if (nightAmt > 0.5 && overcast < 0.4 && t > meteor.next) {
    meteor.next = t + 7 + Math.random() * 14
    meteor.life = 0.9
    const a2 = Math.random() * Math.PI * 2
    meteor.sp.position.set(focus.x + Math.cos(a2) * 160, 110 + Math.random() * 60, focus.z + Math.sin(a2) * 160)
    meteor.vx = (Math.random() - 0.5) * 160; meteor.vy = -60 - Math.random() * 50
    meteor.vz = (Math.random() - 0.5) * 160
  }
  if (meteor.life > 0) {
    meteor.life -= dt
    meteor.sp.position.x += meteor.vx * dt
    meteor.sp.position.y += meteor.vy * dt
    meteor.sp.position.z += meteor.vz * dt
    meteor.sp.material.opacity = Math.min(1, meteor.life * 2.2) * nightAmt
  } else meteor.sp.material.opacity = 0

  // the sun-shower's arc: strongest on the days the hash hangs the
  // weather halfway, standing exactly opposite the sun like it must
  const shower = THREE.MathUtils.clamp(1 - Math.abs(wthr - 0.5) * 4, 0, 1)
  const rbA = shower * dayAmt * (1 - rainAmt) * (0.5 + warm * 0.4)
  rainbow.visible = rbA > 0.02
  if (rainbow.visible) {
    rainbowMat.uniforms.uAlpha.value = rbA
    tmpV3.set(-sunDir.x, 0, -sunDir.z).normalize()
    rainbow.position.set(focus.x + tmpV3.x * 175, focus.y - 2, focus.z + tmpV3.z * 175)
    rainbow.lookAt(focus.x, focus.y - 2, focus.z)
  }

  // the bolt flickers out with its own flash; the strike lights the rain
  bolt.visible = flash > 0.02
  boltMat.opacity = flash > 0 ? flash * (0.55 + Math.random() * 0.45) : 0
  boltLight.intensity = flash * 260

  // the flock wheels while the day allows it
  const birdA = dayAmt * (1 - overcast * 0.55) * (1 - rainAmt)
  flock.visible = birdA > 0.04
  if (flock.visible) {
    birdMat.opacity = 0.8 * birdA
    flock.position.x += (focus.x + 26 * Math.sin(t * 0.026) - flock.position.x) * Math.min(1, dt * 0.5)
    flock.position.z += (focus.z + 26 * Math.cos(t * 0.021) - flock.position.z) * Math.min(1, dt * 0.5)
    for (const b of birds) {
      const ud = b.userData, ang = t * ud.sp + ud.ph
      b.position.set(Math.cos(ang) * ud.r, ud.h + Math.sin(t * 0.6 + ud.ph) * 1.4, Math.sin(ang) * ud.r)
      b.rotation.y = -ang - (ud.sp < 0 ? Math.PI : 0)
      const fl = Math.sin(t * ud.flap * 3 + ud.ph * 5) * 0.55
      ud.w1.rotation.z = fl; ud.w2.rotation.z = -fl
    }
  }

  // the mix follows the weather: four times a second the beds are told
  // what the day is doing, and the near fires, the shore, the aurora,
  // and a heart with reason to be heard all get their say
  if (audio && now - lastAudioAt > 250) {
    lastAudioAt = now
    const tA = AC.currentTime
    audio.wind.g.gain.setTargetAtTime(0.035 + uWindA.value * 0.1, tA, 0.5)
    audio.wind.f.frequency.setTargetAtTime(240 + uWindA.value * 540, tA, 0.5)
    audio.rain.g.gain.setTargetAtTime(rainAmt * (snowy ? 0.02 : 0.14), tA, 0.5)
    audio.crickets.gain.setTargetAtTime(nightAmt * (1 - rainAmt) * 0.04, tA, 0.8)
    audio.pad.gain.setTargetAtTime(auroraAmt * 0.016, tA, 1.2)
    audio.wet.gain.setTargetAtTime(0.06 + nightAmt * 0.2, tA, 1)
    let fireD = 1e9, fireG = null
    for (const g of vis.node.values())
      if (g.userData.fireLight) { const d2 = g.position.distanceTo(focus)
        if (d2 < fireD) { fireD = d2; fireG = g } }
    if (fireG && fireD < 11 && Math.random() < 0.75)
      audio.crackle(fireD, panOf(fireG.position.x, fireG.position.z))
    let wD = 1e9 // how far to the nearest water the truth knows about
    if (me && waterSet) for (let dy2 = -4; dy2 <= 4; dy2++) for (let dx2 = -4; dx2 <= 4; dx2++)
      if (waterSet.has((me.x + dx2) + ',' + (me.y + dy2))) wD = Math.min(wD, Math.hypot(dx2, dy2))
    audio.lap.g.gain.setTargetAtTime(wD < 5 ? (0.045 + 0.02 * Math.sin(t * 0.9)) / (1 + wD) : 0, tA, 0.6)
    if (wD < 6 && dayAmt > 0.35 && Math.random() < 0.06) audio.gull((Math.random() - 0.5) * 1.6)
    if (flock.visible && dayAmt > 0.4 && Math.random() < 0.2)
      audio.chirp(panOf(flock.position.x, flock.position.z))
    if (me && me.hp <= 3 && now - lastBeatAt > 950) { // the body keeps its own drum
      lastBeatAt = now; audio.thump(0); audio.thump(0.17)
    }
    // the score keeps the magic hours: golden light and deep night get
    // music; noon, storms, and overcast get the dignity of silence
    const musicAmt = Math.max(warm * dayAmt, nightAmt * 0.55) * (1 - rainAmt) * (1 - overcast * 0.5)
    if (musicAmt > 0.06) {
      if (now > nextChordAt) { nextChordAt = now + 12000 + Math.random() * 8000
        audio.chord(nightAmt > 0.5, 0.05 * musicAmt) }
      if (now > nextPluckAt) { nextPluckAt = now + 2800 + Math.random() * 6500
        if (Math.random() < 0.75) audio.pluck(nightAmt > 0.5, 0.05 * musicAmt, (Math.random() - 0.5) * 1.4) }
    } else nextChordAt = Math.max(nextChordAt, now + 5000)
  }

  // the leaves borrow trees and ride the wind down
  if (now - lastTreeAt > 1600) {
    lastTreeAt = now
    treeCache = []
    for (const g of vis.node.values())
      if (g.visible && famOf(g.userData.type) === 'tree' && !g.userData.depleted && g.position.distanceTo(focus) < 30) treeCache.push(g)
  }
  if (treeCache.length) {
    for (let i = 0; i < LEAF_N; i++) {
      leafLife[i] -= dt
      if (leafLife[i] <= 0) {
        const tr = treeCache[(Math.random() * treeCache.length) | 0]
        leafPos[i * 3] = tr.position.x + (Math.random() - 0.5) * 1.2
        leafPos[i * 3 + 1] = tr.position.y + 1.6 + Math.random() * 0.9
        leafPos[i * 3 + 2] = tr.position.z + (Math.random() - 0.5) * 1.2
        leafPh[i] = Math.random() * 6.28
        leafLife[i] = 3.5 + Math.random() * 4
      } else {
        leafPos[i * 3 + 1] -= dt * (0.22 + 0.1 * Math.sin(t * 2.2 + leafPh[i]))
        leafPos[i * 3] += dt * (Math.sin(t * 1.8 + leafPh[i]) * 0.5 + uWindA.value * 0.5)
        leafPos[i * 3 + 2] += dt * Math.cos(t * 1.5 + leafPh[i] * 2) * 0.4
      }
    }
    leafGeo.attributes.position.needsUpdate = true
    leaves.material.opacity = Math.min(0.95, (0.3 + uWindA.value * 0.5) * (1 + autAmt * 1.1))
      * (1 - rainAmt * 0.6) * (1 - winAmt * 0.9)
    leaves.material.color.setRGB(1, 1, 1).lerp(tmpC.setRGB(1.4, 1.02, 1.2), sprAmt) // blossom drift
  } else leaves.material.opacity = 0

  // the grass is told where the boots are
  uPlayer.value.copy(focus)
  // the node window: only the near country exists as meshes, for all
  // three render passes. An eighth re-judged per frame.
  {
    const VIEW_R = Math.min(scene.fog.far + 30, 190)
    if (nodeWinKeys.length !== vis.node.size) nodeWinKeys = [...vis.node.keys()]
    const nWK = Math.max(1, nodeWinKeys.length)
    const q5 = Math.max(1, Math.ceil(nWK / 8))
    for (let k5 = 0; k5 < q5; k5++) {
      const g = vis.node.get(nodeWinKeys[(nodeWinCursor + k5) % nWK])
      if (!g) continue
      const dxn = g.position.x - camera.position.x, dzn = g.position.z - camera.position.z
      g.visible = (dxn * dxn + dzn * dzn) < VIEW_R * VIEW_R
    }
    nodeWinCursor = (nodeWinCursor + q5) % nWK
  }
  if (me) grassFollow(me.x, me.y) // the meadow keeps pace with the walker
  // the country beyond the fog rests: chunks outside sight skip the GPU
  for (const ck of groundChunks) {
    const dcx = ck.cx - camera.position.x, dcz = ck.cz - camera.position.z
    ck.m.visible = Math.sqrt(dcx * dcx + dcz * dcz) - ck.r < scene.fog.far + 24
  }
  // the shadow-forms take their rim from whatever light stands behind
  // them: gold at the hours, silver under the moon, white in the bolt
  uRimC.value.setHSL(nightAmt > 0.5 ? 0.6 : 0.085 - warm * 0.03,
    nightAmt > 0.5 ? 0.25 : 0.5 + warm * 0.3, 0.55 + warm * 0.15)
  uRimA.value = (0.9 + warm * 2.4 + nightAmt * 0.45 + flash * 3.2) * (1 - overcast * 0.3)
  uRimL.value.copy(sunDir)
  if (nightAmt > 0.5) uRimL.value.negate() // the moon holds the rim after dark
  uRimL.value.transformDirection(camera.matrixWorldInverse)
  uFrayT.value = t
  // the three nearest hunters press the grass like the boots do
  { let pi2 = 1
    for (const gm of vis.mob.values()) {
      if (pi2 > 3) break
      if (gm.position.distanceTo(focus) < 14) uPushers.value[pi2++].copy(gm.position)
    }
    while (pi2 <= 3) uPushers.value[pi2++].set(0, -99, 0) }
  // the breath: near beasts give themselves away in cool air
  if (now - lastBreathAt > 380 && (nightAmt > 0.15 || warm > 0.3 || winAmt > 0.3)) {
    lastBreathAt = now
    for (const gm of vis.mob.values()) {
      const d2b = gm.position.distanceTo(focus)
      if (d2b > 15 || Math.random() < 0.55) continue
      const sp = breaths[breathIdx++ % breaths.length]
      sp.position.set(
        gm.position.x + Math.sin(gm.rotation.y) * 0.35,
        gm.position.y + 0.55,
        gm.position.z + Math.cos(gm.rotation.y) * 0.35)
      sp.userData.born = now; sp.userData.dx2 = Math.sin(gm.rotation.y) * 0.2
      sp.userData.dz2 = Math.cos(gm.rotation.y) * 0.2
      sp.visible = true
    }
    for (const gm of vis.mob.values()) { // and the embers rise
      if (gm.position.distanceTo(focus) > 18 || Math.random() < 0.45) continue
      const mt = motes[moteIdx++ % motes.length]
      mt.material.color.setHex(EYE_LAMPS[gm.userData.type] ?? 0xffc46a)
      mt.position.set(
        gm.position.x + (Math.random() - 0.5) * 0.4,
        gm.position.y + 0.45 + Math.random() * 0.5,
        gm.position.z + (Math.random() - 0.5) * 0.4)
      mt.userData.born = now
      mt.visible = true
    }
  }
  for (const sp of breaths) {
    if (!sp.visible) continue
    const a3 = (now - sp.userData.born) / 1100
    if (a3 >= 1) { sp.visible = false; continue }
    sp.position.y += dt * 0.28
    sp.position.x += sp.userData.dx2 * dt
    sp.position.z += sp.userData.dz2 * dt
    const sc3 = 0.09 + a3 * 0.26
    sp.scale.set(sc3, sc3, 1)
    sp.material.opacity = 0.17 * (1 - a3) * (0.5 + nightAmt * 0.5)
  }
  for (const mt of motes) {
    if (!mt.visible) continue
    const a3 = (now - mt.userData.born) / 1500
    if (a3 >= 1) { mt.visible = false; continue }
    mt.position.y += dt * 0.35
    const sc3 = 0.05 + a3 * 0.05
    mt.scale.set(sc3, sc3, 1)
    mt.material.opacity = 0.5 * Math.sin(Math.min(1, a3) * Math.PI) * (0.35 + nightAmt * 0.65)
  }

  // the mist pools at the magic hours and drifts on its own errands
  const mistAmt = Math.max(warm * 0.8, nightAmt * 0.4) * (1 - uWindA.value * 0.4) * (1 - rainAmt)
  // the air gets its marching orders: ground fog thickens with the
  // mist hours, the rain, and the overcast; in-scatter aims at the sun
  // by day (fiercest at golden hour, when the low light has the most
  // air to cross) and at the moon by night, in silver, at a whisper.
  // One mutation here reaches every fogged material in the scene.
  const nightKey = nightAmt > dayAmt
  FOGX.dir.x = nightKey ? -sunDir.x : sunDir.x
  FOGX.dir.y = nightKey ? -sunDir.y : sunDir.y
  FOGX.dir.z = nightKey ? -sunDir.z : sunDir.z
  if (nightKey) { FOGX.sun.x = 0.5; FOGX.sun.y = 0.6; FOGX.sun.z = 0.85 }
  else { FOGX.sun.x = Math.min(1.6, sun.color.r * (1.15 + warm * 0.6))
    FOGX.sun.y = sun.color.g * (1.05 + warm * 0.15); FOGX.sun.z = sun.color.b * 0.95 }
  FOGX.prm.x = Math.min(0.55, (mistAmt * 0.4 + overcast * 0.16 + rainAmt * 0.12) * TUNE.mist)
  FOGX.prm.y = 0.35; FOGX.prm.z = 0.22
  FOGX.prm.w = ((0.35 + warm * 0.55) * dayAmt * (1 - overcast * 0.6) + nightAmt * 0.12) * TUNE.scatter
  // wet ground: rain physically changes the surface. Water fills the
  // micro-roughness, so the terrain goes darker (light dives in and
  // drowns) and GLOSSIER, at grazing angles the whole meadow turns
  // into a dim mirror of the sky, and the sun drags a specular streak
  // across the trails, which is nine-tenths of what 'wet street SSR'
  // ever was. It soaks in over seconds, dries over minutes (faster
  // under a working sun), and winter is excused: snow doesn't shine.
  wetAmt += ((rainAmt * (1 - winAmt)) - wetAmt)
    * Math.min(1, dt * (rainAmt > wetAmt ? 0.45 : 0.015 + dayAmt * 0.03))
  if (groundMesh) {
    const gm = groundMat
    const wfx = Math.min(1, wetAmt * TUNE.wet)
    gm.roughness = 1 - wfx * 0.62
    gm.envMapIntensity = 1 + wfx * 1.2
    const dk = 1 - wfx * 0.34
    gm.color.setRGB(dk, dk, dk)
  }
  for (const sp of mists) {
    const ud = sp.userData
    if (sp.position.distanceTo(focus) > 36 || sp.position.y < -500) {
      const a2 = Math.random() * Math.PI * 2, r2 = 8 + Math.random() * 22
      const mx = focus.x + Math.cos(a2) * r2, mz = focus.z + Math.sin(a2) * r2
      sp.position.set(mx, groundYAt(mx + W / 2 - 0.5, mz + H / 2 - 0.5) + 0.8 + Math.random() * 0.6, mz)
    }
    sp.position.x += (0.3 + uWindA.value) * ud.drift * dt * 0.9
    sp.position.z += Math.sin(t * 0.11 + ud.ph) * ud.drift * dt * 0.35
    sp.material.opacity = mistAmt * ud.base * (0.7 + 0.3 * Math.sin(t * 0.27 + ud.ph))
    sp.material.color.setHSL(0.58 - warm * 0.47, 0.22 + warm * 0.18, 0.22 + dayAmt * 0.42)
  }

  // the butterflies keep fair-weather hours at knee height
  const flutA = dayAmt * (1 - overcast * 0.7) * (1 - rainAmt)
  for (const b of flutters) {
    const ud = b.userData
    b.visible = flutA > 0.04
    if (!b.visible) continue
    ud.m.opacity = 0.85 * flutA
    const a2 = t * 0.42 + ud.ph * 3
    b.position.set(
      focus.x + Math.cos(a2 * 0.71 + ud.ph) * ud.r + Math.sin(t * 1.4 + ud.ph) * 0.7,
      focus.y + ud.h + Math.sin(t * 2.1 + ud.ph * 2) * 0.28,
      focus.z + Math.sin(a2 * 0.53 + ud.ph * 2) * ud.r + Math.cos(t * 1.1 + ud.ph) * 0.5)
    b.rotation.y = -a2
    const fl = Math.sin(t * 11 + ud.ph * 7) * 0.95
    ud.w1.rotation.z = fl; ud.w2.rotation.z = -fl
  }

  // the rabbits keep their distance and their opinions
  const rabA = dayAmt * (1 - rainAmt)
  for (const b of rabbits) {
    const ud = b.userData
    b.visible = rabA > 0.05
    if (!b.visible) continue
    const dx3 = b.position.x - focus.x, dz3 = b.position.z - focus.z
    const dFoc = Math.hypot(dx3, dz3)
    if (dFoc > 34 || b.position.y < -500) { // resettle out in the grass
      const a3 = Math.random() * Math.PI * 2, r3 = 10 + Math.random() * 16
      b.position.set(focus.x + Math.cos(a3) * r3, 0, focus.z + Math.sin(a3) * r3)
      ud.tx = b.position.x; ud.tz = b.position.z; ud.hop = 0; ud.wait = Math.random() * 3
    }
    if (dFoc < 3.2 && ud.hop <= 0) { // the boots are too close: bolt
      const inv = 1 / (dFoc || 1)
      ud.tx = b.position.x + dx3 * inv * (2.5 + Math.random() * 2)
      ud.tz = b.position.z + dz3 * inv * (2.5 + Math.random() * 2)
      ud.hop = 1
    } else if (ud.hop <= 0) {
      ud.wait -= dt
      if (ud.wait <= 0) { // an idle hop to a better tuft
        const a3 = Math.random() * Math.PI * 2
        ud.tx = b.position.x + Math.cos(a3) * 0.7
        ud.tz = b.position.z + Math.sin(a3) * 0.7
        ud.hop = 1; ud.wait = 1.2 + Math.random() * 3.5
      }
    }
    if (ud.hop > 0) {
      ud.hop -= dt * (dFoc < 4.5 ? 4.2 : 2.6)
      b.position.x += (ud.tx - b.position.x) * Math.min(1, dt * 6)
      b.position.z += (ud.tz - b.position.z) * Math.min(1, dt * 6)
      const hdg = Math.atan2(ud.tx - b.position.x, ud.tz - b.position.z)
      if (isFinite(hdg)) b.rotation.y = hdg
    }
    b.position.y = groundYAt(b.position.x + W / 2 - 0.5, b.position.z + H / 2 - 0.5)
      + (ud.hop > 0 ? Math.sin(Math.max(0, ud.hop) * Math.PI) * 0.14 : 0)
  }

  // the night lends you a lantern: warmth at the shoulder after dark
  ownGlow.position.set(focus.x, focus.y + 1.2, focus.z)
  ownGlow.intensity = meVis
    ? nightAmt * (1.1 + Math.sin(t * 9.7) * 0.12 + Math.sin(t * 23) * 0.05) : 0

  // the receipts rise and fade
  for (let fi = floaters.length - 1; fi >= 0; fi--) {
    const sp = floaters[fi]
    sp.userData.life -= dt / 1.3
    sp.position.y += dt * 0.75
    sp.material.opacity = Math.max(0, Math.min(1, sp.userData.life * 1.6))
    if (sp.userData.life <= 0) {
      scene.remove(sp); sp.material.map.dispose(); sp.material.dispose()
      floaters.splice(fi, 1)
    }
  }

  // the cloud shadows cross the ground on the wind's schedule
  uCloudOfs.value.x += dt * (0.004 + uWindA.value * 0.011)
  uCloudOfs.value.y += dt * 0.0026
  uCloudAmt.value = Math.min(0.85, overcast * 1.5) * dayAmt

  // the bobbers ride the chop, dip on the bite, ripple where it struck
  for (const [k2, bb] of fishBobs) {
    if (now > bb.until) { scene.remove(bb.g); fishBobs.delete(k2); continue }
    const dp = bb.dipAt && now > bb.dipAt ? Math.min(1, (now - bb.dipAt) / 420) : 1
    const dipY = dp < 1 ? -Math.sin(dp * Math.PI) * 0.06 : 0
    bb.g.position.y = -0.145 + Math.sin(t * 2.1 + bb.ph) * 0.012 + dipY
    bb.g.rotation.z = Math.sin(t * 1.7 + bb.ph) * 0.09 - dipY * 4
    const rp = bb.dipAt ? Math.min(1, (now - bb.dipAt) / 900) : 1
    bb.ring.scale.setScalar(0.4 + rp * 3.2)
    bb.ring.material.opacity = Math.max(0, 0.5 * (1 - rp))
  }

  // the footprints hold until the snow reclaims them
  for (const pm of prints) {
    if (!pm.visible) continue
    const age = (now - pm.userData.born) / (snowy ? 22000 : 1500)
    pm.material.opacity = 0.3 * Math.max(0, 1 - age)
    if (age >= 1) pm.visible = false
  }

  // the fires hand their light to the pool, and the country that has
  // come within reach since the last packet gets its bodies
  pumpLamps()
  if (nodesPending && world) nodesPending = syncNodes(world, NODE_BUDGET_FRAME)

  // the budget keeper trades pixels for smoothness and back, and now
  // keeps a furlough list: when the pixel scale bottoms out and the
  // frame is still late, the dearest passes stand down one at a time
  // (depth of field first, then the cloud deck, then the raymarched
  // shafts, which hand back to the screen-space rays, so the light
  // never just vanishes). They're rehired in reverse when air returns.
  // v0.81: the old keeper needed about thirty seconds to admit the frame
  // was late -- a 0.04 EMA behind a 2.5s gate -- and its furlough list
  // only ever covered the three cheapest things to lose. So the first
  // half-minute in a new world was spent at maximum quality being
  // unplayable. It now notices inside a second, and the occlusion pass
  // and the bloom are on the ladder like everything else.
  perfEMA += (dt * 1000 - perfEMA) * 0.14
  if (now - lastPerfAt > 700) {
    lastPerfAt = now
    const want = perfEMA > 26 ? Math.max(0.55, pxScale - 0.14)
      : perfEMA < 14.5 ? Math.min(1, pxScale + 0.06) : pxScale
    if (Math.abs(want - pxScale) > 0.005) {
      pxScale = want
      const pr2 = QPR() * pxScale
      renderer.setPixelRatio(pr2); composer.setPixelRatio(pr2)
      composer.setSize(innerWidth, innerHeight)
      gradePass.uniforms.uRes.value.set(innerWidth * pr2, innerHeight * pr2)
    }
    if (pxScale <= 0.56 && perfEMA > 28 && fxTier < 6) fxTier++
    else if (perfEMA < 13 && pxScale >= 0.99 && fxTier > 0) fxTier--
    if (bloom.enabled) { // only steer while fx are on at all
      // dearest first, and the depth-borrowers before the pass they
      // borrow from, so the light never simply vanishes
      if (dof) dof.enabled = fxTier < 1
      if (cloudPass) cloudPass.enabled = fxTier < 2
      if (volPass) volPass.enabled = fxTier < 3
      if (gtao) gtao.enabled = fxTier < 4
      streakPass.enabled = fxTier < 5
      bloom.strength = fxTier < 6 ? 0.32 : 0.18
    }
  }
  // the bench reads the meter it's arguing with
  const tstats = document.getElementById('tunestats')
  if (tstats && now - (tstats.__at ?? 0) > 400) {
    tstats.__at = now
    tstats.textContent = (1000 / perfEMA).toFixed(0) + ' fps · ' + QNAME + ' · pixels '
      + Math.round(pxScale * 100) + '% · tier ' + fxTier
      + ' · ' + renderer.info.render.calls + ' calls'
  }

  // bodies glide between the ticks they were told about: the truth
  // steps once per interval, but the window draws the stride. Each body
  // eases from the tile it left toward the tile it was given across
  // exactly one tick, with a light exponential touch on top so a late
  // packet reads as a hesitation, never a stumble.
  const glide = (map) => {
    for (const g of map.values()) {
      const ud = g.userData
      if (ud.tx === undefined) continue
      const fx0 = ud.fx0 ?? ud.tx, fy0 = ud.fy0 ?? ud.ty
      const jump = Math.abs(ud.tx - fx0) + Math.abs(ud.ty - fy0)
      let p = Math.min(1, (now - (ud.moveAt || clock.at)) / TICK_MS)
      if (jump > 3) p = 1 // recall and respawn snap; only strides interpolate
      // a stride that continues a stride is LINEAR, constant speed,
      // tile after tile, no lurch at the seams. Only the first step out
      // of stillness eases in; the exponential settle below handles the
      // stop. This is what turns 'teleports every tick' into walking.
      const e2 = (ud.strideChain ?? 0) > 0 ? p : p * p * (2 - p)
      const ix = fx0 + (ud.tx - fx0) * e2, iy = fy0 + (ud.ty - fy0) * e2
      const gx2 = wx(ix), gz2 = wz(iy), gy2 = groundYAt(ix, iy)
      const k = Math.min(1, dt * ((ud.strideChain ?? 0) > 0 ? 18 : 11))
      const px0 = g.position.x, pz0 = g.position.z
      g.position.x += (gx2 - g.position.x) * k
      g.position.z += (gz2 - g.position.z) * k
      // the gait's own bob comes off before the terrain lerp sees it,
      // or the lerp treats it as height and settles the body above the
      // ground by bob/k, an amount that depends on the framerate
      g.position.y -= g.__yOff ?? 0
      g.__yOff = 0
      g.position.y += (gy2 - g.position.y) * k
      g.__speed = (g.__speed ?? 0) * 0.85 + (Math.hypot(g.position.x - px0, g.position.z - pz0) / Math.max(dt, 1e-4)) * 0.15
      // winter keeps the record: moving feet press the snow
      if (snowy && (g.__speed ?? 0) > 0.35 && (!g.__printAt || now - g.__printAt > 400)) {
        g.__printAt = now
        g.__printSide = -(g.__printSide ?? 1)
        dropPrint(g.position.x, g.position.z, g.rotation.y, g.__printSide)
      }
      // THE ZIGZAG. The facing was taken from ONE tick's step, and a
      // grid path is a staircase: east, north, east, north. So the
      // body was handed a 90-degree turn every 600ms and spent the
      // whole walk swinging left, right, left, right while travelling
      // in a dead straight diagonal. Nothing was wrong with where it
      // went. It was wrong about where it was looking.
      //
      // Three tiles of memory fixes it exactly. Face from where you
      // were two steps ago to where you are going now: on a staircase
      // that is a constant 45 degrees, and on a real turn it commits
      // over two ticks, which is what a body does anyway.
      if (jump > 0 && jump <= 3) {
        if (ud.stepKey !== ud.tx + ',' + ud.ty) {
          ud.stepKey = ud.tx + ',' + ud.ty
          if (!ud.hist) ud.hist = [[fx0, fy0]]   // primed, so even the first step knows a direction
          ud.hist.push([ud.tx, ud.ty])
          if (ud.hist.length > 3) ud.hist.shift()
        }
        if (p < 1) {
          const h = ud.hist ?? [], h0 = h[0], h1 = h[h.length - 1]
          let ax = wx(ud.tx) - wx(fx0), az = wz(ud.ty) - wz(fy0)
          if (h0 && h1) {
            const bx = wx(h1[0]) - wx(h0[0]), bz = wz(h1[1]) - wz(h0[1])
            if (Math.hypot(bx, bz) > 0.4) { ax = bx; az = bz }  // unless it doubled back
          }
          ud.yawT = Math.atan2(ax, az)
        }
      } else if (jump > 3) ud.hist = null   // a recall forgets the road

      // acting bodies face their work and swing at it; walking bodies
      // pump their arms and legs; hurt bodies remember it in red for a beat
      const act = g.userData.act
      if (act && g.userData.actTarget && world) {
        const tg = world.nodes?.[g.userData.actTarget] ?? world.mobs?.[g.userData.actTarget] ?? world.players?.[g.userData.actTarget]
        if (tg) ud.yawT = Math.atan2(wx(tg.x) - g.position.x, wz(tg.y) - g.position.z)
      }
      // nobody teleports their FACING either: the yaw is a target now,
      // approached the short way around, and the rate of the turn is
      // published so the body can bank through it like a body would
      if (ud.yawT !== undefined) {
        let dY = ud.yawT - g.rotation.y
        while (dY > Math.PI) dY -= Math.PI * 2
        while (dY < -Math.PI) dY += Math.PI * 2
        const stepY = dY * Math.min(1, dt * 9)
        g.rotation.y += stepY
        g.__turn = (g.__turn ?? 0) * 0.85 + (stepY / Math.max(dt, 1e-4)) * 0.15
      } else g.__turn = (g.__turn ?? 0) * 0.9
      if (g.userData.an) {
        animateBeing(g, world?.players?.[ud.id] ?? world?.mobs?.[ud.id], ud.id, dt, now, t)
      } else if (g.__arms) {
        // The rigid bodies kept the oldest version of the bug: limbs on
        // `Math.sin(t * 8)`, a fixed eight radians a second of GLOBAL
        // time. Amplitude scaled with speed but frequency never did, so
        // they skated at every pace but one -- and with no per-body
        // seed anywhere in the expression, every one of them swung in
        // exact lockstep, a chorus line crossing the meadow. They ride
        // the same distance-driven phase as everyone else now, each
        // with a seed of its own.
        if (g.__gaitSeed === undefined) g.__gaitSeed = ((g.position.x * 7349 + g.position.z * 9151) % 6.283 + 6.283) % 6.283
        const strideR = 0.62 * (g.scale?.x || 1)
        g.__gaitPh = (g.__gaitPh ?? g.__gaitSeed)
          + (Math.hypot(g.position.x - px0, g.position.z - pz0) / strideR) * Math.PI * 2
        const gp = g.__gaitPh, gwork = t * 9 + g.__gaitSeed, gfight = t * 13 + g.__gaitSeed
        const walkAmp = Math.min(0.7, (g.__speed ?? 0) * 0.5)
        for (let ai = 0; ai < g.__arms.length; ai++) {
          const arm = g.__arms[ai]
          if (act === 'gather') arm.rotation.x = ai === 0 ? -0.9 + Math.sin(gwork) * 0.85 : 0.2
          else if (act === 'attack' || act === 'attackp') arm.rotation.x = ai === 0 ? -0.7 + Math.sin(gfight) * 1 : 0.3 + Math.sin(gfight + 2) * 0.4
          else arm.rotation.x = Math.sin(gp + ai * Math.PI) * walkAmp + 0.16 * (ai ? 1 : -1)
        }
        if (g.__legs) {
          const walkAmp2 = Math.min(0.6, (g.__speed ?? 0) * 0.55)
          for (let li = 0; li < g.__legs.length; li++)
            g.__legs[li].rotation.x = Math.sin(gp + li * Math.PI + Math.PI) * walkAmp2
        }
        // the smaller peoples mean their movement too: a lean with the
        // stride, a bank through the turn, a slow shift of weight when
        // the body only stands, stillness that is held, not paused
        const spd3 = Math.min(1, (g.__speed ?? 0) * 0.6)
        g.__leanB = (g.__leanB ?? 0) + ((spd3 * 0.07) - (g.__leanB ?? 0)) * Math.min(1, dt * 7)
        g.rotation.x = g.__leanB
        g.rotation.z = Math.sin(g.__gaitPh ?? 0) * 0.02 * spd3
          - Math.max(-1, Math.min(1, (g.__turn ?? 0) * 0.25)) * 0.1 * spd3
          + Math.sin(t * 0.55 + g.position.x * 2.7) * 0.012 * (1 - spd3)
      }
      if (g.__lungeAt) {
        const lp = (now - g.__lungeAt) / 220
        if (lp < 1) { const env = Math.sin(lp * Math.PI) * 0.2
          g.position.x += (g.__lungeDx ?? 0) * env; g.position.z += (g.__lungeDz ?? 0) * env }
      }
      if (g.__mats && g.__hurtAt && !g.__adventurer) {
        const hp2 = (now - g.__hurtAt) / 320
        for (const mm of g.__mats) { mm.emissive.setHex(0xa01414)
          mm.emissiveIntensity = hp2 < 1 ? (1 - hp2) * 0.9 : 0 }
      }
      // the small lives: a stride puts a bounce in the step, stillness
      // puts a breath in the chest
      const spd = g.__speed ?? 0
      if (!g.userData.an) {
        g.__yOff = (Math.abs(Math.sin(t * 8 + g.position.x * 2)) - BOB_MEAN) * Math.min(0.045, spd * 0.028)
        g.position.y += g.__yOff
      }
      if (g.__breath) g.__breath.scale.x = g.__breath.scale.z =
        1 + Math.sin(t * 1.7 + g.position.x * 3) * 0.02 * Math.max(0, 1 - spd * 2)
    }
  }
  glide(vis.player); glide(vis.mob)
  if (sparkPool) { sparkPool.update(dt); flashPool.update(dt) }

  // struck trees shudder; the fallen chips obey gravity like anything else
  for (const g of vis.node.values()) {
    if (!g.__shakeAt) continue
    const sp2 = (now - g.__shakeAt) / 300
    g.rotation.z = sp2 < 1 ? Math.sin(sp2 * 28) * 0.045 * (1 - sp2) : 0
    g.updateMatrix(); g.updateMatrixWorld(true) // frozen sculpture, shaken by hand
    if (sp2 >= 1) g.__shakeAt = 0
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]
    f.life -= dt
    if (f.life <= 0) { scene.remove(f.m); fx.splice(i, 1); continue }
    if (f.kind === 'arrow') {
      f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt
      f.mat.opacity = 1
    } else if (f.kind === 'splash') {
      const k2 = 1 - f.life / f.t0
      f.m.scale.setScalar(1 + k2 * 4); f.m.material.opacity = 0.85 * (1 - k2)
    } else {
      f.vy -= 6.5 * dt
      f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt
      f.m.rotation.x += dt * 7; f.m.rotation.z += dt * 5
      f.mat.opacity = Math.min(1, f.life / 0.25)
    }
  }

  // fires breathe; rings ripple; windows warm after dark
  for (const g of vis.node.values()) {
    if (!g.visible) continue // the far country rests
    if (g.userData.fireLight) {
      const s = t + g.position.x
      // a brazier on a gate is a fire too, only smaller and without the
      // ember-fall: the breath is the same, the furniture is optional
      const base9 = g.userData.fireBase ?? 12
      g.userData.fireLight.intensity = base9 + Math.sin(s * 9) * (base9 / 6) + Math.sin(s * 23) * (base9 / 8.6)
      g.traverse((o) => {
        if (o.userData.flame) {
          const k = 1 + 0.13 * Math.sin(s * (o.userData.flame === 1 ? 9 : 13))
          o.scale.set(k, 2 - k, k)
        }
      })
      if (g.userData.embers) {
      const ep = g.userData.embers.geometry.attributes.position
      for (let i = 0; i < 6; i++) {
        const ph = ((t * (0.45 + i * 0.13) + i * 0.37) % 1)
        ep.setXYZ(i, 0.16 * Math.sin(s * 3 + i * 2.1), 0.5 + ph * 1.5, 0.16 * Math.cos(s * 2.6 + i * 1.7))
      }
      ep.needsUpdate = true
      }
      g.userData.smoke?.forEach((sp, i) => {
        const ph = ((t * 0.2 + i * 0.33) % 1)
        sp.position.set(ph * 0.7 + 0.12 * Math.sin(t + i), 1 + ph * 2.6, 0.1 * Math.sin(t * 0.7 + i))
        const sc = 0.35 + ph * 1.1
        sp.scale.set(sc, sc, 1)
        sp.material.opacity = 0.5 * (1 - ph) * dayAmtSmoke(dayAmt)
      })
    }
    g.traverse((o) => {
      // the sails take the weather: a mill in a dead calm is a monument,
      // a mill turning is a working building, and the difference is one
      // line. It reads uWindA, the same amplitude the grass leans to.
      if (o.userData.spin) o.rotation.z = t * o.userData.spin * (0.62 + uWindA.value * 0.9)
      // and the scarecrow's rags move because nothing else in a field does
      if (o.userData.rag) {
        o.rotation.z = Math.sin(t * 1.25 + g.position.x) * 0.055 * (0.5 + uWindA.value)
        o.rotation.x = Math.sin(t * 0.83 + g.position.z) * 0.04 * (0.5 + uWindA.value)
      }
      if (o.userData.bob) { const ph = (t * 0.55 + g.position.x) % 1
        o.scale.setScalar(0.4 + ph * 1.3); o.material.opacity = 0.7 * (1 - ph) }
      if (o.userData.window) { // someone is home, and the bloom knows it ,
        // but every household keeps its own hours now. Each building's id
        // hashes into a bedtime: lamps light at dusk on their own minute,
        // a few flicker like someone is moving behind them, and one by
        // one they go dark through the night as the village turns in.
        const hh = g.__hh ??= [...(String(g.userData.id ?? 'x'))].reduce(
          (a2, ch) => (a2 * 33 + ch.charCodeAt(0)) >>> 0, 5381)
        const bed = 0.76 + ((hh >> 3) % 12) / 100        // when this house turns in
        const wake = Math.min(0.995, bed + 0.1 + ((hh >> 7) % 8) / 100)
        const asleep = dayF > bed && dayF < wake
        const lit = dayAmt < 0.35 && !asleep
        const flick = (hh % 5) === 0 ? 0.8 + 0.2 * Math.sin(t * 2.6 + hh) : 1
        o.material.emissiveIntensity = lit ? 1.8 * flick : 0
        o.material.color.setHex(lit ? 0xffc46a : 0x2a2117)
        g.__asleep = asleep
      }
      if (o.userData.chim !== undefined) { // the hearth writes on the sky ,
        // thinner once the household is abed, banked but never out
        const ph = (t * 0.13 + o.userData.chim + g.position.x * 0.11) % 1
        // ...out of the chimney this house actually has: the flue moved
        // when the cottages grew a storey, and it moves again per variant
        o.position.y = (g.__chimY ?? 1.55) + ph * 1.7
        o.position.x = (g.__chimX ?? -0.3) + Math.sin(t * 0.6 + ph * 4 + g.position.z) * 0.1 + ph * uWindA.value * 0.9
        const sc = 0.2 + ph * 0.85
        o.scale.set(sc, sc, 1)
        o.material.opacity = 0.3 * (1 - ph) * dayAmtSmoke(dayAmt) * (g.__asleep ? 0.3 : 1)
      }
    })
  }
  if (water) {
    water.material.uniforms.time.value += dt * (0.55 + uWindA.value * 0.5)
    water.material.uniforms.uFoamAmt.value = TUNE.foam
    water.material.uniforms.uStorm.value +=
      (Math.min(1, Math.max(0, uWindA.value - 0.55) * (0.5 + rainAmt + overcast * 0.5))
       - water.material.uniforms.uStorm.value) * Math.min(1, dt * 0.8)
    water.material.uniforms.sunDirection.value.copy(sunDir)
    water.material.uniforms.sunColor.value.copy(sun.color)
    // aurora nights dye the sea green-teal and stir the mirror, so the
    // curtain overhead gets a rippled twin below the horizon
    water.material.uniforms.waterColor.value.setHSL(0.55 - auroraAmt * 0.12,
      0.55 - overcast * 0.25 + auroraAmt * 0.3, 0.035 + dayAmt * 0.06 + auroraAmt * 0.05)
    water.material.uniforms.distortionScale.value = 2.4 + auroraAmt * 1.6
    water.position.x = focus.x * 0 // the sheet is world-fixed; the mirror follows for free
  }

  // the country's name, spoken by the corner of the frame
  // a name is for the person standing near it, not a banner over the
  // country: labels fade with distance and vanish past earshot
  const fadeLabels = (map, near, far) => {
    for (const g of map.values()) {
      const lb = g.userData.lb ?? g.userData.label
      if (!lb) continue
      const d = camera.position.distanceTo(g.position)
      const o = (cine ? 0 : 1) * (1 - Math.min(1, Math.max(0, (d - near) / (far - near))))
      lb.visible = o > 0.03
      lb.material.opacity = o * 0.9
    }
  }
  fadeLabels(vis.node, 4.5, 9)
  // shades stay anonymous until they matter: a caption only for the
  // one you're hunting (always), or the ones close enough to hunt YOU
  for (const [id2, gsh] of vis.mob) {
    const lb = gsh.userData.lb; if (!lb) continue
    const d = camera.position.distanceTo(gsh.position)
    const o = (cine ? 0 : 1) * (id2 === huntTarget ? 1
      : 1 - Math.min(1, Math.max(0, (d - 3) / 2.5)))
    lb.visible = o > 0.03
    lb.material.opacity = o * 0.9
  }
  fadeLabels(vis.player, 10, 22)

  if (me) {
    const rn = regionNameAt(me.x, me.y)
    // a place earns its card by KEEPING you: crossing a road for two
    // strides is not arriving anywhere. The name must hold for a beat.
    if (rn && rn !== lastLocale && entered) {
      if (rn !== localePend) { localePend = rn; localePendAt = now }
      else if (now - localePendAt > 2500) { lastLocale = rn; showTitle('you arrive at', rn) }
    } else localePend = ''
    const rEl = document.getElementById('region')
    const txt = (rn ? rn + ' · ' : '') + callingOf(me) + ' (' + standingOf(me) + ') · hp ' + me.hp
      + (me.gold ? ' · ' + me.gold + 'g' : '') + (me.action ? ' · ' + me.action.type : '')
    if (rEl.textContent !== txt) rEl.textContent = txt
  }
  composer.render()
}
const dayAmtSmoke = (d) => 0.55 + d * 0.45 // smoke reads against sky, faintly at night
frame()
</script>
<script>
// ---- the key travels (v0.78): the key IS the citizen, and a citizen
// is not a hostage of one browser. EXPORT copies a self-labeled string
// (interval-key-v1.<pkcs8>.<pub>); IMPORT verifies the pair by signing
// a test message before it will replace anything, and warns before
// replacing a citizen this browser already holds. The string is a
// BEARER INSTRUMENT: whoever holds it is the citizen, share it only
// with your own devices.
const IK_hex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)))
async function IK_verify(pk8, pub) {
  try {
    const priv = await crypto.subtle.importKey('pkcs8', IK_hex(pk8), { name: 'Ed25519' }, false, ['sign'])
    const pubk = await crypto.subtle.importKey('raw', IK_hex(pub), { name: 'Ed25519' }, false, ['verify'])
    const msg = new TextEncoder().encode('interval-key-check')
    const sig = await crypto.subtle.sign('Ed25519', priv, msg)

  } catch { return false }
}
async function exportOwnKey() {
  const saved = localStorage.getItem('interval-ownkey')
  if (!saved) { alert('no key in this browser yet: enter the world once first'); return }
  const { pk8, pub } = JSON.parse(saved)
  const str = 'interval-key-v1.' + pk8 + '.' + pub
  try { await navigator.clipboard.writeText(str); alert('key copied. It IS your citizen: paste it only into your own devices.') }
  catch { prompt('copy your key (it IS your citizen):', str) }

  // precondition for crossing. The module keeps the record.

}
async function importOwnKey() {
  const str = (prompt('paste a key (interval-key-v1.\u2026 or an executor identity JSON):') ?? '').trim()
  if (!str) return
  let m9 = /^interval-key-v1\.([0-9a-f]+)\.([0-9a-f]+)$/.exec(str)
  if (!m9 && str.startsWith('{')) {
    // the executor's own tongue (v0.78): identities/*.json speaks
    // {playerId, privateKey} where privateKey is the raw 32-byte seed.
    // PKCS8 for Ed25519 is that same seed behind a fixed 16-byte
    // prefix, so the two formats are one key in two coats.
    try {

      if (/^[0-9a-f]{64}$/.test(j9.privateKey ?? '') && /^[0-9a-f]{64}$/.test(j9.playerId ?? ''))
        m9 = [null, '302e020100300506032b657004220420' + j9.privateKey, j9.playerId]
    } catch {}
  }
  if (!m9) { alert('that is not an interval key (paste interval-key-v1.\u2026 or the executor JSON)'); return }
  if (!(await IK_verify(m9[1], m9[2]))) { alert('this key does not prove itself: the pair does not match'); return }

  if (cur) {
    const curPub = JSON.parse(cur).pub ?? ''
    if (curPub && curPub !== m9[2]
      && !confirm('this browser already holds citizen ' + curPub.slice(0, 8) + '\u2026 replace with '
        + m9[2].slice(0, 8) + '\u2026? Export the current key first if it has a life worth keeping.')) return
  }
