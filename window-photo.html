<!doctype html>
<!-- INTERVAL · the photo window.
     The flat window draws the truth in tiles. The deep window gives it
     geometry. This one gives it weather: a physically-based renderer in
     your pocket. PBR ground that the window synthesizes for itself,
     an atmosphere-scattered sky feeding image-based light into every
     material, planar-reflected water, ACES filmic grading, bloom. Same
     wire. Same key (localStorage 'interval-ownkey', the SAME citizen
     as /play and /deluxe on this device). Same ticks. No window is
     authoritative; this one just holds the camera steadier.
     And now the weather is literal: storms are hashed off the
     constitutional day, so every photo window over a world watches the
     same rain arrive, wind in the grass and the canopies, drifting
     clouds, thunder, fireflies after dark, pollen in the sunbeams, a
     cratered moon, lens flares, auroras on the lucky nights, shooting
     stars, and a filmic grade over the whole frame. And now the frame
     leans all the way in: volumetric god rays let down through the
     canopies, a twinkling milky way with nebular breath, lightning that
     has a body and not just a flash, rainbows on the sun-shower days,
     a flock wheeling on the thermals, and a golden-hour split-tone
     grade that knows what hour it is. The ground level caught up too:
     timber-framed houses on stone footings with smoking chimneys and
     windows that glow into the bloom, dressed citizens with hair and
     belts in colors spun from their own keys, armed goblins, mossy
     hunched trolls, ruffed wolves with lamp-lit eyes, a shielded
     knight, and everyone WALKS now: strides chain into linear,
     continuous motion instead of stepping tile by tile, chests breathe
     at rest, steps bounce. First person is the default view, because
     the light is the whole argument. The camera grew an iris, stare
     into the sun and the pupil closes instead of the frame whiting
     out, and the window grew an EAR: procedural wind, rain, thunder
     that arrives a polite second after its bolt, crickets after dark,
     crackling fires that get louder as you approach, birdsong, and
     your own footsteps on the beat of the stride. Press and hold to
     keep walking the way you look. And then everything else: the ear
     went STEREO, thunder rolls in from the side its bolt struck, work
     and blows ring from their true directions, gulls cry over the
     shore and water laps at it, the aurora hums a fifth to itself, a
     synthesized room gives the night its distances, and a heart with
     three points left keeps its own drum while the frame flushes red
     at the edges. Snow falls instead of rain over the high country,
     the canopies shed leaves onto the wind, and CINE clears every
     scrap of interface for footage, and now brings the letterbox down
     with it, deepens the grade to a print, and lets the camera drift.
     The lens finally admits it's a lens: anamorphic streaks smear
     anything hotter than white into a cool blue line (the sun at
     golden hour, a hearth window after dark, the bolt itself), the
     glass goes soft at its own edges, and a photograph announces
     itself with one white blink of the shutter. All of it is
     rendering, none of it is rules.
     The AAA pass: ground-truth ambient occlusion seats everything on
     the earth (desktop), the meadow parts around your boots and
     springs back behind you, mist pools at the magic hours,
     butterflies keep fair-weather hours at knee height, passing
     clouds dapple the sunlight, the camera moves like a head on a
     neck, eased look, a speed-widened eye, a shake when a blow or a
     close thunderclap lands, and the window hums a generative score
     to itself at golden hour and deep night: slow chords, a plucked
     pentatonic behind an echo, silence at noon and in storms, because
     a score that knows when not to play is the whole trick.
     Then the world learned the calendar and the game learned feel:
     the year turns in four constitutional weeks, autumn golds the
     canopies and doubles the leaf-fall, winter frosts the ground,
     drains the air, and turns all rain to snow, spring puts a blossom
     blush on the green and pink drift on the wind, while rabbits
     graze and bolt from your boots, the night lends you a lantern,
     damage and experience float up as honest receipts, a level rings
     out with a chord and a spark burst, and a budget keeper quietly
     trades pixels for a steady frame and buys them back after.
     And the frontier round: cloud shadows you can WATCH cross the
     meadow (a tiling shadow sheet scrolling in world space over ground
     and grass, on the wind's schedule), aurora nights that dye the sea
     green-teal and stir the mirror so the curtain gets a rippled twin,
     a red-and-white bobber that rides the chop beside anyone fishing
     and dips under on each bite with a ripple ring, and winter
     footprints, every moving body presses a fading track into the
     snow, left, right, left, gone in twenty seconds under fresh fall.
     Then the settlement came alive and the hand got new instruments:
     every household keeps its own hours (lamps light at dusk on their
     own minute, some flicker like someone is moving behind them, and
     one by one they go dark as the village turns in, hearths banking
     low), the pinch became a spyglass in first person (down to a
     22-degree eye, with a soft hand and a held breath), tomorrow's
     storm builds as a dark wall on the horizon through the afternoon
     at a bearing the date itself chooses, and every photograph also
     plants a small framed print on a stake where it was taken, the
     last five survive the browser closing. Walk your own world and
     meet your own eye.
     The next-generation pass: the tone curve itself changed hands ,
     AgX, the transform the current generation of renderers ships,
     desaturating toward white the way film does instead of skewing hue
     the way ACES did, with the exposure meter recalibrated to feed it.
     The frame now stays HDR half-float AND 4x-multisampled through the
     entire post chain, so bloom stops banding and every roofline
     resolves clean; a true bokeh depth-of-field reads the scene's own
     depth and racks focus like a puller (hyperfocal in first person,
     aperture opening two stops in CINE); the sun's shadow atlas grew
     to 4K so a leaf's shadow has a leaf's silhouette; every ground
     scan filters anisotropically to the GPU's full budget so the
     meadow stays legible at grazing angles clear to the fog line; and
     the darkroom learned a contrast-adaptive sharpen, detail gets the
     bite, sky and skin stay quiet, the edges of the glass stay soft.
     Then the window learned to render the AIR: the fog chunks
     themselves are rewritten before any material compiles, so every
     fogged surface inherits aerial perspective, fog that pools low
     and lets ridgelines stand clear of it, and fog that takes the
     LIGHT'S color when you look toward the light, so the west half of
     a golden hour goes amber and every silhouette in front of it is
     suddenly a movie (the moon gets the same physics at night, in
     silver). One plain-object mutation per frame reaches every
     material in the scene, because three clones what it cannot
     recognize by reference. And a gaffer's rim light rides opposite
     the key, shadowless and cool, separating hair and grass and
     rooflines from the background, the cheat every big-budget frame
     leans on, formalized as the sky's own bounce.
     The physics round: shadows learned that the sun is a DISC, a
     PCSS blocker search sizes every penumbra from its occluder's
     distance, so a tree prints a crisp root and a soft crown and a
     fence post hardens to a knife-edge where it meets its own shadow;
     rain physically changes the ground, water fills the
     micro-roughness, the terrain goes dark and glossy, and at grazing
     angles the whole meadow becomes a dim mirror of the sky with the
     sun dragging a specular streak up the trails, soaking in over
     seconds and drying over minutes under a working sun; and the
     exposure grew a MEMORY, the camera meters how much sky fills the
     frame and adapts asymmetrically, constricting in a blink when you
     tilt into the light, opening over long seconds when you step into
     the greenwood, while lightning bypasses the eye entirely, because
     a flash is faster than any pupil.
     And then the light got a BODY: the air is raymarched, two dozen
     jittered steps walk from the eye toward every pixel and each one
     asks the sun's own 4K shadow map whether it can see the light, so
     the god rays are true three-dimensional shafts carved by the
     actual canopies and rooflines and ridgelines, hanging in the air
     when you stand SIDEWAYS to them, which no screen-space smear ever
     managed. Henyey-Greenstein scattering aims the glow down-beam the
     way real aerosols do, the density breathes with the damp, rain,
     overcast, the low golden air, the night's held breath, the moon
     works the night shift in silver, and the depth ride-shares with
     the ambient occlusion so the whole thing costs one pass. The
     screen-space shafts stand down on desktop and keep the phones.
     And the last round, everything at once: the SHORE learned to
     break, a one-time flood-fill bakes every water tile's distance
     to land, and in the shader that distance becomes surf: a standing
     lace of foam at the waterline, sets of breakers rolling in on the
     wind's schedule and dying where the water shoals, whitecaps torn
     off the open sea when the storm is up. Wade past your depth and
     the water column becomes the fog, a dense teal that eats the
     distance in a dozen meters while the volumetric shafts keep
     working, because the sun's shadow map doesn't care whether the
     air is air: underwater god rays, free. The sky grew a cumulus
     deck with a BODY, sixteen jittered steps march a slab of air per
     sky pixel, each sample self-shadowing toward the sun, so the
     masses go dark-bellied and silver-rimmed and burn at the edges
     near the light, on the same overcast every window agrees on. And
     the budget keeper learned a furlough list: when pixels alone
     can't buy the frame back, the dearest passes stand down one at a
     time, depth of field, then the cloud deck, then the raymarched
     shafts, which hand back to the screen-space rays so the light
     never just vanishes, and are rehired in reverse when air
     returns. Photographs already spend triple silver at the shutter.
     And finally the window admits it was tuned BLIND, and hands over
     the faders: TUNE opens the tuning bench, thirteen multipliers
     over every number worth arguing about (exposure, bloom, sharpen,
     the aperture, the god rays and the air they ride, the cloud deck
     and its cover, the ground fog, the in-scatter, the surf, the wet
     gloss, the rim) with a live fps-and-pixels meter beside them,
     persisted on the device, and a COPY button that hands the whole
     verdict back to whoever holds the source. The defaults are the
     shipped guesses; the truth is whatever your screen says it is.
     Then the cast got its pass, not more polygons, more INTENT:
     nobody snaps their facing anymore (yaw is a target approached the
     short way around), moving bodies BANK into their turns with the
     eye leading the way, and idle heads notice the nearest other soul
     in earshot and turn to them, never craning past the shoulder,
     because what's behind stays unseen. The smaller peoples lean with
     the stride, bank through the turn, and shift their weight when
     they only stand, so stillness reads as held, not paused; their
     eyes went glossy enough to catch the sky (the physically-based
     catchlight), and citizen skin took a sheen apart from the weave
     of the cloth. Realistic world, stylized figures, honest motion ,
     the valley is for other engines to fall into.
     And then the CINEMA round, three departments the frame was still
     missing. The camera department: CINE now hands the camera to a
     DIRECTOR who watches the scene and hard-cuts between composed
     shots every six to nine seconds, a low dolly through the grass, a
     crane from the boots to the rooftops, a lead shot sliding across a
     walking face, a 22-degree long lens compressing the meadow from
     thirty meters, a low-angle sky frame, a slow orbit of the hearth,
     a tight arc around a fight the moment one starts, each cut
     landing with its own focal length, terrain-clamped, tracking live,
     while you keep playing inside the frame. The titles department:
     places announce themselves in wide-tracked type rising from the
     lower third ('you arrive at · THE MEADOWS'), and every dawn gets a
     date card subtitled by the constitutional season, one soft plucked
     note under each. The lens department: true internal-reflection
     GHOSTS walk the optical axis when something genuinely hot is in
     frame, a cool ghost past center, a warm one beyond, a green fleck
     far out, a halo ring at fixed radius, all image-driven so only
     real highlights ghost (fader fourteen on the bench) and in CINE
     the gate WEAVES a third of a pixel on a film gate's slow drift,
     which is most of why footage feels shot rather than computed.
     Zero assets: every texture is synthesized on a canvas at load.
     Optional: ?hdri=<url-to-.hdr> swaps the procedural sky for a real
     captured one (Poly Haven HDRIs are CC0 and work when the host
     allows cross-origin reads). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>INTERVAL · the photo window</title>
<style>

  #skillsEl .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(226,182,62,.12); overflow: hidden }
  #skillsEl .bar div { height: 100%; background: var(--gold); opacity: .7 }
  #skillsEl .tot { padding: 6px 2px 2px; font-size: 11px; color: var(--dim); letter-spacing: .06em }

  #pack button { min-height: 40px; padding: 4px 6px; color: var(--parch); font-weight: 400;

  #pack button.sel { border-color: var(--gold); background: rgba(90,68,16,.75); color: var(--gold) }
  #chatrow { display: none; gap: 6px }

    background: var(--ink); color: var(--parch); padding: 0 10px; font: 14px ui-monospace, monospace }

  #locale .over { font-size: 11px; letter-spacing: .5em; color: var(--dim);
    text-transform: uppercase; margin-bottom: 10px; padding-left: .5em }
  #locale .name { font-size: 30px; letter-spacing: .42em; color: #eee6cf; font-weight: 600;
    padding-left: .42em; text-shadow: 0 2px 26px rgba(0,0,0,.85), 0 0 60px rgba(0,0,0,.5) }
  #cinex { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 30;
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(226,182,62,.5);
    color: var(--gold); background: rgba(12,11,9,.45); display: none; align-items: center;
    justify-content: center; font-size: 15px }
  /* the letterbox: CINE pulls the frame into widescreen. The bars ease
     in the way house lights go down, the film is about to start. */
  .lb { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 25;
    pointer-events: none; transition: height .9s cubic-bezier(.25,.8,.25,1) }
  #lbT { top: 0 } #lbB { bottom: 0 }
  body.cine .lb { height: 8vh }
  /* the shutter: a photograph announces itself with one white blink */
  #shutter { position: fixed; inset: 0; background: #fff; opacity: 0; z-index: 40;
    pointer-events: none; transition: opacity .3s ease-out }
  #shutter.snap { opacity: .85; transition: none }
  /* the splash learns to breathe: the title is poured gold, the copy
     arrives in order, and a slow aurora turns behind everything */
  #splash::before { content: ''; position: absolute; inset: -30%;
    background: conic-gradient(from 0deg at 50% 42%, transparent, rgba(226,182,62,.07) 12%,
      transparent 26%, rgba(90,130,190,.06) 48%, transparent 62%, rgba(226,182,62,.05) 82%, transparent);
    animation: sweep 26s linear infinite; pointer-events: none }
  #splash::after { content: ''; position: absolute; left: 50%; top: 50%;
    width: min(72vw, 540px); height: min(72vw, 540px); transform: translate(-50%, -58%);
    background: radial-gradient(circle, rgba(226,182,62,.14), transparent 62%);
    animation: breathe 7s ease-in-out infinite; pointer-events: none }
  #splash h1, #splash p, #splash button, #splash .rule { position: relative; z-index: 1 }
  #splash h1 { font-size: clamp(26px, 7vw, 40px); letter-spacing: .14em;
    background: linear-gradient(100deg, #8a6a1c 0%, var(--gold) 30%, #fff3c8 50%, var(--gold) 70%, #8a6a1c 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--gold);
    animation: pour 5.5s ease-in-out infinite, rise .9s cubic-bezier(.2,.7,.2,1) both;
    text-shadow: none; filter: drop-shadow(0 0 22px rgba(226,182,62,.35)) }
  #splash .rule { color: rgba(226,182,62,.55); font-size: 11px; letter-spacing: .6em;
    text-indent: .6em; animation: rise .9s .15s cubic-bezier(.2,.7,.2,1) both }
  #splash p { animation: rise .9s cubic-bezier(.2,.7,.2,1) both }
  #splash p:nth-of-type(1) { animation-delay: .28s }
  #splash p:nth-of-type(2) { animation-delay: .44s }
  #splash button { animation: rise .9s .62s cubic-bezier(.2,.7,.2,1) both,
    beckon 3.4s 1.8s ease-in-out infinite }
  @keyframes pour { 0%, 100% { background-position: 0% 0 } 50% { background-position: 100% 0 } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  @keyframes breathe { 0%, 100% { opacity: .6 } 50% { opacity: 1 } }
  @keyframes sweep { to { transform: rotate(1turn) } }
  @keyframes beckon { 0%, 100% { box-shadow: 0 0 0 rgba(226,182,62,0) }
    50% { box-shadow: 0 0 26px rgba(226,182,62,.3) } }
  @media (prefers-reduced-motion: reduce) {
    #splash::before, #splash::after, #splash h1, #splash .rule, #splash p, #splash button
      { animation: none } .lb { transition: none } }

// compiles, so EVERY fogged surface in the world inherits aerial

// valleys hold their breath while ridgelines stand clear of it), and

  dir: { x: 0, y: 1, z: 0 },          // toward the light
  sun: { x: 1, y: 0.85, z: 0.6 },     // the light's color, pre-scaled

// the shafts: screen-space light let down through whatever dares stand
// in front of the sun. The frame itself is the occluder, a canopy
// prints its own silhouette into the beam for free, and at golden hour
// the whole forest becomes a cathedral. The moon gets the same
// treatment after dark, in silver, at a whisper.
const raysPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSun: { value: new THREE.Vector2(0.5, 0.5) },
    uAmt: { value: 0 }, uTint: { value: new THREE.Color(1, 0.9, 0.7) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uAmt; uniform vec3 uTint;
    void main(){

      vec2 dir = (uSun - vUv) / ${MOBILE ? '28.' : '44.'};

// the anamorphic streak: what a widescreen lens does to anything hot ,

// the frame underneath stays honest.
const streakPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAmt: { value: 0 },
    uTint: { value: new THREE.Color(0.55, 0.72, 1) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uAmt; uniform vec3 uTint;
    void main(){

// the lens confesses the rest of it: when something genuinely hot sits
// in frame (the sun, the bolt, a hearth window at night) internal
// reflections walk the optical axis as GHOSTS: a cool one past center,
// a warm one beyond it, a green fleck far out, and a halo ring smeared
// at fixed radius. All image-driven, so only true highlights ghost.
// And in CINE the gate WEAVES: the whole frame wanders a third of a
// pixel on the slow drift of a mechanical film gate, which is most of
// why footage feels shot rather than computed.
const lensPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAmt: { value: 0 }, uWeave: { value: new THREE.Vector2(0, 0) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',

// the darkroom: a last pass over the developed frame, vignette, grain,
// a breath of chromatic fringe at the edges, a nudge of saturation.
// This is where 'render' becomes 'photograph'.
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAmt: { value: 1 }, uWarm: { value: 0 }, uHurt: { value: 0 }, uCine: { value: 0 }, uNight: { value: 0 },
    uRes: { value: new THREE.Vector2(innerWidth * QPR(), innerHeight * QPR()) }, uSharp: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uTime, uAmt, uWarm, uHurt, uCine, uNight, uSharp; uniform vec2 uRes;
    void main(){
      vec2 d = vUv - .5; float r2 = dot(d, d);

      // the 'mastered in 4K' snap. It backs off toward the soft edges so
      // it never fights the lens, and it's contrast-adaptive: flat sky
      // and skin stay flat, only real detail gets the bite.
      vec2 px = 1. / uRes;
      vec3 nb = (texture2D(tDiffuse, vUv + vec2(px.x, 0.)).rgb + texture2D(tDiffuse, vUv - vec2(px.x, 0.)).rgb

      vec3 hi = col - nb;

      // and the one every photograph already taught your eye to expect

      // the eye's own night mode: rods take over from cones and the
      // world goes silver-blue, the Purkinje shift. A lift under the
      // shadows only, so a fire still burns orange against it and true
      // black is spent on nothing. This is how you see at 2am, and how
      // every film has lit its nights since film learned to.
      vec3 seen = col * vec3(.82, .96, 1.28) + vec3(.012, .026, .058);

// stars: only the night believes in them, and now the night argues

const skyAnchor = new THREE.Group()
scene.add(skyAnchor)
const bandAxis = new THREE.Vector3(1, 0, 0)
const starField = (count, band) => {
  const p = [], ph = [], cl = []
  const c = new THREE.Color(), v = new THREE.Vector3()
  for (let i = 0; i < count; i++) {
    if (band) { // pulled toward a great circle tilted through the zenith
      const u = Math.random() * Math.PI * 2
      const spread = (Math.random() + Math.random() + Math.random() - 1.5) * 0.17
      v.set(Math.cos(u), spread, Math.sin(u)).normalize().applyAxisAngle(bandAxis, 0.9)
      if (v.y < 0.02) { i--; continue }
      p.push(v.x * 332, v.y * 332, v.z * 332)
    } else {
      const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 0.98)
      p.push(340 * Math.sin(b) * Math.cos(a), 340 * Math.cos(b), 340 * Math.sin(b) * Math.sin(a))
    }
    ph.push(Math.random() * 6.28)
    const w = Math.random() // most stars blue-white; a few burn amber and rose
    c.setHSL(w < 0.1 ? 0.05 : w < 0.26 ? 0.12 : 0.6, w < 0.26 ? 0.55 : 0.3, band ? 0.6 : 0.74)
    cl.push(c.r, c.g, c.b)
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3))
  g.setAttribute('phase', new THREE.Float32BufferAttribute(ph, 1))
  g.setAttribute('tint', new THREE.Float32BufferAttribute(cl, 3))

}
const starUniforms = { uTime: { value: 0 }, uNight: { value: 0 } }

  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

    uniform float uTime, uNight;
    void main(){
      float tw = .5 + .5 * sin(uTime * (1.1 + fract(phase * .61) * 2.3) + phase * 17.);
      vA = uNight * (${base.toFixed(2)} + ${amp.toFixed(2)} * tw * tw);

  fragmentShader: `varying float vA; varying vec3 vC;
    void main(){
      float d = length(gl_PointCoord - .5);

const stars = new THREE.Points(starField(MOBILE ? 800 : 1200, false), starMat(2.4, 0.6, 0.45))

// the nebulae: soft-color exhalations pinned along the band
const nebTex = (h, s) => {

const nebs = []

const uWindT = { value: 0 }, uWindA = { value: 0.45 }
// where the citizen stands, so the grass can get out of the way

// ---- the cloud shadows: weather you can watch cross the ground. A
// tiling shadow texture scrolls over every ground-standing surface in
// world space, driven by the same wind that drives the clouds, dark
// patches slide over the meadow the way they do on a real hillside.
// The sun's global dapple was the sound of it; this is the sight. ----
const cloudShadowTex = (() => {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, N, N)
  for (let i = 0; i < 46; i++) {
    const x = Math.random() * N, y = Math.random() * N, r = 22 + Math.random() * 46
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { // wrapped, so it tiles
      const g = ctx.createRadialGradient(x + ox, y + oy, 2, x + ox, y + oy, r)
      g.addColorStop(0, 'rgba(0,0,0,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)')
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + ox, y + oy, r, 0, 7); ctx.fill()
    }
  }
  const t2 = new THREE.CanvasTexture(c)
  t2.wrapS = t2.wrapT = THREE.RepeatWrapping
  return t2
})()
const uCloudOfs = { value: new THREE.Vector2(0, 0) }
const uCloudAmt = { value: 0 }
const cloudShadowize = (mat2) => { // teach a material the sky's traffic
  const prev = mat2.onBeforeCompile
  mat2.onBeforeCompile = (sh) => {
    if (prev) prev(sh)
    sh.uniforms.uCSTex = { value: cloudShadowTex }
    sh.uniforms.uCSOfs = uCloudOfs; sh.uniforms.uCSAmt = uCloudAmt
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vCsPos;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
      { vec4 cswp = vec4(transformed, 1.);
        #ifdef USE_INSTANCING
        cswp = instanceMatrix * cswp;
        #endif
        vCsPos = (modelMatrix * cswp).xz; }`)
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vCsPos;\nuniform sampler2D uCSTex; uniform vec2 uCSOfs; uniform float uCSAmt;')
      .replace('#include <map_fragment>', `#include <map_fragment>
      { float cs = texture2D(uCSTex, vCsPos * .014 + uCSOfs).r;
        diffuseColor.rgb *= mix(1., .45 + .55 * cs, uCSAmt); }`)
  }
}

// ---- clouds: soft fbm sprites riding the wind at altitude. They
// thicken when the day's weather says overcast and blush at the hours
// the sun is low. ----
const cloudTex = (() => {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N
  const ctx = c.getContext('2d'), img = ctx.createImageData(N, N)
  const lat = (x, y, o) => (tileHash(((x % 8) + 8) % 8, ((y % 8) + 8) % 8, 501 + o) % 1000) / 1000
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let v = 0, amp = 0.55, fr = 8 / N
    for (let o = 0; o < 4; o++) {
      const fx = x * fr, fy = y * fr, x0 = Math.floor(fx), y0 = Math.floor(fy)
      const tx = fx - x0, ty2 = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty2 * ty2 * (3 - 2 * ty2)
      v += ((lat(x0, y0, o) * (1 - sx) + lat(x0 + 1, y0, o) * sx) * (1 - sy)
          + (lat(x0, y0 + 1, o) * (1 - sx) + lat(x0 + 1, y0 + 1, o) * sx) * sy) * amp
      amp *= 0.5; fr *= 2
    }
    const dx = x / N - 0.5, dy = y / N - 0.5
    const fall = Math.max(0, 1 - (dx * dx + dy * dy) * 4.4)
    const a = Math.max(0, v - 0.42) * 2.6 * fall

    img.data[i] = 255; img.data[i + 1] = 255; img.data[i + 2] = 255

  return t
})()

  const N = 128, c = document.createElement('canvas'); c.width = c.height = N

  ctx.fillStyle = '#e8ecf4'
  ctx.beginPath(); ctx.arc(N / 2, N / 2, N * 0.33, 0, 7); ctx.fill()
  ctx.globalCompositeOperation = 'source-atop'
  for (let i = 0; i < 26; i++) {
    const a = (tileHash(i, 1, 701) % 628) / 100, r = (tileHash(i, 2, 702) % 22) + 4
    const d = ((tileHash(i, 3, 703) % 30) / 100) * N
    ctx.fillStyle = 'rgba(158,168,190,' + (0.10 + (tileHash(i, 4, 704) % 18) / 100) + ')'
    ctx.beginPath(); ctx.arc(N / 2 + Math.cos(a) * d, N / 2 + Math.sin(a) * d, r * 0.28, 0, 7); ctx.fill()

})()

const auroraMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 }, uAlpha: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `varying vec2 vUv; uniform float uTime, uAlpha;
    void main(){
      float x = vUv.x * 12.566;

      float a = fall * cur * uAlpha;
      vec3 col = mix(vec3(.05, .85, .5), vec3(.35, .25, .85), smoothstep(.15, .9, y));

const rainbowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,

  fragmentShader: `varying vec2 vUv; uniform float uAlpha;
    void main(){
      float r = length(vec2((vUv.x - .5) * 2., vUv.y));
      float band = smoothstep(.7, .755, r) * smoothstep(.95, .89, r);

      float a = (band * .5 + band2 * .16) * uAlpha * smoothstep(.02, .22, vUv.y);

function strikeBolt(cx, cz) {
  const a = Math.random() * Math.PI * 2, d = 26 + Math.random() * 46

  const p = boltGeo.attributes.position.array
  let i = 0

    p[i++] = x; p[i++] = y; p[i++] = z

}

// ---- the ear: the window learns to listen. Zero assets here too ,
// wind is filtered noise, rain is brighter noise, thunder is a burst
// falling through a closing filter a polite second after its bolt,
// crickets are detuned triangle waves gated by their own tremor,
// fire is bandpass pops that get louder as you walk toward it,
// birdsong is a sine that remembers being a whistle, and your own
// footsteps land on the beat of the stride. The weather scores itself.
let AC = null, audio = null
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return }
  try { AC = new (window.AudioContext || window.webkitAudioContext)() } catch { return }
  const master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination)
  // the room: a synthesized impulse gives the night its distances
  const conv = AC.createConvolver()
  { const len = Math.floor(AC.sampleRate * 1.5)
    const ib = AC.createBuffer(2, len, AC.sampleRate)
    for (let ch = 0; ch < 2; ch++) { const d = ib.getChannelData(ch)
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6) }
    conv.buffer = ib }
  const wet = AC.createGain(); wet.gain.value = 0.08
  master.connect(conv); conv.connect(wet); wet.connect(AC.destination)
  const noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate)
  { const d = noiseBuf.getChannelData(0)
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1 }
  const bed = (type, freq, q) => {
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true
    const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q
    const g = AC.createGain(); g.gain.value = 0
    src.connect(f); f.connect(g); g.connect(master); src.start()
    return { f, g }
  }
  const wind = bed('lowpass', 320, 0.4)
  const rain = bed('bandpass', 3400, 0.35)
  const lap = bed('bandpass', 540, 0.9) // the shore keeps time
  const crickets = AC.createGain(); crickets.gain.value = 0; crickets.connect(master)
  for (const [f0, tr] of [[4300, 21], [4750, 16]]) {
    const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f0
    const g = AC.createGain(); g.gain.value = 0.5
    const lfo = AC.createOscillator(); lfo.frequency.value = tr
    const lg = AC.createGain(); lg.gain.value = 0.5
    lfo.connect(lg); lg.connect(g.gain)
    o.connect(g); g.connect(crickets); o.start(); lfo.start()
  }
  const pad = AC.createGain(); pad.gain.value = 0; pad.connect(master)
  for (const f0 of [196, 294.7]) { // the aurora hums a fifth to itself
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f0
    const g = AC.createGain(); g.gain.value = 0.5
    o.connect(g); g.connect(pad); o.start()
  }
  const out = (g, pan) => { // pops can sit left or right of the ear
    if (pan && AC.createStereoPanner) {
      const p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan))
      g.connect(p); p.connect(master)
    } else g.connect(master)
  }
  const pop = (freq, gain, dur, when = 0, pan = 0) => { // one struck sound, any kind
    const t0 = AC.currentTime + when
    const src = AC.createBufferSource(); src.buffer = noiseBuf
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1
    const g = AC.createGain()
    g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
    src.connect(f); f.connect(g); out(g, pan)
    src.start(t0, Math.random() * 1.5, dur + 0.05)
  }
  // the score: the window hums to itself at the magic hours. Warm slow
  // chords through a soft lowpass, a sparse plucked melody wandering a
  // pentatonic with an echo behind it, major while the light is gold,
  // minor once the night owns the sky. Silence at noon and in storms:
  // a score that knows when not to play is the whole trick.
  const musicLp = AC.createBiquadFilter(); musicLp.type = 'lowpass'; musicLp.frequency.value = 1500
  const musicBus = AC.createGain(); musicBus.gain.value = 1
  musicBus.connect(musicLp); musicLp.connect(master)
  const echo = AC.createDelay(1.2); echo.delayTime.value = 0.42
  const echoG = AC.createGain(); echoG.gain.value = 0.32
  echo.connect(echoG); echoG.connect(echo); echoG.connect(musicBus)
  const chord = (minor, lvl) => {
    const t0 = AC.currentTime
    const iv = minor ? [0, 3, 7, 10, 14] : [0, 4, 7, 11, 14]
    const nn = 3 + ((Math.random() * 2) | 0)
    for (let i = 0; i < nn; i++) {
      const o = AC.createOscillator(); o.type = 'triangle'
      o.frequency.value = 110 * Math.pow(2, iv[i] / 12) * (1 + (Math.random() - 0.5) * 0.004)
      const g = AC.createGain(); g.gain.value = 0.0001
      g.gain.setTargetAtTime(lvl * (i === 0 ? 1 : 0.6), t0 + i * 0.55, 2.4)
      g.gain.setTargetAtTime(0.0001, t0 + 8.5, 2.8)
      o.connect(g); g.connect(musicBus)
      o.start(t0); o.stop(t0 + 19)
    }
  }
  const pluck = (minor, lvl, pan) => {
    const sc = minor ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9]
    const t0 = AC.currentTime
    const o = AC.createOscillator(); o.type = 'sine'
    o.frequency.value = 220 * Math.pow(2, (sc[(Math.random() * sc.length) | 0] + 12 * ((Math.random() * 2) | 0)) / 12)
    const g = AC.createGain()
    g.gain.setValueAtTime(lvl, t0)
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.5)
    o.connect(g)
    if (pan && AC.createStereoPanner) {
      const p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan))
      g.connect(p); p.connect(musicBus); p.connect(echo)
    } else { g.connect(musicBus); g.connect(echo) }
    o.start(t0); o.stop(t0 + 1.6)
  }
  audio = {
    master, wind, rain, lap, crickets, pad, wet, noiseBuf, pop, chord, pluck,
    step: (hard) => pop(hard ? 620 + Math.random() * 200 : 210 + Math.random() * 140,
      hard ? 0.11 : 0.09, hard ? 0.07 : 0.09),
    crackle: (d, pan) => pop(1100 + Math.random() * 900, 0.16 / (1 + d * d * 0.12),
      0.05 + Math.random() * 0.06, 0, pan),
    thump: (when) => { // the heart, when it has reason to be heard
      const t0 = AC.currentTime + when
      const o = AC.createOscillator(); o.type = 'sine'
      o.frequency.setValueAtTime(58, t0); o.frequency.exponentialRampToValueAtTime(40, t0 + 0.12)
      const g = AC.createGain()
      g.gain.setValueAtTime(0.28, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22)
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.25)
    },
    gull: (pan) => {
      const t0 = AC.currentTime
      const o = AC.createOscillator(); o.type = 'sawtooth'
      o.frequency.setValueAtTime(1250 + Math.random() * 300, t0)
      o.frequency.exponentialRampToValueAtTime(560, t0 + 0.4)
      const g = AC.createGain()
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.03, t0 + 0.05)
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45)
      o.connect(g); out(g, pan); o.start(t0); o.stop(t0 + 0.5)
    },
    chirp: (pan) => {
      const t0 = AC.currentTime
      const o = AC.createOscillator(); o.type = 'sine'
      const g = AC.createGain()
      o.frequency.setValueAtTime(2500 + Math.random() * 900, t0)
      o.frequency.exponentialRampToValueAtTime(3900, t0 + 0.07)
      o.frequency.exponentialRampToValueAtTime(2300, t0 + 0.15)
      g.gain.setValueAtTime(0.0001, t0)
      g.gain.exponentialRampToValueAtTime(0.045, t0 + 0.02)
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17)
      o.connect(g); out(g, pan); o.start(t0); o.stop(t0 + 0.2)
    },
    thunder: (pan) => {
      const t0 = AC.currentTime + 0.25 + Math.random() * 1.1 // light outruns sound
      const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true
      const f = AC.createBiquadFilter(); f.type = 'lowpass'
      f.frequency.setValueAtTime(950, t0)
      f.frequency.exponentialRampToValueAtTime(52, t0 + 2.3)
      const g = AC.createGain()
      g.gain.setValueAtTime(0.0001, t0)
      g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.05)
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.5)
      src.connect(f); f.connect(g); out(g, pan)
      src.start(t0); src.stop(t0 + 2.6)
    },
  }
}

// ---- the bobbers: fishing gets its witness. While anyone works a

// idles on the chop, and DIPS on the bite, each gather tick pulls it
// under with a ripple ring spreading from the strike. ----
const fishBobs = new Map()
function bobberFor(nodeKey, x2, z2) {
  let bb = fishBobs.get(nodeKey)
  if (!bb) {
    const gg = new THREE.Group()
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 7),
      new THREE.MeshStandardMaterial({ color: 0xd83a2a, roughness: 0.5 }))
    const capB = new THREE.Mesh(new THREE.SphereGeometry(0.036, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xe8e2d4, roughness: 0.5 }))
    const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.07, 5),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a }))
    tip.position.y = 0.05
    gg.add(ball, capB, tip)
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.062, 20),
      new THREE.MeshBasicMaterial({ color: 0xcfe8ee, transparent: true, opacity: 0,
        depthWrite: false, side: THREE.DoubleSide }))
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.012
    gg.add(ring)
    gg.position.set(x2, -0.145, z2)
    gg.traverse((o) => { o.userData.noAO = true })
    bb = { g: gg, ring, dipAt: 0, until: 0, ph: Math.random() * 7 }
    scene.add(gg)

// ═══════════════════════════════════════════════════════════════════
// THE PLATE · a photograph is a signed claim about a tick
//
// Every other window paints the world. This one is the only one that
// takes anything OUT of it. A frame leaves here carrying, inside the
// PNG's own bytes, an Ed25519 statement by a named citizen: at tick T,
// in world W, standing on tile (x,y), with the eye HERE and pointed
// THERE, the world looked like this — and "this" is pinned by a
// SHA-256 of the pixels, so the claim cannot be moved onto another
// picture. The world is deterministic, so anyone holding the seed can
// re-derive the frame and hold it up against the print.
//
// This is not decoration and it is not DRM. It is the first artifact
// Interval produces that survives leaving Interval.
// ═══════════════════════════════════════════════════════════════════

// must not collide with SIG_DOMAINS.input / the chat domain: a photo
// signature must never be replayable as a deed.
const DOMAIN_PHOTO = 'INTERVAL_PHOTO_V1|'
const PLATE_KW = 'Interval', PLATE_KW_SIG = 'Interval-Sig', PLATE_KW_NOTE = 'Interval-Note'
// The namespace rule, and the whole reason the hash works: every tEXt
// chunk whose keyword begins 'Interval' is this window's, and NONE of
// them is covered by the image hash. Strip the namespace and you have
// the bytes the camera produced, which is exactly what was signed. Add
// a chunk here without honouring that and every plate in the world
// stops verifying, so the rule lives in one predicate.
const isOurs = (kw) => kw === PLATE_KW || kw.startsWith(PLATE_KW + '-')
const r3 = (n) => Math.round(n * 1000) / 1000
const sha256hex = async (bytes) => toHex(await crypto.subtle.digest('SHA-256', bytes))

// ---- PNG surgery. A tEXt chunk is length, type, keyword, NUL, text,
// CRC. We splice ours in just ahead of IEND, which every decoder on
// earth will step straight over: the file stays an ordinary PNG that
// an ordinary viewer opens, and a text editor can read the claim. ----
const CRC_T = (() => {
  const tb = new Uint32Array(256)
  for (let n = 0; n < 256; n++) {
    let c = n
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1)
    tb[n] = c >>> 0
  }
  return tb
})()
const crc32 = (b) => {
  let c = 0xffffffff
  for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xff] ^ (c >>> 8)
  return (c ^ 0xffffffff) >>> 0
}
// tEXt is Latin-1 by the spec; the plate is ASCII by construction, but
// a hostile world id should not be able to corrupt a PNG, so we clamp.
const latin1 = (s) => String(s).replace(/[^\x20-\x7e]/g, '?')
function textChunk(kw, txt) {
  const kb = new TextEncoder().encode(latin1(kw).slice(0, 79))
  const tb = new TextEncoder().encode(latin1(txt))
  const data = new Uint8Array(kb.length + 1 + tb.length)
  data.set(kb, 0); data[kb.length] = 0; data.set(tb, kb.length + 1)
  const chunk = new Uint8Array(12 + data.length)
  const dv = new DataView(chunk.buffer)
  dv.setUint32(0, data.length)
  chunk.set([0x74, 0x45, 0x58, 0x74], 4) // 'tEXt'
  chunk.set(data, 8)
  dv.setUint32(8 + data.length, crc32(chunk.subarray(4, 8 + data.length)))
  return chunk
}
// walk the chunk list; hand back [before-IEND, IEND-onward]
function pngSplit(bytes) {
  let p = 8
  while (p + 8 <= bytes.length) {
    const len = new DataView(bytes.buffer, bytes.byteOffset + p, 4).getUint32(0)
    const type = String.fromCharCode(bytes[p + 4], bytes[p + 5], bytes[p + 6], bytes[p + 7])
    if (type === 'IEND') return [bytes.subarray(0, p), bytes.subarray(p)]
    p += 12 + len
  }
  return [bytes, new Uint8Array(0)]
}
function pngWithText(bytes, entries) {
  const [head, tail] = pngSplit(bytes)
  const chunks = entries.map(([k, v]) => textChunk(k, v))
  const n = head.length + tail.length + chunks.reduce((a, c) => a + c.length, 0)
  const out = new Uint8Array(n)
  let o = 0
  out.set(head, o); o += head.length
  for (const c of chunks) { out.set(c, o); o += c.length }
  out.set(tail, o)
  return out
}
// the inverse, for the window's own verifier: strip every Interval
// tEXt chunk and hand back the bytes the camera actually produced,
// plus whatever those chunks said.
function pngReadPlate(bytes) {
  let p = 8
  const keep = [bytes.subarray(0, 8)]
  const found = {}
  while (p + 8 <= bytes.length) {
    const len = new DataView(bytes.buffer, bytes.byteOffset + p, 4).getUint32(0)
    const type = String.fromCharCode(bytes[p + 4], bytes[p + 5], bytes[p + 6], bytes[p + 7])
    const end = p + 12 + len
    let mine = false
    if (type === 'tEXt') {
      const d = bytes.subarray(p + 8, p + 8 + len)
      const z = d.indexOf(0)
      if (z > 0) {
        const kw = new TextDecoder('latin1').decode(d.subarray(0, z))
        if (isOurs(kw)) {
          found[kw] = new TextDecoder('latin1').decode(d.subarray(z + 1))
          mine = true
        }
      }
    }
    if (!mine) keep.push(bytes.subarray(p, end))
    if (type === 'IEND') break
    p = end
  }
  const n = keep.reduce((a, c) => a + c.length, 0)
  const bare = new Uint8Array(n)
  let o = 0
  for (const c of keep) { bare.set(c, o); o += c.length }
  return { bare, plate: found[PLATE_KW], sig: found[PLATE_KW_SIG] }
}

// ---- the plate itself. Everything a stranger needs to re-derive this
// frame from the seed, and nothing the window merely felt like. ----
function plateFor(tick, w2, h2, imgHash) {
  const me = world?.players?.[ownKey?.pub]
  camera.getWorldDirection(tmpV4)
  return {
    v: 1,
    worldId: curWorldId,
    tick,
    playerId: ownKey?.pub ?? '',
    at: me ? [me.x, me.y] : null,
    eye: [r3(camera.position.x), r3(camera.position.y), r3(camera.position.z)],
    look: [r3(tmpV4.x), r3(tmpV4.y), r3(tmpV4.z)],

async function signPlate(plate) {
  if (!ownKey) return null
  return toHex(await crypto.subtle.sign('Ed25519', ownKey.priv,
    new TextEncoder().encode(DOMAIN_PHOTO + canonicalJS(plate))))
}

// the window can check its own work, and anyone else's: drop a PNG on
// the glass and it says who stood where, when, and whether the file
// has been touched since.
async function verifyPngBytes(bytes) {
  const { bare, plate, sig } = pngReadPlate(bytes)
  if (!plate || !sig) return { ok: false, why: 'no plate: an ordinary picture' }
  let obj
  try { obj = JSON.parse(plate) } catch { return { ok: false, why: 'the plate is unreadable' } }
  const imgHash = await sha256hex(bare)
  if (imgHash !== obj.img) return { ok: false, why: 'the plate belongs to a different picture', plate: obj }
  try {
    const pub = await crypto.subtle.importKey('raw', fromHex(obj.playerId), { name: 'Ed25519' }, false, ['verify'])
    const ok = await crypto.subtle.verify('Ed25519', pub, fromHex(sig),
      new TextEncoder().encode(DOMAIN_PHOTO + canonicalJS(obj)))
    return ok ? { ok: true, plate: obj } : { ok: false, why: 'the signature does not hold', plate: obj }
  } catch { return { ok: false, why: 'the signing key is malformed', plate: obj } }
}

      || Math.max(Math.abs(gx - grassAnchorX), Math.abs(gy - grassAnchorY)) > GRASS_R + 5

// ---- THE LAMP POOL (v0.81): the single most expensive mistake in this
// window, and the reason for the "page is not responding" dialog.
//
// Every fire, ore-shard and waystone used to carry its own PointLight
// INSIDE its node group. In the fourth expanse (896x512, 8,170 nodes)
// that is 167 point lights, and 57 of them -- every campfire -- were
// created with castShadow = true. A shadow-casting point light renders
// the entire scene SIX times, once per cube face. Fourteen campfires in
// view is eighty-four extra scene traversals per frame, on top of the
// sun's shadow pass and the occlusion pass.
//
// Worse than the cost was the CHURN. The node window (see the frame)
// re-judges an eighth of the nodes every frame and flips group
// visibility; three.js skips invisible subtrees when it gathers lights,
// so the VISIBLE light count changed several times a second. That count
// is baked into three's program cache key, so every change recompiled
// every material in the world. On macOS that is a multi-second
// synchronous stall in the GLSL-to-Metal translator, over and over.
//
// So lamps are now DECLARED, not added. A fixed cast of pool lights
// lives in the scene forever -- the count never changes, so nothing
// ever recompiles -- and each frame the nearest declared lamps are
// copied into them. The fires still breathe: the frame writes to the
// declared light exactly as before, and the pool reads it.

  scene.add(l)

}

    const e = lamps[i]

    // whose node is merely parked out of the scene is only dark
    if (vis.node.get(e.owner.userData.id) !== e.owner) continue
    lamps[w++] = e
    if (!e.owner.parent) { e.d2 = Infinity; continue }
    const dx = e.owner.position.x + e.x - cx
    const dy = e.owner.position.y + e.y - cy
    const dz = e.owner.position.z + e.z - cz

  //    slot that re-aims every time the sort order jitters is a light
  //    teleporting across a courtyard, and a wall flashing white.
  const held = new Set()
  for (const p of lampPool) {
    if (p.__lamp && (lamps.indexOf(p.__lamp) < 0 || p.__lamp.d2 > KEEP2)) p.__lamp = null
    if (p.__lamp) held.add(p.__lamp)
  }
  // 2. empty slots take the nearest unheld lamp inside the tight ring
  let li = 0
  for (const p of lampPool) {
    if (p.__lamp) continue
    while (li < lamps.length && (held.has(lamps[li]) || lamps[li].d2 > R2)) li++
    if (li >= lamps.length) break

    p.intensity = p.__fade < 0.004 ? 0 : p.__fade

    // with the block under him that makes him one.
    add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.24, 0.6), tintedMat(0x6b6459, 0.9)), 0, 0.12)
    const body8 = add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.27, 0.84, 7),
      tintedMat(0x7a3f2c, 0.9)), 0, 0.66)
    add(new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), tintedMat(0xa8865c, 0.8)), 0, 1.18)
    // the arm is up, because that is the whole job

    add(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 0.16, 7), mats.gold), 0.46, 1.26, 0.06)
    g.rotation.y = (hsh % 628) / 100
  } else if (n.type === 'banner') {

    add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.13, 0.1, 9),
      tintedMat(0x1a1008, 0.98)), 0, 0.2, 0, false)
    const glow = add(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 9),
      new THREE.MeshBasicMaterial({ color: 0xff5a14, transparent: true, opacity: 0.8,
        blending: THREE.AdditiveBlending, depthWrite: false })), 0, 0.23, 0, false)
    glow.userData.flame = 2

    // way off, which is the entire reason it exists.
    const earthM = tintedMat(0x4a4030, 0.98, { vertexColors: false })

      add(new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.1, 5), mats.darkwood), -0.4 + i * 0.2, 1.37, 0, false)
    }
    add(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.06, 0.09), mats.wood), 0, 1.14, 0.06)

  } else {
    // Whatever arrives that this window has not learned to build yet
    // still has to stand somewhere. It used to be a pale wooden crate
    // at chest height, which under a night meter is a bright box in a
    // dark field and reads as a bug rather than as a thing. A low dark
    // cairn is the honest placeholder: present, locatable, and plainly
    // not finished, without seizing the frame.
    for (let i = 0; i < 5; i++) {
      const a8 = (i / 5) * Math.PI * 2
      const st8 = add(new THREE.Mesh(rockGeo(tileHash(n.x + i, n.y, 53)), mats.stoneBlob),
        Math.cos(a8) * 0.2, 0.09 + (i % 2) * 0.07, Math.sin(a8) * 0.2)
      st8.scale.setScalar(0.26); st8.rotation.y = a8
    }
    g.userData.ghostH = 0.5
  }
  // a name floats over the thing, not inside it: now that a keep is
  // 4.3 and a curtain 2.2, a fixed 1.9 buried the caption in the stone
  const lb = label(n.type)
  lb.position.y = Math.max(1.9, (g.userData.ghostH ?? 0) + 0.4)
  // label() now sizes its own canvas to the text, so the caption keeps
  // its aspect instead of being forced into a fixed 1.5 x 0.28 box --
  // which, once the canvas width started varying, would have squeezed
  // short words and stretched long ones
  lb.scale.multiplyScalar(0.57); g.add(lb)
  g.userData.label = lb
  return g
}

const MOB_LOOK = { goblin: [0x5c8a3a, 0.55], wolf: [0x6b6b62, 0.55], troll: [0x4a6b52, 0.95],

// a limb that pivots where it should: a group at the joint, flesh below
function limb(mat, r, len, s) {
  const p = new THREE.Group()
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r * s, len * s, 3, 6), mat)
  m.position.y = -(len * s) / 2

}
// the standing peoples: citizens, goblins, trolls, the knight that
// forgot to stop. Legs pump, arms swing, eyes face the way they walk ,
// and now everyone dresses the part: woven tunics over darker trousers,
// belts, hair, hoods for the citizens; clubs and loincloths for the
// goblins; moss on the trolls' shoulders and a hunch in their backs;
// sword, shield, and cold blue eye-lights for the knight. Chests
// breathe when they stand still.
function bodyOf(color, scale, own = false, kind = '') {
  const g = new THREE.Group()
  const skel = kind === 'skeleton-knight'
  const troll = kind === 'troll'
  const hsh2 = (((color ^ 0x9e3779) >>> 0) * 2654435761) >>> 0
  const garb = new THREE.MeshStandardMaterial({
    color: own ? 0xbe9427 : skel ? 0x3a3a42 : kind ? new THREE.Color(color).multiplyScalar(0.72) : color,
    roughness: 0.85, metalness: own ? 0.35 : skel ? 0.4 : 0,
    map: clothDetail.albedo, normalMap: clothDetail.normal, normalScale: new THREE.Vector2(0.5, 0.5) })
  const trouser = new THREE.MeshStandardMaterial({
    color: new THREE.Color(garb.color).multiplyScalar(0.5), roughness: 0.92,
    map: clothDetail.albedo, normalMap: clothDetail.normal, normalScale: new THREE.Vector2(0.5, 0.5) })
  const skin = new THREE.MeshStandardMaterial({ color: skel ? 0xd8d4c4 : kind ? color : 0xc9a480,
    roughness: kind ? 0.85 : 0.62, normalMap: kind ? furDetail.normal : clothDetail.normal,
    normalScale: new THREE.Vector2(kind ? 0.7 : 0.25, kind ? 0.7 : 0.25) })

  head.position.set(0, 1.16 * scale, headZ); head.castShadow = true; g.add(head)

    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.162 * scale, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), hair)
    cap.position.y = 1.165 * scale; cap.castShadow = true; g.add(cap)
    if (own) {
      const hd = new THREE.Mesh(new THREE.ConeGeometry(0.175 * scale, 0.26 * scale, 8), garb)
      hd.position.y = 1.31 * scale; hd.castShadow = true; g.add(hd)
    }
    const belt = new THREE.Mesh(new THREE.TorusGeometry(0.195 * scale, 0.026 * scale, 6, 14),
      own ? mats.gold : mats.darkwood)
    belt.position.y = 0.6 * scale; belt.rotation.x = Math.PI / 2; g.add(belt)
  }
  if (kind === 'goblin') {
    for (const s of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.05 * scale, 0.18 * scale, 5), skin)
      ear.position.set(0.17 * scale * s, 1.2 * scale, 0)
      ear.rotation.z = s * -Math.PI / 2.4
      ear.castShadow = true; g.add(ear)
    }
    const cloth = new THREE.Mesh(new THREE.ConeGeometry(0.2 * scale, 0.22 * scale, 7), trouser)

  }
  if (troll) for (const s of [-1, 1]) { // moss claims the still parts first
    const moss = new THREE.Mesh(craggy(0.1 * scale, hsh2 % 71 + s + 2), mats.leaf2)
    moss.position.set(0.19 * scale * s, 1.02 * scale, -0.03 * scale)

  for (const s of [-1, 1]) {

    club.position.set(0, -(armLen + 0.24) * scale, 0.05 * scale)

    haft.add(headStone)

    const sw = new THREE.Mesh(new THREE.BoxGeometry(0.045 * scale, 0.5 * scale, 0.03 * scale), mats.iron)
    sw.position.set(0, -(armLen + 0.3) * scale, 0.05 * scale)

    g.__arms[0].add(sw)
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.14 * scale, 0.03 * scale, 0.04 * scale), mats.gold)
    guard.position.set(0, -(armLen + 0.06) * scale, 0.05 * scale)
    g.__arms[0].add(guard)
    const shield = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * scale, 0.15 * scale, 0.028 * scale, 12), mats.iron)
    shield.rotation.z = Math.PI / 2
    shield.position.set(-0.04 * scale, -armLen * 0.6 * scale, 0)
    shield.castShadow = true
    g.__arms[1].add(shield)
    const boss = new THREE.Mesh(new THREE.SphereGeometry(0.04 * scale, 8, 6), mats.gold)
    boss.position.set(-0.06 * scale, -armLen * 0.6 * scale, 0)

    const helm = new THREE.Mesh(new THREE.ConeGeometry(0.16 * scale, 0.2 * scale, 8), mats.iron)

    plume.position.y = 1.45 * scale; g.add(plume)

  return g
}
// the four-footed: a barrel of a body, a snout, ears, a tail, and four

    ruff.position.set(0, 0.48 * scale, 0.26 * scale)

  snout.rotation.x = Math.PI / 2
  g.add(snout)
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.026 * scale * bulk, 6, 5),
    new THREE.MeshStandardMaterial({ color: 0x14100c, roughness: 0.3 }))

  g.add(nose)
  const eyeCol = kind === 'wolf' ? 0xd8b24a : 0x14100c
  const eye = new THREE.MeshStandardMaterial({ color: eyeCol, roughness: 0.35,
    emissive: kind === 'wolf' ? eyeCol : 0x000000, emissiveIntensity: kind === 'wolf' ? 0.6 : 0 })
  for (const s of [-1, 1]) {
    const e2 = new THREE.Mesh(new THREE.SphereGeometry(0.022 * scale, 6, 5), eye)
    e2.position.set(0.06 * scale * s, 0.57 * scale * bulk, 0.5 * scale)
    g.add(e2)
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.035 * scale, (kind === 'wolf' ? 0.11 : 0.05) * scale, 5), darkFur)
    ear.position.set(0.075 * scale * s, 0.66 * scale * bulk, 0.36 * scale)
    ear.castShadow = true; g.add(ear)
  }
  const tail = kind === 'wolf'
    ? new THREE.Mesh(new THREE.ConeGeometry(0.055 * scale, 0.4 * scale, 7), darkFur) // the brush
    : new THREE.Mesh(new THREE.CapsuleGeometry(0.035 * scale, 0.08 * scale, 3, 6), fur)
  tail.position.set(0, 0.48 * scale * bulk, -0.42 * scale)
  tail.rotation.x = -0.9

  g.__arms = []; g.__legs = []
  for (const fz of [1, -1]) for (const s of [-1, 1]) {

    g.add(leg)

// ---- the theater of consequence: chips fly, sparks jump, water leaps,
// bodies swing. None of it is authoritative; all of it is owed. ----
const fx = []
function burst(x, y3, z, kind) {
  if (fx.length > 110) return
  if (kind === 'splash') {
    const m = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.03, 6, 20),
      new THREE.MeshBasicMaterial({ color: 0xbfe6ee, transparent: true, opacity: 0.85 }))
    m.rotation.x = -Math.PI / 2; m.position.set(x, -0.16, z)
    scene.add(m); fx.push({ m, life: 0.6, t0: 0.6, kind }); return
  }
  const col = kind === 'spark' ? 0xffcf6a : kind === 'dust' ? 0x8d8676 : 0x7a4d21
  const mat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 1,
    blending: kind === 'spark' ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false })
  for (let i = 0; i < (kind === 'spark' ? 7 : 5); i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, 0.05), mat)

// but never enters, rimmed by whatever stands behind it (gold at the

// the one light it owns. A silhouette has no bad topology: the crude

  const limb = (sx, topY, botY, r1, r2, upBone, loBone, jointY, colAt) => {
    const len = topY - botY
    // a segmented tube: fourteen rings so the joint band holds real
    // vertices to feather through, the lesson the capsule taught
    const ggeo = new THREE.CylinderGeometry(1, 1, len, 10, 14)
    const posA = ggeo.attributes.position
    for (let i = 0; i < posA.count; i++) {
      const yy = posA.getY(i)
      const u = Math.min(1, Math.max(0, (yy + len / 2) / len))
      const wy = yy + (topY + botY) / 2
      let rr = (r2 + (r1 - r2) * u) * limbF
      // the flesh has a profile: a swell for the upper muscle, a
      // second for the calf or forearm, a hollow either side of the
      // joint so the bend reads as a JOINT and not a kink in a pipe
      rr *= 1 + 0.22 * Math.exp(-Math.pow((wy - (topY - (topY - jointY) * 0.45)) / ((topY - jointY) * 0.32), 2))
      rr *= 1 + 0.16 * Math.exp(-Math.pow((wy - (jointY - (jointY - botY) * 0.35)) / ((jointY - botY) * 0.3), 2))
      const kn = 1 + 0.08 * Math.exp(-Math.pow((wy - jointY) / 0.05, 2))
      posA.setX(i, posA.getX(i) * rr * kn); posA.setZ(i, posA.getZ(i) * rr * kn)
    }
    ggeo.translate(sx, (topY + botY) / 2, 0)
    addPart(ggeo, (x, y) => colAt(y),
      (x, y) => blend2(BI[upBone], BI[loBone], smooth(jointY + 0.05, jointY - 0.05, y)))
  }
  // arms: sleeve to just past the elbow, then skin
  limb(-RIG.shoulder, RIG.shoulderY + 0.02, RIG.shoulderY - RIG.elbowDrop - RIG.wristDrop, 0.052, 0.038,
    'shL', 'fkL', RIG.shoulderY - RIG.elbowDrop, (y) => y > RIG.shoulderY - RIG.elbowDrop - 0.03 ? tunicHex : skinHex)
  limb(RIG.shoulder, RIG.shoulderY + 0.02, RIG.shoulderY - RIG.elbowDrop - RIG.wristDrop, 0.052, 0.038,
    'shR', 'fkR', RIG.shoulderY - RIG.elbowDrop, (y) => y > RIG.shoulderY - RIG.elbowDrop - 0.03 ? tunicHex : skinHex)
  // legs: trouser above the knee, boot-leather tone below
  limb(-RIG.hipX, RIG.thighY + 0.03, RIG.thighY - RIG.kneeDrop - RIG.ankleDrop, 0.062, 0.046,
    'thL', 'snL', RIG.thighY - RIG.kneeDrop, (y) => y > RIG.thighY - RIG.kneeDrop ? trouserUp : trouserLo)
  limb(RIG.hipX, RIG.thighY + 0.03, RIG.thighY - RIG.kneeDrop - RIG.ankleDrop, 0.062, 0.046,
    'thR', 'snR', RIG.thighY - RIG.kneeDrop, (y) => y > RIG.thighY - RIG.kneeDrop ? trouserUp : trouserLo)
  // the hip skirt closes the seam between torso and legs
  const hipG = new THREE.CylinderGeometry(0.15, 0.13, 0.14, 12)
  hipG.translate(0, 0.36, 0)
  addPart(hipG, () => trouserUp, () => [BI.hips, 1, 0, 0])

  const merged = mergeGeometries(parts)
  merged.computeVertexNormals()
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0,
    map: clothTex?.albedo ?? null, normalMap: clothTex?.normal ?? null,
    normalScale: new THREE.Vector2(0.5, 0.5) })
  const mesh = new THREE.SkinnedMesh(merged, mat)
  mesh.castShadow = true
  // AND RECEIVES. A body that only casts is lit by a sun the rest of the
  // world is standing out of: walk under a tree and the grass darkens while
  // the citizen stays in full noon, which is the exact cue that reads as a
  // sticker laid over a photograph. Receiving also buys self-shadowing, so
  // an arm darkens the tunic it swings across and the head shades the neck.
  mesh.receiveShadow = true
  mesh.add(hips)
  hips.updateMatrixWorld(true)
  mesh.bind(new THREE.Skeleton(bones))
  return { mesh, mat, bones: BI, boneList: bones, hips, spine, chest, head, shL, shR, fkL, fkR, thL, thR, snL, snR, ankL, ankR, toeL, toeR, plateRanges, merged }
}

// ---- the beasts, sewn: a horizontal spine, four feathered legs, a
// tail with two bones and opinions. Wolves and bears get flesh that
// bends; goblins and trolls borrow the citizen's skeleton at their own
// proportions; the skeleton-knight is EXEMPT on principle, sewn skin
// is exactly what a skeleton must not have, so his bones stay hinged,
// which for him is anatomy. ----
function buildBeastCore(type) {
  const wolf = type === 'wolf'
  const L = wolf ? 0.72 : 0.92          // shoulder-to-haunch
  const bodyH = wolf ? 0.42 : 0.52      // spine height
  const bodyR = wolf ? 0.13 : 0.20
  const legR = wolf ? 0.045 : 0.07
  const hide = wolf ? 0x6b6b62 : 0x5c4023
  const belly = wolf ? 0x8a8a80 : 0x6e5030
  const B = (name, px, py, pz, parent) => {
    const b = new THREE.Bone(); b.name = name; b.position.set(px, py, pz)
    if (parent) parent.add(b); return b
  }
  const hips = B('hips', 0, bodyH, -L / 2, null)
  const spine = B('spine', 0, 0, L / 2, hips)
  const chest = B('chest', 0, 0.02, L / 2, spine)
  const neck = B('neck', 0, wolf ? 0.08 : 0.10, wolf ? 0.10 : 0.10, chest)
  const head = B('head', 0, wolf ? 0.06 : 0.08, wolf ? 0.13 : 0.12, neck)
  const legW = wolf ? 0.09 : 0.14
  const upFL = B('upFL', -legW, -0.06, 0.02, chest), loFL = B('loFL', 0, -(bodyH - 0.06) / 2, 0, upFL)
  const upFR = B('upFR', legW, -0.06, 0.02, chest), loFR = B('loFR', 0, -(bodyH - 0.06) / 2, 0, upFR)
  const upBL = B('upBL', -legW, -0.04, 0.02, hips), loBL = B('loBL', 0, -(bodyH - 0.04) / 2, 0, upBL)
  const upBR = B('upBR', legW, -0.04, 0.02, hips), loBR = B('loBR', 0, -(bodyH - 0.04) / 2, 0, upBR)
  const tail1 = B('tail1', 0, 0.02, -0.10, hips)
  const tail2 = B('tail2', 0, 0.01, -0.14, tail1)
  const bones = [hips, spine, chest, neck, head, upFL, loFL, upFR, loFR, upBL, loBL, upBR, loBR, tail1, tail2]
  const BI = {}; bones.forEach((b, i) => { BI[b.name] = i })
  const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u) }
  const parts = []
  const addPart = (geo, colorAt, weightAt) => {
    const pos = geo.attributes.position, n = pos.count
    const col = new Float32Array(n * 3), sIdx = new Uint16Array(n * 4), sWt = new Float32Array(n * 4)
    const c = new THREE.Color()
    for (let i = 0; i < n; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i)
      c.set(colorAt(x, y, z))
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b
      const [ia, wa, ib, wb] = weightAt(x, y, z)
      sIdx[i * 4] = ia; sIdx[i * 4 + 1] = ib
      sWt[i * 4] = wa; sWt[i * 4 + 1] = wb
    }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3))
    geo.setAttribute('skinIndex', new THREE.BufferAttribute(sIdx, 4))
    geo.setAttribute('skinWeight', new THREE.BufferAttribute(sWt, 4))
    parts.push(geo)
  }
  const blend2 = (a, b, k) => [a, 1 - k, b, k]
  // the barrel: a tube laid along the spine, haunches to shoulders
  const body = new THREE.CylinderGeometry(1, 1, L + bodyR * 1.4, 12, 14)
  { const pos = body.attributes.position
    for (let i = 0; i < pos.count; i++) {
      const yy = pos.getY(i)
      const u = Math.min(1, Math.max(0, (yy + (L + bodyR * 1.4) / 2) / (L + bodyR * 1.4)))
      const swell = 0.82 + 0.36 * Math.sin(u * Math.PI)  // deep chest, tucked waist
      pos.setX(i, pos.getX(i) * bodyR * swell)
      pos.setZ(i, pos.getZ(i) * bodyR * (wolf ? 1.06 : 1.15) * swell)
    } }
  body.rotateX(Math.PI / 2)
  body.translate(0, bodyH, 0)
  addPart(body, (x, y) => y < bodyH - bodyR * 0.35 ? belly : hide,
    (x, y, z) => {
      if (z < -0.1) return blend2(BI.hips, BI.spine, smooth(-0.25, -0.1, z) * 0.5)
      return blend2(BI.spine, BI.chest, smooth(-0.1, 0.28, z))
    })
  // the neck: chest into skull, one bending tube
  const neckG = new THREE.CylinderGeometry(bodyR * 0.62, bodyR * 0.8, wolf ? 0.22 : 0.24, 10, 8)
  neckG.rotateX(Math.PI / 2 - (wolf ? 0.7 : 0.8))
  neckG.translate(0, bodyH + (wolf ? 0.11 : 0.13), L / 2 + (wolf ? 0.10 : 0.09))
  addPart(neckG, () => hide, (x, y, z) => blend2(BI.chest, BI.neck, smooth(bodyH + 0.02, bodyH + 0.2, y)))
  // four legs, each one tube through a feathered knee
  const mkLeg = (sx, sz, upName, loName, rootY) => {
    const topY = rootY, botY = 0.015, len = topY - botY
    const kneeY = topY - (topY - botY) / 2
    const gg = new THREE.CylinderGeometry(1, 1, len, 8, 12)
    const pos = gg.attributes.position
    for (let i = 0; i < pos.count; i++) {
      const yy = pos.getY(i)
      const u = Math.min(1, Math.max(0, (yy + len / 2) / len))
      const rr = legR * (0.7 + 0.5 * u)
      const kn = 1 + 0.12 * Math.exp(-Math.pow(((yy + (topY + botY) / 2) - kneeY) / 0.04, 2))
      pos.setX(i, pos.getX(i) * rr * kn); pos.setZ(i, pos.getZ(i) * rr * kn)
    }
    gg.translate(sx, (topY + botY) / 2, sz)
    addPart(gg, () => hide, (x, y) => blend2(BI[upName], BI[loName], smooth(kneeY + 0.04, kneeY - 0.04, y)))
  }
  mkLeg(-legW, L / 2 + 0.02, 'upFL', 'loFL', bodyH - 0.06)
  mkLeg(legW, L / 2 + 0.02, 'upFR', 'loFR', bodyH - 0.06)
  mkLeg(-legW, -L / 2 + 0.02, 'upBL', 'loBL', bodyH - 0.04)
  mkLeg(legW, -L / 2 + 0.02, 'upBR', 'loBR', bodyH - 0.04)
  // the tail: two bones of opinion
  const tailLen = wolf ? 0.34 : 0.14
  const tailG = new THREE.CylinderGeometry(wolf ? 0.035 : 0.05, 0.012, tailLen, 6, 8)
  tailG.rotateX(Math.PI / 2 + 0.5)
  tailG.translate(0, bodyH + 0.05, -L / 2 - tailLen / 2 + 0.02)
  addPart(tailG, () => hide, (x, y, z) => blend2(BI.tail1, BI.tail2, smooth(-L / 2 - 0.06, -L / 2 - tailLen, z)))
  const merged = mergeGeometries(parts)
  merged.computeVertexNormals()
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0,
    normalMap: clothDetail?.normal ?? null, normalScale: new THREE.Vector2(0.7, 0.7) })
  const mesh = new THREE.SkinnedMesh(merged, mat)
  mesh.castShadow = true
  mesh.receiveShadow = true   // see buildSkinCore: casting without receiving is the sticker cue
  mesh.add(hips)
  hips.updateMatrixWorld(true)
  mesh.bind(new THREE.Skeleton(bones))
  return { mesh, mat, hips, chest, neck, head, tail1, tail2,
    legsQ: [[BI, upFL, loFL], [BI, upFR, loFR], [BI, upBL, loBL], [BI, upBR, loBR]].map(a => [a[1], a[2]]),
    bodyH, wolf }
}
// =====================================================================
// THE DRAGON. It had NO branch anywhere in this file: MOB_LOOK had no
// entry for it, so it fell to the default [0x8a7449, 0.5] and the one
// thing on this island that kills a citizen in full star gear rendered
// as a beige quadruped HALF THE SIZE OF A WOLF. The flat window says
// what it should be, in capitals: it is bigger than its tile, and it
// should be, because seeing it at the edge of the screen is itself the
// warning. One of these exists. It respawns slowly. It gets built.
//
// It is a shadow-form like everything else that hunts you -- matte,
// near-black, the world's light wrapping it but never entering -- with
// one deliberate exception: the WING MEMBRANE is thin enough to pass
// light. So when the sun or the moon stands behind it, the span lights
// up like a held-out hand, and you can read the bones through it. That
// is the only place in this window where a hunting thing is lit from
// inside, and it is worth the exception.
// =====================================================================
let QUAKE = 0        // what the ground still remembers of the last beat
function buildDragon(id) {
  const g = new THREE.Group()
  g.rotation.order = 'YXZ'
  const hide = shadowMat()
  const cast = (m) => { m.castShadow = true; return m }
  const seg = (r1, r2, len, mat) => cast(new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, len, 7), mat))

  // ---- the trunk: a long low mass, deepest at the shoulders ----
  const body = cast(new THREE.Mesh(new THREE.SphereGeometry(0.78, 14, 11), hide))
  body.scale.set(1.0, 0.86, 2.15); body.position.set(0, 1.28, -0.15); g.add(body)
  const chest = cast(new THREE.Mesh(new THREE.SphereGeometry(0.66, 12, 10), hide))
  chest.scale.set(1.08, 1.0, 1.15); chest.position.set(0, 1.30, 1.10); g.add(chest)

  // ---- the neck: five links, each hung off the last, so it can arc ----
  const neck = []
  let par = g, ny = 1.62, nz = 1.62
  for (let i = 0; i < 5; i++) {
    const j = new THREE.Group()
    j.position.set(0, i === 0 ? ny : 0, i === 0 ? nz : 0.46)
    const r = 0.36 - i * 0.045
    const m = seg(r, r + 0.04, 0.5, hide); m.rotation.x = Math.PI / 2; m.position.z = 0.23
    j.add(m); par.add(j); par = j; neck.push(j)
    j.rotation.x = -0.30 + i * 0.055        // the S the neck rests in
  }
  // ---- the skull: a wedge, a jaw that opens, horns that sweep back ----
  const head = new THREE.Group(); head.position.z = 0.44; par.add(head)
  const skull = cast(new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 9), hide))
  skull.scale.set(0.82, 0.78, 1.5); skull.position.z = 0.28; head.add(skull)
  const jaw = new THREE.Group(); jaw.position.set(0, -0.11, 0.06); head.add(jaw)
  const jawM = cast(new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 7), hide))
  jawM.scale.set(0.74, 0.42, 1.5); jawM.position.z = 0.3; jaw.add(jawM)
  for (const hx of [-1, 1]) {
    const horn = cast(new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.72, 6), hide))
    horn.position.set(hx * 0.17, 0.2, -0.06); horn.rotation.set(2.5, 0, -hx * 0.32); head.add(horn)
    const brow = cast(new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.3, 5), hide))
    brow.position.set(hx * 0.2, 0.12, 0.34); brow.rotation.set(1.9, 0, -hx * 0.5); head.add(brow)
  }
  // the lamp eyes, and the furnace behind them
  const eyeMat = new THREE.MeshBasicMaterial({ color: EYE_LAMPS.dragon })
  for (const ex of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.062, 8, 6), eyeMat)
    eye.position.set(ex * 0.16, 0.06, 0.42); head.add(eye)
  }
  const furnace = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xff7a1e, transparent: true, opacity: 0.9 }))
  furnace.position.set(0, -0.04, 0.2); jaw.add(furnace)
  const throat = new THREE.PointLight(0xff6a20, 0, 26, 1.7)
  throat.position.set(0, -0.02, 0.5); head.add(throat)

  // ---- the tail: seven links, counterweight to all that neck ----
  const tail = []
  par = g
  for (let i = 0; i < 7; i++) {
    const j = new THREE.Group()
    j.position.set(0, i === 0 ? 1.34 : 0, i === 0 ? -1.5 : -0.52)
    const r = 0.34 - i * 0.042
    const m = seg(r, Math.max(0.02, r - 0.045), 0.56, hide)
    m.rotation.x = Math.PI / 2; m.position.z = -0.28
    j.add(m); par.add(j); par = j; tail.push(j)
  }
  for (let i = 1; i < 6; i++) {   // the ridge, standing off the spine
    const f = cast(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3, 4), hide))
    f.position.set(0, 0.3, -0.24); f.rotation.x = -0.25; tail[i].add(f)
  }

  // ---- THE WINGS. Spars, and a membrane thin enough to hold the sun ----
  const memMat = new THREE.MeshStandardMaterial({ color: 0x21160f, roughness: 0.86,
    side: THREE.DoubleSide, transparent: true, opacity: 0.93 })
  const wings = []
  for (const side of [-1, 1]) {
    const w = new THREE.Group(); w.position.set(side * 0.5, 1.62, 0.5); g.add(w)
    const P = [[0, 0, -1.25], [0, 0, 0], [2.35, 0.1, 0.15], [4.05, 0.05, -0.55], [3.25, 0, -1.75], [2.05, 0, -2.5]]
    const F = [[1, 2, 3], [1, 3, 4], [1, 4, 5], [0, 1, 5]]
    const pos = [], nrm = []
    for (const [a, b, c] of F) for (const k of [a, b, c]) {
      pos.push(P[k][0] * side, P[k][1], P[k][2]); nrm.push(0, 1, 0)
    }
    const mg = new THREE.BufferGeometry()
    mg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
    mg.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3))
    const mem = new THREE.Mesh(mg, memMat); mem.castShadow = true; w.add(mem)
    const bone = (a, b, r) => {   // a spar laid between two points
      const A = new THREE.Vector3(P[a][0] * side, P[a][1], P[a][2])
      const B = new THREE.Vector3(P[b][0] * side, P[b][1], P[b][2])
      const m = cast(new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.55, A.distanceTo(B), 5), hide))
      m.position.copy(A).add(B).multiplyScalar(0.5)
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize())
      w.add(m)
    }
    bone(1, 2, 0.11); bone(2, 3, 0.062); bone(2, 4, 0.055); bone(2, 5, 0.05)
    wings.push(w)
  }

  // ---- four legs that carry two tonnes ----
  const legs = []
  for (const sx of [-1, 1]) for (const sz of [1, -1]) {
    const hipJ = new THREE.Group(); hipJ.position.set(sx * 0.62, 1.24, sz * 0.95); g.add(hipJ)
    const up = seg(0.19, 0.15, 0.66, hide); up.position.y = -0.33; hipJ.add(up)
    const kneeJ = new THREE.Group(); kneeJ.position.y = -0.66; hipJ.add(kneeJ)
    const lo = seg(0.14, 0.1, 0.58, hide); lo.position.y = -0.29; kneeJ.add(lo)
    const foot = cast(new THREE.Mesh(new THREE.SphereGeometry(0.19, 8, 6), hide))
    foot.scale.set(1, 0.5, 1.35); foot.position.set(0, -0.6, 0.1); kneeJ.add(foot)
    for (let c = -1; c <= 1; c++) {   // claws
      const cl = cast(new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.2, 4), hide))
      cl.position.set(c * 0.11, -0.62, 0.3); cl.rotation.x = 1.9; kneeJ.add(cl)
    }
    legs.push([hipJ, kneeJ])
  }

  g.__dragon = { neck, head, jaw, tail, wings, legs, furnace, throat, body, chest,
    wing: Math.random() * 6.283, roarAt: -1e9 }
  g.userData.eyeMat = eyeMat
  g.scale.setScalar(1.15)
  initAn(g, id)
  return g
}

function makeSewnBeast(id, type) {
  if (type === 'dragon') return buildDragon(id)
  // ---- THE FIVE THAT WERE NEVER BUILT. sheep, shore-crab, siren,
  // great-spider and the gibbet-king had no branch anywhere in this file
  // and no MOB_LOOK entry, so every one of them fell through to the
  // quadruped fallback and stood in the world as a tan, fanged, wolf-
  // shaped animal. A flock of forty sheep with fangs; a crab on the
  // shore with four legs and a tail; a spider with no more legs than a
  // dog. The truth says 'sheep, here, 40 hp' and the rendering is
  // agnostic, but agnostic is not licence to draw the wrong animal. ----
  if (type === 'sheep') {
    // A SHEEP IS NOT A SHADOW (see shadowize's exemption): it does not
    // hunt you, the engine says so with `harmless`, and a black wisp
    // with lamp eyes standing in a fold would be a lie about the world.
    // Wool, therefore: lit, pale, and shaped almost entirely by fleece.
    const g = new THREE.Group(); g.rotation.order = 'YXZ'
    const wool = new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 1 })
    const hide = new THREE.MeshStandardMaterial({ color: 0x2e2a26, roughness: 0.95 })
    const cast = (m) => { m.castShadow = true; m.receiveShadow = true; return m }
    // the fleece: four overlapping masses, so the silhouette is lumpy
    const body = cast(new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), wool))
    body.position.y = 0.44; body.scale.set(1.25, 0.95, 0.9); g.add(body)
    g.userData.qbody = body; g.userData.bod = body
    for (let i = 0; i < 4; i++) {
      const tuft = cast(new THREE.Mesh(new THREE.SphereGeometry(0.16, 7, 6), wool))
      tuft.position.set(-0.2 + (i % 2) * 0.34, 0.55 + (i > 1 ? 0.04 : 0), (i > 1 ? 0.14 : -0.14))
      g.add(tuft)
    }
    const head = cast(new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 7), hide))
    head.position.set(0.42, 0.5, 0); head.scale.set(1.3, 1, 0.85); g.add(head)
    for (const ez of [-0.1, 0.1]) { // ears, out sideways: the read at distance
      const ear = cast(new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), hide))
      ear.position.set(0.4, 0.56, ez); ear.scale.set(0.6, 0.4, 1.5); g.add(ear)
    }
    g.userData.legs4 = []
    for (const [lx, lz] of [[0.2, 0.13], [0.2, -0.13], [-0.22, 0.13], [-0.22, -0.13]]) {
      const leg = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.34, 5), hide))
      leg.position.set(lx, 0.17, lz); g.add(leg); g.userData.legs4.push(leg)
    }
    return g
  }
  if (type === 'shore-crab') {
    // low, wide, and sideways-on. A crab reads by its CLAWS and by
    // sitting almost on the ground, not by having a head.
    const g = new THREE.Group(); g.rotation.order = 'YXZ'
