cv.addEventListener('click', (e) => {
  if (!world) return
  const r = cv.getBoundingClientRect()
  const sx = (e.clientX - r.left) * (cv.width / r.width) / ZR
  const sy = (e.clientY - r.top) * (cv.height / r.height) / ZR
  const x = Math.floor(sx / TILE + cam.x), y = Math.floor(sy / TILE + cam.y)
  if (x < 0 || x >= W || y < 0 || y >= H) return
  const me = world.players[myId]; if (!me) return
  const adj = (o) => Math.abs(me.x - o.x) + Math.abs(me.y - o.y) === 1

  // a new order interrupts the old work by REPLACING it: the engine
  // honors the latest input natively. (An explicit stop sent alongside
  // the new action once tripped the one-input-per-tick rule: both
  // dropped, and the citizen froze mid-swing, deaf to all clicks.)
  pendingLight = null
  // hit-test against RENDERED positions: a goblin mid-stride is clickable
  // where its body is, not where the grid will say it is in 300ms
  const fxT = sx / TILE + cam.x, fyT = sy / TILE + cam.y
  const tc = renderT(performance.now())
  const lp = (a, b) => a + (b - a) * tc
  let best = null
  for (const [id, m] of Object.entries(world.mobs)) {
    if (m.hp <= 0) continue
    const o = prevState?.mobs?.[id]
    const ix = o ? lp(o.x, m.x) : m.x, iy = o ? lp(o.y, m.y) : m.y
    const d = Math.hypot(ix + 0.5 - fxT, iy + 0.5 - fyT)
    if (d < 0.8 && (!best || d < best.d)) best = { d, kind: 'mob', id, m }
  }
  for (const [pid, p] of Object.entries(world.players)) {
    if (pid === myId) continue
    const o = prevState?.players?.[pid]
    const ix = o ? lp(o.x, p.x) : p.x, iy = o ? lp(o.y, p.y) : p.y
    const d = Math.hypot(ix + 0.5 - fxT, iy + 0.5 - fyT)
    if (d < 0.8 && (!best || d < best.d)) best = { d, kind: 'citizen', id: pid, p }
  }
  if (best?.kind === 'mob') {
    const { id, m } = best
    flashClick(m.x, m.y, true)
    if (me.action?.mobId === id) return                        // already fighting it: silent
    if (adj(m)) { send({ do: 'attack', mobId: id }); feed('You attack the ' + m.type + '!') }
    else intent = { kind: 'attack', id }                       // hunt it down, then engage
    return
  }
  if (best?.kind === 'citizen') {
    const { id: pid, p } = best
    if (specArmed && SPEC_OF[me.equipment?.weapon?.item]) {
      specArmed = false
      send({ do: 'special', targetId: pid })
      feed('You strike off the rhythm.')
      return
    }
    flashClick(p.x, p.y, true)
    if (inWildsC(me.x, me.y) && inWildsC(p.x, p.y)) {
      const nm = p.name ?? pid.slice(0, 6)
      chooseAction([
        { label: 'attack ' + nm, act: () => {

          if (q2 && Math.abs(me.x - q2.x) + Math.abs(me.y - q2.y) <= 1) { send({ do: 'attackp', targetId: pid }); feed('You turn on ' + nm + '. The Wilds allow it.') }
          else { intent = { kind: 'pvpattack', id: pid }; feed('You go for ' + nm + '. The Wilds allow it.') }
        } },

    }

      if (n.type === 'well') { feed('You peer into the well. Somewhere far below, a tick echoes.'); return }
      if (n.type === 'signpost') { feed(n.text || 'West: Westhearth. East: Eastmere. North: Anchor.'); return }
      if (n.type === 'wall') { feed('The wall is old, and it is not going anywhere.'); return }
      if (n.type === 'plot') {
        // tilled rows; then the crop, staged purely by elapsed ticks (spec 6o)
        cx.fillStyle = '#4a3520'; cx.fillRect(X + 4, Y + 6, 32, 28)
        cx.fillStyle = '#3a2a18'
        for (let r2 = 0; r2 < 4; r2++) cx.fillRect(X + 5, Y + 9 + r2 * 7, 30, 2.2)
        // §6o: A ROW IS THE CITIZEN'S OWN.
        //
        // This read `n.plantedAt` — the plot's. A crop now belongs to whoever
        // sowed it, so the ground carries nothing and every citizen sees only
        // what THEY put in it. Somebody else's wheat is not your wheat, and
        // the same tilled square is empty to you and ripe to them.
        const _sown = (s.players?.[myId]?.crops ?? {})[id] ?? 0
        if (_sown > 0) {
          const el2 = s.tick - _sown
          const stage = el2 >= 1200 ? 3 : el2 >= 800 ? 2 : el2 >= 400 ? 1 : 0
          for (let c2 = 0; c2 < 4; c2++) {
            const gx = X + 8 + c2 * 8, gy = Y + 10 + (c2 % 2) * 14
            if (stage === 0) { cx.fillStyle = '#7dbb45'; cx.fillRect(gx, gy + 4, 2, 3) }
            else if (stage === 1) {
              cx.strokeStyle = '#5c9e33'; cx.lineWidth = 1.6
              cx.beginPath(); cx.moveTo(gx + 1, gy + 8); cx.lineTo(gx + 1, gy); cx.stroke()
              cx.fillStyle = '#7dbb45'; cx.fillRect(gx - 1.4, gy - 1, 4.8, 2.4)
            } else {
              const sway = Math.sin(now / 900 + gx) * 1.2
              cx.strokeStyle = stage === 3 ? '#a08a2a' : '#5c9e33'; cx.lineWidth = 1.8
              cx.beginPath(); cx.moveTo(gx + 1, gy + 10); cx.lineTo(gx + 1 + sway, gy - 2); cx.stroke()
              cx.fillStyle = stage === 3 ? '#e8c53a' : '#96c95e'
              cx.beginPath(); cx.ellipse(gx + 1 + sway, gy - 3, 2.6, 4.2, 0.2, 0, 7); cx.fill()
            }
          }
          if (stage === 3) { // ripe: a faint golden shimmer calls the sower home
            cx.fillStyle = 'rgba(232,197,58,' + (0.06 + (Math.sin(now / 500) + 1) * 0.04) + ')'
            cx.fillRect(X + 4, Y + 6, 32, 28)
          }
        }
        return
      }
      if (n.type === 'store') {
        shadow(X, Y, 14)
        poly([[X+4,Y+34],[X+36,Y+34],[X+36,Y+16],[X+4,Y+16]], '#5b4a33', '#1c1710')
        poly([[X+2,Y+16],[X+38,Y+16],[X+20,Y+6]], '#8a4a2a', '#2c1a10')
        for (let k = 0; k < 4; k++) { cx.fillStyle = k % 2 ? '#c9a86a' : '#8a4a2a'; cx.fillRect(X + 5 + k * 7.6, Y + 14, 7.6, 4) }
        cx.fillStyle = '#3a2f22'; cx.fillRect(X + 16.5, Y + 24, 7, 10)
        cx.fillStyle = '#ffe08a'; cx.font = 'bold 5px Verdana'; cx.textAlign = 'center'
        cx.fillText('STORE', X + 20, Y + 22)
      }
      if (n.type === 'bank') {
        if (!adj(n)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }; feed('You head to the bank.') }
        else feed('The bank stands ready: tap items to deposit, tap the vault to withdraw.')
        return
      }
      if (n.type === 'campfire' || n.type === 'fire') {
        if (!adj(n)) { intent = { kind: 'gatherfire', id, msg: 'You warm your hands by the fire.' }; return }
        const i = me.inventory.findIndex(s => s && s.item === 'raw-fish')
        if (i !== -1) { intent = { kind: 'cookall' }; feed('You start cooking your catch\u2026') }
        else feed('You have nothing to cook.')
        return
      }
      if (n.type === 'brewpot') {
        if (n.by !== myId) { feed('This brewpot belongs to another brewer.'); return }
        if (!adj(n) && !(me.x === n.x && me.y === n.y)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }; return }
        if (n.readyAt !== undefined && (world?.tick ?? 0) >= n.readyAt) { send({ do: 'collect', nodeId: id }); feed('You draw off the finished ' + (n.brewKind ?? 'brew') + '.'); return }
        if (n.readyAt !== undefined) { feed('Still fermenting \\u2014 come back when it\\u2019s ready.'); return }
        const gi = me.inventory.findIndex(s => s?.item === 'grain'), fi = me.inventory.findIndex(s => s?.item === 'raw-fish')
        const opts = []
        if (gi !== -1) opts.push({ label: 'brew ale (grain)', act: () => { send({ do: 'brew', nodeId: id, slot: gi }); feed('You set grain to ferment. Ale, in time.') } })
        if (fi !== -1) opts.push({ label: 'brew broth (fish)', act: () => { send({ do: 'brew', nodeId: id, slot: fi }); feed('You set fish to steep. Broth, in time.') } })
        opts.push({ label: 'dismantle brewpot', act: () => { send({ do: 'dismantle', nodeId: id }); feed('You take the brewpot apart, recovering some of its makings.') } })
        opts.push({ label: 'never mind', act: () => {} }); chooseAction(opts); return
      }
      if (n.type === 'house') {
        if (!adj(n)) { intent = { kind: 'walk', x: n.x, y: n.y + 1 }; feed('You approach the house.'); return }
        const bc = world?.genesis?.brew
        const owned = Object.values(world.nodes).filter(nn => nn.type === 'brewpot' && nn.by === myId).length
        const logs = me.inventory.filter(s => s?.item === 'logs').length, ore = me.inventory.filter(s => s?.item === 'ore').length
        if (bc && owned < bc.potCap && logs >= bc.buildLogs && ore >= bc.buildOre) {
          chooseAction([
            { label: 'build brewpot (' + bc.buildLogs + ' logs, ' + bc.buildOre + ' ore)', act: () => { send({ do: 'build_brewpot' }); feed('You raise a brewpot by the house. A brewhouse begins.') } },
            { label: 'never mind', act: () => {} },
          ]); return
        }
        feed(bc && owned >= bc.potCap ? 'You already run ' + bc.potCap + ' brewpots.' : 'A brewpot needs ' + (bc?.buildLogs ?? 4) + ' logs and ' + (bc?.buildOre ?? 2) + ' ore, raised beside a house.')
        return
      }
      if (!me.inventory.some(sl => sl === null)) {
        feed('Your pack is full: bank it, drop it, or use it.')
        return
      }
      const msg = { 'tree': 'You swing your axe at the tree.',
                    'rock': 'You take a swing at the rock.',
                    'fishing-spot': 'You cast your line\u2026' }[n.type] ?? 'You begin gathering.'
      flashClick(n.x, n.y, true)
      if (adj(n)) { send({ do: 'gather', nodeId: id }); feed(msg) }
      else intent = { kind: 'gather', id, msg }                // one click does it all
      return
    }

  if (blockedAt(world, x, y)) return
  flashClick(x, y, false)
  intent = { kind: 'walk', x, y }
  if (me.action) send({ do: 'stop' })
})

// ======================= THE GRIM LAYER =======================
// This window is the flat window wearing night. Two interventions, both
// presentation-only: the ground palette passes through grimHex before it is
// baked, and one atmosphere pass draws cinders, low fog, and a low-health
// blood vignette into the frame BEFORE the GL composite, so the shader's
// bloom treats a cinder like any other bright thing in the world.
const _grimCache = new Map()
function grimHex(c) {
  if (typeof c !== 'string' || c[0] !== '#') return c
  let out = _grimCache.get(c)
  if (out) return out
  const n = parseInt(c.slice(1), 16)
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255
  const l = 0.299 * r + 0.587 * g + 0.114 * b
  const de = (v) => v * 0.72 + l * 0.28           // drain a little of the color
  r = de(r) * 0.60; g = de(g) * 0.58; b = de(b) * 0.64 // then most of the light
  out = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'
  _grimCache.set(c, out)
  return out
}
{ const base = tileShade; tileShade = (x, y) => grimHex(base(x, y)) }

const _embers = []
function drawGrimAtmos(now, s) {
  const Wv = cv.width / ZR, Hv = cv.height / ZR
  cx.save()
  // low fog: three broad breaths drifting across the floor of the frame
  for (let i = 0; i < 3; i++) {
    const fx2 = ((now * (0.006 + i * 0.003) + i * 517) % (Wv + 360)) - 180
    const fy2 = Hv * (0.55 + 0.16 * i) + Math.sin(now / 4000 + i * 2.1) * 14
    const fg = cx.createRadialGradient(fx2, fy2, 10, fx2, fy2, 190)
    fg.addColorStop(0, 'rgba(34,24,30,.10)'); fg.addColorStop(1, 'rgba(34,24,30,0)')
    cx.fillStyle = fg; cx.beginPath(); cx.arc(fx2, fy2, 190, 0, 7); cx.fill()
  }
  // cinders rise; the bright ones are >85% white in a channel, so they bloom
  if (_embers.length < 34 && Math.random() < 0.5)
    _embers.push({ x: Math.random() * Wv, v: 8 + Math.random() * 16,
                   w: Math.random() * 6.28, r: 0.7 + Math.random() * 1.3,
                   hot: Math.random() < 0.3, t: now })
  for (let i = _embers.length - 1; i >= 0; i--) {
    const e = _embers[i]
    const age = (now - e.t) / 1000
    const ey = Hv + 6 - e.v * age
    if (ey < -8 || age > 20) { _embers.splice(i, 1); continue }
    const ex = e.x + Math.sin(age * 1.1 + e.w) * 9 + age * 3
    const a = Math.min(0.85, Math.max(0, (Hv - ey) / 60)) * Math.max(0.15, 1 - age / 14)
    cx.globalAlpha = a
    cx.fillStyle = e.hot ? '#ffdf9e' : '#ff8a3c'
    cx.beginPath(); cx.arc(ex, ey, e.r, 0, 7); cx.fill()
  }
  cx.globalAlpha = 1
  // below a third of your blood, the edges of your vision agree with the orb
  const meG = s.players[myId]
  if (meG) {
    const frac = meG.hp / Math.max(1, XP_TO_LVL(meG.skills.hitpoints))
    if (frac < 0.35) {
      const k = (0.35 - frac) / 0.35
      const pulse = 0.55 + 0.45 * Math.sin(now / 300)
      const bg = cx.createRadialGradient(Wv / 2, Hv / 2, Hv * 0.34, Wv / 2, Hv / 2, Hv * 0.88)
      bg.addColorStop(0, 'rgba(120,0,0,0)')
      bg.addColorStop(1, 'rgba(140,8,8,' + (0.38 * k * pulse).toFixed(3) + ')')
      cx.fillStyle = bg; cx.fillRect(0, 0, Wv, Hv)
    }
  }
  cx.restore()
}
