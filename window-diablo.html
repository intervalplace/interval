    poly(g, [[cx - 24, b - 14], [cx, b - 2], [cx + 24, b - 14], [cx + 24, b - 11], [cx, b + 1], [cx - 24, b - 11]], WOOD[2])
    g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(cx - 24 + i * 12, b - 14 + i * 6); g.lineTo(cx + i * 12, b - 2 + i * 6 - 12); g.stroke() }
    g.fillStyle = '#5a4a34'; g.beginPath(); g.ellipse(cx - 5, b - 17, 4, 2.2, 0, 0, 7); g.fill()
    g.fillStyle = '#7a6848'; g.fillRect(cx - 6.5, b - 22, 3, 5)
  },
  bed: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 2, 26, 11, .5)
    isoBox(g, cx, b + 4, 22, 14, 8, OLDWOOD)
    poly(g, [[cx - 22, b - 15], [cx, b - 26], [cx + 14, b - 19], [cx - 8, b - 8]], '#5e4a3c')  // mattress
    poly(g, [[cx - 22, b - 15], [cx - 4, b - 24], [cx + 6, b - 19], [cx - 12, b - 10]], '#7a2a24') // blanket
    g.fillStyle = '#c8bfa8'                                                                    // pillow
    g.beginPath(); g.ellipse(cx + 6, b - 22, 8, 4.4, -.45, 0, 7); g.fill()
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 3                                                // headboard
    g.beginPath(); g.moveTo(cx + 16, b - 15); g.lineTo(cx + 16, b - 34); g.stroke()
    g.beginPath(); g.moveTo(cx + 4, b - 9); g.lineTo(cx + 4, b - 26); g.stroke()
    poly(g, [[cx + 4, b - 26], [cx + 16, b - 34], [cx + 16, b - 30], [cx + 4, b - 22]], OLDWOOD[1])
  },
  shelf: (g, W, H, R, cx, b) => {
    // A DRESSER, NOT A LADDER.
    //
    // This was a fifty-two pixel carcass with three shelves stacked up it, and
    // twenty-three of them stand inside the rooms of this island. At world
    // scale a tall thin frame with evenly spaced rungs does not read as
    // shelving, it reads as a LADDER -- so every dwelling looked like it was
    // being decorated, and the eye went to the furniture instead of the people.
    // Low and wide is both truer to the room and quieter in it.
    groundShadow(g, cx + 4, b + 1, 20, 9, .5)
    isoBox(g, cx, b, 17, 11, 24, OLDWOOD)
    // two shelves, and a lit top the pots stand on
    for (let i = 0; i < 2; i++) {
      const y = b - 9 - i * 11
      poly(g, [[cx - 17, y - 8.5], [cx, y], [cx + 12, y - 6], [cx - 5, y - 14.5]], OLDWOOD[1])
      poly(g, [[cx - 16, y - 9], [cx - 1, y - 1.5], [cx - 1, y + 1.5], [cx - 16, y - 6]],
        'rgba(0,0,0,.42)')
    }
    g.fillStyle = 'rgba(255,240,214,.10)'
    poly(g, [[cx - 17, b - 20.5], [cx, b - 12], [cx + 12, b - 18], [cx - 5, b - 26.5]],
      'rgba(255,240,214,.10)')
    // pots and a folded cloth, small enough to stay furniture
    for (let q = 0; q < 4; q++) {
      const px2 = cx - 12 + q * 6.5, py2 = b - 21 + q * 2.6
      g.fillStyle = q % 2 ? '#5a4a34' : '#43506a'
      g.fillRect(px2, py2 - 5, 3.4, 5)
      g.fillStyle = 'rgba(255,236,196,.14)'; g.fillRect(px2, py2 - 5, 1.2, 5)
    }
    g.fillStyle = '#6a4a3a'
    g.fillRect(cx + 2, b - 15, 7, 3)
  },
  barrel: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 15, 7, .55)
    const h = 30
    poly(g, [[cx - 11, b - 3], [cx - 13, b - h + 6], [cx - 11, b - h], [cx + 11, b - h],
             [cx + 13, b - h + 6], [cx + 11, b - 3]], WOOD[0])
    poly(g, [[cx - 11, b - 3], [cx - 13, b - h + 6], [cx - 11, b - h], [cx - 3, b - h], [cx - 3, b - 3]], WOOD[1])
    g.strokeStyle = '#2a2620'; g.lineWidth = 2.4
    for (const y of [b - 8, b - h + 6]) { g.beginPath(); g.moveTo(cx - 12.6, y); g.lineTo(cx + 12.6, y); g.stroke() }
    g.strokeStyle = WOOD[2]; g.lineWidth = 1
    for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(cx + i * 5, b - 3); g.lineTo(cx + i * 5, b - h); g.stroke() }
    g.fillStyle = WOOD[1]; g.beginPath(); g.ellipse(cx, b - h, 11, 5, 0, 0, 7); g.fill()
    g.fillStyle = WOOD[2]; g.beginPath(); g.ellipse(cx, b - h, 7, 3.2, 0, 0, 7); g.fill()
  },
  crate: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 16, 7, .55)
    isoBox(g, cx, b, 14, 14, 22, WOOD)
    g.strokeStyle = WOOD[2]; g.lineWidth = 1.6
    g.beginPath(); g.moveTo(cx - 14, b - 7 - 22); g.lineTo(cx, b - 22 + 11); g.stroke()
    g.beginPath(); g.moveTo(cx - 14, b - 7); g.lineTo(cx, b - 22); g.stroke()
    g.beginPath(); g.moveTo(cx, b); g.lineTo(cx + 14, b - 7 - 22); g.stroke()
  },
  stump: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 18, 8, .5)
    poly(g, [[cx - 10, b], [cx - 8, b - 15], [cx + 8, b - 15], [cx + 10, b]], WOOD[0])
    poly(g, [[cx - 10, b], [cx - 3, b], [cx - 3, b - 15], [cx - 8, b - 15]], WOOD[1])
    g.fillStyle = '#6b5836'; g.beginPath(); g.ellipse(cx, b - 15, 8.4, 4, 0, 0, 7); g.fill()
    g.strokeStyle = '#4a3c22'; g.lineWidth = 1
    for (let i = 1; i < 4; i++) { g.beginPath(); g.ellipse(cx, b - 15, i * 2.4, i * 1.1, 0, 0, 7); g.stroke() }
    for (let i = 0; i < 4; i++) {                          // roots breaking the outline
      const a = R() * 6.28
      g.strokeStyle = WOOD[2]; g.lineWidth = 2.6
      g.beginPath(); g.moveTo(cx + Math.cos(a) * 7, b - 2)
      g.lineTo(cx + Math.cos(a) * 16, b + Math.sin(a) * 4); g.stroke()
    }
  },
  'crude-hearth': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b, 18, 8, .45)
    g.fillStyle = '#241d18'; g.beginPath(); g.ellipse(cx, b - 2, 13, 6.4, 0, 0, 7); g.fill()
    g.fillStyle = '#4a4038'; g.beginPath(); g.ellipse(cx, b - 3, 8, 3.6, 0, 0, 7); g.fill()
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * 6.28
      g.fillStyle = i % 2 ? ROCK[0] : ROCK[1]
      g.beginPath(); g.ellipse(cx + Math.cos(a) * 14, b - 2 + Math.sin(a) * 7, 4.4, 3.2, a, 0, 7); g.fill()
    }
    g.strokeStyle = '#1a1512'; g.lineWidth = 2.4                       // spent fuel
    g.beginPath(); g.moveTo(cx - 6, b - 4); g.lineTo(cx + 5, b - 1); g.stroke()
  },
  skep: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 15, 7, .5)
    for (let i = 0; i < 6; i++) {                          // coiled straw, narrowing
      const y = b - i * 5, w = 15 - i * 2.2
      g.fillStyle = i % 2 ? STRAW[1] : STRAW[0]
      g.beginPath(); g.ellipse(cx, y, w, w * .45, 0, 0, 7); g.fill()
      g.strokeStyle = STRAW[2]; g.lineWidth = .8
      g.beginPath(); g.ellipse(cx, y, w, w * .45, 0, 0, 7); g.stroke()
    }
    g.fillStyle = '#1a1510'; g.beginPath(); g.ellipse(cx - 2, b - 3, 3.4, 2.2, 0, 0, 7); g.fill()
    for (let i = 0; i < 4; i++) {                          // bees
      g.fillStyle = '#d8b03a'
      g.fillRect(cx + (R() - .5) * 34, b - 12 - R() * 22, 1.6, 1.2)
    }
  },
  hurdle: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 24, 8, .4)
    for (let i = 0; i < 4; i++) {                          // uprights
      const px2 = cx - 24 + i * 16
      g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.6
      g.beginPath(); g.moveTo(px2, b - (px2 - cx) * .5); g.lineTo(px2, b - 24 - (px2 - cx) * .5); g.stroke()
    }
    for (let i = 0; i < 5; i++) {                          // wattle woven through
      const y = b - 4 - i * 4.4
      g.strokeStyle = i % 2 ? OLDWOOD[1] : OLDWOOD[0]; g.lineWidth = 2
      g.beginPath()
      for (let q = 0; q <= 6; q++) {
        const px2 = cx - 26 + q * 9
        const py2 = y - (px2 - cx) * .5 + (q % 2 ? -1.6 : 1.6)
        q === 0 ? g.moveTo(px2, py2) : g.lineTo(px2, py2)
      }
      g.stroke()
    }
  },
  'eel-rack': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 22, 9, .45)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 3
    for (const s2 of [-1, 1]) {
      g.beginPath(); g.moveTo(cx + s2 * 20, b - s2 * 10); g.lineTo(cx + s2 * 6, b - 44); g.stroke()
    }
    g.beginPath(); g.moveTo(cx - 6, b - 44); g.lineTo(cx + 6, b - 44); g.stroke()
    for (let i = 0; i < 6; i++) {                          // the catch, hung to dry
      const px2 = cx - 8 + i * 3.4, ln = 16 + (i % 3) * 6
      g.strokeStyle = '#4a5a52'; g.lineWidth = 2.4
      g.beginPath(); g.moveTo(px2, b - 42)
      g.quadraticCurveTo(px2 + 3, b - 42 + ln * .6, px2 - 1, b - 42 + ln); g.stroke()
      g.fillStyle = '#5e7068'
      g.beginPath(); g.arc(px2, b - 42, 1.8, 0, 7); g.fill()
    }
  },

  // ---- stone -------------------------------------------------------------
  'standing-stone': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 20, 9, .6)
    stoneSlab(g, cx, b, 12, 56, 3)
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.4                // carved marks
    for (let i = 0; i < 4; i++) {
      const y = b - 14 - i * 11
      g.beginPath(); g.moveTo(cx - 5, y); g.lineTo(cx + 4, y - 4); g.stroke()
    }
  },
  cairn: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 20, 9, .55)
    for (let i = 0; i < 6; i++) {
      const w = 14 - i * 1.9, y = b - i * 8
      g.fillStyle = i % 2 ? ROCK[0] : ROCK[1]
      g.beginPath(); g.ellipse(cx + (R() - .5) * 4, y, w, w * .52, 0, 0, 7); g.fill()
      g.fillStyle = 'rgba(255,240,214,.10)'
      g.beginPath(); g.ellipse(cx - 2, y - 2, w * .5, w * .22, 0, 0, 7); g.fill()
    }
  },
  'boundary-stone': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 12, 6, .5)
    stoneSlab(g, cx, b, 7, 20, 0)
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(cx - 3, b - 14, 6, 1.8); g.fillRect(cx - 2, b - 10, 4, 1.8)
  },
  milestone: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 13, 6, .5)
    poly(g, [[cx - 8, b], [cx + 8, b], [cx + 7, b - 22], [cx - 7, b - 22]], ROCK[0])
    poly(g, [[cx - 8, b], [cx - 1, b], [cx - 1, b - 22], [cx - 7, b - 22]], ROCK[1])
    g.fillStyle = ROCK[1]; g.beginPath(); g.ellipse(cx, b - 22, 7.4, 3.4, 0, Math.PI, 0); g.fill()
    g.fillStyle = 'rgba(0,0,0,.5)'
    g.fillRect(cx - 4, b - 17, 8, 1.6); g.fillRect(cx - 3, b - 13, 6, 1.6); g.fillRect(cx - 4, b - 9, 8, 1.6)
  },
  sentinel: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 5, b + 1, 22, 10, .62)
    stoneSlab(g, cx, b, 10, 84, -5)
    g.fillStyle = 'rgba(0,0,0,.55)'                                     // a face, almost
    g.beginPath(); g.ellipse(cx - 5, b - 66, 2.4, 3.4, 0, 0, 7); g.fill()
    g.beginPath(); g.ellipse(cx + 1, b - 68, 2.4, 3.4, 0, 0, 7); g.fill()
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.6
    g.beginPath(); g.moveTo(cx - 6, b - 56); g.lineTo(cx + 3, b - 58); g.stroke()
  },
  'glass-stone': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 16, 8, .5)
    poly(g, [[cx - 10, b], [cx + 10, b], [cx + 6, b - 40], [cx - 4, b - 46], [cx - 9, b - 30]], '#1e3040')
    poly(g, [[cx - 10, b], [cx - 1, b], [cx - 2, b - 38], [cx - 4, b - 46], [cx - 9, b - 30]], '#35576e')
    g.save(); g.globalCompositeOperation = 'lighter'
    g.fillStyle = 'rgba(130,210,235,.28)'
    poly(g, [[cx - 4, b - 46], [cx + 6, b - 40], [cx + 2, b - 20], [cx - 3, b - 24]], 'rgba(130,210,235,.28)')
    g.restore()
    g.fillStyle = 'rgba(220,250,255,.6)'; g.fillRect(cx - 5, b - 40, 2, 16)
  },
  'cut-face': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 26, 10, .55)
    for (let i = 0; i < 4; i++) {                          // a worked quarry step
      const y = b - i * 11, w = 26 - i * 3
      poly(g, [[cx - w, y - w * .5], [cx, y], [cx + w, y - w * .5], [cx, y - w], ], i % 2 ? ROCK[1] : ROCK[0])
      poly(g, [[cx - w, y - w * .5], [cx, y], [cx, y - 11], [cx - w, y - w * .5 - 11]], ROCK[2])
    }
    g.strokeStyle = 'rgba(255,240,214,.14)'; g.lineWidth = 1.4
    g.beginPath(); g.moveTo(cx - 16, b - 41); g.lineTo(cx, b - 33); g.stroke()
  },

  // ---- ruin --------------------------------------------------------------
  'broken-tower': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 6, b + 2, 30, 13, .6)
    const h = 96
    poly(g, [[cx - 20, b - 8], [cx, b + 3], [cx, b - h + 14], [cx - 20, b - h]], ROCK[0])
    poly(g, [[cx, b + 3], [cx + 20, b - 8], [cx + 20, b - h + 26], [cx, b - h + 14]], ROCK[2])
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1
    for (let i = 1; i < 9; i++) {
      const y = b - (h - 10) * i / 9
      g.beginPath(); g.moveTo(cx - 20, y - 8); g.lineTo(cx, y + 2); g.lineTo(cx + 20, y - 8); g.stroke()
    }
    for (let i = 0; i < 6; i++) {                          // the broken crown
      g.fillStyle = '#0b0908'
      g.fillRect(cx - 20 + i * 7, b - h + (i % 2 ? 0 : 9), 8, 12)
    }
    poly(g, [[cx - 7, b - 22], [cx + 1, b - 18], [cx + 1, b - 2], [cx - 7, b - 6]], '#080606')  // doorway
  },
  'sunken-wall': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 9, .45)
    for (let i = 0; i < 4; i++) {
      const px2 = cx - 22 + i * 15, hgt = 8 + (i % 2) * 7 + R() * 5
      isoBox(g, px2, b - (px2 - cx) * .5, 7, 7, hgt, ROCK)
    }
    g.fillStyle = 'rgba(40,50,44,.5)'                       // the ground taking it back
    g.beginPath(); g.ellipse(cx, b + 2, 26, 11, 0, 0, 7); g.fill()
  },
  'drowned-bell': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 2, 24, 11, .5)
    g.fillStyle = 'rgba(20,42,54,.65)'                      // the water it stands in
    g.beginPath(); g.ellipse(cx, b + 3, 30, 13, 0, 0, 7); g.fill()
    // TWO IN THE WORLD. A tower standing in water with its bell still in it --
    // taller, so it reads as a tower rather than a post, and the bell itself
    // catches what light there is, because that is the whole point of it.
    g.save(); g.globalCompositeOperation = 'lighter'
    const bg2 = g.createRadialGradient(cx - 5, b - 40, 0, cx - 5, b - 40, 44)
    bg2.addColorStop(0, 'rgba(196,170,92,.13)'); bg2.addColorStop(1, 'rgba(196,170,92,0)')
    g.fillStyle = bg2; g.beginPath(); g.arc(cx - 5, b - 40, 44, 0, 7); g.fill()
    g.restore()
    poly(g, [[cx - 15, b - 6], [cx, b + 2], [cx, b - 62], [cx - 15, b - 68]], ROCK[0])
    poly(g, [[cx, b + 2], [cx + 15, b - 6], [cx + 15, b - 68], [cx, b - 62]], ROCK[2])
    poly(g, [[cx - 15, b - 68], [cx, b - 62], [cx + 15, b - 68], [cx, b - 74]], ROCK[1])
    poly(g, [[cx - 9, b - 30], [cx - 1, b - 26], [cx - 1, b - 46], [cx - 9, b - 50]], '#080a0c')  // the opening
    g.fillStyle = '#6a5a2a'                                 // and the bell inside it
    g.beginPath(); g.moveTo(cx - 8, b - 34); g.quadraticCurveTo(cx - 5, b - 46, cx - 1, b - 44)
    g.lineTo(cx - 1, b - 32); g.closePath(); g.fill()
    g.fillStyle = '#8f7a3c'; g.fillRect(cx - 8, b - 34, 7, 2)
    for (let i = 0; i < 3; i++) {
      const p2 = (i / 3)
      g.strokeStyle = 'rgba(140,190,210,' + (.2 - p2 * .12) + ')'; g.lineWidth = 1.2
      g.beginPath(); g.ellipse(cx, b + 3, 14 + i * 9, (14 + i * 9) * .42, 0, 0, 7); g.stroke()
    }
  },
  shipwreck: (g, W, H, R, cx, b) => {
    // ONE. Ribs of a hull in the sand, and a hull is big -- this was a handful
    // of curved lines at the scale of a cart. A ship that carried people should
    // be large enough that you walk along it rather than past it.
    groundShadow(g, cx + 8, b + 3, 62, 22, .5)
    g.fillStyle = 'rgba(198,180,140,.10)'                  // sand banked against it
    g.beginPath(); g.ellipse(cx, b + 4, 58, 20, 0, 0, 7); g.fill()
    // the keel, running away from the eye
    g.strokeStyle = '#2a2118'; g.lineWidth = 6; g.lineCap = 'round'
    g.beginPath(); g.moveTo(cx - 46, b + 8); g.quadraticCurveTo(cx, b - 4, cx + 44, b - 12); g.stroke()
    // ribs, tallest amidships, broken shorter toward the stern
    for (let i2 = 0; i2 < 11; i2++) {
      const t2 = i2 / 10
      const x = cx - 46 + t2 * 90, y = b + 8 - t2 * 20
      const tall = Math.sin(t2 * 3.14) * 46 + 10 - R() * 9
      g.strokeStyle = i2 % 2 ? '#3d3527' : '#4a4030'; g.lineWidth = 4.6 - t2 * 1.4
      g.beginPath(); g.moveTo(x, y)
      g.quadraticCurveTo(x - 7 - t2 * 4, y - tall * .7, x - 3 - t2 * 8, y - tall)
      g.stroke()
      g.strokeStyle = 'rgba(214,196,152,.13)'; g.lineWidth = 1.2
      g.beginPath(); g.moveTo(x, y)
      g.quadraticCurveTo(x - 8 - t2 * 4, y - tall * .7, x - 4 - t2 * 8, y - tall)
      g.stroke()
    }
    // a few planks still on the ribs, and the stem post standing
    g.strokeStyle = '#332b1e'; g.lineWidth = 3
    for (const off of [14, 26]) {
      g.beginPath(); g.moveTo(cx - 40, b + 4 - off * .5)
      g.quadraticCurveTo(cx - 6, b - 10 - off, cx + 26, b - 16 - off * .7); g.stroke()
    }
    g.strokeStyle = '#3d3527'; g.lineWidth = 5.5
    g.beginPath(); g.moveTo(cx - 46, b + 8); g.quadraticCurveTo(cx - 54, b - 26, cx - 44, b - 52)
    g.stroke()
    g.strokeStyle = 'rgba(214,196,152,.16)'; g.lineWidth = 1.4
    g.beginPath(); g.moveTo(cx - 46, b + 8); g.quadraticCurveTo(cx - 55, b - 26, cx - 45, b - 52)
    g.stroke()
    // weed on the windward side, and one iron ring gone orange
    g.fillStyle = 'rgba(48,66,48,.5)'
    for (let i2 = 0; i2 < 7; i2++) {
      const t2 = R()
      g.beginPath(); g.ellipse(cx - 40 + t2 * 84, b + 6 - t2 * 18, 6 + R() * 5, 3, 0, 0, 7); g.fill()
    }
    g.strokeStyle = '#6a3a1e'; g.lineWidth = 2
    g.beginPath(); g.arc(cx - 42, b - 46, 4.5, 0, 7); g.stroke()
  },

  'siege-engine': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 5, b + 2, 28, 12, .55)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 4
    for (const s2 of [-1, 1]) {
      g.beginPath(); g.moveTo(cx + s2 * 18, b - s2 * 9); g.lineTo(cx, b - 52); g.stroke()
    }
    g.beginPath(); g.moveTo(cx - 20, b + 6); g.lineTo(cx + 20, b - 14); g.stroke()
    g.strokeStyle = OLDWOOD[0]; g.lineWidth = 5              // the throwing arm, still cocked
    g.beginPath(); g.moveTo(cx + 2, b - 50); g.lineTo(cx - 26, b - 22); g.stroke()
    g.fillStyle = '#4a443b'; g.beginPath(); g.arc(cx - 28, b - 20, 5, 0, 7); g.fill()
    for (const [wx, wy] of [[-16, 4], [14, -10]]) {          // wheels
      g.strokeStyle = OLDWOOD[1]; g.lineWidth = 2.6
      g.beginPath(); g.arc(cx + wx, b + wy, 8, 0, 7); g.stroke()
      g.beginPath(); g.moveTo(cx + wx - 8, b + wy); g.lineTo(cx + wx + 8, b + wy); g.stroke()
    }
  },
  'cave-mouth': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 2, 30, 12, .5)
    poly(g, [[cx - 30, b + 4], [cx + 30, b + 4], [cx + 24, b - 44], [cx - 2, b - 62], [cx - 26, b - 40]], ROCK[0])
    poly(g, [[cx - 30, b + 4], [cx - 4, b + 4], [cx - 2, b - 62], [cx - 26, b - 40]], ROCK[1])
    g.fillStyle = '#050405'
    g.beginPath(); g.moveTo(cx - 15, b + 2)
    g.quadraticCurveTo(cx - 13, b - 36, cx + 1, b - 38)
    g.quadraticCurveTo(cx + 15, b - 34, cx + 15, b + 2); g.closePath(); g.fill()
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.4
    for (let i = 0; i < 5; i++) {
      g.beginPath(); g.moveTo(cx - 26 + i * 5, b - 34 + i * 4); g.lineTo(cx - 20 + i * 6, b - 20 + i * 5); g.stroke()
    }
  },
  mill: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 6, b + 2, 28, 12, .58)
    poly(g, [[cx - 18, b - 8], [cx, b + 2], [cx, b - 62], [cx - 15, b - 70]], '#463a2a')
    poly(g, [[cx, b + 2], [cx + 18, b - 8], [cx + 15, b - 70], [cx, b - 62]], '#2e2519')
    poly(g, [[cx - 15, b - 70], [cx, b - 62], [cx + 15, b - 70], [cx, b - 86]], '#3d2c1c')
    g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 1
    for (let i = 1; i < 6; i++) {
      const y = b - 10 * i
      g.beginPath(); g.moveTo(cx - 17, y - 8); g.lineTo(cx, y); g.lineTo(cx + 17, y - 8); g.stroke()
    }
    const hx2 = cx - 8, hy2 = b - 56                          // the sails
    g.strokeStyle = OLDWOOD[1]; g.lineWidth = 3
    for (let i = 0; i < 4; i++) {
      const a = i * 1.5708 + .4
      g.beginPath(); g.moveTo(hx2, hy2); g.lineTo(hx2 + Math.cos(a) * 30, hy2 + Math.sin(a) * 30); g.stroke()
      g.fillStyle = 'rgba(200,190,160,.20)'
      poly(g, [[hx2 + Math.cos(a) * 9, hy2 + Math.sin(a) * 9],
               [hx2 + Math.cos(a) * 29, hy2 + Math.sin(a) * 29],
               [hx2 + Math.cos(a + .34) * 27, hy2 + Math.sin(a + .34) * 27],
               [hx2 + Math.cos(a + .34) * 8, hy2 + Math.sin(a + .34) * 8]], 'rgba(200,190,160,.20)')
    }
    g.fillStyle = '#241c12'; g.beginPath(); g.arc(hx2, hy2, 3.4, 0, 7); g.fill()
  },

  // ---- bone and dark -----------------------------------------------------
  'bone-pile': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 20, 9, .5)
    for (let i = 0; i < 11; i++) {
      const x = cx + (R() - .5) * 38, y = b - R() * 12
      g.strokeStyle = i % 3 ? BONE[0] : BONE[1]; g.lineWidth = 3.2; g.lineCap = 'round'
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 18, y - R() * 9); g.stroke()
    }
    g.fillStyle = BONE[1]; g.beginPath(); g.arc(cx + 5, b - 11, 6.4, 0, 7); g.fill()
    g.fillStyle = '#14100c'
    g.beginPath(); g.arc(cx + 3, b - 12, 1.8, 0, 7); g.fill()
    g.beginPath(); g.arc(cx + 7.6, b - 12, 1.8, 0, 7); g.fill()
  },
  'skull-pile': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 20, 9, .55)
    const rows = [[-14, 0], [-5, 0], [4, 0], [13, 0], [-9, -9], [0, -9], [9, -9], [-4, -18], [5, -18], [0, -26]]
    for (const [ox, oy] of rows) {
      const x = cx + ox, y = b + oy - 6
      g.fillStyle = BONE[0]; g.beginPath(); g.arc(x, y, 5.4, 0, 7); g.fill()
      g.fillStyle = BONE[1]; g.beginPath(); g.arc(x - 1.2, y - 1.4, 3.6, 0, 7); g.fill()
      g.fillStyle = '#100c0a'
      g.beginPath(); g.arc(x - 2, y - .4, 1.5, 0, 7); g.fill()
      g.beginPath(); g.arc(x + 2, y - .4, 1.5, 0, 7); g.fill()
      g.fillRect(x - 1.6, y + 2.6, 3.2, 2)
    }
  },
  gibbet: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 16, 8, .55)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 4
    g.beginPath(); g.moveTo(cx - 10, b); g.lineTo(cx - 10, b - 70); g.lineTo(cx + 16, b - 70); g.stroke()
    g.strokeStyle = OLDWOOD[0]; g.lineWidth = 2
    g.beginPath(); g.moveTo(cx - 10, b - 58); g.lineTo(cx + 2, b - 70); g.stroke()
    g.strokeStyle = '#4a4438'; g.lineWidth = 1.4              // the cage
    g.beginPath(); g.moveTo(cx + 16, b - 70); g.lineTo(cx + 16, b - 54); g.stroke()
    for (let i = 0; i < 5; i++) {
      const a = (i / 4) * Math.PI - Math.PI / 2
      g.beginPath()
      g.moveTo(cx + 16 + Math.cos(a) * 8, b - 52)
      g.lineTo(cx + 16 + Math.cos(a) * 8, b - 30); g.stroke()
    }
    g.beginPath(); g.ellipse(cx + 16, b - 52, 8, 3.4, 0, 0, 7); g.stroke()
    g.beginPath(); g.ellipse(cx + 16, b - 30, 8, 3.4, 0, 0, 7); g.stroke()
    g.fillStyle = BONE[0]; g.beginPath(); g.arc(cx + 16, b - 44, 5.4, 0, 7); g.fill()
    g.fillStyle = '#100c0a'
    g.beginPath(); g.arc(cx + 14, b - 45, 1.5, 0, 7); g.fill()
    g.beginPath(); g.arc(cx + 18, b - 45, 1.5, 0, 7); g.fill()
  },
  'tally-half': (g, W, H, R, cx, b) => {
    // TWO IN THE WORLD, AND IT IS SMALL. Rarity does not mean big -- a tally
    // stick is a hand-sized thing carrying an enormous story: a debt split in
    // two, so that neither half can be altered without the other disagreeing.
    // What it gets is not scale, it is CARE: the split face pale where it was
    // riven, notches cut rather than drawn, a thong to carry it by, and the
    // grain running the length of the wood.
    groundShadow(g, cx + 3, b + 1, 14, 7, .5)
    // driven into the ground at a slight angle, as a marker is
    const lean = 3
    poly(g, [[cx - 5, b], [cx + 5, b], [cx + 4 + lean, b - 40], [cx - 3 + lean, b - 44]], '#6b5836')
    // the riven face: pale, because that split is fresh compared to the bark
    poly(g, [[cx - 5, b], [cx - 1, b], [cx - 1 + lean, b - 42], [cx - 3 + lean, b - 44]], '#b39a68')
    poly(g, [[cx + 2, b], [cx + 5, b], [cx + 4 + lean, b - 40], [cx + 2 + lean, b - 41]], '#4a3c23')
    // grain, running the length
    g.strokeStyle = 'rgba(60,46,26,.4)'; g.lineWidth = .9
    for (let i2 = 0; i2 < 5; i2++) {
      const t2 = (i2 + .5) / 5
      g.beginPath(); g.moveTo(cx - 5 + t2 * 10, b)
      g.lineTo(cx - 3 + lean + t2 * 7, b - 42); g.stroke()
    }
    // the notches: each one a cut, with a lit lower lip
    for (let i2 = 0; i2 < 9; i2++) {
      const y = b - 6 - i2 * 4.1
      const w2 = i2 % 3 === 2 ? 9 : 6                 // every third is a larger sum
      g.strokeStyle = '#241c10'; g.lineWidth = 1.8
      g.beginPath(); g.moveTo(cx - 4 + lean * (1 - (b - y) / 44), y)
      g.lineTo(cx - 4 + w2 + lean * (1 - (b - y) / 44), y - 1.4); g.stroke()
      g.strokeStyle = 'rgba(226,206,158,.28)'; g.lineWidth = .8
      g.beginPath(); g.moveTo(cx - 4 + lean * (1 - (b - y) / 44), y + 1)
      g.lineTo(cx - 4 + w2 + lean * (1 - (b - y) / 44), y - .4); g.stroke()
    }
    // the split itself, all the way down
    g.strokeStyle = '#1a140e'; g.lineWidth = 1.6
    g.beginPath(); g.moveTo(cx + 1, b); g.lineTo(cx + 1 + lean, b - 42); g.stroke()
    // a leather thong through the head, for the half somebody carried away
    g.strokeStyle = '#3b2a19'; g.lineWidth = 1.6
    g.beginPath(); g.arc(cx + 1 + lean, b - 44, 3.2, .4, 3.6); g.stroke()
    g.fillStyle = '#2a1f12'
    g.beginPath(); g.arc(cx + 1 + lean, b - 44, 1.1, 0, 7); g.fill()
  },

  web: (g, W, H, R, cx, b) => {
    // THIRTY OF THESE, and until now every one drew as a standing stone.
    groundShadow(g, cx + 2, b + 1, 12, 6, .3)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.6
    g.beginPath(); g.moveTo(cx - 24, b + 2); g.lineTo(cx - 22, b - 56); g.stroke()
    g.beginPath(); g.moveTo(cx + 24, b - 10); g.lineTo(cx + 22, b - 64); g.stroke()
    const wx = cx, wy = b - 40
    g.strokeStyle = 'rgba(214,220,224,.42)'; g.lineWidth = 1
    for (let i = 0; i < 9; i++) {                             // radials
      const a = (i / 9) * 6.283
      g.beginPath(); g.moveTo(wx, wy)
      g.lineTo(wx + Math.cos(a) * 25, wy + Math.sin(a) * 22); g.stroke()
    }
    for (let r = 1; r <= 4; r++) {                            // and the spiral between them
      g.beginPath()
      for (let i = 0; i <= 9; i++) {
        const a = (i / 9) * 6.283
        const rr = r * 6
        const px2 = wx + Math.cos(a) * rr, py2 = wy + Math.sin(a) * rr * .88
        i === 0 ? g.moveTo(px2, py2) : g.lineTo(px2, py2)
      }
      g.closePath(); g.stroke()
    }
    g.fillStyle = 'rgba(240,244,248,.30)'
    for (let i = 0; i < 5; i++) {                             // caught, and left
      g.fillRect(wx + (R() - .5) * 36, wy + (R() - .5) * 32, 2.4, 2.4)
    }
  },

  // ---- work and weather --------------------------------------------------
  'log-pile': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 22, 9, .5)
    for (let row = 0; row < 3; row++) {
      for (let i = 0; i < 4 - row; i++) {
        const x = cx - 18 + row * 7 + i * 12, y = b - 4 - row * 9
        g.fillStyle = row % 2 ? WOOD[0] : WOOD[1]
        g.beginPath(); g.ellipse(x, y, 6.4, 5, 0, 0, 7); g.fill()
        g.fillStyle = '#6b5836'; g.beginPath(); g.ellipse(x - 1, y - 1, 4, 3.2, 0, 0, 7); g.fill()
        g.strokeStyle = '#4a3c22'; g.lineWidth = .8
        g.beginPath(); g.ellipse(x - 1, y - 1, 2.2, 1.7, 0, 0, 7); g.stroke()
      }
    }
  },
  'spoil-heap': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 10, .5)
    for (let i = 0; i < 22; i++) {
      const a = R() * 6.283, rr = R() * 24
      g.fillStyle = i % 3 ? '#3f3a33' : '#4e4740'
      g.beginPath()
      g.ellipse(cx + Math.cos(a) * rr, b - 2 + Math.sin(a) * rr * .42 - (1 - rr / 24) * 12,
        3 + R() * 4, 2 + R() * 2.4, R() * 3, 0, 7); g.fill()
    }
    for (let i = 0; i < 5; i++) {                             // ore that was not worth it
      g.fillStyle = '#7a5c2a'
      g.beginPath(); g.arc(cx + (R() - .5) * 30, b - 4 - R() * 10, 1.4, 0, 7); g.fill()
    }
  },
  haystack: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 22, 10, .55)
    for (let i = 0; i < 5; i++) {
      const y = b - i * 11, w = 22 - i * 3.6
      g.fillStyle = i % 2 ? STRAW[0] : STRAW[1]
      g.beginPath(); g.ellipse(cx, y, w, w * .5, 0, 0, 7); g.fill()
    }
    poly(g, [[cx - 8, b - 50], [cx + 8, b - 50], [cx, b - 66]], STRAW[1])
    g.strokeStyle = STRAW[2]; g.lineWidth = 1
    for (let i = 0; i < 26; i++) {
      const a = R() * 6.283, rr = 8 + R() * 15
      g.beginPath()
      g.moveTo(cx + Math.cos(a) * rr, b - R() * 46)
      g.lineTo(cx + Math.cos(a) * rr + (R() - .5) * 5, b - R() * 46 - 4); g.stroke()
    }
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.4
    g.beginPath(); g.moveTo(cx + 20, b + 4); g.lineTo(cx + 12, b - 34); g.stroke()
  },
  'charcoal-clamp': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 10, .5)
    for (let i = 0; i < 4; i++) {
      const y = b - i * 8, w = 24 - i * 5
      g.fillStyle = i % 2 ? '#231e1a' : '#2f2823'
      g.beginPath(); g.ellipse(cx, y, w, w * .48, 0, 0, 7); g.fill()
    }
    g.fillStyle = '#151210'; g.beginPath(); g.ellipse(cx, b - 30, 4.4, 2.2, 0, 0, 7); g.fill()
    g.save(); g.globalCompositeOperation = 'lighter'          // it is still working
    for (let i = 0; i < 4; i++) {
      g.fillStyle = 'rgba(170,160,150,' + (.10 - i * .02) + ')'
      g.beginPath(); g.ellipse(cx + (R() - .5) * 8, b - 36 - i * 9, 5 + i * 3, 3 + i * 2, 0, 0, 7); g.fill()
    }
    g.restore()
  },
  'scorched-ring': (g, W, H, R, cx, b) => {              // flat: a mark, not an object
    g.fillStyle = 'rgba(14,11,10,.72)'
    g.beginPath(); g.ellipse(cx, b, 26, 12, 0, 0, 7); g.fill()
    g.fillStyle = 'rgba(40,32,26,.55)'
    g.beginPath(); g.ellipse(cx, b, 18, 8, 0, 0, 7); g.fill()
    g.strokeStyle = 'rgba(90,70,50,.4)'; g.lineWidth = 1.6
    g.beginPath(); g.ellipse(cx, b, 26, 12, 0, 0, 7); g.stroke()
    for (let i = 0; i < 8; i++) {
      g.fillStyle = '#1a1512'
      g.beginPath(); g.ellipse(cx + (R() - .5) * 40, b + (R() - .5) * 16, 2.4, 1.4, R() * 3, 0, 7); g.fill()
    }
  },
  'burnt-tree': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 20, 9, .5)
    const h = 74
    poly(g, [[cx - 6, b], [cx - 3, b - h], [cx + 2, b - h], [cx + 7, b]], '#1a1614')
    poly(g, [[cx - 6, b], [cx - 2, b], [cx - 2, b - h], [cx - 3, b - h]], '#2e2724')
    g.strokeStyle = '#151110'; g.lineCap = 'round'
    for (let i = 0; i < 7; i++) {
      const a = -0.4 - R() * 2.3, len = 14 + R() * 26
      const by2 = b - h * (0.35 + R() * 0.6)
      g.lineWidth = 3.4 - i * .35
      g.beginPath(); g.moveTo(cx, by2)
      g.quadraticCurveTo(cx + Math.cos(a) * len * .6, by2 + Math.sin(a) * len * .5,
        cx + Math.cos(a - .3) * len, by2 + Math.sin(a - .3) * len); g.stroke()
    }
    g.fillStyle = 'rgba(10,8,8,.5)'
    g.beginPath(); g.ellipse(cx, b + 1, 20, 8, 0, 0, 7); g.fill()
  },
  cart: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 2, 24, 10, .5)
    poly(g, [[cx - 22, b - 13], [cx + 2, b - 1], [cx + 20, b - 10], [cx - 4, b - 22]], WOOD[1])
    poly(g, [[cx - 22, b - 13], [cx + 2, b - 1], [cx + 2, b - 9], [cx - 22, b - 21]], WOOD[0])
    poly(g, [[cx + 2, b - 1], [cx + 20, b - 10], [cx + 20, b - 18], [cx + 2, b - 9]], WOOD[2])
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.6
    g.beginPath(); g.moveTo(cx - 20, b - 20); g.lineTo(cx - 34, b - 30); g.stroke()
    for (const [wx, wy] of [[-12, 2], [8, -8]]) {
      g.strokeStyle = '#2e2519'; g.lineWidth = 2.6
      g.beginPath(); g.arc(cx + wx, b + wy, 9, 0, 7); g.stroke()
      g.lineWidth = 1.4
      for (let i = 0; i < 4; i++) {
        const a = i * .785
        g.beginPath(); g.moveTo(cx + wx - Math.cos(a) * 9, b + wy - Math.sin(a) * 9)
        g.lineTo(cx + wx + Math.cos(a) * 9, b + wy + Math.sin(a) * 9); g.stroke()
      }
    }
  },
  scarecrow: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 14, 7, .5)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 3.4
    g.beginPath(); g.moveTo(cx, b); g.lineTo(cx, b - 62); g.stroke()
    g.beginPath(); g.moveTo(cx - 22, b - 46); g.lineTo(cx + 22, b - 50); g.stroke()
    poly(g, [[cx - 10, b - 48], [cx + 10, b - 50], [cx + 8, b - 22], [cx - 8, b - 20]], '#4a3f2c')
    for (let i = 0; i < 10; i++) {                            // straw out of the cuffs and hem
      g.strokeStyle = STRAW[1]; g.lineWidth = 1
      const x = cx - 8 + R() * 16
      g.beginPath(); g.moveTo(x, b - 21); g.lineTo(x + (R() - .5) * 5, b - 13); g.stroke()
    }
    g.fillStyle = STRAW[0]; g.beginPath(); g.arc(cx, b - 56, 8, 0, 7); g.fill()
    g.fillStyle = STRAW[1]; g.beginPath(); g.arc(cx - 1.6, b - 57.6, 5.4, 0, 7); g.fill()
    g.fillStyle = '#1a1510'
    g.beginPath(); g.arc(cx - 2.6, b - 58, 1.4, 0, 7); g.fill()
    g.beginPath(); g.arc(cx + 2, b - 57.6, 1.4, 0, 7); g.fill()
    poly(g, [[cx - 11, b - 61], [cx + 11, b - 61], [cx + 6, b - 70], [cx - 6, b - 70]], '#3d3323')
  },
  barricade: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 9, .5)
    for (const s2 of [-1, 1]) {                               // crossed stakes, points out
      g.strokeStyle = OLDWOOD[0]; g.lineWidth = 4
      g.beginPath(); g.moveTo(cx + s2 * 24, b + s2 * 6); g.lineTo(cx - s2 * 16, b - 40); g.stroke()
      poly(g, [[cx - s2 * 16, b - 40], [cx - s2 * 13, b - 34], [cx - s2 * 20, b - 36]], '#8f8272')
    }
    g.strokeStyle = OLDWOOD[1]; g.lineWidth = 3
    g.beginPath(); g.moveTo(cx - 22, b - 8); g.lineTo(cx + 22, b - 20); g.stroke()
    g.beginPath(); g.moveTo(cx - 20, b - 20); g.lineTo(cx + 20, b - 32); g.stroke()
    g.strokeStyle = '#2a2620'; g.lineWidth = 1.6              // lashings
    g.beginPath(); g.arc(cx, b - 22, 4, 0, 7); g.stroke()
  },

  // ---- the two that are older than the towns -----------------------------
  'old-oak': (g, W, H, R, cx, b) => {
    // TWO OF THESE EXIST. An oak that was old before the towns were, and it
    // should look like the towns grew up around it: a bole you could not get
    // your arms around, roots that have lifted the ground, and a crown wide
    // enough to stand a village under.
    groundShadow(g, cx + 10, b + 3, 64, 26, .62)
    const h = 118
    // roots, first, so the trunk sits into them
    for (let i2 = 0; i2 < 9; i2++) {
      const a = (i2 / 9) * 6.283 + .3, len = 16 + R() * 16
      g.strokeStyle = '#241d14'; g.lineWidth = 7 - (i2 % 3)
      g.lineCap = 'round'
      g.beginPath(); g.moveTo(cx + Math.cos(a) * 6, b - 4)
      g.quadraticCurveTo(cx + Math.cos(a) * len * .7, b + 2,
                         cx + Math.cos(a) * len, b + 3 + Math.abs(Math.sin(a)) * 5)
      g.stroke()
    }
    // the bole: fat at the foot, and not straight
    poly(g, [[cx - 26, b + 3], [cx - 13, b - h * .62], [cx - 9, b - h],
             [cx + 10, b - h], [cx + 15, b - h * .6], [cx + 26, b + 3]], '#2c241a')
    poly(g, [[cx - 26, b + 3], [cx - 10, b + 3], [cx - 6, b - h * .62],
             [cx - 13, b - h * .62]], '#4d3d2b')
    poly(g, [[cx + 12, b + 3], [cx + 26, b + 3], [cx + 15, b - h * .6],
             [cx + 8, b - h * .6]], '#1c1610')
    // bark: long vertical ridges, which is what says OAK at any size
    for (let i2 = 0; i2 < 16; i2++) {
      const t2 = R()
      g.strokeStyle = i2 % 3 ? 'rgba(12,9,5,.55)' : 'rgba(150,126,86,.13)'
      g.lineWidth = 1.4 + R()
      g.beginPath(); g.moveTo(cx - 22 + t2 * 46, b)
      g.quadraticCurveTo(cx - 16 + t2 * 34, b - h * .5, cx - 9 + t2 * 20, b - h + 8)
      g.stroke()
    }
    // a hollow, low down, where a branch came off long ago
    g.fillStyle = '#0d0a06'
    g.beginPath(); g.ellipse(cx - 9, b - 34, 6, 9, .2, 0, 7); g.fill()
    g.strokeStyle = 'rgba(150,126,86,.2)'; g.lineWidth = 1.4
    g.beginPath(); g.ellipse(cx - 9, b - 34, 7, 10, .2, 0, 7); g.stroke()
    // limbs
    for (let i2 = 0; i2 < 7; i2++) {
      const a = -0.5 - (i2 / 7) * 2.2, len = 34 + R() * 26
      g.strokeStyle = '#2c241a'; g.lineWidth = 8 - i2 * .7
      g.beginPath(); g.moveTo(cx, b - h + 12)
      g.quadraticCurveTo(cx + Math.cos(a) * len * .6, b - h - 8,
                         cx + Math.cos(a) * len, b - h - 18 - Math.abs(Math.sin(a)) * 16)
      g.stroke()
    }
    // and the crown: many overlapping masses, lit from the upper left
    const leaf = ['#20301a', '#2b4022', '#37502b', '#44612f']
    for (let i2 = 0; i2 < 26; i2++) {
      const a = R() * 6.283, r = R() * 52
      const x = cx + Math.cos(a) * r, y = b - h - 22 + Math.sin(a) * r * .52
      const lit = (x - cx) < -6 && (y - (b - h - 22)) < 4
      g.fillStyle = leaf[lit ? 3 : (i2 % 3)]

    }
    g.fillStyle = 'rgba(0,0,0,.24)'
    for (let i2 = 0; i2 < 8; i2++) {
      const a = R() * 3.14, r = 18 + R() * 30
      g.beginPath(); g.arc(cx + Math.cos(a) * r + 12, b - h - 12 + Math.sin(a) * r * .4,
        11 + R() * 8, 0, 7); g.fill()

  'elder-tree': (g, W, H, R, cx, b) => {
    // THERE IS ONE OF THESE. One, in the whole world, and a citizen may go a
    // year without finding it. So it is the one thing on this island that is
    // allowed to be uncanny: pale bark that takes the light from further off
    // than anything else, a cold cast to the air around it, nothing growing
    // underneath, and motes going up that are not embers.
    const h = 152
    // the ground beneath is bare and pale, in a ring
    g.fillStyle = 'rgba(176,186,180,.10)'
    g.beginPath(); g.ellipse(cx, b + 2, 46, 19, 0, 0, 7); g.fill()
    groundShadow(g, cx + 6, b + 2, 30, 13, .4)

    poly(g, [[cx + 7, b + 2], [cx + 16, b + 2], [cx + 10, b - h * .55],

                         cx + Math.cos(a) * len, b - h - 34 - Math.abs(Math.sin(a)) * 20)

      g.beginPath(); g.moveTo(cx, b - h + 16)
      g.quadraticCurveTo(cx + Math.cos(a) * len * .5, b - h - 15,
                         cx + Math.cos(a) * len, b - h - 35 - Math.abs(Math.sin(a)) * 20)

    for (let i2 = 0; i2 < 30; i2++) {
      const a = R() * 6.283, r = R() * 46
      const x = cx + Math.cos(a) * r, y = b - h - 26 + Math.sin(a) * r * .5
      g.fillStyle = ['rgba(140,164,150,.30)', 'rgba(176,196,180,.24)',
                     'rgba(112,138,132,.30)'][i2 % 3]

    }

    g.save(); g.globalCompositeOperation = 'lighter'

      const x = cx + (R() - .5) * 60, y = b - 10 - R() * (h + 30)
      g.fillStyle = 'rgba(206,232,224,' + (.18 + R() * .3).toFixed(2) + ')'

}

// Anything the constitution adds after this file was written still gets a
// shape rather than a blank: a nameless cairn, which is what an unrecorded
// place looks like on any real chart.
function lmFallback(g, W, H, R, cx, b) {
  groundShadow(g, cx + 3, b + 1, 16, 7, .5)
  for (let i = 0; i < 4; i++) {
    const w = 12 - i * 2.2, y = b - i * 7
    g.fillStyle = i % 2 ? ROCK[0] : ROCK[1]
    g.beginPath(); g.ellipse(cx + (R() - .5) * 3, y, w, w * .52, 0, 0, 7); g.fill()

}
// ===========================================================================
// THE RENDERER
// ---------------------------------------------------------------------------
// Three passes and a composite:
//
//   1. GROUND.  Every visible tile, walked in diagonal order (by x+y), so that
//      a raised crag draws its rock face before the tile in front of it covers
//      the bottom of that face. Iterating rows would be wrong: two tiles in
//      the same row are at different depths once the camera turns.
//   2. STANDING.  Everything with a footprint is collected, sorted by depth,
//      and drawn bottom-up. This is the pass that makes the window read as a
//      place rather than a chart: a citizen walks BEHIND the oak and in FRONT
//      of the wall, and neither of those facts is available to a flat window.
//   3. LIGHT.  The whole frame is covered in night and then the night is
//      PUNCHED OUT wherever something burns. Ambient comes from the world's
//      own day cycle (a pure function of the tick, so every window agrees what
//      time it is); the lantern is the window's, and never goes out.
//
//   4. AIR.  Additive glow, cinders, and the vignette, over the top.
// ===========================================================================

const cv = document.getElementById('cv')
const cx = cv.getContext('2d')
let VW = 0, VH = 0, DPR = 1
const sceneCv = mkc(8, 8), sceneG = sceneCv.getContext('2d')
const lightCv = mkc(8, 8), lightG = lightCv.getContext('2d')

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1)
  VW = window.innerWidth; VH = window.innerHeight
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR)
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px'
  cx.setTransform(DPR, 0, 0, DPR, 0, 0)
  for (const c of [sceneCv, lightCv]) { c.width = cv.width; c.height = cv.height }
  sceneG.setTransform(DPR, 0, 0, DPR, 0, 0)
  lightG.setTransform(DPR, 0, 0, DPR, 0, 0)
  if (typeof sizeSurfaces === 'function') sizeSurfaces()
}
window.addEventListener('resize', resize)

// ---- the camera -----------------------------------------------------------
// Anchored on the citizen and eased, because a camera that snaps tile to tile
// turns walking into a slide show. `camX/camY` are fractional world coords.
let camX = 0, camY = 0, camReady = false
let shake = 0, flashRed = 0, flashGold = 0
const CAM_LIFT = 26                          // stand the horizon up a little

function screenOf(wx, wy) {
  return { x: VW / 2 + isoX(wx, wy) - isoX(camX, camY),
           y: VH / 2 - CAM_LIFT + isoY(wx, wy) - isoY(camX, camY) }
}
function worldOf(px2, py2) {
  // THE INVERSE OF screenOf, AND IT HAD A HALF-TILE IN IT.
  //
  // The `+ HW` shifted the answer by (+0.5, -0.5) before unIso floored it,
  // which resolves to the WRONG TILE for every tile on the island -- measured,
  // 396 of 396. A click landed one square behind where you aimed; you set off
  // for it, and if the button was held even a moment the camera carried the
  // target away from you as you walked. That is the walking in circles. It also
  // quietly broke the tile-exactness rule meant to stop tall trees stealing
  // each other's clicks, because that rule was comparing against the wrong tile.
  return unIso(px2 - VW / 2 + isoX(camX, camY),
               py2 - VH / 2 + CAM_LIFT + isoY(camX, camY))
}

// ---- interpolation --------------------------------------------------------
// A tick is 600ms and a step is a whole tile, so without this everyone
// teleports twice a second. Positions are eased from where a thing was in the
// previous state toward where it is in this one.
let prevPos = new Map(), curPos = new Map()
const facing = new Map()                     // last direction each body moved
let prevHp = new Map()
// THE ARM IS IN THE STATE. engine.js writes `p.lastSwing = s.tick` on the tick
// a blow actually lands, and WEAPONS.every says how long the arm then takes to
// come back. So a swing is a discrete event with a known moment, and animating
// it as a continuous 90ms wobble -- which is what this did -- was not a fast
// swing, it was a blur that never started or stopped. Beasts keep the same
// field, so they get the same treatment.
let prevSwing = new Map()
const swingAt = new Map()   // id -> when its last blow landed, in wall time
function notePositions(s) {
  prevPos = curPos; curPos = new Map()
  for (const [id, p] of Object.entries(s.players ?? {})) curPos.set('p' + id, [p.x, p.y])
  for (const [id, m] of Object.entries(s.mobs ?? {})) curPos.set('m' + id, [m.x, m.y])
  for (const [k, now] of curPos) {
    const was = prevPos.get(k)
    if (was && (was[0] !== now[0] || was[1] !== now[1])) facing.set(k, [now[0] - was[0], now[1] - was[1]])
  }
  // WHO GOT HIT, AND FOR HOW MUCH.
  //
  // The state carries current hp and nothing else -- no combat log, no event
  // stream -- so a blow is only ever visible as a difference between two
  // ticks. Diffing them here is what buys the flash, the number and the blood,
  // and it costs one pass over the mobs the camera can already see.
  // who just swung
  const nowMs = performance.now()
  for (const [id, e] of [...Object.entries(s.players ?? {}).map(([k, v]) => ['p' + k, v]),
                         ...Object.entries(s.mobs ?? {}).map(([k, v]) => ['m' + k, v])]) {
    const ls = e.lastSwing
    if (ls === undefined) continue
    if (ls > (prevSwing.get(id) ?? -1)) swingAt.set(id, nowMs)
    prevSwing.set(id, ls)
  }
  const hpNow = new Map()
  const mine = myId && s.players?.[myId]
  const myTarget = mine?.action?.type === 'attack' ? mine.action.mobId : null
  for (const [id, m] of Object.entries(s.mobs ?? {})) {
    hpNow.set('m' + id, m.hp)
    const was = prevHp.get('m' + id)
    if (was === undefined || m.hp >= was) continue
    const d = was - m.hp
    hitFlash.set('m' + id, performance.now())
    const byMe = myTarget === id
    popNumber(m.x, m.y, String(d), byMe ? '#f6ecd6' : '#b8ae9a', d >= 4)
    bleedAt(m.x, m.y, d)
    if (byMe) SFX.hit()
    const p = screenOf(m.x, m.y)
    for (let i = 0; i < 5 + d * 2; i++)
      mote(p.x + (Math.random() - .5) * 14, p.y - 22,
        (Math.random() - .5) * 3.4, -1.4 - Math.random() * 2.4,
        .55 + Math.random() * .45, 'rgba(168,22,14,%a)', 2 + Math.random() * 2)
    if (m.hp <= 0) { bleedAt(m.x, m.y, 10); shake = Math.max(shake, 3); if (byMe) SFX.slain() }
  }
  for (const [id, p] of Object.entries(s.players ?? {})) {
    hpNow.set('p' + id, p.hp)
    const was = prevHp.get('p' + id)
    if (was === undefined || p.hp >= was || id === myId) continue
    hitFlash.set('p' + id, performance.now())
    popNumber(p.x, p.y, String(was - p.hp), '#d43a24', false)
    bleedAt(p.x, p.y, was - p.hp)
  }
  prevHp = hpNow
}
function lerpPos(key, x, y, k) {
  const was = prevPos.get(key)
  if (!was) return [x, y]
  if (Math.abs(was[0] - x) > 2 || Math.abs(was[1] - y) > 2) return [x, y]   // a recall, not a step
  return [was[0] + (x - was[0]) * k, was[1] + (y - was[1]) * k]
}
// how far through the current tick we are, for drawing AND for hit-testing:
// what you see is what you click
function renderT(now) {
  if (tickOffset !== null && curState) {
    const rt = (now - tickOffset) / 600 - 1.0
    // a little past 1 rather than a hard stop: when a state is late the body
    // keeps easing toward where it is going instead of standing still and
    // then jumping, which is the difference between a slow step and a hitch
    return Math.min(1.28, Math.max(0, rt - (curState.tick - 1)))
  }
  return Math.min(1.2, (now - stateAt) / statePeriod)
}

// ---- there is no day here -------------------------------------------------
// The constitution's clock is untouched and still authoritative: DAY is 2400
// ticks, the flat window will show you a sunrise, and every node in the world
// agrees what hour it is. This window keeps one climate on purpose. A crawl
// lit by a lantern that goes bright at noon has spent half its day arguing
// with itself.
const DAY = 2400

// ---------------------------------------------------------------------------
// GROUND PASS
// ---------------------------------------------------------------------------
let waterTiles = []
let bridgeQueue = []
let doorQueue = []
let _mottle = null
function mottle() {
  if (_mottle) return _mottle
  const c = mkc(256, 256), g = c.getContext('2d')
  const R = rng(90210)
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256)
  for (let i = 0; i < 240; i++) {
    const x = R() * 256, y = R() * 256, r = 14 + R() * 60
    const gr = g.createRadialGradient(x, y, 0, x, y, r)
    const v = R() > .5 ? 255 : 0
    gr.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',' + (.05 + R() * .07) + ')')
    gr.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)')
    g.fillStyle = gr
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill()
    // wrap, so the tile has no seam of its own
    for (const [ox, oy] of [[-256, 0], [256, 0], [0, -256], [0, 256]]) {
      g.beginPath(); g.arc(x + ox, y + oy, r, 0, 7)
      const g2 = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r)
      g2.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',' + (.05 + R() * .07) + ')')
      g2.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)')
      g.fillStyle = g2; g.fill()
    }
  }
  return (_mottle = c)
}
function drawGround(g, s, t) {
  // which tiles can the screen see? invert the four corners and take the box
  const c0 = worldOf(-TW, -TH), c1 = worldOf(VW + TW, -TH)
  const c2 = worldOf(-TW, VH + TH + 90), c3 = worldOf(VW + TW, VH + TH + 90)
  const W = world?.genesis?.worldW ?? dims().W, H = world?.genesis?.worldH ?? dims().H
  const x0 = Math.max(0, Math.min(c0.x, c1.x, c2.x, c3.x) - 1)
  const x1 = Math.min(W - 1, Math.max(c0.x, c1.x, c2.x, c3.x) + 1)
  const y0 = Math.max(0, Math.min(c0.y, c1.y, c2.y, c3.y) - 1)
  const y1 = Math.min(H - 1, Math.max(c0.y, c1.y, c2.y, c3.y) + 1)
  waterTiles.length = 0
  bridgeQueue.length = 0
  doorQueue.length = 0
  if (x1 < x0 || y1 < y0) return
  const oxB = VW / 2 - isoX(camX, camY) - HW
  const oyB = VH / 2 - CAM_LIFT - isoY(camX, camY) - HH
  // diagonal order: this is the whole trick, and it is one loop
  for (let d = x0 + y0; d <= x1 + y1; d++) {
    const xa = Math.max(x0, d - y1), xb = Math.min(x1, d - y0)
    for (let x = xa; x <= xb; x++) {
      const y = d - x
      const kind = terrainOf(x, y)
      const G = groundOf(kind)
      const v = tileHash(x, y, 91) & 3
      const ox = oxB + isoX(x, y), oy = oyB + isoY(x, y) - G.lift
      // A DOORWAY IS A GAP WITH WALL ON BOTH SIDES.
      //
      // Every building in this world is a ring of wall with a hole in it, and
      // a hole is not a door -- it is a room with a piece missing. The world
      // has already said where the door goes; the window simply never drew
      // one. Nothing here is state: no node, no open-or-shut. The moment a
      // door is state it can be SHUT, and then somebody has to decide who may
      // shut it, and that is a rule this world does not need.
      if (doorwayAt(x, y)) doorQueue.push(x, y, ox, oy)
      if (kind === 'bridge') {
        // A BRIDGE IS NOT A FLOOR, so it cannot be drawn as one. Its piles and
        // its shadow hang BELOW its own diamond, over the tile in front -- and
        // that tile comes later in the diagonal walk and would paint straight
        // over them. So bridges are held back and laid down after all the
        // ground is finished, still in depth order among themselves.
        bridgeQueue.push(x, y, ox, oy)
        continue
      }
      g.fillStyle = groundColorAt(x, y)
      diamond(g, ox, oy, -1.2)            // a shade oversized, so there is no seam
      g.fill()
      g.drawImage(tileArt(kind, v), ox, oy)
      if (G.grain === 'water') waterTiles.push(ox, oy, x, y)
    }
  }
  // the doors, in the gaps the walls left
  for (let i = 0; i < doorQueue.length; i += 4) {
    drawDoorway(g, doorQueue[i], doorQueue[i + 1], doorQueue[i + 2], doorQueue[i + 3], t)
  }

  // and now the bridges, over the water they cross
  for (let i = 0; i < bridgeQueue.length; i += 4) {
    const bx = bridgeQueue[i], by = bridgeQueue[i + 1]
    // A BRIDGE IS ONLY A BRIDGE WHERE THERE IS WATER UNDER IT.
    //
    // A span carries two tiles of abutment onto each bank so that the deck
    // meets the road -- and those tiles are DRY. They were being drawn as a
    // deck standing thirteen pixels up on piles, so every crossing had a
    // trestle bridge marooned on grass at each end, complete with posts going
    // down into soil. That is the thing that made no sense.
    //
    // The terrain says `bridge` for the whole span, so the window cannot tell
    // the two apart from that alone -- but it carries the same geography the
    // generator does, and can simply ask whether the tile is wet underneath.
    const wet = isWater4(bx, by)
    const ox = bridgeQueue[i + 2], oy = bridgeQueue[i + 3]
    if (!wet) {
      const spD = bridgeSpan(bx, by)
      if (spD.len >= GREAT_SPAN) {
        // a great bridge lands on masonry, not on packed earth and boards
        greatBridge(g, ox, oy, spD, bridgeMask(bx, by), bridgeRise(bx, by), false)
      } else {
        g.drawImage(abutmentArt(bridgeMask(bx, by), tileHash(bx, by, 77) & 1), ox, oy - BRIDGE_TOP)
      }
      continue
    }
    // the arch, and what holds it up
    const rise = bridgeRise(bx, by)
    const sp = bridgeSpan(bx, by)
    g.fillStyle = 'rgba(0,0,0,.40)'                 // its shadow, on the water
    diamond(g, ox, oy + BRIDGE_LIFT + 4, -2); g.fill()
    // A LONG CROSSING IS A DIFFERENT KIND OF THING. Past eleven tiles the
    // timber trestle stops being a bridge and starts being a plank bridge
    // repeated -- so the great crossings are built in stone instead.
    if (sp.len >= GREAT_SPAN) {
      greatBridge(g, ox, oy, sp, bridgeMask(bx, by), rise, true)
    } else {
      drawTrestle(g, ox, oy - rise, BRIDGE_LIFT + rise + 10, true)
      g.drawImage(bridgeArt(bridgeMask(bx, by), tileHash(bx, by, 77) & 1),
        ox, oy - BRIDGE_TOP - rise)
    }
  }

  // MOTTLE. Ground varies at scales larger than a tile as well as smaller, and
  // without something at the larger scale a blended field just looks airbrushed.
  // Anchored to the world, so it sits still while the camera moves over it.
  if (hiq()) {
    const M = mottle()
    const mx = -((isoX(camX, camY) - VW / 2) % 256 + 256) % 256
    const my = -((isoY(camX, camY) - VH / 2 + CAM_LIFT) % 256 + 256) % 256
    g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .5
    for (let ty = my - 256; ty < VH + 256; ty += 256)
      for (let tx = mx - 256; tx < VW + 256; tx += 256) g.drawImage(M, tx, ty)
    g.restore()
  }

  // WATER IS NOT A COLOUR, IT IS A SURFACE WITH THINGS HAPPENING ON IT.
  //
  // One drifting highlight over a flat blue tile is a swimming pool. Three
  // things fix it and none of them cost much: SWELL running across the whole
  // body at a scale far larger than a tile, so it reads as one sheet of water
  // rather than a grid of them; a bright RIM where it meets land, because a
  // shoreline is the brightest line in any real body of water; and GLINTS,
  // small and sparse and brief, which is what the eye actually reads as wet.
  if (waterTiles.length) {
    const tt = t / 1000
    g.save(); g.globalCompositeOperation = 'lighter'
    for (let i = 0; i < waterTiles.length; i += 4) {
      const ox = waterTiles[i], oy = waterTiles[i + 1]
      const wx = waterTiles[i + 2], wy = waterTiles[i + 3]
      // SLOWLY. At .55 radians per tile the wave changed sign between
      // neighbours and painted a diamond lattice of its own -- the very thing
      // it was added to hide. A swell is tens of tiles long.
      const sw = Math.sin((wx + wy) * .085 - tt * .55) * .5
              + Math.sin((wx - wy) * .052 + tt * .37) * .5
      if (sw > .05) {
        g.fillStyle = 'rgba(150,196,214,' + ((sw - .05) * .10).toFixed(3) + ')'
        diamond(g, ox, oy, -1.2); g.fill()
      }
      const ph = (tileHash(wx, wy, 19) % 100) / 100
      const gl = Math.sin(tt * .9 + ph * 6.283)
      if (gl > .93) {
        g.fillStyle = 'rgba(226,244,255,' + ((gl - .93) * 4.5).toFixed(2) + ')'
        g.fillRect(ox + 22 + ((tileHash(wx, wy, 23) % 20) - 10), oy + 14, 5, 1.6)
      }
    }
    g.restore()
    // the shoreline, where the sheet ends
    const wet = (a, b) => { const k2 = terrainOf(a, b); return k2 === 'sea' || k2 === 'river' }
    g.save(); g.strokeStyle = 'rgba(200,230,240,.22)'; g.lineWidth = 1.4
    g.beginPath()
    for (let i = 0; i < waterTiles.length; i += 4) {
      const ox = waterTiles[i], oy = waterTiles[i + 1]
      const wx = waterTiles[i + 2], wy = waterTiles[i + 3]
      if (!wet(wx, wy - 1)) { g.moveTo(ox, oy + HH); g.lineTo(ox + HW, oy) }
      if (!wet(wx + 1, wy)) { g.moveTo(ox + HW, oy); g.lineTo(ox + TW, oy + HH) }
      if (!wet(wx, wy + 1)) { g.moveTo(ox + TW, oy + HH); g.lineTo(ox + HW, oy + TH) }
      if (!wet(wx - 1, wy)) { g.moveTo(ox + HW, oy + TH); g.lineTo(ox, oy + HH) }
    }
    g.stroke(); g.restore()
  }

        poly(gg, [[c2 - 11, b], [c2 + 11, b], [c2 + 9, b - 18], [c2 - 9, b - 18]], '#3a352e')
        poly(gg, [[c2 - 11, b], [c2 - 1, b], [c2 - 1, b - 18], [c2 - 9, b - 18]], '#4c4740')
      }), sx - 24, sy - 42 + 12)
    }
  }
}

// ---- the places that are only places --------------------------------------
// Forty nouns, forty painters, in 48-landmarks.js. The dispatch is this:
function drawLandmark(g, n, sx, sy, t, hs) {
  const kind = n.kind ?? 'standing-stone'
  const paint = LM_ART[kind] ?? lmFallback
  const h2 = lmHeight(kind)
  g.drawImage(sprite('lm:' + kind + (hs & 3), 150, h2, (gg, W2, H2, R) =>
    paint(gg, W2, H2, R, W2 / 2, H2 - 26)), sx - 75, sy - h2 + 26)
}

// ---- a dropped thing lying on the ground ----------------------------------
function drawGroundItem(g, gi, sx, sy, t) {
  const bob = Math.sin(t / 500 + gi.x + gi.y) * 1.6
  g.save(); g.globalCompositeOperation = 'lighter'
  const gr = g.createRadialGradient(sx, sy, 0, sx, sy, 22)
  gr.addColorStop(0, 'rgba(230,196,120,.20)'); gr.addColorStop(1, 'rgba(230,196,120,0)')
  g.fillStyle = gr; g.beginPath(); g.ellipse(sx, sy, 22, 11, 0, 0, 7); g.fill()
  g.restore()
  const ic = itemIcon(gi.item)
  g.drawImage(ic, sx - 17, sy - 24 + bob, 34, 34)
}

// ---------------------------------------------------------------------------
// THE CITIZEN
// ---------------------------------------------------------------------------
// WHO IS AWAKE. The engine's own test, byte for byte: an action running, or a
// word from them inside five hundred intervals. Five minutes.
//
// This window had no notion of it at all. A citizen who went to bed stood in
// the road exactly as if they were about to swing, so half of what looked like
// a busy town was people who had gone to make tea in March.
const SLEEP_AFTER = 500
const isAwake = (q, tick) => q.action !== null || tick - (q.lastInput ?? 0) <= SLEEP_AFTER

function drawPlayer(g, id, p, sx, sy, t, isMe, sc) {
  const L = lookOf(p, id)
  // FACE WHAT YOU ARE DOING.
  //
  // Facing was set by MOVEMENT and by nothing else, so a citizen who walked
  // past a tree and turned to chop it kept facing the way they had been
  // walking -- swinging at the air with their back to the work, and in a
  // fight, with their back to the beast. The engine has always known what the
  // citizen is doing and to what; the window simply never asked.
  //
  // An action outranks the last step taken, for as long as it lasts.
  const act9 = p.action
  let f = facing.get('p' + id) ?? [1, 0]
  if (act9) {
    let tgt = null
    if (act9.type === 'gather' && act9.nodeId) tgt = curState?.nodes?.[act9.nodeId]
    else if (act9.type === 'harvest' && act9.nodeId) tgt = curState?.nodes?.[act9.nodeId]
    else if (act9.type === 'attack' && act9.mobId) tgt = curState?.mobs?.[act9.mobId]
    else if (act9.type === 'attackp' && act9.targetId) tgt = curState?.players?.[act9.targetId]
    if (tgt) {
      const dx9 = tgt.x - p.x, dy9 = tgt.y - p.y
      // written BACK, not just used: when the work ends a citizen should still
      // be facing what they were doing, not snap round to whichever way they
      // happened to be walking when they arrived
      if (dx9 || dy9) { f = [Math.sign(dx9), Math.sign(dy9)]; facing.set('p' + id, f) }
    }
  }
  const away = (f[0] + f[1]) < 0                       // walking up-screen: back turned
  const moving = prevPos.get('p' + id) && (prevPos.get('p' + id)[0] !== p.x || prevPos.get('p' + id)[1] !== p.y)
  const act = p.action?.type
  const swinging = act === 'attack' || act === 'attackp' || act === 'gather'
  // WHAT IS IN THE HAND. A citizen mining with a sword out looked like a citizen
  // punching a rock. Interval needs no tool to gather -- that is the
  // constitution's choice, not the window's -- so this shows the best tool the
  // citizen is actually carrying, and a crude one if they carry none, because
  // the swing has to be legible as mining rather than as fighting.
  const held = p.equipment?.weapon?.item ?? null
  let wep = held
  if (act === 'gather') {
    const n2 = curState?.nodes?.[p.action?.nodeId]
    const carries = (it) => held === it || (p.inventory ?? []).some(sl => sl?.item === it)
    if (n2?.type === 'tree') wep = carries('iron-hatchet') ? 'iron-hatchet' : 'axe'
    else if (n2?.type === 'rock' || n2?.type === 'magic-rock') wep = carries('iron-pickaxe') ? 'iron-pickaxe' : 'pick'
    else if (n2?.type === 'fishing-spot') wep = 'rod'
  }
  // A SPECIAL IS A DIFFERENT MOVE, not a louder one. The ordinary swing is a
  // sine; these three are not, and the arm is the only place a citizen can
  // read which of them they just spent their next cycle on.
  const sp = specialAnim.get(id)
  const spK = sp ? (performance.now() - sp.at) / sp.dur : 2
  // (held/wep are computed just above; the swing depends on which it is)
  // One arc: wind up, strike, recover, rest. `SWING_MS` is deliberately a hair
  // under one tick so the arm is visibly still between blows -- the pause is
  // what makes a slow weapon read as slow.
  const SWING_MS = 420
  const ranged = RANGED_ITEMS.has(held ?? '')
  let bowDraw = 0, chainLash = 0, pickBite = 0
  const swAt = swingAt.get('p' + id)
  const swK = swAt ? (performance.now() - swAt) / SWING_MS : 2
  const arc = (k) => k < .30 ? -0.45 - (k / .30) * 0.95          // back
             : k < .56 ? -1.40 + ((k - .30) / .26) * 2.15        // through
             : 0.75 - ((k - .56) / .44) * 1.20                   // and down to rest
  let swingVal
  if (spK <= 1) {
    if (sp.kind === 'twice') {
      // two strikes inside one tick: down, back, down again, faster each time
      const a1 = clamp(spK / .38, 0, 1), a2 = clamp((spK - .42) / .38, 0, 1)
      swingVal = -0.4 + Math.sin(a1 * Math.PI) * 1.35 + Math.sin(a2 * Math.PI) * 1.35
    } else if (sp.kind === 'now') {
      // a maul: three quarters of the animation is the wind-up
      swingVal = spK < .62 ? -0.4 - (spK / .62) * 1.5
               : -1.9 + ((spK - .62) / .38) * 3.6
    } else {
      // the shot that cannot miss: draw, hold, loose
      swingVal = spK < .55 ? -0.4 - (spK / .55) * .5 : -0.9 + ((spK - .55) / .45) * 1.1
    }
  } else if (ranged && swK <= 1) {
    // AN ARCHER DOES NOT SWING. The bow arm stays level and steady; what moves
    // is the string. Reusing the melee arc for a bow made a citizen appear to
    // be beating a goblin to death with it.
    swingVal = -0.62 + Math.sin(swK * Math.PI) * .10
    bowDraw = swK < .62 ? swK / .62 : 0          // drawn, then loosed
  } else if (swK <= 1) {
    if (held === 'old-chain') {
      swingVal = swK < .34 ? -1.5 + (swK / .34) * 2.4 : 0.9 - Math.pow((swK - .34) / .66, .7) * 2.4
      chainLash = lashAt(swK)
    } else swingVal = arc(swK)
  }
  else if (act === 'attack' || act === 'attackp') {
    // NO lastSwing, STILL A SWING. That field only appears on a player once
    // they have landed a blow, so a citizen's first fight -- and every fight
    // for anyone whose node predates it -- animated as a statue. The weapon's
    // own cadence plus the tick is enough to keep time until the real stamp
    // arrives, and once it does the branch above takes over and is exact.
    const every = WEAPON_EVERY[held] ?? 2
    const ph = (((curState?.tick ?? 0) % every) + renderT(performance.now())) / every
    if (ranged) { swingVal = -0.62 + Math.sin(clamp(ph, 0, 1) * Math.PI) * .10
                  bowDraw = ph < .62 ? ph / .62 : 0 }
    else if (held === 'old-chain') {
      // A FLICK, NOT AN ARC. Every other weapon winds up, comes through and
      // recovers, in that order and at that pace. This one strikes on every
      // interval, so there is no time to wind up anything: the arm snaps out
      // and is back before the tick is over. Front-loaded, and short.
      const k = clamp(ph, 0, 1)
      swingVal = k < .34 ? -1.5 + (k / .34) * 2.4 : 0.9 - Math.pow((k - .34) / .66, .7) * 2.4
      chainLash = lashAt(k)
    }
    else swingVal = arc(clamp(ph * 1.35, 0, 1))
  }
  else if (act === 'gather') {
    // gathering has no lastSwing, so the tick itself is the rhythm: one stroke
    // per interval, which is exactly what the world is doing anyway. Except
    // fishing, which is not a stroke at all -- the rod goes out once and then
    // the citizen waits, which is the whole character of the trade.
    const gn = curState?.nodes?.[p.action?.nodeId]
    const ph = clamp(renderT(performance.now()), 0, 1)
    if (gn?.type === 'fishing-spot') {
      swingVal = ph < .30 ? -1.05 + (ph / .30) * .78 : -0.27 + Math.sin((ph - .30) * 7) * .05
    } else if (/pick/.test(wep ?? '')) {
      // MINING IS A DRIVE, NOT A SWING.
      //
      // An axe is swung: it travels through an arc and its speed at the moment
      // of contact is the point. A pick is LIFTED and then DRIVEN -- straight
      // down, using its own weight, into one spot -- and it stops dead when it
      // bites rather than following through. Using the felling arc for both
      // made a citizen appear to be chopping at a boulder.
      //
      // So: a slow lift high over the shoulder, a fast drop, and then a pause
      // with the head buried while they work it loose.
      const k = clamp(ph / .8, 0, 1)
      swingVal = k < .46 ? -0.5 - (k / .46) * 1.25        // up, and slowly
        : k < .62 ? -1.75 + ((k - .46) / .16) * 2.35      // driven down, fast
        : 0.60 - ((k - .62) / .38) * 1.10                 // and worked loose
      pickBite = k >= .62 && k < .86 ? 1 : 0
    } else swingVal = arc(clamp(ph / .8, 0, 1))
  }
  else if (moving) swingVal = -0.45 + Math.sin(t * 6.5) * .22
  else swingVal = -0.5
  // and a one-tick deed overrides all of it, for as long as it takes to do
  let crouch = 0, pitch = 0
  // how much of the strike is happening, 0 at rest and 1 at the blow
  // RAISING A STALL IS WORK, and the body should say so for the whole twenty
  // intervals. Without 'raise' here a citizen building one stood perfectly
  // still, which is indistinguishable from being asleep -- and a bystander
  // could not tell that interrupting them would cost them anything.
  const working = (act === 'gather' || act === 'attack' || act === 'attackp'
                   || act === 'raise' || swK <= 1)
  // a builder's rhythm is slower than an axe's: lifting and setting, not
  // swinging. Driven by the tick rather than the swing clock, since raising
  // has no blow to land.
  const raiseE = act === 'raise'
    ? (Math.sin((curState?.tick ?? 0) * 0.7 + t * 1.2) + 1) / 2 : 0
  const effort = act === 'raise' ? raiseE
    : working ? clamp((swingVal + 1.5) / 2.4, 0, 1) : 0
  const workLean = working ? Math.sin(effort * Math.PI) * .55 + effort * .25 : 0
  const workDip = working ? Math.sin(effort * Math.PI) * .30 : 0
  // A CAST IS MADE WITH THE WHOLE BODY.
  //
  // The cast moved the arm through a third of a turn and nothing else moved at
  // all, which reads as a wave whatever the arm does. A citizen unmaking
  // something leans BACK as it lifts, is still while it burns, and comes
  // forward over it as the coin falls -- three beats, matching the three the
  // mark itself is drawn in.
  // ASLEEP: they sit down where they are, and the lantern burns low.
  //
  // A tent would be gear nobody carries and a chair would want a room; sitting
  // is true anywhere, which matters in a world where people fall asleep in the
  // Wilds as readily as in an inn. The tell is the LANTERN -- in this window a
  // citizen is their light, so a low one says more than a letter over the head.
  const sleeping = !isMe && curState && !isAwake(p, curState.tick) && p.hp > 0
  const dozeDip = sleeping ? 1.15 : 0
  const dozeLean = sleeping ? .18 : 0
  const castE = (myDeed?.pose === 'cast' && isMe) ? clamp((performance.now() - myDeed.at) / myDeed.dur, 0, 1) : 0
  const castLean = castE === 0 ? 0
    : castE < .34 ? -(castE / .34) * .40
    : castE < .62 ? -.40 + Math.sin((castE - .34) * 18) * .04
    : -.40 + ((castE - .62) / .38) * .78
  const castDip = castE === 0 ? 0 : Math.sin(clamp((castE - .55) / .45, 0, 1) * Math.PI) * .34
  // a pick is driven with the back and the knees, not the arm: while the head
  // is buried the citizen is bent over it
  const biteDip = pickBite ? .55 : 0
  if (isMe && myDeed) {
    const dk = (performance.now() - myDeed.at) / myDeed.dur
    if (dk >= 1) myDeed = null
    else {
      const e = Math.sin(dk * Math.PI)          // in and back out
      switch (myDeed.pose) {
        case 'kneel':   crouch = e; pitch = e * .7; swingVal = -0.5 + e * 1.35; break
        case 'lean':    pitch = e; swingVal = -0.5 + e * .8; break
        case 'strike':  swingVal = dk < .45 ? -0.5 - (dk / .45) * .95
                                 : -1.45 + ((dk - .45) / .55) * 2.5; pitch = e * .4; break
        case 'whittle': crouch = e * .35; swingVal = -0.6 + Math.sin(dk * 18) * .35; break
        case 'drink':   swingVal = -1.25 - e * .45; break
        case 'cast':
          // UP, HELD, AND DOWN -- AND THE WHOLE BODY GOES WITH IT.
          //
          // An arm on its own still reads as a wave however far it travels.
          // A person unmaking something leans back as it lifts, holds, and
          // comes forward over it as it falls; the lean and the dip below do
          // that, and they are what makes it look like effort rather than
          // gesture.
          swingVal = e < .34 ? -0.5 - (e / .34) * 1.35
            : e < .62 ? -1.85 + Math.sin((e - .34) * 22) * .07
            : -1.85 + ((e - .62) / .38) * 1.35
          break
        case 'offer':   swingVal = -0.5 + e * .95; pitch = e * .3; break
        case 'raise':   swingVal = -1.55 - e * .5; crouch = -e * .35; break
      }
    }
  }
  const body = p.equipment?.body?.item, head = p.equipment?.head?.item
  const star = body?.startsWith('star-')
  humanoid(g, sx, sy, {
    // WHOEVER THIS CITIZEN SAYS THEY ARE. `look` is a seed in the state, so
    // every window agrees who is standing there; absent one, their key stands
    // in, exactly as it always did.
    scale: sc ?? 1, bulk: L.bulkish, seed: L.seed,
    skin: L.skin, hair: L.hair, hairStyle: L.hairStyle, beard: L.beard,
    coat: L.coat,
    cape: capeOf(p),
    // THE WHOLE BODY SWINGS.
    //
    // Only the arm moved. A citizen felling a tree stood perfectly upright and
    // still while one limb went round like a metronome -- which reads as a
    // doll with a hinge, because a real blow starts at the feet. So the swing
    // drives the trunk too: the shoulders turn into it, the body dips as the
    // blow lands and comes back up on the recovery, and the weight shifts
    // forward. Small numbers -- two or three pixels -- but it is the
    // difference between a body working and an arm attached to a post.
    crouch: crouch + workDip + biteDip + castDip + dozeDip,
    pitch: pitch + workLean + biteDip * .4 + castLean + dozeLean,
    cloak: isMe ? '#6e1f19' : '#2a2a38',
    coat: isMe ? '#4a1512' : '#242430',
    plate: body === 'gold-plate' ? ['#e8b93a', '#7a5a10']
         : star ? ['#9db4cc', '#4a5a70'] : body ? ['#8a6a34', '#3f2f14'] : ['#4a4034', '#251f18'],
    tunic: body ? (star ? '#7d90a8' : '#6a5230') : '#3a3226',
    tunicLit: 'rgba(255,240,214,.12)',
    boots: '#241d16', hair: away ? '#241a10' : '#2e2418',
    helm: head ? (head === 'gold-helm' ? '#e8b93a' : head.startsWith('star-') ? '#9db4cc' : '#8a6a34') : null,
    // 6ce: the off hand and the legs
    shield: SHIELD_PAINT[p.equipment?.offhand?.item] ?? null,
    greaves: p.equipment?.legs?.item === 'gold-legs' ? '#e8b93a' : null,
    hood: null, skin: away ? '#6e5238' : '#8d6a4a',
    step: moving ? t * 6.5 + id.charCodeAt(0) : 0,
    swing: swingVal,
    // THE ARC OF THE BLOW. A thin dark blade on a 40-pixel body against a black
    // floor is nearly invisible no matter how correctly it is drawn -- which is
    // why the swing still read as nothing. What reads is the TRAIL: a bright
    // sweep left behind the hand, and it works identically whether the citizen
    // is holding a star-sword or nothing at all.
    trail: (!ranged && wep !== 'rod' &&
            (swK <= 1 || act === 'attack' || act === 'attackp' || act === 'gather'))
      ? { at: swingVal, kind: act === 'gather' ? 'work' : 'strike' } : null,
    fist: !wep,
    // the chain wants its lash phase where a bow wants its draw
    weapon: wep ? (gg, hx, hy, a, sc) =>
      drawWeapon(gg, hx, hy, a, sc, wep,
        wep === 'rod' ? t : wep === 'old-chain' ? chainLash : bowDraw) : null,
    lantern: true, lanternLow: sleeping,
    // a sleeper breathes slower, and deeper
    breath: (sleeping ? t * .55 : t * 1.6) + (id.charCodeAt(1) || 0),
    breathDeep: sleeping ? 1.9 : 1,
  })
  if (isMe) {                                          // the lantern's own halo, so you never lose yourself
    g.save(); g.globalCompositeOperation = 'lighter'
    const gr = g.createRadialGradient(sx, sy - 4, 0, sx, sy - 4, 30)
    gr.addColorStop(0, 'rgba(255,196,110,.13)'); gr.addColorStop(1, 'rgba(255,196,110,0)')
    g.fillStyle = gr; g.beginPath(); g.ellipse(sx, sy - 4, 30, 15, 0, 0, 7); g.fill(); g.restore()
  }
}

// ---- names, and the things people say -------------------------------------
// WHO THAT IS, IN FULL. A bare name says least about a citizen at exactly the
// moment you most want to know: whether the person walking toward you in the
// Wilds has spent four hundred levels on it. All three are in the state and
// derived by the constitution's own functions.
const titleCase = (s2) => String(s2 ?? '').replace(/\b[a-z]/g, (c) => c.toUpperCase())
// A PLATE HAS TO FIT, AND IT HAS TO NOT SIT ON ANOTHER ONE.
//
// Adding the calling and the standing made these three times wider, and two
// citizens standing near each other now overlap constantly -- the screenshot
// showed `...ester (27)` with `1)` printed through it, both half off the edge.
// So: measure first, clamp into the viewport, and if the box would land on one
// already placed, drop the trailing detail and try again as a bare name. A
// name that survives is worth more than a full title that cannot be read.
function citizenPlate(g, sx, sy, p, id, isMe, placed) {
  const name = p.name || (id ? id.slice(0, 6) : 'unnamed')
  // and a sleeper's plate is dimmed and says so, because from across a street
  // the pose alone is not enough to tell a sitting citizen from a resting one
  // A SLEEPER'S PLATE SWAPS THE CALLING, rather than appending a field.
  //
  // "Rosamund, Banker (412) . asleep" reads as a spreadsheet -- three columns
  // and a separator. What somebody is doing right now IS the second thing you
  // want after their name, and just now they are not banking. So the word
  // takes the calling's place and the shape never changes.
  const dozing = curState && !isAwake(p, curState.tick) && p.hp > 0
  const rest = ', ' + (dozing ? 'asleep' : titleCase(callingOf(p)))
    + ' (' + standingOf(p) + ')'
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  const measure = (full) => {
    g.font = '700 11px Cinzel, Georgia, serif'
    const wn = g.measureText(name).width
    if (!full) return { wn, wr: 0, w: wn }
    g.font = '10px Georgia, serif'
    const wr = g.measureText(rest).width
    return { wn, wr, w: wn + wr }
  }
  const hits = (box) => (placed ?? []).some(b =>
    box.x < b.x + b.w && box.x + box.w > b.x && box.y < b.y + b.h && box.y + box.h > b.y)
  let full = true
  let m = measure(true)
  let x0 = clamp(sx - m.w / 2, 8, Math.max(8, VW - m.w - 8))
  let box = { x: x0 - 6, y: sy - 11, w: m.w + 12, h: 15 }
  if (hits(box)) {
    full = false
    m = measure(false)
    x0 = clamp(sx - m.w / 2, 8, Math.max(8, VW - m.w - 8))
    box = { x: x0 - 6, y: sy - 11, w: m.w + 12, h: 15 }
    if (hits(box)) { g.textAlign = 'center'; return null }   // three deep: say nothing
  }
  g.fillStyle = 'rgba(4,3,5,.74)'
  g.fillRect(box.x, box.y, box.w, box.h)
  g.font = '700 11px Cinzel, Georgia, serif'
  // THE BRAND, WHICH THIS WINDOW HAS NEVER SHOWN.
  //
  // Strike an unprovoked citizen in the Wilds and the engine brands you for
  // fifteen minutes. The constitution is plain about what that is for: "the
  // record simply makes the deed legible, and the rest of the world decides
  // what it means. Reputation, not punishment, enforced by daylight."
  //
  // This window read `brandedUntil` nowhere at all, so the daylight never
  // came. A rule whose whole mechanism is other people seeing it does not
  // work when the window keeps it dark -- it is not a soft penalty then, it
  // is no penalty, and worse, an honest citizen cannot tell who to avoid.
  const branded = (p.brandedUntil ?? 0) > (curState?.tick ?? 0)
  g.fillStyle = branded ? '#e0533a' : isMe ? '#f0d9a4' : '#9fb0c4'
  g.fillText(name, x0, sy)
  if (full) {
    g.font = '10px Georgia, serif'
    g.fillStyle = 'rgba(180,166,140,.85)'
    g.fillText(rest, x0 + m.wn, sy)
  }
  g.textAlign = 'center'
  return box
}
function nameplate(g, sx, sy, text, col, small) {
  g.font = (small ? '600 10px ' : '700 11px ') + 'Cinzel, Georgia, serif'
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'
  const w = g.measureText(text).width
  g.fillStyle = 'rgba(4,3,5,.72)'
  g.fillRect(sx - w / 2 - 5, sy - 11, w + 10, 14)
  g.fillStyle = col
  g.fillText(text, sx, sy)
}
function speechBubble(g, sx, sy, text) {
  g.font = '12px Georgia, serif'; g.textAlign = 'center'
  const w = Math.min(210, g.measureText(text).width)
  g.fillStyle = 'rgba(6,5,7,.88)'
  g.fillRect(sx - w / 2 - 8, sy - 17, w + 16, 21)
  g.strokeStyle = 'rgba(176,145,63,.45)'; g.lineWidth = 1
  g.strokeRect(sx - w / 2 - 8, sy - 17, w + 16, 21)
  g.fillStyle = '#e8d199'
  g.fillText(text, sx, sy - 3, 210)
}
// ===========================================================================
// THE COMPOSITE
// ---------------------------------------------------------------------------
// Where the passes meet, and where this window stops being a dark reskin and
// starts being a grade.
//
// The direction is the third game's, not the second's, and the difference is
// not "more orange". It is this: WARM LIGHT, COOL SHADOW. Everything the fire
// touches goes amber and blooms past its own edges; everything it does not
// falls toward blue-black rather than neutral. That single opposition is why
// those frames read as painted rather than rasterised, and it is worth more
// than any amount of texture detail.
//
// THERE IS NO NIGHT HERE. Interval's clock still turns -- the tick is the
// tick, the world agrees with itself, and the flat window will still show you
// a sunrise. This window simply declines to look. A window may choose its
// colours and its camera; it may not choose what is TRUE, and what time it is
