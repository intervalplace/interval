      g.beginPath(); g.ellipse(B.x, by2 + 20, r, r * .45, 0, 0, 7); g.stroke()
      for (let q = 0; q < 6; q++) {
        const a = (q / 6) * 6.283 + k * 2
        g.fillStyle = 'rgba(190,255,255,' + (.8 * (1 - k)) + ')'
        g.fillRect(B.x + Math.cos(a) * r - 1.5, by2 + 20 + Math.sin(a) * r * .45 - 1.5, 3, 3)
      }
    }
    g.restore()
  }
  g.globalCompositeOperation = 'source-over'
}

function bleedAt(wx, wy, amount) {
  if (decals.length > (hiq() ? 90 : 30)) decals.shift()
  decals.push({ x: wx, y: wy, at: performance.now(), r: 9 + amount * 3, seed: (Math.random() * 100000) | 0 })
}
// A number leaving a body is the loudest tell of this generation and the
// cheapest good feedback in the file: how much, from what, right now.
function popNumber(wx, wy, text, col, big) {
  if (dmgNums.length > 40) dmgNums.shift()
  dmgNums.push({ x: wx, y: wy, text, col, big: !!big, at: performance.now(),
                 vx: (Math.random() - .5) * 26 })
}

// White-hot on impact, drawn through a scratch surface so the flash follows
// the silhouette instead of being a blob laid over it.
function flashed(g, id, sx, sy, paint) {
  const at = hitFlash.get(id)
  const k = at ? clamp(1 - (performance.now() - at) / 180, 0, 1) : 0
  if (k <= 0.02) { paint(g, sx, sy, 1); return }
  fxG.setTransform(DPR, 0, 0, DPR, 0, 0)
  fxG.clearRect(0, 0, 240, 240)
  paint(fxG, 120, 180, 1 + k * 0.07)          // and a scale punch with it
  fxG.globalCompositeOperation = 'source-atop'
  fxG.fillStyle = 'rgba(255,244,228,' + (k * .9) + ')'
  fxG.fillRect(0, 0, 240, 240)
  fxG.globalCompositeOperation = 'source-over'
  g.drawImage(fxCv, 0, 0, fxCv.width, fxCv.height, sx - 120, sy - 180, 240, 240)
}

const hexA = (hex, a) => {
  const h = String(hex).replace('#', '')
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16)
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'
}

function drawScene(now) {
  const s = curState
  const g = sceneG
  g.setTransform(DPR, 0, 0, DPR, 0, 0)
  g.clearRect(0, 0, VW, VH)
  g.fillStyle = '#05060a'
  g.fillRect(0, 0, VW, VH)
  if (!s) return
  if (bloomCv.width !== Math.max(1, Math.ceil(cv.width / BLOOM_DIV))) sizeSurfaces()

  const t = renderT(now)

  drawGround(g, s, now)

  // ---- what has been spilled here ----------------------------------------
  for (let i = decals.length - 1; i >= 0; i--) {
    const d = decals[i]
    const age = (now - d.at) / 40000
    if (age > 1) { decals.splice(i, 1); continue }
    const p = screenOf(d.x, d.y)
    if (p.x < -60 || p.x > VW + 60 || p.y < -60 || p.y > VH + 60) continue
    const R = rng(d.seed)
    g.globalAlpha = (1 - age) * .55
    for (let k = 0; k < 6; k++) {
      g.fillStyle = k % 2 ? '#3a0906' : '#57100b'
      g.beginPath()
      g.ellipse(p.x + (R() - .5) * d.r * 2, p.y + (R() - .5) * d.r,
        2 + R() * d.r * .5, 1 + R() * d.r * .28, R() * 3, 0, 7)
      g.fill()
    }
    g.globalAlpha = 1
  }

  // ---- the standing world -------------------------------------------------
  const list = []
  collectStanding(s, t, list)
  const lights = []
  const beams = []
  for (const it of list) {
    const p = screenOf(it.x, it.y)
    const lift = liftAt(Math.round(it.x), Math.round(it.y))
    const sx = p.x, sy = p.y - lift
    const isHot = hover && hover.kind === it.kind && hover.id === it.id
    if (isHot) { g.save(); g.shadowColor = 'rgba(255,222,150,.9)'; g.shadowBlur = 18 }
    if (it.kind === 'node') {
      drawNode(g, it.e, sx, sy, now, isHot)
      const n = it.e
      if (n.type === 'watchfire' && (n.fuelUntil ?? 0) > s.tick) lights.push([sx, sy - 14, 330, 1.05, 1])
      else if (n.type === 'campfire') lights.push([sx, sy - 10, 172, .95, 1])
      else if (n.type === 'fire' && n.expiresAt > s.tick) lights.push([sx, sy - 10, 140, .9, 1])
      else if (n.type === 'magic-rock' && (n.depletedUntil ?? 0) <= s.tick) lights.push([sx, sy - 16, 82, .5, 0])
      else if (n.type === 'waystone') lights.push([sx, sy - 44, 92, .48, 0])
      else if (BUILDING_KINDS[n.type]) lights.push([sx - 14, sy - 34, 104, .5, 1])
      else if (n.type === 'bank' || n.type === 'store') lights.push([sx, sy - 20, 66, .38, 1])
    } else if (it.kind === 'ground') {
      drawGroundItem(g, it.e, sx, sy, now)
      beams.push([sx, sy, rarityOf(it.e.item)])
    } else if (it.kind === 'mob') {
      const m = it.e
      const mad = m.mad === myId
      const wasHere = prevPos.get('m' + it.id)
      const moving = wasHere && (wasHere[0] !== m.x || wasHere[1] !== m.y)
      const mSw = swingAt.get('m' + it.id)
      const mSwing = mSw ? (now - mSw) < 420 : false
      flashed(g, 'm' + it.id, sx, sy, (gg, ax, ay, sc) =>
        drawBeast(gg, ax, ay, m.type, now / 1000, { mad, moving, swinging: mSwing, scale: sc }))
      const st = MOB_STATS[m.type]
      if (st && m.hp < st.maxHp) {
        const w = 32
        g.fillStyle = 'rgba(3,4,8,.82)'; g.fillRect(sx - w / 2 - 1, sy - 52, w + 2, 6)
        const hg = g.createLinearGradient(sx - w / 2, 0, sx + w / 2, 0)
        hg.addColorStop(0, '#7a1410'); hg.addColorStop(1, '#d43a24')
        g.fillStyle = hg; g.fillRect(sx - w / 2, sy - 51, w * clamp(m.hp / st.maxHp, 0, 1), 4)
      }
      if (mad) poly(g, [[sx, sy - 60], [sx - 5, sy - 68], [sx + 5, sy - 68]], 'rgba(212,58,36,.9)')
    } else if (it.kind === 'player') {
      flashed(g, 'p' + it.id, sx, sy, (gg, ax, ay, sc) =>
        drawPlayer(gg, it.id, it.e, ax, ay, now / 1000, it.id === myId, sc))
      if (it.e.equipment?.head?.item === 'star-helm' || it.e.equipment?.body?.item === 'star-plate')
        lights.push([sx, sy - 24, 62, .34, 0])
      if (it.id === myId) lights.push([sx, sy - 22, LANTERN_R, 1, 1, true])
    }
    if (isHot) g.restore()
  }

  // ---- loot beams ---------------------------------------------------------
  // A pillar of light standing over anything on the floor. It is not subtle
  // and it is not meant to be: the whole argument of this generation is that
  // you should never have to hunt the ground for what you just earned.
  g.save(); g.globalCompositeOperation = 'lighter'
  for (const [bx, by, col] of beams) {
    const puls = .72 + Math.sin(now / 420 + bx) * .2
    const bg = g.createLinearGradient(0, by - 108, 0, by + 4)
    bg.addColorStop(0, hexA(col, 0))
    bg.addColorStop(.45, hexA(col, .16 * puls))
    bg.addColorStop(1, hexA(col, .34 * puls))
    g.fillStyle = bg
    g.beginPath()
    g.moveTo(bx - 5, by - 108); g.lineTo(bx + 5, by - 108)
    g.lineTo(bx + 15, by + 2); g.lineTo(bx - 15, by + 2)
    g.closePath(); g.fill()
    const rg = g.createRadialGradient(bx, by, 0, bx, by, 26)
    rg.addColorStop(0, hexA(col, .34 * puls)); rg.addColorStop(1, hexA(col, 0))
    g.fillStyle = rg
    g.save(); g.translate(bx, by); g.scale(1, .42); g.translate(-bx, -by)
    g.beginPath(); g.arc(bx, by, 26, 0, 7); g.fill(); g.restore()
  }
  g.restore()

  drawFx(g, now)

  // ---- names over heads ---------------------------------------------------
  // Placed nearest-first, so when two collide the one further away is the one
  // that loses its title -- you can always read the citizen beside you.
  const plates = []
  for (let i2 = list.length - 1; i2 >= 0; i2--) {
    const it = list[i2]
    if (it.kind !== 'player') continue
    const p = screenOf(it.x, it.y), lift = liftAt(Math.round(it.x), Math.round(it.y))
    const b = bubbles[it.id]
    if (b && now - b.at < 6000) { speechBubble(g, p.x, p.y - lift - 62, b.text); continue }
    const box = citizenPlate(g, p.x, p.y - lift - 52, it.e, it.id, it.id === myId, plates)
    if (box) plates.push(box)
  }

  if (altHeld) {
    for (const it of list) {
      if (it.kind !== 'ground') continue
      const p = screenOf(it.x, it.y)
      nameplate(g, p.x, p.y - liftAt(it.x, it.y) - 34, wordy(it.e.item), rarityOf(it.e.item), true)
    }
  } else if (hover && hover.kind === 'ground') {
    const p = screenOf(hover.e.x, hover.e.y)
    nameplate(g, p.x, p.y - liftAt(hover.e.x, hover.e.y) - 34, wordy(hover.e.item), rarityOf(hover.e.item), true)
  }

  // ---- blood, sparks, cinders --------------------------------------------
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i]
    m.t += 1 / 60
    if (m.t > m.life) { motes.splice(i, 1); continue }
    m.x += m.vx; m.y += m.vy; m.vy += .22
    g.fillStyle = m.col.replace('%a', String(clamp(1 - m.t / m.life, 0, 1).toFixed(2)))
    g.fillRect(m.x, m.y, m.size, m.size)
  }

  // =========================================================================
  // WHAT YOU JUST ORDERED
  // =========================================================================
  // Every click drew the same gold diamond, so clicking a tree and misclicking
  // the grass beside it looked identical -- and since the citizen walks either
  // way, there was no way to know you had missed until you arrived and nothing
  // happened. Two marks fix it: a ONE-SHOT flourish at the moment of the click
  // that names the verb, and a RETICLE that stays on the target for as long as
  // the order stands, following it if it moves.
  const VERB_TINT = {
    attack: '#e0452a', attackp: '#e0452a',
    gather: '#e8a23a', harvest: '#e8a23a', collect: '#e8a23a', cook: '#e8a23a', stair: '#e8a23a',
    pickup: '#bcd8f0',
    greet: '#8fb8e8', bank: '#f0d9a4', store: '#f0d9a4', forge: '#f0d9a4',
    attune: '#8fa8e8', look: '#cdbb99', walk: '#e8d199',
  }
  if (travelMark) {
    const p = screenOf(travelMark.x, travelMark.y)
    const lf = liftAt(travelMark.x, travelMark.y)
    const k = clamp((now - travelMark.at) / 620, 0, 1)
    const tint = VERB_TINT[travelMark.verb] ?? '#e8d199'
    if (travelMark.fail) {
      // A REFUSAL LOOKS DIFFERENT. Nothing else in the window says "that click
      // went nowhere", and a citizen who cannot tell a miss from a long walk
      // learns to distrust their own aim.
      g.save(); g.globalAlpha = 1 - k
      g.strokeStyle = '#e0452a'; g.lineWidth = 3; g.lineCap = 'round'
      const r2 = 11 + (1 - k) * 5
      g.beginPath()
      g.moveTo(p.x - r2, p.y - lf - r2 * .5); g.lineTo(p.x + r2, p.y - lf + r2 * .5)
      g.moveTo(p.x + r2, p.y - lf - r2 * .5); g.lineTo(p.x - r2, p.y - lf + r2 * .5)
      g.stroke(); g.restore()
    } else {
      g.save(); g.globalAlpha = 1 - k
      g.strokeStyle = tint; g.lineWidth = 2.4 * (1 - k) + .8
      diamond(g, p.x - 32, p.y - lf - 16, 6 + k * 16); g.stroke()
      if (travelMark.verb && travelMark.verb !== 'walk') {
        // the word, so the order is unambiguous even if the target is offscreen
        g.font = '700 11px Cinzel, Georgia, serif'
        g.textAlign = 'center'; g.textBaseline = 'alphabetic'
        g.save(); g.letterSpacing = '2px'
        const label = (VERB_WORD[travelMark.verb] ?? travelMark.verb).toUpperCase()
        g.lineWidth = 3; g.strokeStyle = 'rgba(4,3,6,.85)'
        g.strokeText(label, p.x, p.y - lf - 26 - k * 14)
        g.fillStyle = tint
        g.fillText(label, p.x, p.y - lf - 26 - k * 14)
        g.restore()
      }
      g.restore()
    }
    if (k >= 1) travelMark = null
  }
  // the standing order, drawn on whatever it is standing on
  if (intent && intent.kind !== 'walk') {
    const tp = intentTargetPos(s, t)
    if (tp) {
      const p = screenOf(tp.x, tp.y)
      const lf = liftAt(Math.round(tp.x), Math.round(tp.y))
      const tint = VERB_TINT[intent.kind] ?? '#e8d199'
      const puls = .55 + Math.sin(now / 260) * .3
      g.save()
      g.strokeStyle = hexA(tint, .5 * puls); g.lineWidth = 2
      diamond(g, p.x - 32, p.y - lf - 16, 8); g.stroke()
      // corner brackets, which is what makes it read as TARGETED rather than
      // merely lit: four short arcs that do not close
      const bl = tp.box ?? 26
      g.strokeStyle = hexA(tint, .85 * puls); g.lineWidth = 2.2; g.lineCap = 'round'
      for (let q = 0; q < 4; q++) {
        const sx2 = q % 2 ? 1 : -1, sy2 = q < 2 ? -1 : 1
        const bx = p.x + sx2 * bl, by = p.y - lf - 16 + sy2 * bl * .62
        g.beginPath()
        g.moveTo(bx - sx2 * 7, by); g.lineTo(bx, by); g.lineTo(bx, by + sy2 * 6)
        g.stroke()
      }
      g.restore()
    }
  }

  // =========================================================================
  // LIGHT: one fixed climate
  // =========================================================================
  const L = lightG
  L.setTransform(DPR, 0, 0, DPR, 0, 0)
  L.globalCompositeOperation = 'source-over'
  L.clearRect(0, 0, VW, VH)
  L.fillStyle = 'rgba(' + SHADOW_TINT[0] + ',' + SHADOW_TINT[1] + ',' + SHADOW_TINT[2] + ',' + AMBIENT_DARK + ')'
  L.fillRect(0, 0, VW, VH)
  L.globalCompositeOperation = 'destination-out'
  for (const [lx, ly, lr, li, warm, isLantern] of lights) {
    const flick = isLantern
      ? 1 + Math.sin(now / 130) * .034 + Math.sin(now / 57) * .02 + Math.sin(now / 311) * .028
      : 1 + Math.sin(now / 90 + lx) * .05
    const rr = lr * flick
    const gr = L.createRadialGradient(lx, ly, 0, lx, ly, rr)
    gr.addColorStop(0, 'rgba(0,0,0,' + li + ')')
    gr.addColorStop(.44, 'rgba(0,0,0,' + (li * .78) + ')')
    gr.addColorStop(.8, 'rgba(0,0,0,' + (li * .24) + ')')
    gr.addColorStop(1, 'rgba(0,0,0,0)')
    L.fillStyle = gr
    L.save(); L.translate(lx, ly); L.scale(1, .62); L.translate(-lx, -ly)
    L.beginPath(); L.arc(lx, ly, rr, 0, 7); L.fill(); L.restore()
  }
  g.setTransform(1, 0, 0, 1, 0, 0)
  g.globalCompositeOperation = 'source-over'
  g.drawImage(lightCv, 0, 0)
  g.setTransform(DPR, 0, 0, DPR, 0, 0)

  // ---- and the warmth back into it ---------------------------------------
  g.globalCompositeOperation = 'lighter'
  for (const [lx, ly, lr, li, warm] of lights) {
    if (!warm) continue
    const rr = lr * .92
    const gr = g.createRadialGradient(lx, ly, 0, lx, ly, rr)
    gr.addColorStop(0, 'rgba(' + WARM[0] + ',' + WARM[1] + ',' + WARM[2] + ',' + (.20 * li) + ')')
    gr.addColorStop(.55, 'rgba(' + WARM[0] + ',' + (WARM[1] - 40) + ',' + (WARM[2] - 30) + ',' + (.09 * li) + ')')
    gr.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = gr
    g.save(); g.translate(lx, ly); g.scale(1, .62); g.translate(-lx, -ly)
    g.beginPath(); g.arc(lx, ly, rr, 0, 7); g.fill(); g.restore()
  }
  g.globalCompositeOperation = 'source-over'

  // ---- dust in the light --------------------------------------------------
  // Air is what stops a lit room looking like a lit picture of a room. These
  // only exist where something is actually lighting them, which is the whole
  // effect: walk out of the pool and the air goes with it.
  if (hiq()) {
    while (dust.length < 70) dust.push({
      x: Math.random() * VW, y: Math.random() * VH,
      vx: (Math.random() - .5) * .12, vy: -.05 - Math.random() * .16,
      r: .6 + Math.random() * 1.5, a: .06 + Math.random() * .14, ph: Math.random() * 7,
    })
    g.globalCompositeOperation = 'lighter'
    for (const d of dust) {
      d.x += d.vx + Math.sin(now / 1800 + d.ph) * .09
      d.y += d.vy
      if (d.y < -10) { d.y = VH + 8; d.x = Math.random() * VW }
      if (d.x < -10) d.x = VW + 8; else if (d.x > VW + 10) d.x = -8
      let lit = 0
      for (const [lx, ly, lr] of lights) {
        const dd = Math.hypot(d.x - lx, (d.y - ly) / .62)
        if (dd < lr) lit = Math.max(lit, 1 - dd / lr)
      }
      if (lit < .04) continue
      g.fillStyle = 'rgba(255,214,158,' + (d.a * lit).toFixed(3) + ')'
      g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill()
    }
    g.globalCompositeOperation = 'source-over'
  }

  // ORDER MATTERS, AND IT WAS WRONG.
  //
  // The cool multiply used to run AFTER the bloom, which meant the one thing
  // in the frame that must stay warm -- the glow around a fire -- was the last
  // thing to be cooled. Every flame came out a pale blue-white pillar. Grade
  // the world first; bloom the fire over the top of the graded world.
  // =========================================================================
  // GRADE
  // =========================================================================
  // Cool the shadows without cooling the fire. A blue `multiply` over the whole
  // frame would drag the flames down with everything else, so the cool goes on
  // first and a broad warm wash goes back over the top of it.
  g.globalCompositeOperation = 'multiply'
  const cg = g.createLinearGradient(0, 0, 0, VH)
  cg.addColorStop(0, 'rgb(178,190,224)')
  cg.addColorStop(1, 'rgb(206,206,222)')
  g.fillStyle = cg; g.fillRect(0, 0, VW, VH)
  g.globalCompositeOperation = 'lighter'
  g.fillStyle = 'rgba(70,34,10,.16)'
  g.fillRect(0, 0, VW, VH)
  g.globalCompositeOperation = 'source-over'

  // =========================================================================
  // BLOOM
  // =========================================================================
  // Not a scene-wide bright pass: the lights themselves, drawn small, blurred,
  // and added back. It costs a quarter-resolution surface and one blurred
  // blit, and it is most of the reason fire in these games looks like it is
  // burning rather than like a picture of a flame.
  if (hiq() && lights.length) {
    const B = bloomG
    B.setTransform(1, 0, 0, 1, 0, 0)
    B.globalCompositeOperation = 'source-over'
    B.clearRect(0, 0, bloomCv.width, bloomCv.height)
    B.globalCompositeOperation = 'lighter'
    const k = DPR / BLOOM_DIV
    for (const [lx, ly, lr, li, warm] of lights) {
      const rr = lr * .55 * k
      const bx = lx * k, by = ly * k
      const gr = B.createRadialGradient(bx, by, 0, bx, by, rr)
      const c = warm ? [255, 168, 74] : [128, 190, 255]
      gr.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (.55 * li) + ')')
      gr.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)')
      B.fillStyle = gr
      B.beginPath(); B.arc(bx, by, rr, 0, 7); B.fill()
    }
    g.setTransform(1, 0, 0, 1, 0, 0)
    g.globalCompositeOperation = 'lighter'
    try { g.filter = 'blur(' + Math.round(6 * DPR) + 'px)' } catch {}
    g.drawImage(bloomCv, 0, 0, cv.width, cv.height)
    try { g.filter = 'none' } catch {}
    g.globalCompositeOperation = 'source-over'
    g.setTransform(DPR, 0, 0, DPR, 0, 0)
  }

  // ---- numbers leaving bodies ---------------------------------------------
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'
  for (let i = dmgNums.length - 1; i >= 0; i--) {
    const d = dmgNums[i]
    const age = (now - d.at) / 1150
    if (age > 1) { dmgNums.splice(i, 1); continue }
    const p = screenOf(d.x, d.y)
    const rise = 34 * (1 - Math.pow(1 - age, 2.2))
    const pop = age < .16 ? 1 + (1 - age / .16) * .55 : 1
    const size = (d.big ? 25 : 18) * pop
    g.globalAlpha = age > .68 ? (1 - age) / .32 : 1
    g.font = '900 ' + size.toFixed(1) + 'px Cinzel, Georgia, serif'
    g.lineWidth = 3.4; g.strokeStyle = 'rgba(4,3,6,.9)'
    g.strokeText(d.text, p.x + d.vx * age, p.y - 44 - rise)
    g.fillStyle = d.col
    g.fillText(d.text, p.x + d.vx * age, p.y - 44 - rise)
    g.globalAlpha = 1
  }

  // ---- the edges of the frame ---------------------------------------------
  const vg = g.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .30,
                                    VW / 2, VH / 2, Math.max(VW, VH) * .76)
  vg.addColorStop(0, 'rgba(0,0,0,0)')
  vg.addColorStop(1, 'rgba(2,3,8,.78)')
  g.fillStyle = vg; g.fillRect(0, 0, VW, VH)

  const me = myId && s.players[myId]
  const hpFrac = me ? clamp(me.hp / maxHpOf(me), 0, 1) : 1
  const bleed = Math.max(flashRed, hpFrac < .34 ? (.34 - hpFrac) * 1.6 : 0)
  if (bleed > .01) {
    const bg = g.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .20,
                                      VW / 2, VH / 2, Math.max(VW, VH) * .68)
    bg.addColorStop(0, 'rgba(150,10,6,0)')
    bg.addColorStop(1, 'rgba(150,10,6,' + clamp(bleed, 0, .85) + ')')
    g.fillStyle = bg; g.fillRect(0, 0, VW, VH)
  }
  if (flashGold > .01) {
    g.globalCompositeOperation = 'lighter'
    g.fillStyle = 'rgba(232,182,74,' + (flashGold * .22) + ')'
    g.fillRect(0, 0, VW, VH)
    g.globalCompositeOperation = 'source-over'
  }
}

// The chart used to live here, drawn in the world's own projection at the
// world's own zoom. It is now a document rather than a view: 55-chart.js.

// ---- words for things -----------------------------------------------------
const wordy = (item) => typeof item === 'string' && item.startsWith('chart:')
  ? 'chart of ' + item.slice(6).replace(/-/g, ' ')
  : String(item ?? '').replace(/-/g, ' ')
// RARITY IS REAL HERE. I had this wrong and flattened it.
//
// There are no affixes and no rarity roll, so nothing is graded at the moment
// it drops -- but scarcity is not the same as rolled rarity, and this
// constitution has a very steep one. DROP_DEN is 65,536, and the tables read:
//
//     old-chain     2/65536   from a troll        one in 32,768
//     horn-bow     66/65536   from a bear         one in 993
//     star-helm   328/65536   from a knight       one in 200
//     bronze-hatchet 4096/65536                   one in 16
//     bronze-plate   6144/65536                   one in 11
//
// So colour can say what a thing COSTS to obtain without inventing a property
// the engine does not have. The tiers below are the real ladder: what almost
// nobody has, what a long campaign earns, what starmetal and magic buy, and
// what any smith can make in an afternoon.
const RARITY = {
  legendary: '#d0722a',   // effectively never handed to you
  rare:      '#e8d34a',
  magic:     '#6f8ce8',
  common:    '#d8cdb4',
  useful:    '#8fb07a',   // food and drink
  material:  '#a89e88',   // what things are made of
  coin:      '#e8b53a',
}
// where a thing comes from, when it comes from a body. Straight off engine.js
// MOB_STATS drops; the odds are worth telling a citizen who is deciding
// whether to keep hunting.
const DROP_ODDS = {
  'old-chain':      { from: 'a troll', n: 2 },
  'horn-bow':       { from: 'a bear', n: 66 },
  'star-helm':      { from: 'a skeleton-knight', n: 328 },
  'bronze-plate':   { from: 'a troll', n: 6144 },
  'bronze-hatchet': { from: 'a bear', n: 4096 },
}
const DROP_DEN = 65536
const oddsLine = (item) => {
  const d = DROP_ODDS[item]; if (!d) return null
  const one = Math.round(DROP_DEN / d.n)
  return 'one in ' + one.toLocaleString() + ' from ' + d.from
}
function rarityOf(item) {
  if (item === 'gold-coin') return RARITY.coin
  if (typeof item === 'string' && item.startsWith('chart:')) return RARITY.magic
  // the four things this island barely gives up
  if (/^(old-chain|dragonbow|heartwood-bow|sigil-bow)$/.test(item)) return RARITY.legendary
  // starmetal war-gear and the horn-bow: a campaign, not an afternoon
  if (/^(star-sword|star-maul|star-plate|star-flail|star-helm|horn-bow)$/.test(item)) return RARITY.rare
  // starmetal's lighter arms, and what magic is made of
  if (/^star-|^(magic-stone|sigil|crossbow|bronze-plate)$/.test(item)) return RARITY.magic
  if (/^bronze-|^(wooden-bow|arrows)$/.test(item)) return RARITY.common
  if (/fish|ale|broth|grain|seeds/.test(item)) return RARITY.useful
  if (/bones|crab-shell|wool|logs|ore|heartwood/.test(item)) return RARITY.material
  return RARITY.common
}
// ===========================================================================
// THE CHART
// ---------------------------------------------------------------------------
// The old one was drawn in the world's own projection at the world's own zoom,
// which meant it showed about fifty tiles as enormous translucent diamonds and
// was, correctly, described as unusable. Two things were wrong and only one of
// them was the zoom.
//
// The other is that a chart is not a view. It is a DOCUMENT -- a thing someone
// drew, on paper, from memory and pacing, and every convention of cartography
// exists because a document has to say more with less than a window does.
// Hatching parallel to a coast, a dashed line for a road, bumps for hills, a
// scatter of little trees for a wood: none of that is decoration, it is how
// you fit a country onto a sheet.
//
// So: top-down, because plans are drawn flat; on paper, because it is paper;
// zoomable and draggable, because a sheet is something you move around under
// your hands. Everything on it is still a pure function of the seed, so this
// chart cannot disagree with the ground it describes.
//
// Rendered once into its own surface and re-rendered only when the sheet moves.
// Thirty thousand tiles is nothing once; it is everything sixty times a second.
// ===========================================================================

const chartCv = mkc(8, 8)
let chartZoom = 0, chartPanX = 0, chartPanY = 0, chartKey = ''
let chartDragging = false

const PAPER = {
  base: '#ddcaa2', warm: '#cbb78a', edge: '#a88b5c',
  ink: '#463520', inkSoft: 'rgba(70,53,32,.45)',
  sea: '#b7c6c3', seaHatch: 'rgba(72,104,104,.30)',
  road: '#9c7742', river: '#6f97a8', red: '#8e2b1e',
}
const CHART_LAND = {
  meadow: '#cdc596', heartlands: '#d0c795', downs: '#d4cb9b', moor: '#c6bf94',
  greenwood: '#b4c08c', forest: '#adba86', wilds: '#c6ae9a', fens: '#bcc3a1',
  peat: '#b8ae8c', sand: '#e4d6a9', chalk: '#e0d7b4', gravel: '#cdc4a4',
  scree: '#c8bda0', crags: '#c3b79a', mountain: '#bdb094', cave: '#a89a80',
  cobble: '#cbb78e', plaza: '#cbb78e', flag: '#c7b489', floor: '#c2ac80',
  inn: '#c2ac80', smith: '#bdb096', fisher: '#c3b493', shep: '#c8bc90',
  clerk: '#c5b590', wizard: '#bdb0a8',
  trail: '#a8834e', causey: '#a8834e', bridge: '#8a6a3c',
  river: '#7fa3b4', sea: '#b7c6c3',
}

function chartFit() {
  // a sheet wants to show a COUNTRY, not a street: roughly two hundred tiles
  // across, clamped so it stays legible on a phone and does not go silly on a
  // wall-sized display
  return clamp(Math.min(VW, VH) / 170, 1.6, 5.5)
}
function chartRecentre() {
  const me = myId && curState?.players?.[myId]
  chartPanX = me ? me.x : (world?.genesis?.worldW ?? 320) / 2
  chartPanY = me ? me.y : (world?.genesis?.worldH ?? 200) / 2
  chartKey = ''
}

// ---- one hand-drawn sheet -------------------------------------------------
function renderChart() {
  const W = world?.genesis?.worldW ?? dims().W, H = world?.genesis?.worldH ?? dims().H
  const cw = Math.max(1, Math.round(VW * DPR)), ch = Math.max(1, Math.round(VH * DPR))
  if (chartCv.width !== cw || chartCv.height !== ch) { chartCv.width = cw; chartCv.height = ch }
  const g = chartCv.getContext('2d')
  g.setTransform(DPR, 0, 0, DPR, 0, 0)
  g.clearRect(0, 0, VW, VH)
  const z = chartZoom
  const M = Math.round(Math.min(VW, VH) * .035)      // the margin of the sheet
  const bw = VW - M * 2, bh = VH - M * 2 - PANEL_H * .55
  const ox = M, oy = M
  const tileToX = (x) => ox + bw / 2 + (x - chartPanX) * z
  const tileToY = (y) => oy + bh / 2 + (y - chartPanY) * z

  // ---- the paper ---------------------------------------------------------
  const pg = g.createLinearGradient(0, oy, 0, oy + bh)
  pg.addColorStop(0, PAPER.base); pg.addColorStop(.5, '#e2d0a8'); pg.addColorStop(1, '#d2bd93')
  g.fillStyle = pg; g.fillRect(ox, oy, bw, bh)
  const R = rng(0x5EED)
  g.save(); g.beginPath(); g.rect(ox, oy, bw, bh); g.clip()
  for (let i = 0; i < 260; i++) {                    // foxing, and the grain of it
    const x = ox + R() * bw, y = oy + R() * bh, r = 2 + R() * 22
    const fg = g.createRadialGradient(x, y, 0, x, y, r)
    fg.addColorStop(0, 'rgba(140,104,58,' + (.03 + R() * .05) + ')')
    fg.addColorStop(1, 'rgba(140,104,58,0)')
    g.fillStyle = fg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill()
  }

  // ---- the land ----------------------------------------------------------
  const x0 = Math.max(0, Math.floor(chartPanX - (bw / 2) / z) - 1)
  const x1 = Math.min(W - 1, Math.ceil(chartPanX + (bw / 2) / z) + 1)
  const y0 = Math.max(0, Math.floor(chartPanY - (bh / 2) / z) - 1)
  const y1 = Math.min(H - 1, Math.ceil(chartPanY + (bh / 2) / z) + 1)
  const step = z < 2.4 ? 1 : 1
  const cell = Math.ceil(z) + .6
  for (let y = y0; y <= y1; y += step) {
    for (let x = x0; x <= x1; x += step) {
      const k = terrainOf(x, y)
      g.fillStyle = CHART_LAND[k] ?? '#cbc094'
      g.fillRect(tileToX(x), tileToY(y), cell, cell)
    }
  }

  // ---- the sea, hatched the way a sea is hatched -------------------------
  g.save()
  g.strokeStyle = PAPER.seaHatch; g.lineWidth = Math.max(.6, z * .16)
  for (let y = y0; y <= y1; y++) {
    if (y % 3) continue
    let run = null
    for (let x = x0; x <= x1 + 1; x++) {
      const wet = x <= x1 && (terrainOf(x, y) === 'sea')
      if (wet && run === null) run = x
      else if (!wet && run !== null) {
        g.beginPath()
        g.moveTo(tileToX(run) + z * .5, tileToY(y) + z * .5)
        g.lineTo(tileToX(x - 1) + z * .5, tileToY(y) + z * .5)
        g.stroke(); run = null
      }
    }
  }
  g.restore()

  // ---- the coastline, and the banks of every river ------------------------
  const isWet = (x, y) => { const k = terrainOf(x, y); return k === 'sea' || k === 'river' }
  g.strokeStyle = PAPER.ink; g.lineWidth = Math.max(.8, z * .26)
  g.beginPath()
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (!isWet(x, y)) continue
      const px2 = tileToX(x), py2 = tileToY(y)
      if (!isWet(x + 1, y)) { g.moveTo(px2 + z, py2); g.lineTo(px2 + z, py2 + z) }
      if (!isWet(x - 1, y)) { g.moveTo(px2, py2); g.lineTo(px2, py2 + z) }
      if (!isWet(x, y + 1)) { g.moveTo(px2, py2 + z); g.lineTo(px2 + z, py2 + z) }
      if (!isWet(x, y - 1)) { g.moveTo(px2, py2); g.lineTo(px2 + z, py2) }
    }
  }
  g.stroke()

  // ---- woods as trees, high ground as bumps ------------------------------
  // Drawn sparsely and by hand, because a wood on a chart is not a green area,
  // it is somebody's shorthand for "there are trees here".
  if (z > 1.9) {
    g.strokeStyle = 'rgba(56,72,40,.62)'; g.lineWidth = Math.max(.7, z * .17)
    g.fillStyle = 'rgba(72,92,52,.5)'
    for (let y = y0; y <= y1; y += 3) for (let x = x0; x <= x1; x += 3) {
      const k = terrainOf(x, y)
      if (k !== 'greenwood' && k !== 'forest') continue
      if ((tileHash(x, y, 41) & 3) !== 0) continue
      const px2 = tileToX(x) + z * .5, py2 = tileToY(y) + z * .5, r = z * .9
      g.beginPath(); g.moveTo(px2, py2 + r); g.lineTo(px2, py2 - r * .3); g.stroke()
      g.beginPath(); g.arc(px2, py2 - r * .6, r * .78, 0, 7); g.fill()
    }
    g.strokeStyle = 'rgba(70,54,34,.62)'; g.lineWidth = Math.max(.7, z * .18)
    for (let y = y0; y <= y1; y += 3) for (let x = x0; x <= x1; x += 3) {
      const k = terrainOf(x, y)
      if (k !== 'crags' && k !== 'mountain' && k !== 'scree') continue
      if ((tileHash(x, y, 43) & 3) !== 0) continue
      const px2 = tileToX(x), py2 = tileToY(y) + z
      const w2 = z * 2.2
      g.beginPath()
      g.moveTo(px2 - w2 * .5, py2)
      g.quadraticCurveTo(px2, py2 - w2 * (k === 'mountain' ? 1.1 : .7), px2 + w2 * .5, py2)
      g.stroke()
    }
    // the Fens get tussocks, because a marsh drawn as a colour is a lake
    g.strokeStyle = 'rgba(72,86,60,.5)'; g.lineWidth = Math.max(.6, z * .14)
    for (let y = y0; y <= y1; y += 4) for (let x = x0; x <= x1; x += 4) {
      if (terrainOf(x, y) !== 'fens') continue
      const px2 = tileToX(x), py2 = tileToY(y)
      for (let q = 0; q < 3; q++) {
        g.beginPath(); g.moveTo(px2 + q * z * .8, py2 + z * .6)
        g.lineTo(px2 + q * z * .8, py2 - z * .2); g.stroke()
      }
    }
  }

  // ---- the towns ---------------------------------------------------------
  // Settlements are shaped differently in each founding -- v3's carry no tag
  // and v1's no name -- and a chart that throws is worse than a chart that is
  // vague. Everything below is defended.
  let towns = []
  try { towns = (settlementsE() ?? []).filter(t => t && Number.isFinite(t.x) && Number.isFinite(t.y)) } catch {}
  for (const t of towns) {
    const tx = tileToX(t.x), ty = tileToY(t.y)
    if (tx < ox - 80 || tx > ox + bw + 80 || ty < oy - 60 || ty > oy + bh + 60) continue
    // a scatter of little blocks, the way a plan of a town is drawn
    const RT = rng(hash32(String(t.tag ?? t.name ?? (t.x + ':' + t.y))))
    const n = t.ring === 'shire' ? 9 : 6
    const tw = t.w ?? 20, th = t.h ?? 16
    g.fillStyle = 'rgba(70,53,32,.82)'
    for (let i = 0; i < n; i++) {
      const a = RT() * 6.283, r = RT() * Math.min(tw, th) * .3 * z
      const s2 = Math.max(1.6, z * .8)
      g.fillRect(tx + Math.cos(a) * r, ty + Math.sin(a) * r * .8, s2, s2 * .8)
    }
    g.strokeStyle = 'rgba(70,53,32,.5)'; g.lineWidth = 1
    g.beginPath(); g.ellipse(tx, ty, tw * .5 * z, th * .5 * z, 0, 0, 7); g.stroke()
  }

  // ---- the names ---------------------------------------------------------
  g.textAlign = 'center'; g.textBaseline = 'middle'
  // countries first, large and faint, the way a chart lets a region breathe
  const LOCALES = [
    ['the Heartlands', 373, 235], ['the Wilds', 109, 257], ['the Fens', 337, 397],
    ['the Downs', 580, 339], ['the Greenwood', 531, 116], ['the Crags', 716, 238],
    ['the Moor', 289, 130], ['the Deepwood', 465, 53], ["Deadman's Reach", 108, 154],
    ['the Boneyard', 81, 316], ['the Kingswood', 611, 75], ['the Barrow', 515, 300],
  ]
  for (const [name, lx, ly] of LOCALES) {
    const px2 = tileToX(lx), py2 = tileToY(ly)
    if (px2 < ox || px2 > ox + bw || py2 < oy || py2 > oy + bh) continue
    g.font = '600 ' + Math.round(clamp(z * 4.4, 11, 26)) + 'px Cinzel, Georgia, serif'
    g.save(); g.letterSpacing = Math.round(clamp(z * 1.6, 3, 9)) + 'px'
    g.fillStyle = 'rgba(70,53,32,.30)'
    g.fillText(name.toUpperCase(), px2, py2); g.restore()
  }
  for (const t of towns) {
    if (!t.name) continue
    const tx = tileToX(t.x), ty = tileToY(t.y + (t.h ?? 16) * .5)
    if (tx < ox || tx > ox + bw || ty < oy || ty > oy + bh) continue
    g.font = 'italic ' + Math.round(clamp(z * 3.4, 10, 17)) + 'px Georgia, serif'
    g.fillStyle = 'rgba(252,242,216,.75)'
    g.fillText(t.name, tx + 1, ty + 9)
    g.fillStyle = PAPER.ink
    g.fillText(t.name, tx, ty + 8)
  }
  g.restore()

  // ---- the furniture of a sheet ------------------------------------------
  g.strokeStyle = PAPER.ink; g.lineWidth = 2
  g.strokeRect(ox + .5, oy + .5, bw - 1, bh - 1)
  g.strokeStyle = 'rgba(70,53,32,.55)'; g.lineWidth = 1
  g.strokeRect(ox + 5.5, oy + 5.5, bw - 11, bh - 11)
  // ticks along the border, like a surveyed sheet
  g.strokeStyle = 'rgba(70,53,32,.5)'
  for (let i = 0; i < bw; i += 16) {
    g.beginPath(); g.moveTo(ox + i, oy); g.lineTo(ox + i, oy + 5); g.stroke()
    g.beginPath(); g.moveTo(ox + i, oy + bh); g.lineTo(ox + i, oy + bh - 5); g.stroke()
  }
  for (let i = 0; i < bh; i += 16) {
    g.beginPath(); g.moveTo(ox, oy + i); g.lineTo(ox + 5, oy + i); g.stroke()
    g.beginPath(); g.moveTo(ox + bw, oy + i); g.lineTo(ox + bw - 5, oy + i); g.stroke()
  }
  // a compass, and a scale
  const crx = ox + bw - 46, cry = oy + 48
  g.strokeStyle = PAPER.ink; g.lineWidth = 1.4
  g.beginPath(); g.arc(crx, cry, 22, 0, 7); g.stroke()
  g.fillStyle = PAPER.ink
  for (let i = 0; i < 4; i++) {
    const a = i * 1.5708 - 1.5708
    g.beginPath()
    g.moveTo(crx + Math.cos(a) * 21, cry + Math.sin(a) * 21)
    g.lineTo(crx + Math.cos(a + 2.4) * 5, cry + Math.sin(a + 2.4) * 5)
    g.lineTo(crx + Math.cos(a - 2.4) * 5, cry + Math.sin(a - 2.4) * 5)
    g.closePath(); g.fill()
  }
  g.font = '700 10px Cinzel, Georgia, serif'
  g.fillText('N', crx, cry - 30)
  const sbW = Math.round(50 * z), sbTiles = 50
  g.lineWidth = 2
  g.beginPath(); g.moveTo(ox + 24, oy + bh - 26); g.lineTo(ox + 24 + sbW, oy + bh - 26); g.stroke()
  g.beginPath(); g.moveTo(ox + 24, oy + bh - 30); g.lineTo(ox + 24, oy + bh - 22); g.stroke()
  g.beginPath(); g.moveTo(ox + 24 + sbW, oy + bh - 30); g.lineTo(ox + 24 + sbW, oy + bh - 22); g.stroke()
  g.font = 'italic 11px Georgia, serif'; g.textAlign = 'left'
  g.fillText(sbTiles + ' paces', ox + 26, oy + bh - 36)
  return { ox, oy, bw, bh, tileToX, tileToY }
}

let chartBox = null
function drawChart(g, now) {
  const s = curState; if (!s) return
  if (!chartZoom) { chartZoom = chartFit(); chartRecentre() }
  const sig = [VW, VH, DPR, chartZoom.toFixed(3), chartPanX | 0, chartPanY | 0, worldConfigured].join('|')
  if (sig !== chartKey) { chartBox = renderChart(); chartKey = sig }

  g.fillStyle = 'rgba(6,5,8,.86)'; g.fillRect(0, 0, VW, VH)
  g.setTransform(1, 0, 0, 1, 0, 0)
  g.drawImage(chartCv, 0, 0)
  g.setTransform(DPR, 0, 0, DPR, 0, 0)
  if (!chartBox) return
  const { ox, oy, bw, bh, tileToX, tileToY } = chartBox

  g.save(); g.beginPath(); g.rect(ox, oy, bw, bh); g.clip()
  // ---- everyone who is out there right now -------------------------------
  for (const [id, p] of Object.entries(s.players ?? {})) {
    if (id === myId) continue
    const px2 = tileToX(p.x), py2 = tileToY(p.y)
    g.fillStyle = 'rgba(70,53,32,.7)'
    g.beginPath(); g.arc(px2, py2, 2.6, 0, 7); g.fill()
  }
  // ---- and the two things worth marking on a chart -----------------------
  for (const m of Object.values(s.mobs ?? {})) {
    if (m.hp <= 0) continue
    if (m.type !== 'dragon' && m.type !== 'great-spider') continue
    const px2 = tileToX(m.x), py2 = tileToY(m.y)
    g.save(); g.translate(px2, py2)
    g.strokeStyle = PAPER.red; g.lineWidth = 1.6; g.lineCap = 'round'
    if (m.type === 'dragon') {                       // here be one, and only one
      g.beginPath(); g.moveTo(-9, 2); g.quadraticCurveTo(0, -6, 9, 2); g.stroke()
      g.beginPath(); g.moveTo(-5, 1); g.quadraticCurveTo(-2, -9, 2, -2); g.stroke()
      g.beginPath(); g.moveTo(5, 1); g.quadraticCurveTo(8, -9, 11, -3); g.stroke()
    } else {
      g.beginPath(); g.arc(0, 0, 4, 0, 7); g.stroke()
      for (let q = 0; q < 8; q++) {
        const a = (q / 8) * 6.283
        g.beginPath(); g.moveTo(Math.cos(a) * 4, Math.sin(a) * 4)
        g.lineTo(Math.cos(a) * 10, Math.sin(a) * 10); g.stroke()
      }
    }
    g.restore()
  }
  // ---- you --------------------------------------------------------------
  const me = myId && s.players[myId]
  if (me) {
    const px2 = tileToX(me.x), py2 = tileToY(me.y)
    const puls = .6 + Math.sin(now / 340) * .35
    g.strokeStyle = 'rgba(142,43,30,' + puls.toFixed(2) + ')'; g.lineWidth = 1.4
    g.beginPath(); g.arc(px2, py2, 8 + puls * 5, 0, 7); g.stroke()
    g.strokeStyle = PAPER.red; g.lineWidth = 2.6; g.lineCap = 'round'
    g.beginPath(); g.moveTo(px2 - 6, py2 - 6); g.lineTo(px2 + 6, py2 + 6)
    g.moveTo(px2 + 6, py2 - 6); g.lineTo(px2 - 6, py2 + 6); g.stroke()
    g.font = 'italic 12px Georgia, serif'; g.textAlign = 'center'
    g.fillStyle = PAPER.red
    g.fillText(me.name || 'you are here', px2, py2 - 14)
  }
  g.restore()

  // ---- the title, written on the sheet -----------------------------------
  const where = me ? (localeAt4(me.x, me.y) || regionNameAt(me.x, me.y) || 'the island') : 'the island'
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'
  g.font = '900 ' + Math.round(clamp(VW * .026, 15, 30)) + 'px Cinzel, Georgia, serif'
  g.save(); g.letterSpacing = '4px'
  g.fillStyle = 'rgba(252,242,216,.5)'
  g.fillText(String(where).toUpperCase(), VW / 2 + 1, oy + 34)
  g.fillStyle = PAPER.ink
  g.fillText(String(where).toUpperCase(), VW / 2, oy + 33)
  g.restore()
  g.font = 'italic 11.5px Georgia, serif'
  g.fillStyle = 'rgba(70,53,32,.6)'
  g.fillText((me ? me.x + ' \u00b7 ' + me.y + '   \u2014   ' : '') + 'tick ' + s.tick
    + '   \u2014   drag to move the sheet, scroll to zoom, R to find yourself',
    VW / 2, oy + bh - 10)
}
// ===========================================================================
// THE PANEL
// ---------------------------------------------------------------------------
// A fixed slab of carved stone at the bottom of the screen, the same size on a
// laptop and on a wall, with two glass orbs let into it. Everything else lives
// behind a button.
//
// The orbs are the reason this file exists. A bar would carry the same number
// in a tenth of the code, and it would tell you nothing at a glance while you
// were busy looking somewhere else. A volume of liquid with a surface on it
// reads peripherally: you know you are in trouble from the corner of your eye,
// which is exactly when you need to.
// ===========================================================================

// THE PANEL IS A FIXED SLAB, BUT NOT A FIXED SIZE.
//
// 680 x 150 is right on a laptop and absurd on a phone: at 430 CSS pixels wide
// both orbs hung off the edges of the screen and the belt overlapped the
// buttons. So the slab is measured every frame from the viewport, and every
// distance inside it is derived from two numbers -- its width and the orb
// radius -- rather than written down. Text stays at real pixel sizes and is
// never scaled down, because a legible orb with a small label beats a
// perfectly proportioned panel nobody can read.
let PANEL_W = 680, PANEL_H = 150, PANEL_X = 0, PANEL_Y = 0, ORB_R = 52
let PANE_W = 352, PANE_H = 462
function layoutPanel() {
  PANEL_W = Math.min(680, VW - 8)
  ORB_R = Math.round(clamp(PANEL_W * 0.077, 24, 52))
  PANEL_H = ORB_R * 2 + 46
  PANEL_X = Math.round((VW - PANEL_W) / 2)
  PANEL_Y = VH - PANEL_H
  PANE_W = Math.min(352, VW - 20)
  PANE_H = Math.min(462, Math.max(200, VH - PANEL_H - 24))
}
// The citizen goes on the left, the pack on the right, and a counter or an
// anvil is a modal in the middle. They do not compete for one slot: reading
// your levels while deciding what to wield is the ordinary case, and making it
// a toggle was an arbitrary restriction imposed by a single variable.
let paneLeft = null                   // 'citizen' | null
let paneRight = null                  // 'pack' | null
let paneModal = null                  // 'forge' | 'bank' | 'store' | null
const paneOpen = (id) => paneLeft === id || paneRight === id || paneModal === id
function togglePane(id) {
  if (id === 'citizen') paneLeft = paneLeft ? null : 'citizen'
  else if (id === 'pack') paneRight = paneRight ? null : 'pack'
  else paneModal = paneModal === id ? null : id
}
function closePane(id) {
  if (id === 'citizen' || id === 'left') paneLeft = null
  else if (id === 'pack' || id === 'right') paneRight = null
  else paneModal = null
}
const anyPaneOpen = () => !!(paneLeft || paneRight || paneModal)
let regions = []                      // rebuilt every frame; the only hit-test there is
let logLines = []
let tipAt = null                      // { x, y, item, sub } while the cursor rests on something
let beltMap = []                      // which inventory slot each belt key eats
let levelBanner = null                // { skill, lv, at }
let menu = null                       // { x, y, items:[{label,sub,run,dim}] }

function say(text, kind) {
  const last = logLines[logLines.length - 1]
  if (last && last.text === text) { last.n = (last.n ?? 1) + 1; last.at = performance.now(); return }
  logLines.push({ text, kind: kind ?? 'plain', at: performance.now(), n: 1 })
  if (logLines.length > 40) logLines.shift()
}
const LOGCOL = { plain: '#cdbb99', good: '#9fc47a', warn: '#c98b5a', chat: '#e8d199', dim: '#8d7d63', gain: '#e8b53a' }

// ---- sound: rules, not files ----------------------------------------------
let AC = null, MASTER = null
let soundOn = localStorage.getItem('interval-sound') !== 'off'
const SFX = {
  ctx() {
    if (!soundOn) return null
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)()
        MASTER = AC.createGain(); MASTER.gain.value = .85; MASTER.connect(AC.destination)
      } catch { return null }
    }
    // AN AUDIO CONTEXT IS BORN SUSPENDED, and on iOS it goes back to sleep
    // whenever the tab does. Creating it inside a click handler is not enough;
    // it has to be RESUMED, and resumed again every time it lapses. This is why
    // the window was silent on a phone while working on a desktop.
    if (AC.state !== 'running') { try { AC.resume() } catch {} }
    return AC
  },
  out() { return MASTER ?? AC?.destination },
  tone(f, d, type, vol, slide) {
    const a = this.ctx(); if (!a || !soundOn) return
    const o = a.createOscillator(), g = a.createGain()
    o.type = type ?? 'sine'; o.frequency.setValueAtTime(f, a.currentTime)
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), a.currentTime + d)
    g.gain.setValueAtTime(vol ?? .12, a.currentTime)
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d)
    o.connect(g); g.connect(this.out()); o.start(); o.stop(a.currentTime + d + .02)
  },
  noise(d, vol, hp) {
    const a = this.ctx(); if (!a || !soundOn) return
    const n = a.sampleRate * d, buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0)
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n)
    const src = a.createBufferSource(); src.buffer = buf
    const f = a.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp ?? 900
    const g = a.createGain(); g.gain.value = vol ?? .1
    src.connect(f); f.connect(g); g.connect(this.out()); src.start()
  },
  click() { this.tone(420, .05, 'square', .05, 300) },
  hit() { this.noise(.14, .16, 220); this.tone(90, .12, 'sawtooth', .1, 50) },
  hurt() { this.tone(160, .22, 'sawtooth', .14, 70); this.noise(.18, .1, 400) },
  gold() { this.tone(1180, .09, 'triangle', .07); setTimeout(() => this.tone(1560, .11, 'triangle', .06), 55) },
  pick() { this.tone(680, .07, 'triangle', .07, 900) },
  quaff() { this.tone(240, .16, 'sine', .1, 480); this.noise(.1, .05, 600) },
  level() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, .5, 'triangle', .09), i * 95)) },
  pane() { this.noise(.09, .09, 1400) },
  chat() { this.tone(880, .05, 'sine', .04) },
  die() { [300, 240, 180, 110].forEach((f, i) => setTimeout(() => this.tone(f, .7, 'sawtooth', .11), i * 150)) },
  step(i) { this.noise(.05, .028, 2600 + (i % 2) * 700) },       // boots on stone
  chop()  { this.noise(.10, .10, 500); this.tone(150, .09, 'triangle', .06, 90) },
  mine()  { this.noise(.07, .11, 2400); this.tone(320, .06, 'square', .05, 180) },
  fish()  { this.noise(.16, .05, 900) },
  crackle() { this.noise(.05 + Math.random() * .05, .022 + Math.random() * .02, 1400 + Math.random() * 1800) },
  slain() { this.tone(120, .3, 'sawtooth', .1, 45); this.noise(.22, .09, 300) },
  beam()  { this.tone(1320, .12, 'sine', .04, 1760) },
  loose() { this.noise(.06, .05, 1800); this.tone(760, .05, 'triangle', .03, 420) },
  still() { [660, 880, 1320].forEach((f, i) => setTimeout(() => this.tone(f, .8, 'sine', .05), i * 70)) },
  special(kind) {
    if (kind === 'twice') {                     // two blows, audibly two
      this.noise(.07, .13, 3200); this.tone(880, .06, 'square', .05, 520)
      setTimeout(() => { this.noise(.07, .13, 3200); this.tone(990, .06, 'square', .05, 560) }, 140)
    } else if (kind === 'now') {                // the wind-up, then the floor
      this.tone(200, .30, 'sine', .05, 70)
      setTimeout(() => { this.noise(.30, .22, 180); this.tone(62, .45, 'sawtooth', .16, 34) }, 320)
    } else {                                    // a shot that will not miss
      this.tone(300, .12, 'triangle', .06, 1200)
      setTimeout(() => { this.noise(.08, .07, 2200); this.tone(1480, .2, 'sine', .06, 2400) }, 150)
    }
  },
}
// ---- ambience: the room tone of wherever you are standing -----------------
// Not a loop and not a file. A fire within earshot spits every so often, and
// the rate falls off with distance, so a watchfire on the next street is a
// presence before it is a sight.
let _lastCrack = 0
function ambience(now) {
  if (!soundOn || !AC || AC.state !== 'running') return
  const s = curState, me = myId && s?.players?.[myId]
  if (!me) return
  let best = 99
  for (const n of Object.values(s.nodes ?? {})) {
    if (n.type !== 'campfire' && n.type !== 'fire' && n.type !== 'watchfire') continue
    if ((n.type === 'fire' && n.expiresAt <= s.tick) ||
        (n.type === 'watchfire' && (n.fuelUntil ?? 0) <= s.tick)) continue
    const d = Math.max(Math.abs(n.x - me.x), Math.abs(n.y - me.y))
    if (d < best) best = d
  }
  if (best > 9) return
  const near = 1 - best / 9
  if (now - _lastCrack > 90 + Math.random() * 700 / Math.max(.15, near)) {
    _lastCrack = now
    const a = SFX.ctx(); if (!a) return
    const g = a.createGain(); g.gain.value = .35 * near * near
    const n2 = a.sampleRate * .05, buf = a.createBuffer(1, n2, a.sampleRate), ch = buf.getChannelData(0)
    for (let i = 0; i < n2; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n2)
    const src = a.createBufferSource(); src.buffer = buf
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 2200
    src.connect(f); f.connect(g); g.connect(SFX.out()); src.start()
  }
}

// ---------------------------------------------------------------------------
// CHROME: carved stone with gold in the grooves
// ---------------------------------------------------------------------------
function rrect(g, x, y, w, h, r) {
  if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return }
  g.beginPath()
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r)
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h)
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r)
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath()
}
// A domed head of metal, which is the smallest unit of this style: everything
// here is either a dome, a band, or a hollow.
function boss(g, bx, by, r) {
  const bg = g.createRadialGradient(bx - r * .4, by - r * .45, 0, bx, by, r)
  bg.addColorStop(0, '#f6e2ac'); bg.addColorStop(.45, '#c39a44')
  bg.addColorStop(.82, '#7a5a1e'); bg.addColorStop(1, '#3a2a0e')
  g.fillStyle = bg; g.beginPath(); g.arc(bx, by, r, 0, 7); g.fill()
  g.strokeStyle = 'rgba(4,3,2,.7)'; g.lineWidth = 1
  g.beginPath(); g.arc(bx, by, r, 0, 7); g.stroke()
  g.fillStyle = 'rgba(255,246,214,.6)'
  g.beginPath(); g.ellipse(bx - r * .34, by - r * .38, r * .3, r * .2, -.6, 0, 7); g.fill()
}

// ---------------------------------------------------------------------------
// CHROME
// ---------------------------------------------------------------------------
// The second game's panels were carved: flat channels, hard corners, gold laid
// into a groove. This generation's are CAST -- rounded, high-relief, and lit as
// though the metal were still warm. So every frame here is a band with a
// gradient running across it, a bright edge on the top where the light lands,
// a dark edge underneath, and domes at the corners. It is more expensive than
// a stroked rectangle and it is the difference between furniture and a border.
function carve(g, x, y, w, h, opt) {
  const r = opt?.r ?? 16
  g.save()
  // the hollow: dark, warm, and deeper in the middle
  rrect(g, x, y, w, h, r)
  const bg = g.createLinearGradient(0, y, 0, y + h)
  bg.addColorStop(0, '#241c18'); bg.addColorStop(.42, '#150f11'); bg.addColorStop(1, '#0b0709')
  g.fillStyle = bg; g.fill()
  // grain, so the field is not a gradient
  g.save(); g.clip()
  const R = rng((x * 31 + y * 17 + w) | 0)
  for (let i = 0; i < (w * h) / 1100; i++) {
    g.fillStyle = R() > .5 ? 'rgba(255,226,178,.030)' : 'rgba(0,0,0,.11)'
    g.fillRect(x + R() * w, y + R() * h, 2, 2)
  }
  // light pooling at the top inside, the way it does in a cast basin
  const ig = g.createLinearGradient(0, y, 0, y + h * .5)
  ig.addColorStop(0, 'rgba(196,140,64,.10)'); ig.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = ig; g.fillRect(x, y, w, h * .5)
  g.restore()
  // the band
  const band = g.createLinearGradient(x, y, x + w * .35, y + h)
  band.addColorStop(0, '#4a3512'); band.addColorStop(.22, '#c9a554')
  band.addColorStop(.46, '#f2dda2'); band.addColorStop(.64, '#a88130')
  band.addColorStop(.85, '#7a5a1e'); band.addColorStop(1, '#2e2109')
  rrect(g, x + 3.5, y + 3.5, w - 7, h - 7, r - 3)
  g.strokeStyle = band; g.lineWidth = 7; g.stroke()
  // the light that lands on top of the band, and the shadow it throws below
  g.save(); rrect(g, x, y, w, h, r); g.clip()
  rrect(g, x + 3.5, y + 2.2, w - 7, h - 7, r - 3)
  g.strokeStyle = 'rgba(255,238,196,.34)'; g.lineWidth = 1.6; g.stroke()
  rrect(g, x + 3.5, y + 5.2, w - 7, h - 7, r - 3)
  g.strokeStyle = 'rgba(0,0,0,.42)'; g.lineWidth = 1.6; g.stroke()
  g.restore()
  // hard outline, so the slab reads against the world behind it
  rrect(g, x + .5, y + .5, w - 1, h - 1, r)
  g.strokeStyle = 'rgba(2,2,4,.9)'; g.lineWidth = 1.4; g.stroke()
  rrect(g, x + 7.5, y + 7.5, w - 15, h - 15, Math.max(2, r - 7))
  g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1; g.stroke()
  // and the rivets
  const inset = 13
  for (const [bx, by] of [[x + inset, y + inset], [x + w - inset, y + inset],
                          [x + inset, y + h - inset], [x + w - inset, y + h - inset]])
    boss(g, bx, by, 4.6)
  g.restore()
}

// A raised cartouche. The text is gold on a sunken bar with a warm bloom
// behind it, because this style never lets a heading simply sit on the field.
function plate(g, x, y, w, text) {
  g.save()
  rrect(g, x, y, w, 24, 11)
  const bg = g.createLinearGradient(0, y, 0, y + 24)
  bg.addColorStop(0, 'rgba(6,4,6,.85)'); bg.addColorStop(1, 'rgba(28,20,14,.85)')
  g.fillStyle = bg; g.fill()
  g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 1; g.stroke()
  const eg = g.createLinearGradient(x, 0, x + w, 0)
  eg.addColorStop(0, 'rgba(196,150,64,0)'); eg.addColorStop(.5, 'rgba(226,178,88,.55)')
  eg.addColorStop(1, 'rgba(196,150,64,0)')
  g.strokeStyle = eg; g.lineWidth = 1.4
  g.beginPath(); g.moveTo(x + 8, y + 23.4); g.lineTo(x + w - 8, y + 23.4); g.stroke()
  g.font = '700 12px Cinzel, Georgia, serif'
  g.textAlign = 'center'; g.textBaseline = 'middle'
  g.save(); g.letterSpacing = '3px'
  g.shadowColor = 'rgba(226,150,50,.55)'; g.shadowBlur = 10
  const tg = g.createLinearGradient(0, y + 4, 0, y + 20)
  tg.addColorStop(0, '#fbeec4'); tg.addColorStop(.55, '#d8b463'); tg.addColorStop(1, '#8a6524')
  g.fillStyle = tg
  g.fillText(text.toUpperCase(), x + w / 2, y + 12)
  g.restore()
  boss(g, x + 9, y + 12, 3.4); boss(g, x + w - 9, y + 12, 3.4)
  g.restore()
}

// A hollow with something resting in it. Hover fills the hollow with light
// rather than outlining it, which is what tells you the slot is live.
function slotFrame(g, x, y, s, hot) {
  g.save()
  rrect(g, x, y, s, s, 6)
  const bg = g.createLinearGradient(0, y, 0, y + s)
  bg.addColorStop(0, hot ? 'rgba(72,52,22,.95)' : 'rgba(9,7,8,.86)')
  bg.addColorStop(1, hot ? 'rgba(38,26,10,.95)' : 'rgba(16,12,12,.86)')
  g.fillStyle = bg; g.fill()
  if (hot) {
    g.save(); g.clip()
    const hg = g.createRadialGradient(x + s / 2, y + s / 2, 0, x + s / 2, y + s / 2, s * .7)
    hg.addColorStop(0, 'rgba(255,196,96,.28)'); hg.addColorStop(1, 'rgba(255,196,96,0)')
    g.fillStyle = hg; g.fillRect(x, y, s, s); g.restore()
  }
  rrect(g, x + .5, y + .5, s - 1, s - 1, 6)
  g.strokeStyle = 'rgba(0,0,0,.85)'; g.lineWidth = 1.6; g.stroke()
  rrect(g, x + 2, y + 2, s - 4, s - 4, 5)
  const rgd = g.createLinearGradient(x, y, x + s, y + s)
  rgd.addColorStop(0, hot ? '#f2dda2' : '#6a5220')
  rgd.addColorStop(.5, hot ? '#c39a44' : '#4a3512')
  rgd.addColorStop(1, hot ? '#8a6524' : '#2e2109')
  g.strokeStyle = rgd; g.lineWidth = 2; g.stroke()
  g.strokeStyle = 'rgba(255,238,196,.22)'; g.lineWidth = 1
  g.beginPath(); g.moveTo(x + 6, y + 2.6); g.lineTo(x + s - 6, y + 2.6); g.stroke()
  g.restore()
}

// ---------------------------------------------------------------------------
// THE ORB
// ---------------------------------------------------------------------------
// Glass over liquid. The surface is two sine waves at different speeds so it
// never repeats visibly; the meniscus climbs the glass at the edges; there is
// one specular crescent at the top left and one caustic pool at the bottom
// right, and the whole thing sits in a bevelled hole in the stone.
function orb(g, ox, oy, r, frac, col, now, label, value) {
  const f = clamp(frac, 0, 1)
  g.save()
  // the hole
  const hg = g.createRadialGradient(ox, oy - r * .3, r * .1, ox, oy, r * 1.16)
  hg.addColorStop(0, '#0b0808'); hg.addColorStop(1, '#000')
  g.fillStyle = hg
  g.beginPath(); g.arc(ox, oy, r * 1.1, 0, 7); g.fill()

  g.beginPath(); g.arc(ox, oy, r, 0, 7); g.clip()
  g.fillStyle = col.well
  g.beginPath(); g.arc(ox, oy, r, 0, 7); g.fill()

  // the body of the fluid, with a real surface
  const top = oy + r - 2 * r * f
  const lg = g.createLinearGradient(0, top, 0, oy + r)
  lg.addColorStop(0, col.hi); lg.addColorStop(.45, col.mid); lg.addColorStop(1, col.lo)
  g.fillStyle = lg
  g.beginPath()
  g.moveTo(ox - r, oy + r)
  const T = now / 1000
  for (let x = -r; x <= r; x += 3) {
    const w1 = Math.sin(x * .055 + T * 2.1) * 2.6
    const w2 = Math.sin(x * .021 - T * 1.35) * 3.4
    const edge = 1 - Math.abs(x / r)                    // the meniscus, climbing the glass
    g.lineTo(ox + x, top + w1 + w2 - edge * 1.2 + 2)
  }
  g.lineTo(ox + r, oy + r)
  g.closePath(); g.fill()
  // a lighter skin right at the surface
  g.strokeStyle = col.skin; g.lineWidth = 2
  g.beginPath()
  for (let x = -r; x <= r; x += 3) {
    const w1 = Math.sin(x * .055 + T * 2.1) * 2.6
    const w2 = Math.sin(x * .021 - T * 1.35) * 3.4
    const y2 = top + w1 + w2 - (1 - Math.abs(x / r)) * 1.2 + 2
    if (x === -r) g.moveTo(ox + x, y2); else g.lineTo(ox + x, y2)
  }
  g.stroke()
  // light gathering at the bottom of the bowl
  const cg = g.createRadialGradient(ox + r * .25, oy + r * .5, 0, ox + r * .25, oy + r * .5, r * .7)
  cg.addColorStop(0, col.caustic); cg.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = cg; g.beginPath(); g.arc(ox, oy, r, 0, 7); g.fill()
  // the glass itself
  const sg = g.createRadialGradient(ox - r * .38, oy - r * .46, 0, ox - r * .38, oy - r * .46, r * .78)
  sg.addColorStop(0, 'rgba(255,255,255,.30)'); sg.addColorStop(1, 'rgba(255,255,255,0)')
  g.fillStyle = sg; g.beginPath(); g.arc(ox, oy, r, 0, 7); g.fill()
  g.fillStyle = 'rgba(255,255,255,.16)'
  g.beginPath(); g.ellipse(ox - r * .34, oy - r * .5, r * .30, r * .16, -.6, 0, 7); g.fill()
  // the inside of the glass, darkening toward the rim
  const rg = g.createRadialGradient(ox, oy, r * .55, ox, oy, r)
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.62)')
  g.fillStyle = rg; g.beginPath(); g.arc(ox, oy, r, 0, 7); g.fill()
  g.restore()

  // the bezel: a cast torus with light on its upper shoulder, a dark underside,
  // and eight rivets around it. This is the piece that decides whether the orb
  // reads as a sphere set into metal or as a circle painted on stone.
  const ring = g.createLinearGradient(ox - r, oy - r, ox + r * .6, oy + r)
  ring.addColorStop(0, '#fbeec4'); ring.addColorStop(.20, '#d8b463')
  ring.addColorStop(.44, '#8a6524'); ring.addColorStop(.68, '#c39a44')
  ring.addColorStop(1, '#33240c')
  g.strokeStyle = ring; g.lineWidth = 9
  g.beginPath(); g.arc(ox, oy, r + 4, 0, 7); g.stroke()
  g.strokeStyle = 'rgba(255,244,208,.45)'; g.lineWidth = 2
  g.beginPath(); g.arc(ox, oy, r + 7.4, 3.5, 5.9); g.stroke()
  g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 2.4
  g.beginPath(); g.arc(ox, oy, r + 7.6, .5, 2.7); g.stroke()
  g.strokeStyle = 'rgba(2,2,4,.9)'; g.lineWidth = 1.4
  g.beginPath(); g.arc(ox, oy, r + 9, 0, 7); g.stroke()
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * 6.283 + .39
    boss(g, ox + Math.cos(a) * (r + 4), oy + Math.sin(a) * (r + 4), 3.1)
  }
  // the metal catches the fluid's own colour, faintly
  g.save(); g.globalCompositeOperation = 'lighter'
  const og = g.createRadialGradient(ox, oy, r * .8, ox, oy, r + 20)
  og.addColorStop(0, col.glow ?? 'rgba(0,0,0,0)'); og.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = og; g.beginPath(); g.arc(ox, oy, r + 20, 0, 7); g.fill(); g.restore()

  // under a third, the life orb bleeds down the stone
  if (col.bleeds && f < .34) {
    const k = (.34 - f) / .34
    for (let i = 0; i < 5; i++) {
      const dx = ox - r * .55 + i * r * .28
      const len = (12 + Math.sin(now / 700 + i * 2) * 8 + i * 5) * k
      g.fillStyle = 'rgba(140,14,10,' + (.5 * k) + ')'
      g.fillRect(dx, oy + r * .82, 2.6, len)
      g.beginPath(); g.arc(dx + 1.3, oy + r * .82 + len, 2, 0, 7); g.fill()
    }
  }
  // the reading, on its own darker plate: it sits on the fluid as well
  g.font = '700 ' + Math.round(clamp(r * .22, 9, 12)) + 'px Cinzel, Georgia, serif'
  g.textAlign = 'center'; g.textBaseline = 'middle'
  const wv = g.measureText(value).width
  const vh = Math.round(clamp(r * .30, 13, 17))
  rrect(g, ox - wv / 2 - 8, oy + r - vh - 4, wv + 16, vh, vh * .45)
  g.fillStyle = 'rgba(3,3,5,.86)'; g.fill()
  g.strokeStyle = 'rgba(232,209,153,.28)'; g.lineWidth = 1; g.stroke()
  g.fillStyle = col.text
  g.fillText(value, ox, oy + r - vh / 2 - 4)
  // ---- the label, on a plaque instead of inside the glass ----------------
  //
  // LIFE and TRAINING were drawn in a dim warm grey at the top of the fluid --
  // over bright red, over bright blue, and directly across the specular
  // highlight. There is no colour that reads there, because the background is
  // three different colours in the space of eight pixels and one of them is
  // nearly white. So the label comes OUT of the glass and onto a riveted
  // plaque straddling the bezel: a dark field of known value, gold caps, and
  // the trade's own mark struck beside it where there is one.
  {
    const txt = label.toUpperCase()
    const G2 = col.under ? Math.round(clamp(r * .26, 9, 13)) : 0
    g.font = '700 ' + Math.round(clamp(r * .19, 8, 10)) + 'px Cinzel, Georgia, serif'
    g.save(); g.letterSpacing = '1.6px'
    const tw = g.measureText(txt).width
    g.restore()
    // A PLAQUE IS WIDER THAN THE ORB IT SITS ON. "TRAINING" plus a mark is
    // eighty pixels against a forty-eight pixel globe, so on a phone it hangs
    // off the end of the slab. Drop the mark first (the trade is named under
    // the glass anyway), then clamp what is left inside the stone.
    let useGlyph = G2
    let pw = tw + 16 + (useGlyph ? useGlyph + 3 : 0)
    const room = PANEL_W / 2 - 10
    if (pw > room && useGlyph) { useGlyph = 0; pw = tw + 16 }
    const ph = Math.round(clamp(r * .30, 12, 17))
    const px2 = clamp(ox - pw / 2, PANEL_X + 6, PANEL_X + PANEL_W - pw - 6)
    const py2 = oy - r - ph * .45
    rrect(g, px2, py2, pw, ph, ph * .45)
    const bg = g.createLinearGradient(0, py2, 0, py2 + ph)
    bg.addColorStop(0, '#1c1611'); bg.addColorStop(1, '#0a0707')
    g.fillStyle = bg; g.fill()
    rrect(g, px2 + .5, py2 + .5, pw - 1, ph - 1, ph * .45)
    const bd = g.createLinearGradient(px2, 0, px2 + pw, 0)
    bd.addColorStop(0, '#6a5220'); bd.addColorStop(.5, '#e0bd6a'); bd.addColorStop(1, '#6a5220')
    g.strokeStyle = bd; g.lineWidth = 1.2; g.stroke()
    let tx2 = px2 + 8
    if (useGlyph) { g.drawImage(skillGlyph(col.under, useGlyph, 'bright'), tx2 - 1, py2 + (ph - useGlyph) / 2); tx2 += useGlyph + 3 }
    g.textAlign = 'left'; g.textBaseline = 'middle'
    g.font = '700 ' + Math.round(clamp(r * .19, 8, 10)) + 'px Cinzel, Georgia, serif'
    g.save(); g.letterSpacing = '1.6px'
    g.fillStyle = 'rgba(2,2,3,.85)'
    g.fillText(txt, tx2, py2 + ph / 2 + 1.2)
    const tg2 = g.createLinearGradient(0, py2 + 2, 0, py2 + ph - 2)
    tg2.addColorStop(0, '#fbeec4'); tg2.addColorStop(1, '#c39a44')
    g.fillStyle = tg2
    g.fillText(txt, tx2, py2 + ph / 2)
    g.restore()
    g.textAlign = 'center'
    boss(g, px2 + 4, py2 + ph / 2, 2)
    boss(g, px2 + pw - 4, py2 + ph / 2, 2)
  }
  if (col.under) {
    // the trade's name below the glass, on the stone where it reads plainly
    g.font = '700 ' + Math.round(clamp(r * .19, 8, 10)) + 'px Cinzel, Georgia, serif'
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'
    g.save(); g.letterSpacing = '1.5px'
    g.fillStyle = 'rgba(2,2,3,.9)'
    g.fillText(col.under.toUpperCase(), ox + 1, oy + r + 13)
    g.fillStyle = col.text
    g.fillText(col.under.toUpperCase(), ox, oy + r + 12)
    g.restore()
  }
}

// ---------------------------------------------------------------------------
// THE CONTROL PANEL
// ---------------------------------------------------------------------------
const PANEL_BTNS = [
  ['citizen', 'C', 'The citizen'], ['pack', 'I', 'The pack'],
  ['chart', 'M', 'The chart'], ['speak', 'T', 'Speak'],
  ['forge', 'F', 'The anvil'], ['door', 'X', 'The door'],
]

function drawPanel(g, now) {
  const s = curState
  const px0 = PANEL_X, py0 = PANEL_Y, R = ORB_R
  carve(g, px0, py0, PANEL_W, PANEL_H)
  const me = myId && s?.players?.[myId]

  // the middle begins where the orbs end
  const gut = R * 2 + 22
  const midX = px0 + gut, midW = PANEL_W - gut * 2
  const sk = lastXpSkill ?? 'woodcutting'
  const xp = me?.skills?.[sk] ?? 0
  const prog = progressAt(xp)
  const lv = prog.lv, frac = prog.frac

  // ---- the experience rule, across the top --------------------------------
  g.fillStyle = 'rgba(6,5,5,.9)'; g.fillRect(midX, py0 + 9, midW, 7)
  const xg = g.createLinearGradient(midX, 0, midX + midW, 0)
  xg.addColorStop(0, '#6a5220'); xg.addColorStop(1, '#f2dda2')
  g.fillStyle = xg; g.fillRect(midX + 1, py0 + 10, (midW - 2) * frac, 5)
  g.strokeStyle = 'rgba(106,82,32,.7)'; g.lineWidth = 1
  g.strokeRect(midX + .5, py0 + 9.5, midW - 1, 6)
  g.font = '600 8px Cinzel, Georgia, serif'
  g.textAlign = 'left'; g.textBaseline = 'middle'
  g.fillStyle = 'rgba(141,125,99,.9)'
  g.save(); g.letterSpacing = '1.5px'
  g.fillText((sk + '  ' + lv).toUpperCase(), midX + 2, py0 + 24); g.restore()
  g.textAlign = 'right'; g.font = '700 11px Cinzel, Georgia, serif'
  g.fillStyle = '#e8b53a'
  g.fillText((me?.gold ?? 0) + 'g', midX + midW - 2, py0 + 24)

  // ---- the two orbs -------------------------------------------------------
  const oy = py0 + PANEL_H / 2 + 3
  const hp = me?.hp ?? 0, maxHp = me ? maxHpOf(me) : 10
  orb(g, px0 + R + 13, oy, R, hp / Math.max(1, maxHp), {
    well: '#180505', lo: '#4a0806', mid: '#8f1d15', hi: '#cf2a18',
    skin: 'rgba(240,120,80,.55)', caustic: 'rgba(255,90,50,.16)',
    text: '#f0b8a0', bleeds: true, glow: 'rgba(200,40,20,.16)',
  }, now, 'life', hp + ' / ' + maxHp)
  // The right orb is not mana: this constitution has none. It is the WORK orb,
  // how far into your current trade's next level you are, which is the number
  // a citizen here actually watches -- and it fills as you swing rather than
  // draining as you cast.
  orb(g, px0 + PANEL_W - R - 13, oy, R, frac, {
    well: '#050a16', lo: '#0d1c3e', mid: '#1d3470', hi: '#4f8de6',
    skin: 'rgba(150,200,255,.5)', caustic: 'rgba(90,150,255,.16)',
    text: '#a8c8f0', bleeds: false, glow: 'rgba(60,120,240,.14)', under: sk,
  }, now, 'training', lv + '  \u00b7  ' + Math.round(frac * 100) + '%')
  // both orbs answer when asked
  regions.push({ x: px0 + 13, y: oy - R, w: R * 2, h: R * 2, act: { t: 'noop' },
                 tip: { title: 'Life  ' + hp + ' / ' + maxHp,
                        sub: 'Max life is your hitpoints level' } })
  regions.push({ x: px0 + PANEL_W - R * 2 - 13, y: oy - R, w: R * 2, h: R * 2, act: { t: 'noop' },
                 tip: { title: 'Training ' + sk + ' \u00b7 level ' + lv
                          + (prog.mastered ? '  \u00b7  mastered' : ''),
                        sub: prog.toNext.toLocaleString() + ' xp to ' + (lv + 1)
                             + '  \u00b7  it follows whatever you last worked at' } })

  // ---- belt and buttons, measured up from the bottom edge ------------------
  const BS = Math.round(clamp(PANEL_H * .29, 22, 44))
  const beltY = py0 + PANEL_H - 34 - BS
  const BR = Math.round(clamp(PANEL_H * .105, 9, 15))
  const btnY = py0 + PANEL_H - 15

  // ---- what the world has been saying -------------------------------------
  const logTop = py0 + 34
  const rows = Math.max(1, Math.min(3, Math.floor((beltY - 4 - logTop) / 14)))
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  g.font = '12px Georgia, serif'
  logLines.slice(-rows).forEach((l, i2) => {
    const age = (now - l.at) / 1000
    g.globalAlpha = clamp(1.4 - age / 22, .25, 1)
    g.fillStyle = LOGCOL[l.kind] ?? LOGCOL.plain
    g.fillText(l.text + (l.n > 1 ? '  \u00d7' + l.n : ''), midX + 2, logTop + i2 * 14, midW - 4)
  })
  g.globalAlpha = 1

  // ---- the belt -----------------------------------------------------------
  // Four things you can swallow without stopping what you are doing, filled
  // from the pack automatically because nobody has ever enjoyed loading a belt.
  beltMap = []
  const inv = me?.inventory ?? []
  for (const want of ['ale', 'broth', 'cooked-fish', 'cooked-deep-fish']) {
    const i2 = inv.findIndex((sl, ix) => sl && sl.item === want && !beltMap.some(b => b.slot === ix))
    if (i2 >= 0 && beltMap.length < 4) beltMap.push({ slot: i2, item: want, qty: inv[i2].qty ?? 1 })
  }
  const gap = Math.max(4, Math.round(BS * .16))
  const bx0 = midX + (midW - (BS * 5 + gap * 4)) / 2
  for (let i2 = 0; i2 < 4; i2++) {
    const bx = bx0 + i2 * (BS + gap)
    const hot = inRect(mouse, bx, beltY, BS, BS)
    slotFrame(g, bx, beltY, BS, hot)
    const b = beltMap[i2]
    if (b) {
      g.drawImage(itemIcon(b.item), bx + 4, beltY + 4, BS - 8, BS - 8)
      if (b.qty > 1) {
        g.font = '700 9px Cinzel, Georgia, serif'; g.textAlign = 'right'
        g.fillStyle = '#f2dda2'; g.fillText(String(b.qty), bx + BS - 3, beltY + BS - 3)
      }
    }
    // EVERY loop gets a tip, full or empty. Four numbered boxes with nothing in
    // them and no explanation is a puzzle, not an interface.
    regions.push({ x: bx, y: beltY, w: BS, h: BS, act: { t: 'belt', i: i2 },
                   tip: b ? { title: wordy(b.item), sub: 'Press ' + (i2 + 1) + ' to eat it \u00b7 restores health' }
                          : { title: 'Belt loop ' + (i2 + 1), sub: 'Cooked fish, ale and broth land here on their own' } })
    g.font = '600 8px Cinzel, Georgia, serif'; g.textAlign = 'left'
    g.fillStyle = 'rgba(141,125,99,.7)'
    g.fillText(String(i2 + 1), bx + 3, beltY + 10)
  }

  // ---- THE SPECIAL, next to the belt where a skill belongs -----------------
  // §6af puts three conditions on it and a menu buried them: the weapon must
  // have one, the target must be a citizen, and both of you must be standing in
  // the Wilds. So the button states the missing condition rather than greying
  // out silently, which is the only way anyone learns the rule.
  {
    const wep = me?.equipment?.weapon?.item
    const kind = SPEC_OF[wep]
    const tgt = me?.action?.type === 'attackp' ? me.action.targetId : null
    const q = tgt && s?.players?.[tgt]
    const wilds = me && q && inWilds(me.x, me.y) && inWilds(q.x, q.y)
    const ready = !!(kind && q && wilds)
    const why = !kind ? (wep ? 'no special on this weapon' : 'bare hands')
      : !q ? 'no citizen targeted' : !wilds ? 'only in the Wilds' : kind
    const sx2 = bx0 + 4 * (BS + gap) + gap, sy2 = beltY
    const hot = inRect(mouse, sx2, sy2, BS, BS)
    slotFrame(g, sx2, sy2, BS, hot && ready)
    g.save()
    g.globalAlpha = ready ? 1 : .38
    // a struck anvil-spark glyph: the arm spent twice over
    const c2 = sx2 + BS / 2, cy3 = sy2 + BS / 2
    g.strokeStyle = ready ? '#f2dda2' : '#8a7f68'; g.lineWidth = 2.2
    g.beginPath(); g.moveTo(c2 - 9, cy3 + 8); g.lineTo(c2 + 7, cy3 - 8); g.stroke()
    g.beginPath(); g.moveTo(c2 - 3, cy3 + 9); g.lineTo(c2 + 10, cy3 - 4); g.stroke()
    g.strokeStyle = ready ? '#fff6d6' : '#6a6252'; g.lineWidth = 1
    g.beginPath(); g.moveTo(c2 - 9, cy3 + 8); g.lineTo(c2 + 7, cy3 - 8); g.stroke()
    if (ready) {
      g.save(); g.globalCompositeOperation = 'lighter'
      const gg2 = g.createRadialGradient(c2, cy3, 0, c2, cy3, BS * .6)
      gg2.addColorStop(0, 'rgba(255,206,110,' + (.22 + Math.sin(now / 300) * .12).toFixed(2) + ')')
      gg2.addColorStop(1, 'rgba(255,206,110,0)')
      g.fillStyle = gg2; g.beginPath(); g.arc(c2, cy3, BS * .6, 0, 7); g.fill(); g.restore()
    }
    g.restore()
    g.font = '600 8px Cinzel, Georgia, serif'; g.textAlign = 'left'
    g.fillStyle = 'rgba(141,125,99,.7)'
    g.fillText('5', sx2 + 3, sy2 + 10)
    regions.push({ x: sx2, y: sy2, w: BS, h: BS, act: { t: 'special' },
                   tip: { title: 'Special attack' + (kind ? ' \u00b7 ' + kind : ''),
                          sub: ready ? 'Key 5 \u00b7 spends the next swing as well as this one' : why,
                          col: ready ? '#f2dda2' : '#c98b5a' } })
  }

  // ---- the buttons --------------------------------------------------------
  const bgap = Math.max(4, Math.round(BR * .55))
  const bw = PANEL_BTNS.length * (BR * 2 + bgap) - bgap
  let bxx = midX + (midW - bw) / 2
  for (const [id, key, title] of PANEL_BTNS) {
    const ccx = bxx + BR, ccy = btnY
    const on = paneOpen(id) || (id === 'chart' && showChart)
    const hot = Math.hypot(mouse.x - ccx, mouse.y - ccy) < BR + 2
    const bg = g.createRadialGradient(ccx, ccy - BR * .4, 1, ccx, ccy, BR)
    bg.addColorStop(0, on ? '#5a4620' : hot ? '#3a2f1c' : '#231c16')
    bg.addColorStop(1, '#0c0908')
    g.fillStyle = bg; g.beginPath(); g.arc(ccx, ccy, BR, 0, 7); g.fill()
    g.strokeStyle = on ? '#f2dda2' : hot ? '#b0913f' : '#6a5220'; g.lineWidth = 1.4
    g.beginPath(); g.arc(ccx, ccy, BR, 0, 7); g.stroke()
    g.font = '700 ' + Math.max(9, Math.round(BR * .8)) + 'px Cinzel, Georgia, serif'
    g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillStyle = on ? '#fbeec4' : '#b0913f'
    g.fillText(key, ccx, ccy + .5)
    regions.push({ x: ccx - BR, y: ccy - BR, w: BR * 2, h: BR * 2, act: { t: 'btn', id },
                   tip: { title, sub: null } })
    bxx += BR * 2 + bgap
  }
  g.textBaseline = 'alphabetic'
}

// ---------------------------------------------------------------------------
// THE PACK
// ---------------------------------------------------------------------------
// Twenty-eight slots is exactly seven by four, which is a piece of luck this
// window is going to take.
function drawPack(g, now) {
  const s = curState, me = myId && s?.players?.[myId]
  const x = VW - PANE_W - 14, y = Math.max(12, VH - PANEL_H - PANE_H - 8)
  regions.push({ x, y, w: PANE_W, h: PANE_H, act: { t: 'panebg' } })
  regions.push({ x, y, w: PANE_W, h: PANE_H, act: { t: 'panebg' } })
  carve(g, x, y, PANE_W, PANE_H)
  plate(g, x + 14, y + 14, PANE_W - 28, giveTo ? 'Choose an offer' : 'The Pack')
  regions.push({ x: x + PANE_W - 34, y: y + 12, w: 24, h: 24, act: { t: 'close', which: 'right' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + PANE_W - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + PANE_W - 22, y + 25)
  if (!me) return
  const S = 44, GAP = 3, gx = x + (PANE_W - (S * 7 + GAP * 6)) / 2, gy = y + 52
  for (let i = 0; i < 28; i++) {
    const cxx = gx + (i % 7) * (S + GAP), cyy = gy + ((i / 7) | 0) * (S + GAP)
    const sl = me.inventory?.[i]
    const hot = inRect(mouse, cxx, cyy, S, S)
    slotFrame(g, cxx, cyy, S, hot && sl)
    if (!sl) continue
    g.drawImage(itemIcon(sl.item), cxx + 5, cyy + 5, S - 10, S - 10)
    if ((sl.qty ?? 1) > 1) {
      g.font = '700 9px Cinzel, Georgia, serif'; g.textAlign = 'right'; g.textBaseline = 'alphabetic'
      g.fillStyle = 'rgba(4,3,5,.8)'; g.fillRect(cxx + S - 22, cyy + S - 13, 20, 11)
      g.fillStyle = '#e8d199'; g.fillText(String(sl.qty), cxx + S - 4, cyy + S - 4)
    }
    regions.push({ x: cxx, y: cyy, w: S, h: S, act: { t: 'slot', i },
                   tip: { title: wordy(sl.item), sub: useVerbLabel(sl.item, me), col: rarityOf(sl.item),
                          worth: PRICES[sl.item] } })
  }
  // the sentence under the grid: what the buttons do, in the window's voice
  const fy = gy + 4 * (S + GAP) + 12
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  g.font = '11.5px Georgia, serif'; g.fillStyle = giveTo ? '#e8d199' : '#8d7d63'
  g.fillText(giveTo ? 'Click what you will offer. Escape to withdraw.'
                    : 'Left click to use. Right click for everything else.', x + 20, fy + 12)
  const free = 28 - (me.inventory ?? []).filter(Boolean).length
  g.fillStyle = free ? '#8d7d63' : '#c98b5a'
  g.fillText(free + ' slot' + (free === 1 ? '' : 's') + ' free', x + 20, fy + 30)
  g.textAlign = 'right'; g.fillStyle = '#e8b53a'
  g.font = '700 14px Cinzel, Georgia, serif'
  g.fillText((me.gold ?? 0) + ' gold', x + PANE_W - 20, fy + 30)
}

// ---------------------------------------------------------------------------
// THE CITIZEN
// ---------------------------------------------------------------------------
function drawCitizen(g, now) {
  const s = curState, me = myId && s?.players?.[myId]
  const x = 14, y = Math.max(12, VH - PANEL_H - PANE_H - 8)
  carve(g, x, y, PANE_W, PANE_H)
  plate(g, x + 14, y + 14, PANE_W - 28, 'The Citizen')
  regions.push({ x: x + PANE_W - 34, y: y + 12, w: 24, h: 24, act: { t: 'close', which: 'left' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + PANE_W - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + PANE_W - 22, y + 25)
  if (!me) return

  // name, calling, standing
  g.textAlign = 'center'
  g.font = '900 19px Cinzel, Georgia, serif'; g.fillStyle = '#e8d199'
  g.fillText(me.name || 'unnamed', x + PANE_W / 2, y + 58)
  g.font = '600 10px Cinzel, Georgia, serif'; g.fillStyle = '#8d7d63'
  g.save(); g.letterSpacing = '2.5px'
  g.fillText((callingOf(me) + '  \u00b7  standing ' + standingOf(me)).toUpperCase(), x + PANE_W / 2, y + 76)
  g.restore()

  // ---- the paperdoll: three slots and a body ------------------------------
  const dy = y + 92, dh = 96
  const gear = [['head', x + 26, dy + 6], ['weapon', x + 26, dy + 54], ['body', x + PANE_W - 70, dy + 30]]
  for (const [slot, sx2, sy2] of gear) {
    const it = me.equipment?.[slot]?.item
    const hot = inRect(mouse, sx2, sy2, 44, 44)
    slotFrame(g, sx2, sy2, 44, hot && it)
    if (it) {
      g.drawImage(itemIcon(it), sx2 + 5, sy2 + 5, 34, 34)
      regions.push({ x: sx2, y: sy2, w: 44, h: 44, act: { t: 'unequip', slot },
                     tip: { title: wordy(it), sub: 'Click to take off', col: rarityOf(it) } })
    } else {
      g.font = '600 8px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
      g.fillStyle = 'rgba(106,82,32,.6)'
      g.fillText(slot.toUpperCase(), sx2 + 22, sy2 + 22)
    }
  }
  // the citizen themself, standing between their gear
  g.save(); g.translate(0, 0)
  const bItem = me.equipment?.body?.item, bStar = bItem?.startsWith('star-')
  humanoid(g, x + PANE_W / 2 - 4, dy + dh, {
    scale: 1.25, bulk: 1, cloak: '#6e1f19', coat: '#4a1512', cape: capeOf(me),
    plate: bStar ? ['#9db4cc', '#4a5a70'] : bItem ? ['#8a6a34', '#3f2f14'] : ['#4a4034', '#251f18'],
    tunic: bItem ? (bStar ? '#7d90a8' : '#6a5230') : '#3a3226',
    boots: '#241d16', hair: '#2e2418',
    helm: me.equipment?.head?.item ? (me.equipment.head.item.startsWith('star-') ? '#9db4cc' : '#8a6a34') : null,
    step: 0, swing: -0.55, lantern: true, breath: performance.now() / 700,
    weapon: me.equipment?.weapon?.item
      ? (gg, hx, hy, a, sc) => drawWeapon(gg, hx, hy, a, sc, me.equipment.weapon.item) : null,
  })
  g.restore()

  // ---- every trade, and how far into it you are ---------------------------
  const ly = dy + dh + 14
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  const colW = (PANE_W - 44) / 2
  SKILL_ORDER.forEach((sk, i) => {
    const col = i % 2, row = (i / 2) | 0
    const sx2 = x + 22 + col * colW, sy2 = ly + row * 24
    const xp = me.skills?.[sk] ?? 0
    const pr = progressAt(xp), lv = pr.lv, f = pr.frac
    g.drawImage(skillGlyph(sk, 13, pr.mastered ? 'bright' : 'gold'), sx2, sy2 - 3)
    g.font = '10.5px Georgia, serif'
    g.fillStyle = pr.mastered ? '#e8d199' : '#a2957c'
    g.fillText(sk, sx2 + 18, sy2 + 8)
    g.textAlign = 'right'
    g.font = '700 11px Cinzel, Georgia, serif'
    g.fillStyle = pr.mastered ? '#e8d199' : '#cdbb99'
