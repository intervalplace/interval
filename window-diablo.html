<!doctype html>
<!-- INTERVAL: the lantern window.
     ==========================================================================
     Interval already had a dark window. `window-grim.html` is the flat window
     with the lights turned down, and `window-grim3d.html` is the deluxe window
     graded blue-black. Both are reskins, and a reskin is exactly what this one
     is not, because the thing worth taking from that lineage of games was
     never the palette.

     What makes a Diablo look like a Diablo is FOUR structural decisions, and
     none of them is a colour:

       1. THE CAMERA IS TURNED FORTY-FIVE DEGREES. The grid is still a grid --
          the constitution's grid, tile for tile -- but you never see it
          square-on. Every tile is a 2:1 diamond, every standing thing is a
          billboard on that diamond, and the world is sorted back-to-front by
          x+y. Depth is the whole point: things get in front of other things.

       2. YOU CARRY THE LIGHT. Not "the scene is dark" -- the scene is BLACK,
          and a guttering pool travels with you. Every fire in the world is a
          real light source punched out of that black, so a watchfire is
          visible as a glow on the horizon before it is visible as a fire.
          Interval's day/night cycle feeds the ambient; the torch never leaves.

       3. THE PANEL IS THE INTERFACE. Two glass orbs full of liquid, a belt of
          four things you can swallow without stopping, and everything else
          behind a button. The orbs are not gauges drawn as circles: the fluid
          has a surface, the surface has waves, the glass has a highlight, and
          under a third the life orb bleeds down the stone.

       4. THE WORLD ANSWERS THE CURSOR. Hover a beast and its name and health
          hang at the top of the screen. Hover anything at all and it lifts out
          of the murk. Hold ALT and every item on the ground names itself at
          once. Hold the button down and you keep walking.

     Everything below the wire is presentation and nothing else. This window
     signs the same inputs with the same key, mirrors the same geography from
     the same `terrain-mirror.mjs`, and carries the same constitutional
     identity block as every other window. It cannot see, do, or know one thing
     the flat window cannot. It simply stands somewhere darker.

     Serve it from the pillar: add to serve.mjs
       if (path === '/play/lantern' || path === '/diablo')
         return sendFile('./window-diablo.html', 'text/html')

     Left click: walk, gather, fight, take.  Hold: keep walking.
     Right click (in the pack): use the thing.  Shift+click: stand and strike.
     I pack · C citizen · TAB chart · ENTER speak · ALT name the ground ·
     1-4 the belt · ESC close.
     ========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Interval — the lantern window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  /* The whole window is one canvas. This stylesheet exists to hold the door
     open (the gate below), to kill every browser affordance that would break
     the illusion, and to name the palette once so the canvas code and the
     gate cannot drift apart. */
  :root {
    --void:    #050406;   /* the pitch behind the world */
    --crypt:   #0d0a0c;   /* panel field */
    --stone:   #221c18;   /* carved stone */
    --iron:    #3b322a;   /* the lit edge of carved stone */
    --gold-lo: #6a5220;
    --gold:    #b0913f;
    --gold-hi: #e8d199;
    --parch:   #cdbb99;
    --dim:     #8d7d63;
    --blood:   #7e130f;
    --blood-hi:#cf2a18;
    --ember:   #e07526;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--void);
    color: var(--parch);
    font: 13px/1.5 Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body { cursor: none; }            /* the window draws its own hand */
  canvas { display: block; touch-action: none; }
  #stage { position: fixed; inset: 0; }

  /* ---- the gate ---------------------------------------------------------
     Every one of these games opens on a still, dark room with fire in it and
     asks for your name before it will let you in. That moment is not a
     loading screen: it is the last second of not being there yet. */
  #gate {
    position: fixed; inset: 0; z-index: 40; cursor: default;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 70% 46% at 50% 116%, rgba(190,86,22,.30), transparent 64%),
      radial-gradient(ellipse 90% 70% at 50% -14%, rgba(38,20,30,.75), transparent 72%),
      #060406;
    text-align: center; padding: 24px;
    /* a gate must never be taller than it can show: with a portrait in it
       the plate can outgrow a laptop, and a centred flex column clips at
       BOTH ends with no way to reach either */
    overflow-y: auto;
  }
  #gate.gone { display: none; }
  #gate .emberwash {                /* the fire outside the frame, breathing */
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 46% 30% at 50% 108%, rgba(224,117,38,.34), transparent 70%);
    animation: gutter 5.5s ease-in-out infinite;
  }
  @keyframes gutter { 0%,100% { opacity: .55 } 37% { opacity: 1 } 62% { opacity: .72 } }
  @media (prefers-reduced-motion: reduce) { #gate .emberwash { animation: none; opacity: .8 } }

  #gate h1 {
    font: 900 clamp(38px, 9vw, 84px)/1 Cinzel, Georgia, serif;
    letter-spacing: .20em; text-indent: .20em; margin-bottom: 6px;
    background: linear-gradient(#f6e6b4 6%, #c39c3e 46%, #6d4c14 78%, #b8892c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #1a0f06) drop-shadow(0 0 26px rgba(224,117,38,.42));
    position: relative;
  }
  #gate .sub {
    font: 600 12px/1 Cinzel, Georgia, serif; letter-spacing: .42em; text-indent: .42em;
    color: #7d6a4c; margin-bottom: 30px; text-transform: uppercase;
  }
  #gate .rule {                     /* a hairline with a lozenge in it */
    width: min(420px, 74vw); height: 9px; margin-bottom: 30px; position: relative;
    background: linear-gradient(90deg, transparent, #55431e 22%, #55431e 78%, transparent);
    background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 4px;
  }
  #gate .rule::after {
    content: ''; position: absolute; left: 50%; top: 0; width: 9px; height: 9px;
    margin-left: -4.5px; background: #6a5220; transform: rotate(45deg);
    box-shadow: 0 0 0 1px #241a0c;
  }
  #gate .plate {                    /* the carved slab the controls sit in */
    background: linear-gradient(#181310, #0d0a08);
    border: 1px solid #3b2f1c; box-shadow: inset 0 0 0 1px #0a0705, 0 8px 30px rgba(0,0,0,.7);
    padding: 22px 26px 20px; width: min(430px, 92vw);
  }
  #gate label {
    display: block; font: 600 10px/1 Cinzel, Georgia, serif;
    letter-spacing: .28em; text-indent: .28em; color: #7d6a4c; margin-bottom: 9px;
    text-transform: uppercase;
  }
  #gate input {
    width: 100%; padding: 10px 12px; background: #070505; color: var(--gold-hi);
    border: 1px solid #4a3a20; outline: none;
    font: 600 15px/1 Cinzel, Georgia, serif; letter-spacing: .06em; text-align: center;
  }
  #gate input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(176,145,63,.28) }
  #gate .why { font-size: 11.5px; color: #6f6250; margin-top: 9px; min-height: 17px; font-style: italic }

  .dbtn {
    display: block; width: 100%; margin-top: 16px; padding: 12px 10px; cursor: pointer;
    background: linear-gradient(#3a2c14, #1d1409); color: var(--gold-hi);
    border: 1px solid #6a5220;
    font: 700 13px/1 Cinzel, Georgia, serif; letter-spacing: .22em; text-indent: .22em;
    text-transform: uppercase; transition: background .16s, border-color .16s, color .16s;
  }
  .dbtn:hover { background: linear-gradient(#4e3b1a, #2a1d0c); border-color: var(--gold); color: #fbf0cf }
  .dbtn:active { background: #1a1208 }
  .dbtn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px }
  .dbtn[disabled] { opacity: .45; cursor: default }

  #gate .face { margin: 16px 0 4px; display: flex; flex-direction: column; align-items: center }
  #gate .face canvas {
    width: 132px; height: 176px; image-rendering: auto;
    border: 1px solid #33291a; border-radius: 6px;
    background: radial-gradient(ellipse at 50% 62%, #241d16 0%, #100c0a 72%);
    box-shadow: inset 0 0 26px rgba(0,0,0,.7);
  }
  #gate .facebtns { display: flex; align-items: center; gap: 14px; margin-top: 8px }
  #gate .facebtns span { font-size: 11.5px; color: #6f6250; min-width: 74px; text-align: center;
    font-style: italic }
  #gate .facebtns button {
    background: linear-gradient(#2a2119, #17120d); border: 1px solid #4a3c20;
    color: var(--gold); border-radius: 5px; width: 34px; height: 26px; font-size: 15px;
    cursor: pointer; line-height: 1;
  }
  #gate .facebtns button:hover { border-color: var(--gold); background: linear-gradient(#3a2e20, #221a12) }
  #gate .minor { display: flex; gap: 18px; justify-content: center; margin-top: 22px; flex-wrap: wrap }
  #gate .minor button {
    background: none; border: none; cursor: pointer; color: #6f6250;
    font: 600 10px/1 Cinzel, Georgia, serif; letter-spacing: .16em; text-transform: uppercase;
  }
  #gate .minor button:hover { color: var(--gold) }
  #gate .foot { margin-top: 26px; font-size: 11.5px; color: #4e4437; max-width: 46ch; line-height: 1.7 }
  #gate .foot a { color: #6a5c46 }

  /* the one DOM survivor inside the world: a text field, because a canvas
     cannot take a keyboard on a phone. It sits over the message strip. */
  #say {
    position: fixed; z-index: 30; display: none;
    background: rgba(6,5,7,.94); color: var(--gold-hi);
    border: 1px solid var(--gold-lo); outline: none; padding: 7px 10px;
    font: 13px/1 Georgia, serif;
  }
  #say.on { display: block }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<!-- §6as-iii: how you swing. Kept out of the ring menu on purpose: it is a
     standing choice, not a thing you pick per blow. -->
<div id="stylebar" title="how you swing: 1 aim, 2 even, 3 force"
  style="position:fixed;left:10px;bottom:10px;z-index:25;font:10px Verdana"></div>
<input id="say" maxlength="80" autocomplete="off" spellcheck="false">

<div id="gate">
  <div class="emberwash"></div>
  <h1>INTERVAL</h1>
  <div class="sub">The Lantern Window</div>
  <div class="rule"></div>
  <div class="plate">
    <label for="gname">Name yourself</label>
    <input id="gname" maxlength="12" placeholder="unnamed" autocomplete="off" spellcheck="false">
    <div class="why" id="gwhy">A name costs 50 standing. You may walk in without one.</div>
    <div class="face">
      <canvas id="gface" width="132" height="176"></canvas>
      <div class="facebtns">
        <button id="gprev" title="Previous">&lsaquo;</button>
        <span id="glook">—</span>
        <button id="gnext" title="Next">&rsaquo;</button>
      </div>
    </div>
    <button class="dbtn" id="genter">Enter the world</button>
    <div class="minor">
      <button id="gkey">Your key</button>
      <button id="gimport">Bring a key</button>
      <button id="gsound">Sound: on</button>
      <button id="gmusic">Theme: on</button>
      <button id="gquality">Bloom: on</button>
    </div>
  </div>
  <p class="foot">The world is not in this page. It is a rule for turning one
  state into the next, agreed six hundred milliseconds at a time. This window
  only decides where to stand and how much light to admit.</p>
</div>

<script>
'use strict'
// ============================ GEOGRAPHY IS LAW ============================
// An inlined copy of terrain-mirror.mjs, exports stripped, byte for byte
// identical otherwise. Every window carries this so that no two citizens can
// disagree about where the Fens end. If this copy drifts, this window is in
// breach and should be refused at the door.
// ==========================================================================
// terrain-mirror.js — the window's copy of the world's own geography.
//
// This file used to exist THREE TIMES: once inside window-web.html, once
// inside window-3d.html, once inside window-photo.html, ~1,300 lines each,
// pasted. The copies had not yet disagreed about a single tile — 210,432
// were checked — but they had already drifted in two places that simply
// had not bitten yet:
//
//   * window-photo's copy had a RENDERING function (buildBridges, which
//     touches THREE and the scene graph) wedged inside the terrain block,
//     so the "pure functions" were not pure.
//   * window-3d's copy of the landmark registry was thirteen nouns behind,
//     and nothing noticed because nothing in that window ever read it.
//
// The reason this matters more here than in an ordinary codebase: geography
// is law. Two citizens whose windows disagree about where the Fens end
// cannot arrange to meet there. A copy that drifts is a window in breach of
// the constitution, and the previous arrangement had no way to find out.
// Now there is one file, and test/mirror.test.mjs checks it against the
// engine tile for tile.
//
// Everything here is a PURE FUNCTION of (generator, seed, size). No state,
// no tick, no player. Call configure() once when the world announces
// itself; call it again and every cache is dropped.

let W = 192, H = 96
let GEN = 'interval-classic-v1', GSEED = ''

function configure(opts = {}) {
  W = opts.worldW ?? opts.W ?? W
  H = opts.worldH ?? opts.H ?? H
  GEN = opts.generator ?? opts.gen ?? GEN
  GSEED = opts.seed ?? opts.genesisSeed ?? GSEED
  // a new world means every memo is about the old one
  _wet4 = null; _wetFor = null; _sea4 = null; _riv4 = null; _seaFor = null
  _roadBmp = null; _roadBmpFor = null
  _seedNumC = null
  _ssE = null
  _roadSet = null; _roadBridges = null
  _ss3 = null
  _roads3 = null
  _shore4 = null
  _bio4 = null
  _ss4 = null
  _cost4 = null
  _roads4 = null
  _wallSet = null
  _signs = null
  _wallTick = -1; _signTick = -1
  return { W, H, GEN, GSEED }
}
const dims = () => ({ W, H, GEN, GSEED })

// V5 CHANGED THE FURNITURE, NOT THE LAND.
//
// worldgen-expanse5's own header says it: v4's land is right and stays exactly
// as it is, and nothing in v5 touches any of it. Every terrain function below
// is therefore correct for both -- but a check written `GEN === 'interval-
// expanse-v4'` silently falls through to the v3 branch for a v5 world, which
// is a whole island of wrong ground from one string comparison. window-web
// learned this and fixed it locally; this module did not, and since the module
// exists precisely so the windows cannot drift apart, the fix belongs here.
const IS_EXPANSE4 = () => GEN === 'interval-expanse-v4' || GEN === 'interval-expanse-v5'

const tileHash = (x, y, salt) => {
  let h = (x * 374761393 + y * 668265263 + salt * 1442695041) >>> 0
  h = (h ^ (h >> 13)) >>> 0; h = (h * 1274126177) >>> 0
  return (h ^ (h >> 16)) >>> 0
}

let _seedNumC = null, _ssE = null
function seedNumC() {
  if (_seedNumC !== null) return _seedNumC
  let h = 0
  for (let i = 0; i < GSEED.length; i++) h = Math.imul(h ^ GSEED.charCodeAt(i), 2654435761) | 0
  return (_seedNumC = h >>> 0)
}
function thashE(x, y, k) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(k | 0, 2246822519) + seedNumC()) | 0
  h = Math.imul(h ^ (h >>> 13), 1274126177)
  return (h ^ (h >>> 16)) >>> 0
}
function meander(tag, u, seg, amp) {
  const k = Math.floor(u / seg)
  const f = (u - k * seg) / seg
  const a = (thashE(k, 0, tag) % (2 * amp + 1)) - amp
  const b = (thashE(k + 1, 0, tag) % (2 * amp + 1)) - amp
  const sf = f * f * (3 - 2 * f)
  return a + (b - a) * sf
}
function riverXE(y) {
  const cx = Math.floor(W / 2)
  return cx + Math.round(meander(21, y, 46, 26) + meander(22, y, 14, 5))
}
function inSeaE(x, y) {
  const bx = W * 0.80, by = H * 0.74
  if (x < bx || y < by) return false
  return (x - bx) / (W - bx) + (y - by) / (H - by) > 0.55
}
function inPoolE(x, y) {
  if (y < H * 0.66) return false
  const bx = Math.floor(x / 7), by = Math.floor(y / 7)
  const h = thashE(bx, by, 7)
  if ((h & 255) > 34) return false
  const px = bx * 7 + ((h >>> 8) % 5), py = by * 7 + ((h >>> 16) % 5)
  return Math.abs(x - px) + Math.abs(y - py) <= 2
}
const isWaterE = (x, y) => inSeaE(x, y) || inPoolE(x, y) || Math.abs(x - riverXE(y)) <= 1
function settlementsE() {
  if (GEN === 'interval-expanse-v6') return settlementsE6()
  if (IS_EXPANSE4()) return settlementsE4()
  if (GEN === 'interval-expanse-v3') return settlementsE3()
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2)
  if (GEN === 'interval-expanse-v2') {
    // v2: the water towns stand on their water. Millbrook and Fenmarch on
    // the river's east bank, Eastmere opening on the bay. Mirror of
    // worldgen-expanse2.mjs settlementsOf, tile for tile.
    const mby = Math.round(H * 0.24), fmy = Math.round(H * 0.84)
    return [
      { x: cx, y: cy, w: 24, h: 14 },
      { x: Math.round(W * 0.46), y: Math.round(H * 0.14), w: 14, h: 10 },
      { x: riverXE(mby) + 6, y: mby, w: 14, h: 10 },
      { x: Math.round(W * 0.86), y: Math.round(H * 0.50), w: 14, h: 10 },
      { x: Math.round(W * 0.85), y: Math.round(H * 0.80), w: 14, h: 10 },
      { x: riverXE(fmy) + 6, y: fmy, w: 14, h: 10 },
      { x: Math.round(W * 0.26), y: Math.round(H * 0.46), w: 16, h: 12 },
    ]
  }
  return [
    { x: cx, y: cy, w: 24, h: 14 },
    { x: Math.round(W * 0.46), y: Math.round(H * 0.14), w: 14, h: 10 },
    { x: Math.round(W * 0.72), y: Math.round(H * 0.24), w: 14, h: 10 },
    { x: Math.round(W * 0.86), y: Math.round(H * 0.50), w: 14, h: 10 },
    { x: Math.round(W * 0.74), y: Math.round(H * 0.70), w: 14, h: 10 },
    { x: Math.round(W * 0.44), y: Math.round(H * 0.84), w: 14, h: 10 },
    { x: Math.round(W * 0.26), y: Math.round(H * 0.46), w: 16, h: 12 },
  ]
}
const ssE = () => (_ssE ??= settlementsE())
let _roadSet = null, _roadBridges = null
function roadTilesE() {
  if (_roadSet) return _roadSet
  const ss = ssE(), a = ss[0]
  const set = new Set()
  for (let i = 1; i < ss.length; i++) {
    const s = ss[i]
    const vx = s.x - a.x, vy = s.y - a.y
    const L = Math.sqrt(vx * vx + vy * vy)
    const nx = -vy / L, ny = vx / L
    const steps = Math.ceil(L * 2)
    for (let stp = 0; stp <= steps; stp++) {
      const t = stp / steps
      const taper = Math.min(1, Math.min(t, 1 - t) * 6)
      const o = meander(90 + i, t * L, 26, 9) * taper
      const px = Math.round(a.x + vx * t + nx * o)
      const py = Math.round(a.y + vy * t + ny * o)
      set.add(px + ',' + py); set.add((px + 1) + ',' + py)
    }
  }
  return (_roadSet = set)
}
const onRoadE = (x, y) => roadTilesE().has(x + ',' + y)
function biomeAtE(x, y) {
  if (x <= Math.round(W * 0.19)) return 'wilds'
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2)
  const dx = (x - cx) / W, dy = (y - cy) / H
  if (dx * dx + dy * dy < 0.019) return 'meadow'
  if (y <= H * 0.32) return 'greenwood'
  if (x >= W * 0.70) return 'crags'
  if (y >= H * 0.70) return 'fens'
  return 'meadow'
}
function fordE(x, y) { // mirror of fordAt: the road crosses, and every main street crosses
  if (onRoadE(x, y)) return true
  for (const s of ssE()) {
    if (Math.abs(x - s.x) <= (s.w >> 1) && Math.abs(y - s.y) <= (s.h >> 1)
      && (x === s.x || y === s.y)) return true
  }
  return false
}
// ---- the third expanse (interval-expanse-v3): the island, mirrored ----
// An exact mirror of worldgen-expanse3.mjs: the coast by octant arithmetic
// (no atan2. ECMA-262 leaves it implementation-defined), the borders that
// are features, the road graph, and the fords painted as bridges.
function angleOf3(dx, dy) {
  const ax = dx < 0 ? -dx : dx, ay = dy < 0 ? -dy : dy
  if (ax === 0 && ay === 0) return 0
  if (dx > 0 && dy >= 0) return ax >= ay ? (ay / ax) * 45 : 90 - (ax / ay) * 45
  if (dx <= 0 && dy > 0) return ay > ax ? 90 + (ax / ay) * 45 : 180 - (ay / ax) * 45
  if (dx < 0 && dy <= 0) return ax >= ay ? 180 + (ay / ax) * 45 : 270 - (ax / ay) * 45
  return ay > ax ? 270 + (ax / ay) * 45 : 360 - (ay / ax) * 45
}
function coastR3(u0) {
  const u = ((u0 % 360) + 360) % 360
  let r = 0.80 + meander(301, u / 5, 10, 12) / 130 + meander(302, u / 5, 4, 6) / 160
  const bump = (c, w2, amt) => {
    const d1 = u - c < 0 ? c - u : u - c
    const d = d1 < 360 - d1 ? d1 : 360 - d1
    if (d < w2) r += amt * (1 - d / w2)
  }
  bump(180, 28, +0.18); bump(150, 12, -0.09); bump(210, 12, -0.09)
  bump(38, 22, -0.12); bump(78, 16, -0.07); bump(0, 14, +0.07); bump(305, 18, +0.06)
  return r
}
function inSeaBase3(x, y) {
  const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2)
  const r = Math.sqrt(dx * dx + dy * dy)
  if (r <= 0.52) return false
  return r > coastR3(angleOf3(dx, dy))
}
const emY3 = () => Math.round(H * 0.75)
const _shore3 = new Map()
function bayShoreX3(y) {
  if (_shore3.has(y)) return _shore3.get(y)
  let sx = null
  for (let x = W - 4; x >= Math.floor(W / 2); x--) if (!inSeaBase3(x, y)) { sx = x; break }
  _shore3.set(y, sx); return sx
}
function isles3() {
  const ey = emY3(), sh = bayShoreX3(ey) ?? Math.round(W * 0.7)
  return [{ x: sh + 22, y: ey + 26, rx: 10, ry: 7 }, { x: Math.round(W * 0.185), y: Math.round(H * 0.10), rx: 8, ry: 5 }]
}

function planConnected4(rows, cx, cy) {
  const pw = rows[0].length, ph = rows.length
  const x0 = cx - (pw >> 1), y0 = cy - (ph >> 1)
  const at = (x, y) => { const rx = x - x0, ry = y - y0
    return (rx < 0 || ry < 0 || rx >= pw || ry >= ph) ? null : rows[ry][rx] }
  const openAt = (x, y) => { const ch = at(x, y)
    if (ch === null) return false
    if (ch === '=') return true            // decking is footing
    if (isWater4(x, y)) return false
    return OPEN4.has(ch) || ch === ' ' }
  let sx = cx, sy = cy
  if (!openAt(sx, sy)) {
    outer: for (let r = 1; r < Math.max(pw, ph); r++)
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue
        if (openAt(cx + dx, cy + dy)) { sx = cx + dx; sy = cy + dy; break outer } }
  }
  const seen = new Set([sx + ',' + sy]); const q = [[sx, sy]]; let h = 0
  while (h < q.length) { const [x, y] = q[h++]
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy, k = nx + ',' + ny
      if (seen.has(k) || !openAt(nx, ny)) continue
      seen.add(k); q.push([nx, ny]) } }

  for (let ry = 0; ry < ph; ry++) for (let rx = 0; rx < pw; rx++) {
    const ch = rows[ry][rx]
    if (OPEN4.has(ch) || ch === ' ' || ch === '=' || ch === '~' || !(ch in LEG4)) continue
    if (!ESS.has(LEG4[ch])) continue
    const x = x0 + rx, y = y0 + ry
    if (isWater4(x, y)) continue
    if (![[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => seen.has((x+dx)+','+(y+dy)))) return false }
  return true
}

// ---------------------------------------------------------------------------
// THE GOING
// ---------------------------------------------------------------------------
// A road runs dead straight because there is nothing for it to bend around.
// Cost is uniform WITHIN a biome, so across the Heartlands or the Downs every
// tile is worth the same and the cheapest path is the shortest one -- and the
// straight-line pull below then finishes the job. The result is a ruler line
// across a country, which is a surveyor's road, and this generator's own
// comment says it does not want one.
//
// So the ground gets texture at a scale smaller than a country: patches of
// easier and harder going, eight tiles across, the way real ground is boggy
// here and firm there. A road that costs a little more through a soft patch
// goes round it, and the bends come from the land rather than from a wobble
// laid over the top.
//
// INTEGERS ONLY, and no Math.sin. This value feeds the router's frontier, and
// the router's contract (spec 9b) is that two nodes computing the same world
// get the same road to the tile. Trigonometry is not bit-identical across
// engines; a 32-bit integer hash is.

// ---------------------------------------------------------------------------
// THE LIE OF THE LAND
// ---------------------------------------------------------------------------
// The going alone was not enough, and the render says so: several roads came
// out exactly as long as the straight line between their ends. Patches of soft
// ground eight tiles across average out over two hundred tiles, so the router
// walked through them and stayed on its ruler.
//
// What makes a real road wander is not soft ground, it is HEIGHT. A road would
// rather go a long way round than climb, which is why they follow valleys and
// contour along hillsides and arrive at a pass rather than at a summit. So the
// land is given a height, and a step is charged for what it climbs.
//
// The field is smooth -- bilinear between lattice points thirty-two tiles
// apart -- because a road follows a slope, and a slope needs somewhere to run
// downhill TO. A blocky field gives cliffs and cliffs give staircases.
//
// Integers throughout, and no trigonometry: this decides where the roads are,
// and spec 9b says two nodes computing the same world must get the same road.
const ELEV_SHIFT = 5;                                    // 32 tiles per lattice step
function elevHash(salt, gx, gy) {
  let h = (Math.imul(gx, 1597334677) + Math.imul(gy, 3812015801) + salt) | 0;
  h = Math.imul(h ^ (h >>> 15), 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 3266489917) | 0;
  return (h ^ (h >>> 16)) & 255;
}
function elevAt(salt, x, y) {
  // TWO OCTAVES. One lattice at thirty-two tiles gives a landscape of broad
  // hills -- and between them, flats, where a road has nothing to respond to
  // and runs dead straight for sixty tiles. Sixty tiles is nearly forty
  // seconds of walking with the world unchanging, which is the exact stretch
  // that feels drawn rather than travelled.
  //
  // So a finer octave over the top: eight-tile undulations at a third of the
  // weight. Not hills -- rises and dips, the scale of a field. A road answers
  // them with small corrections all the way along, and a road that is always
  // correcting is a road that was walked.
  return Math.floor((octave(salt, x, y, 5) * 5 + octave(salt ^ 0x51ed, x, y, 3) * 3) / 8);
}
function octave(salt, x, y, shift) {
  const S = 1 << shift, MASK = S - 1;
  const gx = x >> shift, gy = y >> shift;
  const fx = x & MASK, fy = y & MASK;
  const a = elevHash(salt, gx, gy), b = elevHash(salt, gx + 1, gy);
  const c = elevHash(salt, gx, gy + 1), d = elevHash(salt, gx + 1, gy + 1);
  const sm = (f) => Math.floor((3 * f * f * S - 2 * f * f * f) / (S * S));
  const u = sm(fx), v = sm(fy);
  const top = a * (S - u) + b * u;
  const bot = c * (S - u) + d * u;
  return Math.floor((top * (S - v) + bot * v) / (S * S));
}

// ---------------------------------------------------------------------------
// One integer, 0-255, and this window's reading of it. Every window is free to
// read the same number differently -- that is the point of storing a seed
// rather than a description -- but within THIS window the mapping is fixed, so
// the same citizen is the same person in every session and on every machine.
//
// Absent a look, the key stands in for it, which is what the window always did.
const SKINS = ['#e6b98f', '#d6a074', '#b9825a', '#8f5f3d', '#6b452b', '#4a2f1e', '#f0cfa8', '#c99168']
const HAIRS = ['#2a1f16', '#4a3524', '#6b4a2a', '#8a6a34', '#b08a4a', '#8a8a8a', '#c8c0b0', '#5a2a1a']
const COATS = ['#6e1f19', '#2f4a6e', '#3a5a34', '#5a3a6e', '#6e5220', '#2f2f38', '#7a4020', '#245a5a']
function lookOf(p, id) {
  const n = Number.isInteger(p?.look) ? p.look : (hash32(String(id ?? 'x')) & 255)
  return {
    n,
    skin: SKINS[n & 7],
    hair: HAIRS[(n >> 3) & 7],
    hairStyle: (n >> 6) & 3,
    beard: ((n >> 5) & 1) === 1,
    coat: COATS[(n >> 2) & 7],
    bulkish: ((n >> 7) & 1) ? 1.12 : 0.94,
    seed: n * 2654435761 % 65536,
  }
}
const LOOK_COUNT = 256

// ---------------------------------------------------------------------------
// THE ARMS OF A TOWN (spec 2g)
// ---------------------------------------------------------------------------
// A banner carries a tag and nothing else. What that tag LOOKS like is each
// window's business -- but within a window it must be fixed, so that a citizen
// who learns Anchor's colours keeps knowing them.
//
// The tinctures are the real ones and the rule of tincture is kept: a colour
// is never laid on a colour, nor a metal on a metal, which is why real heraldry
// reads at a distance and invented heraldry usually does not.
const TINCTURES = {
  gules: '#9d2222', azure: '#24467f', sable: '#231f22',
  vert: '#2c5c30', purpure: '#5b2a63', tenne: '#8a4a1e',
}
const METALS = { or: '#d8ab3e', argent: '#dcd8cc' }
const CHARGES = ['pale', 'fess', 'cross', 'saltire', 'chevron', 'lozenge', 'roundel', 'bend']
function armsOf(tag) {
  const h = hash32(String(tag ?? 'x'))
  const cols = Object.values(TINCTURES), mets = Object.values(METALS)
  const flip = ((h >> 11) & 1) === 1        // metal field with a colour charge
  const colour = cols[h % cols.length]
  const metal = mets[(h >> 5) % mets.length]
  return {
    field: flip ? metal : colour,
    charge: flip ? colour : metal,
    kind: CHARGES[(h >> 7) % CHARGES.length],
    tail: ((h >> 13) & 1) === 1,            // swallow-tailed, or square
  }
}

// ===========================================================================
// THE WIRE
// ---------------------------------------------------------------------------
// Character for character the same handshake as every other window, because a
// window that invents its own is not a window into the same world. Two paths:
//
//   * The browser holds an Ed25519 key. It says `adopt`, then signs each input
//     itself and sends it as `raw`. The pillar relays; the engine judges. This
//     is the real one, and it is what a citizen wants: the pillar holds
//     nothing, and the same key works from any window on any machine.
//   * The browser cannot do Ed25519 (older Safari, some locked-down builds).
//     It says `auth` with a local uid and the pillar keeps a key on its
//     behalf. Fewer verbs reach the engine this way -- the pillar's `act`
//     table is shorter than the constitution's -- so the window says so out
//     loud rather than letting deeds vanish quietly.
// ===========================================================================

// the engine's canonical encoding, replicated exactly: signatures must agree
// to the byte or every node in the world will ignore us
function canonicalJS(obj) {
  if (obj === null || typeof obj !== 'object') return JSON.stringify(obj)
  if (Array.isArray(obj)) return '[' + obj.map(canonicalJS).join(',') + ']'
  return '{' + Object.keys(obj).sort().map(k => JSON.stringify(k) + ':' + canonicalJS(obj[k])).join(',') + '}'
}
const toHex = (buf) => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('')
const fromHex = (h) => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)))

async function ownIdentity() {
  if (!crypto?.subtle) return null
  try {
    const saved = localStorage.getItem('interval-ownkey')
    if (saved) {
      const { pk8, pub } = JSON.parse(saved)
      const priv = await crypto.subtle.importKey('pkcs8', fromHex(pk8), { name: 'Ed25519' }, true, ['sign'])
      return { priv, pub }
    }
    const kp = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify'])
    const pub = toHex(await crypto.subtle.exportKey('raw', kp.publicKey))
    const pk8 = toHex(await crypto.subtle.exportKey('pkcs8', kp.privateKey))
    localStorage.setItem('interval-ownkey', JSON.stringify({ pk8, pub }))
    try { localStorage.setItem('interval-keyout:' + pub, 'yes') } catch {}   // §0e: it came from somewhere, so it is somewhere
    return { priv: kp.privateKey, pub }
  } catch { return null }
}

// what the citizen may carry out of here, and bring back in
async function exportKey() {
  const saved = localStorage.getItem('interval-ownkey')
  if (!saved) return null
  return 'interval-key-v1.' + JSON.parse(saved).pk8
}
async function importKey(str) {
  const s = String(str ?? '').trim()
  let pk8 = null
  if (s.startsWith('interval-key-v1.')) pk8 = s.slice('interval-key-v1.'.length).trim()
  else { try { const j = JSON.parse(s); pk8 = j.pk8 ?? j.privateKey ?? j.priv ?? null } catch {} }
  if (!pk8 || !/^[0-9a-f]{80,200}$/.test(pk8)) return 'That is not a key this window can read.'
  try {
    const priv = await crypto.subtle.importKey('pkcs8', fromHex(pk8), { name: 'Ed25519' }, true, ['sign'])
    // the public half is the last 32 bytes of the pkcs8 seed export path; derive
    // it honestly by signing nothing and letting the pillar refuse a bad pair
    const jwk = await crypto.subtle.exportKey('jwk', priv)
    const pub = toHex(Uint8Array.from(atob(jwk.x.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)))
    localStorage.setItem('interval-ownkey', JSON.stringify({ pk8, pub }))
    return null
  } catch { return 'That key did not import. It may be from another curve.' }
}

let ws = null, reconnectAt = 0
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host)
  ws.onopen = async () => {
    connected = true
    ownKey = await ownIdentity()
    if (ownKey) { usingRelay = false; ws.send(JSON.stringify({ type: 'adopt', pub: ownKey.pub })) }
    else { usingRelay = true; ws.send(JSON.stringify({ type: 'auth', uid })) }
  }
  ws.onclose = () => {
    connected = false
    say('The world has gone quiet. Listening for it again\u2026', 'warn')
    setTimeout(connect, 2000)
  }
  ws.onerror = () => { try { ws.close() } catch {} }
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data) } catch { return }
    if (m.type === 'hello') { myId = m.playerId; return }
    if (m.type === 'nought') { noughtPeerSaw(m.at); return }   // §0: another resident, walking
    if (m.type === 'state') { onState(m.state, m.worldId); return }
    if (m.type === 'refused') {
      // WHY a thing did not happen. Without this, a refused deed and a dead
      // socket are the same observation. A move can be refused through nobody's
      // fault -- the input is stamped for the tick AFTER the frame it was
      // planned from, and beasts wander every tick -- so the transient ones say
      // so, and a citizen learns which refusals to argue with.
      // attribute the refusal to whatever order is standing, so a bounded
      // give-up can report how many the world turned down
      if (typeof intent === 'object' && intent) intent.refused = (intent.refused ?? 0) + 1
      // A REFUSED MOVE IS THE ENGINE TELLING THE WINDOW IT IS WRONG ABOUT THE
      // GROUND. Remember the tile it refused and never plan through it again.
      if (m.of === 'move' && planned) {
        refusedTiles.add(planned.x + ',' + planned.y)
        planned = null
      }
      // A REFUSED APPEARANCE IS THE ONE REFUSAL A CITIZEN CANNOT SEE.
      //
      // Everything else that gets turned down leaves a mark -- you do not move,
      // the item stays in the vault. A look that is refused looks exactly like
      // a look that was never sent, so it has to name itself. The commonest
      // cause by far is a world founded before `set_look` existed: the rules
      // hash is part of the founding, so an older world does not have the verb
      // and never will.
      if (m.of === 'set_look') {
        // and say WHICH refusal it was. The first version of this asserted the
        // world was too old, which was one possible cause presented as the
        // only one -- and it was wrong: the real cause was a race with spawn.
        // A guess in the voice of a diagnosis sends somebody looking in the
        // wrong place, which is worse than saying nothing.
        say('The world would not take that appearance: ' + (m.why ?? 'no reason given')
          + '. (If it says the verb is unknown, the world was founded before the rule.)', 'warn')
      }
      const transient = /occupied|blocked|adjacent|reach|tick/i.test(m.why ?? '')
      say('Refused: ' + (m.of ?? '?') + (m.why ? ' \u2014 ' + m.why : '')
        + (transient ? ' (try again)' : ''), 'warn')
      return
    }

      const where = sp ? localeAt4(sp.x, sp.y) : null

// At most two ticks of lookahead. Beyond that an eager clicker stamps
// ever-further futures and each impatient click makes the world LESS
// responsive. Resync whenever the stamp leaves the window it may occupy in
// either direction: reconnecting to an earlier state used to strand it in a
// future that never arrived, and every step was refused forever after.
function allocTick() {
  const cur = world?.tick ?? 0

  const t = Math.max(cur + 1, lastStamped + 1)

}

async function send(a) {
  // §0: NOTHING A RESIDENT DOES IS IN THE WORLD. Movement is local and stays
  // local; knocking and crossing go out; everything else is refused here rather
  // than by the engine, because the engine would refuse it anyway and the
  // person deserves to be told why.
  // §0: a resident's deeds go to the LOCAL world. `attend` and `spawn` are the
  // only two things a soul in Nought says to Tallyholm.
  if (inNought && !NOUGHT_ALLOWED.has(a.do)) { noughtDo(a); return }
  if (!ws || ws.readyState !== 1) { say('Not connected to the world.', 'warn'); return }
  // the window sent it, so the window knows what it was: everything except a
  // footstep gets a gesture and a mark (52-scene). Local, presentational, and
  // it makes no claim the engine has to honour.
  if (a.do !== 'move') { try { noteDeed(a.do) } catch {} }
  if (usingRelay) { ws.send(JSON.stringify({ type: 'act', action: a })); return }
  const f = BRIDGE_TO_INPUT(a)
  if (!f) { say('This window has no wiring for "' + a.do + '" yet.', 'warn'); return }
  if (!curWorldId) { say('Still learning which world this is.', 'dim'); return }
  // ownIdentity() is awaited inside ws.onopen, so an eager click can arrive on an
  // open socket before the key exists. That used to throw here and swallow the deed.
  if (!ownKey) { say('Still finding your key\u2026', 'dim'); return }
  const tk = a._tick ?? allocTick()
  if (tk === null) {
    // THE TICK LINE IS FULL, AND THAT IS NOT THE SAME AS "NEVER MIND".
    //
    // This used to `return` on every kind of deed, with a comment claiming the
    // click in flight would do the job. True for a footstep -- a walk re-plans
    // itself every tick and loses nothing. Utterly false for a deposit: you
    // walk to the vault (two moves stamped, the window full), the pane opens,
    // you click, and the input is dropped in silence. "Nothing happens at all"
    // is exactly what that looks like from the outside.
    //
    // A one-shot deed waits its turn instead.
    if (a.do === 'move') return
    if (outbox.length < 8) outbox.push(a)
    return
  }
  const input = { worldId: curWorldId, tick: tk, playerId: ownKey.pub, ...f }
  try {
    const sig = toHex(await crypto.subtle.sign('Ed25519', ownKey.priv,
      new TextEncoder().encode(DOMAIN_INPUT + canonicalJS(input))))
    ws.send(JSON.stringify({ type: 'raw', input: { ...input, sig } }))
  } catch { say('This browser refused to sign that.', 'warn') }
}

async function speak(text) {
  const t = String(text ?? '').trim().slice(0, 80)
  if (!t) return
  if (usingRelay) { ws.send(JSON.stringify({ type: 'act', action: { do: 'chat', text: t } })); return }
  if (!curWorldId || !ownKey) return
  const msg = { type: 'chat', worldId: curWorldId, playerId: ownKey.pub, tick: world?.tick ?? 0, text: t }
  const sig = toHex(await crypto.subtle.sign('Ed25519', ownKey.priv,
    new TextEncoder().encode(DOMAIN_CHAT + canonicalJS(msg))))
  ws.send(JSON.stringify({ type: 'rawsay', msg: { ...msg, sig } }))
}

// THE FORGE
// ---------------------------------------------------------------------------
// Every pixel in this window is painted here, once, into an offscreen canvas
// and then blitted. Nothing is loaded; there are no assets. The world is a
// pure function of its seed and so, as far as it can manage, is its portrait.
//
// The rule the art obeys, and the reason it does not look like the flat window
// with the lights off:
//
//   * ONE LIGHT, UPPER LEFT, and one bounce. Every solid gets a lit facet, a
//     mid facet and a shadow facet, never a flat fill and an outline.
//   * SILHOUETTE FIRST. These sprites are seen against near-black at a
//     distance, so the outline has to carry the noun on its own. Detail is
//     spent on the edge, not the middle.

//     only where fire or magic touches it, so the fires are the only saturated
//     things on the screen and the eye goes to them.

// the shadow every standing thing casts on its diamond

// ---- a house, which is really four decisions ------------------------------
// A building is the single biggest thing the turned camera buys you, so these
// get the most care: two wall faces at different values, a roof with pitch and
// courses, an eave that overhangs, and a window with a fire behind it.
function paintBuilding(g, W, H, opt) {
  const R = opt.R, wall = opt.wall, roof = opt.roof, glow = opt.glow

  const fx = cx, fy = base                      // front (nearest) corner
  const lx = cx - bw, ly = base - bw / 2

  const bx = cx + bd - bw, by = base - bw / 2 - bd / 2

  // left wall (lit) and right wall (shadowed)

    const t = i / 5

  }

  const ov = 7
  const rlx = lx - ov, rly = ly - ov / 2, rfx = fx, rfy = fy + ov / 2
  const rrx = rx + ov, rry = ry - ov / 2, rbx = bx, rby = by - ov
  const ridgeA = [(rlx + rbx) / 2, (rly + rby) / 2 - bh - rh]
  const ridgeB = [(rfx + rrx) / 2, (rfy + rry) / 2 - bh - rh]
  poly(g, [[rlx, rly - bh], [rfx, rfy - bh], ridgeB, ridgeA], roof.lit)
  poly(g, [[rfx, rfy - bh], [rrx, rry - bh], ridgeB, ridgeA[0] === ridgeB[0] ? ridgeA : ridgeB], roof.dark)
  poly(g, [[rrx, rry - bh], [rbx, rby - bh], ridgeA, ridgeB], roof.dark)

  g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 1
  for (let i = 1; i < 6; i++) {
    const t = i / 6
    g.beginPath()
    g.moveTo(rlx + (ridgeA[0] - rlx) * t, rly - bh + (ridgeA[1] - (rly - bh)) * t)
    g.lineTo(rfx + (ridgeB[0] - rfx) * t, rfy - bh + (ridgeB[1] - (rfy - bh)) * t)
    g.stroke()
  }

  g.strokeStyle = 'rgba(255,232,190,.16)'; g.lineWidth = 1.6
  g.beginPath(); g.moveTo(ridgeA[0], ridgeA[1]); g.lineTo(ridgeB[0], ridgeB[1]); g.stroke()

  const dw = 11, dh = 19
  const dcx = lx + (fx - lx) * .55, dcy = ly + (fy - ly) * .55
  poly(g, [[dcx - dw / 2, dcy + dw / 4], [dcx + dw / 2, dcy - dw / 4],
           [dcx + dw / 2, dcy - dw / 4 - dh], [dcx - dw / 2, dcy + dw / 4 - dh]], '#0b0806')
  g.strokeStyle = 'rgba(190,150,90,.30)'; g.lineWidth = 1.2
  poly(g, [[dcx - dw / 2, dcy + dw / 4], [dcx + dw / 2, dcy - dw / 4],
           [dcx + dw / 2, dcy - dw / 4 - dh], [dcx - dw / 2, dcy + dw / 4 - dh]], null, 'rgba(190,150,90,.30)', 1.2)
  // a window with something burning behind it

    const wx = lx + (fx - lx) * .22, wy = ly + (fy - ly) * .22 - bh * .58
    poly(g, [[wx - 4, wy + 2], [wx + 4, wy - 2], [wx + 4, wy - 11], [wx - 4, wy - 7]], glow)
    const gg = g.createRadialGradient(wx, wy - 4, 0, wx, wy - 4, 22)
    gg.addColorStop(0, 'rgba(232,150,52,.45)'); gg.addColorStop(1, 'rgba(232,150,52,0)')
    g.fillStyle = gg; g.beginPath(); g.arc(wx, wy - 4, 22, 0, 7); g.fill()
  }

    const sx = fx + 13, sy = fy - bh * .78
    g.strokeStyle = '#2a231a'; g.lineWidth = 2
    g.beginPath(); g.moveTo(fx + 1, sy - 7); g.lineTo(sx, sy - 7); g.lineTo(sx, sy - 2); g.stroke()
    poly(g, [[sx - 7, sy - 2], [sx + 7, sy - 2], [sx + 7, sy + 9], [sx - 7, sy + 9]], '#221a12', '#5c4726', 1)
    g.fillStyle = opt.sign.c; g.font = '700 9px Cinzel, Georgia, serif'
    g.textAlign = 'center'; g.textBaseline = 'middle'

  }
}

// ---- a tree, which is really a silhouette ---------------------------------
function paintTree(g, W, H, R, style) {
  const cx = W / 2, base = H - 6
  const dead = style === 'dead' || style === 'burnt'
  const trunkC = style === 'burnt' ? ['#191413', '#2a2220', '#0d0a0a']
               : dead ? ['#2e281f', '#463c2e', '#191512']
               : ['#2c241a', '#463829', '#161109']
  groundShadow(g, cx + 4, base - 2, 26, 11, .55)
  const th = 30 + R() * 16
  // trunk with a root flare, drawn as a tapered polygon rather than a rectangle
  poly(g, [[cx - 7, base], [cx - 3, base - th], [cx + 3.5, base - th], [cx + 8, base]], trunkC[0])
  poly(g, [[cx - 7, base], [cx - 3, base - th], [cx - 1, base - th], [cx - 3, base]], trunkC[1])
  poly(g, [[cx + 3, base], [cx + 3.5, base - th], [cx + 8, base]], trunkC[2])
  g.strokeStyle = trunkC[2]; g.lineWidth = 1
  for (let i = 0; i < 4; i++) {                // bark
    const t = R()
    g.beginPath(); g.moveTo(cx - 5 + t * 11, base - 2); g.lineTo(cx - 3 + t * 8, base - th + 4); g.stroke()
  }
  // limbs
  const limbs = dead ? 6 : 4
  g.strokeStyle = trunkC[0]; g.lineCap = 'round'
  for (let i = 0; i < limbs; i++) {
    const a = -0.35 - R() * 2.4, len = 12 + R() * 20
    const bx = cx, by = base - th * (0.5 + R() * 0.5)
    g.lineWidth = 3.4 - i * 0.3
    g.beginPath(); g.moveTo(bx, by)
    const mx = bx + Math.cos(a) * len * .6, my = by + Math.sin(a) * len * .6
    g.quadraticCurveTo(mx, my, bx + Math.cos(a - .3) * len, by + Math.sin(a - .3) * len)
    g.stroke()
  }
  if (!dead) {
    // foliage: overlapping masses, dark, with the light only on the upper left
    const cy = base - th - 12
    const blobs = []
    for (let i = 0; i < 7; i++)
      blobs.push([cx + (R() - .5) * 40, cy + (R() - .5) * 26, 13 + R() * 12])
    const dark = style === 'pine' ? '#161f16' : '#1a2116'
    const mid = style === 'pine' ? '#22301f' : '#28331f'
    const lit = style === 'pine' ? '#38492c' : '#41512c'
    for (const [bx, by, br] of blobs) { g.fillStyle = dark; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill() }
    for (const [bx, by, br] of blobs) { g.fillStyle = mid; g.beginPath(); g.arc(bx - br * .12, by - br * .16, br * .78, 0, 7); g.fill() }
    for (const [bx, by, br] of blobs) { g.fillStyle = lit; g.beginPath(); g.arc(bx - br * .3, by - br * .34, br * .38, 0, 7); g.fill() }
    // a scatter of leaf edge on the lit side, so the mass has a texture
    for (let i = 0; i < 40; i++) {
      const b = blobs[(R() * blobs.length) | 0]
      const a = R() * 7, rr = b[2] * (.5 + R() * .55)
      g.fillStyle = R() > .6 ? '#4d5c33' : '#2e3a22'
      g.fillRect(b[0] + Math.cos(a) * rr, b[1] + Math.sin(a) * rr * .8, 2, 2)
    }
  }
}

// ---- rock, boulder, ore ---------------------------------------------------
function paintRock(g, W, H, R, style) {
  const cx = W / 2, base = H - 5
  const s = style === 'magic' ? 1.05 : 1
  const w = (17 + R() * 8) * s, h = (15 + R() * 9) * s
  groundShadow(g, cx + 3, base - 1, w + 8, (w + 8) / 2.2, .55)
  const top = [], n = 7
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2
    top.push([cx + Math.cos(a) * w * (.7 + R() * .4), base - h + Math.sin(a) * w * .34 * (.7 + R() * .4)])
  }
  const body = style === 'magic' ? ['#3a3a4c', '#4c4c64', '#22222e']
             : style === 'dark' ? ['#2b2825', '#3d3934', '#171514']
             : ['#3a352e', '#4e4840', '#1f1c19']
  // the mass: sides first, then the lit cap
  poly(g, [...top.map(p => [p[0], p[1]]), ...top.slice().reverse().map(p => [p[0] * .96 + cx * .04, base])], body[0])
  poly(g, top, body[1])
  // facets
  for (let i = 0; i < n; i++) {
    const a = top[i], b = top[(i + 1) % n]
    const dark = a[0] + b[0] > cx * 2
    poly(g, [a, b, [b[0], base], [a[0], base]], dark ? body[2] : body[0])
  }
  poly(g, top, body[1])
  g.strokeStyle = 'rgba(255,240,214,.13)'; g.lineWidth = 1.4
  g.beginPath(); g.moveTo(top[4][0], top[4][1]); g.lineTo(top[5][0], top[5][1]); g.lineTo(top[6 % n][0], top[6 % n][1]); g.stroke()
  // cracks
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1
  for (let i = 0; i < 4; i++) {
    const x = cx + (R() - .5) * w, y = base - h * R() * .9
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 12, y + 5 + R() * 8); g.stroke()
  }
  if (style === 'ore') {                       // metal in the stone
    for (let i = 0; i < 7; i++) {
      const x = cx + (R() - .5) * w * 1.2, y = base - R() * h
      g.fillStyle = R() > .5 ? '#8a6a34' : '#5e4a26'
      g.beginPath(); g.arc(x, y, 1.3 + R() * 1.4, 0, 7); g.fill()
      g.fillStyle = 'rgba(255,214,140,.5)'; g.fillRect(x - .6, y - 1.2, 1.2, 1.2)
    }
  }
}

// ---- humanoids ------------------------------------------------------------
// Everything with two legs in this world is drawn by this one function, which
// is why the keeper at her counter and the citizen at the anvil look like they
// come from the same island.
//
// `bulk` is what separates them. At 0 you get a person: a keeper, a guard, a
// smith, drawn at human proportions. At 1 you get an ADVENTURER in this
// generation's sense, which is a specific and slightly absurd silhouette --
// pauldrons wider than the hips, a coat that flares from the belt to the
// ankles, a forward hunch as though walking into weather, and a weapon scaled
// past anything a body could actually swing. It reads at forty tiles, which is
// the entire justification: in a turned camera at this distance you know who
// is a citizen and who is scenery from the shoulders alone.
const shade = (hex, k) => {
  const n = parseInt(String(hex).slice(1), 16)
  const r = Math.round(((n >> 16) & 255) * k), g2 = Math.round(((n >> 8) & 255) * k)

function humanoid(g, cx, base, o) {
  // one fixed grain per body, so the weave does not crawl between frames
  const R2 = rng((o.seed ?? 1) * 2654435761 % 2147483647)
  const s = o.scale ?? 1
  const bulk = o.bulk ?? 0
  const cloak = o.cloak, tunic = o.tunic, skin = o.skin ?? '#8d6a4a'
  const lean = o.lean ?? 0, step = o.step ?? 0, swing = o.swing ?? 0
  const bob = Math.sin(step) * 1.6 * s
    + (o.breath ? Math.sin(o.breath) * .55 * (o.breathDeep ?? 1) * s : 0)
  // A POSE, for the deeds that are over in a tick. `crouch` drops the whole
  // body and pitches it forward, which is most of what kneeling, planting,
  // lighting and burying look like from this angle; `pitch` leans without
  // dropping. Both are zero for an ordinary citizen and cost nothing.
  const crouch = (o.crouch ?? 0) * 9 * s
  const pitch = (o.pitch ?? 0) * 4 * s
  const hunch = bulk * 2.6 * s + (o.pitch ?? 0) * 5 * s

  g.beginPath(); g.moveTo(cx + 2 * s, hipY); g.lineTo(cx + 2 * s + lb, base); g.stroke()
  // 6ce: GREAVES, over the boot and short of the ankle, so the leg still reads
  // as a leg that walks. Gold defends nothing -- being seen IS the item -- so a
  // window that skipped this would have made four hundred hours at the seam buy
  // an invisible thing. Stroked over the limb rather than drawn beside it,
  // because this window builds a body out of strokes and a rectangle would sit
  // on it like a sticker.
  if (o.greaves) {
    g.strokeStyle = o.greaves; g.lineWidth = 5 * s
    g.beginPath(); g.moveTo(cx - 2 * s, hipY + 1 * s); g.lineTo(cx - 2 * s + la * .62, base - 4 * s); g.stroke()
    g.beginPath(); g.moveTo(cx + 2 * s, hipY + 1 * s); g.lineTo(cx + 2 * s + lb * .62, base - 4 * s); g.stroke()
    g.strokeStyle = 'rgba(255,244,190,.38)'; g.lineWidth = 1.6 * s
    g.beginPath(); g.moveTo(cx - 3 * s, hipY + 2 * s); g.lineTo(cx - 3 * s + la * .5, base - 5 * s); g.stroke()
    g.beginPath(); g.moveTo(cx + 1 * s, hipY + 2 * s); g.lineTo(cx + 1 * s + lb * .5, base - 5 * s); g.stroke()
  }
  // body: broader at the shoulder the more of an adventurer this is
  const shW = (6.5 + bulk * 3.5) * s
  poly(g, [[cx - shW + hunch, shY], [cx + shW + hunch, shY],
           [cx + 5 * s, hipY + 2 * s], [cx - 5 * s, hipY + 2 * s]], tunic)

           [cx - 1 * s, hipY + 2 * s], [cx - 5 * s, hipY + 2 * s]],
    o.tunicLit ?? 'rgba(255,240,214,.10)')
  if (bulk > 0) {
    // the coat: it flares, and its hem trails a beat behind the legs
    // SHORTER, AND NARROWER. It fell to three pixels off the ground and flared
  // nine wide, which is the silhouette of a gown. A working tunic clears the
  // knee and hangs close enough that you can see somebody walk in it.
  const hem = base - 11 * s, flare = (7 + bulk * 3) * s
    const sway = Math.sin(step - .7) * 2.2 * s * bulk

             [cx + flare + sway, hem], [cx + flare * .4 + sway, hem + 2 * s],
             [cx - flare * .4 + sway, hem + 1 * s], [cx - flare + sway, hem - 1 * s]], coat)
    poly(g, [[cx + 1 * s, hipY - 1 * s], [cx + 6 * s, hipY - 1 * s],
             [cx + flare + sway, hem], [cx + 2 * s + sway, hem + 1.5 * s]], 'rgba(0,0,0,.32)')
    // CLOTH, NOT MOULDED PLASTIC.
    //
    // The coat was two flat polygons -- a colour and a shadow half -- and at
    // this size that is indistinguishable from an injection-moulded shell. The
    // beasts read better precisely because they are built from many small
    // overlapping shapes with edges. What a garment needs is FOLDS: vertical
    // creases that spread as they fall, each with a dark side and a lit one,
    // and a hem line so the cloth ends rather than fading into the boot.
    // THE SPLIT, which is what stops a tunic being a dress.
    //
    // A single unbroken bell from the waist to the ankle is a skirt, whatever
    // colour it is. A working tunic is shorter, and it is CUT -- open at the
    // front so a leg can move through it -- which is the whole reason the
    // garment exists. The legs already ran underneath; nothing was ever
    // letting them show.
    g.fillStyle = 'rgba(0,0,0,.45)'
    poly(g, [[cx - 1.6 * s, hipY + 1 * s], [cx + 1.6 * s, hipY + 1 * s],
             [cx + 2.4 * s + sway * .8, hem], [cx - 2.4 * s + sway * .8, hem]],
      'rgba(0,0,0,.45)')
    for (let i2 = 0; i2 < 4; i2++) {

      const t2 = R2() , u = R2()

    // way to say "this person works with their hands".

      g.fillStyle = o.apron
      poly(g, [[cx - 4.5 * s, shY + 3 * s], [cx + 4.5 * s, shY + 3 * s],

      g.fillStyle = 'rgba(255,240,214,.10)'
      poly(g, [[cx - 4.5 * s, shY + 3 * s], [cx - 1 * s, shY + 3 * s],
               [cx - 2 * s, hem - 1 * s], [cx - 6.5 * s, hem - 1 * s]], 'rgba(255,240,214,.10)')
      g.strokeStyle = 'rgba(0,0,0,.34)'; g.lineWidth = 1 * s
      g.beginPath(); g.moveTo(cx - 4.5 * s, shY + 3 * s); g.lineTo(cx - 2 * s, shY - 1 * s); g.stroke()
      g.beginPath(); g.moveTo(cx + 4.5 * s, shY + 3 * s); g.lineTo(cx + 2 * s, shY - 1 * s); g.stroke()
    }
    // the belt: a tunic is gathered at the waist and a dress is not
    g.fillStyle = o.belt ?? '#3a2c1b'
    g.fillRect(cx - 6.2 * s, hipY - 1.4 * s, 12.4 * s, 2.6 * s)
    g.fillStyle = '#c9a84a'
    g.fillRect(cx - 1.6 * s, hipY - 1.6 * s, 3.2 * s, 3 * s)
    g.fillStyle = 'rgba(255,240,214,.14)'
    g.fillRect(cx - 6.2 * s, hipY - 1.4 * s, 12.4 * s, .9 * s)
    // the hem, drawn dark so the coat has an edge
    g.strokeStyle = 'rgba(0,0,0,.42)'; g.lineWidth = 1.4 * s
    g.beginPath()
    g.moveTo(cx - flare + sway, hem - 1 * s)
    g.quadraticCurveTo(cx + sway, hem + 2.2 * s, cx + flare + sway, hem)
    g.stroke()
    // a belt, because the coat needs somewhere to hang from
    g.fillStyle = '#241a12'
    g.fillRect(cx - 6.4 * s, hipY - 3 * s, 12.8 * s, 3.4 * s)
    g.fillStyle = '#b0913f'
    g.fillRect(cx - 2 * s, hipY - 3 * s, 4 * s, 3.4 * s)
  }
  // cloak, hanging behind and to the shadow side
  if (cloak) {
    poly(g, [[cx - 7.5 * s, shY - 2 * s], [cx + 7.5 * s, shY - 2 * s],
             [cx + 9 * s + lean, base - 3 * s], [cx - 9 * s + lean, base - 3 * s]], cloak)
    g.fillStyle = 'rgba(0,0,0,.28)'
    poly(g, [[cx + 1 * s, shY - 2 * s], [cx + 7.5 * s, shY - 2 * s],
             [cx + 9 * s + lean, base - 3 * s], [cx + 2 * s + lean, base - 3 * s]], 'rgba(0,0,0,.30)')
  }
  if (o.cape) {
    // NOT A CAPE. Or rather: not ONLY a cape, and mostly not.
    //
    // Spec 4c invites a window to paint mastery as cloth, and the first two
    // attempts took that literally -- a full-length cape, which at forty pixels
    // either swallowed the legs or, once narrowed, creased into a lampshade.
    // Nine folds across nineteen pixels is a stripe every two.
    //
    // But the invitation is to paint the FACT, and the fact is that this person
    // is the best in the world at something. What says that across a dark field

    // of the trade struck on the pennant. It breaks the silhouette, it is

    // and it carries the same engraved glyph the panel and the orb use -- so a

    const MN = 5
    for (let i2 = 0; i2 < MN; i2++) {
      const t0 = i2 / MN, t1 = (i2 + 1) / MN
      const xa = cx + (-8.5 + t0 * 17) * s, xb = cx + (-8.5 + t1 * 17) * s
      const ha = cx + (-10.5 + t0 * 21) * s + sway, hb = cx + (-10.5 + t1 * 21) * s + sway
      const lamb = Math.cos(((t0 + t1) / 2 - .3) * 2.2)
      poly(g, [[xa, mTop], [xb, mTop], [hb, mHem], [ha, mHem]], K.colour)
      poly(g, [[xa, mTop], [xb, mTop], [hb, mHem], [ha, mHem]],
        lamb > 0 ? 'rgba(255,246,220,' + (lamb * .18).toFixed(2) + ')'
                 : 'rgba(0,0,0,' + Math.min(.40, -lamb * .5).toFixed(2) + ')')
      if (i2 === 1 || i2 === 3) {                 // cloth does not crease evenly
        g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 1
        g.beginPath(); g.moveTo(xa, mTop); g.lineTo(ha, mHem); g.stroke()
      }
    }
    g.strokeStyle = K.trim ? '#d8b463' : 'rgba(0,0,0,.34)'
    g.lineWidth = K.trim ? 1.6 * s : 1.2
    g.beginPath()
    g.moveTo(cx - 10.5 * s + sway, mHem); g.lineTo(cx + 10.5 * s + sway, mHem); g.stroke()

    // ---- the standard ------------------------------------------------------
    const px3 = cx + 6 * s + hunch, py3 = shY + 1 * s
    const tipX = px3 + 4 * s + sway * .4, tipY = py3 - 34 * s
    g.strokeStyle = '#2e2417'; g.lineWidth = 2 * s; g.lineCap = 'round'
    g.beginPath(); g.moveTo(px3 - 2 * s, py3 + 9 * s); g.lineTo(tipX, tipY); g.stroke()
    g.strokeStyle = K.trim ? '#e8d199' : '#8a7340'; g.lineWidth = 1 * s
    g.beginPath(); g.moveTo(px3 - 2 * s, py3 + 9 * s); g.lineTo(tipX, tipY); g.stroke()
    g.fillStyle = K.trim ? '#f2dda2' : '#a8894a'
    g.beginPath(); g.arc(tipX, tipY - 1.4 * s, 1.8 * s, 0, 7); g.fill()
    // the pennant: a swallow-tail hanging from the staff, facing the camera
    const pw = 16 * s, ph2 = 21 * s
    const flap = Math.sin((o.breath ?? 0) * 1.6 + step) * 1.2 * s
    const ax = tipX - 1 * s, ay = tipY + 2 * s
    poly(g, [[ax, ay], [ax + pw, ay + 2 * s + flap],
             [ax + pw, ay + ph2 + flap], [ax + pw * .55, ay + ph2 - 5 * s + flap * .6],
             [ax, ay + ph2 - 1 * s]], K.colour)
    poly(g, [[ax, ay], [ax + pw * .35, ay + .8 * s],
             [ax + pw * .35, ay + ph2 - 2 * s], [ax, ay + ph2 - 1 * s]],
      'rgba(255,246,220,.16)')
    poly(g, [[ax + pw * .7, ay + 1.4 * s], [ax + pw, ay + 2 * s + flap],
             [ax + pw, ay + ph2 + flap], [ax + pw * .7, ay + ph2 - 3 * s]],
      'rgba(0,0,0,.24)')
    g.strokeStyle = K.trim ? '#e8d199' : 'rgba(0,0,0,.35)'
    g.lineWidth = K.trim ? 1.4 * s : 1
    poly(g, [[ax, ay], [ax + pw, ay + 2 * s + flap],
             [ax + pw, ay + ph2 + flap], [ax + pw * .55, ay + ph2 - 5 * s + flap * .6],
             [ax, ay + ph2 - 1 * s]], null, g.strokeStyle, g.lineWidth)
    // THE MARK OF THE TRADE, struck on the cloth
    if (K.skill) {
      const G4 = Math.round(11 * s)
      const gl = skillGlyph(K.skill, G4, K.radiant ? 'bright' : 'gold')
      g.drawImage(gl, ax + pw * .5 - G4 / 2, ay + ph2 * .45 - G4 / 2 + flap * .5)
    }
    if (K.radiant) {                              // all eighteen: it burns
      g.save(); g.globalCompositeOperation = 'lighter'
      const gr = g.createRadialGradient(ax + pw * .5, ay + ph2 * .5, 0, ax + pw * .5, ay + ph2 * .5, 26 * s)
      gr.addColorStop(0, 'rgba(255,226,150,.34)'); gr.addColorStop(1, 'rgba(255,226,150,0)')
      g.fillStyle = gr
      g.beginPath(); g.arc(ax + pw * .5, ay + ph2 * .5, 26 * s, 0, 7); g.fill()
      for (let i2 = 0; i2 < 5; i2++) {
        const ph3 = (o.breath ?? 0) * .7 + i2 * 1.7
        g.fillStyle = 'rgba(255,238,186,' + (.4 + Math.sin(ph3) * .25).toFixed(2) + ')'
        g.fillRect(ax + pw * .5 + Math.sin(ph3 * .8) * 9 * s,
          ay + ph2 - ((ph3 * 8) % 34) * s * .6, 1.8 * s, 1.8 * s)
      }
      g.restore()
    }

  }
  // arms; the weapon arm swings
  g.strokeStyle = skin; g.lineWidth = (3.2 + bulk * 1.2) * s
  const offX = cx - (8 + bulk * 3) * s - Math.sin(step) * 2 * s, offY = hipY + 2 * s
  g.beginPath(); g.moveTo(cx - shW * .85 + hunch, shY + 3 * s)
  g.lineTo(offX, offY); g.stroke()
  // 6ce: THE SHIELD, on the off hand and drawn before the lantern and the
  // weapon so it can never cover the blow -- the one thing this window must not
  // do to a fight somebody is reading. The engine empties this slot when a
  // two-hander is taken up, so if it is here it is legal and nothing on this
  // side needs to know about hands.
  if (o.shield) {
    const kite = [[offX - 3.4 * s, offY - 5 * s], [offX + 3.4 * s, offY - 5 * s],
                  [offX + 3.4 * s, offY + 3 * s], [offX, offY + 7.5 * s], [offX - 3.4 * s, offY + 3 * s]]
    poly(g, kite, o.shield[0])
    g.strokeStyle = o.shield[1]; g.lineWidth = 1.2 * s
    g.beginPath(); g.moveTo(kite[0][0], kite[0][1])
    for (const k of kite.slice(1)) g.lineTo(k[0], k[1])
    g.closePath(); g.stroke()
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1.4 * s
    g.beginPath(); g.moveTo(offX - 1.6 * s, offY - 4 * s); g.lineTo(offX - 1.6 * s, offY + 2 * s); g.stroke()
  }
  if (o.lantern) {
    // THE LANTERN. This window is named for it and the citizen was not carrying
    // it: the pool of light simply hung around them from nowhere. It swings a
    // beat behind the walk, which is the only reason a light source reads as
    // being CARRIED rather than as an effect.
    const sw2 = Math.sin(step - .8) * 3.2 * s
    const lx = offX + sw2, ly = offY + 8 * s
    g.strokeStyle = '#2a2118'; g.lineWidth = 1.2 * s
    g.beginPath(); g.moveTo(offX, offY); g.lineTo(lx, ly - 5 * s); g.stroke()
    g.strokeStyle = '#8a7340'; g.lineWidth = 1.1 * s
    g.beginPath(); g.arc(lx, ly - 5.4 * s, 2.4 * s, Math.PI, 0); g.stroke()
    poly(g, [[lx - 3.4 * s, ly - 5 * s], [lx + 3.4 * s, ly - 5 * s],
             [lx + 2.6 * s, ly + 4 * s], [lx - 2.6 * s, ly + 4 * s]], '#3a2f1e')
    // A SLEEPER'S LANTERN BURNS LOW. It is not out -- they will wake -- but the
    // flame is down to an ember and the white heart of it has gone. In this
    // window that is the whole tell: no letter over the head, just a light
    // that has stopped doing any work.
    const low = o.lanternLow === true
    g.fillStyle = low ? 'rgba(196,124,52,.55)' : 'rgba(255,206,120,.95)'
    g.fillRect(lx - 2.2 * s, ly - (low ? 1.6 : 4) * s, 4.4 * s, (low ? 4.4 : 7) * s)
    if (!low) {
      g.fillStyle = 'rgba(255,246,214,1)'
      g.fillRect(lx - 1 * s, ly - 2.6 * s, 2 * s, 3.4 * s)
    }
    g.fillStyle = '#241c12'
    g.fillRect(lx - 3.8 * s, ly + 3.4 * s, 7.6 * s, 2 * s)
    g.save(); g.globalCompositeOperation = 'lighter'
    const lg = g.createRadialGradient(lx, ly, 0, lx, ly, 26 * s)
    lg.addColorStop(0, 'rgba(255,190,90,.45)'); lg.addColorStop(1, 'rgba(255,190,90,0)')
    g.fillStyle = lg; g.beginPath(); g.arc(lx, ly, 26 * s, 0, 7); g.fill(); g.restore()
  }
  const wa = -0.5 + swing
  const reach = (9 + bulk * 2) * s
  const hx = cx + shW * .9 + hunch + Math.cos(wa) * reach
  const hy = shY + 3 * s + Math.sin(wa) * reach
  g.beginPath(); g.moveTo(cx + shW * .85 + hunch, shY + 3 * s); g.lineTo(hx, hy); g.stroke()
  if (bulk > 0) {
    // PAULDRONS. Nothing else in this file buys as much silhouette per line.
    for (const side of [-1, 1]) {
      const px2 = cx + side * shW * .92 + hunch, py2 = shY + 1.4 * s
      const pg = g.createLinearGradient(px2 - 6 * s, py2 - 6 * s, px2 + 6 * s, py2 + 6 * s)
      const pc = o.plate ?? ['#6b5a34', '#3a2f1c']
      pg.addColorStop(0, pc[0]); pg.addColorStop(1, pc[1])
      g.fillStyle = pg
      g.beginPath(); g.ellipse(px2, py2, (7 + bulk * 2.4) * s, (5.6 + bulk * 1.8) * s, side * .34, 0, 7); g.fill()
      g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 1.2
      g.beginPath(); g.ellipse(px2, py2, (7 + bulk * 2.4) * s, (5.6 + bulk * 1.8) * s, side * .34, 0, 7); g.stroke()
      g.fillStyle = 'rgba(255,240,214,.20)'
      g.beginPath(); g.ellipse(px2 - 1.6 * s, py2 - 2.2 * s, 3 * s, 1.8 * s, side * .34, 0, 7); g.fill()
      // A RIDGE, NOT A SPIKE. This was a long thin triangle standing off the
      // shoulder in iron, and at world scale it read as a short blade held in
      // a second hand -- which is what someone saw a citizen chopping with.
      // Armour should never be mistakeable for a weapon.
      poly(g, [[px2 + side * 4 * s, py2 - 4.4 * s],
               [px2 + side * 7.5 * s, py2 - 6.6 * s],
               [px2 + side * 8 * s, py2 - 2.6 * s],
               [px2 + side * 5 * s, py2 - 1 * s]], pc[0])
      g.fillStyle = 'rgba(255,240,214,.18)'
      g.beginPath(); g.ellipse(px2 + side * 5.6 * s, py2 - 4.8 * s, 1.6 * s, 1 * s, 0, 0, 7); g.fill()
    }
  }
  // the sweep the hand has just cut through the air
  if (o.trail && wa > -1.15) {
    const k = clamp((wa + 1.15) / 1.9, 0, 1)          // 0 at the top of the wind-up
    const strong = Math.sin(k * Math.PI)
    if (strong > .05) {
      const R2 = (10 + bulk * 2) * s
      const cx2 = cx + shW * .85 + hunch, cy2 = shY + 3 * s
      g.save(); g.globalCompositeOperation = 'lighter'
      const cols = o.trail.kind === 'work'
        ? ['rgba(255,226,160,', 'rgba(255,246,214,']
        : ['rgba(196,226,255,', 'rgba(255,255,255,']
      g.strokeStyle = cols[0] + (.42 * strong).toFixed(2) + ')'
      g.lineWidth = (7 + bulk * 3) * s * strong
      g.beginPath(); g.arc(cx2, cy2, R2 * 1.55, wa - 1.15, wa); g.stroke()
      g.strokeStyle = cols[1] + (.5 * strong).toFixed(2) + ')'
      g.lineWidth = 1.6 * s
      g.beginPath(); g.arc(cx2, cy2, R2 * 1.55, wa - .95, wa); g.stroke()
      g.restore()
    }
  }
  // the hand, and whatever is in it, over the shoulder plate rather than under
  if (o.fist) {                                        // empty hands are still hands
    g.fillStyle = skin
    g.beginPath(); g.arc(hx, hy, 3.4 * s, 0, 7); g.fill()
    g.fillStyle = 'rgba(0,0,0,.3)'
    g.beginPath(); g.arc(hx + 1 * s, hy + 1 * s, 2.2 * s, 0, 7); g.fill()
  }
  if (o.weapon) o.weapon(g, hx, hy, wa, s * (1 + bulk * .45))
  // THE TRADE BADGE, at the shoulder: the same engraved mark the mastery cape
  // carries, in a small iron roundel. It says which trade without claiming
  // the mastery -- a keeper wears the sign of the work, a citizen who reached
  // ninety-nine wears the cape.
  if (o.badge) {
    const bx = cx - 6.5 * s, by = shY + 4 * s
    g.fillStyle = '#3a2f18'
    g.beginPath(); g.arc(bx, by, 4.2 * s, 0, 7); g.fill()
    g.strokeStyle = '#8a6a2a'; g.lineWidth = 1 * s
    g.beginPath(); g.arc(bx, by, 4.2 * s, 0, 7); g.stroke()
    try { g.drawImage(skillGlyph(o.badge, Math.round(6 * s), 'bright'), bx - 3 * s, by - 3 * s) } catch {}
  }
  // head, hood or helm
  if (o.hood) {
    poly(g, [[cx - 6 * s, headY + 8 * s], [cx, headY - 6 * s], [cx + 6 * s, headY + 8 * s]], o.hood)
    g.fillStyle = '#07060a'
    g.beginPath(); g.ellipse(cx, headY + 3 * s, 3.4 * s, 3.6 * s, 0, 0, 7); g.fill()
    if (o.eyes) {                              // two coals under the hood
      g.fillStyle = o.eyes
      g.fillRect(cx - 2.6 * s, headY + 2 * s, 1.7 * s, 1.5 * s)
      g.fillRect(cx + 1 * s, headY + 2 * s, 1.7 * s, 1.5 * s)
    }
  } else {
    // A HEAD, NOT A BEAN.
    //
    // This was one skin-coloured ellipse with a darker ellipse on top of it and
    // a third for hair, and at forty pixels that is a legume with a wig. What
    // reads at this size is not detail, it is STRUCTURE: a jaw narrower than
    // the skull, a brow that casts, a neck that the head sits on rather than
    // floats above, and hair with an actual outline instead of a blob centred
    // on nothing. Five hair shapes and a beard, chosen by the citizen's own
    // seed, which is what finally makes a crowd read as people.
    const hw = 4.5 * s, hh = 5.4 * s
    // the neck, so the head has somewhere to be
    g.fillStyle = shade(skin, .74)
    g.fillRect(cx - 1.9 * s, headY + hh - 2 * s, 3.8 * s, 4 * s)
    // the skull: wider above, tapering to a jaw
    g.fillStyle = skin
    g.beginPath()
    g.moveTo(cx - hw, headY + 1.2 * s)
    g.quadraticCurveTo(cx - hw, headY - hh * .8, cx, headY - hh * .85)
    g.quadraticCurveTo(cx + hw, headY - hh * .8, cx + hw, headY + 1.2 * s)
    g.quadraticCurveTo(cx + hw * .82, headY + hh, cx, headY + hh * 1.06)
    g.quadraticCurveTo(cx - hw * .82, headY + hh, cx - hw, headY + 1.2 * s)
    g.fill()
    // light from the upper left: the shadow side, and the brow
    g.fillStyle = 'rgba(0,0,0,.26)'
    g.beginPath()
    g.moveTo(cx + .6 * s, headY - hh * .85)
    g.quadraticCurveTo(cx + hw, headY - hh * .7, cx + hw, headY + 1.2 * s)
    g.quadraticCurveTo(cx + hw * .82, headY + hh, cx + .6 * s, headY + hh * 1.06)
    g.fill()
    g.fillStyle = 'rgba(0,0,0,.20)'
    g.beginPath(); g.ellipse(cx, headY - 1.2 * s, hw * .86, 1.5 * s, 0, 0, 7); g.fill()
    if (o.hair) {
      const st = (o.hairStyle ?? 0) % 5
      g.fillStyle = o.hair
      g.beginPath()
      if (st === 0) {                            // cropped
        g.moveTo(cx - hw - .4 * s, headY + .4 * s)
        g.quadraticCurveTo(cx - hw, headY - hh, cx, headY - hh * 1.02)
        g.quadraticCurveTo(cx + hw, headY - hh, cx + hw + .4 * s, headY + .4 * s)
        g.quadraticCurveTo(cx + hw * .4, headY - hh * .3, cx, headY - hh * .34)
        g.quadraticCurveTo(cx - hw * .4, headY - hh * .3, cx - hw - .4 * s, headY + .4 * s)
      } else if (st === 1) {                     // long, falling past the jaw
        g.moveTo(cx - hw - 1 * s, headY + hh * .9)
        g.quadraticCurveTo(cx - hw - 1.4 * s, headY - hh, cx, headY - hh * 1.05)
        g.quadraticCurveTo(cx + hw + 1.4 * s, headY - hh, cx + hw + 1 * s, headY + hh * .9)
        g.quadraticCurveTo(cx + hw * .7, headY + hh * .2, cx + hw * .55, headY - hh * .3)
        g.quadraticCurveTo(cx, headY - hh * .55, cx - hw * .55, headY - hh * .3)
        g.quadraticCurveTo(cx - hw * .7, headY + hh * .2, cx - hw - 1 * s, headY + hh * .9)
      } else if (st === 2) {                     // swept to one side
        g.moveTo(cx - hw - .6 * s, headY + .8 * s)
        g.quadraticCurveTo(cx - hw, headY - hh, cx + hw * .3, headY - hh * 1.05)
        g.quadraticCurveTo(cx + hw + 2 * s, headY - hh * .7, cx + hw + .3 * s, headY - hh * .1)
        g.quadraticCurveTo(cx, headY - hh * .5, cx - hw - .6 * s, headY + .8 * s)
      } else if (st === 3) {                     // tied back, with a tail
        g.moveTo(cx - hw - .3 * s, headY + .2 * s)
        g.quadraticCurveTo(cx - hw, headY - hh, cx, headY - hh * 1.02)
        g.quadraticCurveTo(cx + hw, headY - hh, cx + hw + .3 * s, headY + .2 * s)
        g.quadraticCurveTo(cx + hw * .3, headY - hh * .45, cx - hw * .3, headY - hh * .45)
      } else {                                   // bald on top, sides only
        g.moveTo(cx - hw - .4 * s, headY + hh * .5)
        g.quadraticCurveTo(cx - hw - .5 * s, headY - hh * .4, cx - hw * .55, headY - hh * .62)
        g.quadraticCurveTo(cx - hw * .5, headY + hh * .1, cx - hw * .3, headY + hh * .55)
        g.moveTo(cx + hw + .4 * s, headY + hh * .5)
        g.quadraticCurveTo(cx + hw + .5 * s, headY - hh * .4, cx + hw * .55, headY - hh * .62)
        g.quadraticCurveTo(cx + hw * .5, headY + hh * .1, cx + hw * .3, headY + hh * .55)
      }
      g.fill()
      if (st === 3) {                            // the tail itself
        g.fillStyle = o.hair
        g.beginPath()
        g.ellipse(cx + 4.6 * s, headY + 1.6 * s, 1.7 * s, 3.4 * s, .4, 0, 7); g.fill()
      }
      g.fillStyle = 'rgba(255,246,220,.13)'      // one lit strand
      g.beginPath(); g.ellipse(cx - hw * .45, headY - hh * .55, hw * .38, 1.1 * s, -.35, 0, 7); g.fill()
    }
    if (o.beard) {
      g.fillStyle = o.hair ?? '#3a2c1e'
      g.beginPath()
      g.moveTo(cx - hw * .92, headY + hh * .12)
      g.quadraticCurveTo(cx - hw * .8, headY + hh * 1.5, cx, headY + hh * 1.6)
      g.quadraticCurveTo(cx + hw * .8, headY + hh * 1.5, cx + hw * .92, headY + hh * .12)
      g.quadraticCurveTo(cx, headY + hh * .62, cx - hw * .92, headY + hh * .12)
      g.fill()
      g.fillStyle = 'rgba(0,0,0,.2)'
      g.beginPath(); g.ellipse(cx + hw * .4, headY + hh * .8, hw * .4, hh * .5, 0, 0, 7); g.fill()
    }
    if (o.helm) {
      g.fillStyle = o.helm
      g.beginPath(); g.ellipse(cx, headY, 5.4 * s, 4.4 * s, 0, Math.PI, 0); g.fill()
      g.fillStyle = 'rgba(255,240,214,.22)'
      g.beginPath(); g.ellipse(cx - 1.6 * s, headY - 1 * s, 2.6 * s, 1.8 * s, 0, Math.PI, 0); g.fill()
      if (o.horns) {
        g.strokeStyle = o.helm; g.lineWidth = 2 * s
        g.beginPath(); g.moveTo(cx - 5 * s, headY - 1 * s); g.quadraticCurveTo(cx - 10 * s, headY - 5 * s, cx - 7 * s, headY - 9 * s); g.stroke()
        g.beginPath(); g.moveTo(cx + 5 * s, headY - 1 * s); g.quadraticCurveTo(cx + 10 * s, headY - 5 * s, cx + 7 * s, headY - 9 * s); g.stroke()
      }
    }
  }
  if (o.shield) {                              // strapped to the off arm
    g.fillStyle = o.shield
    g.beginPath(); g.ellipse(cx - 9 * s, shY + 7 * s, 5.4 * s, 7 * s, .15, 0, 7); g.fill()
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.2
    g.beginPath(); g.ellipse(cx - 9 * s, shY + 7 * s, 5.4 * s, 7 * s, .15, 0, 7); g.stroke()
    g.fillStyle = 'rgba(255,240,214,.16)'
    g.beginPath(); g.ellipse(cx - 10.4 * s, shY + 5 * s, 2 * s, 2.8 * s, .15, 0, 7); g.fill()
  }
}

// ---- the weapon in the hand ------------------------------------------------
const METAL = {
  iron:    ['#8a6a34', '#c49a4e', '#4c3a1c'],
  star:      ['#8fa8c4', '#d6e6f4', '#4a5a70'],
  iron:      ['#6e6e68', '#a8a8a0', '#3a3a36'],
  wood:      ['#6a4f2c', '#96733f', '#3a2a16'],
  heartwood: ['#7a4a26', '#b07040', '#40230f'],
  dragon:    ['#7a2018', '#c4462a', '#3a0e0a'],
}
const metalOf = (item) => item?.startsWith('star-') ? METAL.star
  : item?.startsWith('iron-') ? METAL.iron
  : item === 'dragonbow' ? METAL.dragon
  : item?.includes('heartwood') ? METAL.heartwood
  : item === 'old-chain' ? METAL.iron
  : METAL.wood

function drawWeapon(g, hx, hy, a, s, item, drawAmt) {
  if (!item) return
  const m = metalOf(item)
  const long = /sword|spear|maul|flail/.test(item) ? (item.includes('spear') ? 26 : 20)
             : /axe|pick|rod/.test(item) ? 18 : 13
  // ALONG THE ARM, NOT ACROSS IT. This was `a - 1.35`, which is seventy-seven
  // degrees off the forearm: at rest the blade pointed up and BACK over the
  // shoulder, into the torso, and the pauldron drawn afterwards finished the
  // job. A citizen with a sword appeared to be carrying nothing.
  const dx = Math.cos(a), dy = Math.sin(a)
  if (item === 'wand') {
    // SHORT, AND HELD LIKE A THING YOU MIGHT NEED SUDDENLY. A staff is leaned
    // on; a wand is carried. Bound at the grip, tapering to a pale tip that
    // keeps a little of the same cold light a sigil does.
    const L = 16 * s
    const tx2 = hx + dx * L, ty2 = hy + dy * L

  } else if (item === 'axe') {                      // the crude version of a tool

    // second blade -- a felling axe with an edge on both sides. A pick has no
    // edge at all: it has a long curved SPIKE to bite the stone and a short
