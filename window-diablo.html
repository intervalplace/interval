}

// ---------------------------------------------------------------------------
// THE BRIDGES
// ---------------------------------------------------------------------------
// A bridge was a plank-textured floor tile sitting three pixels proud of the
// river, which is a ford at best and a painted rectangle at worst. This island
// has a hundred and thirty of them, in spans of up to nine, and every one of
// them touches BOTH water and land -- so a bridge tile knows, from its own
// neighbours, which of its four sides are open water and which carry the road
// on. That is enough to build a real one:
//
//     a deck standing thirteen pixels clear of the water,
//     a parapet on every side that faces water and none where the road runs,
//     piles going down into the river under each open side,
//     an abutment where it meets the bank,
//     and its own shadow on the water beneath it.
//
// Sixteen possible neighbour patterns, cached like everything else.
const BRIDGE_LIFT = 13, BRIDGE_TOP = 20

// A BRIDGE RISES. That is the whole difference between a bridge and a plank.
//
// Every deck tile stood at the same height, which is a jetty: a flat board laid
// across a gap. A real span arches -- for strength first and beauty second, and
// the two are the same thing here -- so it climbs from each bank to the middle
// and comes down again, and the trestles under it grow with it.
//
// The rise is a pure function of where a tile sits along its own span, so every
// window that reads it gets the same bridge, and the citizen walking over it
// stands ON the deck rather than ten pixels inside it (NODE_LIFT used to say 3
// while the deck was drawn at 13; nobody noticed because the planks hid them).
const _bspan2 = new Map()
function bridgeSpan(x, y) {
  const k = x + ',' + y
  const hit = _bspan2.get(k); if (hit) return hit
  const isB = (a, b) => terrainOf(a, b) === 'bridge'
  if (!isB(x, y)) return { t: 0, len: 0 }
  // walk the longer of the two axes: that is the direction the span runs
  let w = 0, e = 0, n = 0, s2 = 0
  while (w < 30 && isB(x - w - 1, y)) w++
  while (e < 30 && isB(x + e + 1, y)) e++
  while (n < 30 && isB(x, y - n - 1)) n++
  while (s2 < 30 && isB(x, y + s2 + 1)) s2++
  const alongX = (w + e) >= (n + s2)
  const before = alongX ? w : n, len = (alongX ? w + e : n + s2) + 1
  const t = len <= 1 ? .5 : (before + .5) / len
  const out = { t, len, alongX }
  if (_bspan2.size > 40000) _bspan2.clear()
  _bspan2.set(k, out)
  return out
}
// the arch itself: short crossings stay nearly flat, long ones climb
function bridgeRise(x, y) {
  const sp = bridgeSpan(x, y)
  if (!sp.len) return 0
  const peak = Math.min(14, Math.max(0, (sp.len - 2) * 1.6))
  return Math.sin(sp.t * Math.PI) * peak
}
const _bridgeArt = new Map()
function bridgeArt(mask, v) {
  const key = mask + ':' + v
  const hit = _bridgeArt.get(key); if (hit) return hit
  const c = mkc(TW, TH + SKIRT + BRIDGE_TOP), g = c.getContext('2d')
  const R = rng(mask * 7919 + v * 104729 + 31)
  const O = BRIDGE_TOP
  // the four corners of the deck
  const T = [HW, O], Rt = [TW, O + HH], B = [HW, O + TH], L = [0, O + HH]
  // which side is open water: bit 1 = +x, 2 = -x, 4 = +y, 8 = -y
  const openX1 = !!(mask & 1), openX2 = !!(mask & 2), openY1 = !!(mask & 4), openY2 = !!(mask & 8)


  // The trestle is NOT in this sprite. It has to grow with the arch, and the
  // arch is a property of the tile rather than of the neighbour pattern, so
  // the renderer builds it underneath (drawTrestle).

  // ---- the deck ----------------------------------------------------------
  const deck = ['#4a3a22', '#63502e', '#2a1f11']
  g.save(); diamond(g, 0, O, -1); g.clip()
  g.fillStyle = deck[1]; g.fillRect(0, O, TW, TH)
  // boards laid ACROSS the span, so a run of tiles reads as one carriageway
  const along = (openY1 || openY2) && !(openX1 || openX2)   // road runs east-west
  for (let i = 0; i <= 7; i++) {
    const t2 = i / 7
    g.strokeStyle = i % 2 ? 'rgba(0,0,0,.30)' : 'rgba(255,236,196,.09)'
    g.lineWidth = 1.4
    g.beginPath()
    if (along) { g.moveTo(t2 * TW, O + t2 * HH); g.lineTo(t2 * TW + HW, O + t2 * HH + HH) }
    else { g.moveTo(TW - t2 * TW, O + t2 * HH); g.lineTo(TW - t2 * TW - HW, O + t2 * HH + HH) }
    g.stroke()
  }
  for (let i = 0; i < 22; i++) {                    // wear, and a knot or two
    g.fillStyle = R() > .5 ? 'rgba(255,238,206,.07)' : 'rgba(0,0,0,.16)'
    g.fillRect(R() * TW, O + R() * TH, 2, 1)
  }
  g.restore()
  // the lit lip along the two far edges of the deck
  g.strokeStyle = 'rgba(255,240,214,.16)'; g.lineWidth = 1.6
  g.beginPath(); g.moveTo(L[0], L[1]); g.lineTo(T[0], T[1]); g.lineTo(Rt[0], Rt[1]); g.stroke()
  // and the thickness of it, seen from below on the near edges
  g.fillStyle = '#231a0e'
  poly(g, [L, B, [B[0], B[1] + 5], [L[0], L[1] + 5]], '#231a0e')
  poly(g, [B, Rt, [Rt[0], Rt[1] + 5], [B[0], B[1] + 5]], '#1a130a')

  // ---- a parapet on every side that faces water --------------------------
  // A HANDRAIL, NOT A HOARDING. A solid parapet hides the water, which is the
  // one thing worth seeing from a bridge. Posts, a top rail, a mid rail, and
  // daylight between them.
  const rail = (a, b2, lit) => {
    const H2 = 15
    const post = (t2) => {
      const px2 = a[0] + (b2[0] - a[0]) * t2, py2 = a[1] + (b2[1] - a[1]) * t2
      g.fillStyle = lit ? '#4a3a20' : '#2a2110'
      g.fillRect(px2 - 1.7, py2 - H2 - 2, 3.4, H2 + 3)
      g.fillStyle = lit ? '#6a5430' : '#3a2e18'
      g.fillRect(px2 - 1.7, py2 - H2 - 2, 1.3, H2 + 3)
    }
    for (const [dy, w2] of [[H2, 2.6], [H2 * .5, 1.8]]) {
      g.strokeStyle = lit ? '#5b4a2c' : '#33280f'; g.lineWidth = w2
      g.beginPath(); g.moveTo(a[0], a[1] - dy); g.lineTo(b2[0], b2[1] - dy); g.stroke()
      g.strokeStyle = lit ? 'rgba(255,240,214,.16)' : 'rgba(255,240,214,.06)'; g.lineWidth = 1
      g.beginPath(); g.moveTo(a[0], a[1] - dy - 1); g.lineTo(b2[0], b2[1] - dy - 1); g.stroke()
    }
    post(0); post(.5); post(1)
  }
  if (openX1) rail(Rt, B, false)        // lower right
  if (openX2) rail(L, T, true)          // upper left
  if (openY1) rail(B, L, false)         // lower left
  if (openY2) rail(T, Rt, true)         // upper right

  // ---- an abutment where it meets the bank -------------------------------
  const abut = (a, b2) => {
    g.fillStyle = '#3a352e'
    poly(g, [a, b2, [b2[0], b2[1] + 7], [a[0], a[1] + 7]], '#3a352e')
    g.fillStyle = 'rgba(255,240,214,.10)'
    poly(g, [a, b2, [b2[0], b2[1] + 2], [a[0], a[1] + 2]], 'rgba(255,240,214,.10)')
  }
  if (!openX1) abut(Rt, B)
  if (!openY1) abut(B, L)

  _bridgeArt.set(key, c)
  return c
}
// a bridge continues into anything you can walk on; everything else is water
const BRIDGE_CONTINUES = new Set(['bridge', 'trail', 'causey', 'cobble', 'plaza',
  'flag', 'floor', 'sand', 'chalk', 'gravel', 'meadow', 'heartlands', 'downs',
  'greenwood', 'forest', 'moor', 'fens', 'peat', 'wilds', 'scree', 'crags'])
function bridgeMask(x, y) {
  let m = 0
  if (!BRIDGE_CONTINUES.has(terrainOf(x + 1, y))) m |= 1
  if (!BRIDGE_CONTINUES.has(terrainOf(x - 1, y))) m |= 2
  if (!BRIDGE_CONTINUES.has(terrainOf(x, y + 1))) m |= 4
  if (!BRIDGE_CONTINUES.has(terrainOf(x, y - 1))) m |= 8
  return m
}

// ---------------------------------------------------------------------------
// TWO KINDS OF CROSSING
// ---------------------------------------------------------------------------
// Tallyholm has eight of them, and only one is a footbridge. The rest are broad
// -- fourteen tiles by thirteen in one case -- where several roads converge
// over water. Those are not bridges in the timber-and-parapet sense; they are
// CAUSEWAYS: solid dressed masonry standing in the river with arches let into
// the sides, a low kerb rather than a rail, and no piles because there is
// nothing to prop up.
//
// The generator is not wrong about this and must not be touched: a generator
// name means one landscape forever (spec 9c), so editing it would not improve
// Tallyholm, it would replace it. Which idiom a tile wears is the WINDOW's
// choice, and the window can work it out from geography alone -- how wide the
// crossing is at that point, which is the shorter of its horizontal and
// vertical runs.
// (A stone-causeway idiom lived here, chosen when a crossing was more than two
// tiles across. It was wrong: this world's bridges are fords, and the reference
// window paints every one of them as timber planks whatever their width. The
// window does not get to promote a wide crossing to masonry.)

// ---------------------------------------------------------------------------
// WHERE THE BRIDGE MEETS THE BANK
// ---------------------------------------------------------------------------
// The dry end of a span. No piles, because there is nothing to stand in; no
// parapet, because you are on the ground. Just the road running onto boards,
// with the sill where the two meet and the earth packed up against it.
const _abut = new Map()
function abutmentArt(mask, v) {
  const key = mask + ':' + v
  const hit = _abut.get(key); if (hit) return hit
  const c = mkc(TW, TH + SKIRT + BRIDGE_TOP), g = c.getContext('2d')
  const R = rng(mask * 3571 + v * 7919 + 5)
  const O = BRIDGE_TOP
  // the packed earth the boards sit on, filling the lift so nothing floats
  g.fillStyle = '#2a2118'
  g.beginPath()
  g.moveTo(0, O + HH); g.lineTo(HW, O + TH); g.lineTo(TW, O + HH)
  g.lineTo(TW, O + HH + BRIDGE_LIFT); g.lineTo(HW, O + TH + BRIDGE_LIFT)
  g.lineTo(0, O + HH + BRIDGE_LIFT); g.closePath(); g.fill()
  g.fillStyle = '#1d1710'
  g.beginPath()
  g.moveTo(HW, O + TH); g.lineTo(TW, O + HH); g.lineTo(TW, O + HH + BRIDGE_LIFT)
  g.lineTo(HW, O + TH + BRIDGE_LIFT); g.closePath(); g.fill()
  // boards
  g.save(); diamond(g, 0, O, -1); g.clip()
  g.fillStyle = '#5e4b2c'; g.fillRect(0, O, TW, TH)
  const along = (mask & 4) || (mask & 8)
  for (let i = 0; i <= 7; i++) {
    const t2 = i / 7
    g.strokeStyle = i % 2 ? 'rgba(0,0,0,.26)' : 'rgba(255,236,196,.07)'
    g.lineWidth = 1.4
    g.beginPath()
    if (along) { g.moveTo(t2 * TW, O + t2 * HH); g.lineTo(t2 * TW + HW, O + t2 * HH + HH) }
    else { g.moveTo(TW - t2 * TW, O + t2 * HH); g.lineTo(TW - t2 * TW - HW, O + t2 * HH + HH) }
    g.stroke()
  }
  for (let i = 0; i < 20; i++) {                 // grit tracked onto the boards
    g.fillStyle = R() > .5 ? 'rgba(120,104,76,.30)' : 'rgba(0,0,0,.18)'
    g.fillRect(R() * TW, O + R() * TH, 2.4, 1.4)
  }
  g.restore()
  // the sill: one heavy timber across the join, lit along its top
  g.strokeStyle = '#2a2114'; g.lineWidth = 3
  g.beginPath(); g.moveTo(0, O + HH); g.lineTo(HW, O + TH); g.lineTo(TW, O + HH); g.stroke()
  g.strokeStyle = 'rgba(255,240,214,.13)'; g.lineWidth = 1.2
  g.beginPath(); g.moveTo(0, O + HH - 1.5); g.lineTo(HW, O + TH - 1.5); g.lineTo(TW, O + HH - 1.5); g.stroke()
  _abut.set(key, c)

}

// ---------------------------------------------------------------------------
// WHAT HOLDS A BRIDGE UP
// ---------------------------------------------------------------------------
// A trestle: two raking legs, a cross-brace between them, a sill in the water
// and a cap under the deck. Drawn per tile rather than baked into the sprite,
// because its height follows the arch -- tallest in the middle of the span,
// which is exactly where a real one is.
function drawTrestle(g, ox, oy, h, wet) {
  const cx = ox + HW, top = oy + TH * .5
  const foot = top + h
  const spread = 13 + h * .12
  g.lineCap = 'round'
  // the legs, raking outward as they go down
  for (const side of [-1, 1]) {
    g.strokeStyle = '#191309'; g.lineWidth = 5
    g.beginPath(); g.moveTo(cx + side * 8, top); g.lineTo(cx + side * spread, foot); g.stroke()
    g.strokeStyle = '#33260f'; g.lineWidth = 1.6
    g.beginPath(); g.moveTo(cx + side * 8 - 1.4, top); g.lineTo(cx + side * spread - 1.4, foot); g.stroke()
  }
  // the cross-brace, and a second one on a tall trestle
  const braces = h > 26 ? [.42, .74] : [.55]
  for (const k of braces) {
    const y = top + h * k, w2 = 8 + (spread - 8) * k
    g.strokeStyle = '#241a0d'; g.lineWidth = 3
    g.beginPath(); g.moveTo(cx - w2, y); g.lineTo(cx + w2, y); g.stroke()
    g.strokeStyle = '#241a0d'; g.lineWidth = 2
    g.beginPath(); g.moveTo(cx - w2, y - h * .16); g.lineTo(cx + w2, y + h * .16); g.stroke()
    g.beginPath(); g.moveTo(cx + w2, y - h * .16); g.lineTo(cx - w2, y + h * .16); g.stroke()
  }
  // the cap the deck sits on
  g.fillStyle = '#2c2113'
  g.fillRect(cx - 12, top - 2, 24, 4)
  g.fillStyle = '#4a3a22'; g.fillRect(cx - 12, top - 2, 24, 1.4)
  if (wet) {
    // where the legs enter the water, and the disturbance around them
    g.save(); g.globalCompositeOperation = 'lighter'
    for (const side of [-1, 1]) {
      g.fillStyle = 'rgba(150,196,214,.20)'
      g.beginPath(); g.ellipse(cx + side * spread, foot, 6.5, 2.6, 0, 0, 7); g.fill()
    }
    g.restore()
  }
}

// ---------------------------------------------------------------------------
// THE GREAT BRIDGE
// ---------------------------------------------------------------------------
// A nineteen-tile crossing built out of the same timber trestle as a farm
// plank bridge is not a big bridge -- it is a small bridge repeated nineteen
// times, and it reads exactly like that: scattered, rushed, nobody's decision.
//
// Length changes what a thing IS. Past a dozen tiles you are not laying planks
// over a stream, you are building in STONE, with piers in the water and arches
// between them, because that is the only way anyone ever spanned a distance
// like that. So a long span gets a different structure entirely: masonry
// piers with cutwaters facing the current, segmental arches springing between
// them, a solid parapet with a refuge over every pier, and a paved deck.
//
// The rhythm is what makes it coherent. Piers every four tiles, arches
// between, and each tile knows where it stands in the span -- so the nineteen
// tiles add up to ONE bridge instead of nineteen bridges in a row.
const GREAT_SPAN = 11        // past this, stone
const PIER_EVERY = 4
function greatBridge(g, ox, oy, sp, mask, rise, wet) {
  const idx = Math.round(sp.t * sp.len - 0.5)
  const isPier = (idx % PIER_EVERY) === 0
  const bay = ((idx % PIER_EVERY) + PIER_EVERY) % PIER_EVERY / PIER_EVERY
  const cx = ox + HW, top = oy + TH * .5 - rise
  const STONE = ['#6a675e', '#7e7a6f', '#4e4b44', '#8d8879']

  if (wet) {
    // ---- what stands in the water -------------------------------------
    const foot = top + BRIDGE_LIFT + rise + 12
    if (isPier) {
      // a pier: batter-sided, with a cutwater upstream
      poly(g, [[cx - 13, top + 2], [cx + 13, top + 2], [cx + 17, foot], [cx - 17, foot]], STONE[2])
      poly(g, [[cx - 13, top + 2], [cx - 2, top + 2], [cx - 5, foot], [cx - 17, foot]], STONE[0])
      // the cutwater, a wedge facing the current
      poly(g, [[cx - 17, foot], [cx - 13, top + 8], [cx - 24, foot - 4]], STONE[2])
      poly(g, [[cx - 17, foot], [cx - 24, foot - 4], [cx - 21, foot + 2]], STONE[1])
      // courses
      g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1
      for (let i2 = 1; i2 < 5; i2++) {
        const yy = top + 2 + (foot - top - 2) * (i2 / 5)
        g.beginPath(); g.moveTo(cx - 13 - i2 * .9, yy); g.lineTo(cx + 13 + i2 * .9, yy); g.stroke()
      }
      // the waterline
      g.save(); g.globalCompositeOperation = 'lighter'
      g.fillStyle = 'rgba(150,196,214,.22)'
      g.beginPath(); g.ellipse(cx, foot - 2, 20, 5, 0, 0, 7); g.fill()
      g.restore()
    } else {
      // ---- the arch between two piers -----------------------------------
      // the soffit dips deepest at mid-bay, which is what an arch looks like
      // from the side and what makes four tiles read as one opening
      const drop = Math.sin(bay * Math.PI) * 15
      const yTop = top + 4
      const yBot = top + BRIDGE_LIFT + rise + 2 - drop
      poly(g, [[cx - HW, yTop], [cx + HW, yTop], [cx + HW, yBot], [cx - HW, yBot]], STONE[2])
      // the arch ring: a lighter band along the soffit
      g.strokeStyle = STONE[1]; g.lineWidth = 3
      g.beginPath(); g.moveTo(cx - HW, yBot); g.lineTo(cx + HW, yBot); g.stroke()
      g.strokeStyle = 'rgba(255,246,220,.10)'; g.lineWidth = 1.2
      g.beginPath(); g.moveTo(cx - HW, yBot - 2); g.lineTo(cx + HW, yBot - 2); g.stroke()
      // voussoirs, radiating
      g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 1
      for (let i2 = 0; i2 < 3; i2++) {
        const xx = cx - HW + (i2 + .5) * (TW / 3)
        g.beginPath(); g.moveTo(xx, yBot); g.lineTo(xx + (xx - cx) * .12, yTop); g.stroke()
      }
      // the water seen through the opening catches the light
      g.save(); g.globalCompositeOperation = 'lighter'
      g.fillStyle = 'rgba(140,186,206,' + (.05 + Math.sin(bay * Math.PI) * .05).toFixed(3) + ')'
      g.fillRect(cx - HW, yBot, TW, 8)
      g.restore()
    }
  }

  // ---- the deck: dressed stone, not planks ------------------------------
  g.fillStyle = STONE[0]
  diamond(g, ox, oy - rise, 0); g.fill()
  g.fillStyle = 'rgba(255,246,220,.07)'
  diamond(g, ox, oy - rise - 1, -3); g.fill()
  g.strokeStyle = 'rgba(0,0,0,.20)'; g.lineWidth = 1
  diamond(g, ox, oy - rise, -1); g.stroke()

  // ---- the parapet, solid, with a refuge over every pier ----------------
  const H2 = isPier ? 21 : 16
  const rail = (a, b2) => {
    poly(g, [a, b2, [b2[0], b2[1] - H2], [a[0], a[1] - H2]], STONE[2])
    poly(g, [[a[0], a[1] - H2], [b2[0], b2[1] - H2], [b2[0], b2[1] - H2 - 3.5], [a[0], a[1] - H2 - 3.5]], STONE[3])
    g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 1
    for (let i2 = 1; i2 < 4; i2++) {
      const t2 = i2 / 4
      const px = a[0] + (b2[0] - a[0]) * t2, py = a[1] + (b2[1] - a[1]) * t2
      g.beginPath(); g.moveTo(px, py); g.lineTo(px, py - H2); g.stroke()
    }
  }
  const N = [ox + HW, oy - HH - rise], E2 = [ox + TW, oy - rise]
  const S = [ox + HW, oy + HH - rise], W2 = [ox, oy - rise]
  if (!(mask & 1)) rail(N, E2)
  if (!(mask & 2)) rail(W2, N)
  if (!(mask & 4)) rail(S, E2)
  if (!(mask & 8)) rail(W2, S)
}

// THE HEAD OF A PICK. A long spike on one side, curving down to a point that
// meets the rock before anything else does, and a short flat on the other for
// levering out what the spike has loosened. Mounted on the haft with an eye
// and a wedge, because a pick head that came off would kill somebody.
function pickHead(g, tx, ty, dx, dy, s, m) {
  const px = -dy, py = dx                          // across the haft
  // the spike: three points, curving forward and down

  g.strokeStyle = m[1]; g.lineWidth = 1.1 * s
  g.beginPath()
  g.moveTo(tx + px * 1.6 * s, ty + py * 1.6 * s)
  g.quadraticCurveTo(tx + px * 9 * s + dx * 1 * s, ty + py * 9 * s + dy * 1 * s,
                     tx + px * 13 * s + dx * 5 * s, ty + py * 13 * s + dy * 5 * s)
  g.stroke()
  // the flat, on the other side: short, blunt, for levering
  poly(g, [[tx - px * 1.6 * s, ty - py * 1.6 * s],
           [tx - px * 6.5 * s + dx * .6 * s, ty - py * 6.5 * s + dy * .6 * s],
           [tx - px * 6.5 * s + dx * 3.4 * s, ty - py * 6.5 * s + dy * 3.4 * s],
           [tx - px * 1.6 * s + dx * 3.2 * s, ty - py * 1.6 * s + dy * 3.2 * s]], m[2] ?? m[0])
  // the eye and its wedge
  g.fillStyle = m[1]
  g.beginPath(); g.ellipse(tx + dx * 1.4 * s, ty + dy * 1.4 * s, 2.6 * s, 1.9 * s,
    Math.atan2(dy, dx), 0, 7); g.fill()
  g.fillStyle = 'rgba(40,30,16,.8)'
  g.fillRect(tx + dx * .4 * s - .7 * s, ty + dy * .4 * s - 1.4 * s, 1.4 * s, 2.8 * s)
}
// ===========================================================================
// THE BESTIARY, AND THE PACK
// ---------------------------------------------------------------------------
// Beasts are drawn live rather than cached, because a still monster is a rock
// with teeth. Every one breathes, and the ones that are angry at you lean
// forward. Item icons are cached: they never move.
// ===========================================================================

// ---------------------------------------------------------------------------
// THE BESTIARY
// ---------------------------------------------------------------------------
// Ten creatures, ten silhouettes. The previous pass had five body plans doing
// the work of ten nouns -- a troll was a goblin at 1.35x in a greyer palette,
// and a dragon was a siren with wings bolted on. That is the failure mode this
// whole window exists to avoid, so each of these is now drawn on its own.
//
// The register is the third game's, which has a specific and copyable grammar:
//
//   * EXAGGERATE THE TOP. Shoulders, skulls, claws and carapaces are drawn far
//     too large; pelvises and feet far too small. A beast should be legible
//     from its top third alone, because in a turned camera that is the third
//     that is never occluded.
//   * BONE ON THE OUTSIDE. Horn, spine, plate and tusk break the outline.
//     A smooth silhouette reads as a toy at this size.
//   * THE EYES ARE LIGHT SOURCES. Not dots -- small bright cores with a bloom
//     around them, because in a black frame the eyes are what you actually
//     track, and they arrive before the body does.
//   * CLOTH IS ALWAYS RUINED. Anything woven hangs in strips and moves a beat
//     behind the body.
//
// Every one of these is a pure function of position and tick-time. Nothing
// here knows anything the state does not carry.
// ---------------------------------------------------------------------------

// scale, palette, family. `s` is kept close to the old values so the hit boxes
// in pickWorld still frame the art.
const BEAST = {
  goblin:            { s: .78, fam: 'fallen',  hide: ['#5a4a2c', '#7a6438', '#2a2114'], eye: '#ffcf4a' },
  wolf:              { s: .95, fam: 'carrion', hide: ['#33302b', '#4e4840', '#151311'], eye: '#c8e04a' },
  bear:              { s: 1.25, fam: 'ursine', hide: ['#2e241a', '#463724', '#120c08'], eye: '#ff8a2a' },
  troll:             { s: 1.42, fam: 'brute',  hide: ['#3e4a3c', '#586452', '#191f18'], eye: '#9cf07a' },
  'skeleton-knight': { s: 1.05, fam: 'skeletal', hide: ['#b0a890', '#e2dcc4', '#4a4436'], eye: '#ff5a24' },
  siren:             { s: 1.15, fam: 'drowned', hide: ['#24444e', '#3e727c', '#0e1c22'], eye: '#8cf0f0' },
  'great-spider':    { s: 1.85, fam: 'arach',   hide: ['#241826', '#3e2c42', '#0c060e'], eye: '#ff2a48' },
  'shore-crab':      { s: 1.00, fam: 'carapace', hide: ['#6a3a26', '#96593a', '#2a1408'], eye: '#ffd85a' },
  sheep:             { s: .88, fam: 'sheep',    hide: ['#5a564c', '#7e7a6e', '#2a2723'], eye: '#c8c0a8' },
  dragon:            { s: 2.6, fam: 'wyrm',     hide: ['#42160f', '#6e2a18', '#140505'], eye: '#ffb03a' },
}

// ---- the grammar, as four helpers ----------------------------------------
function emberEyes(g, x, y, r, col, spread, glow) {
  g.save(); g.globalCompositeOperation = 'lighter'
  const gr = g.createRadialGradient(x, y, 0, x, y, (glow ?? 10) )
  gr.addColorStop(0, hexA(col, .5)); gr.addColorStop(1, hexA(col, 0))
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, glow ?? 10, 0, 7); g.fill()
  g.restore()
  g.fillStyle = col
  g.beginPath(); g.arc(x - spread, y, r, 0, 7); g.fill()
  g.beginPath(); g.arc(x + spread, y, r, 0, 7); g.fill()
  g.fillStyle = '#fff'
  g.beginPath(); g.arc(x - spread, y - r * .25, r * .42, 0, 7); g.fill()
  g.beginPath(); g.arc(x + spread, y - r * .25, r * .42, 0, 7); g.fill()
}
// horn, spine, tusk: whatever breaks the outline
function spike(g, x, y, len, ang, w, col) {
  poly(g, [[x + Math.cos(ang + 1.57) * w, y + Math.sin(ang + 1.57) * w],
           [x + Math.cos(ang - 1.57) * w, y + Math.sin(ang - 1.57) * w],
           [x + Math.cos(ang) * len, y + Math.sin(ang) * len]], col)
}
// cloth in strips, moving a beat behind whatever is wearing it
function tatters(g, x, y, w, h, col, t, n) {
  const k = n ?? 5
  for (let i = 0; i < k; i++) {
    const tx = x - w / 2 + (i + .5) * (w / k)
    const sway = Math.sin(t * 2.2 + i * .9) * (h * .12)
    poly(g, [[tx - w / k / 2, y], [tx + w / k / 2, y],
             [tx + w / k / 2 + sway, y + h * (.6 + (i % 3) * .18)],
             [tx - w / k / 2 + sway * .7, y + h * (.5 + (i % 2) * .22)]], col)
  }
}
// a limb that gets thinner toward the end, which is most of what stops a
// creature looking like a diagram of a creature
function limb(g, x0, y0, x1, y1, w0, w1, col) {
  const a = Math.atan2(y1 - y0, x1 - x0) + 1.5708
  poly(g, [[x0 + Math.cos(a) * w0, y0 + Math.sin(a) * w0],
           [x1 + Math.cos(a) * w1, y1 + Math.sin(a) * w1],
           [x1 - Math.cos(a) * w1, y1 - Math.sin(a) * w1],
           [x0 - Math.cos(a) * w0, y0 - Math.sin(a) * w0]], col)
}
// what a thing that can end you wears instead of a health bar
function eliteAura(g, cx, base, r, col, t) {
  g.save(); g.globalCompositeOperation = 'lighter'
  const p = .6 + Math.sin(t * 1.6) * .25
  const gr = g.createRadialGradient(cx, base - r * .3, 0, cx, base - r * .3, r)
  gr.addColorStop(0, hexA(col, .16 * p)); gr.addColorStop(1, hexA(col, 0))
  g.fillStyle = gr
  g.save(); g.translate(cx, base); g.scale(1, .5); g.translate(-cx, -base)
  g.beginPath(); g.arc(cx, base, r, 0, 7); g.fill(); g.restore()
  g.strokeStyle = hexA(col, .22 * p); g.lineWidth = 2
  g.beginPath(); g.ellipse(cx, base, r * .62, r * .3, 0, 0, 7); g.stroke()
  g.restore()
}

function drawBeast(g, cx, base, type, t, opt) {
  const B = BEAST[type] ?? BEAST.goblin
  const s = B.s * (opt?.scale ?? 1)
  const h = B.hide
  const breathe = Math.sin(t * 2.2 + cx * .05) * 1.5 * s
  const lean = opt?.mad ? 3 * s : 0
  const walk = opt?.moving ? 1 : 0
  const step = Math.sin(t * 7)

  switch (B.fam) {

    // ---- the fallen: hunched, eared, potbellied, always carrying something
    case 'fallen': {
      groundShadow(g, cx + 3 * s, base - 1, 19 * s, 8 * s, .62)
      const hipY = base - 13 * s, shY = base - 27 * s - breathe
      // splayed legs, knees out
      limb(g, cx - 4 * s, hipY, cx - 7 * s + step * 3 * s, base, 3.4 * s, 2 * s, h[2])
      limb(g, cx + 4 * s, hipY, cx + 7 * s - step * 3 * s, base, 3.4 * s, 2 * s, h[2])
      poly(g, [[cx - 8 * s, base], [cx - 4 * s, base], [cx - 5 * s, base - 3 * s]], h[2])
      // belly first, then the chest above it
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx + lean * .4, hipY - 5 * s, 9 * s, 8 * s, 0, 0, 7); g.fill()
      poly(g, [[cx - 10 * s + lean, shY], [cx + 10 * s + lean, shY],
               [cx + 7 * s, hipY - 2 * s], [cx - 7 * s, hipY - 2 * s]], h[1])
      poly(g, [[cx - 10 * s + lean, shY], [cx - 2 * s + lean, shY],
               [cx - 2 * s, hipY - 2 * s], [cx - 7 * s, hipY - 2 * s]], sh([122, 100, 56], 1.25))
      tatters(g, cx + lean * .5, hipY - 6 * s, 16 * s, 12 * s, '#3a2c1c', t, 4)
      // long arms, one dragging a spear
      limb(g, cx - 8 * s + lean, shY + 3 * s, cx - 13 * s, hipY + 6 * s, 3 * s, 2 * s, h[1])
      const swx = cx + 12 * s + lean + (opt?.swinging ? Math.sin(t * 9) * 5 * s : 0)
      limb(g, cx + 8 * s + lean, shY + 3 * s, swx, hipY + 2 * s, 3 * s, 2 * s, h[1])
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 2.2 * s
      g.beginPath(); g.moveTo(swx - 3 * s, hipY + 10 * s); g.lineTo(swx + 2 * s, shY - 14 * s); g.stroke()
      spike(g, swx + 2 * s, shY - 14 * s, 7 * s, -1.4, 2.4 * s, '#9aa0a8')
      // the head: a wedge, all nose and ears
      const hy = shY - 7 * s
      poly(g, [[cx - 6 * s + lean, hy], [cx + 6 * s + lean, hy],
               [cx + 4 * s + lean, hy + 9 * s], [cx - 3 * s + lean, hy + 9 * s]], h[1])
      poly(g, [[cx - 3 * s + lean, hy + 4 * s], [cx - 12 * s + lean, hy + 7 * s],
               [cx - 3 * s + lean, hy + 9 * s]], h[1])                       // hooked snout
      spike(g, cx - 6 * s + lean, hy + 1 * s, 13 * s, 3.5, 3.6 * s, h[0])    // ears, huge
      spike(g, cx + 6 * s + lean, hy + 1 * s, 13 * s, -0.35, 3.6 * s, h[0])
      poly(g, [[cx - 7 * s + lean, hy - 1 * s], [cx + 7 * s + lean, hy - 1 * s],
               [cx + 5 * s + lean, hy - 5 * s], [cx - 5 * s + lean, hy - 5 * s]], '#5a1f18')  // cap
      emberEyes(g, cx - 1 * s + lean, hy + 4 * s, 1.5 * s, B.eye, 3 * s, 11 * s)
      break
    }

    // ---- carrion beast: lean, ribbed, spined, jaw too big for the skull
    case 'carrion': {
      groundShadow(g, cx + 3 * s, base - 1, 22 * s, 8 * s, .62)
      const bodyY = base - 15 * s - breathe * .5
      for (const [lx, ph, fw] of [[-9, 0, 1], [-6, 2.1, 1], [8, 1.05, 1], [11, 3.1, 1]]) {
        const fx = cx + lx * s + step * (walk ? 3.6 : 0) * s * (lx < 0 ? 1 : -1)
        limb(g, cx + lx * s, bodyY + 3 * s, fx, base, 3 * s, 1.6 * s, h[2])
        poly(g, [[fx - 3 * s, base], [fx + 3 * s, base], [fx + 1 * s, base - 3 * s]], h[2])
      }
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx, bodyY, 15 * s, 7.5 * s, -.05, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 2 * s, bodyY - 2.4 * s, 12 * s, 4 * s, -.05, 0, 7); g.fill()
      g.strokeStyle = h[2]; g.lineWidth = 1.2 * s                            // ribs showing
      for (let i = 0; i < 4; i++) {
        g.beginPath(); g.arc(cx - 2 * s + i * 5 * s, bodyY + 1 * s, 6 * s, .6, 2.4); g.stroke()
      }
      for (let i = 0; i < 6; i++)                                            // dorsal spines
        spike(g, cx - 10 * s + i * 4.4 * s, bodyY - 6 * s - Math.abs(i - 2.5) * .6 * s,
          5.5 * s - Math.abs(i - 2.5) * .8 * s, -1.7 - (i - 2.5) * .08, 1.5 * s, h[2])
      const hx2 = cx - 15 * s, hy2 = bodyY - 6 * s - breathe * .4
      poly(g, [[hx2 + 5 * s, hy2 - 4 * s], [hx2 + 6 * s, hy2 + 4 * s],
               [hx2 - 9 * s, hy2 + 3 * s], [hx2 - 8 * s, hy2 - 2 * s]], h[1])
      poly(g, [[hx2 - 8 * s, hy2 + 2 * s], [hx2 - 11 * s, hy2 + 6 * s],
               [hx2 + 4 * s, hy2 + 5 * s]], h[0])                            // dropped jaw
      g.fillStyle = '#e8e2d0'
      for (let i = 0; i < 5; i++) {
        g.beginPath(); g.moveTo(hx2 - 8 * s + i * 2.6 * s, hy2 + 3 * s)
        g.lineTo(hx2 - 7 * s + i * 2.6 * s, hy2 + 5.4 * s)
        g.lineTo(hx2 - 6 * s + i * 2.6 * s, hy2 + 3 * s); g.fill()
      }
      spike(g, hx2 + 2 * s, hy2 - 4 * s, 7 * s, -1.9, 2 * s, h[2])
      spike(g, hx2 + 5 * s, hy2 - 3 * s, 6 * s, -1.5, 1.8 * s, h[2])
      limb(g, cx + 13 * s, bodyY - 1 * s, cx + 24 * s, bodyY - 6 * s + Math.sin(t * 4) * 3 * s,
        2.6 * s, .8 * s, h[0])
      emberEyes(g, hx2 - 2 * s, hy2 - 1 * s, 1.3 * s, B.eye, 2.6 * s, 10 * s)
      break
    }

    // ---- ursine brute: all shoulder, small head, standing half up
    case 'ursine': {
      groundShadow(g, cx + 4 * s, base - 1, 24 * s, 10 * s, .66)
      const bodyY = base - 20 * s - breathe
      limb(g, cx - 7 * s, bodyY + 6 * s, cx - 9 * s + step * 3 * s, base, 5 * s, 3.6 * s, h[2])
      limb(g, cx + 7 * s, bodyY + 6 * s, cx + 10 * s - step * 3 * s, base, 5 * s, 3.6 * s, h[2])
      g.fillStyle = h[0]                                                     // the great hump
      g.beginPath(); g.ellipse(cx, bodyY, 17 * s, 14 * s, -.08, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 3 * s, bodyY - 8 * s, 14 * s, 7 * s, -.18, 0, 7); g.fill()
      for (let i = 0; i < 20; i++) {                                         // shag on the outline
        const a = (i / 20) * 6.283
        g.fillStyle = i % 3 ? h[0] : h[2]
        g.beginPath()
        g.ellipse(cx + Math.cos(a) * 16 * s, bodyY + Math.sin(a) * 13 * s,
          3.4 * s, 2.2 * s, a, 0, 7); g.fill()
      }
      const armSw = opt?.swinging ? Math.sin(t * 8) * 8 * s : 0
      limb(g, cx - 13 * s + lean, bodyY - 4 * s, cx - 20 * s + lean - armSw, bodyY + 12 * s,
        5.4 * s, 3.4 * s, h[0])
      for (let i = 0; i < 3; i++)                                            // claws
        spike(g, cx - 21 * s + lean - armSw + i * 2.6 * s, bodyY + 14 * s, 6 * s, 1.3 + i * .2, 1.3 * s, '#d8d0bc')
      limb(g, cx + 13 * s + lean, bodyY - 4 * s, cx + 20 * s + lean + armSw, bodyY + 12 * s,
        5.4 * s, 3.4 * s, h[1])
      const hx3 = cx - 4 * s + lean, hy3 = bodyY - 17 * s - breathe
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(hx3, hy3, 8 * s, 6.4 * s, -.1, 0, 7); g.fill()
      poly(g, [[hx3 - 6 * s, hy3], [hx3 - 15 * s, hy3 + 4 * s], [hx3 - 5 * s, hy3 + 5 * s]], h[0])
      g.fillStyle = h[2]
      g.beginPath(); g.arc(hx3 - 14 * s, hy3 + 4 * s, 2 * s, 0, 7); g.fill()
      g.fillStyle = h[0]
      g.beginPath(); g.arc(hx3 - 2 * s, hy3 - 6 * s, 3.2 * s, 0, 7); g.fill()
      g.beginPath(); g.arc(hx3 + 6 * s, hy3 - 5 * s, 3.2 * s, 0, 7); g.fill()
      emberEyes(g, hx3 - 5 * s, hy3, 1.4 * s, B.eye, 3 * s, 12 * s)
      break
    }

    // ---- brute: enormous torso, tiny head sunk between the shoulders, club
    case 'brute': {
      groundShadow(g, cx + 5 * s, base - 1, 26 * s, 11 * s, .68)
      const hipY = base - 16 * s, shY = base - 40 * s - breathe
      limb(g, cx - 6 * s, hipY, cx - 9 * s + step * 3 * s, base, 6 * s, 4.4 * s, h[2])
      limb(g, cx + 6 * s, hipY, cx + 9 * s - step * 3 * s, base, 6 * s, 4.4 * s, h[2])
      poly(g, [[cx - 14 * s, base], [cx - 4 * s, base], [cx - 6 * s, base - 4 * s]], h[2])
      poly(g, [[cx + 4 * s, base], [cx + 14 * s, base], [cx + 6 * s, base - 4 * s]], h[2])
      poly(g, [[cx - 18 * s + lean, shY + 4 * s], [cx + 18 * s + lean, shY + 4 * s],
               [cx + 9 * s, hipY], [cx - 9 * s, hipY]], h[0])
      poly(g, [[cx - 18 * s + lean, shY + 4 * s], [cx - 3 * s + lean, shY + 4 * s],
               [cx - 3 * s, hipY], [cx - 9 * s, hipY]], h[1])
      g.fillStyle = h[1]                                                     // shoulder masses
      g.beginPath(); g.ellipse(cx - 16 * s + lean, shY + 4 * s, 9 * s, 7 * s, -.3, 0, 7); g.fill()
      g.beginPath(); g.ellipse(cx + 16 * s + lean, shY + 4 * s, 9 * s, 7 * s, .3, 0, 7); g.fill()
      for (let i = 0; i < 3; i++) {                                          // spines out of the back
        spike(g, cx + 8 * s + i * 5 * s, shY + 8 * s + i * 5 * s, 9 * s, -.5 + i * .2, 2.4 * s, h[2])
      }
      tatters(g, cx + lean * .5, hipY - 4 * s, 26 * s, 16 * s, '#2e2a20', t, 5)
      limb(g, cx - 17 * s + lean, shY + 8 * s, cx - 22 * s, hipY + 12 * s, 5.4 * s, 3.6 * s, h[0])
      const cxx = cx + 22 * s + lean + (opt?.swinging ? Math.sin(t * 7) * 8 * s : 0)
      limb(g, cx + 17 * s + lean, shY + 8 * s, cxx, hipY + 8 * s, 5.4 * s, 3.6 * s, h[1])
      g.strokeStyle = '#3a2e1c'; g.lineWidth = 4.4 * s                        // the club
      g.beginPath(); g.moveTo(cxx, hipY + 12 * s); g.lineTo(cxx + 6 * s, shY - 6 * s); g.stroke()
      g.fillStyle = '#4a3c24'
      g.beginPath(); g.ellipse(cxx + 7 * s, shY - 10 * s, 8 * s, 9 * s, .2, 0, 7); g.fill()
      for (let i = 0; i < 4; i++)
        spike(g, cxx + 7 * s + Math.cos(i * 1.6) * 7 * s, shY - 10 * s + Math.sin(i * 1.6) * 8 * s,
          5 * s, i * 1.6, 1.6 * s, '#8d876f')
      const hy4 = shY - 2 * s
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + lean, hy4, 6.4 * s, 5.4 * s, 0, 0, 7); g.fill()
      poly(g, [[cx - 4 * s + lean, hy4 + 2 * s], [cx + 5 * s + lean, hy4 + 2 * s],
               [cx + 1 * s + lean, hy4 + 8 * s]], h[0])                      // jaw
      g.fillStyle = '#e8e2d0'
      spike(g, cx - 2 * s + lean, hy4 + 5 * s, 4 * s, -1.6, 1.2 * s, '#e8e2d0')
      spike(g, cx + 3 * s + lean, hy4 + 5 * s, 3.4 * s, -1.6, 1.1 * s, '#e8e2d0')
      emberEyes(g, cx + lean, hy4 - 1 * s, 1.5 * s, B.eye, 2.8 * s, 12 * s)
      break
    }

    // ---- skeletal knight: ribcage, horned helm, kite shield, ruined tabard
    case 'skeletal': {
      groundShadow(g, cx + 3 * s, base - 1, 18 * s, 8 * s, .6)
      const hipY = base - 19 * s, shY = base - 34 * s
      const sw = opt?.swinging ? Math.sin(t * 9) : -.4
      limb(g, cx - 3 * s, hipY, cx - 5 * s + step * 3 * s, base, 2.4 * s, 1.8 * s, h[0])
      limb(g, cx + 3 * s, hipY, cx + 5 * s - step * 3 * s, base, 2.4 * s, 1.8 * s, h[0])
      g.strokeStyle = h[0]; g.lineWidth = 2.6 * s                             // spine
      g.beginPath(); g.moveTo(cx, hipY); g.lineTo(cx + lean * .4, shY); g.stroke()
      poly(g, [[cx - 7 * s + lean, shY], [cx + 7 * s + lean, shY],
               [cx + 5 * s, hipY + 2 * s], [cx - 5 * s, hipY + 2 * s]], '#2e2a22')
      g.strokeStyle = h[1]; g.lineWidth = 2 * s                               // ribs
      for (let i = 0; i < 4; i++) {
        const ry = shY + 3 * s + i * 3.4 * s
        g.beginPath(); g.moveTo(cx - 6 * s + lean, ry)
        g.quadraticCurveTo(cx + lean, ry + 2.6 * s, cx + 6 * s + lean, ry); g.stroke()
      }
      tatters(g, cx + lean * .5, hipY, 15 * s, 15 * s, '#4a1a18', t, 4)       // tabard
      g.fillStyle = '#6a6254'                                                 // pauldrons
      g.beginPath(); g.ellipse(cx - 8 * s + lean, shY + 1 * s, 5.4 * s, 4.4 * s, -.4, 0, 7); g.fill()
      g.beginPath(); g.ellipse(cx + 8 * s + lean, shY + 1 * s, 5.4 * s, 4.4 * s, .4, 0, 7); g.fill()
      spike(g, cx - 10 * s + lean, shY - 1 * s, 6 * s, -2.4, 1.6 * s, '#8a8272')
      spike(g, cx + 10 * s + lean, shY - 1 * s, 6 * s, -.7, 1.6 * s, '#8a8272')
      // shield arm and sword arm
      g.fillStyle = '#4e4638'
      poly(g, [[cx - 15 * s + lean, shY + 1 * s], [cx - 7 * s + lean, shY + 3 * s],
               [cx - 8 * s + lean, shY + 17 * s], [cx - 15 * s + lean, shY + 13 * s]], '#4e4638')
      g.strokeStyle = '#7a7264'; g.lineWidth = 1.4
      g.beginPath(); g.moveTo(cx - 15 * s + lean, shY + 5 * s); g.lineTo(cx - 8 * s + lean, shY + 7 * s); g.stroke()
      boss3(g, cx - 11.5 * s + lean, shY + 8 * s, 2.4 * s)
      const hx5 = cx + 10 * s + lean + Math.cos(sw) * 6 * s
      const hy5 = shY + 6 * s + Math.sin(sw) * 6 * s
      limb(g, cx + 7 * s + lean, shY + 3 * s, hx5, hy5, 2.4 * s, 1.8 * s, h[0])
      drawWeapon(g, hx5, hy5, sw, s * 1.1, 'iron-sword')
      // the helm
      const hy6 = shY - 8 * s
      g.fillStyle = '#5e564a'
      g.beginPath(); g.ellipse(cx + lean, hy6, 5.4 * s, 6 * s, 0, 0, 7); g.fill()
      g.fillStyle = '#0a0806'
      g.beginPath(); g.ellipse(cx + lean, hy6 + 1 * s, 3.4 * s, 3 * s, 0, 0, 7); g.fill()
      spike(g, cx - 5 * s + lean, hy6 - 2 * s, 12 * s, -2.5, 2.4 * s, '#6e6658')
      spike(g, cx + 5 * s + lean, hy6 - 2 * s, 12 * s, -.6, 2.4 * s, '#6e6658')
      g.fillStyle = 'rgba(255,244,214,.25)'
      g.beginPath(); g.ellipse(cx - 2 * s + lean, hy6 - 2.4 * s, 2.4 * s, 1.6 * s, 0, 0, 7); g.fill()
      emberEyes(g, cx + lean, hy6 + 1 * s, 1.2 * s, B.eye, 2.2 * s, 11 * s)
      break
    }

    // ---- drowned: a torso rising out of the water, hair, no legs
    case 'drowned': {
      const bob = Math.sin(t * 1.4) * 2.4 * s
      g.save(); g.globalCompositeOperation = 'lighter'                        // the water she sits in
      const wg = g.createRadialGradient(cx, base, 0, cx, base, 30 * s)
      wg.addColorStop(0, 'rgba(90,190,200,.18)'); wg.addColorStop(1, 'rgba(90,190,200,0)')
      g.fillStyle = wg
      g.save(); g.translate(cx, base); g.scale(1, .38); g.translate(-cx, -base)
      g.beginPath(); g.arc(cx, base, 30 * s, 0, 7); g.fill(); g.restore(); g.restore()
      for (let i = 0; i < 3; i++) {
        const p = ((t * .5 + i * .33) % 1)
        g.strokeStyle = 'rgba(140,240,240,' + (.3 * (1 - p)) + ')'; g.lineWidth = 1.4
        g.beginPath(); g.ellipse(cx, base, 8 * s + p * 22 * s, (8 * s + p * 22 * s) * .38, 0, 0, 7); g.stroke()
      }
      const shY = base - 30 * s + bob
      poly(g, [[cx - 8 * s + lean, shY], [cx + 8 * s + lean, shY],
               [cx + 6 * s, base - 4 * s], [cx - 6 * s, base - 4 * s]], h[0])
      poly(g, [[cx - 8 * s + lean, shY], [cx - 1 * s + lean, shY],
               [cx - 1 * s, base - 4 * s], [cx - 6 * s, base - 4 * s]], h[1])
      for (let i = 0; i < 4; i++)                                             // fins along the arms
        spike(g, cx - 9 * s + lean, shY + 4 * s + i * 4 * s, 7 * s, 3.3, 1.6 * s, h[1])
      const reach = opt?.mad ? Math.sin(t * 3) * 5 * s : 0
      limb(g, cx - 7 * s + lean, shY + 3 * s, cx - 17 * s - reach, shY + 14 * s, 3 * s, 1.6 * s, h[0])
      limb(g, cx + 7 * s + lean, shY + 3 * s, cx + 17 * s + reach, shY + 12 * s, 3 * s, 1.6 * s, h[1])
      for (let i = 0; i < 3; i++) {
        spike(g, cx - 18 * s - reach + i * 1.6 * s, shY + 15 * s, 5 * s, 1.2 + i * .25, 1 * s, '#c8e8e8')
        spike(g, cx + 18 * s + reach - i * 1.6 * s, shY + 13 * s, 5 * s, 1.9 - i * .25, 1 * s, '#c8e8e8')
      }
      const hy7 = shY - 7 * s
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + lean, hy7, 5.4 * s, 6.4 * s, 0, 0, 7); g.fill()
      for (let i = 0; i < 9; i++) {                                           // weed for hair
        const a = -2.9 + i * .34
        g.strokeStyle = i % 2 ? '#1e3a3a' : '#2a4e4a'; g.lineWidth = 2.4 * s
        g.beginPath(); g.moveTo(cx + lean + Math.cos(a) * 5 * s, hy7 + Math.sin(a) * 5 * s)
        g.quadraticCurveTo(cx + lean + Math.cos(a) * 15 * s + Math.sin(t * 1.6 + i) * 4 * s,
          hy7 + 8 * s, cx + lean + Math.cos(a) * 13 * s, hy7 + 22 * s); g.stroke()
      }
      g.fillStyle = '#0a1416'
      g.beginPath(); g.ellipse(cx + lean, hy7 + 3 * s, 2.6 * s, 3.4 * s, 0, 0, 7); g.fill()
      emberEyes(g, cx + lean, hy7 - 1 * s, 1.4 * s, B.eye, 2.6 * s, 13 * s)
      break
    }

    // ---- the spider queen: abdomen first, then legs over it
    case 'arach': {
      eliteAura(g, cx, base, 46 * s, '#ff2a48', t)
      groundShadow(g, cx + 4 * s, base - 1, 30 * s, 12 * s, .66)
      const bodyY = base - 15 * s - breathe
      g.fillStyle = h[0]                                                      // abdomen, bulbous
      g.beginPath(); g.ellipse(cx + 12 * s, bodyY - 6 * s, 17 * s, 14 * s, .12, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + 9 * s, bodyY - 11 * s, 11 * s, 7 * s, .12, 0, 7); g.fill()
      g.fillStyle = '#7a1024'                                                 // the mark on the back
      poly(g, [[cx + 12 * s, bodyY - 16 * s], [cx + 17 * s, bodyY - 8 * s],
               [cx + 12 * s, bodyY - 2 * s], [cx + 7 * s, bodyY - 8 * s]], '#7a1024')
      for (let i = 0; i < 8; i++) {                                           // eight legs, jointed
        const side = i < 4 ? -1 : 1, k = i % 4
        const spread = (k - 1.5) * .38
        const wob = Math.sin(t * (walk ? 6 : 1.4) + i) * (walk ? .18 : .06)
        const kx = cx + side * (14 + k * 6) * s
        const ky = bodyY - 22 * s + Math.abs(spread) * 8 * s
        const fx = kx + side * (10 + k * 3) * s
        limb(g, cx + side * 4 * s, bodyY - 4 * s, kx, ky + wob * 20 * s, 3.4 * s, 2.4 * s, h[1])
        limb(g, kx, ky + wob * 20 * s, fx, base - 1 * s, 2.4 * s, 1 * s, h[0])
        for (let q = 0; q < 3; q++)
          spike(g, kx + (fx - kx) * (q / 3), ky + wob * 20 * s + (base - ky) * (q / 3),
            4 * s, -1.6, 1 * s, h[2])
      }
      g.fillStyle = h[1]                                                      // cephalothorax
      g.beginPath(); g.ellipse(cx - 8 * s, bodyY - 3 * s, 11 * s, 8.4 * s, 0, 0, 7); g.fill()
      g.fillStyle = h[2]
      g.beginPath(); g.ellipse(cx - 15 * s, bodyY - 1 * s, 7 * s, 5.4 * s, 0, 0, 7); g.fill()
      for (const side of [-1, 1])                                             // fangs
        spike(g, cx - 18 * s, bodyY + 2 * s + side * 1.6 * s, 8 * s, 2.9 + side * .25, 1.8 * s, '#d8ccb0')
      for (let i = 0; i < 8; i++) {                                           // a cluster of eyes
        const ex = cx - 20 * s + (i % 4) * 2.8 * s, ey = bodyY - 4 * s + ((i / 4) | 0) * 3 * s
        g.save(); g.globalCompositeOperation = 'lighter'
        const eg = g.createRadialGradient(ex, ey, 0, ex, ey, 6 * s)
        eg.addColorStop(0, hexA(B.eye, .4)); eg.addColorStop(1, hexA(B.eye, 0))
        g.fillStyle = eg; g.beginPath(); g.arc(ex, ey, 6 * s, 0, 7); g.fill(); g.restore()
        g.fillStyle = B.eye; g.beginPath(); g.arc(ex, ey, 1.2 * s, 0, 7); g.fill()
      }
      break
    }

    // ---- carapace: armoured, one claw far bigger than the other
    case 'carapace': {
      groundShadow(g, cx + 3 * s, base - 1, 22 * s, 8 * s, .6)
      const bodyY = base - 9 * s - breathe * .4
      for (let i = 0; i < 6; i++) {
        const side = i < 3 ? -1 : 1, k = i % 3
        const fx = cx + side * (16 + k * 5) * s + (walk ? Math.sin(t * 8 + i) * 2.4 * s : 0)
        limb(g, cx + side * 7 * s, bodyY, cx + side * (13 + k * 3) * s, bodyY - 5 * s, 2.6 * s, 1.8 * s, h[2])
        limb(g, cx + side * (13 + k * 3) * s, bodyY - 5 * s, fx, base, 1.8 * s, .9 * s, h[0])
      }
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx, bodyY, 16 * s, 10 * s, 0, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 2 * s, bodyY - 3 * s, 12 * s, 5.4 * s, 0, 0, 7); g.fill()
      g.strokeStyle = h[2]; g.lineWidth = 1.4 * s                             // plate seams
      for (let i = 0; i < 4; i++) {
        g.beginPath(); g.moveTo(cx - 12 * s + i * 7 * s, bodyY - 8 * s)
        g.lineTo(cx - 10 * s + i * 7 * s, bodyY + 8 * s); g.stroke()
      }
      for (let i = 0; i < 5; i++)                                             // barnacle spines
        spike(g, cx - 10 * s + i * 5 * s, bodyY - 9 * s, 5 * s, -1.5 + (i - 2) * .2, 1.6 * s, h[2])
      const bigSw = opt?.swinging ? Math.sin(t * 6) * 6 * s : 0
      // the great claw
      limb(g, cx - 13 * s, bodyY - 2 * s, cx - 24 * s - bigSw, bodyY - 12 * s, 4.4 * s, 3.4 * s, h[0])
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 28 * s - bigSw, bodyY - 15 * s, 9 * s, 6 * s, -.5, 0, 7); g.fill()
      poly(g, [[cx - 34 * s - bigSw, bodyY - 19 * s], [cx - 24 * s - bigSw, bodyY - 16 * s],
               [cx - 36 * s - bigSw, bodyY - 12 * s]], h[0])
      // and the small one
      limb(g, cx + 13 * s, bodyY - 1 * s, cx + 20 * s, bodyY - 6 * s, 3 * s, 2.4 * s, h[0])
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + 22 * s, bodyY - 8 * s, 4.4 * s, 3 * s, -.4, 0, 7); g.fill()
      for (const ex of [-4, 4])                                               // eyes on stalks
        limb(g, cx + ex * s, bodyY - 8 * s, cx + ex * 1.4 * s, bodyY - 15 * s, 1.4 * s, 1.2 * s, h[0])
      emberEyes(g, cx, bodyY - 16 * s, 1.6 * s, B.eye, 5.6 * s, 9 * s)
      break
    }

    // ---- the sheep, which is a sheep, and stays a sheep -------------------
    case 'sheep': {
      groundShadow(g, cx + 3 * s, base - 1, 18 * s, 7 * s, .5)
      const bodyY = base - 14 * s - breathe * .4
      g.strokeStyle = h[2]; g.lineWidth = 3 * s; g.lineCap = 'round'
      for (const [lx, ph] of [[-7, 0], [-4, 2.1], [6, 1.05], [9, 3.1]]) {
        g.beginPath(); g.moveTo(cx + lx * s, bodyY + 3 * s)
        g.lineTo(cx + lx * s + (walk ? Math.sin(t * 7 + ph) * 2.6 * s : 0), base); g.stroke()
      }
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * 6.283
        g.fillStyle = i % 3 ? '#cfc8b4' : '#a8a08c'
        g.beginPath(); g.arc(cx + Math.cos(a) * 12 * s, bodyY + Math.sin(a) * 7 * s, 4.4 * s, 0, 7); g.fill()
      }
      g.fillStyle = '#ded8c6'
      g.beginPath(); g.ellipse(cx - 2 * s, bodyY - 2 * s, 10 * s, 5 * s, 0, 0, 7); g.fill()
      const hx8 = cx - 13 * s, hy8 = bodyY - 4 * s
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(hx8, hy8, 5 * s, 4 * s, -.2, 0, 7); g.fill()
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(hx8 - 3 * s, hy8 + 3 * s, 3.4 * s, 2.4 * s, 0, 0, 7); g.fill()
      g.fillStyle = h[2]
      g.beginPath(); g.ellipse(hx8 + 3 * s, hy8 - 3 * s, 3 * s, 2 * s, .4, 0, 7); g.fill()
      g.fillStyle = B.eye
      g.beginPath(); g.arc(hx8 - 2 * s, hy8 - 1 * s, 1.1 * s, 0, 7); g.fill()
      break
    }

    // ---- the wyrm: the one thing on this island that is simply larger
    case 'wyrm': {
      eliteAura(g, cx, base, 62 * s, '#ff6a1a', t)
      groundShadow(g, cx + 6 * s, base - 1, 34 * s, 13 * s, .7)
      const bodyY = base - 22 * s - breathe
      const flap = Math.sin(t * 1.9)
      // the far wing, behind everything
      wing(g, cx, bodyY, -1, flap, s, h, .72)
      // tail, sweeping
      let px2 = cx + 10 * s, py2 = bodyY + 4 * s
      for (let i = 1; i <= 5; i++) {
        const nx = cx + (10 + i * 8) * s
        const ny = bodyY + 6 * s + Math.sin(t * 1.5 - i * .5) * 4 * s + i * 1.6 * s
        limb(g, px2, py2, nx, ny, (8 - i) * s, (7 - i) * s, i % 2 ? h[0] : h[1])
        spike(g, nx, ny - (6 - i) * s, (9 - i) * s, -1.5, 1.8 * s, h[2])
        px2 = nx; py2 = ny
      }
      spike(g, px2, py2, 12 * s, .3, 4 * s, h[2])
      // legs, planted wide
      limb(g, cx - 8 * s, bodyY + 8 * s, cx - 15 * s, base, 7 * s, 4.4 * s, h[0])
      limb(g, cx + 6 * s, bodyY + 8 * s, cx + 12 * s, base, 7 * s, 4.4 * s, h[1])
      for (let i = 0; i < 3; i++) {
        spike(g, cx - 17 * s + i * 3 * s, base, 6 * s, 2.6 + i * .3, 1.6 * s, '#e0d4b8')
        spike(g, cx + 10 * s + i * 3 * s, base, 6 * s, .5 + i * .3, 1.6 * s, '#e0d4b8')
      }
      // barrel chest
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx, bodyY, 20 * s, 15 * s, -.06, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 3 * s, bodyY - 5 * s, 15 * s, 8 * s, -.1, 0, 7); g.fill()
      g.fillStyle = '#8a5a2a'                                                 // belly plates
      for (let i = 0; i < 5; i++) {
        g.beginPath(); g.ellipse(cx - 10 * s + i * 5 * s, bodyY + 10 * s, 3.4 * s, 2 * s, 0, 0, 7); g.fill()
      }
      for (let i = 0; i < 5; i++)                                             // dorsal ridge
        spike(g, cx - 12 * s + i * 6 * s, bodyY - 13 * s, 10 * s - Math.abs(i - 2) * 1.6 * s,
          -1.5 + (i - 2) * .12, 2.4 * s, h[2])
      // neck and skull
      const nx2 = cx - 20 * s, ny2 = bodyY - 22 * s - breathe
      limb(g, cx - 8 * s, bodyY - 6 * s, nx2, ny2, 8 * s, 5.4 * s, h[0])
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(nx2 - 5 * s, ny2, 10 * s, 6 * s, -.16, 0, 7); g.fill()
      poly(g, [[nx2 - 13 * s, ny2 + 1 * s], [nx2 - 18 * s, ny2 + 5 * s],
               [nx2 - 4 * s, ny2 + 6 * s], [nx2 - 2 * s, ny2 + 2 * s]], h[0])   // jaw
      g.fillStyle = '#e8dcc0'
      for (let i = 0; i < 4; i++)
        spike(g, nx2 - 14 * s + i * 3.4 * s, ny2 + 3 * s, 4 * s, 1.6, 1.1 * s, '#e8dcc0')
      spike(g, nx2 - 2 * s, ny2 - 5 * s, 15 * s, -1.1, 3 * s, h[2])           // horns
      spike(g, nx2 + 2 * s, ny2 - 4 * s, 13 * s, -.75, 2.6 * s, h[2])
      g.save(); g.globalCompositeOperation = 'lighter'                         // fire in the throat
      const fg = g.createRadialGradient(nx2 - 13 * s, ny2 + 3 * s, 0, nx2 - 13 * s, ny2 + 3 * s, 12 * s)
      fg.addColorStop(0, 'rgba(255,180,60,' + (.35 + Math.sin(t * 3) * .2) + ')')
      fg.addColorStop(1, 'rgba(255,120,20,0)')
      g.fillStyle = fg; g.beginPath(); g.arc(nx2 - 13 * s, ny2 + 3 * s, 12 * s, 0, 7); g.fill(); g.restore()
      emberEyes(g, nx2 - 6 * s, ny2 - 2 * s, 2 * s, B.eye, 4 * s, 18 * s)
      // the near wing, over the body
      wing(g, cx, bodyY, 1, flap, s, h, 1)
      break
    }
  }
}
// one wing, membraned between four fingers
function wing(g, cx, bodyY, side, flap, s, h, lit) {
  const sp = 42 * s, rise = 34 * s + flap * 14 * s
  const tip = [cx + side * sp, bodyY - rise]
  const elbow = [cx + side * 20 * s, bodyY - rise * .78]
  poly(g, [[cx, bodyY - 8 * s], elbow, tip,
           [cx + side * 34 * s, bodyY - 4 * s], [cx + side * 18 * s, bodyY + 2 * s]],
    lit > .9 ? h[1] : h[2])
  g.strokeStyle = h[2]; g.lineWidth = 2.4 * s
  g.beginPath(); g.moveTo(cx, bodyY - 8 * s); g.lineTo(elbow[0], elbow[1]); g.lineTo(tip[0], tip[1]); g.stroke()
  for (let i = 1; i <= 3; i++) {
    const fx = cx + side * (12 + i * 9) * s, fy = bodyY - 2 * s + i * 1.4 * s
    g.strokeStyle = h[2]; g.lineWidth = 1.8 * s
    g.beginPath(); g.moveTo(elbow[0], elbow[1]); g.lineTo(fx, fy); g.stroke()
  }
  spike(g, elbow[0], elbow[1], 8 * s, side > 0 ? -.6 : -2.5, 2 * s, h[2])
}
// a shield boss, which the knight needs and the panel's `boss` cannot reach
function boss3(g, bx, by, r) {
  const bg = g.createRadialGradient(bx - r * .4, by - r * .4, 0, bx, by, r)
  bg.addColorStop(0, '#b4ac98'); bg.addColorStop(1, '#4a4438')
  g.fillStyle = bg; g.beginPath(); g.arc(bx, by, r, 0, 7); g.fill()
}
// ---- the ember that every fire in the world actually is --------------------
// Drawn live and additively: the same routine paints a campfire, a firemaking
// fire, and a watchfire, differing only in how much of it there is.
function drawFlame(g, cx, base, t, size, seed) {
  const n = 5 + (size * 4 | 0)
  for (let i = 0; i < n; i++) {
    const p = (t * (1.6 + (i % 3) * .5) + i * .618 + seed) % 1
    const w = (5 + (i % 4) * 2.4) * size * (1 - p * .55)
    const x = cx + Math.sin((t * 2.6 + i * 1.7)) * 3.4 * size * p
    const y = base - p * 26 * size
    // Wider than it is tall at the base, and the pale core kept small: a
    // narrow column of near-white is a plasma jet, not a fire, and bloom
    // exaggerates whatever it is given.
    g.fillStyle = p < .18 ? 'rgba(255,226,150,' + (.7 - p) + ')'
      : p < .58 ? 'rgba(244,138,34,' + (.74 - p * .55) + ')'
      : 'rgba(158,46,12,' + (.46 - p * .38) + ')'
    g.beginPath(); g.ellipse(x, y, w * .70, w * .80, 0, 0, 7); g.fill()
  }
  for (let i = 0; i < 4; i++) {              // cinders leaving
    const p = (t * .55 + i * .27 + seed) % 1
    g.fillStyle = 'rgba(255,170,70,' + (.75 * (1 - p)) + ')'
    g.fillRect(cx + Math.sin(t * 1.6 + i * 2) * 12 * size * p, base - p * 60 * size, 1.6, 1.6)
  }
}

// ---------------------------------------------------------------------------
// THE PACK: one icon per noun
// ---------------------------------------------------------------------------
// 34 pixels square, because that is what a slot is. Weapons share a shape
// vocabulary with the things drawn in hands out in the world, so a iron
// sword in the pack and a iron sword in a fist are recognisably the same
// object, which is the entire job of an inventory icon.
function itemIcon(item) {
  return sprite('i:' + item, 34, 34, (g, W, H, R) => {
    const cx = W / 2, cy = H / 2
    const m = metalOf(item)
    const blade = (len, wide) => {
      poly(g, [[cx, cy - len], [cx + wide, cy - len + 5], [cx + wide * .6, cy + 7], [cx - wide * .6, cy + 7], [cx - wide, cy - len + 5]], m[0])
      poly(g, [[cx, cy - len], [cx + wide * .35, cy - len + 5], [cx, cy + 7], [cx - wide, cy - len + 5]], m[1])
      g.strokeStyle = m[2]; g.lineWidth = 3.4
      g.beginPath(); g.moveTo(cx - 7, cy + 8); g.lineTo(cx + 7, cy + 8); g.stroke()
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 3
      g.beginPath(); g.moveTo(cx, cy + 9); g.lineTo(cx, cy + 15); g.stroke()
      g.fillStyle = m[0]; g.beginPath(); g.arc(cx, cy + 16, 2.4, 0, 7); g.fill()
    }
    const haft = (top) => { g.strokeStyle = METAL.wood[0]; g.lineWidth = 3
      g.beginPath(); g.moveTo(cx + 6, cy + 14); g.lineTo(cx - 4, top); g.stroke() }

    if (/^(iron|star)-(sword)$/.test(item)) { blade(13, 4.4); return }
    if (/^(iron|star)-(dagger)$/.test(item)) { blade(8, 3.6); return }
    if (/^(iron|star)-(spear)$/.test(item)) {
      haft(cy - 8)
      poly(g, [[cx - 4, cy - 6], [cx - 6, cy - 15], [cx, cy - 9]], m[1])
      poly(g, [[cx - 4, cy - 6], [cx - 6, cy - 15], [cx - 8, cy - 6]], m[0]); return }
    if (/^(iron|star)-(maul)$/.test(item)) {
      haft(cy - 6)
      poly(g, [[cx - 12, cy - 12], [cx + 2, cy - 14], [cx + 3, cy - 5], [cx - 11, cy - 3]], m[0])
      poly(g, [[cx - 12, cy - 12], [cx + 2, cy - 14], [cx + 2, cy - 10], [cx - 12, cy - 8]], m[1]); return }
    if (item === 'old-chain') {
      // A COIL OF CHAIN, in the pack. It was a ball on a stick here too.
      const m2 = METAL.iron
      const link = (x, y, a, flat) => {
        g.save(); g.translate(x, y); g.rotate(a)
        g.strokeStyle = flat ? m2[1] : m2[0]; g.lineWidth = 1.7
        g.beginPath(); g.ellipse(0, 0, 4.2, flat ? 1.5 : 2.6, 0, 0, 7); g.stroke(); g.restore()
      }
      // the coil: a loop of links lying over itself
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * 6.283
        link(cx + Math.cos(a) * 9, cy - 3 + Math.sin(a) * 5.5, a + 1.57, i % 2 === 0)
      }
      // and a tail hanging out of it, so it reads as a length rather than a ring
      for (let i = 0; i < 4; i++) {
        const t2 = i / 4
        link(cx + 7 + t2 * 3, cy + 4 + t2 * 9, 1.2 + Math.sin(t2 * 3) * .4, i % 2 === 0)
      }
      return }
    if (/flail/.test(item)) {
      g.strokeStyle = METAL.iron[0]; g.lineWidth = 2
      g.beginPath(); g.moveTo(cx + 7, cy + 13); g.lineTo(cx + 1, cy - 2); g.lineTo(cx - 6, cy - 9); g.stroke()

    if (item === 'forage') {

      g.strokeStyle = METAL.dragon[1]; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 2, cy - 12)
      g.quadraticCurveTo(cx + 7, cy, cx - 2, cy + 12); g.stroke()
      g.strokeStyle = METAL.dragon[0]; g.lineWidth = 2
      g.beginPath(); g.moveTo(cx - 2, cy - 12); g.quadraticCurveTo(cx - 6, cy - 13, cx - 5, cy - 9); g.stroke()
      g.beginPath(); g.moveTo(cx - 2, cy + 12); g.quadraticCurveTo(cx - 6, cy + 13, cx - 5, cy + 9); g.stroke()
      g.strokeStyle = 'rgba(244,226,196,.75)'; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 2, cy - 12); g.lineTo(cx - 2, cy + 12); g.stroke()
      g.save(); g.globalCompositeOperation = 'lighter'

    if (item === 'wand') {

      g.beginPath(); g.moveTo(cx - 7, cy + 8); g.lineTo(cx + 6, cy - 8); g.stroke()
      g.strokeStyle = '#2a2114'; g.lineWidth = 3.2
      g.beginPath(); g.moveTo(cx - 5, cy + 5); g.lineTo(cx - 1, cy); g.stroke()
      g.fillStyle = '#cfe2e6'
      g.beginPath(); g.arc(cx + 6, cy - 8, 2.4, 0, 7); g.fill()
      g.save(); g.globalCompositeOperation = 'lighter'
      g.fillStyle = 'rgba(160,206,224,.45)'
      g.beginPath(); g.arc(cx + 6, cy - 8, 5.5, 0, 7); g.fill(); g.restore()

    if (item === 'goo-staff') {
      // the same thing the hand holds, small: dark shaft, silk grip, wet head
      g.strokeStyle = '#2f3326'; g.lineWidth = 2.8
      g.beginPath(); g.moveTo(cx - 5, cy + 11); g.quadraticCurveTo(cx + 1, cy, cx + 3, cy - 11); g.stroke()
      g.strokeStyle = '#5e6b46'; g.lineWidth = 2.8       // silk, ON the shaft
      g.beginPath(); g.moveTo(cx - 1.7, cy + 4.4); g.lineTo(cx - 1.0, cy + 0.6); g.stroke()
      g.fillStyle = '#7fbf5a'
      g.beginPath(); g.ellipse(cx + 2.6, cy - 10.4, 2.1, 2.5, .2, 0, 7); g.fill()
      g.fillStyle = '#bfe89a'
      g.beginPath(); g.ellipse(cx + 1.9, cy - 11.2, .7, .85, .3, 0, 7); g.fill()
      g.fillStyle = '#7fbf5a'
      g.beginPath(); g.arc(cx + 3.1, cy - 6.4, .95, 0, 7); g.fill()
      g.save(); g.globalCompositeOperation = 'lighter'
      g.fillStyle = 'rgba(150,214,120,.42)'
      g.beginPath(); g.arc(cx + 2.6, cy - 10.4, 4.2, 0, 7); g.fill(); g.restore()

    if (/staff/.test(item)) {

      g.strokeStyle = heart ? METAL.heartwood[0] : '#4a3a22'; g.lineWidth = 2.6
      g.beginPath(); g.moveTo(cx - 5, cy + 11); g.quadraticCurveTo(cx + 1, cy, cx + 3, cy - 11); g.stroke()
      g.strokeStyle = '#2a2114'; g.lineWidth = 3
      g.beginPath(); g.moveTo(cx - 2, cy + 3); g.lineTo(cx - 1, cy - 1); g.stroke()
      g.fillStyle = heart ? METAL.heartwood[0] : '#5a4626'
      g.beginPath(); g.ellipse(cx + 3, cy - 11, 2.6, 3.2, .2, 0, 7); g.fill()
      g.save(); g.globalCompositeOperation = 'lighter'
      g.fillStyle = 'rgba(232,204,120,.4)'
      g.beginPath(); g.arc(cx + 3, cy - 11, 5, 0, 7); g.fill(); g.restore()

    if (/hatchet/.test(item)) {

      poly(g, [[cx - 4, cy - 11], [cx + 5, cy - 14], [cx + 7, cy - 4], [cx - 3, cy - 4]], m[0])

    if (/pickaxe/.test(item)) {

      g.beginPath(); g.moveTo(cx - 13, cy - 6); g.quadraticCurveTo(cx - 4, cy - 15, cx + 6, cy - 9); g.stroke()
      g.strokeStyle = m[1]; g.lineWidth = 1.2
      g.beginPath(); g.moveTo(cx - 12, cy - 7); g.quadraticCurveTo(cx - 4, cy - 14, cx + 5, cy - 9); g.stroke(); return }
    if (/helm/.test(item)) {
      g.fillStyle = m[0]; g.beginPath(); g.ellipse(cx, cy + 2, 10, 11, 0, Math.PI, 0); g.fill()
      g.fillRect(cx - 10, cy + 2, 20, 5)
      g.fillStyle = m[1]; g.beginPath(); g.ellipse(cx - 3, cy, 5, 6, 0, Math.PI, 0); g.fill()
      g.fillStyle = '#0a0808'; g.fillRect(cx - 7, cy + 3, 14, 3)
      if (item === 'star-helm') { g.strokeStyle = m[1]; g.lineWidth = 2
        g.beginPath(); g.moveTo(cx - 9, cy - 2); g.quadraticCurveTo(cx - 15, cy - 8, cx - 12, cy - 13); g.stroke()
        g.beginPath(); g.moveTo(cx + 9, cy - 2); g.quadraticCurveTo(cx + 15, cy - 8, cx + 12, cy - 13); g.stroke() }

      // a hollow where the face should be and a bone trim at the shoulders.

      // the shadowed right half, for form

      // the hood rising to a peak
      poly(g, [[cx - 6, cy - 4], [cx, cy - 15], [cx + 6, cy - 4], [cx, cy - 6]], cloth, clothLo, 1)

    if (/plate/.test(item)) {

      poly(g, [[cx - 10, cy - 10], [cx - 1, cy - 10], [cx - 1, cy + 12], [cx - 8, cy + 12]], m[1])
      g.strokeStyle = m[2]; g.lineWidth = 1.4
      for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(cx - 10, cy - 10 + i * 5.5); g.lineTo(cx + 10, cy - 10 + i * 5.5); g.stroke() }

    if (/bow$/.test(item)) {
      g.strokeStyle = m[0]; g.lineWidth = 3
      g.beginPath(); g.arc(cx + 5, cy, 13, 2.1, 4.2); g.stroke()
      g.strokeStyle = m[1]; g.lineWidth = 1
      g.beginPath(); g.arc(cx + 5, cy, 13, 2.2, 4.1); g.stroke()
      g.strokeStyle = 'rgba(220,208,180,.7)'; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 1.6, cy - 11.4); g.lineTo(cx - 1.6, cy + 11.4); g.stroke()
      if (item === 'sigil-bow') { g.fillStyle = 'rgba(140,224,255,.8)'
        g.beginPath(); g.arc(cx + 5, cy, 3, 0, 7); g.fill() }

    if (item === 'crossbow') {
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 3.4
      g.beginPath(); g.moveTo(cx - 9, cy + 9); g.lineTo(cx + 8, cy - 6); g.stroke()
      g.strokeStyle = METAL.iron[0]; g.lineWidth = 2.6
      g.beginPath(); g.arc(cx + 6, cy - 4, 10, -.4, 2.2); g.stroke()
      g.strokeStyle = 'rgba(220,208,180,.6)'; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 3, cy - 10); g.lineTo(cx + 12, cy + 3); g.stroke(); return }
    if (item === 'handgonne') {
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 3.4
      g.beginPath(); g.moveTo(cx - 9, cy + 12); g.lineTo(cx, cy + 1); g.stroke()
      poly(g, [[cx-1,cy+2],[cx+9,cy-8],[cx+12,cy-5],[cx+2,cy+5]], '#5a616b', '#31363d')
      g.fillStyle = '#181c21'; g.beginPath(); g.arc(cx + 10.2, cy - 6.6, 2.5, 0, 6.3); g.fill()
      g.fillStyle = '#8a939d'; g.fillRect(cx + 1.4, cy - 0.4, 3, 1.7)
      g.fillStyle = 'rgba(255,170,70,.55)'; g.beginPath(); g.arc(cx + 3.4, cy - 1.4, 1.6, 0, 6.3); g.fill()
      return }
    if (item === 'shot') {
      for (const [ox, oy] of [[-6,3],[1,1],[-2,8],[6,7]]) {
        g.fillStyle = '#464b53'; g.beginPath(); g.arc(cx + ox, cy + oy, 3.3, 0, 6.3); g.fill()
        g.fillStyle = 'rgba(255,255,255,.32)'; g.beginPath(); g.arc(cx + ox - 1.1, cy + oy - 1.2, 1.1, 0, 6.3); g.fill()
      }
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 1.7
      g.beginPath(); g.arc(cx, cy + 4, 9.5, 2.5, 6.9); g.stroke(); return }
    if (item === 'arrows') {
      for (let i = 0; i < 3; i++) {
        const ox = cx - 7 + i * 7
        g.strokeStyle = METAL.wood[0]; g.lineWidth = 1.6
        g.beginPath(); g.moveTo(ox, cy + 13); g.lineTo(ox + 2, cy - 9); g.stroke()
        poly(g, [[ox + 2, cy - 13], [ox + 4.4, cy - 7], [ox - .4, cy - 7]], '#b9c0c8')
        g.strokeStyle = '#c8bfa4'; g.lineWidth = 1
        g.beginPath(); g.moveTo(ox, cy + 12); g.lineTo(ox - 3, cy + 7); g.stroke()
        g.beginPath(); g.moveTo(ox, cy + 12); g.lineTo(ox + 3, cy + 7); g.stroke()
      } return }
    if (item === 'logs' || item === 'heartwood') {
      const c0 = item === 'heartwood' ? ['#5a2f18', '#8a4a24', '#2e160a'] : ['#4a3a22', '#6e5836', '#241a0e']
      for (const [ox, oy] of [[-6, 4], [5, 4], [0, -5]]) {
        g.fillStyle = c0[0]
        g.beginPath(); g.ellipse(cx + ox, cy + oy, 8, 5, 0, 0, 7); g.fill()
        g.fillStyle = c0[1]
        g.beginPath(); g.ellipse(cx + ox - 1, cy + oy - 1, 5.4, 3.2, 0, 0, 7); g.fill()
        g.strokeStyle = c0[2]; g.lineWidth = 1
        g.beginPath(); g.ellipse(cx + ox - 1, cy + oy - 1, 3, 1.8, 0, 0, 7); g.stroke()

    if (item === 'ore') {
      for (const [ox, oy, r] of [[-5, 4, 7], [5, 3, 6], [1, -6, 6]]) {
        g.fillStyle = '#463f38'; g.beginPath(); g.arc(cx + ox, cy + oy, r, 0, 7); g.fill()
        g.fillStyle = '#5e564c'; g.beginPath(); g.arc(cx + ox - 1.4, cy + oy - 1.8, r * .58, 0, 7); g.fill()
        g.fillStyle = '#a5762e'; g.beginPath(); g.arc(cx + ox + 1.6, cy + oy + 1, 1.6, 0, 7); g.fill()
      } return }
    if (item === 'magic-stone' || item === 'sigil' || item === 'glass-stone') {
      poly(g, [[cx, cy - 12], [cx + 9, cy - 2], [cx + 5, cy + 11], [cx - 5, cy + 11], [cx - 9, cy - 2]], '#2b3a54')
      poly(g, [[cx, cy - 12], [cx + 9, cy - 2], [cx, cy + 2], [cx - 9, cy - 2]], '#4e6f9e')
      poly(g, [[cx, cy - 12], [cx, cy + 2], [cx - 9, cy - 2]], '#7fb4e0')
      g.fillStyle = 'rgba(190,236,255,.75)'; g.fillRect(cx - 4, cy - 8, 2.4, 5); return }
    if (item === 'bones') {
      g.strokeStyle = '#cfc6ab'; g.lineWidth = 4.6; g.lineCap = 'round'
      g.beginPath(); g.moveTo(cx - 8, cy + 7); g.lineTo(cx + 8, cy - 7); g.stroke()
      g.strokeStyle = '#9e957c'; g.lineWidth = 1.6
      g.beginPath(); g.moveTo(cx - 8, cy + 7); g.lineTo(cx + 8, cy - 7); g.stroke()
      g.fillStyle = '#e0d8bd'
      for (const [ox, oy] of [[-10, 5], [-6, 9], [10, -5], [6, -9]])
        { g.beginPath(); g.arc(cx + ox, cy + oy, 3.2, 0, 7); g.fill() }
      return }
    if (/fish/.test(item)) {
      const cooked = item.startsWith('cooked'), burnt = item.startsWith('burnt')

      g.fillStyle = c0[0]; g.beginPath(); g.ellipse(cx - 1, cy, 11, 6.4, 0, 0, 7); g.fill()
      g.fillStyle = c0[1]; g.beginPath(); g.ellipse(cx - 2, cy - 1.6, 8.4, 3.4, 0, 0, 7); g.fill()
      poly(g, [[cx + 9, cy], [cx + 15, cy - 6], [cx + 15, cy + 6]], c0[0])
      poly(g, [[cx - 3, cy - 6], [cx + 3, cy - 6], [cx, cy - 11]], c0[1])
      g.fillStyle = burnt ? '#151210' : '#e8f0f4'
      g.beginPath(); g.arc(cx - 7, cy - 1, 1.7, 0, 7); g.fill(); return }
    if (item === 'ale' || item === 'broth') {
      const liq = item === 'ale' ? '#a5691e' : '#7c8a3a'
      poly(g, [[cx - 7, cy - 9], [cx + 7, cy - 9], [cx + 6, cy + 12], [cx - 6, cy + 12]], '#2b2620')
      poly(g, [[cx - 5.4, cy - 5], [cx + 5.4, cy - 5], [cx + 4.6, cy + 10], [cx - 4.6, cy + 10]], liq)
      g.fillStyle = 'rgba(255,246,220,.65)'; g.fillRect(cx - 4.4, cy - 4, 2, 12)
      g.fillStyle = '#e6dcc0'
      g.beginPath(); g.ellipse(cx, cy - 6, 6, 2.4, 0, 0, 7); g.fill()
      g.strokeStyle = '#2b2620'; g.lineWidth = 2.2
      g.beginPath(); g.arc(cx + 9, cy + 1, 4.4, -1.2, 1.2); g.stroke(); return }
    if (item === 'seeds' || item === 'grain') {
      poly(g, [[cx - 8, cy - 2], [cx + 8, cy - 2], [cx + 6, cy + 12], [cx - 6, cy + 12]], '#5a4a30')
      poly(g, [[cx - 8, cy - 2], [cx - 1, cy - 2], [cx - 1, cy + 12], [cx - 6, cy + 12]], '#78633f')
      for (let i = 0; i < 11; i++) {
        g.fillStyle = item === 'grain' ? '#c9a552' : '#8a9a48'
        g.beginPath(); g.ellipse(cx - 7 + R() * 14, cy - 4 + R() * 5, 2.2, 1.4, R() * 3, 0, 7); g.fill()
      } return }
    if (item === 'wool') {
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * 6.28
        g.fillStyle = i % 2 ? '#cfc8b4' : '#a8a08c'
        g.beginPath(); g.arc(cx + Math.cos(a) * 7, cy + Math.sin(a) * 6, 5, 0, 7); g.fill()
      }
      g.fillStyle = '#e0dac8'; g.beginPath(); g.arc(cx - 2, cy - 2, 5, 0, 7); g.fill(); return }
    if (item === 'gold-coin') {
      g.fillStyle = '#8a6415'; g.beginPath(); g.arc(cx, cy + 2, 11, 0, 7); g.fill()
      g.fillStyle = '#e8b53a'; g.beginPath(); g.arc(cx, cy, 11, 0, 7); g.fill()
      g.strokeStyle = '#a5801f'; g.lineWidth = 1.6
      g.beginPath(); g.arc(cx, cy, 7.6, 0, 7); g.stroke()
      g.fillStyle = 'rgba(255,246,214,.5)'; g.fillRect(cx - 5, cy - 7, 6, 2.2); return }
    if (item === 'crab-shell') {
      g.fillStyle = '#7c5238'; g.beginPath(); g.ellipse(cx, cy + 1, 12, 8, 0, Math.PI, 0); g.fill()
      g.fillStyle = '#a06a44'; g.beginPath(); g.ellipse(cx - 3, cy - 1, 7, 4.4, 0, Math.PI, 0); g.fill()
      g.strokeStyle = '#4a2e1e'; g.lineWidth = 1.2
      for (let i = 0; i < 4; i++) { g.beginPath()
        g.moveTo(cx - 9 + i * 6, cy + 1); g.lineTo(cx - 7 + i * 6, cy - 7); g.stroke() }
      return }
    if (item === 'chart') {   // 6ci: the surveyor's good, drawn as a rolled map
      poly(g, [[cx - 11, cy - 9], [cx + 11, cy - 11], [cx + 10, cy + 11], [cx - 10, cy + 9]], '#b9a87e')
      poly(g, [[cx - 11, cy - 9], [cx + 11, cy - 11], [cx + 10, cy - 6], [cx - 10, cy - 4]], '#d4c69c')
      g.strokeStyle = '#6a5836'; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 7, cy + 5); g.quadraticCurveTo(cx, cy - 4, cx + 7, cy + 2); g.stroke()
      g.fillStyle = '#8a2a1e'; g.beginPath(); g.arc(cx + 4, cy + 4, 2, 0, 7); g.fill(); return }
    // an unknown noun still deserves a shape rather than a blank
    poly(g, [[cx - 9, cy - 9], [cx + 9, cy - 9], [cx + 9, cy + 9], [cx - 9, cy + 9]], '#3a332a')
    g.fillStyle = '#6e6250'; g.font = '700 13px Cinzel, Georgia, serif'
    g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillText(String(item)[0].toUpperCase(), cx, cy + 1)
  })
}
// ===========================================================================
// THE SIXTEEN MARKS
// ---------------------------------------------------------------------------
// Not ported from the reference window. Those are coloured pixel art tuned to
// sit on parchment in a bright top-down view; dropped in here they would read
// as stickers laid on the furniture. These are ENGRAVED: one silhouette, no
// interior detail, cut into the stone with a dark bevel under it and a gold
// gradient over, the same way the panel's rivets and filigree are cut. They
// have to survive at ten pixels, so every one is a shape and nothing else.
//
// Each painter draws paths ONLY -- it never sets a colour. The caller sets the
// style and runs it twice, once for the cut and once for the metal, which is
// what makes it look struck rather than drawn.
const GLYPH = {
  woodcutting: (g, S) => {                       // an axe
    g.beginPath()
    g.moveTo(S * .30, S * .88); g.lineTo(S * .46, S * .30)
    g.lineTo(S * .58, S * .34); g.lineTo(S * .42, S * .92); g.closePath(); g.fill()
    g.beginPath()
    g.moveTo(S * .46, S * .30); g.lineTo(S * .62, S * .06)
    g.quadraticCurveTo(S * .95, S * .18, S * .82, S * .48)
    g.lineTo(S * .58, S * .34); g.closePath(); g.fill()
  },
  mining: (g, S) => {                            // a pick
    g.beginPath()
    g.moveTo(S * .40, S * .34); g.lineTo(S * .56, S * .30)

// struck once, then blitted: sixteen glyphs at three sizes is forty-eight
// little canvases for the life of the page
function skillGlyph(skill, S, tone) {
  return sprite('gly:' + skill + ':' + S + ':' + (tone ?? 'gold'), S + 2, S + 2, (g) => {
    const paint = GLYPH[skill]; if (!paint) return
    // the cut: the shape pressed a pixel down and to the right, in shadow
    g.save(); g.translate(1.2, 1.4)
    g.fillStyle = 'rgba(0,0,0,.75)'
    paint(g, S); g.restore()
    // and the metal standing in it
    const grd = g.createLinearGradient(0, 0, 0, S)
    if (tone === 'dim') { grd.addColorStop(0, '#8f8267'); grd.addColorStop(1, '#5d5342') }
    else if (tone === 'bright') { grd.addColorStop(0, '#fdf3d2'); grd.addColorStop(.55, '#f0d089'); grd.addColorStop(1, '#a8802e') }
    else { grd.addColorStop(0, '#f2dda2'); grd.addColorStop(.5, '#c39a44'); grd.addColorStop(1, '#7a5a1e') }
    g.fillStyle = grd
    paint(g, S)
    // one highlight along the top of the shape, which is what sells the relief
    g.save()
    g.globalCompositeOperation = 'source-atop'
    const hi = g.createLinearGradient(0, 0, 0, S * .45)
    hi.addColorStop(0, 'rgba(255,250,230,.55)'); hi.addColorStop(1, 'rgba(255,250,230,0)')
    g.fillStyle = hi; g.fillRect(0, 0, S + 2, S * .45)
    g.restore()
  })
}

// A NAME FOR SOMEBODY WHO IS JUST SOMEBODY.
//
// Fifteen people live in houses and do no particular job, and the window used
// to call each of them "Keeper" -- which is worse than calling them nothing,
// because it says the world ran out of ideas. They are not keepers. They live
// there.
//
// The name is drawn deterministically from where they stand, so every window
// agrees and the same neighbour is the same neighbour forever. The syllables
// are English village stock on purpose: nobody in Tallyholm should be called
// something a generator would pick.
const _RN_A = ['Ald', 'Bram', 'Cob', 'Dun', 'Ed', 'Far', 'Gil', 'Hal', 'Ing',
               'Jos', 'Ket', 'Lem', 'Mar', 'Ned', 'Orm', 'Pen', 'Quen', 'Rid',
               'Sam', 'Tam', 'Ulf', 'Ver', 'Wen', 'Yar']
const _RN_B = ['', '', 'a', 'e', 'wy', 'i', 'ou', 'y']
const _RN_C = ['bury', 'den', 'ett', 'ford', 'gar', 'ham', 'kin', 'ley', 'mer',
               'nell', 'ott', 'ric', 'sey', 'ton', 'ward', 'wick']
function residentName(n) {
  // >>> throughout: a signed shift on anything past two-to-the-thirty-first
  // comes back negative, and a negative index reads `undefined`, so half the
  // island was called Samundefinedundefined.
  const u = (((n.x | 0) * 73856093) ^ ((n.y | 0) * 19349663)) >>> 0
  return _RN_A[u % _RN_A.length]
    + _RN_B[(u >>> 5) % _RN_B.length]
    + _RN_C[(u >>> 9) % _RN_C.length]
}
// ===========================================================================
// THE FORTY PLACES
// ---------------------------------------------------------------------------
// A landmark answers to no verb in this constitution. It cannot be gathered,
// fought, lit, read or consumed; it blocks its tile and it is otherwise inert.
// Which means the only thing it has to do is BE SOMEWHERE, and the only way it
// can fail is by being indistinguishable from something else.
//
// This used to be six painters covering thirty-eight nouns, so a bed, a table,
// a barrel, a cart and a scarecrow were all the same little crate -- and `web`,
// of which this island has thirty, had no entry at all and came out as a
// standing stone. Forty nouns, forty painters. The map tells the truth or it
// is a lie on every chart.
//
// Each painter is handed a context, the sprite size, a seeded generator, and
// (cx, base) where base is the CENTRE OF THE TILE. Everything is drawn upward
// from there.
// ===========================================================================

const WOOD = ['#4a3a22', '#67512f', '#291e10']
const OLDWOOD = ['#3d3527', '#564b38', '#221c14']
const ROCK = ['#3a352e', '#4e473d', '#231f1b']
const BONE = ['#b0a890', '#e0d9c0', '#5a5344']
const STRAW = ['#6a5a2e', '#8f7a3c', '#3e3418']
function plank(g, x, y, w, h, c, lit) {
  poly(g, [[x, y], [x + w, y - w * .5], [x + w, y - w * .5 - h], [x, y - h]], c)
  if (lit) { g.fillStyle = 'rgba(255,236,196,.12)'; g.fillRect(x, y - h, w * .4, 2) }
}
// an iso box: three faces, lit top-left
function isoBox(g, cx, base, hw, hd, h, c) {
  poly(g, [[cx - hw, base - hw * .5], [cx, base], [cx, base - h], [cx - hw, base - hw * .5 - h]], c[0])
  poly(g, [[cx, base], [cx + hd, base - hd * .5], [cx + hd, base - hd * .5 - h], [cx, base - h]], c[2])
  poly(g, [[cx - hw, base - hw * .5 - h], [cx, base - h], [cx + hd, base - hd * .5 - h],
           [cx + hd - hw, base - hw * .5 - hd * .5 - h]], c[1])
}
function stoneSlab(g, cx, base, w, h, lean) {
  const l = lean ?? 0
  poly(g, [[cx - w, base], [cx + w, base], [cx + w * .8 + l, base - h], [cx - w * .85 + l, base - h]], ROCK[0])
  poly(g, [[cx - w, base], [cx - w * .2, base], [cx - w * .2 + l, base - h], [cx - w * .85 + l, base - h]], ROCK[1])
  g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(cx - w * .9 + l * i / 4, base - h * i / 4)
    g.lineTo(cx + w * .9 + l * i / 4, base - h * i / 4 + 2); g.stroke()
  }
}
