<!doctype html>
<!-- INTERVAL: the lantern window.
     ==========================================================================
     Interval already had a dark window. `window-grim.html` is the flat window
     with the lights turned down, and `window-grim3d.html` is the deluxe window
     graded blue-black. Both are reskins, and a reskin is exactly what this one
     is not, because the thing worth taking from that lineage of games was
     never the palette.

     What makes a Diablo look like a Diablo is FOUR structural decisions, and
     none of them is a colour:

       1. THE CAMERA IS TURNED FORTY-FIVE DEGREES. The grid is still a grid --
          the constitution's grid, tile for tile -- but you never see it
          square-on. Every tile is a 2:1 diamond, every standing thing is a
          billboard on that diamond, and the world is sorted back-to-front by
          x+y. Depth is the whole point: things get in front of other things.

       2. YOU CARRY THE LIGHT. Not "the scene is dark" -- the scene is BLACK,
          and a guttering pool travels with you. Every fire in the world is a
          real light source punched out of that black, so a watchfire is
          visible as a glow on the horizon before it is visible as a fire.
          Interval's day/night cycle feeds the ambient; the torch never leaves.

       3. THE PANEL IS THE INTERFACE. Two glass orbs full of liquid, a belt of
          four things you can swallow without stopping, and everything else
          behind a button. The orbs are not gauges drawn as circles: the fluid
          has a surface, the surface has waves, the glass has a highlight, and
          under a third the life orb bleeds down the stone.

       4. THE WORLD ANSWERS THE CURSOR. Hover a beast and its name and health
          hang at the top of the screen. Hover anything at all and it lifts out
          of the murk. Hold ALT and every item on the ground names itself at
          once. Hold the button down and you keep walking.

     Everything below the wire is presentation and nothing else. This window
     signs the same inputs with the same key, mirrors the same geography from
     the same `terrain-mirror.mjs`, and carries the same constitutional
     identity block as every other window. It cannot see, do, or know one thing
     the flat window cannot. It simply stands somewhere darker.

     Serve it from the pillar: add to serve.mjs
       if (path === '/play/lantern' || path === '/diablo')
         return sendFile('./window-diablo.html', 'text/html')

     Left click: walk, gather, fight, take.  Hold: keep walking.
     Right click (in the pack): use the thing.  Shift+click: stand and strike.
     I pack · C citizen · TAB chart · ENTER speak · ALT name the ground ·
     1-4 the belt · ESC close.
     ========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Interval — the lantern window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  /* The whole window is one canvas. This stylesheet exists to hold the door
     open (the gate below), to kill every browser affordance that would break
     the illusion, and to name the palette once so the canvas code and the
     gate cannot drift apart. */
  :root {
    --void:    #050406;   /* the pitch behind the world */
    --crypt:   #0d0a0c;   /* panel field */
    --stone:   #221c18;   /* carved stone */
    --iron:    #3b322a;   /* the lit edge of carved stone */
    --gold-lo: #6a5220;
    --gold:    #b0913f;
    --gold-hi: #e8d199;
    --parch:   #cdbb99;
    --dim:     #8d7d63;
    --blood:   #7e130f;
    --blood-hi:#cf2a18;
    --ember:   #e07526;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--void);
    color: var(--parch);
    font: 13px/1.5 Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body { cursor: none; }            /* the window draws its own hand */
  canvas { display: block; touch-action: none; }
  #stage { position: fixed; inset: 0; }

  /* ---- the gate ---------------------------------------------------------
     Every one of these games opens on a still, dark room with fire in it and
     asks for your name before it will let you in. That moment is not a
     loading screen: it is the last second of not being there yet. */
  #gate {
    position: fixed; inset: 0; z-index: 40; cursor: default;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 70% 46% at 50% 116%, rgba(190,86,22,.30), transparent 64%),
      radial-gradient(ellipse 90% 70% at 50% -14%, rgba(38,20,30,.75), transparent 72%),
      #060406;
    text-align: center; padding: 24px;
  }
  #gate.gone { display: none; }
  #gate .emberwash {                /* the fire outside the frame, breathing */
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 46% 30% at 50% 108%, rgba(224,117,38,.34), transparent 70%);
    animation: gutter 5.5s ease-in-out infinite;
  }
  @keyframes gutter { 0%,100% { opacity: .55 } 37% { opacity: 1 } 62% { opacity: .72 } }
  @media (prefers-reduced-motion: reduce) { #gate .emberwash { animation: none; opacity: .8 } }

  #gate h1 {
    font: 900 clamp(38px, 9vw, 84px)/1 Cinzel, Georgia, serif;
    letter-spacing: .20em; text-indent: .20em; margin-bottom: 6px;
    background: linear-gradient(#f6e6b4 6%, #c39c3e 46%, #6d4c14 78%, #b8892c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #1a0f06) drop-shadow(0 0 26px rgba(224,117,38,.42));
    position: relative;
  }
  #gate .sub {
    font: 600 12px/1 Cinzel, Georgia, serif; letter-spacing: .42em; text-indent: .42em;
    color: #7d6a4c; margin-bottom: 30px; text-transform: uppercase;
  }
  #gate .rule {                     /* a hairline with a lozenge in it */
    width: min(420px, 74vw); height: 9px; margin-bottom: 30px; position: relative;
    background: linear-gradient(90deg, transparent, #55431e 22%, #55431e 78%, transparent);
    background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 4px;
  }
  #gate .rule::after {
    content: ''; position: absolute; left: 50%; top: 0; width: 9px; height: 9px;
    margin-left: -4.5px; background: #6a5220; transform: rotate(45deg);
    box-shadow: 0 0 0 1px #241a0c;
  }
  #gate .plate {                    /* the carved slab the controls sit in */
    background: linear-gradient(#181310, #0d0a08);
    border: 1px solid #3b2f1c; box-shadow: inset 0 0 0 1px #0a0705, 0 8px 30px rgba(0,0,0,.7);
    padding: 22px 26px 20px; width: min(430px, 92vw);
  }
  #gate label {
    display: block; font: 600 10px/1 Cinzel, Georgia, serif;
    letter-spacing: .28em; text-indent: .28em; color: #7d6a4c; margin-bottom: 9px;
    text-transform: uppercase;
  }
  #gate input {
    width: 100%; padding: 10px 12px; background: #070505; color: var(--gold-hi);
    border: 1px solid #4a3a20; outline: none;
    font: 600 15px/1 Cinzel, Georgia, serif; letter-spacing: .06em; text-align: center;
  }
  #gate input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(176,145,63,.28) }
  #gate .why { font-size: 11.5px; color: #6f6250; margin-top: 9px; min-height: 17px; font-style: italic }

  .dbtn {
    display: block; width: 100%; margin-top: 16px; padding: 12px 10px; cursor: pointer;
    background: linear-gradient(#3a2c14, #1d1409); color: var(--gold-hi);
    border: 1px solid #6a5220;
    font: 700 13px/1 Cinzel, Georgia, serif; letter-spacing: .22em; text-indent: .22em;
    text-transform: uppercase; transition: background .16s, border-color .16s, color .16s;
  }
  .dbtn:hover { background: linear-gradient(#4e3b1a, #2a1d0c); border-color: var(--gold); color: #fbf0cf }
  .dbtn:active { background: #1a1208 }
  .dbtn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px }
  .dbtn[disabled] { opacity: .45; cursor: default }

  #gate .minor { display: flex; gap: 18px; justify-content: center; margin-top: 22px; flex-wrap: wrap }
  #gate .minor button {
    background: none; border: none; cursor: pointer; color: #6f6250;
    font: 600 10px/1 Cinzel, Georgia, serif; letter-spacing: .16em; text-transform: uppercase;
  }
  #gate .minor button:hover { color: var(--gold) }
  #gate .foot { margin-top: 26px; font-size: 11.5px; color: #4e4437; max-width: 46ch; line-height: 1.7 }
  #gate .foot a { color: #6a5c46 }

  /* the one DOM survivor inside the world: a text field, because a canvas
     cannot take a keyboard on a phone. It sits over the message strip. */
  #say {
    position: fixed; z-index: 30; display: none;
    background: rgba(6,5,7,.94); color: var(--gold-hi);
    border: 1px solid var(--gold-lo); outline: none; padding: 7px 10px;
    font: 13px/1 Georgia, serif;
  }
  #say.on { display: block }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<input id="say" maxlength="80" autocomplete="off" spellcheck="false">

<div id="gate">
  <div class="emberwash"></div>
  <h1>INTERVAL</h1>
  <div class="sub">The Lantern Window</div>
  <div class="rule"></div>
  <div class="plate">
    <label for="gname">Name yourself</label>
    <input id="gname" maxlength="12" placeholder="unnamed" autocomplete="off" spellcheck="false">
    <div class="why" id="gwhy">A name costs 50 standing. You may walk in without one.</div>
    <button class="dbtn" id="genter">Enter the world</button>
    <div class="minor">
      <button id="gkey">Your key</button>
      <button id="gimport">Bring a key</button>
      <button id="gsound">Sound: on</button>
      <button id="gquality">Bloom: on</button>
    </div>
  </div>
  <p class="foot">The world is not in this page. It is a rule for turning one
  state into the next, agreed six hundred milliseconds at a time. This window
  only decides where to stand and how much light to admit.</p>
</div>

<script>
'use strict'
// ============================ GEOGRAPHY IS LAW ============================
// An inlined copy of terrain-mirror.mjs, exports stripped, byte for byte
// identical otherwise. Every window carries this so that no two citizens can
// disagree about where the Fens end. If this copy drifts, this window is in
// breach and should be refused at the door.
// ==========================================================================
// terrain-mirror.js — the window's copy of the world's own geography.
//
// This file used to exist THREE TIMES: once inside window-web.html, once
// inside window-3d.html, once inside window-photo.html, ~1,300 lines each,
// pasted. The copies had not yet disagreed about a single tile — 210,432
// were checked — but they had already drifted in two places that simply
// had not bitten yet:
//
//   * window-photo's copy had a RENDERING function (buildBridges, which
//     touches THREE and the scene graph) wedged inside the terrain block,
//     so the "pure functions" were not pure.
//   * window-3d's copy of the landmark registry was thirteen nouns behind,
//     and nothing noticed because nothing in that window ever read it.
//
// The reason this matters more here than in an ordinary codebase: geography
// is law. Two citizens whose windows disagree about where the Fens end
// cannot arrange to meet there. A copy that drifts is a window in breach of
// the constitution, and the previous arrangement had no way to find out.
// Now there is one file, and test/mirror.test.mjs checks it against the
// engine tile for tile.
//
// Everything here is a PURE FUNCTION of (generator, seed, size). No state,
// no tick, no player. Call configure() once when the world announces
// itself; call it again and every cache is dropped.

let W = 192, H = 96
let GEN = 'interval-classic-v1', GSEED = ''

function configure(opts = {}) {
  W = opts.worldW ?? opts.W ?? W
  H = opts.worldH ?? opts.H ?? H
  GEN = opts.generator ?? opts.gen ?? GEN
  GSEED = opts.seed ?? opts.genesisSeed ?? GSEED
  // a new world means every memo is about the old one
  _seedNumC = null
  _ssE = null
  _roadSet = null
  _ss3 = null
  _roads3 = null
  _shore4 = null
  _bio4 = null
  _ss4 = null
  _cost4 = null
  _roads4 = null
  _wallSet = null
  _signs = null
  _wallTick = -1; _signTick = -1
  return { W, H, GEN, GSEED }
}
const dims = () => ({ W, H, GEN, GSEED })

// V5 CHANGED THE FURNITURE, NOT THE LAND.
//
// worldgen-expanse5's own header says it: v4's land is right and stays exactly
// as it is, and nothing in v5 touches any of it. Every terrain function below
// is therefore correct for both -- but a check written `GEN === 'interval-
// expanse-v4'` silently falls through to the v3 branch for a v5 world, which
// is a whole island of wrong ground from one string comparison. window-web
// learned this and fixed it locally; this module did not, and since the module
// exists precisely so the windows cannot drift apart, the fix belongs here.
const IS_EXPANSE4 = () => GEN === 'interval-expanse-v4' || GEN === 'interval-expanse-v5'

const tileHash = (x, y, salt) => {
  let h = (x * 374761393 + y * 668265263 + salt * 1442695041) >>> 0
  h = (h ^ (h >> 13)) >>> 0; h = (h * 1274126177) >>> 0
  return (h ^ (h >> 16)) >>> 0
}

let _seedNumC = null, _ssE = null
function seedNumC() {
  if (_seedNumC !== null) return _seedNumC
  let h = 0
  for (let i = 0; i < GSEED.length; i++) h = Math.imul(h ^ GSEED.charCodeAt(i), 2654435761) | 0
  return (_seedNumC = h >>> 0)
}
function thashE(x, y, k) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(k | 0, 2246822519) + seedNumC()) | 0
  h = Math.imul(h ^ (h >>> 13), 1274126177)
  return (h ^ (h >>> 16)) >>> 0
}
function meander(tag, u, seg, amp) {
  const k = Math.floor(u / seg)
  const f = (u - k * seg) / seg
  const a = (thashE(k, 0, tag) % (2 * amp + 1)) - amp
  const b = (thashE(k + 1, 0, tag) % (2 * amp + 1)) - amp
  const sf = f * f * (3 - 2 * f)
  return a + (b - a) * sf
}
function riverXE(y) {
  const cx = Math.floor(W / 2)
  return cx + Math.round(meander(21, y, 46, 26) + meander(22, y, 14, 5))
}
function inSeaE(x, y) {
  const bx = W * 0.80, by = H * 0.74
  if (x < bx || y < by) return false
  return (x - bx) / (W - bx) + (y - by) / (H - by) > 0.55
}
function inPoolE(x, y) {
  if (y < H * 0.66) return false
  const bx = Math.floor(x / 7), by = Math.floor(y / 7)
  const h = thashE(bx, by, 7)
  if ((h & 255) > 34) return false
  const px = bx * 7 + ((h >>> 8) % 5), py = by * 7 + ((h >>> 16) % 5)
  return Math.abs(x - px) + Math.abs(y - py) <= 2
}
const isWaterE = (x, y) => inSeaE(x, y) || inPoolE(x, y) || Math.abs(x - riverXE(y)) <= 1
function settlementsE() {
  if (IS_EXPANSE4()) return settlementsE4()
  if (GEN === 'interval-expanse-v3') return settlementsE3()
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2)
  if (GEN === 'interval-expanse-v2') {
    // v2: the water towns stand on their water. Millbrook and Fenmarch on
    // the river's east bank, Eastmere opening on the bay. Mirror of
    // worldgen-expanse2.mjs settlementsOf, tile for tile.
    const mby = Math.round(H * 0.24), fmy = Math.round(H * 0.84)
    return [
      { x: cx, y: cy, w: 24, h: 14 },
      { x: Math.round(W * 0.46), y: Math.round(H * 0.14), w: 14, h: 10 },
      { x: riverXE(mby) + 6, y: mby, w: 14, h: 10 },
      { x: Math.round(W * 0.86), y: Math.round(H * 0.50), w: 14, h: 10 },
      { x: Math.round(W * 0.85), y: Math.round(H * 0.80), w: 14, h: 10 },
      { x: riverXE(fmy) + 6, y: fmy, w: 14, h: 10 },
      { x: Math.round(W * 0.26), y: Math.round(H * 0.46), w: 16, h: 12 },
    ]
  }
  return [
    { x: cx, y: cy, w: 24, h: 14 },
    { x: Math.round(W * 0.46), y: Math.round(H * 0.14), w: 14, h: 10 },
    { x: Math.round(W * 0.72), y: Math.round(H * 0.24), w: 14, h: 10 },
    { x: Math.round(W * 0.86), y: Math.round(H * 0.50), w: 14, h: 10 },
    { x: Math.round(W * 0.74), y: Math.round(H * 0.70), w: 14, h: 10 },
    { x: Math.round(W * 0.44), y: Math.round(H * 0.84), w: 14, h: 10 },
    { x: Math.round(W * 0.26), y: Math.round(H * 0.46), w: 16, h: 12 },
  ]
}
const ssE = () => (_ssE ??= settlementsE())
let _roadSet = null
function roadTilesE() {
  if (_roadSet) return _roadSet
  const ss = ssE(), a = ss[0]
  const set = new Set()
  for (let i = 1; i < ss.length; i++) {
    const s = ss[i]
    const vx = s.x - a.x, vy = s.y - a.y
    const L = Math.sqrt(vx * vx + vy * vy)
    const nx = -vy / L, ny = vx / L
    const steps = Math.ceil(L * 2)
    for (let stp = 0; stp <= steps; stp++) {
      const t = stp / steps
      const taper = Math.min(1, Math.min(t, 1 - t) * 6)
      const o = meander(90 + i, t * L, 26, 9) * taper
      const px = Math.round(a.x + vx * t + nx * o)
      const py = Math.round(a.y + vy * t + ny * o)
      set.add(px + ',' + py); set.add((px + 1) + ',' + py)
    }
  }
  return (_roadSet = set)
}
const onRoadE = (x, y) => roadTilesE().has(x + ',' + y)
function biomeAtE(x, y) {
  if (x <= Math.round(W * 0.19)) return 'wilds'
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2)
  const dx = (x - cx) / W, dy = (y - cy) / H
  if (dx * dx + dy * dy < 0.019) return 'meadow'
  if (y <= H * 0.32) return 'greenwood'
  if (x >= W * 0.70) return 'crags'
  if (y >= H * 0.70) return 'fens'
  return 'meadow'
}
function fordE(x, y) { // mirror of fordAt: the road crosses, and every main street crosses
  if (onRoadE(x, y)) return true
  for (const s of ssE()) {
    if (Math.abs(x - s.x) <= (s.w >> 1) && Math.abs(y - s.y) <= (s.h >> 1)
      && (x === s.x || y === s.y)) return true
  }
  return false
}
// ---- the third expanse (interval-expanse-v3): the island, mirrored ----
// An exact mirror of worldgen-expanse3.mjs: the coast by octant arithmetic
// (no atan2. ECMA-262 leaves it implementation-defined), the borders that
// are features, the road graph, and the fords painted as bridges.
function angleOf3(dx, dy) {
  const ax = dx < 0 ? -dx : dx, ay = dy < 0 ? -dy : dy
  if (ax === 0 && ay === 0) return 0
  if (dx > 0 && dy >= 0) return ax >= ay ? (ay / ax) * 45 : 90 - (ax / ay) * 45
  if (dx <= 0 && dy > 0) return ay > ax ? 90 + (ax / ay) * 45 : 180 - (ay / ax) * 45
  if (dx < 0 && dy <= 0) return ax >= ay ? 180 + (ay / ax) * 45 : 270 - (ax / ay) * 45
  return ay > ax ? 270 + (ax / ay) * 45 : 360 - (ay / ax) * 45
}
function coastR3(u0) {
  const u = ((u0 % 360) + 360) % 360
  let r = 0.80 + meander(301, u / 5, 10, 12) / 130 + meander(302, u / 5, 4, 6) / 160
  const bump = (c, w2, amt) => {
    const d1 = u - c < 0 ? c - u : u - c
    const d = d1 < 360 - d1 ? d1 : 360 - d1
    if (d < w2) r += amt * (1 - d / w2)
  }
  bump(180, 28, +0.18); bump(150, 12, -0.09); bump(210, 12, -0.09)
  bump(38, 22, -0.12); bump(78, 16, -0.07); bump(0, 14, +0.07); bump(305, 18, +0.06)
  return r
}
function inSeaBase3(x, y) {
  const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2)
  const r = Math.sqrt(dx * dx + dy * dy)
  if (r <= 0.52) return false
  return r > coastR3(angleOf3(dx, dy))
}
const emY3 = () => Math.round(H * 0.75)
const _shore3 = new Map()
function bayShoreX3(y) {
  if (_shore3.has(y)) return _shore3.get(y)
  let sx = null
  for (let x = W - 4; x >= Math.floor(W / 2); x--) if (!inSeaBase3(x, y)) { sx = x; break }
  _shore3.set(y, sx); return sx
}
function isles3() {
  const ey = emY3(), sh = bayShoreX3(ey) ?? Math.round(W * 0.7)
  return [{ x: sh + 22, y: ey + 26, rx: 10, ry: 7 }, { x: Math.round(W * 0.185), y: Math.round(H * 0.10), rx: 8, ry: 5 }]
}
function onIsle3(x, y) {
  for (const i of isles3()) { const dx = (x - i.x) / i.rx, dy = (y - i.y) / i.ry; if (dx * dx + dy * dy < 1) return true }
  return false
}
const inSea3 = (x, y) => inSeaBase3(x, y) && !onIsle3(x, y)
const brandX3 = (y) => Math.round(W * 0.235 + meander(310, y, 34, 7))
const ridgeX3 = (y) => Math.round(W * 0.685 + meander(311, y, 30, 9))
const treeY3 = (x) => Math.round(H * 0.30 + meander(312, x, 44, 11))
const fenY3 = (x) => Math.round(H * 0.71 + meander(313, x, 44, 9))
const passes3 = () => [Math.round(H * 0.37), Math.round(H * 0.655)]
function onRidge3(x, y) {
  const rx = ridgeX3(y); const d = x - rx < 0 ? rx - x : x - rx
  if (d > 2) return false
  for (const p of passes3()) { const pd = y - p < 0 ? p - y : y - p; if (pd < 4) return false }
  if (y < treeY3(x) - 8) return false
  if (inSeaBase3(x, y)) return false
  return true
}
const riverX3 = (y) => Math.floor(W / 2) + Math.round(meander(21, y, 52, 30) + meander(22, y, 16, 6))
const confY3 = () => Math.round(H * 0.63)
function marchWY3(x) {
  const cyy = confY3(); const reach = riverX3(cyy) - 8 - x
  const t = reach < 0 ? 0 : reach > 70 ? 1 : reach / 70
  return cyy + Math.round(meander(25, x, 36, 12) * t)
}
function inRiver3(x, y) {
  const srcY = Math.round(H * 0.115)
  if (y >= srcY) {
    const rx = riverX3(y); const d = x - rx < 0 ? rx - x : x - rx
    if (d <= (y > H * 0.82 ? 2 : 1)) return true
    if (y > H * 0.84) {
      const dx2 = rx - 7 + Math.round(meander(27, y, 9, 3)); const d2 = x - dx2 < 0 ? dx2 - x : x - dx2
      if (d2 <= 1) return true
    }
  }
  if (x < riverX3(confY3()) - 1 && x > brandX3(y) - 16) {

// they report is the boundary the engine will cross.

// ---------------------------------------------------------------------------
// Character for character the same handshake as every other window, because a
// window that invents its own is not a window into the same world. Two paths:
//
//   * The browser holds an Ed25519 key. It says `adopt`, then signs each input
//     itself and sends it as `raw`. The pillar relays; the engine judges. This
//     is the real one, and it is what a citizen wants: the pillar holds
//     nothing, and the same key works from any window on any machine.
//   * The browser cannot do Ed25519 (older Safari, some locked-down builds).
//     It says `auth` with a local uid and the pillar keeps a key on its
//     behalf. Fewer verbs reach the engine this way -- the pillar's `act`

// to the byte or every node in the world will ignore us
function canonicalJS(obj) {

async function ownIdentity() {
  if (!crypto?.subtle) return null
  try {
    const saved = localStorage.getItem('interval-ownkey')
    if (saved) {
      const { pk8, pub } = JSON.parse(saved)
      const priv = await crypto.subtle.importKey('pkcs8', fromHex(pk8), { name: 'Ed25519' }, true, ['sign'])
      return { priv, pub }
    }
    const kp = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify'])
    const pub = toHex(await crypto.subtle.exportKey('raw', kp.publicKey))
    const pk8 = toHex(await crypto.subtle.exportKey('pkcs8', kp.privateKey))
    localStorage.setItem('interval-ownkey', JSON.stringify({ pk8, pub }))
    return { priv: kp.privateKey, pub }
  } catch { return null }

  else { try { const j = JSON.parse(s); pk8 = j.pk8 ?? j.privateKey ?? j.priv ?? null } catch {} }
  if (!pk8 || !/^[0-9a-f]{80,200}$/.test(pk8)) return 'That is not a key this window can read.'
  try {

let ws = null, reconnectAt = 0
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host)
  ws.onopen = async () => {
    connected = true
    ownKey = await ownIdentity()
    if (ownKey) { usingRelay = false; ws.send(JSON.stringify({ type: 'adopt', pub: ownKey.pub })) }
    else { usingRelay = true; ws.send(JSON.stringify({ type: 'auth', uid })) }
  }
  ws.onclose = () => {
    connected = false
    say('The world has gone quiet. Listening for it again\u2026', 'warn')
    setTimeout(connect, 2000)
  }
  ws.onerror = () => { try { ws.close() } catch {} }
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data) } catch { return }
    if (m.type === 'hello') { myId = m.playerId; return }
    if (m.type === 'state') { onState(m.state, m.worldId); return }
    if (m.type === 'refused') {
      // WHY a thing did not happen. Without this, a refused deed and a dead
      // socket are the same observation. A move can be refused through nobody's
      // fault -- the input is stamped for the tick AFTER the frame it was
      // planned from, and beasts wander every tick -- so the transient ones say
      // so, and a citizen learns which refusals to argue with.
      const transient = /occupied|blocked|adjacent|reach|tick/i.test(m.why ?? '')
      say('Refused: ' + (m.of ?? '?') + (m.why ? ' \u2014 ' + m.why : '')
        + (transient ? ' (try again)' : ''), 'warn')
      return
    }
    if (m.type === 'chat') {
      bubbles[m.playerId] = { text: String(m.text).slice(0, 80), at: performance.now() }
      const sp = curState?.players?.[m.playerId]
      const mine = curState?.players?.[myId]
      const where = sp ? localeAt4(sp.x, sp.y) : null
      const far = (sp && mine) ? Math.max(Math.abs(sp.x - mine.x), Math.abs(sp.y - mine.y)) > 24 : false
      say((m.name || m.playerId.slice(0, 6)) + (where ? ' \u00b7 ' + where : '') + ': ' + m.text,
          far ? 'dim' : 'chat')
      if (m.playerId !== myId) SFX.chat()
      return
    }
  }
}

// At most two ticks of lookahead. Beyond that an eager clicker stamps
// ever-further futures and each impatient click makes the world LESS
// responsive. Resync whenever the stamp leaves the window it may occupy in
// either direction: reconnecting to an earlier state used to strand it in a
// future that never arrived, and every step was refused forever after.
function allocTick() {
  const cur = world?.tick ?? 0
  if (lastStamped < cur || lastStamped > cur + 2) lastStamped = cur
  const t = Math.max(cur + 1, lastStamped + 1)
  if (t > cur + 2) return null
  lastStamped = t
  return t
}

async function send(a) {
  if (!ws || ws.readyState !== 1) { say('Not connected to the world.', 'warn'); return }
  // the window sent it, so the window knows what it was: everything except a
  // footstep gets a gesture and a mark (52-scene). Local, presentational, and
  // it makes no claim the engine has to honour.
  if (a.do !== 'move') { try { noteDeed(a.do) } catch {} }
  if (usingRelay) { ws.send(JSON.stringify({ type: 'act', action: a })); return }
  const f = BRIDGE_TO_INPUT(a)
  if (!f) { say('This window has no wiring for "' + a.do + '" yet.', 'warn'); return }
  if (!curWorldId) { say('Still learning which world this is.', 'dim'); return }
  // ownIdentity() is awaited inside ws.onopen, so an eager click can arrive on an
  // open socket before the key exists. That used to throw here and swallow the deed.
  if (!ownKey) { say('Still finding your key\u2026', 'dim'); return }
  const tk = a._tick ?? allocTick()
  if (tk === null) return          // the tick line is full; the click in flight will do the job
  const input = { worldId: curWorldId, tick: tk, playerId: ownKey.pub, ...f }
  try {
    const sig = toHex(await crypto.subtle.sign('Ed25519', ownKey.priv,
      new TextEncoder().encode(DOMAIN_INPUT + canonicalJS(input))))
    ws.send(JSON.stringify({ type: 'raw', input: { ...input, sig } }))
  } catch { say('This browser refused to sign that.', 'warn') }
}

async function speak(text) {
  const t = String(text ?? '').trim().slice(0, 80)
  if (!t) return
  if (usingRelay) { ws.send(JSON.stringify({ type: 'act', action: { do: 'chat', text: t } })); return }
  if (!curWorldId || !ownKey) return
  const msg = { type: 'chat', worldId: curWorldId, playerId: ownKey.pub, tick: world?.tick ?? 0, text: t }
  const sig = toHex(await crypto.subtle.sign('Ed25519', ownKey.priv,
    new TextEncoder().encode(DOMAIN_CHAT + canonicalJS(msg))))
  ws.send(JSON.stringify({ type: 'rawsay', msg: { ...msg, sig } }))
}

// ---------------------------------------------------------------------------

// pure function of its seed and so, as far as it can manage, is its portrait.
//
// The rule the art obeys, and the reason it does not look like the flat window
// with the lights off:
//

//     mid facet and a shadow facet, never a flat fill and an outline.
//   * SILHOUETTE FIRST. These sprites are seen against near-black at a
//     distance, so the outline has to carry the noun on its own. Detail is
