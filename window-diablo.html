const groundOf = (k) => GROUND[k] ?? GROUND_DEFAULT

// the diamond, as a path, offset however you like
function diamond(g, ox, oy, inset) {
  const i = inset ?? 0
  g.beginPath()
  g.moveTo(ox + HW, oy + i)
  g.lineTo(ox + TW - i, oy + HH)
  g.lineTo(ox + HW, oy + TH - i)
  g.lineTo(ox + i, oy + HH)
  g.closePath()
}

// One tile of ground, painted four ways so a meadow is not a repeating stamp.
// The canvas is TW wide and TH + SKIRT tall: the diamond lives at the top and
// the rock face below it, so a lifted tile can be drawn in one blit.
const SKIRT = 22
const _tileArt = new Map()
function tileArt(kind, v) {
  const key = kind + v
  const hit = _tileArt.get(key); if (hit) return hit
  const G = groundOf(kind)
  const c = mkc(TW, TH + SKIRT), g = c.getContext('2d')
  const R = rng(kind.length * 7919 + v * 104729 + 13)
  const base = [G.c[0] + (R() - .5) * 8, G.c[1] + (R() - .5) * 8, G.c[2] + (R() - .5) * 8]

  // the face of the shelf this tile sits on, when it sits on one
  if (G.lift > 0) {
    const dep = G.lift + 8
    g.fillStyle = sh(base, 0.44)
    g.beginPath(); g.moveTo(0, HH); g.lineTo(HW, TH); g.lineTo(HW, TH + dep); g.lineTo(0, HH + dep); g.closePath(); g.fill()
    g.fillStyle = sh(base, 0.30)
    g.beginPath(); g.moveTo(HW, TH); g.lineTo(TW, HH); g.lineTo(TW, HH + dep); g.lineTo(HW, TH + dep); g.closePath(); g.fill()
    for (let i = 0; i < 14; i++) {          // strata in the rock face
      const t = R(), yy = TH + t * dep, xx = R() * TW
      g.fillStyle = rgb(0, 0, 0, .18 + R() * .18)
      g.fillRect(xx, yy - HH * Math.abs(xx - HW) / TW, 3 + R() * 9, 1)
    }
  }

  g.save(); diamond(g, 0, 0); g.clip()
  g.fillStyle = sh(base, 1); g.fillRect(0, 0, TW, TH)

  const speck = (n, kk, aa, sz) => {
    for (let i = 0; i < n; i++) {
      const x = R() * TW, y = R() * TH
      g.fillStyle = sh(base, kk + (R() - .5) * .3, aa)
      g.fillRect(x, y, sz ?? 1, sz ?? 1)
    }
  }
  switch (G.grain) {
    case 'turf':                              // clumped, tufted, uneven
      for (let i = 0; i < 16; i++) {
        g.fillStyle = sh(base, .74 + R() * .5, .5)
        g.beginPath(); g.ellipse(R() * TW, R() * TH, 3 + R() * 7, 1.4 + R() * 2.4, R() * 3, 0, 7); g.fill()
      }
      for (let i = 0; i < 22; i++) {          // blades catching the light
        const x = R() * TW, y = R() * TH
        g.strokeStyle = sh(base, 1.5, .28); g.lineWidth = 1
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 2, y - 2 - R() * 2); g.stroke()
      }
      break
    case 'ash':                               // the Wilds: burnt, bruised, bare
      for (let i = 0; i < 12; i++) {
        g.fillStyle = rgb(20, 14, 18, .3 + R() * .3)
        g.beginPath(); g.ellipse(R() * TW, R() * TH, 2 + R() * 8, 1 + R() * 3, R() * 3, 0, 7); g.fill()
      }
      speck(30, 1.5, .3); break
    case 'bog':
      for (let i = 0; i < 7; i++) {           // standing water in the hollows
        g.fillStyle = rgb(26, 36, 40, .34 + R() * .2)
        g.beginPath(); g.ellipse(R() * TW, R() * TH, 4 + R() * 9, 2 + R() * 3, R() * 3, 0, 7); g.fill()
      }
      speck(20, .7, .4); break
    case 'grit': speck(70, 1.35, .3); speck(40, .68, .35); break
    case 'rubble':
      for (let i = 0; i < 16; i++) {          // loose stones, each with a lit top
        const x = 6 + R() * 52, y = 6 + R() * 20, w = 2 + R() * 5
        g.fillStyle = sh(base, .55); g.fillRect(x, y, w, 2.5)
        g.fillStyle = sh(base, 1.35); g.fillRect(x, y, w, 1)
      }
      break
    case 'rock':                              // fractured bedrock, angular
      for (let i = 0; i < 9; i++) {
        const x = R() * TW, y = R() * TH
        g.strokeStyle = rgb(0, 0, 0, .3 + R() * .25); g.lineWidth = 1
        g.beginPath(); g.moveTo(x, y)
        g.lineTo(x + (R() - .5) * 22, y + (R() - .5) * 11)
        g.lineTo(x + (R() - .5) * 30, y + (R() - .5) * 14); g.stroke()
      }
      speck(34, 1.3, .22); break
    case 'paving': {                          // cut stone, laid in courses
      g.strokeStyle = rgb(0, 0, 0, .42); g.lineWidth = 1
      for (let i = 1; i < 4; i++) {           // joints running with the diamond
        g.beginPath(); g.moveTo(i * 16, HH - i * 8 + (i % 2 ? 0 : 0)); g.lineTo(i * 16 + HW, HH + HW / 2 - i * 8); g.stroke()
        g.beginPath(); g.moveTo(TW - i * 16, HH - i * 8); g.lineTo(TW - i * 16 - HW, HH + HW / 2 - i * 8); g.stroke()
      }
      g.strokeStyle = sh(base, 1.4, .22)
      for (let i = 1; i < 4; i++) {
        g.beginPath(); g.moveTo(i * 16, HH - i * 8 + 1); g.lineTo(i * 16 + HW, HH + HW / 2 - i * 8 + 1); g.stroke()
      }
      speck(24, .8, .3); break }
    case 'track': {                           // packed earth, wheel-scored
      g.strokeStyle = sh(base, .66, .5); g.lineWidth = 2.4
      g.beginPath(); g.moveTo(2, HH - 5); g.lineTo(TW - 2, HH - 5); g.stroke()
      g.beginPath(); g.moveTo(2, HH + 5); g.lineTo(TW - 2, HH + 5); g.stroke()
      speck(46, 1.3, .26); speck(26, .7, .3, 2); break }
    case 'plank': {                           // boards, running one way
      for (let i = 0; i < 5; i++) {
        const t = i / 5
        g.strokeStyle = rgb(0, 0, 0, .34); g.lineWidth = 1
        g.beginPath(); g.moveTo(t * TW, t * HH); g.lineTo(t * TW + HW, t * HH + HH); g.stroke()
        g.strokeStyle = sh(base, 1.3, .2)
        g.beginPath(); g.moveTo(t * TW, t * HH + 1); g.lineTo(t * TW + HW, t * HH + HH + 1); g.stroke()
      }
      speck(20, .8, .3); break }
    case 'water': {                           // depth, not a blue tile
      const gr = g.createLinearGradient(0, 0, 0, TH)
      gr.addColorStop(0, sh(base, 1.5)); gr.addColorStop(1, sh(base, .55))
      g.fillStyle = gr; g.fillRect(0, 0, TW, TH)
      break }
  }
  // the far edges catch light, the near edges fall away: this is what makes a
  // field of diamonds read as ground rather than as wallpaper
  const gr = g.createLinearGradient(0, 0, 0, TH)
  gr.addColorStop(0, 'rgba(255,240,214,.055)')
  gr.addColorStop(.55, 'rgba(0,0,0,0)')
  gr.addColorStop(1, 'rgba(0,0,0,.30)')
  g.fillStyle = gr; g.fillRect(0, 0, TW, TH)
  g.restore()
  _tileArt.set(key, c)
  return c
}

// ---------------------------------------------------------------------------
// A CACHE FOR STANDING THINGS
// ---------------------------------------------------------------------------
const _sprites = new Map()
function sprite(key, w, h, paint) {
  const hit = _sprites.get(key); if (hit) return hit
  const c = mkc(w, h), g = c.getContext('2d')
  g.lineJoin = 'round'; g.lineCap = 'round'
  paint(g, c.width, c.height, rng(hash32(key)))
  _sprites.set(key, c)
  return c
}
function hash32(s) {
  let h = 2166136261 >>> 0
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0 }
  return h
}
// a filled polygon, because there are four hundred of them below
function poly(g, pts, fill, stroke, lw) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1])
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1])
  g.closePath()
  if (fill) { g.fillStyle = fill; g.fill() }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw ?? 1; g.stroke() }
}
// the shadow every standing thing casts on its diamond
function groundShadow(g, cx, cy, rx, ry, a) {
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry))
  gr.addColorStop(0, 'rgba(0,0,0,' + (a ?? .5) + ')')
  gr.addColorStop(1, 'rgba(0,0,0,0)')
  g.save(); g.translate(cx, cy); g.scale(1, ry / Math.max(rx, ry)); g.translate(-cx, -cy)
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, Math.max(rx, ry), 0, 7); g.fill(); g.restore()
}

// ---- a house, which is really four decisions ------------------------------
// A building is the single biggest thing the turned camera buys you, so these
// get the most care: two wall faces at different values, a roof with pitch and
// courses, an eave that overhangs, and a window with a fire behind it.
function paintBuilding(g, W, H, opt) {
  const R = opt.R, wall = opt.wall, roof = opt.roof, glow = opt.glow
  const bw = opt.bw ?? 46, bd = opt.bd ?? 46, bh = opt.bh ?? 34, rh = opt.rh ?? 26
  const cx = W / 2, base = H - 4
  // the footprint, in iso: left corner, front corner, right corner, back corner
  const fx = cx, fy = base                      // front (nearest) corner
  const lx = cx - bw, ly = base - bw / 2
  const rx = cx + bd, ry = base - bd / 2
  const bx = cx + bd - bw, by = base - bw / 2 - bd / 2
  groundShadow(g, cx + 6, base - 8, bw + 14, (bw + 14) / 2, .55)
  // left wall (lit) and right wall (shadowed)
  poly(g, [[lx, ly], [fx, fy], [fx, fy - bh], [lx, ly - bh]], wall.lit)
  poly(g, [[fx, fy], [rx, ry], [rx, ry - bh], [fx, fy - bh]], wall.dark)
  // stonework courses
  g.strokeStyle = 'rgba(0,0,0,.30)'; g.lineWidth = 1
  for (let i = 1; i < 5; i++) {
    const t = i / 5
    g.beginPath(); g.moveTo(lx, ly - bh * t); g.lineTo(fx, fy - bh * t); g.lineTo(rx, ry - bh * t); g.stroke()
  }
  // the corner post catches the light
  g.strokeStyle = 'rgba(255,236,200,.13)'; g.lineWidth = 2
  g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx, fy - bh); g.stroke()
  // roof: two slopes to a ridge, overhanging the walls
  const ov = 7
  const rlx = lx - ov, rly = ly - ov / 2, rfx = fx, rfy = fy + ov / 2
  const rrx = rx + ov, rry = ry - ov / 2, rbx = bx, rby = by - ov
  const ridgeA = [(rlx + rbx) / 2, (rly + rby) / 2 - bh - rh]
  const ridgeB = [(rfx + rrx) / 2, (rfy + rry) / 2 - bh - rh]
  poly(g, [[rlx, rly - bh], [rfx, rfy - bh], ridgeB, ridgeA], roof.lit)
  poly(g, [[rfx, rfy - bh], [rrx, rry - bh], ridgeB, ridgeA[0] === ridgeB[0] ? ridgeA : ridgeB], roof.dark)
  poly(g, [[rrx, rry - bh], [rbx, rby - bh], ridgeA, ridgeB], roof.dark)
  // shingle courses down the lit slope
  g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 1
  for (let i = 1; i < 6; i++) {
    const t = i / 6
    g.beginPath()
    g.moveTo(rlx + (ridgeA[0] - rlx) * t, rly - bh + (ridgeA[1] - (rly - bh)) * t)
    g.lineTo(rfx + (ridgeB[0] - rfx) * t, rfy - bh + (ridgeB[1] - (rfy - bh)) * t)
    g.stroke()
  }
  // the ridge line, lit
  g.strokeStyle = 'rgba(255,232,190,.16)'; g.lineWidth = 1.6
  g.beginPath(); g.moveTo(ridgeA[0], ridgeA[1]); g.lineTo(ridgeB[0], ridgeB[1]); g.stroke()
  // the door, on the lit wall, facing the camera
  const dw = 11, dh = 19
  const dcx = lx + (fx - lx) * .55, dcy = ly + (fy - ly) * .55
  poly(g, [[dcx - dw / 2, dcy + dw / 4], [dcx + dw / 2, dcy - dw / 4],
           [dcx + dw / 2, dcy - dw / 4 - dh], [dcx - dw / 2, dcy + dw / 4 - dh]], '#0b0806')
  g.strokeStyle = 'rgba(190,150,90,.30)'; g.lineWidth = 1.2
  poly(g, [[dcx - dw / 2, dcy + dw / 4], [dcx + dw / 2, dcy - dw / 4],
           [dcx + dw / 2, dcy - dw / 4 - dh], [dcx - dw / 2, dcy + dw / 4 - dh]], null, 'rgba(190,150,90,.30)', 1.2)
  // a window with something burning behind it
  if (glow) {
    const wx = lx + (fx - lx) * .22, wy = ly + (fy - ly) * .22 - bh * .58
    poly(g, [[wx - 4, wy + 2], [wx + 4, wy - 2], [wx + 4, wy - 11], [wx - 4, wy - 7]], glow)
    const gg = g.createRadialGradient(wx, wy - 4, 0, wx, wy - 4, 22)
    gg.addColorStop(0, 'rgba(232,150,52,.45)'); gg.addColorStop(1, 'rgba(232,150,52,0)')
    g.fillStyle = gg; g.beginPath(); g.arc(wx, wy - 4, 22, 0, 7); g.fill()
  }
  if (opt.sign) {                              // a hanging trade sign
    const sx = fx + 13, sy = fy - bh * .78
    g.strokeStyle = '#2a231a'; g.lineWidth = 2
    g.beginPath(); g.moveTo(fx + 1, sy - 7); g.lineTo(sx, sy - 7); g.lineTo(sx, sy - 2); g.stroke()
    poly(g, [[sx - 7, sy - 2], [sx + 7, sy - 2], [sx + 7, sy + 9], [sx - 7, sy + 9]], '#221a12', '#5c4726', 1)
    g.fillStyle = opt.sign.c; g.font = '700 9px Cinzel, Georgia, serif'
    g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillText(opt.sign.t, sx, sy + 4)
  }
}

// ---- a tree, which is really a silhouette ---------------------------------
function paintTree(g, W, H, R, style) {
  const cx = W / 2, base = H - 6
  const dead = style === 'dead' || style === 'burnt'
  const trunkC = style === 'burnt' ? ['#191413', '#2a2220', '#0d0a0a']
               : dead ? ['#2e281f', '#463c2e', '#191512']
               : ['#2c241a', '#463829', '#161109']
  groundShadow(g, cx + 4, base - 2, 26, 11, .55)
  const th = 30 + R() * 16
  // trunk with a root flare, drawn as a tapered polygon rather than a rectangle
  poly(g, [[cx - 7, base], [cx - 3, base - th], [cx + 3.5, base - th], [cx + 8, base]], trunkC[0])
  poly(g, [[cx - 7, base], [cx - 3, base - th], [cx - 1, base - th], [cx - 3, base]], trunkC[1])
  poly(g, [[cx + 3, base], [cx + 3.5, base - th], [cx + 8, base]], trunkC[2])
  g.strokeStyle = trunkC[2]; g.lineWidth = 1
  for (let i = 0; i < 4; i++) {                // bark
    const t = R()
    g.beginPath(); g.moveTo(cx - 5 + t * 11, base - 2); g.lineTo(cx - 3 + t * 8, base - th + 4); g.stroke()
  }
  // limbs
  const limbs = dead ? 6 : 4
  g.strokeStyle = trunkC[0]; g.lineCap = 'round'
  for (let i = 0; i < limbs; i++) {
    const a = -0.35 - R() * 2.4, len = 12 + R() * 20
    const bx = cx, by = base - th * (0.5 + R() * 0.5)
    g.lineWidth = 3.4 - i * 0.3
    g.beginPath(); g.moveTo(bx, by)
    const mx = bx + Math.cos(a) * len * .6, my = by + Math.sin(a) * len * .6
    g.quadraticCurveTo(mx, my, bx + Math.cos(a - .3) * len, by + Math.sin(a - .3) * len)
    g.stroke()
  }
  if (!dead) {
    // foliage: overlapping masses, dark, with the light only on the upper left
    const cy = base - th - 12
    const blobs = []
    for (let i = 0; i < 7; i++)
      blobs.push([cx + (R() - .5) * 40, cy + (R() - .5) * 26, 13 + R() * 12])
    const dark = style === 'pine' ? '#161f16' : '#1a2116'
    const mid = style === 'pine' ? '#22301f' : '#28331f'
    const lit = style === 'pine' ? '#38492c' : '#41512c'
    for (const [bx, by, br] of blobs) { g.fillStyle = dark; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill() }
    for (const [bx, by, br] of blobs) { g.fillStyle = mid; g.beginPath(); g.arc(bx - br * .12, by - br * .16, br * .78, 0, 7); g.fill() }
    for (const [bx, by, br] of blobs) { g.fillStyle = lit; g.beginPath(); g.arc(bx - br * .3, by - br * .34, br * .38, 0, 7); g.fill() }
    // a scatter of leaf edge on the lit side, so the mass has a texture
    for (let i = 0; i < 40; i++) {
      const b = blobs[(R() * blobs.length) | 0]
      const a = R() * 7, rr = b[2] * (.5 + R() * .55)
      g.fillStyle = R() > .6 ? '#4d5c33' : '#2e3a22'
      g.fillRect(b[0] + Math.cos(a) * rr, b[1] + Math.sin(a) * rr * .8, 2, 2)
    }
  }
}

// ---- rock, boulder, ore ---------------------------------------------------
function paintRock(g, W, H, R, style) {
  const cx = W / 2, base = H - 5
  const s = style === 'magic' ? 1.05 : 1
  const w = (17 + R() * 8) * s, h = (15 + R() * 9) * s
  groundShadow(g, cx + 3, base - 1, w + 8, (w + 8) / 2.2, .55)
  const top = [], n = 7
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2
    top.push([cx + Math.cos(a) * w * (.7 + R() * .4), base - h + Math.sin(a) * w * .34 * (.7 + R() * .4)])
  }
  const body = style === 'magic' ? ['#3a3a4c', '#4c4c64', '#22222e']
             : style === 'dark' ? ['#2b2825', '#3d3934', '#171514']
             : ['#3a352e', '#4e4840', '#1f1c19']
  // the mass: sides first, then the lit cap
  poly(g, [...top.map(p => [p[0], p[1]]), ...top.slice().reverse().map(p => [p[0] * .96 + cx * .04, base])], body[0])
  poly(g, top, body[1])
  // facets
  for (let i = 0; i < n; i++) {
    const a = top[i], b = top[(i + 1) % n]
    const dark = a[0] + b[0] > cx * 2
    poly(g, [a, b, [b[0], base], [a[0], base]], dark ? body[2] : body[0])
  }
  poly(g, top, body[1])
  g.strokeStyle = 'rgba(255,240,214,.13)'; g.lineWidth = 1.4
  g.beginPath(); g.moveTo(top[4][0], top[4][1]); g.lineTo(top[5][0], top[5][1]); g.lineTo(top[6 % n][0], top[6 % n][1]); g.stroke()
  // cracks
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1
  for (let i = 0; i < 4; i++) {
    const x = cx + (R() - .5) * w, y = base - h * R() * .9
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 12, y + 5 + R() * 8); g.stroke()
  }
  if (style === 'ore') {                       // metal in the stone
    for (let i = 0; i < 7; i++) {
      const x = cx + (R() - .5) * w * 1.2, y = base - R() * h
      g.fillStyle = R() > .5 ? '#8a6a34' : '#5e4a26'
      g.beginPath(); g.arc(x, y, 1.3 + R() * 1.4, 0, 7); g.fill()
      g.fillStyle = 'rgba(255,214,140,.5)'; g.fillRect(x - .6, y - 1.2, 1.2, 1.2)
    }
  }
}

// ---- humanoids ------------------------------------------------------------
// Everything with two legs in this world is drawn by this one function, which
// is why the keeper at her counter and the citizen at the anvil look like they
// come from the same island.
//
// `bulk` is what separates them. At 0 you get a person: a keeper, a guard, a
// smith, drawn at human proportions. At 1 you get an ADVENTURER in this
// generation's sense, which is a specific and slightly absurd silhouette --
// pauldrons wider than the hips, a coat that flares from the belt to the
// ankles, a forward hunch as though walking into weather, and a weapon scaled
// past anything a body could actually swing. It reads at forty tiles, which is
// the entire justification: in a turned camera at this distance you know who
// is a citizen and who is scenery from the shoulders alone.
function humanoid(g, cx, base, o) {
  const s = o.scale ?? 1
  const bulk = o.bulk ?? 0
  const cloak = o.cloak, tunic = o.tunic, skin = o.skin ?? '#8d6a4a'
  const lean = o.lean ?? 0, step = o.step ?? 0, swing = o.swing ?? 0
  const bob = Math.sin(step) * 1.6 * s
  const hunch = bulk * 2.6 * s
  const hipY = base - 20 * s + bob, shY = base - 32 * s + bob - bulk * 1.5 * s
  const headY = base - 40 * s + bob - bulk * 1.2 * s
  // legs
  const la = Math.sin(step) * 4.5 * s, lb = -la
  g.strokeStyle = o.boots ?? '#241d16'; g.lineWidth = 4.2 * s; g.lineCap = 'round'
  g.beginPath(); g.moveTo(cx - 2 * s, hipY); g.lineTo(cx - 2 * s + la, base); g.stroke()
  g.beginPath(); g.moveTo(cx + 2 * s, hipY); g.lineTo(cx + 2 * s + lb, base); g.stroke()
  // body: broader at the shoulder the more of an adventurer this is
  const shW = (6.5 + bulk * 3.5) * s
  poly(g, [[cx - shW + hunch, shY], [cx + shW + hunch, shY],
           [cx + 5 * s, hipY + 2 * s], [cx - 5 * s, hipY + 2 * s]], tunic)
  poly(g, [[cx - shW + hunch, shY], [cx - 1 * s + hunch, shY],
           [cx - 1 * s, hipY + 2 * s], [cx - 5 * s, hipY + 2 * s]],
    o.tunicLit ?? 'rgba(255,240,214,.10)')
  if (bulk > 0) {
    // the coat: it flares, and its hem trails a beat behind the legs
    const hem = base - 3 * s, flare = (9 + bulk * 4) * s
    const sway = Math.sin(step - .7) * 2.2 * s * bulk
    const coat = o.coat ?? cloak ?? '#2a2320'
    poly(g, [[cx - 6 * s, hipY - 1 * s], [cx + 6 * s, hipY - 1 * s],
             [cx + flare + sway, hem], [cx + flare * .4 + sway, hem + 2 * s],
             [cx - flare * .4 + sway, hem + 1 * s], [cx - flare + sway, hem - 1 * s]], coat)
    poly(g, [[cx + 1 * s, hipY - 1 * s], [cx + 6 * s, hipY - 1 * s],
             [cx + flare + sway, hem], [cx + 2 * s + sway, hem + 1.5 * s]], 'rgba(0,0,0,.32)')
    // a belt, because the coat needs somewhere to hang from
    g.fillStyle = '#241a12'
    g.fillRect(cx - 6.4 * s, hipY - 3 * s, 12.8 * s, 3.4 * s)
    g.fillStyle = '#b0913f'
    g.fillRect(cx - 2 * s, hipY - 3 * s, 4 * s, 3.4 * s)
  }
  // cloak, hanging behind and to the shadow side
  if (cloak) {
    poly(g, [[cx - 7.5 * s, shY - 2 * s], [cx + 7.5 * s, shY - 2 * s],
             [cx + 9 * s + lean, base - 3 * s], [cx - 9 * s + lean, base - 3 * s]], cloak)
    g.fillStyle = 'rgba(0,0,0,.28)'
    poly(g, [[cx + 1 * s, shY - 2 * s], [cx + 7.5 * s, shY - 2 * s],
             [cx + 9 * s + lean, base - 3 * s], [cx + 2 * s + lean, base - 3 * s]], 'rgba(0,0,0,.30)')
  }
  // arms; the weapon arm swings
  g.strokeStyle = skin; g.lineWidth = (3.2 + bulk * 1.2) * s
  g.beginPath(); g.moveTo(cx - shW * .85 + hunch, shY + 3 * s)
  g.lineTo(cx - (8 + bulk * 3) * s - Math.sin(step) * 2 * s, hipY + 2 * s); g.stroke()
  const wa = -0.5 + swing
  const reach = (9 + bulk * 2) * s
  const hx = cx + shW * .9 + hunch + Math.cos(wa) * reach
  const hy = shY + 3 * s + Math.sin(wa) * reach
  g.beginPath(); g.moveTo(cx + shW * .85 + hunch, shY + 3 * s); g.lineTo(hx, hy); g.stroke()
  if (o.weapon) o.weapon(g, hx, hy, wa, s * (1 + bulk * .45))
  if (bulk > 0) {
    // PAULDRONS. Nothing else in this file buys as much silhouette per line.
    for (const side of [-1, 1]) {
      const px2 = cx + side * shW * .92 + hunch, py2 = shY + 1.4 * s
      const pg = g.createLinearGradient(px2 - 6 * s, py2 - 6 * s, px2 + 6 * s, py2 + 6 * s)
      const pc = o.plate ?? ['#6b5a34', '#3a2f1c']
      pg.addColorStop(0, pc[0]); pg.addColorStop(1, pc[1])
      g.fillStyle = pg
      g.beginPath(); g.ellipse(px2, py2, (7 + bulk * 2.4) * s, (5.6 + bulk * 1.8) * s, side * .34, 0, 7); g.fill()
      g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 1.2
      g.beginPath(); g.ellipse(px2, py2, (7 + bulk * 2.4) * s, (5.6 + bulk * 1.8) * s, side * .34, 0, 7); g.stroke()
      g.fillStyle = 'rgba(255,240,214,.20)'
      g.beginPath(); g.ellipse(px2 - 1.6 * s, py2 - 2.2 * s, 3 * s, 1.8 * s, side * .34, 0, 7); g.fill()
      poly(g, [[px2 + side * 6 * s, py2 - 3 * s],
               [px2 + side * 12 * s, py2 - 11 * s],
               [px2 + side * 8 * s, py2 - 1 * s]], pc[0])
    }
  }
  // head, hood or helm
  if (o.hood) {
    poly(g, [[cx - 6 * s, headY + 8 * s], [cx, headY - 6 * s], [cx + 6 * s, headY + 8 * s]], o.hood)
    g.fillStyle = '#07060a'
    g.beginPath(); g.ellipse(cx, headY + 3 * s, 3.4 * s, 3.6 * s, 0, 0, 7); g.fill()
    if (o.eyes) {                              // two coals under the hood
      g.fillStyle = o.eyes
      g.fillRect(cx - 2.6 * s, headY + 2 * s, 1.7 * s, 1.5 * s)
      g.fillRect(cx + 1 * s, headY + 2 * s, 1.7 * s, 1.5 * s)
    }
  } else {
    g.fillStyle = skin
    g.beginPath(); g.ellipse(cx, headY + 2 * s, 4.6 * s, 5.2 * s, 0, 0, 7); g.fill()
    g.fillStyle = 'rgba(0,0,0,.28)'
    g.beginPath(); g.ellipse(cx + 2 * s, headY + 2 * s, 2.6 * s, 5 * s, 0, 0, 7); g.fill()
    if (o.hair) { g.fillStyle = o.hair
      g.beginPath(); g.ellipse(cx, headY - 1 * s, 4.8 * s, 3.4 * s, 0, 0, 7); g.fill() }
    if (o.helm) {
      g.fillStyle = o.helm
      g.beginPath(); g.ellipse(cx, headY, 5.4 * s, 4.4 * s, 0, Math.PI, 0); g.fill()
      g.fillStyle = 'rgba(255,240,214,.22)'
      g.beginPath(); g.ellipse(cx - 1.6 * s, headY - 1 * s, 2.6 * s, 1.8 * s, 0, Math.PI, 0); g.fill()
      if (o.horns) {
        g.strokeStyle = o.helm; g.lineWidth = 2 * s
        g.beginPath(); g.moveTo(cx - 5 * s, headY - 1 * s); g.quadraticCurveTo(cx - 10 * s, headY - 5 * s, cx - 7 * s, headY - 9 * s); g.stroke()
        g.beginPath(); g.moveTo(cx + 5 * s, headY - 1 * s); g.quadraticCurveTo(cx + 10 * s, headY - 5 * s, cx + 7 * s, headY - 9 * s); g.stroke()
      }
    }
  }
  if (o.shield) {                              // strapped to the off arm
    g.fillStyle = o.shield
    g.beginPath(); g.ellipse(cx - 9 * s, shY + 7 * s, 5.4 * s, 7 * s, .15, 0, 7); g.fill()
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.2
    g.beginPath(); g.ellipse(cx - 9 * s, shY + 7 * s, 5.4 * s, 7 * s, .15, 0, 7); g.stroke()
    g.fillStyle = 'rgba(255,240,214,.16)'
    g.beginPath(); g.ellipse(cx - 10.4 * s, shY + 5 * s, 2 * s, 2.8 * s, .15, 0, 7); g.fill()
  }
}

// ---- the weapon in the hand ------------------------------------------------
const METAL = {
  bronze:    ['#8a6a34', '#c49a4e', '#4c3a1c'],
  star:      ['#8fa8c4', '#d6e6f4', '#4a5a70'],
  iron:      ['#6e6e68', '#a8a8a0', '#3a3a36'],
  wood:      ['#6a4f2c', '#96733f', '#3a2a16'],
  heartwood: ['#7a4a26', '#b07040', '#40230f'],
  dragon:    ['#7a2018', '#c4462a', '#3a0e0a'],
}
const metalOf = (item) => item?.startsWith('star-') ? METAL.star
  : item?.startsWith('bronze-') ? METAL.bronze
  : item === 'dragonbow' ? METAL.dragon
  : item?.includes('heartwood') ? METAL.heartwood
  : item === 'old-chain' ? METAL.iron
  : METAL.wood

function drawWeapon(g, hx, hy, a, s, item) {
  if (!item) return
  const m = metalOf(item)
  const long = /sword|spear|maul|flail/.test(item) ? (item.includes('spear') ? 26 : 20) : 13
  const dx = Math.cos(a - 1.35), dy = Math.sin(a - 1.35)
  if (/bow/.test(item)) {                      // held across the body, string taut
    g.strokeStyle = m[0]; g.lineWidth = 2.2 * s
    g.beginPath(); g.arc(hx, hy, 11 * s, a - 1.1, a + 1.1); g.stroke()
    g.strokeStyle = 'rgba(220,208,180,.6)'; g.lineWidth = 1
    g.beginPath()
    g.moveTo(hx + Math.cos(a - 1.1) * 11 * s, hy + Math.sin(a - 1.1) * 11 * s)
    g.lineTo(hx + Math.cos(a + 1.1) * 11 * s, hy + Math.sin(a + 1.1) * 11 * s)
    g.stroke(); return
  }
  // haft
  g.strokeStyle = item.includes('maul') || item.includes('spear') || item.includes('hatchet') || item.includes('pickaxe')
    ? METAL.wood[0] : m[2]
  g.lineWidth = 2.6 * s
  g.beginPath(); g.moveTo(hx - dx * 4 * s, hy - dy * 4 * s); g.lineTo(hx + dx * long * s, hy + dy * long * s); g.stroke()
  const tx = hx + dx * long * s, ty = hy + dy * long * s
  if (/sword|dagger/.test(item)) {
    g.strokeStyle = m[1]; g.lineWidth = 2.8 * s
    g.beginPath(); g.moveTo(hx, hy); g.lineTo(tx, ty); g.stroke()
    g.strokeStyle = m[0]; g.lineWidth = 1.1 * s
    g.beginPath(); g.moveTo(hx, hy); g.lineTo(tx, ty); g.stroke()
    g.strokeStyle = m[2]; g.lineWidth = 5 * s                     // crossguard
    g.beginPath(); g.moveTo(hx - dy * 4 * s, hy + dx * 4 * s); g.lineTo(hx + dy * 4 * s, hy - dx * 4 * s); g.stroke()
  } else if (item.includes('maul')) {
    g.fillStyle = m[0]
    g.beginPath(); g.ellipse(tx, ty, 6 * s, 5 * s, a, 0, 7); g.fill()
    g.fillStyle = m[1]; g.beginPath(); g.ellipse(tx - 1.4 * s, ty - 1.6 * s, 3 * s, 2.4 * s, a, 0, 7); g.fill()
  } else if (item.includes('spear')) {
    poly(g, [[tx + dx * 7 * s, ty + dy * 7 * s], [tx - dy * 2.6 * s, ty + dx * 2.6 * s],
             [tx + dy * 2.6 * s, ty - dx * 2.6 * s]], m[1])
  } else if (item.includes('hatchet')) {
    poly(g, [[tx, ty], [tx + dy * 6 * s - dx * 2 * s, ty - dx * 6 * s - dy * 2 * s],
             [tx + dy * 7 * s + dx * 5 * s, ty - dx * 7 * s + dy * 5 * s], [tx + dx * 4 * s, ty + dy * 4 * s]], m[1])
  } else if (item.includes('pickaxe')) {
    g.strokeStyle = m[1]; g.lineWidth = 2.4 * s
    g.beginPath(); g.moveTo(tx - dy * 8 * s, ty + dx * 8 * s); g.lineTo(tx + dy * 8 * s, ty - dx * 8 * s); g.stroke()
  } else if (item.includes('flail') || item === 'old-chain') {
    g.strokeStyle = METAL.iron[0]; g.lineWidth = 1.4 * s
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + dx * 8 * s, ty + dy * 8 * s + 4 * s); g.stroke()
    g.fillStyle = m[0]; g.beginPath(); g.arc(tx + dx * 8 * s, ty + dy * 8 * s + 4 * s, 4 * s, 0, 7); g.fill()
    g.fillStyle = m[1]; g.beginPath(); g.arc(tx + dx * 7 * s, ty + dy * 8 * s + 2.6 * s, 1.6 * s, 0, 7); g.fill()
  }
}
// ===========================================================================
// THE BESTIARY, AND THE PACK
// ---------------------------------------------------------------------------
// Beasts are drawn live rather than cached, because a still monster is a rock
// with teeth. Every one breathes, and the ones that are angry at you lean
// forward. Item icons are cached: they never move.
// ===========================================================================

// ---------------------------------------------------------------------------
// THE BESTIARY
// ---------------------------------------------------------------------------
// Ten creatures, ten silhouettes. The previous pass had five body plans doing
// the work of ten nouns -- a troll was a goblin at 1.35x in a greyer palette,
// and a dragon was a siren with wings bolted on. That is the failure mode this
// whole window exists to avoid, so each of these is now drawn on its own.
//
// The register is the third game's, which has a specific and copyable grammar:
//
//   * EXAGGERATE THE TOP. Shoulders, skulls, claws and carapaces are drawn far
//     too large; pelvises and feet far too small. A beast should be legible
//     from its top third alone, because in a turned camera that is the third
//     that is never occluded.
//   * BONE ON THE OUTSIDE. Horn, spine, plate and tusk break the outline.
//     A smooth silhouette reads as a toy at this size.
//   * THE EYES ARE LIGHT SOURCES. Not dots -- small bright cores with a bloom
//     around them, because in a black frame the eyes are what you actually
//     track, and they arrive before the body does.
//   * CLOTH IS ALWAYS RUINED. Anything woven hangs in strips and moves a beat
//     behind the body.
//
// Every one of these is a pure function of position and tick-time. Nothing
// here knows anything the state does not carry.
// ---------------------------------------------------------------------------

// scale, palette, family. `s` is kept close to the old values so the hit boxes
// in pickWorld still frame the art.
const BEAST = {
  goblin:            { s: .78, fam: 'fallen',  hide: ['#5a4a2c', '#7a6438', '#2a2114'], eye: '#ffcf4a' },
  wolf:              { s: .95, fam: 'carrion', hide: ['#33302b', '#4e4840', '#151311'], eye: '#c8e04a' },
  bear:              { s: 1.25, fam: 'ursine', hide: ['#2e241a', '#463724', '#120c08'], eye: '#ff8a2a' },
  troll:             { s: 1.42, fam: 'brute',  hide: ['#3e4a3c', '#586452', '#191f18'], eye: '#9cf07a' },
  'skeleton-knight': { s: 1.05, fam: 'skeletal', hide: ['#b0a890', '#e2dcc4', '#4a4436'], eye: '#ff5a24' },
  siren:             { s: 1.15, fam: 'drowned', hide: ['#24444e', '#3e727c', '#0e1c22'], eye: '#8cf0f0' },
  'great-spider':    { s: 1.85, fam: 'arach',   hide: ['#241826', '#3e2c42', '#0c060e'], eye: '#ff2a48' },
  'shore-crab':      { s: 1.00, fam: 'carapace', hide: ['#6a3a26', '#96593a', '#2a1408'], eye: '#ffd85a' },
  sheep:             { s: .88, fam: 'sheep',    hide: ['#5a564c', '#7e7a6e', '#2a2723'], eye: '#c8c0a8' },
  dragon:            { s: 2.6, fam: 'wyrm',     hide: ['#42160f', '#6e2a18', '#140505'], eye: '#ffb03a' },
}

// ---- the grammar, as four helpers ----------------------------------------
function emberEyes(g, x, y, r, col, spread, glow) {
  g.save(); g.globalCompositeOperation = 'lighter'
  const gr = g.createRadialGradient(x, y, 0, x, y, (glow ?? 10) )
  gr.addColorStop(0, hexA(col, .5)); gr.addColorStop(1, hexA(col, 0))
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, glow ?? 10, 0, 7); g.fill()
  g.restore()
  g.fillStyle = col
  g.beginPath(); g.arc(x - spread, y, r, 0, 7); g.fill()
  g.beginPath(); g.arc(x + spread, y, r, 0, 7); g.fill()
  g.fillStyle = '#fff'
  g.beginPath(); g.arc(x - spread, y - r * .25, r * .42, 0, 7); g.fill()
  g.beginPath(); g.arc(x + spread, y - r * .25, r * .42, 0, 7); g.fill()
}
// horn, spine, tusk: whatever breaks the outline
function spike(g, x, y, len, ang, w, col) {
  poly(g, [[x + Math.cos(ang + 1.57) * w, y + Math.sin(ang + 1.57) * w],
           [x + Math.cos(ang - 1.57) * w, y + Math.sin(ang - 1.57) * w],
           [x + Math.cos(ang) * len, y + Math.sin(ang) * len]], col)
}
// cloth in strips, moving a beat behind whatever is wearing it
function tatters(g, x, y, w, h, col, t, n) {
  const k = n ?? 5
  for (let i = 0; i < k; i++) {
    const tx = x - w / 2 + (i + .5) * (w / k)
    const sway = Math.sin(t * 2.2 + i * .9) * (h * .12)
    poly(g, [[tx - w / k / 2, y], [tx + w / k / 2, y],
             [tx + w / k / 2 + sway, y + h * (.6 + (i % 3) * .18)],
             [tx - w / k / 2 + sway * .7, y + h * (.5 + (i % 2) * .22)]], col)
  }
}
// a limb that gets thinner toward the end, which is most of what stops a
// creature looking like a diagram of a creature
function limb(g, x0, y0, x1, y1, w0, w1, col) {
  const a = Math.atan2(y1 - y0, x1 - x0) + 1.5708
  poly(g, [[x0 + Math.cos(a) * w0, y0 + Math.sin(a) * w0],
           [x1 + Math.cos(a) * w1, y1 + Math.sin(a) * w1],
           [x1 - Math.cos(a) * w1, y1 - Math.sin(a) * w1],
           [x0 - Math.cos(a) * w0, y0 - Math.sin(a) * w0]], col)
}
// what a thing that can end you wears instead of a health bar
function eliteAura(g, cx, base, r, col, t) {
  g.save(); g.globalCompositeOperation = 'lighter'
  const p = .6 + Math.sin(t * 1.6) * .25
  const gr = g.createRadialGradient(cx, base - r * .3, 0, cx, base - r * .3, r)
  gr.addColorStop(0, hexA(col, .16 * p)); gr.addColorStop(1, hexA(col, 0))
  g.fillStyle = gr
  g.save(); g.translate(cx, base); g.scale(1, .5); g.translate(-cx, -base)
  g.beginPath(); g.arc(cx, base, r, 0, 7); g.fill(); g.restore()
  g.strokeStyle = hexA(col, .22 * p); g.lineWidth = 2
  g.beginPath(); g.ellipse(cx, base, r * .62, r * .3, 0, 0, 7); g.stroke()
  g.restore()
}

function drawBeast(g, cx, base, type, t, opt) {
  const B = BEAST[type] ?? BEAST.goblin
  const s = B.s * (opt?.scale ?? 1)
  const h = B.hide
  const breathe = Math.sin(t * 2.2 + cx * .05) * 1.5 * s
  const lean = opt?.mad ? 3 * s : 0
  const walk = opt?.moving ? 1 : 0
  const step = Math.sin(t * 7)

  switch (B.fam) {

    // ---- the fallen: hunched, eared, potbellied, always carrying something
    case 'fallen': {
      groundShadow(g, cx + 3 * s, base - 1, 19 * s, 8 * s, .62)
      const hipY = base - 13 * s, shY = base - 27 * s - breathe
      // splayed legs, knees out
      limb(g, cx - 4 * s, hipY, cx - 7 * s + step * 3 * s, base, 3.4 * s, 2 * s, h[2])
      limb(g, cx + 4 * s, hipY, cx + 7 * s - step * 3 * s, base, 3.4 * s, 2 * s, h[2])
      poly(g, [[cx - 8 * s, base], [cx - 4 * s, base], [cx - 5 * s, base - 3 * s]], h[2])
      // belly first, then the chest above it
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx + lean * .4, hipY - 5 * s, 9 * s, 8 * s, 0, 0, 7); g.fill()
      poly(g, [[cx - 10 * s + lean, shY], [cx + 10 * s + lean, shY],
               [cx + 7 * s, hipY - 2 * s], [cx - 7 * s, hipY - 2 * s]], h[1])
      poly(g, [[cx - 10 * s + lean, shY], [cx - 2 * s + lean, shY],
               [cx - 2 * s, hipY - 2 * s], [cx - 7 * s, hipY - 2 * s]], sh([122, 100, 56], 1.25))
      tatters(g, cx + lean * .5, hipY - 6 * s, 16 * s, 12 * s, '#3a2c1c', t, 4)
      // long arms, one dragging a spear
      limb(g, cx - 8 * s + lean, shY + 3 * s, cx - 13 * s, hipY + 6 * s, 3 * s, 2 * s, h[1])
      const swx = cx + 12 * s + lean + (opt?.swinging ? Math.sin(t * 9) * 5 * s : 0)
      limb(g, cx + 8 * s + lean, shY + 3 * s, swx, hipY + 2 * s, 3 * s, 2 * s, h[1])
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 2.2 * s
      g.beginPath(); g.moveTo(swx - 3 * s, hipY + 10 * s); g.lineTo(swx + 2 * s, shY - 14 * s); g.stroke()
      spike(g, swx + 2 * s, shY - 14 * s, 7 * s, -1.4, 2.4 * s, '#9aa0a8')
      // the head: a wedge, all nose and ears
      const hy = shY - 7 * s
      poly(g, [[cx - 6 * s + lean, hy], [cx + 6 * s + lean, hy],
               [cx + 4 * s + lean, hy + 9 * s], [cx - 3 * s + lean, hy + 9 * s]], h[1])
      poly(g, [[cx - 3 * s + lean, hy + 4 * s], [cx - 12 * s + lean, hy + 7 * s],
               [cx - 3 * s + lean, hy + 9 * s]], h[1])                       // hooked snout
      spike(g, cx - 6 * s + lean, hy + 1 * s, 13 * s, 3.5, 3.6 * s, h[0])    // ears, huge
      spike(g, cx + 6 * s + lean, hy + 1 * s, 13 * s, -0.35, 3.6 * s, h[0])
      poly(g, [[cx - 7 * s + lean, hy - 1 * s], [cx + 7 * s + lean, hy - 1 * s],
               [cx + 5 * s + lean, hy - 5 * s], [cx - 5 * s + lean, hy - 5 * s]], '#5a1f18')  // cap
      emberEyes(g, cx - 1 * s + lean, hy + 4 * s, 1.5 * s, B.eye, 3 * s, 11 * s)
      break
    }

    // ---- carrion beast: lean, ribbed, spined, jaw too big for the skull
    case 'carrion': {
      groundShadow(g, cx + 3 * s, base - 1, 22 * s, 8 * s, .62)
      const bodyY = base - 15 * s - breathe * .5
      for (const [lx, ph, fw] of [[-9, 0, 1], [-6, 2.1, 1], [8, 1.05, 1], [11, 3.1, 1]]) {
        const fx = cx + lx * s + step * (walk ? 3.6 : 0) * s * (lx < 0 ? 1 : -1)
        limb(g, cx + lx * s, bodyY + 3 * s, fx, base, 3 * s, 1.6 * s, h[2])
        poly(g, [[fx - 3 * s, base], [fx + 3 * s, base], [fx + 1 * s, base - 3 * s]], h[2])
      }
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx, bodyY, 15 * s, 7.5 * s, -.05, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 2 * s, bodyY - 2.4 * s, 12 * s, 4 * s, -.05, 0, 7); g.fill()
      g.strokeStyle = h[2]; g.lineWidth = 1.2 * s                            // ribs showing
      for (let i = 0; i < 4; i++) {
        g.beginPath(); g.arc(cx - 2 * s + i * 5 * s, bodyY + 1 * s, 6 * s, .6, 2.4); g.stroke()
      }
      for (let i = 0; i < 6; i++)                                            // dorsal spines
        spike(g, cx - 10 * s + i * 4.4 * s, bodyY - 6 * s - Math.abs(i - 2.5) * .6 * s,
          5.5 * s - Math.abs(i - 2.5) * .8 * s, -1.7 - (i - 2.5) * .08, 1.5 * s, h[2])
      const hx2 = cx - 15 * s, hy2 = bodyY - 6 * s - breathe * .4
      poly(g, [[hx2 + 5 * s, hy2 - 4 * s], [hx2 + 6 * s, hy2 + 4 * s],
               [hx2 - 9 * s, hy2 + 3 * s], [hx2 - 8 * s, hy2 - 2 * s]], h[1])
      poly(g, [[hx2 - 8 * s, hy2 + 2 * s], [hx2 - 11 * s, hy2 + 6 * s],
               [hx2 + 4 * s, hy2 + 5 * s]], h[0])                            // dropped jaw
      g.fillStyle = '#e8e2d0'
      for (let i = 0; i < 5; i++) {
        g.beginPath(); g.moveTo(hx2 - 8 * s + i * 2.6 * s, hy2 + 3 * s)
        g.lineTo(hx2 - 7 * s + i * 2.6 * s, hy2 + 5.4 * s)
        g.lineTo(hx2 - 6 * s + i * 2.6 * s, hy2 + 3 * s); g.fill()
      }
      spike(g, hx2 + 2 * s, hy2 - 4 * s, 7 * s, -1.9, 2 * s, h[2])
      spike(g, hx2 + 5 * s, hy2 - 3 * s, 6 * s, -1.5, 1.8 * s, h[2])
      limb(g, cx + 13 * s, bodyY - 1 * s, cx + 24 * s, bodyY - 6 * s + Math.sin(t * 4) * 3 * s,
        2.6 * s, .8 * s, h[0])
      emberEyes(g, hx2 - 2 * s, hy2 - 1 * s, 1.3 * s, B.eye, 2.6 * s, 10 * s)
      break
    }

    // ---- ursine brute: all shoulder, small head, standing half up
    case 'ursine': {
      groundShadow(g, cx + 4 * s, base - 1, 24 * s, 10 * s, .66)
      const bodyY = base - 20 * s - breathe
      limb(g, cx - 7 * s, bodyY + 6 * s, cx - 9 * s + step * 3 * s, base, 5 * s, 3.6 * s, h[2])
      limb(g, cx + 7 * s, bodyY + 6 * s, cx + 10 * s - step * 3 * s, base, 5 * s, 3.6 * s, h[2])
      g.fillStyle = h[0]                                                     // the great hump
      g.beginPath(); g.ellipse(cx, bodyY, 17 * s, 14 * s, -.08, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 3 * s, bodyY - 8 * s, 14 * s, 7 * s, -.18, 0, 7); g.fill()
      for (let i = 0; i < 20; i++) {                                         // shag on the outline
        const a = (i / 20) * 6.283
        g.fillStyle = i % 3 ? h[0] : h[2]
        g.beginPath()
        g.ellipse(cx + Math.cos(a) * 16 * s, bodyY + Math.sin(a) * 13 * s,
          3.4 * s, 2.2 * s, a, 0, 7); g.fill()
      }
      const armSw = opt?.swinging ? Math.sin(t * 8) * 8 * s : 0
      limb(g, cx - 13 * s + lean, bodyY - 4 * s, cx - 20 * s + lean - armSw, bodyY + 12 * s,
        5.4 * s, 3.4 * s, h[0])
      for (let i = 0; i < 3; i++)                                            // claws
        spike(g, cx - 21 * s + lean - armSw + i * 2.6 * s, bodyY + 14 * s, 6 * s, 1.3 + i * .2, 1.3 * s, '#d8d0bc')
      limb(g, cx + 13 * s + lean, bodyY - 4 * s, cx + 20 * s + lean + armSw, bodyY + 12 * s,
        5.4 * s, 3.4 * s, h[1])
      const hx3 = cx - 4 * s + lean, hy3 = bodyY - 17 * s - breathe
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(hx3, hy3, 8 * s, 6.4 * s, -.1, 0, 7); g.fill()
      poly(g, [[hx3 - 6 * s, hy3], [hx3 - 15 * s, hy3 + 4 * s], [hx3 - 5 * s, hy3 + 5 * s]], h[0])
      g.fillStyle = h[2]
      g.beginPath(); g.arc(hx3 - 14 * s, hy3 + 4 * s, 2 * s, 0, 7); g.fill()
      g.fillStyle = h[0]
      g.beginPath(); g.arc(hx3 - 2 * s, hy3 - 6 * s, 3.2 * s, 0, 7); g.fill()
      g.beginPath(); g.arc(hx3 + 6 * s, hy3 - 5 * s, 3.2 * s, 0, 7); g.fill()
      emberEyes(g, hx3 - 5 * s, hy3, 1.4 * s, B.eye, 3 * s, 12 * s)
      break
    }

    // ---- brute: enormous torso, tiny head sunk between the shoulders, club
    case 'brute': {
      groundShadow(g, cx + 5 * s, base - 1, 26 * s, 11 * s, .68)
      const hipY = base - 16 * s, shY = base - 40 * s - breathe
      limb(g, cx - 6 * s, hipY, cx - 9 * s + step * 3 * s, base, 6 * s, 4.4 * s, h[2])
      limb(g, cx + 6 * s, hipY, cx + 9 * s - step * 3 * s, base, 6 * s, 4.4 * s, h[2])
      poly(g, [[cx - 14 * s, base], [cx - 4 * s, base], [cx - 6 * s, base - 4 * s]], h[2])
      poly(g, [[cx + 4 * s, base], [cx + 14 * s, base], [cx + 6 * s, base - 4 * s]], h[2])
      poly(g, [[cx - 18 * s + lean, shY + 4 * s], [cx + 18 * s + lean, shY + 4 * s],
               [cx + 9 * s, hipY], [cx - 9 * s, hipY]], h[0])
      poly(g, [[cx - 18 * s + lean, shY + 4 * s], [cx - 3 * s + lean, shY + 4 * s],
               [cx - 3 * s, hipY], [cx - 9 * s, hipY]], h[1])
      g.fillStyle = h[1]                                                     // shoulder masses
      g.beginPath(); g.ellipse(cx - 16 * s + lean, shY + 4 * s, 9 * s, 7 * s, -.3, 0, 7); g.fill()
      g.beginPath(); g.ellipse(cx + 16 * s + lean, shY + 4 * s, 9 * s, 7 * s, .3, 0, 7); g.fill()
      for (let i = 0; i < 3; i++) {                                          // spines out of the back
        spike(g, cx + 8 * s + i * 5 * s, shY + 8 * s + i * 5 * s, 9 * s, -.5 + i * .2, 2.4 * s, h[2])
      }
      tatters(g, cx + lean * .5, hipY - 4 * s, 26 * s, 16 * s, '#2e2a20', t, 5)
      limb(g, cx - 17 * s + lean, shY + 8 * s, cx - 22 * s, hipY + 12 * s, 5.4 * s, 3.6 * s, h[0])
      const cxx = cx + 22 * s + lean + (opt?.swinging ? Math.sin(t * 7) * 8 * s : 0)
      limb(g, cx + 17 * s + lean, shY + 8 * s, cxx, hipY + 8 * s, 5.4 * s, 3.6 * s, h[1])
      g.strokeStyle = '#3a2e1c'; g.lineWidth = 4.4 * s                        // the club
      g.beginPath(); g.moveTo(cxx, hipY + 12 * s); g.lineTo(cxx + 6 * s, shY - 6 * s); g.stroke()
      g.fillStyle = '#4a3c24'
      g.beginPath(); g.ellipse(cxx + 7 * s, shY - 10 * s, 8 * s, 9 * s, .2, 0, 7); g.fill()
      for (let i = 0; i < 4; i++)
        spike(g, cxx + 7 * s + Math.cos(i * 1.6) * 7 * s, shY - 10 * s + Math.sin(i * 1.6) * 8 * s,
          5 * s, i * 1.6, 1.6 * s, '#8d876f')
      const hy4 = shY - 2 * s
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + lean, hy4, 6.4 * s, 5.4 * s, 0, 0, 7); g.fill()
      poly(g, [[cx - 4 * s + lean, hy4 + 2 * s], [cx + 5 * s + lean, hy4 + 2 * s],
               [cx + 1 * s + lean, hy4 + 8 * s]], h[0])                      // jaw
      g.fillStyle = '#e8e2d0'
      spike(g, cx - 2 * s + lean, hy4 + 5 * s, 4 * s, -1.6, 1.2 * s, '#e8e2d0')
      spike(g, cx + 3 * s + lean, hy4 + 5 * s, 3.4 * s, -1.6, 1.1 * s, '#e8e2d0')
      emberEyes(g, cx + lean, hy4 - 1 * s, 1.5 * s, B.eye, 2.8 * s, 12 * s)
      break
    }

    // ---- skeletal knight: ribcage, horned helm, kite shield, ruined tabard
    case 'skeletal': {
      groundShadow(g, cx + 3 * s, base - 1, 18 * s, 8 * s, .6)
      const hipY = base - 19 * s, shY = base - 34 * s
      const sw = opt?.swinging ? Math.sin(t * 9) : -.4
      limb(g, cx - 3 * s, hipY, cx - 5 * s + step * 3 * s, base, 2.4 * s, 1.8 * s, h[0])
      limb(g, cx + 3 * s, hipY, cx + 5 * s - step * 3 * s, base, 2.4 * s, 1.8 * s, h[0])
      g.strokeStyle = h[0]; g.lineWidth = 2.6 * s                             // spine
      g.beginPath(); g.moveTo(cx, hipY); g.lineTo(cx + lean * .4, shY); g.stroke()
      poly(g, [[cx - 7 * s + lean, shY], [cx + 7 * s + lean, shY],
               [cx + 5 * s, hipY + 2 * s], [cx - 5 * s, hipY + 2 * s]], '#2e2a22')
      g.strokeStyle = h[1]; g.lineWidth = 2 * s                               // ribs
      for (let i = 0; i < 4; i++) {
        const ry = shY + 3 * s + i * 3.4 * s
        g.beginPath(); g.moveTo(cx - 6 * s + lean, ry)
        g.quadraticCurveTo(cx + lean, ry + 2.6 * s, cx + 6 * s + lean, ry); g.stroke()
      }
      tatters(g, cx + lean * .5, hipY, 15 * s, 15 * s, '#4a1a18', t, 4)       // tabard
      g.fillStyle = '#6a6254'                                                 // pauldrons
      g.beginPath(); g.ellipse(cx - 8 * s + lean, shY + 1 * s, 5.4 * s, 4.4 * s, -.4, 0, 7); g.fill()
      g.beginPath(); g.ellipse(cx + 8 * s + lean, shY + 1 * s, 5.4 * s, 4.4 * s, .4, 0, 7); g.fill()
      spike(g, cx - 10 * s + lean, shY - 1 * s, 6 * s, -2.4, 1.6 * s, '#8a8272')
      spike(g, cx + 10 * s + lean, shY - 1 * s, 6 * s, -.7, 1.6 * s, '#8a8272')
      // shield arm and sword arm
      g.fillStyle = '#4e4638'
      poly(g, [[cx - 15 * s + lean, shY + 1 * s], [cx - 7 * s + lean, shY + 3 * s],
               [cx - 8 * s + lean, shY + 17 * s], [cx - 15 * s + lean, shY + 13 * s]], '#4e4638')
      g.strokeStyle = '#7a7264'; g.lineWidth = 1.4
      g.beginPath(); g.moveTo(cx - 15 * s + lean, shY + 5 * s); g.lineTo(cx - 8 * s + lean, shY + 7 * s); g.stroke()
      boss3(g, cx - 11.5 * s + lean, shY + 8 * s, 2.4 * s)
      const hx5 = cx + 10 * s + lean + Math.cos(sw) * 6 * s
      const hy5 = shY + 6 * s + Math.sin(sw) * 6 * s
      limb(g, cx + 7 * s + lean, shY + 3 * s, hx5, hy5, 2.4 * s, 1.8 * s, h[0])
      drawWeapon(g, hx5, hy5, sw, s * 1.1, 'bronze-sword')
      // the helm
      const hy6 = shY - 8 * s
      g.fillStyle = '#5e564a'
      g.beginPath(); g.ellipse(cx + lean, hy6, 5.4 * s, 6 * s, 0, 0, 7); g.fill()
      g.fillStyle = '#0a0806'
      g.beginPath(); g.ellipse(cx + lean, hy6 + 1 * s, 3.4 * s, 3 * s, 0, 0, 7); g.fill()
      spike(g, cx - 5 * s + lean, hy6 - 2 * s, 12 * s, -2.5, 2.4 * s, '#6e6658')
      spike(g, cx + 5 * s + lean, hy6 - 2 * s, 12 * s, -.6, 2.4 * s, '#6e6658')
      g.fillStyle = 'rgba(255,244,214,.25)'
      g.beginPath(); g.ellipse(cx - 2 * s + lean, hy6 - 2.4 * s, 2.4 * s, 1.6 * s, 0, 0, 7); g.fill()
      emberEyes(g, cx + lean, hy6 + 1 * s, 1.2 * s, B.eye, 2.2 * s, 11 * s)
      break
    }

    // ---- drowned: a torso rising out of the water, hair, no legs
    case 'drowned': {
      const bob = Math.sin(t * 1.4) * 2.4 * s
      g.save(); g.globalCompositeOperation = 'lighter'                        // the water she sits in
      const wg = g.createRadialGradient(cx, base, 0, cx, base, 30 * s)
      wg.addColorStop(0, 'rgba(90,190,200,.18)'); wg.addColorStop(1, 'rgba(90,190,200,0)')
      g.fillStyle = wg
      g.save(); g.translate(cx, base); g.scale(1, .38); g.translate(-cx, -base)
      g.beginPath(); g.arc(cx, base, 30 * s, 0, 7); g.fill(); g.restore(); g.restore()
      for (let i = 0; i < 3; i++) {
        const p = ((t * .5 + i * .33) % 1)
        g.strokeStyle = 'rgba(140,240,240,' + (.3 * (1 - p)) + ')'; g.lineWidth = 1.4
        g.beginPath(); g.ellipse(cx, base, 8 * s + p * 22 * s, (8 * s + p * 22 * s) * .38, 0, 0, 7); g.stroke()
      }
      const shY = base - 30 * s + bob
      poly(g, [[cx - 8 * s + lean, shY], [cx + 8 * s + lean, shY],
               [cx + 6 * s, base - 4 * s], [cx - 6 * s, base - 4 * s]], h[0])
      poly(g, [[cx - 8 * s + lean, shY], [cx - 1 * s + lean, shY],
               [cx - 1 * s, base - 4 * s], [cx - 6 * s, base - 4 * s]], h[1])
      for (let i = 0; i < 4; i++)                                             // fins along the arms
        spike(g, cx - 9 * s + lean, shY + 4 * s + i * 4 * s, 7 * s, 3.3, 1.6 * s, h[1])
      const reach = opt?.mad ? Math.sin(t * 3) * 5 * s : 0
      limb(g, cx - 7 * s + lean, shY + 3 * s, cx - 17 * s - reach, shY + 14 * s, 3 * s, 1.6 * s, h[0])
      limb(g, cx + 7 * s + lean, shY + 3 * s, cx + 17 * s + reach, shY + 12 * s, 3 * s, 1.6 * s, h[1])
      for (let i = 0; i < 3; i++) {
        spike(g, cx - 18 * s - reach + i * 1.6 * s, shY + 15 * s, 5 * s, 1.2 + i * .25, 1 * s, '#c8e8e8')
        spike(g, cx + 18 * s + reach - i * 1.6 * s, shY + 13 * s, 5 * s, 1.9 - i * .25, 1 * s, '#c8e8e8')
      }
      const hy7 = shY - 7 * s
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + lean, hy7, 5.4 * s, 6.4 * s, 0, 0, 7); g.fill()
      for (let i = 0; i < 9; i++) {                                           // weed for hair
        const a = -2.9 + i * .34
        g.strokeStyle = i % 2 ? '#1e3a3a' : '#2a4e4a'; g.lineWidth = 2.4 * s
        g.beginPath(); g.moveTo(cx + lean + Math.cos(a) * 5 * s, hy7 + Math.sin(a) * 5 * s)
        g.quadraticCurveTo(cx + lean + Math.cos(a) * 15 * s + Math.sin(t * 1.6 + i) * 4 * s,
          hy7 + 8 * s, cx + lean + Math.cos(a) * 13 * s, hy7 + 22 * s); g.stroke()
      }
      g.fillStyle = '#0a1416'
      g.beginPath(); g.ellipse(cx + lean, hy7 + 3 * s, 2.6 * s, 3.4 * s, 0, 0, 7); g.fill()
      emberEyes(g, cx + lean, hy7 - 1 * s, 1.4 * s, B.eye, 2.6 * s, 13 * s)
      break
    }

    // ---- the spider queen: abdomen first, then legs over it
    case 'arach': {
      eliteAura(g, cx, base, 46 * s, '#ff2a48', t)
      groundShadow(g, cx + 4 * s, base - 1, 30 * s, 12 * s, .66)
      const bodyY = base - 15 * s - breathe
      g.fillStyle = h[0]                                                      // abdomen, bulbous
      g.beginPath(); g.ellipse(cx + 12 * s, bodyY - 6 * s, 17 * s, 14 * s, .12, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + 9 * s, bodyY - 11 * s, 11 * s, 7 * s, .12, 0, 7); g.fill()
      g.fillStyle = '#7a1024'                                                 // the mark on the back
      poly(g, [[cx + 12 * s, bodyY - 16 * s], [cx + 17 * s, bodyY - 8 * s],
               [cx + 12 * s, bodyY - 2 * s], [cx + 7 * s, bodyY - 8 * s]], '#7a1024')
      for (let i = 0; i < 8; i++) {                                           // eight legs, jointed
        const side = i < 4 ? -1 : 1, k = i % 4
        const spread = (k - 1.5) * .38
        const wob = Math.sin(t * (walk ? 6 : 1.4) + i) * (walk ? .18 : .06)
        const kx = cx + side * (14 + k * 6) * s
        const ky = bodyY - 22 * s + Math.abs(spread) * 8 * s
        const fx = kx + side * (10 + k * 3) * s
        limb(g, cx + side * 4 * s, bodyY - 4 * s, kx, ky + wob * 20 * s, 3.4 * s, 2.4 * s, h[1])
        limb(g, kx, ky + wob * 20 * s, fx, base - 1 * s, 2.4 * s, 1 * s, h[0])
        for (let q = 0; q < 3; q++)
          spike(g, kx + (fx - kx) * (q / 3), ky + wob * 20 * s + (base - ky) * (q / 3),
            4 * s, -1.6, 1 * s, h[2])
      }
      g.fillStyle = h[1]                                                      // cephalothorax
      g.beginPath(); g.ellipse(cx - 8 * s, bodyY - 3 * s, 11 * s, 8.4 * s, 0, 0, 7); g.fill()
      g.fillStyle = h[2]
      g.beginPath(); g.ellipse(cx - 15 * s, bodyY - 1 * s, 7 * s, 5.4 * s, 0, 0, 7); g.fill()
      for (const side of [-1, 1])                                             // fangs
        spike(g, cx - 18 * s, bodyY + 2 * s + side * 1.6 * s, 8 * s, 2.9 + side * .25, 1.8 * s, '#d8ccb0')
      for (let i = 0; i < 8; i++) {                                           // a cluster of eyes
        const ex = cx - 20 * s + (i % 4) * 2.8 * s, ey = bodyY - 4 * s + ((i / 4) | 0) * 3 * s
        g.save(); g.globalCompositeOperation = 'lighter'
        const eg = g.createRadialGradient(ex, ey, 0, ex, ey, 6 * s)
        eg.addColorStop(0, hexA(B.eye, .4)); eg.addColorStop(1, hexA(B.eye, 0))
        g.fillStyle = eg; g.beginPath(); g.arc(ex, ey, 6 * s, 0, 7); g.fill(); g.restore()
        g.fillStyle = B.eye; g.beginPath(); g.arc(ex, ey, 1.2 * s, 0, 7); g.fill()
      }
      break
    }

    // ---- carapace: armoured, one claw far bigger than the other
    case 'carapace': {
      groundShadow(g, cx + 3 * s, base - 1, 22 * s, 8 * s, .6)
      const bodyY = base - 9 * s - breathe * .4
      for (let i = 0; i < 6; i++) {
        const side = i < 3 ? -1 : 1, k = i % 3
        const fx = cx + side * (16 + k * 5) * s + (walk ? Math.sin(t * 8 + i) * 2.4 * s : 0)
        limb(g, cx + side * 7 * s, bodyY, cx + side * (13 + k * 3) * s, bodyY - 5 * s, 2.6 * s, 1.8 * s, h[2])
        limb(g, cx + side * (13 + k * 3) * s, bodyY - 5 * s, fx, base, 1.8 * s, .9 * s, h[0])
      }
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx, bodyY, 16 * s, 10 * s, 0, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 2 * s, bodyY - 3 * s, 12 * s, 5.4 * s, 0, 0, 7); g.fill()
      g.strokeStyle = h[2]; g.lineWidth = 1.4 * s                             // plate seams
      for (let i = 0; i < 4; i++) {
        g.beginPath(); g.moveTo(cx - 12 * s + i * 7 * s, bodyY - 8 * s)
        g.lineTo(cx - 10 * s + i * 7 * s, bodyY + 8 * s); g.stroke()
      }
      for (let i = 0; i < 5; i++)                                             // barnacle spines
        spike(g, cx - 10 * s + i * 5 * s, bodyY - 9 * s, 5 * s, -1.5 + (i - 2) * .2, 1.6 * s, h[2])
      const bigSw = opt?.swinging ? Math.sin(t * 6) * 6 * s : 0
      // the great claw
      limb(g, cx - 13 * s, bodyY - 2 * s, cx - 24 * s - bigSw, bodyY - 12 * s, 4.4 * s, 3.4 * s, h[0])
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 28 * s - bigSw, bodyY - 15 * s, 9 * s, 6 * s, -.5, 0, 7); g.fill()
      poly(g, [[cx - 34 * s - bigSw, bodyY - 19 * s], [cx - 24 * s - bigSw, bodyY - 16 * s],
               [cx - 36 * s - bigSw, bodyY - 12 * s]], h[0])
      // and the small one
      limb(g, cx + 13 * s, bodyY - 1 * s, cx + 20 * s, bodyY - 6 * s, 3 * s, 2.4 * s, h[0])
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx + 22 * s, bodyY - 8 * s, 4.4 * s, 3 * s, -.4, 0, 7); g.fill()
      for (const ex of [-4, 4])                                               // eyes on stalks
        limb(g, cx + ex * s, bodyY - 8 * s, cx + ex * 1.4 * s, bodyY - 15 * s, 1.4 * s, 1.2 * s, h[0])
      emberEyes(g, cx, bodyY - 16 * s, 1.6 * s, B.eye, 5.6 * s, 9 * s)
      break
    }

    // ---- the sheep, which is a sheep, and stays a sheep -------------------
    case 'sheep': {
      groundShadow(g, cx + 3 * s, base - 1, 18 * s, 7 * s, .5)
      const bodyY = base - 14 * s - breathe * .4
      g.strokeStyle = h[2]; g.lineWidth = 3 * s; g.lineCap = 'round'
      for (const [lx, ph] of [[-7, 0], [-4, 2.1], [6, 1.05], [9, 3.1]]) {
        g.beginPath(); g.moveTo(cx + lx * s, bodyY + 3 * s)
        g.lineTo(cx + lx * s + (walk ? Math.sin(t * 7 + ph) * 2.6 * s : 0), base); g.stroke()
      }
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * 6.283
        g.fillStyle = i % 3 ? '#cfc8b4' : '#a8a08c'
        g.beginPath(); g.arc(cx + Math.cos(a) * 12 * s, bodyY + Math.sin(a) * 7 * s, 4.4 * s, 0, 7); g.fill()
      }
      g.fillStyle = '#ded8c6'
      g.beginPath(); g.ellipse(cx - 2 * s, bodyY - 2 * s, 10 * s, 5 * s, 0, 0, 7); g.fill()
      const hx8 = cx - 13 * s, hy8 = bodyY - 4 * s
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(hx8, hy8, 5 * s, 4 * s, -.2, 0, 7); g.fill()
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(hx8 - 3 * s, hy8 + 3 * s, 3.4 * s, 2.4 * s, 0, 0, 7); g.fill()
      g.fillStyle = h[2]
      g.beginPath(); g.ellipse(hx8 + 3 * s, hy8 - 3 * s, 3 * s, 2 * s, .4, 0, 7); g.fill()
      g.fillStyle = B.eye
      g.beginPath(); g.arc(hx8 - 2 * s, hy8 - 1 * s, 1.1 * s, 0, 7); g.fill()
      break
    }

    // ---- the wyrm: the one thing on this island that is simply larger
    case 'wyrm': {
      eliteAura(g, cx, base, 62 * s, '#ff6a1a', t)
      groundShadow(g, cx + 6 * s, base - 1, 34 * s, 13 * s, .7)
      const bodyY = base - 22 * s - breathe
      const flap = Math.sin(t * 1.9)
      // the far wing, behind everything
      wing(g, cx, bodyY, -1, flap, s, h, .72)
      // tail, sweeping
      let px2 = cx + 10 * s, py2 = bodyY + 4 * s
      for (let i = 1; i <= 5; i++) {
        const nx = cx + (10 + i * 8) * s
        const ny = bodyY + 6 * s + Math.sin(t * 1.5 - i * .5) * 4 * s + i * 1.6 * s
        limb(g, px2, py2, nx, ny, (8 - i) * s, (7 - i) * s, i % 2 ? h[0] : h[1])
        spike(g, nx, ny - (6 - i) * s, (9 - i) * s, -1.5, 1.8 * s, h[2])
        px2 = nx; py2 = ny
      }
      spike(g, px2, py2, 12 * s, .3, 4 * s, h[2])
      // legs, planted wide
      limb(g, cx - 8 * s, bodyY + 8 * s, cx - 15 * s, base, 7 * s, 4.4 * s, h[0])
      limb(g, cx + 6 * s, bodyY + 8 * s, cx + 12 * s, base, 7 * s, 4.4 * s, h[1])
      for (let i = 0; i < 3; i++) {
        spike(g, cx - 17 * s + i * 3 * s, base, 6 * s, 2.6 + i * .3, 1.6 * s, '#e0d4b8')
        spike(g, cx + 10 * s + i * 3 * s, base, 6 * s, .5 + i * .3, 1.6 * s, '#e0d4b8')
      }
      // barrel chest
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx, bodyY, 20 * s, 15 * s, -.06, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 3 * s, bodyY - 5 * s, 15 * s, 8 * s, -.1, 0, 7); g.fill()
      g.fillStyle = '#8a5a2a'                                                 // belly plates
      for (let i = 0; i < 5; i++) {
        g.beginPath(); g.ellipse(cx - 10 * s + i * 5 * s, bodyY + 10 * s, 3.4 * s, 2 * s, 0, 0, 7); g.fill()
      }
      for (let i = 0; i < 5; i++)                                             // dorsal ridge
        spike(g, cx - 12 * s + i * 6 * s, bodyY - 13 * s, 10 * s - Math.abs(i - 2) * 1.6 * s,
          -1.5 + (i - 2) * .12, 2.4 * s, h[2])
      // neck and skull
      const nx2 = cx - 20 * s, ny2 = bodyY - 22 * s - breathe
      limb(g, cx - 8 * s, bodyY - 6 * s, nx2, ny2, 8 * s, 5.4 * s, h[0])
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(nx2 - 5 * s, ny2, 10 * s, 6 * s, -.16, 0, 7); g.fill()
      poly(g, [[nx2 - 13 * s, ny2 + 1 * s], [nx2 - 18 * s, ny2 + 5 * s],
               [nx2 - 4 * s, ny2 + 6 * s], [nx2 - 2 * s, ny2 + 2 * s]], h[0])   // jaw
      g.fillStyle = '#e8dcc0'
      for (let i = 0; i < 4; i++)
        spike(g, nx2 - 14 * s + i * 3.4 * s, ny2 + 3 * s, 4 * s, 1.6, 1.1 * s, '#e8dcc0')
      spike(g, nx2 - 2 * s, ny2 - 5 * s, 15 * s, -1.1, 3 * s, h[2])           // horns
      spike(g, nx2 + 2 * s, ny2 - 4 * s, 13 * s, -.75, 2.6 * s, h[2])
      g.save(); g.globalCompositeOperation = 'lighter'                         // fire in the throat
      const fg = g.createRadialGradient(nx2 - 13 * s, ny2 + 3 * s, 0, nx2 - 13 * s, ny2 + 3 * s, 12 * s)
      fg.addColorStop(0, 'rgba(255,180,60,' + (.35 + Math.sin(t * 3) * .2) + ')')
      fg.addColorStop(1, 'rgba(255,120,20,0)')
      g.fillStyle = fg; g.beginPath(); g.arc(nx2 - 13 * s, ny2 + 3 * s, 12 * s, 0, 7); g.fill(); g.restore()
      emberEyes(g, nx2 - 6 * s, ny2 - 2 * s, 2 * s, B.eye, 4 * s, 18 * s)
      // the near wing, over the body
      wing(g, cx, bodyY, 1, flap, s, h, 1)
      break
    }
  }
}
// one wing, membraned between four fingers
function wing(g, cx, bodyY, side, flap, s, h, lit) {
  const sp = 42 * s, rise = 34 * s + flap * 14 * s
  const tip = [cx + side * sp, bodyY - rise]
  const elbow = [cx + side * 20 * s, bodyY - rise * .78]
  poly(g, [[cx, bodyY - 8 * s], elbow, tip,
           [cx + side * 34 * s, bodyY - 4 * s], [cx + side * 18 * s, bodyY + 2 * s]],
    lit > .9 ? h[1] : h[2])
  g.strokeStyle = h[2]; g.lineWidth = 2.4 * s
  g.beginPath(); g.moveTo(cx, bodyY - 8 * s); g.lineTo(elbow[0], elbow[1]); g.lineTo(tip[0], tip[1]); g.stroke()
  for (let i = 1; i <= 3; i++) {
    const fx = cx + side * (12 + i * 9) * s, fy = bodyY - 2 * s + i * 1.4 * s
    g.strokeStyle = h[2]; g.lineWidth = 1.8 * s
    g.beginPath(); g.moveTo(elbow[0], elbow[1]); g.lineTo(fx, fy); g.stroke()
  }
  spike(g, elbow[0], elbow[1], 8 * s, side > 0 ? -.6 : -2.5, 2 * s, h[2])
}
// a shield boss, which the knight needs and the panel's `boss` cannot reach
function boss3(g, bx, by, r) {

// ---- the ember that every fire in the world actually is --------------------
// Drawn live and additively: the same routine paints a campfire, a firemaking
// fire, and a watchfire, differing only in how much of it there is.
function drawFlame(g, cx, base, t, size, seed) {
  const n = 5 + (size * 4 | 0)
  for (let i = 0; i < n; i++) {
    const p = (t * (1.6 + (i % 3) * .5) + i * .618 + seed) % 1
    const w = (5 + (i % 4) * 2.4) * size * (1 - p * .55)
    const x = cx + Math.sin((t * 2.6 + i * 1.7)) * 3.4 * size * p
    const y = base - p * 26 * size
    // Wider than it is tall at the base, and the pale core kept small: a
    // narrow column of near-white is a plasma jet, not a fire, and bloom
    // exaggerates whatever it is given.
    g.fillStyle = p < .18 ? 'rgba(255,226,150,' + (.7 - p) + ')'
      : p < .58 ? 'rgba(244,138,34,' + (.74 - p * .55) + ')'
      : 'rgba(158,46,12,' + (.46 - p * .38) + ')'
    g.beginPath(); g.ellipse(x, y, w * .70, w * .80, 0, 0, 7); g.fill()
  }
  for (let i = 0; i < 4; i++) {              // cinders leaving
    const p = (t * .55 + i * .27 + seed) % 1
    g.fillStyle = 'rgba(255,170,70,' + (.75 * (1 - p)) + ')'
    g.fillRect(cx + Math.sin(t * 1.6 + i * 2) * 12 * size * p, base - p * 60 * size, 1.6, 1.6)
  }
}

// ===========================================================================
// THE RENDERER
// ---------------------------------------------------------------------------
// Three passes and a composite:
//
//   1. GROUND.  Every visible tile, walked in diagonal order (by x+y), so that
//      a raised crag draws its rock face before the tile in front of it covers
//      the bottom of that face. Iterating rows would be wrong: two tiles in
//      the same row are at different depths once the camera turns.
//   2. STANDING.  Everything with a footprint is collected, sorted by depth,
//      and drawn bottom-up. This is the pass that makes the window read as a
//      place rather than a chart: a citizen walks BEHIND the oak and in FRONT
//      of the wall, and neither of those facts is available to a flat window.
//   3. LIGHT.  The whole frame is covered in night and then the night is
//      PUNCHED OUT wherever something burns. Ambient comes from the world's
//      own day cycle (a pure function of the tick, so every window agrees what
//      time it is); the lantern is the window's, and never goes out.
//
//   4. AIR.  Additive glow, cinders, and the vignette, over the top.
// ===========================================================================

const cv = document.getElementById('cv')
const cx = cv.getContext('2d')
let VW = 0, VH = 0, DPR = 1
const sceneCv = mkc(8, 8), sceneG = sceneCv.getContext('2d')
const lightCv = mkc(8, 8), lightG = lightCv.getContext('2d')

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1)
  VW = window.innerWidth; VH = window.innerHeight
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR)
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px'
  cx.setTransform(DPR, 0, 0, DPR, 0, 0)
  for (const c of [sceneCv, lightCv]) { c.width = cv.width; c.height = cv.height }
  sceneG.setTransform(DPR, 0, 0, DPR, 0, 0)
  lightG.setTransform(DPR, 0, 0, DPR, 0, 0)
  if (typeof sizeSurfaces === 'function') sizeSurfaces()
}
window.addEventListener('resize', resize)

// ---- the camera -----------------------------------------------------------
// Anchored on the citizen and eased, because a camera that snaps tile to tile
// turns walking into a slide show. `camX/camY` are fractional world coords.
let camX = 0, camY = 0, camReady = false
let shake = 0, flashRed = 0, flashGold = 0
const CAM_LIFT = 26                          // stand the horizon up a little

function screenOf(wx, wy) {
  return { x: VW / 2 + isoX(wx, wy) - isoX(camX, camY),
           y: VH / 2 - CAM_LIFT + isoY(wx, wy) - isoY(camX, camY) }
}
function worldOf(px2, py2) {
  return unIso(px2 - VW / 2 + isoX(camX, camY) + HW,
               py2 - VH / 2 + CAM_LIFT + isoY(camX, camY))
}

// ---- interpolation --------------------------------------------------------
// A tick is 600ms and a step is a whole tile, so without this everyone
// teleports twice a second. Positions are eased from where a thing was in the
// previous state toward where it is in this one.
let prevPos = new Map(), curPos = new Map()
const facing = new Map()                     // last direction each body moved
let prevHp = new Map()
function notePositions(s) {
  prevPos = curPos; curPos = new Map()
  for (const [id, p] of Object.entries(s.players ?? {})) curPos.set('p' + id, [p.x, p.y])
  for (const [id, m] of Object.entries(s.mobs ?? {})) curPos.set('m' + id, [m.x, m.y])
  for (const [k, now] of curPos) {
    const was = prevPos.get(k)
    if (was && (was[0] !== now[0] || was[1] !== now[1])) facing.set(k, [now[0] - was[0], now[1] - was[1]])
  }
  // WHO GOT HIT, AND FOR HOW MUCH.
  //
  // The state carries current hp and nothing else -- no combat log, no event
  // stream -- so a blow is only ever visible as a difference between two
  // ticks. Diffing them here is what buys the flash, the number and the blood,
  // and it costs one pass over the mobs the camera can already see.
  const hpNow = new Map()
  const mine = myId && s.players?.[myId]
  const myTarget = mine?.action?.type === 'attack' ? mine.action.mobId : null
  for (const [id, m] of Object.entries(s.mobs ?? {})) {
    hpNow.set('m' + id, m.hp)
    const was = prevHp.get('m' + id)
    if (was === undefined || m.hp >= was) continue
    const d = was - m.hp
    hitFlash.set('m' + id, performance.now())
    const byMe = myTarget === id
    popNumber(m.x, m.y, String(d), byMe ? '#f6ecd6' : '#b8ae9a', d >= 4)
    bleedAt(m.x, m.y, d)
    if (byMe) SFX.hit()
    const p = screenOf(m.x, m.y)
    for (let i = 0; i < 5 + d * 2; i++)
      mote(p.x + (Math.random() - .5) * 14, p.y - 22,
        (Math.random() - .5) * 3.4, -1.4 - Math.random() * 2.4,
        .55 + Math.random() * .45, 'rgba(168,22,14,%a)', 2 + Math.random() * 2)
    if (m.hp <= 0) { bleedAt(m.x, m.y, 10); shake = Math.max(shake, 3); if (byMe) SFX.slain() }
  }
  for (const [id, p] of Object.entries(s.players ?? {})) {
    hpNow.set('p' + id, p.hp)
    const was = prevHp.get('p' + id)
    if (was === undefined || p.hp >= was || id === myId) continue
    hitFlash.set('p' + id, performance.now())
    popNumber(p.x, p.y, String(was - p.hp), '#d43a24', false)
    bleedAt(p.x, p.y, was - p.hp)
  }
  prevHp = hpNow
}
function lerpPos(key, x, y, k) {
  const was = prevPos.get(key)
  if (!was) return [x, y]
  if (Math.abs(was[0] - x) > 2 || Math.abs(was[1] - y) > 2) return [x, y]   // a recall, not a step
  return [was[0] + (x - was[0]) * k, was[1] + (y - was[1]) * k]
}
// how far through the current tick we are, for drawing AND for hit-testing:
// what you see is what you click
function renderT(now) {
  if (tickOffset !== null && curState) {
    const rt = (now - tickOffset) / 600 - 1.0
    return Math.min(1.15, Math.max(0, rt - (curState.tick - 1)))
  }
  return Math.min(1.2, (now - stateAt) / statePeriod)
}

// ---- there is no day here -------------------------------------------------
// The constitution's clock is untouched and still authoritative: DAY is 2400
// ticks, the flat window will show you a sunrise, and every node in the world
// agrees what hour it is. This window keeps one climate on purpose. A crawl
// lit by a lantern that goes bright at noon has spent half its day arguing
// with itself.
const DAY = 2400

// ---------------------------------------------------------------------------
// GROUND PASS
// ---------------------------------------------------------------------------
let waterTiles = []
function drawGround(g, s, t) {
  // which tiles can the screen see? invert the four corners and take the box
  const c0 = worldOf(-TW, -TH), c1 = worldOf(VW + TW, -TH)
  const c2 = worldOf(-TW, VH + TH + 90), c3 = worldOf(VW + TW, VH + TH + 90)
  const W = world?.genesis?.worldW ?? dims().W, H = world?.genesis?.worldH ?? dims().H
  const x0 = Math.max(0, Math.min(c0.x, c1.x, c2.x, c3.x) - 1)
  const x1 = Math.min(W - 1, Math.max(c0.x, c1.x, c2.x, c3.x) + 1)
  const y0 = Math.max(0, Math.min(c0.y, c1.y, c2.y, c3.y) - 1)
  const y1 = Math.min(H - 1, Math.max(c0.y, c1.y, c2.y, c3.y) + 1)
  waterTiles.length = 0
  if (x1 < x0 || y1 < y0) return
  const oxB = VW / 2 - isoX(camX, camY) - HW
  const oyB = VH / 2 - CAM_LIFT - isoY(camX, camY) - HH
  // diagonal order: this is the whole trick, and it is one loop
  for (let d = x0 + y0; d <= x1 + y1; d++) {
    const xa = Math.max(x0, d - y1), xb = Math.min(x1, d - y0)
    for (let x = xa; x <= xb; x++) {
      const y = d - x
      const kind = terrainOf(x, y)
      const G = groundOf(kind)
      const v = tileHash(x, y, 91) & 3
      const ox = oxB + isoX(x, y), oy = oyB + isoY(x, y) - G.lift
      g.drawImage(tileArt(kind, v), ox, oy)
      if (G.grain === 'water') waterTiles.push(ox, oy)
    }
  }
  // one moving highlight over every water tile: still water is a blue floor
  if (waterTiles.length) {
    g.save(); g.globalCompositeOperation = 'lighter'
    for (let i = 0; i < waterTiles.length; i += 2) {
      const ox = waterTiles[i], oy = waterTiles[i + 1]
      const p = (Math.sin((ox * .01 + oy * .03) + t * .0011) + 1) / 2
      g.fillStyle = 'rgba(120,168,196,' + (.05 + p * .09) + ')'
      diamond(g, ox, oy, 6 + p * 6); g.fill()
    }
    g.restore()
  }
}

// ---------------------------------------------------------------------------
// STANDING PASS
// ---------------------------------------------------------------------------
// Every node, beast, citizen and dropped thing becomes one entry with a depth,
// and then the list is sorted once. Anything drawn outside this list is
// drawing itself out of order and will look wrong the moment it overlaps.
const NODE_LIFT = { river: -6, sea: -7, fens: -2, peat: -2, crags: 10, mountain: 14, scree: 4, cobble: 1, plaza: 1, causey: 2, bridge: 3, floor: 1, inn: 1, smith: 1, fisher: 1, shep: 1, clerk: 1, wizard: 1 }
const liftAt = (x, y) => NODE_LIFT[terrainOf(x, y)] ?? 0
// A room, in the world's own terms: the generator paints `floor` (and the
// trade-floors) inside the walls it raises. Anything standing on one of these
// is INDOORS, and several things are drawn differently once they are.
const INDOOR_TERRAIN = new Set(['floor', 'inn', 'smith', 'fisher', 'shep', 'clerk', 'wizard'])
const indoors = (x, y) => INDOOR_TERRAIN.has(terrainOf(x, y))

const bubbles = {}
const motes = []                             // blood, sparks, cinders
function mote(x, y, vx, vy, life, col, size) {
  if (motes.length > 400) return
  motes.push({ x, y, vx, vy, t: 0, life, col, size: size ?? 2 })
}

function collectStanding(s, t, list) {
  const W = world?.genesis?.worldW ?? dims().W
  const near = (e) => {
    const p = screenOf(e.x, e.y)
    return p.x > -160 && p.x < VW + 160 && p.y > -220 && p.y < VH + 160
  }
  for (const [id, n] of Object.entries(s.nodes ?? {})) {
    if (!near(n)) continue
    list.push({ d: n.x + n.y, x: n.x, y: n.y, kind: 'node', id, e: n })
  }
  for (const [id, gi] of Object.entries(s.ground ?? {})) {
    if (!near(gi)) continue
    list.push({ d: gi.x + gi.y + .1, x: gi.x, y: gi.y, kind: 'ground', id, e: gi })
  }
  for (const [id, m] of Object.entries(s.mobs ?? {})) {
    if (m.hp <= 0 || !near(m)) continue
    const [ix, iy] = lerpPos('m' + id, m.x, m.y, t)
    list.push({ d: ix + iy + .2, x: ix, y: iy, kind: 'mob', id, e: m })
  }
  for (const [id, p] of Object.entries(s.players ?? {})) {
    if ((p.deadUntil ?? 0) > s.tick || !near(p)) continue
    const [ix, iy] = lerpPos('p' + id, p.x, p.y, t)
    list.push({ d: ix + iy + .3, x: ix, y: iy, kind: 'player', id, e: p })
  }
  list.sort((a, b) => a.d - b.d)
}

// ---- one node, whatever it happens to be ----------------------------------
// Only things that ARE buildings. A bank and a store used to be in this table
// and that was the whole bug: they are counters standing inside buildings the
// world has already raised out of wall nodes.
const BUILDING_KINDS = {
  house: { wall: { lit: '#372e24', dark: '#211a14' }, roof: { lit: '#33291c', dark: '#1c1409' }, glow: '#d8863a', bw: 34, bd: 34, bh: 28 },
  inn:   { wall: { lit: '#3e3325', dark: '#261e14' }, roof: { lit: '#3d2a18', dark: '#22150a' }, glow: '#f0b04a', sign: { t: 'I', c: '#e0b060' }, bw: 46, bd: 46, bh: 38 },
}

function drawNode(g, n, sx, sy, t, hot) {
  const s = curState
  const dep = (n.depletedUntil ?? 0) > (s?.tick ?? 0)
  const hs = tileHash(n.x, n.y, 5)
  switch (n.type) {
    case 'tree': {
      if (dep) { // a stump and a scatter of chips: the world shows its work
        g.drawImage(sprite('stump' + (hs & 1), 64, 40, (gg, W2, H2, R) => {
          groundShadow(gg, W2 / 2 + 3, H2 - 5, 18, 8, .5)
          poly(gg, [[W2 / 2 - 8, H2 - 4], [W2 / 2 - 6, H2 - 15], [W2 / 2 + 6, H2 - 15], [W2 / 2 + 8, H2 - 4]], '#2c241a')
          gg.fillStyle = '#5a4830'; gg.beginPath(); gg.ellipse(W2 / 2, H2 - 15, 7, 3.2, 0, 0, 7); gg.fill()
          gg.strokeStyle = '#3a2e1e'; gg.lineWidth = 1
          for (let i = 1; i < 3; i++) { gg.beginPath(); gg.ellipse(W2 / 2, H2 - 15, i * 2.2, i * 1, 0, 0, 7); gg.stroke() }
        }), sx - 32, sy - 40 + 16)
        return
      }
      const b = biomeAtE4 ? biomeAtE4(n.x, n.y) : 'meadow'
      const style = b === 'wilds' ? 'dead' : (hs % 5 === 0 ? 'pine' : 'leafy')
      g.drawImage(sprite('tree' + style + (hs % 6), 120, 122, (gg, W2, H2, R) => paintTree(gg, W2, H2, R, style)),
        sx - 60, sy - 122 + 20)
      return
    }
    case 'rock': case 'magic-rock': {
      const style = n.type === 'magic-rock' ? 'magic' : (dep ? 'dark' : 'ore')
      g.drawImage(sprite('rock' + style + (hs % 5), 76, 56, (gg, W2, H2, R) => paintRock(gg, W2, H2, R, style)),
        sx - 38, sy - 56 + 18)
      if (n.type === 'magic-rock' && !dep) {           // the vein answers the tick
        const p = (Math.sin(t / 420 + hs) + 1) / 2
        g.save(); g.globalCompositeOperation = 'lighter'
        const gr = g.createRadialGradient(sx, sy - 16, 0, sx, sy - 16, 26)
        gr.addColorStop(0, 'rgba(120,200,255,' + (.16 + p * .2) + ')')
        gr.addColorStop(1, 'rgba(120,200,255,0)')
        g.fillStyle = gr; g.beginPath(); g.arc(sx, sy - 16, 26, 0, 7); g.fill(); g.restore()
      }
      return
    }
    case 'fishing-spot': {                              // painted flat, on the floor
      g.save()
      const p = (t / 900 + hs) % 1
      g.fillStyle = 'rgba(10,20,28,.62)'; diamond(g, sx - 32, sy - 16, 3); g.fill()
      g.strokeStyle = 'rgba(150,196,214,' + (.34 * (1 - p)) + ')'; g.lineWidth = 1.4
      g.beginPath(); g.ellipse(sx, sy, 6 + p * 20, (6 + p * 20) / 2, 0, 0, 7); g.stroke()
      const q = (p + .5) % 1
      g.strokeStyle = 'rgba(150,196,214,' + (.26 * (1 - q)) + ')'
      g.beginPath(); g.ellipse(sx, sy, 6 + q * 20, (6 + q * 20) / 2, 0, 0, 7); g.stroke()
      g.restore(); return
    }
    case 'campfire': case 'fire': case 'watchfire': {
      const size = n.type === 'watchfire' ? 1.9 : n.type === 'campfire' ? 1.1 : .9
      const dying = n.type === 'fire' && (n.expiresAt - (s?.tick ?? 0)) < 20
      const cold = n.type === 'watchfire' && (n.fuelUntil ?? 0) <= (s?.tick ?? 0)
      if (n.type !== 'watchfire' && indoors(n.x, n.y)) {
        // A HEARTH, NOT A CAMPFIRE.
        //
        // Four of this island's fires burn on a floor, inside walls, and a ring
        // of loose stones with logs balanced across it is not what is in
        // somebody's front room. A hearth is built INTO the back of the tile:
        // a chimney breast, a lintel, a swept stone floor, and a fire that sits
        // in the opening rather than in the middle of the rug.
        g.drawImage(sprite('hearthstone', 84, 90, (gg, W2, H2) => {
          const c2 = W2 / 2, b = H2 - 30
          // the breast, rising off the two back edges of the diamond
          const HH2 = 42
          poly(gg, [[c2 - 32, b], [c2, b - 16], [c2, b - 16 - HH2], [c2 - 32, b - HH2]], '#3d3730')
          poly(gg, [[c2, b - 16], [c2 + 32, b], [c2 + 32, b - HH2], [c2, b - 16 - HH2]], '#2a2622')
          poly(gg, [[c2 - 32, b - HH2], [c2, b - 16 - HH2], [c2 + 32, b - HH2],
                    [c2, b - HH2 + 16]], '#4a443b')
          gg.strokeStyle = 'rgba(0,0,0,.34)'; gg.lineWidth = 1
          for (let i = 1; i < 4; i++) {            // courses of stone
            gg.beginPath(); gg.moveTo(c2 - 32, b - HH2 * i / 4)
            gg.lineTo(c2, b - 16 - HH2 * i / 4); gg.lineTo(c2 + 32, b - HH2 * i / 4); gg.stroke()
          }
          // the opening, and a heavy lintel over it
          poly(gg, [[c2 - 17, b - 6], [c2, b - 14], [c2 + 17, b - 6],
                    [c2 + 17, b - 30], [c2, b - 38], [c2 - 17, b - 30]], '#080606')
          poly(gg, [[c2 - 19, b - 29], [c2, b - 38], [c2 + 19, b - 29],
                    [c2 + 19, b - 34], [c2, b - 43], [c2 - 19, b - 34]], '#564e42')
          gg.fillStyle = 'rgba(255,236,196,.14)'
          poly(gg, [[c2 - 19, b - 34], [c2, b - 43], [c2 + 19, b - 34],
                    [c2, b - 39.5]], 'rgba(255,236,196,.14)')
          // the swept stone in front of it
          gg.fillStyle = '#332e28'
          poly(gg, [[c2 - 22, b - 2], [c2, b + 9], [c2 + 22, b - 2], [c2, b - 12]], '#332e28')
          gg.fillStyle = '#1d1a16'
          poly(gg, [[c2 - 12, b - 2], [c2, b + 3], [c2 + 12, b - 2], [c2, b - 7]], '#1d1a16')
          gg.strokeStyle = '#241c12'; gg.lineWidth = 3       // one log, laid in
          gg.beginPath(); gg.moveTo(c2 - 8, b - 9); gg.lineTo(c2 + 8, b - 5); gg.stroke()
        }), sx - 42, sy - 90 + 30)
        if (!cold) {
          g.save(); g.globalCompositeOperation = 'lighter'
          drawFlame(g, sx, sy - 8, t / 1000, .78, hs % 100 / 100)
          g.restore()
        }
        return
      }
      g.drawImage(sprite('hearth' + n.type, 70, 44, (gg, W2, H2, R) => {
        groundShadow(gg, W2 / 2 + 2, H2 - 5, 20 * size, 9 * size, .5)
        for (let i = 0; i < 8; i++) {                  // a ring of stones
          const a = (i / 8) * 6.28
          gg.fillStyle = i % 2 ? '#3a352e' : '#2b2721'
          gg.beginPath(); gg.ellipse(W2 / 2 + Math.cos(a) * 15 * size, H2 - 6 + Math.sin(a) * 7 * size, 4.4, 3.2, 0, 0, 7); gg.fill()
          gg.fillStyle = 'rgba(255,240,214,.10)'
          gg.beginPath(); gg.ellipse(W2 / 2 + Math.cos(a) * 15 * size, H2 - 7.4 + Math.sin(a) * 7 * size, 2.6, 1.4, 0, 0, 7); gg.fill()
        }
        gg.strokeStyle = '#211a11'; gg.lineWidth = 3.4                  // the fuel
        for (let i = 0; i < 4; i++) { const a = i * 1.1
          gg.beginPath(); gg.moveTo(W2 / 2 - Math.cos(a) * 9, H2 - 7 - Math.sin(a) * 3)
          gg.lineTo(W2 / 2 + Math.cos(a) * 9, H2 - 12 + Math.sin(a) * 3); gg.stroke() }
      }), sx - 35, sy - 44 + 12)
      if (!cold) {
        g.save(); g.globalCompositeOperation = 'lighter'
        drawFlame(g, sx, sy - 10, t / 1000, size * (dying ? .55 : 1), hs % 100 / 100)
        g.restore()
      }
      return
    }
    case 'anvil':
      g.drawImage(sprite('anvil', 60, 46, (gg, W2, H2) => {
        const c2 = W2 / 2, b = H2 - 4
        groundShadow(gg, c2 + 3, b - 2, 18, 8, .55)
        poly(gg, [[c2 - 11, b], [c2 + 11, b], [c2 + 8, b - 9], [c2 - 8, b - 9]], '#241d16')
        poly(gg, [[c2 - 5, b - 9], [c2 + 5, b - 9], [c2 + 4, b - 17], [c2 - 4, b - 17]], '#3a3630')
        poly(gg, [[c2 - 15, b - 17], [c2 + 13, b - 17], [c2 + 11, b - 23], [c2 - 11, b - 23]], '#4c4740')
        poly(gg, [[c2 - 15, b - 17], [c2 - 24, b - 20], [c2 - 15, b - 23], [c2 - 11, b - 23]], '#3f3a34')
        gg.fillStyle = 'rgba(255,240,214,.20)'; gg.fillRect(c2 - 11, b - 23, 22, 2)
      }), sx - 30, sy - 46 + 14); return
    case 'bank': case 'store': {
      // A COUNTER, NOT A BUILDING.
      //
      // This drew a whole gabled house, and it was wrong twice over. The world
      // has already built the shop: the terrain under a store is `floor`, the
      // tile is ringed by `wall` nodes, a `keeper` stands beside it and
      // `landmark` furniture fills the room. Dropping a cottage on the counter
      // put a house inside a house. Worse, a bank is a COUNTER RUN -- up to
      // three adjacent bank tiles -- so the vault was three houses overlapping
      // in a row.
      //
      // So: a bench that fills its own diamond exactly, which means a run of
      // them abuts into one long counter with no seam and no thought.
      const isBank = n.type === 'bank'
      g.drawImage(sprite('counter' + n.type + (hs & 3), 84, 74, (gg, W2, H2, R) => {
        const c2 = W2 / 2, b = H2 - 22            // b is the tile centre
        const HGT = 15
