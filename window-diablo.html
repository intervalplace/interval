    }

    // ---- the sheep, which is a sheep, and stays a sheep -------------------
    case 'sheep': {
      groundShadow(g, cx + 3 * s, base - 1, 18 * s, 7 * s, .5)
      const bodyY = base - 14 * s - breathe * .4
      g.strokeStyle = h[2]; g.lineWidth = 3 * s; g.lineCap = 'round'
      for (const [lx, ph] of [[-7, 0], [-4, 2.1], [6, 1.05], [9, 3.1]]) {
        g.beginPath(); g.moveTo(cx + lx * s, bodyY + 3 * s)
        g.lineTo(cx + lx * s + (walk ? Math.sin(t * 7 + ph) * 2.6 * s : 0), base); g.stroke()
      }
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * 6.283
        g.fillStyle = i % 3 ? '#cfc8b4' : '#a8a08c'
        g.beginPath(); g.arc(cx + Math.cos(a) * 12 * s, bodyY + Math.sin(a) * 7 * s, 4.4 * s, 0, 7); g.fill()
      }
      g.fillStyle = '#ded8c6'
      g.beginPath(); g.ellipse(cx - 2 * s, bodyY - 2 * s, 10 * s, 5 * s, 0, 0, 7); g.fill()
      const hx8 = cx - 13 * s, hy8 = bodyY - 4 * s
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(hx8, hy8, 5 * s, 4 * s, -.2, 0, 7); g.fill()
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(hx8 - 3 * s, hy8 + 3 * s, 3.4 * s, 2.4 * s, 0, 0, 7); g.fill()
      g.fillStyle = h[2]
      g.beginPath(); g.ellipse(hx8 + 3 * s, hy8 - 3 * s, 3 * s, 2 * s, .4, 0, 7); g.fill()
      g.fillStyle = B.eye
      g.beginPath(); g.arc(hx8 - 2 * s, hy8 - 1 * s, 1.1 * s, 0, 7); g.fill()
      break
    }

    // ---- the wyrm: the one thing on this island that is simply larger
    case 'wyrm': {
      eliteAura(g, cx, base, 62 * s, '#ff6a1a', t)
      groundShadow(g, cx + 6 * s, base - 1, 34 * s, 13 * s, .7)
      const bodyY = base - 22 * s - breathe
      const flap = Math.sin(t * 1.9)
      // the far wing, behind everything
      wing(g, cx, bodyY, -1, flap, s, h, .72)
      // tail, sweeping
      let px2 = cx + 10 * s, py2 = bodyY + 4 * s
      for (let i = 1; i <= 5; i++) {
        const nx = cx + (10 + i * 8) * s
        const ny = bodyY + 6 * s + Math.sin(t * 1.5 - i * .5) * 4 * s + i * 1.6 * s
        limb(g, px2, py2, nx, ny, (8 - i) * s, (7 - i) * s, i % 2 ? h[0] : h[1])
        spike(g, nx, ny - (6 - i) * s, (9 - i) * s, -1.5, 1.8 * s, h[2])
        px2 = nx; py2 = ny
      }
      spike(g, px2, py2, 12 * s, .3, 4 * s, h[2])
      // legs, planted wide
      limb(g, cx - 8 * s, bodyY + 8 * s, cx - 15 * s, base, 7 * s, 4.4 * s, h[0])
      limb(g, cx + 6 * s, bodyY + 8 * s, cx + 12 * s, base, 7 * s, 4.4 * s, h[1])
      for (let i = 0; i < 3; i++) {
        spike(g, cx - 17 * s + i * 3 * s, base, 6 * s, 2.6 + i * .3, 1.6 * s, '#e0d4b8')
        spike(g, cx + 10 * s + i * 3 * s, base, 6 * s, .5 + i * .3, 1.6 * s, '#e0d4b8')
      }
      // barrel chest
      g.fillStyle = h[0]
      g.beginPath(); g.ellipse(cx, bodyY, 20 * s, 15 * s, -.06, 0, 7); g.fill()
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(cx - 3 * s, bodyY - 5 * s, 15 * s, 8 * s, -.1, 0, 7); g.fill()
      g.fillStyle = '#8a5a2a'                                                 // belly plates
      for (let i = 0; i < 5; i++) {
        g.beginPath(); g.ellipse(cx - 10 * s + i * 5 * s, bodyY + 10 * s, 3.4 * s, 2 * s, 0, 0, 7); g.fill()
      }
      for (let i = 0; i < 5; i++)                                             // dorsal ridge
        spike(g, cx - 12 * s + i * 6 * s, bodyY - 13 * s, 10 * s - Math.abs(i - 2) * 1.6 * s,
          -1.5 + (i - 2) * .12, 2.4 * s, h[2])
      // neck and skull
      const nx2 = cx - 20 * s, ny2 = bodyY - 22 * s - breathe
      limb(g, cx - 8 * s, bodyY - 6 * s, nx2, ny2, 8 * s, 5.4 * s, h[0])
      g.fillStyle = h[1]
      g.beginPath(); g.ellipse(nx2 - 5 * s, ny2, 10 * s, 6 * s, -.16, 0, 7); g.fill()
      poly(g, [[nx2 - 13 * s, ny2 + 1 * s], [nx2 - 18 * s, ny2 + 5 * s],
               [nx2 - 4 * s, ny2 + 6 * s], [nx2 - 2 * s, ny2 + 2 * s]], h[0])   // jaw
      g.fillStyle = '#e8dcc0'
      for (let i = 0; i < 4; i++)
        spike(g, nx2 - 14 * s + i * 3.4 * s, ny2 + 3 * s, 4 * s, 1.6, 1.1 * s, '#e8dcc0')
      spike(g, nx2 - 2 * s, ny2 - 5 * s, 15 * s, -1.1, 3 * s, h[2])           // horns
      spike(g, nx2 + 2 * s, ny2 - 4 * s, 13 * s, -.75, 2.6 * s, h[2])
      g.save(); g.globalCompositeOperation = 'lighter'                         // fire in the throat
      const fg = g.createRadialGradient(nx2 - 13 * s, ny2 + 3 * s, 0, nx2 - 13 * s, ny2 + 3 * s, 12 * s)
      fg.addColorStop(0, 'rgba(255,180,60,' + (.35 + Math.sin(t * 3) * .2) + ')')
      fg.addColorStop(1, 'rgba(255,120,20,0)')
      g.fillStyle = fg; g.beginPath(); g.arc(nx2 - 13 * s, ny2 + 3 * s, 12 * s, 0, 7); g.fill(); g.restore()
      emberEyes(g, nx2 - 6 * s, ny2 - 2 * s, 2 * s, B.eye, 4 * s, 18 * s)
      // the near wing, over the body
      wing(g, cx, bodyY, 1, flap, s, h, 1)
      break
    }
  }
}
// one wing, membraned between four fingers
function wing(g, cx, bodyY, side, flap, s, h, lit) {
  const sp = 42 * s, rise = 34 * s + flap * 14 * s
  const tip = [cx + side * sp, bodyY - rise]
  const elbow = [cx + side * 20 * s, bodyY - rise * .78]
  poly(g, [[cx, bodyY - 8 * s], elbow, tip,
           [cx + side * 34 * s, bodyY - 4 * s], [cx + side * 18 * s, bodyY + 2 * s]],
    lit > .9 ? h[1] : h[2])
  g.strokeStyle = h[2]; g.lineWidth = 2.4 * s
  g.beginPath(); g.moveTo(cx, bodyY - 8 * s); g.lineTo(elbow[0], elbow[1]); g.lineTo(tip[0], tip[1]); g.stroke()
  for (let i = 1; i <= 3; i++) {
    const fx = cx + side * (12 + i * 9) * s, fy = bodyY - 2 * s + i * 1.4 * s
    g.strokeStyle = h[2]; g.lineWidth = 1.8 * s
    g.beginPath(); g.moveTo(elbow[0], elbow[1]); g.lineTo(fx, fy); g.stroke()
  }
  spike(g, elbow[0], elbow[1], 8 * s, side > 0 ? -.6 : -2.5, 2 * s, h[2])
}
// a shield boss, which the knight needs and the panel's `boss` cannot reach
function boss3(g, bx, by, r) {
  const bg = g.createRadialGradient(bx - r * .4, by - r * .4, 0, bx, by, r)
  bg.addColorStop(0, '#b4ac98'); bg.addColorStop(1, '#4a4438')
  g.fillStyle = bg; g.beginPath(); g.arc(bx, by, r, 0, 7); g.fill()
}
// ---- the ember that every fire in the world actually is --------------------
// Drawn live and additively: the same routine paints a campfire, a firemaking
// fire, and a watchfire, differing only in how much of it there is.
function drawFlame(g, cx, base, t, size, seed) {
  const n = 5 + (size * 4 | 0)
  for (let i = 0; i < n; i++) {
    const p = (t * (1.6 + (i % 3) * .5) + i * .618 + seed) % 1
    const w = (5 + (i % 4) * 2.4) * size * (1 - p * .55)
    const x = cx + Math.sin((t * 2.6 + i * 1.7)) * 3.4 * size * p
    const y = base - p * 26 * size
    // Wider than it is tall at the base, and the pale core kept small: a
    // narrow column of near-white is a plasma jet, not a fire, and bloom
    // exaggerates whatever it is given.
    g.fillStyle = p < .18 ? 'rgba(255,226,150,' + (.7 - p) + ')'
      : p < .58 ? 'rgba(244,138,34,' + (.74 - p * .55) + ')'
      : 'rgba(158,46,12,' + (.46 - p * .38) + ')'
    g.beginPath(); g.ellipse(x, y, w * .70, w * .80, 0, 0, 7); g.fill()
  }
  for (let i = 0; i < 4; i++) {              // cinders leaving
    const p = (t * .55 + i * .27 + seed) % 1
    g.fillStyle = 'rgba(255,170,70,' + (.75 * (1 - p)) + ')'
    g.fillRect(cx + Math.sin(t * 1.6 + i * 2) * 12 * size * p, base - p * 60 * size, 1.6, 1.6)
  }
}

// ---------------------------------------------------------------------------
// THE PACK: one icon per noun
// ---------------------------------------------------------------------------
// 34 pixels square, because that is what a slot is. Weapons share a shape
// vocabulary with the things drawn in hands out in the world, so a bronze
// sword in the pack and a bronze sword in a fist are recognisably the same
// object, which is the entire job of an inventory icon.
function itemIcon(item) {
  return sprite('i:' + item, 34, 34, (g, W, H, R) => {
    const cx = W / 2, cy = H / 2
    const m = metalOf(item)
    const blade = (len, wide) => {
      poly(g, [[cx, cy - len], [cx + wide, cy - len + 5], [cx + wide * .6, cy + 7], [cx - wide * .6, cy + 7], [cx - wide, cy - len + 5]], m[0])
      poly(g, [[cx, cy - len], [cx + wide * .35, cy - len + 5], [cx, cy + 7], [cx - wide, cy - len + 5]], m[1])
      g.strokeStyle = m[2]; g.lineWidth = 3.4
      g.beginPath(); g.moveTo(cx - 7, cy + 8); g.lineTo(cx + 7, cy + 8); g.stroke()
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 3
      g.beginPath(); g.moveTo(cx, cy + 9); g.lineTo(cx, cy + 15); g.stroke()
      g.fillStyle = m[0]; g.beginPath(); g.arc(cx, cy + 16, 2.4, 0, 7); g.fill()
    }
    const haft = (top) => { g.strokeStyle = METAL.wood[0]; g.lineWidth = 3
      g.beginPath(); g.moveTo(cx + 6, cy + 14); g.lineTo(cx - 4, top); g.stroke() }

    if (/^(bronze|star)-(sword)$/.test(item)) { blade(13, 4.4); return }
    if (/^(bronze|star)-(dagger)$/.test(item)) { blade(8, 3.6); return }
    if (/^(bronze|star)-(spear)$/.test(item)) {
      haft(cy - 8)
      poly(g, [[cx - 4, cy - 6], [cx - 6, cy - 15], [cx, cy - 9]], m[1])
      poly(g, [[cx - 4, cy - 6], [cx - 6, cy - 15], [cx - 8, cy - 6]], m[0]); return }
    if (/^(bronze|star)-(maul)$/.test(item)) {
      haft(cy - 6)
      poly(g, [[cx - 12, cy - 12], [cx + 2, cy - 14], [cx + 3, cy - 5], [cx - 11, cy - 3]], m[0])
      poly(g, [[cx - 12, cy - 12], [cx + 2, cy - 14], [cx + 2, cy - 10], [cx - 12, cy - 8]], m[1]); return }
    if (/flail/.test(item) || item === 'old-chain') {
      g.strokeStyle = METAL.iron[0]; g.lineWidth = 2
      g.beginPath(); g.moveTo(cx + 7, cy + 13); g.lineTo(cx + 1, cy - 2); g.lineTo(cx - 6, cy - 9); g.stroke()
      g.fillStyle = m[0]; g.beginPath(); g.arc(cx - 8, cy - 10, 6, 0, 7); g.fill()
      g.fillStyle = m[1]; g.beginPath(); g.arc(cx - 10, cy - 12, 2.4, 0, 7); g.fill()
      for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28
        g.strokeStyle = m[2]; g.lineWidth = 1.8
        g.beginPath(); g.moveTo(cx - 8 + Math.cos(a) * 5, cy - 10 + Math.sin(a) * 5)
        g.lineTo(cx - 8 + Math.cos(a) * 9, cy - 10 + Math.sin(a) * 9); g.stroke() }
      return }
    if (item === 'bronze-hatchet') {
      haft(cy - 9)
      poly(g, [[cx - 4, cy - 11], [cx + 5, cy - 14], [cx + 7, cy - 4], [cx - 3, cy - 4]], m[0])
      poly(g, [[cx + 5, cy - 14], [cx + 7, cy - 4], [cx + 9, cy - 6], [cx + 8, cy - 13]], m[1]); return }
    if (item === 'bronze-pickaxe') {
      haft(cy - 9)
      g.strokeStyle = m[0]; g.lineWidth = 3.4
      g.beginPath(); g.moveTo(cx - 13, cy - 6); g.quadraticCurveTo(cx - 4, cy - 15, cx + 6, cy - 9); g.stroke()
      g.strokeStyle = m[1]; g.lineWidth = 1.2
      g.beginPath(); g.moveTo(cx - 12, cy - 7); g.quadraticCurveTo(cx - 4, cy - 14, cx + 5, cy - 9); g.stroke(); return }
    if (/helm/.test(item)) {
      g.fillStyle = m[0]; g.beginPath(); g.ellipse(cx, cy + 2, 10, 11, 0, Math.PI, 0); g.fill()
      g.fillRect(cx - 10, cy + 2, 20, 5)
      g.fillStyle = m[1]; g.beginPath(); g.ellipse(cx - 3, cy, 5, 6, 0, Math.PI, 0); g.fill()
      g.fillStyle = '#0a0808'; g.fillRect(cx - 7, cy + 3, 14, 3)
      if (item === 'star-helm') { g.strokeStyle = m[1]; g.lineWidth = 2
        g.beginPath(); g.moveTo(cx - 9, cy - 2); g.quadraticCurveTo(cx - 15, cy - 8, cx - 12, cy - 13); g.stroke()
        g.beginPath(); g.moveTo(cx + 9, cy - 2); g.quadraticCurveTo(cx + 15, cy - 8, cx + 12, cy - 13); g.stroke() }
      return }
    if (/plate/.test(item)) {
      poly(g, [[cx - 10, cy - 10], [cx + 10, cy - 10], [cx + 8, cy + 12], [cx - 8, cy + 12]], m[0])
      poly(g, [[cx - 10, cy - 10], [cx - 1, cy - 10], [cx - 1, cy + 12], [cx - 8, cy + 12]], m[1])
      g.strokeStyle = m[2]; g.lineWidth = 1.4
      for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(cx - 10, cy - 10 + i * 5.5); g.lineTo(cx + 10, cy - 10 + i * 5.5); g.stroke() }
      poly(g, [[cx - 13, cy - 11], [cx - 6, cy - 12], [cx - 6, cy - 5], [cx - 13, cy - 4]], m[0])
      poly(g, [[cx + 13, cy - 11], [cx + 6, cy - 12], [cx + 6, cy - 5], [cx + 13, cy - 4]], m[0]); return }
    if (/bow$/.test(item)) {
      g.strokeStyle = m[0]; g.lineWidth = 3
      g.beginPath(); g.arc(cx + 5, cy, 13, 2.1, 4.2); g.stroke()
      g.strokeStyle = m[1]; g.lineWidth = 1
      g.beginPath(); g.arc(cx + 5, cy, 13, 2.2, 4.1); g.stroke()
      g.strokeStyle = 'rgba(220,208,180,.7)'; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 1.6, cy - 11.4); g.lineTo(cx - 1.6, cy + 11.4); g.stroke()
      if (item === 'sigil-bow') { g.fillStyle = 'rgba(140,224,255,.8)'
        g.beginPath(); g.arc(cx + 5, cy, 3, 0, 7); g.fill() }
      return }
    if (item === 'crossbow') {
      g.strokeStyle = METAL.wood[0]; g.lineWidth = 3.4
      g.beginPath(); g.moveTo(cx - 9, cy + 9); g.lineTo(cx + 8, cy - 6); g.stroke()
      g.strokeStyle = METAL.iron[0]; g.lineWidth = 2.6
      g.beginPath(); g.arc(cx + 6, cy - 4, 10, -.4, 2.2); g.stroke()
      g.strokeStyle = 'rgba(220,208,180,.6)'; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 3, cy - 10); g.lineTo(cx + 12, cy + 3); g.stroke(); return }
    if (item === 'arrows') {
      for (let i = 0; i < 3; i++) {
        const ox = cx - 7 + i * 7
        g.strokeStyle = METAL.wood[0]; g.lineWidth = 1.6
        g.beginPath(); g.moveTo(ox, cy + 13); g.lineTo(ox + 2, cy - 9); g.stroke()
        poly(g, [[ox + 2, cy - 13], [ox + 4.4, cy - 7], [ox - .4, cy - 7]], '#b9c0c8')
        g.strokeStyle = '#c8bfa4'; g.lineWidth = 1
        g.beginPath(); g.moveTo(ox, cy + 12); g.lineTo(ox - 3, cy + 7); g.stroke()
        g.beginPath(); g.moveTo(ox, cy + 12); g.lineTo(ox + 3, cy + 7); g.stroke()
      } return }
    if (item === 'logs' || item === 'heartwood') {
      const c0 = item === 'heartwood' ? ['#5a2f18', '#8a4a24', '#2e160a'] : ['#4a3a22', '#6e5836', '#241a0e']
      for (const [ox, oy] of [[-6, 4], [5, 4], [0, -5]]) {
        g.fillStyle = c0[0]
        g.beginPath(); g.ellipse(cx + ox, cy + oy, 8, 5, 0, 0, 7); g.fill()
        g.fillStyle = c0[1]
        g.beginPath(); g.ellipse(cx + ox - 1, cy + oy - 1, 5.4, 3.2, 0, 0, 7); g.fill()
        g.strokeStyle = c0[2]; g.lineWidth = 1
        g.beginPath(); g.ellipse(cx + ox - 1, cy + oy - 1, 3, 1.8, 0, 0, 7); g.stroke()
      } return }
    if (item === 'ore') {
      for (const [ox, oy, r] of [[-5, 4, 7], [5, 3, 6], [1, -6, 6]]) {
        g.fillStyle = '#463f38'; g.beginPath(); g.arc(cx + ox, cy + oy, r, 0, 7); g.fill()
        g.fillStyle = '#5e564c'; g.beginPath(); g.arc(cx + ox - 1.4, cy + oy - 1.8, r * .58, 0, 7); g.fill()
        g.fillStyle = '#a5762e'; g.beginPath(); g.arc(cx + ox + 1.6, cy + oy + 1, 1.6, 0, 7); g.fill()
      } return }
    if (item === 'magic-stone' || item === 'sigil' || item === 'glass-stone') {
      poly(g, [[cx, cy - 12], [cx + 9, cy - 2], [cx + 5, cy + 11], [cx - 5, cy + 11], [cx - 9, cy - 2]], '#2b3a54')
      poly(g, [[cx, cy - 12], [cx + 9, cy - 2], [cx, cy + 2], [cx - 9, cy - 2]], '#4e6f9e')
      poly(g, [[cx, cy - 12], [cx, cy + 2], [cx - 9, cy - 2]], '#7fb4e0')
      g.fillStyle = 'rgba(190,236,255,.75)'; g.fillRect(cx - 4, cy - 8, 2.4, 5); return }
    if (item === 'bones') {
      g.strokeStyle = '#cfc6ab'; g.lineWidth = 4.6; g.lineCap = 'round'
      g.beginPath(); g.moveTo(cx - 8, cy + 7); g.lineTo(cx + 8, cy - 7); g.stroke()
      g.strokeStyle = '#9e957c'; g.lineWidth = 1.6
      g.beginPath(); g.moveTo(cx - 8, cy + 7); g.lineTo(cx + 8, cy - 7); g.stroke()
      g.fillStyle = '#e0d8bd'
      for (const [ox, oy] of [[-10, 5], [-6, 9], [10, -5], [6, -9]])
        { g.beginPath(); g.arc(cx + ox, cy + oy, 3.2, 0, 7); g.fill() }
      return }
    if (/fish/.test(item)) {
      const cooked = item.startsWith('cooked'), burnt = item.startsWith('burnt')
      const c0 = burnt ? ['#2a2320', '#3d3430'] : cooked ? ['#a06a34', '#c98a4a'] : ['#31506b', '#4a6f8c']
      g.fillStyle = c0[0]; g.beginPath(); g.ellipse(cx - 1, cy, 11, 6.4, 0, 0, 7); g.fill()
      g.fillStyle = c0[1]; g.beginPath(); g.ellipse(cx - 2, cy - 1.6, 8.4, 3.4, 0, 0, 7); g.fill()
      poly(g, [[cx + 9, cy], [cx + 15, cy - 6], [cx + 15, cy + 6]], c0[0])
      poly(g, [[cx - 3, cy - 6], [cx + 3, cy - 6], [cx, cy - 11]], c0[1])
      g.fillStyle = burnt ? '#151210' : '#e8f0f4'
      g.beginPath(); g.arc(cx - 7, cy - 1, 1.7, 0, 7); g.fill(); return }
    if (item === 'ale' || item === 'broth') {
      const liq = item === 'ale' ? '#a5691e' : '#7c8a3a'
      poly(g, [[cx - 7, cy - 9], [cx + 7, cy - 9], [cx + 6, cy + 12], [cx - 6, cy + 12]], '#2b2620')
      poly(g, [[cx - 5.4, cy - 5], [cx + 5.4, cy - 5], [cx + 4.6, cy + 10], [cx - 4.6, cy + 10]], liq)
      g.fillStyle = 'rgba(255,246,220,.65)'; g.fillRect(cx - 4.4, cy - 4, 2, 12)
      g.fillStyle = '#e6dcc0'
      g.beginPath(); g.ellipse(cx, cy - 6, 6, 2.4, 0, 0, 7); g.fill()
      g.strokeStyle = '#2b2620'; g.lineWidth = 2.2
      g.beginPath(); g.arc(cx + 9, cy + 1, 4.4, -1.2, 1.2); g.stroke(); return }
    if (item === 'seeds' || item === 'grain') {
      poly(g, [[cx - 8, cy - 2], [cx + 8, cy - 2], [cx + 6, cy + 12], [cx - 6, cy + 12]], '#5a4a30')
      poly(g, [[cx - 8, cy - 2], [cx - 1, cy - 2], [cx - 1, cy + 12], [cx - 6, cy + 12]], '#78633f')
      for (let i = 0; i < 11; i++) {
        g.fillStyle = item === 'grain' ? '#c9a552' : '#8a9a48'
        g.beginPath(); g.ellipse(cx - 7 + R() * 14, cy - 4 + R() * 5, 2.2, 1.4, R() * 3, 0, 7); g.fill()
      } return }
    if (item === 'wool') {
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * 6.28
        g.fillStyle = i % 2 ? '#cfc8b4' : '#a8a08c'
        g.beginPath(); g.arc(cx + Math.cos(a) * 7, cy + Math.sin(a) * 6, 5, 0, 7); g.fill()
      }
      g.fillStyle = '#e0dac8'; g.beginPath(); g.arc(cx - 2, cy - 2, 5, 0, 7); g.fill(); return }
    if (item === 'gold-coin') {
      g.fillStyle = '#8a6415'; g.beginPath(); g.arc(cx, cy + 2, 11, 0, 7); g.fill()
      g.fillStyle = '#e8b53a'; g.beginPath(); g.arc(cx, cy, 11, 0, 7); g.fill()
      g.strokeStyle = '#a5801f'; g.lineWidth = 1.6
      g.beginPath(); g.arc(cx, cy, 7.6, 0, 7); g.stroke()
      g.fillStyle = 'rgba(255,246,214,.5)'; g.fillRect(cx - 5, cy - 7, 6, 2.2); return }
    if (item === 'crab-shell') {
      g.fillStyle = '#7c5238'; g.beginPath(); g.ellipse(cx, cy + 1, 12, 8, 0, Math.PI, 0); g.fill()
      g.fillStyle = '#a06a44'; g.beginPath(); g.ellipse(cx - 3, cy - 1, 7, 4.4, 0, Math.PI, 0); g.fill()
      g.strokeStyle = '#4a2e1e'; g.lineWidth = 1.2
      for (let i = 0; i < 4; i++) { g.beginPath()
        g.moveTo(cx - 9 + i * 6, cy + 1); g.lineTo(cx - 7 + i * 6, cy - 7); g.stroke() }
      return }
    if (typeof item === 'string' && item.startsWith('chart:')) {
      poly(g, [[cx - 11, cy - 9], [cx + 11, cy - 11], [cx + 10, cy + 11], [cx - 10, cy + 9]], '#b9a87e')
      poly(g, [[cx - 11, cy - 9], [cx + 11, cy - 11], [cx + 10, cy - 6], [cx - 10, cy - 4]], '#d4c69c')
      g.strokeStyle = '#6a5836'; g.lineWidth = 1
      g.beginPath(); g.moveTo(cx - 7, cy + 5); g.quadraticCurveTo(cx, cy - 4, cx + 7, cy + 2); g.stroke()
      g.fillStyle = '#8a2a1e'; g.beginPath(); g.arc(cx + 4, cy + 4, 2, 0, 7); g.fill(); return }
    // an unknown noun still deserves a shape rather than a blank
    poly(g, [[cx - 9, cy - 9], [cx + 9, cy - 9], [cx + 9, cy + 9], [cx - 9, cy + 9]], '#3a332a')
    g.fillStyle = '#6e6250'; g.font = '700 13px Cinzel, Georgia, serif'
    g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillText(String(item)[0].toUpperCase(), cx, cy + 1)
  })
}

// THE SIXTEEN MARKS
// ---------------------------------------------------------------------------
// Not ported from the reference window. Those are coloured pixel art tuned to
// sit on parchment in a bright top-down view; dropped in here they would read
// as stickers laid on the furniture. These are ENGRAVED: one silhouette, no
// interior detail, cut into the stone with a dark bevel under it and a gold
// gradient over, the same way the panel's rivets and filigree are cut. They
// have to survive at ten pixels, so every one is a shape and nothing else.
//
// Each painter draws paths ONLY -- it never sets a colour. The caller sets the
// style and runs it twice, once for the cut and once for the metal, which is
// what makes it look struck rather than drawn.

    g.moveTo(S * .46, S * .30); g.lineTo(S * .62, S * .06)

    g.lineTo(S * .58, S * .34); g.closePath(); g.fill()

  hitpoints: (g, S) => {                         // a heart

  },
  exploration: (g, S) => {                       // a compass rose
    g.beginPath()

      const a = (i / 4) * 6.283 - 1.5708

// struck once, then blitted: sixteen glyphs at three sizes is forty-eight
// little canvases for the life of the page
function skillGlyph(skill, S, tone) {
  return sprite('gly:' + skill + ':' + S + ':' + (tone ?? 'gold'), S + 2, S + 2, (g) => {
    const paint = GLYPH[skill]; if (!paint) return
    // the cut: the shape pressed a pixel down and to the right, in shadow
    g.save(); g.translate(1.2, 1.4)
    g.fillStyle = 'rgba(0,0,0,.75)'
    paint(g, S); g.restore()
    // and the metal standing in it
    const grd = g.createLinearGradient(0, 0, 0, S)
    if (tone === 'dim') { grd.addColorStop(0, '#8f8267'); grd.addColorStop(1, '#5d5342') }
    else if (tone === 'bright') { grd.addColorStop(0, '#fdf3d2'); grd.addColorStop(.55, '#f0d089'); grd.addColorStop(1, '#a8802e') }
    else { grd.addColorStop(0, '#f2dda2'); grd.addColorStop(.5, '#c39a44'); grd.addColorStop(1, '#7a5a1e') }
    g.fillStyle = grd
    paint(g, S)
    // one highlight along the top of the shape, which is what sells the relief
    g.save()
    g.globalCompositeOperation = 'source-atop'
    const hi = g.createLinearGradient(0, 0, 0, S * .45)
    hi.addColorStop(0, 'rgba(255,250,230,.55)'); hi.addColorStop(1, 'rgba(255,250,230,0)')
    g.fillStyle = hi; g.fillRect(0, 0, S + 2, S * .45)
    g.restore()
  })
}
// ===========================================================================
// THE FORTY PLACES
// ---------------------------------------------------------------------------
// A landmark answers to no verb in this constitution. It cannot be gathered,
// fought, lit, read or consumed; it blocks its tile and it is otherwise inert.
// Which means the only thing it has to do is BE SOMEWHERE, and the only way it
// can fail is by being indistinguishable from something else.
//
// This used to be six painters covering thirty-eight nouns, so a bed, a table,
// a barrel, a cart and a scarecrow were all the same little crate -- and `web`,
// of which this island has thirty, had no entry at all and came out as a
// standing stone. Forty nouns, forty painters. The map tells the truth or it
// is a lie on every chart.
//
// Each painter is handed a context, the sprite size, a seeded generator, and
// (cx, base) where base is the CENTRE OF THE TILE. Everything is drawn upward
// from there.
// ===========================================================================

const LM_SIZE = {           // how much canvas each noun needs above its tile
  'old-oak': 168, 'elder-tree': 168, 'burnt-tree': 140,
  'broken-tower': 150, 'mill': 160, 'sentinel': 130, 'standing-stone': 110,
  'siege-engine': 120, 'gibbet': 120, 'shipwreck': 110, 'drowned-bell': 130,
  'scarecrow': 118, 'web': 118, 'cave-mouth': 110, 'eel-rack': 110,
  'shelf': 110, 'haystack': 106, 'cart': 100, 'barricade': 100,
}
const lmHeight = (kind) => LM_SIZE[kind] ?? 88

// shared vocabulary ---------------------------------------------------------
const WOOD = ['#4a3a22', '#67512f', '#291e10']
const OLDWOOD = ['#3d3527', '#564b38', '#221c14']
const ROCK = ['#3a352e', '#4e473d', '#231f1b']
const BONE = ['#b0a890', '#e0d9c0', '#5a5344']
const STRAW = ['#6a5a2e', '#8f7a3c', '#3e3418']
function plank(g, x, y, w, h, c, lit) {
  poly(g, [[x, y], [x + w, y - w * .5], [x + w, y - w * .5 - h], [x, y - h]], c)
  if (lit) { g.fillStyle = 'rgba(255,236,196,.12)'; g.fillRect(x, y - h, w * .4, 2) }
}
// an iso box: three faces, lit top-left
function isoBox(g, cx, base, hw, hd, h, c) {
  poly(g, [[cx - hw, base - hw * .5], [cx, base], [cx, base - h], [cx - hw, base - hw * .5 - h]], c[0])
  poly(g, [[cx, base], [cx + hd, base - hd * .5], [cx + hd, base - hd * .5 - h], [cx, base - h]], c[2])
  poly(g, [[cx - hw, base - hw * .5 - h], [cx, base - h], [cx + hd, base - hd * .5 - h],
           [cx + hd - hw, base - hw * .5 - hd * .5 - h]], c[1])
}
function stoneSlab(g, cx, base, w, h, lean) {
  const l = lean ?? 0
  poly(g, [[cx - w, base], [cx + w, base], [cx + w * .8 + l, base - h], [cx - w * .85 + l, base - h]], ROCK[0])
  poly(g, [[cx - w, base], [cx - w * .2, base], [cx - w * .2 + l, base - h], [cx - w * .85 + l, base - h]], ROCK[1])
  g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(cx - w * .9 + l * i / 4, base - h * i / 4)
    g.lineTo(cx + w * .9 + l * i / 4, base - h * i / 4 + 2); g.stroke()
  }
}

const LM_ART = {
  // ---- things in a room --------------------------------------------------
  table: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 2, 24, 10, .5)
    for (const [ox, oy] of [[-18, -1], [4, 10], [16, -6], [-6, 5]]) {
      g.strokeStyle = WOOD[2]; g.lineWidth = 3
      g.beginPath(); g.moveTo(cx + ox, b + oy); g.lineTo(cx + ox, b + oy - 14); g.stroke()
    }
    poly(g, [[cx - 24, b - 14], [cx, b - 26], [cx + 24, b - 14], [cx, b - 2]], WOOD[1])
    poly(g, [[cx - 24, b - 14], [cx, b - 2], [cx + 24, b - 14], [cx + 24, b - 11], [cx, b + 1], [cx - 24, b - 11]], WOOD[2])
    g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(cx - 24 + i * 12, b - 14 + i * 6); g.lineTo(cx + i * 12, b - 2 + i * 6 - 12); g.stroke() }
    g.fillStyle = '#5a4a34'; g.beginPath(); g.ellipse(cx - 5, b - 17, 4, 2.2, 0, 0, 7); g.fill()
    g.fillStyle = '#7a6848'; g.fillRect(cx - 6.5, b - 22, 3, 5)
  },
  bed: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 2, 26, 11, .5)
    isoBox(g, cx, b + 4, 22, 14, 8, OLDWOOD)
    poly(g, [[cx - 22, b - 15], [cx, b - 26], [cx + 14, b - 19], [cx - 8, b - 8]], '#5e4a3c')  // mattress
    poly(g, [[cx - 22, b - 15], [cx - 4, b - 24], [cx + 6, b - 19], [cx - 12, b - 10]], '#7a2a24') // blanket
    g.fillStyle = '#c8bfa8'                                                                    // pillow
    g.beginPath(); g.ellipse(cx + 6, b - 22, 8, 4.4, -.45, 0, 7); g.fill()
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 3                                                // headboard
    g.beginPath(); g.moveTo(cx + 16, b - 15); g.lineTo(cx + 16, b - 34); g.stroke()
    g.beginPath(); g.moveTo(cx + 4, b - 9); g.lineTo(cx + 4, b - 26); g.stroke()
    poly(g, [[cx + 4, b - 26], [cx + 16, b - 34], [cx + 16, b - 30], [cx + 4, b - 22]], OLDWOOD[1])
  },
  shelf: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 18, 8, .5)
    isoBox(g, cx, b, 15, 10, 52, OLDWOOD)
    for (let i = 0; i < 3; i++) {
      const y = b - 14 - i * 15
      poly(g, [[cx - 15, y - 7.5], [cx, y], [cx + 10, y - 5], [cx - 5, y - 12.5]], OLDWOOD[1])
      g.fillStyle = 'rgba(0,0,0,.45)'
      poly(g, [[cx - 14, y - 8], [cx - 1, y - 1], [cx - 1, y + 3], [cx - 14, y - 4]], 'rgba(0,0,0,.45)')
      for (let q = 0; q < 3; q++) {                       // what is on it
        const px2 = cx - 11 + q * 7, py2 = y - 9 + q * 3
        g.fillStyle = q % 2 ? '#5a4a34' : '#43506a'
        g.fillRect(px2, py2 - 7, 4, 7)
        g.fillStyle = 'rgba(255,236,196,.14)'; g.fillRect(px2, py2 - 7, 1.4, 7)
      }
    }
  },
  barrel: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 15, 7, .55)
    const h = 30
    poly(g, [[cx - 11, b - 3], [cx - 13, b - h + 6], [cx - 11, b - h], [cx + 11, b - h],
             [cx + 13, b - h + 6], [cx + 11, b - 3]], WOOD[0])
    poly(g, [[cx - 11, b - 3], [cx - 13, b - h + 6], [cx - 11, b - h], [cx - 3, b - h], [cx - 3, b - 3]], WOOD[1])
    g.strokeStyle = '#2a2620'; g.lineWidth = 2.4
    for (const y of [b - 8, b - h + 6]) { g.beginPath(); g.moveTo(cx - 12.6, y); g.lineTo(cx + 12.6, y); g.stroke() }
    g.strokeStyle = WOOD[2]; g.lineWidth = 1
    for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(cx + i * 5, b - 3); g.lineTo(cx + i * 5, b - h); g.stroke() }
    g.fillStyle = WOOD[1]; g.beginPath(); g.ellipse(cx, b - h, 11, 5, 0, 0, 7); g.fill()
    g.fillStyle = WOOD[2]; g.beginPath(); g.ellipse(cx, b - h, 7, 3.2, 0, 0, 7); g.fill()
  },
  crate: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 16, 7, .55)
    isoBox(g, cx, b, 14, 14, 22, WOOD)
    g.strokeStyle = WOOD[2]; g.lineWidth = 1.6
    g.beginPath(); g.moveTo(cx - 14, b - 7 - 22); g.lineTo(cx, b - 22 + 11); g.stroke()
    g.beginPath(); g.moveTo(cx - 14, b - 7); g.lineTo(cx, b - 22); g.stroke()
    g.beginPath(); g.moveTo(cx, b); g.lineTo(cx + 14, b - 7 - 22); g.stroke()
  },
  stump: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 18, 8, .5)
    poly(g, [[cx - 10, b], [cx - 8, b - 15], [cx + 8, b - 15], [cx + 10, b]], WOOD[0])
    poly(g, [[cx - 10, b], [cx - 3, b], [cx - 3, b - 15], [cx - 8, b - 15]], WOOD[1])
    g.fillStyle = '#6b5836'; g.beginPath(); g.ellipse(cx, b - 15, 8.4, 4, 0, 0, 7); g.fill()
    g.strokeStyle = '#4a3c22'; g.lineWidth = 1
    for (let i = 1; i < 4; i++) { g.beginPath(); g.ellipse(cx, b - 15, i * 2.4, i * 1.1, 0, 0, 7); g.stroke() }
    for (let i = 0; i < 4; i++) {                          // roots breaking the outline
      const a = R() * 6.28
      g.strokeStyle = WOOD[2]; g.lineWidth = 2.6
      g.beginPath(); g.moveTo(cx + Math.cos(a) * 7, b - 2)
      g.lineTo(cx + Math.cos(a) * 16, b + Math.sin(a) * 4); g.stroke()
    }
  },
  'crude-hearth': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b, 18, 8, .45)
    g.fillStyle = '#241d18'; g.beginPath(); g.ellipse(cx, b - 2, 13, 6.4, 0, 0, 7); g.fill()
    g.fillStyle = '#4a4038'; g.beginPath(); g.ellipse(cx, b - 3, 8, 3.6, 0, 0, 7); g.fill()
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * 6.28
      g.fillStyle = i % 2 ? ROCK[0] : ROCK[1]
      g.beginPath(); g.ellipse(cx + Math.cos(a) * 14, b - 2 + Math.sin(a) * 7, 4.4, 3.2, a, 0, 7); g.fill()
    }
    g.strokeStyle = '#1a1512'; g.lineWidth = 2.4                       // spent fuel
    g.beginPath(); g.moveTo(cx - 6, b - 4); g.lineTo(cx + 5, b - 1); g.stroke()
  },
  skep: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 15, 7, .5)
    for (let i = 0; i < 6; i++) {                          // coiled straw, narrowing
      const y = b - i * 5, w = 15 - i * 2.2
      g.fillStyle = i % 2 ? STRAW[1] : STRAW[0]
      g.beginPath(); g.ellipse(cx, y, w, w * .45, 0, 0, 7); g.fill()
      g.strokeStyle = STRAW[2]; g.lineWidth = .8
      g.beginPath(); g.ellipse(cx, y, w, w * .45, 0, 0, 7); g.stroke()
    }
    g.fillStyle = '#1a1510'; g.beginPath(); g.ellipse(cx - 2, b - 3, 3.4, 2.2, 0, 0, 7); g.fill()
    for (let i = 0; i < 4; i++) {                          // bees
      g.fillStyle = '#d8b03a'
      g.fillRect(cx + (R() - .5) * 34, b - 12 - R() * 22, 1.6, 1.2)
    }
  },
  hurdle: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 24, 8, .4)
    for (let i = 0; i < 4; i++) {                          // uprights
      const px2 = cx - 24 + i * 16
      g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.6
      g.beginPath(); g.moveTo(px2, b - (px2 - cx) * .5); g.lineTo(px2, b - 24 - (px2 - cx) * .5); g.stroke()
    }
    for (let i = 0; i < 5; i++) {                          // wattle woven through
      const y = b - 4 - i * 4.4
      g.strokeStyle = i % 2 ? OLDWOOD[1] : OLDWOOD[0]; g.lineWidth = 2
      g.beginPath()
      for (let q = 0; q <= 6; q++) {
        const px2 = cx - 26 + q * 9
        const py2 = y - (px2 - cx) * .5 + (q % 2 ? -1.6 : 1.6)
        q === 0 ? g.moveTo(px2, py2) : g.lineTo(px2, py2)
      }
      g.stroke()
    }
  },
  'eel-rack': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 22, 9, .45)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 3
    for (const s2 of [-1, 1]) {
      g.beginPath(); g.moveTo(cx + s2 * 20, b - s2 * 10); g.lineTo(cx + s2 * 6, b - 44); g.stroke()
    }
    g.beginPath(); g.moveTo(cx - 6, b - 44); g.lineTo(cx + 6, b - 44); g.stroke()
    for (let i = 0; i < 6; i++) {                          // the catch, hung to dry
      const px2 = cx - 8 + i * 3.4, ln = 16 + (i % 3) * 6
      g.strokeStyle = '#4a5a52'; g.lineWidth = 2.4
      g.beginPath(); g.moveTo(px2, b - 42)
      g.quadraticCurveTo(px2 + 3, b - 42 + ln * .6, px2 - 1, b - 42 + ln); g.stroke()
      g.fillStyle = '#5e7068'
      g.beginPath(); g.arc(px2, b - 42, 1.8, 0, 7); g.fill()
    }
  },

  // ---- stone -------------------------------------------------------------
  'standing-stone': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 20, 9, .6)
    stoneSlab(g, cx, b, 12, 56, 3)
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.4                // carved marks
    for (let i = 0; i < 4; i++) {
      const y = b - 14 - i * 11
      g.beginPath(); g.moveTo(cx - 5, y); g.lineTo(cx + 4, y - 4); g.stroke()
    }
  },
  cairn: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 20, 9, .55)
    for (let i = 0; i < 6; i++) {
      const w = 14 - i * 1.9, y = b - i * 8
      g.fillStyle = i % 2 ? ROCK[0] : ROCK[1]
      g.beginPath(); g.ellipse(cx + (R() - .5) * 4, y, w, w * .52, 0, 0, 7); g.fill()
      g.fillStyle = 'rgba(255,240,214,.10)'
      g.beginPath(); g.ellipse(cx - 2, y - 2, w * .5, w * .22, 0, 0, 7); g.fill()
    }
  },
  'boundary-stone': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 12, 6, .5)
    stoneSlab(g, cx, b, 7, 20, 0)
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(cx - 3, b - 14, 6, 1.8); g.fillRect(cx - 2, b - 10, 4, 1.8)
  },
  milestone: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 13, 6, .5)
    poly(g, [[cx - 8, b], [cx + 8, b], [cx + 7, b - 22], [cx - 7, b - 22]], ROCK[0])
    poly(g, [[cx - 8, b], [cx - 1, b], [cx - 1, b - 22], [cx - 7, b - 22]], ROCK[1])
    g.fillStyle = ROCK[1]; g.beginPath(); g.ellipse(cx, b - 22, 7.4, 3.4, 0, Math.PI, 0); g.fill()
    g.fillStyle = 'rgba(0,0,0,.5)'
    g.fillRect(cx - 4, b - 17, 8, 1.6); g.fillRect(cx - 3, b - 13, 6, 1.6); g.fillRect(cx - 4, b - 9, 8, 1.6)
  },
  sentinel: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 5, b + 1, 22, 10, .62)
    stoneSlab(g, cx, b, 10, 84, -5)
    g.fillStyle = 'rgba(0,0,0,.55)'                                     // a face, almost
    g.beginPath(); g.ellipse(cx - 5, b - 66, 2.4, 3.4, 0, 0, 7); g.fill()
    g.beginPath(); g.ellipse(cx + 1, b - 68, 2.4, 3.4, 0, 0, 7); g.fill()
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.6
    g.beginPath(); g.moveTo(cx - 6, b - 56); g.lineTo(cx + 3, b - 58); g.stroke()
  },
  'glass-stone': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 16, 8, .5)
    poly(g, [[cx - 10, b], [cx + 10, b], [cx + 6, b - 40], [cx - 4, b - 46], [cx - 9, b - 30]], '#1e3040')
    poly(g, [[cx - 10, b], [cx - 1, b], [cx - 2, b - 38], [cx - 4, b - 46], [cx - 9, b - 30]], '#35576e')
    g.save(); g.globalCompositeOperation = 'lighter'
    g.fillStyle = 'rgba(130,210,235,.28)'
    poly(g, [[cx - 4, b - 46], [cx + 6, b - 40], [cx + 2, b - 20], [cx - 3, b - 24]], 'rgba(130,210,235,.28)')
    g.restore()
    g.fillStyle = 'rgba(220,250,255,.6)'; g.fillRect(cx - 5, b - 40, 2, 16)
  },
  'cut-face': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 26, 10, .55)
    for (let i = 0; i < 4; i++) {                          // a worked quarry step
      const y = b - i * 11, w = 26 - i * 3
      poly(g, [[cx - w, y - w * .5], [cx, y], [cx + w, y - w * .5], [cx, y - w], ], i % 2 ? ROCK[1] : ROCK[0])
      poly(g, [[cx - w, y - w * .5], [cx, y], [cx, y - 11], [cx - w, y - w * .5 - 11]], ROCK[2])
    }
    g.strokeStyle = 'rgba(255,240,214,.14)'; g.lineWidth = 1.4
    g.beginPath(); g.moveTo(cx - 16, b - 41); g.lineTo(cx, b - 33); g.stroke()
  },

  // ---- ruin --------------------------------------------------------------
  'broken-tower': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 6, b + 2, 30, 13, .6)
    const h = 96
    poly(g, [[cx - 20, b - 8], [cx, b + 3], [cx, b - h + 14], [cx - 20, b - h]], ROCK[0])
    poly(g, [[cx, b + 3], [cx + 20, b - 8], [cx + 20, b - h + 26], [cx, b - h + 14]], ROCK[2])
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1
    for (let i = 1; i < 9; i++) {
      const y = b - (h - 10) * i / 9
      g.beginPath(); g.moveTo(cx - 20, y - 8); g.lineTo(cx, y + 2); g.lineTo(cx + 20, y - 8); g.stroke()
    }
    for (let i = 0; i < 6; i++) {                          // the broken crown
      g.fillStyle = '#0b0908'
      g.fillRect(cx - 20 + i * 7, b - h + (i % 2 ? 0 : 9), 8, 12)
    }
    poly(g, [[cx - 7, b - 22], [cx + 1, b - 18], [cx + 1, b - 2], [cx - 7, b - 6]], '#080606')  // doorway
  },
  'sunken-wall': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 9, .45)
    for (let i = 0; i < 4; i++) {
      const px2 = cx - 22 + i * 15, hgt = 8 + (i % 2) * 7 + R() * 5
      isoBox(g, px2, b - (px2 - cx) * .5, 7, 7, hgt, ROCK)
    }
    g.fillStyle = 'rgba(40,50,44,.5)'                       // the ground taking it back
    g.beginPath(); g.ellipse(cx, b + 2, 26, 11, 0, 0, 7); g.fill()
  },
  'drowned-bell': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 2, 24, 11, .5)
    g.fillStyle = 'rgba(20,42,54,.65)'                      // the water it stands in
    g.beginPath(); g.ellipse(cx, b + 3, 30, 13, 0, 0, 7); g.fill()
    poly(g, [[cx - 15, b - 6], [cx, b + 2], [cx, b - 62], [cx - 15, b - 68]], ROCK[0])
    poly(g, [[cx, b + 2], [cx + 15, b - 6], [cx + 15, b - 68], [cx, b - 62]], ROCK[2])
    poly(g, [[cx - 15, b - 68], [cx, b - 62], [cx + 15, b - 68], [cx, b - 74]], ROCK[1])
    poly(g, [[cx - 9, b - 30], [cx - 1, b - 26], [cx - 1, b - 46], [cx - 9, b - 50]], '#080a0c')  // the opening
    g.fillStyle = '#6a5a2a'                                 // and the bell inside it
    g.beginPath(); g.moveTo(cx - 8, b - 34); g.quadraticCurveTo(cx - 5, b - 46, cx - 1, b - 44)
    g.lineTo(cx - 1, b - 32); g.closePath(); g.fill()
    g.fillStyle = '#8f7a3c'; g.fillRect(cx - 8, b - 34, 7, 2)
    for (let i = 0; i < 3; i++) {
      const p2 = (i / 3)
      g.strokeStyle = 'rgba(140,190,210,' + (.2 - p2 * .12) + ')'; g.lineWidth = 1.2
      g.beginPath(); g.ellipse(cx, b + 3, 14 + i * 9, (14 + i * 9) * .42, 0, 0, 7); g.stroke()
    }
  },
  shipwreck: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 5, b + 2, 34, 12, .5)
    for (let i = 0; i < 7; i++) {                           // ribs out of the sand
      const t2 = i / 6, px2 = cx - 30 + t2 * 60
      const hgt = 34 * Math.sin(t2 * Math.PI) + 6
      g.strokeStyle = i % 2 ? OLDWOOD[0] : OLDWOOD[1]; g.lineWidth = 3.4
      g.beginPath(); g.moveTo(px2, b - (px2 - cx) * .5 + 4)
      g.quadraticCurveTo(px2 + 5, b - (px2 - cx) * .5 - hgt * .7, px2 + 2, b - (px2 - cx) * .5 - hgt)
      g.stroke()
    }
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 4              // the keel
    g.beginPath(); g.moveTo(cx - 32, b + 12); g.lineTo(cx + 30, b - 18); g.stroke()
    poly(g, [[cx - 10, b - 26], [cx + 6, b - 34], [cx + 8, b - 28], [cx - 8, b - 20]], OLDWOOD[1])
  },
  'siege-engine': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 5, b + 2, 28, 12, .55)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 4
    for (const s2 of [-1, 1]) {
      g.beginPath(); g.moveTo(cx + s2 * 18, b - s2 * 9); g.lineTo(cx, b - 52); g.stroke()
    }
    g.beginPath(); g.moveTo(cx - 20, b + 6); g.lineTo(cx + 20, b - 14); g.stroke()
    g.strokeStyle = OLDWOOD[0]; g.lineWidth = 5              // the throwing arm, still cocked
    g.beginPath(); g.moveTo(cx + 2, b - 50); g.lineTo(cx - 26, b - 22); g.stroke()
    g.fillStyle = '#4a443b'; g.beginPath(); g.arc(cx - 28, b - 20, 5, 0, 7); g.fill()
    for (const [wx, wy] of [[-16, 4], [14, -10]]) {          // wheels
      g.strokeStyle = OLDWOOD[1]; g.lineWidth = 2.6
      g.beginPath(); g.arc(cx + wx, b + wy, 8, 0, 7); g.stroke()
      g.beginPath(); g.moveTo(cx + wx - 8, b + wy); g.lineTo(cx + wx + 8, b + wy); g.stroke()
    }
  },
  'cave-mouth': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 2, 30, 12, .5)
    poly(g, [[cx - 30, b + 4], [cx + 30, b + 4], [cx + 24, b - 44], [cx - 2, b - 62], [cx - 26, b - 40]], ROCK[0])
    poly(g, [[cx - 30, b + 4], [cx - 4, b + 4], [cx - 2, b - 62], [cx - 26, b - 40]], ROCK[1])
    g.fillStyle = '#050405'
    g.beginPath(); g.moveTo(cx - 15, b + 2)
    g.quadraticCurveTo(cx - 13, b - 36, cx + 1, b - 38)
    g.quadraticCurveTo(cx + 15, b - 34, cx + 15, b + 2); g.closePath(); g.fill()
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1.4
    for (let i = 0; i < 5; i++) {
      g.beginPath(); g.moveTo(cx - 26 + i * 5, b - 34 + i * 4); g.lineTo(cx - 20 + i * 6, b - 20 + i * 5); g.stroke()
    }
  },
  mill: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 6, b + 2, 28, 12, .58)
    poly(g, [[cx - 18, b - 8], [cx, b + 2], [cx, b - 62], [cx - 15, b - 70]], '#463a2a')
    poly(g, [[cx, b + 2], [cx + 18, b - 8], [cx + 15, b - 70], [cx, b - 62]], '#2e2519')
    poly(g, [[cx - 15, b - 70], [cx, b - 62], [cx + 15, b - 70], [cx, b - 86]], '#3d2c1c')
    g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 1
    for (let i = 1; i < 6; i++) {
      const y = b - 10 * i
      g.beginPath(); g.moveTo(cx - 17, y - 8); g.lineTo(cx, y); g.lineTo(cx + 17, y - 8); g.stroke()
    }
    const hx2 = cx - 8, hy2 = b - 56                          // the sails
    g.strokeStyle = OLDWOOD[1]; g.lineWidth = 3
    for (let i = 0; i < 4; i++) {
      const a = i * 1.5708 + .4
      g.beginPath(); g.moveTo(hx2, hy2); g.lineTo(hx2 + Math.cos(a) * 30, hy2 + Math.sin(a) * 30); g.stroke()
      g.fillStyle = 'rgba(200,190,160,.20)'
      poly(g, [[hx2 + Math.cos(a) * 9, hy2 + Math.sin(a) * 9],
               [hx2 + Math.cos(a) * 29, hy2 + Math.sin(a) * 29],
               [hx2 + Math.cos(a + .34) * 27, hy2 + Math.sin(a + .34) * 27],
               [hx2 + Math.cos(a + .34) * 8, hy2 + Math.sin(a + .34) * 8]], 'rgba(200,190,160,.20)')
    }
    g.fillStyle = '#241c12'; g.beginPath(); g.arc(hx2, hy2, 3.4, 0, 7); g.fill()
  },

  // ---- bone and dark -----------------------------------------------------
  'bone-pile': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 20, 9, .5)
    for (let i = 0; i < 11; i++) {
      const x = cx + (R() - .5) * 38, y = b - R() * 12
      g.strokeStyle = i % 3 ? BONE[0] : BONE[1]; g.lineWidth = 3.2; g.lineCap = 'round'
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 18, y - R() * 9); g.stroke()
    }
    g.fillStyle = BONE[1]; g.beginPath(); g.arc(cx + 5, b - 11, 6.4, 0, 7); g.fill()
    g.fillStyle = '#14100c'
    g.beginPath(); g.arc(cx + 3, b - 12, 1.8, 0, 7); g.fill()
    g.beginPath(); g.arc(cx + 7.6, b - 12, 1.8, 0, 7); g.fill()
  },
  'skull-pile': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 20, 9, .55)
    const rows = [[-14, 0], [-5, 0], [4, 0], [13, 0], [-9, -9], [0, -9], [9, -9], [-4, -18], [5, -18], [0, -26]]
    for (const [ox, oy] of rows) {
      const x = cx + ox, y = b + oy - 6
      g.fillStyle = BONE[0]; g.beginPath(); g.arc(x, y, 5.4, 0, 7); g.fill()
      g.fillStyle = BONE[1]; g.beginPath(); g.arc(x - 1.2, y - 1.4, 3.6, 0, 7); g.fill()
      g.fillStyle = '#100c0a'
      g.beginPath(); g.arc(x - 2, y - .4, 1.5, 0, 7); g.fill()
      g.beginPath(); g.arc(x + 2, y - .4, 1.5, 0, 7); g.fill()

    }
  },
  gibbet: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 16, 8, .55)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 4
    g.beginPath(); g.moveTo(cx - 10, b); g.lineTo(cx - 10, b - 70); g.lineTo(cx + 16, b - 70); g.stroke()
    g.strokeStyle = OLDWOOD[0]; g.lineWidth = 2
    g.beginPath(); g.moveTo(cx - 10, b - 58); g.lineTo(cx + 2, b - 70); g.stroke()
    g.strokeStyle = '#4a4438'; g.lineWidth = 1.4              // the cage
    g.beginPath(); g.moveTo(cx + 16, b - 70); g.lineTo(cx + 16, b - 54); g.stroke()
    for (let i = 0; i < 5; i++) {
      const a = (i / 4) * Math.PI - Math.PI / 2
      g.beginPath()
      g.moveTo(cx + 16 + Math.cos(a) * 8, b - 52)
      g.lineTo(cx + 16 + Math.cos(a) * 8, b - 30); g.stroke()
    }
    g.beginPath(); g.ellipse(cx + 16, b - 52, 8, 3.4, 0, 0, 7); g.stroke()
    g.beginPath(); g.ellipse(cx + 16, b - 30, 8, 3.4, 0, 0, 7); g.stroke()
    g.fillStyle = BONE[0]; g.beginPath(); g.arc(cx + 16, b - 44, 5.4, 0, 7); g.fill()
    g.fillStyle = '#100c0a'
    g.beginPath(); g.arc(cx + 14, b - 45, 1.5, 0, 7); g.fill()

  'tally-half': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 2, b + 1, 12, 6, .5)
    poly(g, [[cx - 5, b], [cx + 5, b], [cx + 4, b - 40], [cx - 3, b - 44]], '#6b5836')
    poly(g, [[cx - 5, b], [cx - 1, b], [cx - 1, b - 42], [cx - 3, b - 44]], '#8a7248')
    g.strokeStyle = '#2e2418'; g.lineWidth = 1.6              // the notches of the debt
    for (let i = 0; i < 7; i++) {
      const y = b - 8 - i * 4.6
      g.beginPath(); g.moveTo(cx - 4, y); g.lineTo(cx + 4, y - 1); g.stroke()
    }
    g.strokeStyle = '#1a140e'; g.lineWidth = 2                // and the split down it
    g.beginPath(); g.moveTo(cx + 1, b); g.lineTo(cx + 1, b - 42); g.stroke()
  },
  web: (g, W, H, R, cx, b) => {
    // THIRTY OF THESE, and until now every one drew as a standing stone.
    groundShadow(g, cx + 2, b + 1, 12, 6, .3)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.6
    g.beginPath(); g.moveTo(cx - 24, b + 2); g.lineTo(cx - 22, b - 56); g.stroke()
    g.beginPath(); g.moveTo(cx + 24, b - 10); g.lineTo(cx + 22, b - 64); g.stroke()
    const wx = cx, wy = b - 40
    g.strokeStyle = 'rgba(214,220,224,.42)'; g.lineWidth = 1
    for (let i = 0; i < 9; i++) {                             // radials
      const a = (i / 9) * 6.283
      g.beginPath(); g.moveTo(wx, wy)
      g.lineTo(wx + Math.cos(a) * 25, wy + Math.sin(a) * 22); g.stroke()
    }
    for (let r = 1; r <= 4; r++) {                            // and the spiral between them
      g.beginPath()
      for (let i = 0; i <= 9; i++) {
        const a = (i / 9) * 6.283
        const rr = r * 6
        const px2 = wx + Math.cos(a) * rr, py2 = wy + Math.sin(a) * rr * .88
        i === 0 ? g.moveTo(px2, py2) : g.lineTo(px2, py2)
      }

    }
    g.fillStyle = 'rgba(240,244,248,.30)'
    for (let i = 0; i < 5; i++) {                             // caught, and left

    }
  },

  // ---- work and weather --------------------------------------------------
  'log-pile': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 22, 9, .5)
    for (let row = 0; row < 3; row++) {
      for (let i = 0; i < 4 - row; i++) {
        const x = cx - 18 + row * 7 + i * 12, y = b - 4 - row * 9
        g.fillStyle = row % 2 ? WOOD[0] : WOOD[1]
        g.beginPath(); g.ellipse(x, y, 6.4, 5, 0, 0, 7); g.fill()
        g.fillStyle = '#6b5836'; g.beginPath(); g.ellipse(x - 1, y - 1, 4, 3.2, 0, 0, 7); g.fill()
        g.strokeStyle = '#4a3c22'; g.lineWidth = .8
        g.beginPath(); g.ellipse(x - 1, y - 1, 2.2, 1.7, 0, 0, 7); g.stroke()
      }
    }
  },
  'spoil-heap': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 10, .5)
    for (let i = 0; i < 22; i++) {
      const a = R() * 6.283, rr = R() * 24
      g.fillStyle = i % 3 ? '#3f3a33' : '#4e4740'
      g.beginPath()
      g.ellipse(cx + Math.cos(a) * rr, b - 2 + Math.sin(a) * rr * .42 - (1 - rr / 24) * 12,
        3 + R() * 4, 2 + R() * 2.4, R() * 3, 0, 7); g.fill()
    }
    for (let i = 0; i < 5; i++) {                             // ore that was not worth it
      g.fillStyle = '#7a5c2a'
      g.beginPath(); g.arc(cx + (R() - .5) * 30, b - 4 - R() * 10, 1.4, 0, 7); g.fill()
    }
  },
  haystack: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 22, 10, .55)
    for (let i = 0; i < 5; i++) {
      const y = b - i * 11, w = 22 - i * 3.6
      g.fillStyle = i % 2 ? STRAW[0] : STRAW[1]
      g.beginPath(); g.ellipse(cx, y, w, w * .5, 0, 0, 7); g.fill()
    }
    poly(g, [[cx - 8, b - 50], [cx + 8, b - 50], [cx, b - 66]], STRAW[1])
    g.strokeStyle = STRAW[2]; g.lineWidth = 1
    for (let i = 0; i < 26; i++) {
      const a = R() * 6.283, rr = 8 + R() * 15
      g.beginPath()
      g.moveTo(cx + Math.cos(a) * rr, b - R() * 46)
      g.lineTo(cx + Math.cos(a) * rr + (R() - .5) * 5, b - R() * 46 - 4); g.stroke()
    }
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.4
    g.beginPath(); g.moveTo(cx + 20, b + 4); g.lineTo(cx + 12, b - 34); g.stroke()
  },
  'charcoal-clamp': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 10, .5)
    for (let i = 0; i < 4; i++) {
      const y = b - i * 8, w = 24 - i * 5
      g.fillStyle = i % 2 ? '#231e1a' : '#2f2823'
      g.beginPath(); g.ellipse(cx, y, w, w * .48, 0, 0, 7); g.fill()
    }
    g.fillStyle = '#151210'; g.beginPath(); g.ellipse(cx, b - 30, 4.4, 2.2, 0, 0, 7); g.fill()
    g.save(); g.globalCompositeOperation = 'lighter'          // it is still working
    for (let i = 0; i < 4; i++) {
      g.fillStyle = 'rgba(170,160,150,' + (.10 - i * .02) + ')'
      g.beginPath(); g.ellipse(cx + (R() - .5) * 8, b - 36 - i * 9, 5 + i * 3, 3 + i * 2, 0, 0, 7); g.fill()
    }
    g.restore()
  },
  'scorched-ring': (g, W, H, R, cx, b) => {              // flat: a mark, not an object
    g.fillStyle = 'rgba(14,11,10,.72)'
    g.beginPath(); g.ellipse(cx, b, 26, 12, 0, 0, 7); g.fill()
    g.fillStyle = 'rgba(40,32,26,.55)'
    g.beginPath(); g.ellipse(cx, b, 18, 8, 0, 0, 7); g.fill()
    g.strokeStyle = 'rgba(90,70,50,.4)'; g.lineWidth = 1.6
    g.beginPath(); g.ellipse(cx, b, 26, 12, 0, 0, 7); g.stroke()
    for (let i = 0; i < 8; i++) {
      g.fillStyle = '#1a1512'
      g.beginPath(); g.ellipse(cx + (R() - .5) * 40, b + (R() - .5) * 16, 2.4, 1.4, R() * 3, 0, 7); g.fill()
    }
  },
  'burnt-tree': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 1, 20, 9, .5)
    const h = 74
    poly(g, [[cx - 6, b], [cx - 3, b - h], [cx + 2, b - h], [cx + 7, b]], '#1a1614')
    poly(g, [[cx - 6, b], [cx - 2, b], [cx - 2, b - h], [cx - 3, b - h]], '#2e2724')
    g.strokeStyle = '#151110'; g.lineCap = 'round'
    for (let i = 0; i < 7; i++) {
      const a = -0.4 - R() * 2.3, len = 14 + R() * 26
      const by2 = b - h * (0.35 + R() * 0.6)
      g.lineWidth = 3.4 - i * .35
      g.beginPath(); g.moveTo(cx, by2)
      g.quadraticCurveTo(cx + Math.cos(a) * len * .6, by2 + Math.sin(a) * len * .5,
        cx + Math.cos(a - .3) * len, by2 + Math.sin(a - .3) * len); g.stroke()
    }
    g.fillStyle = 'rgba(10,8,8,.5)'
    g.beginPath(); g.ellipse(cx, b + 1, 20, 8, 0, 0, 7); g.fill()
  },
  cart: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 4, b + 2, 24, 10, .5)
    poly(g, [[cx - 22, b - 13], [cx + 2, b - 1], [cx + 20, b - 10], [cx - 4, b - 22]], WOOD[1])
    poly(g, [[cx - 22, b - 13], [cx + 2, b - 1], [cx + 2, b - 9], [cx - 22, b - 21]], WOOD[0])
    poly(g, [[cx + 2, b - 1], [cx + 20, b - 10], [cx + 20, b - 18], [cx + 2, b - 9]], WOOD[2])
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 2.6
    g.beginPath(); g.moveTo(cx - 20, b - 20); g.lineTo(cx - 34, b - 30); g.stroke()
    for (const [wx, wy] of [[-12, 2], [8, -8]]) {

      g.beginPath(); g.arc(cx + wx, b + wy, 9, 0, 7); g.stroke()
      g.lineWidth = 1.4
      for (let i = 0; i < 4; i++) {

        g.beginPath(); g.moveTo(cx + wx - Math.cos(a) * 9, b + wy - Math.sin(a) * 9)

  scarecrow: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 14, 7, .5)
    g.strokeStyle = OLDWOOD[2]; g.lineWidth = 3.4
    g.beginPath(); g.moveTo(cx, b); g.lineTo(cx, b - 62); g.stroke()
    g.beginPath(); g.moveTo(cx - 22, b - 46); g.lineTo(cx + 22, b - 50); g.stroke()
    poly(g, [[cx - 10, b - 48], [cx + 10, b - 50], [cx + 8, b - 22], [cx - 8, b - 20]], '#4a3f2c')
    for (let i = 0; i < 10; i++) {                            // straw out of the cuffs and hem
      g.strokeStyle = STRAW[1]; g.lineWidth = 1
      const x = cx - 8 + R() * 16
      g.beginPath(); g.moveTo(x, b - 21); g.lineTo(x + (R() - .5) * 5, b - 13); g.stroke()
    }
    g.fillStyle = STRAW[0]; g.beginPath(); g.arc(cx, b - 56, 8, 0, 7); g.fill()
    g.fillStyle = STRAW[1]; g.beginPath(); g.arc(cx - 1.6, b - 57.6, 5.4, 0, 7); g.fill()
    g.fillStyle = '#1a1510'
    g.beginPath(); g.arc(cx - 2.6, b - 58, 1.4, 0, 7); g.fill()
    g.beginPath(); g.arc(cx + 2, b - 57.6, 1.4, 0, 7); g.fill()
    poly(g, [[cx - 11, b - 61], [cx + 11, b - 61], [cx + 6, b - 70], [cx - 6, b - 70]], '#3d3323')
  },
  barricade: (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 3, b + 1, 24, 9, .5)
    for (const s2 of [-1, 1]) {                               // crossed stakes, points out
      g.strokeStyle = OLDWOOD[0]; g.lineWidth = 4
      g.beginPath(); g.moveTo(cx + s2 * 24, b + s2 * 6); g.lineTo(cx - s2 * 16, b - 40); g.stroke()
      poly(g, [[cx - s2 * 16, b - 40], [cx - s2 * 13, b - 34], [cx - s2 * 20, b - 36]], '#8f8272')
    }
    g.strokeStyle = OLDWOOD[1]; g.lineWidth = 3
    g.beginPath(); g.moveTo(cx - 22, b - 8); g.lineTo(cx + 22, b - 20); g.stroke()
    g.beginPath(); g.moveTo(cx - 20, b - 20); g.lineTo(cx + 20, b - 32); g.stroke()
    g.strokeStyle = '#2a2620'; g.lineWidth = 1.6              // lashings
    g.beginPath(); g.arc(cx, b - 22, 4, 0, 7); g.stroke()
  },

  // ---- the two that are older than the towns -----------------------------
  'old-oak': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 6, b + 2, 40, 17, .6)
    const h = 78
    poly(g, [[cx - 17, b + 2], [cx - 8, b - h], [cx + 8, b - h], [cx + 17, b + 2]], '#2c241a')
    poly(g, [[cx - 17, b + 2], [cx - 5, b + 2], [cx - 3, b - h], [cx - 8, b - h]], '#463829')
    g.strokeStyle = '#181109'; g.lineWidth = 1.6
    for (let i = 0; i < 8; i++) {
      const t2 = R()
      g.beginPath(); g.moveTo(cx - 14 + t2 * 28, b); g.lineTo(cx - 7 + t2 * 15, b - h + 6); g.stroke()
    }
    for (let i = 0; i < 6; i++) {                             // roots
      const a = R() * 6.28
      g.strokeStyle = '#2c241a'; g.lineWidth = 5
      g.beginPath(); g.moveTo(cx + Math.cos(a) * 10, b)
      g.lineTo(cx + Math.cos(a) * 30, b + Math.sin(a) * 8); g.stroke()
    }
    g.strokeStyle = '#2c241a'; g.lineCap = 'round'
    for (let i = 0; i < 7; i++) {
      const a = -0.3 - R() * 2.5, len = 26 + R() * 26
      g.lineWidth = 6 - i * .5
      g.beginPath(); g.moveTo(cx, b - h + 8)
      g.quadraticCurveTo(cx + Math.cos(a) * len * .5, b - h - 6 + Math.sin(a) * len * .4,
        cx + Math.cos(a - .2) * len, b - h - 4 + Math.sin(a - .2) * len); g.stroke()
    }
    const cy2 = b - h - 34
    const blobs = []
    for (let i = 0; i < 11; i++) blobs.push([cx + (R() - .5) * 76, cy2 + (R() - .5) * 40, 18 + R() * 16])
    for (const [bx, by, br] of blobs) { g.fillStyle = '#17200f'; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill() }
    for (const [bx, by, br] of blobs) { g.fillStyle = '#243014'; g.beginPath(); g.arc(bx - br * .12, by - br * .16, br * .76, 0, 7); g.fill() }
    for (const [bx, by, br] of blobs) { g.fillStyle = '#3b4a1e'; g.beginPath(); g.arc(bx - br * .3, by - br * .34, br * .36, 0, 7); g.fill() }
  },
  'elder-tree': (g, W, H, R, cx, b) => {
    groundShadow(g, cx + 6, b + 2, 36, 15, .55)
    const h = 84
    poly(g, [[cx - 13, b + 2], [cx - 6, b - h], [cx + 6, b - h], [cx + 13, b + 2]], '#54534a')
    poly(g, [[cx - 13, b + 2], [cx - 3, b + 2], [cx - 2, b - h], [cx - 6, b - h]], '#77756a')
    g.strokeStyle = '#3e3d36'; g.lineWidth = 1.2
    for (let i = 0; i < 7; i++) {
      const t2 = R()
      g.beginPath(); g.moveTo(cx - 11 + t2 * 22, b); g.lineTo(cx - 5 + t2 * 11, b - h + 6); g.stroke()
    }
    g.strokeStyle = '#5e5c52'; g.lineCap = 'round'
    for (let i = 0; i < 8; i++) {
      const a = -0.25 - R() * 2.6, len = 24 + R() * 24
      g.lineWidth = 5 - i * .4
      g.beginPath(); g.moveTo(cx, b - h + 6)
      g.quadraticCurveTo(cx + Math.cos(a) * len * .5, b - h - 4 + Math.sin(a) * len * .4,
        cx + Math.cos(a - .2) * len, b - h - 2 + Math.sin(a - .2) * len); g.stroke()
    }
    const cy2 = b - h - 30
    for (let i = 0; i < 10; i++) {
      const bx = cx + (R() - .5) * 70, by = cy2 + (R() - .5) * 36, br = 16 + R() * 14
      g.fillStyle = '#2a3a34'; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill()
      g.fillStyle = '#3d5750'; g.beginPath(); g.arc(bx - br * .2, by - br * .24, br * .6, 0, 7); g.fill()
    }
    g.save(); g.globalCompositeOperation = 'lighter'          // it is not quite an ordinary tree
    const gg2 = g.createRadialGradient(cx, cy2, 0, cx, cy2, 70)
    gg2.addColorStop(0, 'rgba(150,220,200,.10)'); gg2.addColorStop(1, 'rgba(150,220,200,0)')
    g.fillStyle = gg2; g.beginPath(); g.arc(cx, cy2, 70, 0, 7); g.fill(); g.restore()
  },
}

// Anything the constitution adds after this file was written still gets a
// shape rather than a blank: a nameless cairn, which is what an unrecorded
// place looks like on any real chart.
function lmFallback(g, W, H, R, cx, b) {
  groundShadow(g, cx + 3, b + 1, 16, 7, .5)
  for (let i = 0; i < 4; i++) {
    const w = 12 - i * 2.2, y = b - i * 7
    g.fillStyle = i % 2 ? ROCK[0] : ROCK[1]
    g.beginPath(); g.ellipse(cx + (R() - .5) * 3, y, w, w * .52, 0, 0, 7); g.fill()
  }
}
// ===========================================================================
// THE RENDERER
// ---------------------------------------------------------------------------
// Three passes and a composite:
//
//   1. GROUND.  Every visible tile, walked in diagonal order (by x+y), so that
//      a raised crag draws its rock face before the tile in front of it covers
//      the bottom of that face. Iterating rows would be wrong: two tiles in
//      the same row are at different depths once the camera turns.
//   2. STANDING.  Everything with a footprint is collected, sorted by depth,
//      and drawn bottom-up. This is the pass that makes the window read as a
//      place rather than a chart: a citizen walks BEHIND the oak and in FRONT
//      of the wall, and neither of those facts is available to a flat window.
//   3. LIGHT.  The whole frame is covered in night and then the night is
//      PUNCHED OUT wherever something burns. Ambient comes from the world's
//      own day cycle (a pure function of the tick, so every window agrees what
//      time it is); the lantern is the window's, and never goes out.
//
//   4. AIR.  Additive glow, cinders, and the vignette, over the top.
// ===========================================================================

const cv = document.getElementById('cv')
const cx = cv.getContext('2d')
let VW = 0, VH = 0, DPR = 1
const sceneCv = mkc(8, 8), sceneG = sceneCv.getContext('2d')
const lightCv = mkc(8, 8), lightG = lightCv.getContext('2d')

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1)
  VW = window.innerWidth; VH = window.innerHeight
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR)
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px'
  cx.setTransform(DPR, 0, 0, DPR, 0, 0)
  for (const c of [sceneCv, lightCv]) { c.width = cv.width; c.height = cv.height }
  sceneG.setTransform(DPR, 0, 0, DPR, 0, 0)
  lightG.setTransform(DPR, 0, 0, DPR, 0, 0)
  if (typeof sizeSurfaces === 'function') sizeSurfaces()
}
window.addEventListener('resize', resize)

// ---- the camera -----------------------------------------------------------
// Anchored on the citizen and eased, because a camera that snaps tile to tile
// turns walking into a slide show. `camX/camY` are fractional world coords.
let camX = 0, camY = 0, camReady = false
let shake = 0, flashRed = 0, flashGold = 0
const CAM_LIFT = 26                          // stand the horizon up a little

function screenOf(wx, wy) {
  return { x: VW / 2 + isoX(wx, wy) - isoX(camX, camY),
           y: VH / 2 - CAM_LIFT + isoY(wx, wy) - isoY(camX, camY) }
}
function worldOf(px2, py2) {
  // THE INVERSE OF screenOf, AND IT HAD A HALF-TILE IN IT.
  //
  // The `+ HW` shifted the answer by (+0.5, -0.5) before unIso floored it,
  // which resolves to the WRONG TILE for every tile on the island -- measured,
  // 396 of 396. A click landed one square behind where you aimed; you set off
  // for it, and if the button was held even a moment the camera carried the
  // target away from you as you walked. That is the walking in circles. It also
  // quietly broke the tile-exactness rule meant to stop tall trees stealing
  // each other's clicks, because that rule was comparing against the wrong tile.
  return unIso(px2 - VW / 2 + isoX(camX, camY),
               py2 - VH / 2 + CAM_LIFT + isoY(camX, camY))
}

// ---- interpolation --------------------------------------------------------
// A tick is 600ms and a step is a whole tile, so without this everyone
// teleports twice a second. Positions are eased from where a thing was in the
// previous state toward where it is in this one.
let prevPos = new Map(), curPos = new Map()

      const g2 = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r)
      g2.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',' + (.05 + R() * .07) + ')')
      g2.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)')

}

  const c2 = worldOf(-TW, VH + TH + 90), c3 = worldOf(VW + TW, VH + TH + 90)
  const W = world?.genesis?.worldW ?? dims().W, H = world?.genesis?.worldH ?? dims().H
  const x0 = Math.max(0, Math.min(c0.x, c1.x, c2.x, c3.x) - 1)
  const x1 = Math.min(W - 1, Math.max(c0.x, c1.x, c2.x, c3.x) + 1)
  const y0 = Math.max(0, Math.min(c0.y, c1.y, c2.y, c3.y) - 1)
  const y1 = Math.min(H - 1, Math.max(c0.y, c1.y, c2.y, c3.y) + 1)

  bridgeQueue.length = 0
  if (x1 < x0 || y1 < y0) return
  const oxB = VW / 2 - isoX(camX, camY) - HW
  const oyB = VH / 2 - CAM_LIFT - isoY(camX, camY) - HH
  // diagonal order: this is the whole trick, and it is one loop
  for (let d = x0 + y0; d <= x1 + y1; d++) {
    const xa = Math.max(x0, d - y1), xb = Math.min(x1, d - y0)
    for (let x = xa; x <= xb; x++) {
      const y = d - x

      const G = groundOf(kind)

      const ox = oxB + isoX(x, y), oy = oyB + isoY(x, y) - G.lift
      if (kind === 'bridge') {

        // its shadow hang BELOW its own diamond, over the tile in front -- and
        // that tile comes later in the diagonal walk and would paint straight
        // over them. So bridges are held back and laid down after all the
        // ground is finished, still in depth order among themselves.

// Every node, beast, citizen and dropped thing becomes one entry with a depth,

// rooms and leaves the town's own paving (`flag`) under others, so a third of
// the cottages still had a gabled roof on them inside somebody's four walls.
// A room is a room because it is WALLED, not because of what the floor is made

// frame and the answer cannot change inside a tick.

// roofs inside the larger halls. The real question is topological: flood out

function collectStanding(s, t, list) {
  const W = world?.genesis?.worldW ?? dims().W
  const near = (e) => {
    const p = screenOf(e.x, e.y)
    return p.x > -160 && p.x < VW + 160 && p.y > -220 && p.y < VH + 160
  }

    if (!near(n)) continue

  }
  for (const [id, gi] of Object.entries(s.ground ?? {})) {

  }
  for (const [id, m] of Object.entries(s.mobs ?? {})) {

    const [ix, iy] = lerpPos('m' + id, m.x, m.y, t)

    case 'bank': case 'store': {

        poly(gg, [[c2, b + 16], [c2 + 32, b], [c2 + 32, b - HGT], [c2, b + 16 - HGT]], wood[2])
        poly(gg, [[c2, b - 16 - HGT], [c2 + 32, b - HGT], [c2, b + 16 - HGT], [c2 - 32, b - HGT]], wood[1])
        // plank joints across the top, running with the diamond

    }
    case 'house': case 'inn': {
      if (n.type === 'house' && indoors(n.x, n.y)) {

        //
        // Thirty-three of this island's seventy houses stand on `floor`, inside
        // walls, in a room already furnished with a table, a bed, a shelf and a
        // barrel. Whatever the constitution means by `house` there, it is not a
        // cottage -- it is one impassable tile in somebody's front room, and a
        // gabled roof on it was the same mistake as the store.
        //
        // Drawn as the STAIR: interior timber going up to a loft. It answers
        // the only question the tile actually raises, which is why you cannot
        // walk through it, and it duplicates none of the furniture the world
        // has already placed around it.
        g.drawImage(sprite('stair' + (hs & 3), 84, 86, (gg, W2, H2, R) => {
          const c2 = W2 / 2, b = H2 - 26
          groundShadow(gg, c2 + 4, b + 4, 28, 12, .5)
          const STEP = 6, N = 6
          for (let i = 0; i < N; i++) {
            const y0 = b - i * STEP
            const x0 = c2 - 30 + i * 5, x1 = c2 + 2 + i * 5
            // tread, then the riser under it
            poly(gg, [[x0, y0], [x0 + 16, y0 + 8], [x1 + 16, y0 - 8 + 8], [x1, y0 - 8]],
              i % 2 ? '#5b4a2c' : '#655231')
            poly(gg, [[x0, y0], [x0 + 16, y0 + 8], [x0 + 16, y0 + 8 + STEP], [x0, y0 + STEP]], '#2e2417')
            gg.strokeStyle = 'rgba(255,236,196,.13)'; gg.lineWidth = 1
            gg.beginPath(); gg.moveTo(x0, y0); gg.lineTo(x1, y0 - 8); gg.stroke()
          }
          // the rail, and its posts
          gg.strokeStyle = '#3f331f'; gg.lineWidth = 2.6
          gg.beginPath(); gg.moveTo(c2 - 28, b - 12); gg.lineTo(c2 + 4, b - 12 - N * STEP + 4); gg.stroke()
          for (let i = 0; i < 4; i++) {
            const t2 = i / 3
            const px2 = c2 - 28 + t2 * 32, py2 = b - t2 * (N * STEP - 4)
            gg.strokeStyle = '#4a3c24'; gg.lineWidth = 2
            gg.beginPath(); gg.moveTo(px2, py2); gg.lineTo(px2, py2 - 13); gg.stroke()
          }

          poly(gg, [[c2 + 2, b - N * STEP - 2], [c2 + 20, b - N * STEP + 7],

      g.drawImage(sprite('bld' + n.type + (hs & 3), 160, 150, (gg, W2, H2, R) =>

    case 'wall': case 'rampart':

        poly(gg, [[c2, b], [c2 + 32, b - 16], [c2 + 32, b - 16 - hgt], [c2, b - hgt]], '#251f1b')
        poly(gg, [[c2 - 32, b - 16 - hgt], [c2, b - hgt], [c2 + 32, b - 16 - hgt], [c2, b - 32 - hgt]], '#474139')
        gg.strokeStyle = 'rgba(0,0,0,.34)'; gg.lineWidth = 1
        for (let i = 1; i < 4; i++) {

          gg.beginPath(); gg.moveTo(xx, yy - (xx - c2 + 32) / 64 * 16 + 8); gg.lineTo(xx, yy - (xx - c2 + 32) / 64 * 16 + 16); gg.stroke()
        }
      }), sx - 40, sy - 78 + 22); return
    case 'fence': case 'hedge': case 'hurdle': case 'barricade':
      g.drawImage(sprite(n.type + (hs & 3), 76, 46, (gg, W2, H2, R) => {
        const c2 = W2 / 2, b = H2 - 6
        groundShadow(gg, c2 + 2, b - 2, 22, 9, .4)
        if (n.type === 'hedge') {
          for (let i = 0; i < 9; i++) {
            const tt = i / 8, px2 = c2 - 30 + tt * 60, py2 = b - 15 * (1 - Math.abs(tt - .5) * .6) - (tt - .5) * 16
            gg.fillStyle = i % 2 ? '#1e2718' : '#263021'
            gg.beginPath(); gg.arc(px2, py2, 8 + R() * 3, 0, 7); gg.fill()
            gg.fillStyle = '#33401f'
            gg.beginPath(); gg.arc(px2 - 2, py2 - 3, 4, 0, 7); gg.fill()

        } else {
          gg.strokeStyle = '#2e2519'; gg.lineWidth = 3
          for (let i = 0; i < 4; i++) {
            const px2 = c2 - 26 + i * 17
            gg.beginPath(); gg.moveTo(px2, b - (px2 - c2) * .5); gg.lineTo(px2, b - 18 - (px2 - c2) * .5); gg.stroke()
          }
          gg.strokeStyle = '#3e3323'; gg.lineWidth = 2.6
          for (const h2 of [7, 15]) {

          }

      }), sx - 38, sy - 46 + 14); return
    case 'well':
      g.drawImage(sprite('well', 76, 82, (gg, W2, H2) => {
        const c2 = W2 / 2, b = H2 - 6
        groundShadow(gg, c2 + 3, b - 3, 22, 10, .55)
        gg.fillStyle = '#0a0d10'; gg.beginPath(); gg.ellipse(c2, b - 12, 17, 8.5, 0, 0, 7); gg.fill()
        gg.fillStyle = '#3a352e'
        gg.beginPath(); gg.ellipse(c2, b - 8, 20, 10, 0, 0, 7); gg.fill()
        gg.fillStyle = '#4a443b'
        gg.beginPath(); gg.ellipse(c2, b - 12, 20, 10, 0, 0, 7); gg.fill()
        gg.fillStyle = '#12181e'; gg.beginPath(); gg.ellipse(c2, b - 12, 13, 6.4, 0, 0, 7); gg.fill()
        gg.strokeStyle = '#2e2519'; gg.lineWidth = 3.4
        gg.beginPath(); gg.moveTo(c2 - 15, b - 16); gg.lineTo(c2 - 15, b - 44); gg.stroke()
        gg.beginPath(); gg.moveTo(c2 + 15, b - 16); gg.lineTo(c2 + 15, b - 44); gg.stroke()
        poly(gg, [[c2 - 22, b - 44], [c2 + 22, b - 44], [c2, b - 60]], '#33291c')

      }), sx - 38, sy - 82 + 20); return
    case 'plot': {
      g.save()
      g.fillStyle = 'rgba(38,28,18,.85)'; diamond(g, sx - 32, sy - 16, 4); g.fill()
      g.strokeStyle = 'rgba(20,14,8,.7)'; g.lineWidth = 2
      for (let i = 1; i < 5; i++) {
        g.beginPath(); g.moveTo(sx - 26 + i * 10, sy - 10 + i * 5); g.lineTo(sx + 6 + i * 10 - 32 + 26, sy + 6); g.stroke()
      }
      g.restore()
      if (n.crop) {                                   // something is growing
        const grown = (n.readyAt ?? 0) <= (s?.tick ?? 0)
        for (let i = 0; i < 5; i++) {
          const ox = ((tileHash(n.x, n.y, i + 30) % 40) - 20), oy = ((tileHash(n.x, n.y, i + 40) % 20) - 10)
          g.strokeStyle = grown ? '#8a9a3a' : '#4a5a2a'; g.lineWidth = 2

    }
    case 'brewpot':
      g.drawImage(sprite('brewpot', 60, 54, (gg, W2, H2) => {
        const c2 = W2 / 2, b = H2 - 5
        groundShadow(gg, c2 + 2, b - 2, 17, 8, .5)
        gg.strokeStyle = '#2b2620'; gg.lineWidth = 2.4
        for (const dx2 of [-9, 0, 9]) { gg.beginPath(); gg.moveTo(c2 + dx2, b); gg.lineTo(c2 + dx2 * .4, b - 12); gg.stroke() }
        gg.fillStyle = '#22201d'; gg.beginPath(); gg.ellipse(c2, b - 20, 14, 11, 0, 0, 7); gg.fill()
        gg.fillStyle = '#33302b'; gg.beginPath(); gg.ellipse(c2, b - 24, 14, 6.4, 0, 0, 7); gg.fill()
        gg.fillStyle = '#1a2a1c'; gg.beginPath(); gg.ellipse(c2, b - 24, 11, 4.8, 0, 0, 7); gg.fill()
      }), sx - 30, sy - 54 + 14)
      if ((n.readyAt ?? 0) > (s?.tick ?? 0)) {
        g.save(); g.globalCompositeOperation = 'lighter'
        g.fillStyle = 'rgba(160,220,180,' + (.1 + .1 * Math.sin(t / 500)) + ')'
        g.beginPath(); g.ellipse(sx, sy - 34, 9, 5, 0, 0, 7); g.fill(); g.restore()
      }
      return
    case 'signpost': case 'milestone': case 'boundary-stone':
      g.drawImage(sprite('sign' + n.type, 60, 62, (gg, W2, H2) => {
        const c2 = W2 / 2, b = H2 - 5
        groundShadow(gg, c2 + 2, b - 1, 12, 6, .5)
        if (n.type === 'signpost') {
          gg.strokeStyle = '#33291c'; gg.lineWidth = 3.4
          gg.beginPath(); gg.moveTo(c2, b); gg.lineTo(c2, b - 34); gg.stroke()
          poly(gg, [[c2 - 3, b - 34], [c2 + 20, b - 31], [c2 + 20, b - 24], [c2 - 3, b - 27]], '#4a3a24')
          poly(gg, [[c2 - 3, b - 34], [c2 + 20, b - 31], [c2 + 20, b - 29], [c2 - 3, b - 32]], '#66502f')
        } else {
          poly(gg, [[c2 - 7, b], [c2 + 7, b], [c2 + 5, b - 20], [c2 - 5, b - 20]], '#3f3a34')
          poly(gg, [[c2 - 7, b], [c2 - 1, b], [c2 - 1, b - 20], [c2 - 5, b - 20]], '#524b42')
          gg.fillStyle = 'rgba(0,0,0,.4)'; gg.fillRect(c2 - 3, b - 15, 6, 1.6)
        }
      }), sx - 30, sy - 62 + 16); return
    case 'waystone':
      g.drawImage(sprite('waystone', 62, 88, (gg, W2, H2) => {
        const c2 = W2 / 2, b = H2 - 5
        groundShadow(gg, c2 + 3, b - 2, 18, 8, .6)
        poly(gg, [[c2 - 11, b], [c2 + 11, b], [c2 + 8, b - 54], [c2 - 6, b - 58]], '#37332e')
        poly(gg, [[c2 - 11, b], [c2 - 1, b], [c2 - 1, b - 56], [c2 - 6, b - 58]], '#4c4740')
        gg.strokeStyle = 'rgba(0,0,0,.5)'; gg.lineWidth = 1
        for (let i = 0; i < 5; i++) { gg.beginPath()
          gg.moveTo(c2 - 8 + i * 4, b - 8 - i * 9); gg.lineTo(c2 + 6, b - 12 - i * 9); gg.stroke() }
      }), sx - 31, sy - 88 + 18)
      { const p = (Math.sin(t / 700) + 1) / 2
        g.save(); g.globalCompositeOperation = 'lighter'
        const gr = g.createRadialGradient(sx, sy - 44, 0, sx, sy - 44, 30)
        gr.addColorStop(0, 'rgba(140,180,255,' + (.10 + p * .12) + ')')
        gr.addColorStop(1, 'rgba(140,180,255,0)')
        g.fillStyle = gr; g.beginPath(); g.arc(sx, sy - 44, 30, 0, 7); g.fill(); g.restore() }
      return
    case 'keeper': case 'guard': case 'smith': {
      const role = n.type
      const t2 = t / 1000 + hs
      humanoid(g, sx, sy, {
        scale: .96, cloak: role === 'guard' ? '#3a2020' : null,
        tunic: role === 'smith' ? '#332b22' : role === 'guard' ? '#3d2523' : '#3a3226',
        boots: '#241d16', hair: '#2e2418',
        helm: role === 'guard' ? '#5a5246' : null,
        step: Math.sin(t2 * .6) * .2,
        swing: role === 'smith'
          ? -0.9 + Math.abs(Math.sin(t2 * 2.2)) * 1.5      // striking, on the beat
          : -0.4 + Math.sin(t2 * .9) * .12,
        weapon: role === 'guard' ? (gg2, hx, hy, a, sc) => drawWeapon(gg2, hx, hy, a, sc, 'bronze-spear')
              // A SMITH HOLDS A HAMMER. This handed them a woodcutter's hatchet,
              // which is why a smith standing beside a citizen at a tree read as
              // ONE figure with two arms -- a sword in one and an axe swinging in
              // the other. Two overlapping sprites, and the wrong tool in one of
              // them made the overlap legible as a single impossible body.
              : role === 'smith' ? (gg2, hx, hy, a, sc) => drawWeapon(gg2, hx, hy, a, sc, 'hammer') : null,
      })
      return
    }
    case 'landmark': return drawLandmark(g, n, sx, sy, t, hs)
    default: {
      g.drawImage(sprite('unk', 48, 42, (gg, W2, H2) => {
        const c2 = W2 / 2, b = H2 - 5
        groundShadow(gg, c2 + 2, b - 1, 14, 7, .5)
        poly(gg, [[c2 - 11, b], [c2 + 11, b], [c2 + 9, b - 18], [c2 - 9, b - 18]], '#3a352e')
        poly(gg, [[c2 - 11, b], [c2 - 1, b], [c2 - 1, b - 18], [c2 - 9, b - 18]], '#4c4740')
      }), sx - 24, sy - 42 + 12)
    }
  }
}

// ---- the places that are only places --------------------------------------
// Forty nouns, forty painters, in 48-landmarks.js. The dispatch is this:
function drawLandmark(g, n, sx, sy, t, hs) {
  const kind = n.kind ?? 'standing-stone'
  const paint = LM_ART[kind] ?? lmFallback
  const h2 = lmHeight(kind)
  g.drawImage(sprite('lm:' + kind + (hs & 3), 150, h2, (gg, W2, H2, R) =>
    paint(gg, W2, H2, R, W2 / 2, H2 - 26)), sx - 75, sy - h2 + 26)
}

// ---- a dropped thing lying on the ground ----------------------------------
function drawGroundItem(g, gi, sx, sy, t) {
  const bob = Math.sin(t / 500 + gi.x + gi.y) * 1.6
  g.save(); g.globalCompositeOperation = 'lighter'
  const gr = g.createRadialGradient(sx, sy, 0, sx, sy, 22)
  gr.addColorStop(0, 'rgba(230,196,120,.20)'); gr.addColorStop(1, 'rgba(230,196,120,0)')
  g.fillStyle = gr; g.beginPath(); g.ellipse(sx, sy, 22, 11, 0, 0, 7); g.fill()
  g.restore()
  const ic = itemIcon(gi.item)
  g.drawImage(ic, sx - 17, sy - 24 + bob, 34, 34)
}

// ---------------------------------------------------------------------------
// THE CITIZEN
// ---------------------------------------------------------------------------
function drawPlayer(g, id, p, sx, sy, t, isMe, sc) {
  const f = facing.get('p' + id) ?? [1, 0]
  const away = (f[0] + f[1]) < 0                       // walking up-screen: back turned
  const moving = prevPos.get('p' + id) && (prevPos.get('p' + id)[0] !== p.x || prevPos.get('p' + id)[1] !== p.y)
  const act = p.action?.type
  const swinging = act === 'attack' || act === 'attackp' || act === 'gather'
  // WHAT IS IN THE HAND. A citizen mining with a sword out looked like a citizen
  // punching a rock. Interval needs no tool to gather -- that is the
  // constitution's choice, not the window's -- so this shows the best tool the
  // citizen is actually carrying, and a crude one if they carry none, because
  // the swing has to be legible as mining rather than as fighting.
  const held = p.equipment?.weapon?.item ?? null
  let wep = held
  if (act === 'gather') {
    const n2 = curState?.nodes?.[p.action?.nodeId]
    const carries = (it) => held === it || (p.inventory ?? []).some(sl => sl?.item === it)
    if (n2?.type === 'tree') wep = carries('bronze-hatchet') ? 'bronze-hatchet' : 'axe'
    else if (n2?.type === 'rock' || n2?.type === 'magic-rock') wep = carries('bronze-pickaxe') ? 'bronze-pickaxe' : 'pick'

// ===========================================================================
// THE COMPOSITE
// ---------------------------------------------------------------------------
// Where the passes meet, and where this window stops being a dark reskin and
// starts being a grade.
//
// The direction is the third game's, not the second's, and the difference is
// not "more orange". It is this: WARM LIGHT, COOL SHADOW. Everything the fire
// touches goes amber and blooms past its own edges; everything it does not
// falls toward blue-black rather than neutral. That single opposition is why
// those frames read as painted rather than rasterised, and it is worth more
// than any amount of texture detail.
//
// THERE IS NO NIGHT HERE. Interval's clock still turns -- the tick is the
// tick, the world agrees with itself, and the flat window will still show you
// a sunrise. This window simply declines to look. A window may choose its
// colours and its camera; it may not choose what is TRUE, and what time it is

      }
      g.save(); g.globalCompositeOperation = 'lighter'
      g.strokeStyle = 'rgba(140,210,110,' + (.5 * (1 - k)) + ')'; g.lineWidth = 2
      g.beginPath(); g.ellipse(B.x, by2 + 22, 8 + k * 18, (8 + k * 18) * .45, 0, 0, 7); g.stroke()
      g.restore()
    } else if (f.kind === 'spark') {
      // the anvil answering the hammer
      g.save(); g.globalCompositeOperation = 'lighter'
      for (let q = 0; q < 14; q++) {
        const a = -2.9 + (q / 14) * 2.4, sp = 26 * k
        g.fillStyle = 'rgba(255,' + (200 - q * 6) + ',80,' + (1 - k) + ')'
        g.fillRect(B.x + Math.cos(a) * sp, by2 - 6 + Math.sin(a) * sp * .6 + k * k * 22, 2.2, 2.2)
      }
      const gr = g.createRadialGradient(B.x, by2 - 6, 0, B.x, by2 - 6, 26 * (1 - k))
      gr.addColorStop(0, 'rgba(255,190,90,' + (.5 * (1 - k)) + ')')
      gr.addColorStop(1, 'rgba(255,190,90,0)')
      g.fillStyle = gr; g.beginPath(); g.arc(B.x, by2 - 6, 26 * (1 - k), 0, 7); g.fill()
      g.restore()
    } else if (f.kind === 'shavings') {
      // curls of wood coming off the knife
      for (let q = 0; q < 8; q++) {
        const a = 0.3 + q * 0.5, sp = 14 * k
        g.strokeStyle = 'rgba(180,150,96,' + (1 - k) + ')'; g.lineWidth = 1.6
        const px3 = B.x + Math.cos(a) * sp, py3 = by2 - 4 + Math.sin(a) * sp * .5 + k * k * 26
        g.beginPath(); g.arc(px3, py3, 3, 0, 3.6); g.stroke()
      }
    } else if (f.kind === 'flare') {
      // something caught
      g.save(); g.globalCompositeOperation = 'lighter'
      const r = 10 + k * 34
      const gr = g.createRadialGradient(B.x, by2 + 6, 0, B.x, by2 + 6, r)
      gr.addColorStop(0, 'rgba(255,206,120,' + (.55 * (1 - k)) + ')')
      gr.addColorStop(1, 'rgba(255,140,40,0)')
      g.fillStyle = gr; g.beginPath(); g.arc(B.x, by2 + 6, r, 0, 7); g.fill()
      for (let q = 0; q < 6; q++) {
        g.fillStyle = 'rgba(255,190,90,' + (1 - k) + ')'
        g.fillRect(B.x + Math.sin(q * 2.1 + k * 4) * 12, by2 + 6 - k * 34 - q * 3, 2, 2)
      }
      g.restore()
    } else if (f.kind === 'survey') {
      // taking the measure of a place: rings going out, and the land noted
      g.save(); g.globalCompositeOperation = 'lighter'
      for (let q = 0; q < 3; q++) {
        const kk = k - q * .18; if (kk < 0) continue
        g.strokeStyle = 'rgba(180,214,255,' + (.42 * (1 - kk)) + ')'; g.lineWidth = 1.6
        g.beginPath(); g.ellipse(B.x, by2 + 20, 10 + kk * 74, (10 + kk * 74) * .45, 0, 0, 7); g.stroke()
      }
      g.restore()
    } else if (f.kind === 'act') {
      // the catch-all: a deed with no natural gesture still leaves a ring, so
      // that pressing something always looks like it did something
      g.save(); g.globalCompositeOperation = 'lighter'
      g.strokeStyle = 'rgba(232,209,153,' + (.55 * (1 - k)) + ')'; g.lineWidth = 2 * (1 - k) + .6
      g.beginPath(); g.ellipse(B.x, by2 + 22, 6 + k * 22, (6 + k * 22) * .45, 0, 0, 7); g.stroke()
      g.restore()
    } else if (f.kind === 'still') {
      // the truce: a ring of sigil-light closing over whatever it binds
      g.globalCompositeOperation = 'lighter'
      const r = 46 * (1 - k) + 8
      g.strokeStyle = 'rgba(140,240,240,' + (.8 * (1 - k)) + ')'
      g.lineWidth = 2.4
