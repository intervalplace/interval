const rel = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top } }

cv.addEventListener('pointermove', (e) => {
  const p = rel(e)
  mouse.x = p.x; mouse.y = p.y
  // WHETHER THE POINTER HAS ACTUALLY MOVED SINCE IT WENT DOWN.
  //
  // This is the whole fix for walking in circles. Hold-to-walk chases the tile
  // under the cursor, and because the camera is centred on you that tile keeps
  // its distance no matter how far you walk -- correct for a held-and-dragged
  // button, a trap for a click that merely lasted a moment. A trackpad press is
  // easily 300ms. So: a press that never travels more than eight pixels is a
  // CLICK, and a click walks to one tile and stops.
  if (mouse.down && pressFrom && Math.hypot(p.x - pressFrom.x, p.y - pressFrom.y) > 8) mouse.moved = true
  if (showChart && mouse.down && chartZoom) {
    chartPanX -= (p.x - (chartLast?.x ?? p.x)) / chartZoom
    chartPanY -= (p.y - (chartLast?.y ?? p.y)) / chartZoom
    const W2 = world?.genesis?.worldW ?? dims().W, H2 = world?.genesis?.worldH ?? dims().H
    chartPanX = clamp(chartPanX, 0, W2); chartPanY = clamp(chartPanY, 0, H2)
    chartKey = ''
    chartDragging = true
  }
  chartLast = { x: p.x, y: p.y }
})
let chartLast = null
let pressTimer = null, pressFrom = null
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture?.(e.pointerId)
  const p = rel(e); mouse.x = p.x; mouse.y = p.y
  if (e.button === 2) { primaryClick(p, true); return }
  mouse.down = true; mouse.downAt = performance.now(); mouse.moved = false
  // A phone has no right button, so it has a HOLD instead. 420ms without
  // moving opens the same menu; anything shorter is an ordinary click.
  pressFrom = { x: p.x, y: p.y }
  clearTimeout(pressTimer)
  if (e.pointerType !== 'mouse') pressTimer = setTimeout(() => {
    if (!mouse.down) return
    if (Math.hypot(mouse.x - pressFrom.x, mouse.y - pressFrom.y) > 12) return
    mouse.down = false
    intent = null
    primaryClick({ x: mouse.x, y: mouse.y }, true)
  }, 420)
  primaryClick(p, false)
})
// EVERY WAY A BUTTON CAN COME UP. A pointerup that never arrives -- cancelled
// by the browser, captured elsewhere, lost when the window blurs -- used to
// leave `mouse.down` true forever, and hold-to-walk then chased a receding
// cursor until the end of time. That is the other half of walking in circles.
for (const ev of ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'])
  window.addEventListener(ev, () => {
    mouse.down = false; mouse.moved = false; clearTimeout(pressTimer)
    if (intent?.hold) { intent = null; travelMark = null }   // the button was the order
  })
document.addEventListener('visibilitychange', () => { mouse.down = false; mouse.moved = false })
cv.addEventListener('contextmenu', (e) => e.preventDefault())
cv.addEventListener('wheel', (e) => {
  e.preventDefault()
  if (!showChart) return
  // a sheet is something you move under your hands
  const k = e.deltaY > 0 ? 1 / 1.14 : 1.14
  chartZoom = clamp(chartZoom * k, .55, 14)
  chartKey = ''
}, { passive: false })

function drawLedger(g, title, rows, empty) {
  const W2 = Math.min(430, VW - 16), H2 = Math.min(Math.max(220, VH - PANEL_H - 40), 500)
  const x = Math.round((VW - W2) / 2), y = Math.max(12, (VH - PANEL_H - H2) / 2)
  regions.push({ x, y, w: W2, h: H2, act: { t: 'panebg' } })
  carve(g, x, y, W2, H2)
  plate(g, x + 14, y + 14, W2 - 28, title)
  regions.push({ x: x + W2 - 34, y: y + 12, w: 24, h: 24, act: { t: 'close' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + W2 - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + W2 - 22, y + 25)
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  if (!rows.length) {
    g.font = 'italic 12.5px Georgia, serif'; g.fillStyle = '#6f6250'
    g.fillText(empty, x + 24, y + 62); return
  }
  // TWO COLUMNS, BECAUSE ONE COLUMN LOST THINGS.
  //
  // Rows ran down a single list and simply stopped at the bottom edge: a
  // citizen with a full pack got twenty-eight deposit rows and then nothing,
  // and every withdraw row fell off the sheet unseen and unclickable. The
  // vault has two sides and always did -- what you carry and what you keep --
  // so it is laid out as two, and each side scrolls to what fits.
  const left = rows.filter(r => r.act.t === 'deposit' || r.act.t === 'sell')
  const right = rows.filter(r => r.act.t === 'withdraw' || r.act.t === 'buy')
  const colW = (W2 - 40) / 2
  const heads = [left.length ? (left[0].act.t === 'sell' ? 'YOUR PACK' : 'YOUR PACK') : '',
                 right.length ? (right[0].act.t === 'buy' ? 'FOR SALE' : 'THE VAULT') : '']
  g.font = '600 9.5px Cinzel, Georgia, serif'; g.textAlign = 'left'
  g.save(); g.letterSpacing = '1.5px'; g.fillStyle = 'rgba(141,125,99,.8)'
  if (heads[0]) g.fillText(heads[0], x + 16, y + 46)
  if (heads[1]) g.fillText(heads[1], x + 24 + colW, y + 46)
  g.restore()
  const drawCol = (list, cx2) => {
    let ry = y + 56
    for (const r of list) {
      if (ry > y + H2 - 30) {
        g.font = 'italic 11px Georgia, serif'; g.fillStyle = '#6f6250'
        g.fillText('\u2026 and ' + (list.length - list.indexOf(r)) + ' more', cx2 + 4, ry + 12)
        break
      }
      const hot = inRect(mouse, cx2, ry, colW, 26)
      g.fillStyle = hot ? 'rgba(70,58,26,.85)' : 'rgba(24,20,16,.7)'
      g.fillRect(cx2, ry, colW, 26)
      g.strokeStyle = hot ? '#e8d199' : '#4a3c20'; g.lineWidth = 1
      g.strokeRect(cx2 + .5, ry + .5, colW - 1, 25)
      g.drawImage(itemIcon(r.item), cx2 + 3, ry + 2, 22, 22)
      g.font = '12px Georgia, serif'; g.fillStyle = '#cdbb99'
      g.textAlign = 'left'
      g.fillText(wordy(r.item) + (r.qty > 1 ? ' \u00d7' + r.qty : ''), cx2 + 29, ry + 17, colW - 34)
      regions.push({ x: cx2, y: ry, w: colW, h: 26, act: r.act,
                     tip: { title: wordy(r.item), sub: r.right, col: rarityOf(r.item) } })
      ry += 29
    }
  }
  drawCol(left, x + 16)
  drawCol(right, x + 24 + colW)
  g.textAlign = 'left'
}
function drawVault(g) {
  const me = myId && curState?.players?.[myId]
  const rows = []
  for (const [i, sl] of (me?.inventory ?? []).entries())
    if (sl) rows.push({ item: sl.item, qty: sl.qty ?? 1, right: 'deposit \u2192', act: { t: 'deposit', slot: i } })
  for (const [it, q] of Object.entries(me?.bank ?? {}))
    if (q > 0) rows.push({ item: it, qty: q, right: '\u2190 withdraw', act: { t: 'withdraw', item: it } })

// whichever node of a type the citizen is stood beside, if any
function adjacentNodeOfType(type) {

  if (!me2) return null
  for (const n of Object.values(s2.nodes ?? {}))
    if (n.type === type && Math.abs(n.x - me2.x) + Math.abs(n.y - me2.y) <= 1) return n

function drawCounter(g) {
  const me = myId && curState?.players?.[myId]
  const rows = []
  for (const [it, price] of Object.entries(STORE_SELLS))
    rows.push({ item: it, qty: 1, right: 'buy \u00b7 ' + price + 'g', act: { t: 'buy', item: it } })
  // THE SHELF, which this never once showed.
  //
  // A store has held whatever citizens sold it since v0.74, and the counter
  // only ever listed the keeper's own goods and your own pack. So a citizen
  // sold ore, the ore went onto the shelf exactly as the constitution says,
  // and the window told them nothing had happened. It was invisible while the
  // keeper still conjured seeds; the moment a store made nothing, the counter
  // went blank and the bug had nowhere left to hide.
  const st = adjacentNodeOfType('store')
  const purse = st?.coin ?? 1200
  const ask = (it) => (PRICES[it] ?? 0) + Math.max(1, Math.floor((PRICES[it] ?? 0) / 10))
  for (const [it, q] of Object.entries(st?.shelf ?? {})) {
    if (!(q > 0)) continue
    rows.push({ item: it, qty: q, right: 'buy \u00b7 ' + ask(it) + 'g', act: { t: 'buy', item: it } })
  }
  for (const [i, sl] of (me?.inventory ?? []).entries()) {
    if (!sl || !PRICES[sl.item]) continue
    // A KEEPER WHO CANNOT PAY SHOULD SAY SO, not refuse a click in silence.

    rows.push({ item: sl.item, qty: sl.qty ?? 1,
      right: owed > purse ? 'the purse is short' : 'sell \u00b7 ' + owed + 'g',
      dim: owed > purse,
      act: owed > purse ? { t: 'nope' } : { t: 'sell', slot: i } })
  }
  drawLedger(g, 'The Counter \u00b7 purse ' + purse + 'g', rows,
    'The shelf is empty. A store holds only what citizens bring in \u2014 sell '
    + 'something here, or find a stall for goods made new.')
}

const _runRegion = runRegion
runRegion = function (r, isRight) {
  const a = r.act

  if (a.t === 'buystall') { send({ do: 'buy', item: a.item }); SFX.pane(); return }

  if (a.t === 'sell') { send({ do: 'sell', slot: a.slot }); SFX.gold(); return }
  return _runRegion(r, isRight)

let lastFrame = performance.now()

let lastRegions = []
function frame(now) {

  // NO SILENT CATCH HERE. This was `try { drawFace() } catch {}`, which is a
  // fine way to keep a frame loop alive and a terrible way to find out why a
  // picker never appeared for somebody: it failed invisibly, and the report
  // that came back was "there was no picker" with nothing to go on. It reports
  // itself once and then stops trying.
  if (!entered && !faceBroken) {
    try { drawFace() }
    catch (e) {
      faceBroken = true
      say('The portrait would not draw: ' + (e?.message ?? e), 'warn')
      console.error('drawFace:', e)

  }
  layoutPanel()                          // the slab is measured from the viewport

  // ---- the camera eases toward the citizen --------------------------------
  const me = myId && s?.players?.[myId]
  if (me) {
    const t = renderT(now)
    const [tx, ty] = lerpPos('p' + myId, me.x, me.y, t)
    if (!camReady) { camX = tx; camY = ty; camReady = true }
    const k = 1 - Math.pow(0.0016, dt / 1000)
    camX += (tx - camX) * k; camY += (ty - camY) * k
  }

  ambience(now)
  flashRed = Math.max(0, flashRed - dt / 700)
  flashGold = Math.max(0, flashGold - dt / 900)
  shake = Math.max(0, shake - dt / 60)

  // ---- hold the button down and keep walking ------------------------------
  const onChrome = !!hitRegion(mouse) || !!menu
    || (mouse.y > PANEL_Y && mouse.x > PANEL_X && mouse.x < PANEL_X + PANEL_W)
  // HOLD TO KEEP WALKING -- but only while the button is genuinely held, and
  // only while the cursor is somewhere else. The camera is centred on you, so
  // the tile under a screen-fixed cursor RECEDES as you walk toward it; that is
  // the right behaviour for a held button and a trap for a slightly long click.
  // Stopping once the cursor is within a tile is what makes it terminate.

      && now - mouse.downAt > 260 && (!intent || intent.kind === 'walk')) {
    const w = worldOf(mouse.x, mouse.y)

    if (!far) { if (intent?.hold) { intent = null; travelMark = null } }

  // Chrome wins over world. A beast standing behind the control panel -- or
  // behind an open pane -- is not something you can reach, and offering the
  // crosshair for it is a lie. Every pane pushes its own background as a
  // region, so this one test covers all of them.
  lastRegions = regions

  tipAt = null
  hover = (entered && !showChart && !onChrome) ? pickWorld(mouse) : null

  cx.setTransform(DPR, 0, 0, DPR, 0, 0)
  cx.clearRect(0, 0, VW, VH)

  drawScene(now)

  cx.setTransform(1, 0, 0, 1,
    shake > .1 ? (Math.random() - .5) * shake * DPR : 0,
    shake > .1 ? (Math.random() - .5) * shake * DPR : 0)
  cx.drawImage(sceneCv, 0, 0)
  cx.setTransform(DPR, 0, 0, DPR, 0, 0)

  if (showChart) drawChart(cx, now)

  // ---- the panes, then the panel, then the tip, then the hand -------------
  if (entered) {
    if (paneLeft === 'citizen') drawCitizen(cx, now)
    if (paneRight === 'pack') drawPack(cx, now)
    if (paneModal === 'guide') drawGuide(cx)
    if (paneModal === 'mystall') drawMyStall(cx)
    if (paneModal === 'forge') drawForge(cx, now)
    else if (paneModal === 'bank') drawVault(cx)
    else if (paneModal === 'store') drawCounter(cx)
    else if (paneModal === 'stall') drawStall(cx)
    // THE LOG GOES LAST, OVER EVERYTHING.
    //
    // It was drawn before the panes, and the vault is a five-hundred-pixel
    // sheet in the middle of the screen -- so a refusal arriving while the
    // vault was open was painted and then immediately covered. "Nothing happens
    // when I click withdraw" is what a refused input looks like when the
    // sentence explaining it is underneath the thing you clicked.
    drawLog(cx, now)
    drawPanel(cx, now)
    drawBeastBar(cx)
    drawMenu(cx)

    // the region under the cursor may want to say something
    const r = hitRegion(mouse)
    if (r && r.tip) tipAt = r.tip
    else if (hover && hover.kind === 'node') {
      const v = verbFor('node', hover.e)
      // A PERSON IS A NAME, NOT A TYPE.
      //
      // This showed `wordy(kind ?? type)`, so hovering the arms-master said
      // "ARMS" and hovering a neighbour said "KEEPER" -- their names have been
      // on the nodes since the fourth founding and the tip never looked. You
      // had to walk over and click somebody to find out who they were.
      //
      // A name over a calling, or a name alone for somebody who lives in a
      // house and does no particular job.
      if (hover.e.type === 'keeper' || hover.e.type === 'smith' || hover.e.type === 'guard' || hover.e.type === 'crier') {
        const who = hover.e.name || residentName(hover.e)
        const call = hover.e.kind ? CALLING_NAME[hover.e.kind]
          : hover.e.type === 'smith' ? 'the smith'
          : hover.e.type === 'crier' ? 'the town crier'
          : hover.e.type === 'guard' ? 'the guard' : null
        tipAt = { title: who, sub: call ? titleCase(call.replace(/^the /, '')) : null, col: '#d9c9a0' }
      } else {
        // the window names what it DREW: a `house` node is a fireplace
        const noun = v === 'hearth' ? 'hearth' : wordy(hover.e.kind ?? hover.e.type)
        tipAt = { title: noun, sub: VERB_WORD[v] ?? null }
      }
    } else if (hover && hover.kind === 'player') {
      tipAt = { title: hover.e.name || hover.id.slice(0, 8), sub: callingOf(hover.e), col: '#9fb0c4' }
    }
    if (!menu) drawTip(cx)
    drawPlaceBanner(cx, now)
    drawLevelBanner(cx, now)

    // ---- the state of the wire, small, top right --------------------------
    cx.textAlign = 'right'; cx.textBaseline = 'alphabetic'
    cx.font = '600 9px Cinzel, Georgia, serif'
    cx.fillStyle = connected ? 'rgba(141,125,99,.55)' : 'rgba(201,139,90,.9)'
    cx.save(); cx.letterSpacing = '1.5px'
    cx.fillText(connected
      ? ('TICK ' + (s?.tick ?? 0) + (usingRelay ? '  \u00b7  RELAYED' : '  \u00b7  SIGNED HERE')
         + (hiq() ? '' : '  \u00b7  Q FOR BLOOM'))
      : 'NO SIGNAL', VW - 14, 18)
    cx.restore()

    drawCursor(cx)
  }
  requestAnimationFrame(frame)
}

// ===========================================================================
// MUSIC, IF THIS WORLD HAS ANY
// ---------------------------------------------------------------------------
// The pillar serves whatever sits in its audio/ directory and nothing more. A
// world with no music plays none, silently: no missing-file noise, no broken
// control. This window asks for the deep arrangement first, because it is the
// one standing at the bottom of the light.
//
// Heard ONCE, on arrival, and then the world is quiet. A piece with a shape to
// it gets worse every time round.
let musicOn = localStorage.getItem('interval-music') !== 'off'
let MUSIC = null, musicStarting = false
// THE THEME IS THE DOOR'S, NOT THE WORLD'S.
//
// It used to start when you entered, which is backwards: a theme is what plays
// while you are deciding, and the moment you walk in is the moment it should
// give way to the sound of the place. So it starts as early as a browser will
// permit -- an attempt on load for anyone the browser already trusts, and
// otherwise the first gesture, which at a gate is usually the face arrows or
// the name box -- and it fades out over a couple of seconds when the gate
// opens rather than striking up.
// EVERY THEME EVER STARTED, not just the one we are holding.
//
// `MUSIC` is a handle on the CURRENT track, and the fade only knew about that
// one. But more than one can exist: the attempt made at load has a play()
// promise that does not reject everywhere -- some browsers leave it pending
// and resolve it the moment you make a gesture, which starts a track that
// nothing holds a reference to. `MUSIC` has moved on by then, so the fade
// silenced the handle and the ghost played on, forever, with no way to stop
// it. Keep the list. Silence the list.
const THEMES = []
function fadeMusicOut(ms) {
  themeSpent = true

  const doomed = THEMES.splice(0)
  if (!doomed.length) return
  // A TIMER, NOT A FRAME. requestAnimationFrame stops when the tab is hidden,
  // so a fade begun and then tabbed away from would freeze half-done and the
  // theme would play on until you came back -- which is the same complaint
  // arriving by a different road. A fade is a fact about time, not about
  // painting, and it must finish whether or not anyone is looking.
  const t0 = performance.now()
  const v0 = doomed.map(a => { try { return a.volume } catch { return .34 } })
  const silence = () => { for (const a of doomed) { try { a.pause(); a.src = '' } catch {} } }
  const timer = setInterval(() => {
    const k = (performance.now() - t0) / ms
    if (k >= 1) { clearInterval(timer); silence(); return }
    doomed.forEach((a, i) => { try { a.volume = v0[i] * (1 - k) } catch {} })
  }, 40)
  // and a hard stop, in case the timer is throttled to nothing in a background
  // tab: whatever else happens, these are silent when the fade should be over
  setTimeout(() => { clearInterval(timer); silence() }, ms + 250)
}
// THE THEME NEVER PLAYED AT THE DOOR, AND OFTEN NEVER PLAYED AT ALL.
//
// Three faults, compounding. It was only ever started by enterWorld, so the
// gate -- the one moment a theme is actually for -- was silent by
// construction. `musicTried` latched on the FIRST attempt and was only
// cleared when play() itself was rejected, so a failed fetch (or a slow one
// during boot) disabled music permanently for the session. And nothing ever
// called it again: the sound button adjusted the volume of a track that did
// not exist, which is why toggling it did nothing at all.
//
// A browser will not start audio without a gesture, so the honest place to
// begin is the first gesture, wherever it lands -- including the click that
// opens the gate.
let themeSpent = false
async function startMusic() {
  // THE THEME IS SPENT ONCE YOU ARE THROUGH THE DOOR.
  //
  // fadeMusicOut sets MUSIC to null so the fade can own the element -- and the
  // gesture listener starts the theme whenever MUSIC is null and somebody
  // clicks. So the fade ran correctly, and then the first click INSIDE the
  // world started the theme over. Every click after that did it again, which
  // is why it never stopped: it was not still playing, it was starting again,
  // repeatedly, on the walk.
  //
  // A theme belongs to the door. Past the door there is only the place.
  if (themeSpent || entered) return
  if (MUSIC || musicStarting || !musicOn || !soundOn) return
  musicStarting = true
  let tracks = []
  try { tracks = (await (await fetch('/api/audio')).json()).tracks ?? [] }
  catch { musicStarting = false; return }      // a failed fetch is not a verdict
  if (!tracks.length) { musicStarting = false; return }
  const pick = (stem) => tracks.find(n => n.toLowerCase().startsWith(stem))
  const name = pick('theme-deep') ?? pick('theme') ?? tracks[0]
  if (!name) { musicStarting = false; return }
  const a = new Audio('/audio/' + encodeURIComponent(name))
  a.loop = false; a.volume = 0
  MUSIC = a
  THEMES.push(a)
  a.addEventListener('ended', () => { if (MUSIC === a) MUSIC = null })   // a theme plays once
  try { await a.play() }
  catch {
    // a refused start must clean up after itself, or it sits in the list as a
    // silent element that a browser may decide to honour later
    try { a.pause(); a.src = '' } catch {}
    const i = THEMES.indexOf(a); if (i >= 0) THEMES.splice(i, 1)
    if (MUSIC === a) MUSIC = null
    musicStarting = false
    return
  }
  // and if the door opened while we were waiting on that promise, this track
  // was never wanted: some browsers resolve play() only once a gesture lands,
  // which can be the very click that enters the world
  if (themeSpent || entered) {
    try { a.pause(); a.src = '' } catch {}
    const i = THEMES.indexOf(a); if (i >= 0) THEMES.splice(i, 1)
    if (MUSIC === a) MUSIC = null
    musicStarting = false
    return
  }
  musicStarting = false
  const t0 = performance.now()
  const fade = () => {
    if (!MUSIC) return
    const k = Math.min(1, (performance.now() - t0) / 4000)
    MUSIC.volume = (musicOn && soundOn) ? .34 * k : 0
    if (k < 1) requestAnimationFrame(fade)
  }
  requestAnimationFrame(fade)
}

// ===========================================================================
// THE DOOR
// ===========================================================================
const gate = document.getElementById('gate')
const gName = document.getElementById('gname')
// ---------------------------------------------------------------------------
// §0: NOUGHT. Every key the world does not hold is in Nought, and every key is
// until it crosses. This gate is the threshold, and §0e binds it three ways:

}

// §0: NOUGHT, RUN HERE. The window runs the REAL ENGINE -- engine.js itself,

// drift, and the first thing a resident would learn would be a lie about how
// the world works. Nothing computed here leaves this machine.
//
// The body in Nought carries its OWN keypair, minted here and thrown away at
// the crossing: a citizen on a pillar-held identity cannot sign locally, and a

// key the world is asked about; `myId` is swapped to the local body, so every

let inNought = false, realId = null, nought = null, noughtLoading = false, lastLive = null

//
// Their worlds are not ours -- a tree we felled still stands in theirs, their
// tick is not our tick -- so they are drawn walking the same ground and nothing
// else is shared. That is honest, and it is the whole of what was ever
// promised: the gossip exists so the place is populated, not so it is proved.
//
// They all carry the same name, because everyone here does. A crowd of people
// all called `nought`, on an island where nothing counts, is its own way of
// saying where you are.
const peers = new Map()          // id -> { x, y, look, seen }
function noughtPeerSaw(at) {
  if (!at || at.id === myId) return
  peers.set(at.id, { x: at.x, y: at.y, look: at.look | 0, seen: Date.now() })
}
function noughtPeerSend() {
  if (!nought || ws.readyState !== 1) return
  const me = nought.state.players[myId]; if (!me) return
  try { ws.send(JSON.stringify({ type: 'nought', at: { id: myId, x: me.x, y: me.y, look: pickLook ?? 0 } })) } catch {}
}
// a render-only copy: the peers are drawn, never ticked, and never touch the
// local world's state
function withPeers(st) {
  if (!peers.size) return st
  const now = Date.now()
  const v = Object.create(Object.getPrototypeOf(st)); Object.assign(v, st)
  v.players = { ...st.players }
  for (const [id, q] of peers) {
    if (now - q.seen > 12000) { peers.delete(id); continue }   // gone quiet: gone
    if (v.players[id]) continue
    v.players[id] = {
      x: q.x, y: q.y, hp: 10, gold: 0, name: NOUGHT_PEER_NAME, look: q.look,
      action: null, trade: null, consignment: null, lastInput: st.tick,
      equipment: { weapon: null, head: null, body: null, offhand: null, legs: null },
      bank: {}, inventory: new Array(28).fill(null), skills: st.players[myId].skills,
    }
  }
  return v
}
const NOUGHT_PEER_NAME = 'nought'


function noughtBanner(on) {
  const cv = document.querySelector('canvas')

    if (fountainEl) fountainEl.style.display = 'none'
    document.getElementById('ncard')?.remove()
    return
  }
  if (!bannerEl) {

      + 'color:#9a8f78;background:linear-gradient(rgba(0,0,0,0),rgba(8,7,5,.86));'

// A resident is owed one thing at all times: how long until the world will
// have them.
let hudEl = null
function noughtHud(s) {
  if (!s) { if (hudEl) hudEl.style.display = 'none'; return }
  if (!hudEl) {
    hudEl = document.createElement('div')
    hudEl.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:70;'
      + 'font:11px/1.5 ui-monospace,monospace;letter-spacing:.08em;color:#d8c69a;'
      + 'background:rgba(10,7,5,.84);border:1px solid #46372a;padding:5px 13px;'
      + 'border-radius:2px;pointer-events:none;text-align:center'
    document.body.appendChild(hudEl)
  }
  // THE OTHER WORLD, IN NUMBERS, WHILE YOU STAND IN THIS ONE. A newcomer cannot
  // tell there are two worlds because they have only ever seen one, and telling
  // them does not fix it. Showing does: Tallyholm's real tick and real
  // population, counting up beside a wait that is counting down.
  const w = myWait(s)
  const live = Math.max(0, Object.keys(s.players ?? {}).length)
  const who = live === 1 ? '1 person is' : live + ' people are'
  const left = !w || w.stale ? null : w.ripe ? 0 : VIGIL_TICKS - w.age
  hudEl.style.display = ''
  hudEl.innerHTML = '<b style="color:#e0a94a">You are not in Tallyholm yet.</b> '
    + who + ' there now, at tick ' + (s.tick ?? 0).toLocaleString() + '.'
    + '<br><span style="color:#9a8f78">'
    + (left === null ? 'Asking the world to expect you\u2026'
      : left === 0 ? 'You can cross now \u2014 the fountain in Anchor.'
      : 'You can cross in ' + wordFor(left) + '.')
    + '</span>'
}
// the crossing is offered AT THE FOUNTAIN, on foot, and nowhere else
let crossingOpen = false
function openCrossing() { crossingOpen = true; gate.classList.remove('gone'); updateNoughtGate(curState) }
function closeCrossing() { crossingOpen = false; crossArmed = false; if (entered) gate.classList.add('gone') }

// The gate, every tick, while a soul is still in Nought.
function updateNoughtGate(s) {
  if (!s || !gEnter || entered) return
  keepAttending(s)
  if (!inNought) { gEnter.textContent = 'Enter the world'; gEnter.disabled = false; return }
  const w = myWait(s), out = keyExported()
  if (!crossingOpen) {
    // §0e: A WINDOW OPENS IN NOUGHT. Walking in is not crossing and asks
    // nothing: the island is open from the first interval, and the wait runs
    // while you walk it.
    gEnter.disabled = !myId
    gEnter.textContent = 'Walk into Nought'
    if (gWhy) gWhy.textContent = 'Tallyholm, unwalked. Nothing here is in the world, nothing here is lost, and the fountain in Anchor is the way out.'
    crossArmed = false
  } else if (!w || !w.ripe) {
    gEnter.disabled = true
    gEnter.textContent = w && !w.stale
      ? 'The world will admit you in ' + wordFor(VIGIL_TICKS - w.age)
      : 'Waiting for the world to see you\u2026'
    if (gWhy) gWhy.textContent = w && !w.stale
      ? 'You are in Nought: the island unwalked, before anyone. Nothing you do here is in the world.'
      : 'The world has not seen you yet.'
    crossArmed = false
  } else if (!out) {
    gEnter.disabled = true
    gEnter.textContent = 'Take your key before you cross'
    if (gWhy) gWhy.textContent = 'Your key IS your citizen. Copy it out of this browser first \u2014 there is no other copy and no way back to one.'
  } else if (!crossArmed) {
    gEnter.disabled = false
    gEnter.textContent = 'Draw from the fountain'
    if (gWhy) gWhy.textContent = 'The fountain stands in Anchor, beside the tile you will wake on.'
  } else {
    gEnter.disabled = false
    gEnter.textContent = crossSentAt >= 0 ? 'Waiting your turn at the fountain\u2026' : 'Cross. This cannot be undone'
    if (gWhy) gWhy.textContent = 'Everything you hold and learned in Nought ends here. '
      + 'This key can never be in Nought again, in this world, ever. The key is the only thing that crosses.'
  }
}
const gWhy = document.getElementById('gwhy')
const gEnter = document.getElementById('genter')

{ const sb = document.getElementById('gsound')
  sb.textContent = 'Sound: ' + (soundOn ? 'on' : 'off')
  sb.addEventListener('click', () => {
    soundOn = !soundOn
    localStorage.setItem('interval-sound', soundOn ? 'on' : 'off')
    sb.textContent = 'Sound: ' + (soundOn ? 'on' : 'off')
    if (MUSIC) MUSIC.volume = (soundOn && musicOn) ? .34 : 0
    if (soundOn) { SFX.ctx(); startMusic() }
  })
}
// A browser suspends its audio whenever the tab loses focus, and iOS suspends
// it more or less whenever it feels like it. Every gesture is a chance to wake
// it up again; this costs nothing when it is already awake.
for (const ev of ['pointerdown', 'keydown', 'touchstart'])
  window.addEventListener(ev, () => { if (soundOn) { SFX.ctx(); startMusic() } }, { passive: true })
document.addEventListener('visibilitychange', () => { if (!document.hidden && soundOn) SFX.ctx() })
{ const mb = document.getElementById('gmusic')
  const label = () => { mb.textContent = 'Theme: ' + (musicOn ? (soundOn ? 'on' : 'on (sound off)') : 'off') }
  label()
  mb.addEventListener('click', () => {
    musicOn = !musicOn
    localStorage.setItem('interval-music', musicOn ? 'on' : 'off')
    // TURNING THE THEME ON MEANS TURNING IT ON.
    //
    // startMusic() also requires `soundOn`, so with sound off the theme button
    // was a switch wired to nothing -- which is exactly what happened: both
    // read "off", the theme never played, and so there was nothing to fade
    // when the gate opened. Asking for the theme now asks for sound too.
    if (musicOn && !soundOn) {
      soundOn = true
      localStorage.setItem('interval-sound', 'on')
      const sb = document.getElementById('gsound')
      if (sb) sb.textContent = 'Sound: on'
      SFX.ctx()
    }
    label()
    if (!musicOn) { for (const a of THEMES.splice(0)) { try { a.pause(); a.src = '' } catch {} } ; MUSIC = null }
    else startMusic()
  })
}
{ const qb = document.getElementById('gquality')
  const label = () => { qb.textContent = 'Bloom: ' + (hiq() ? 'on' : 'off') }
  label()
  qb.addEventListener('click', () => {
    QUALITY = hiq() ? 'low' : 'high'
    localStorage.setItem('interval-quality', QUALITY)
    label()
  })
}
document.getElementById('gkey').addEventListener('click', async () => {
  const k = await exportKey()
  if (!k) { gWhy.textContent = 'This browser has no key of its own; the pillar holds one for you.'; return }
  try { await navigator.clipboard.writeText(k); gWhy.textContent = 'Key copied. It is the only copy. Keep it somewhere.' }
  catch { window.prompt('Your key. Copy it and keep it:', k) }
  markKeyExported()
  if (curState) updateNoughtGate(curState)
})
document.getElementById('gimport').addEventListener('click', async () => {
  const str = window.prompt('Paste a key (interval-key-v1.\u2026 or an identity JSON):')
  if (!str) return
  const err = await importKey(str)
  gWhy.textContent = err ?? 'Key accepted. Reloading as that citizen\u2026'
  if (!err) setTimeout(() => location.reload(), 700)
})

// WHO IS ALREADY STANDING THERE.
//
// The gate said "Name yourself" and offered "unnamed" to everybody -- including
// a citizen who claimed a name three hundred levels ago and whose key is
// sitting in this browser. The state arrives over the socket before anyone
// presses anything, so the door has known the answer all along and simply
// never asked. A door that greets you by name is not a flourish; being told
// you are unnamed when you are not is the window contradicting the world.
let gateShown = ''
function refreshGate() {
  if (entered || !gate || gate.classList.contains('gone')) return
  const me = myId && curState?.players?.[myId]
  const label = document.querySelector('#gate label')
  const sig = me ? (me.name ?? '') + ':' + standingOf(me) : 'new'
  if (sig === gateShown) return
  gateShown = sig
  if (me?.name) {
    // known, and named: there is nothing to ask
    label.textContent = 'You are known here'
    gName.style.display = 'none'
    gEnter.textContent = 'Enter as ' + me.name
    gWhy.textContent = titleCase(callingOf(me)) + ' \u00b7 standing ' + standingOf(me)
  } else if (me) {
    // known, but never claimed a name
    label.textContent = 'Name yourself'
    gName.style.display = ''
    gEnter.textContent = 'Enter as ' + myId.slice(0, 6)
    const st = standingOf(me)
    gWhy.textContent = st >= 50
      ? 'You have standing ' + st + ' \u2014 enough to claim a name, once and forever.'
      : 'You have walked here before. A name asks for 50 standing; you have ' + st + '.'
  } else {
    label.textContent = 'Name yourself'
    gName.style.display = ''
    gEnter.textContent = 'Enter the world'
    gWhy.textContent = 'A name costs 50 standing. You may walk in without one.'
  }
}

// CHOOSING AN APPEARANCE. Not a face: the portrait is a whole person, and
// what the seed picks is build, skin, hair, beard and coat together.
//
// The citizen turns on the spot while you scrub through, because a portrait
// that does not move tells you nothing about how they will read in the world --
// and the world is where you will be looking at them. It is the same painter
// the world uses, at the same scale rules, so what you pick is what you get.
const gFace = document.getElementById('gface')
let pickLook = Number(localStorage.getItem('interval-look'))
if (!Number.isInteger(pickLook) || pickLook < 0 || pickLook > 255) pickLook = null
let faceTurn = 0, faceBroken = false
function drawFace() {
  if (!gFace) return
  const fg = gFace.getContext('2d')
  const me = myId && curState?.players?.[myId]
  const n = pickLook ?? (Number.isInteger(me?.look) ? me.look
    : (hash32(String(myId ?? 'x')) & 255))
  const L = lookOf({ look: n }, myId)
  fg.setTransform(1, 0, 0, 1, 0, 0)
  fg.clearRect(0, 0, gFace.width, gFace.height)
  faceTurn += .012
  // THE SAME OPTIONS THE WORLD WILL USE, or the portrait is a promise the
  // world does not keep. It was passing `tunic` where drawPlayer passes gear,
  // and no equipment at all, so the figure at the door wore pauldrons the
  // citizen does not own and a coat colour the world would never show.
  const me2 = myId && curState?.players?.[myId]
  humanoid(fg, gFace.width / 2, gFace.height - 18, {
    scale: 2.5, bulk: L.bulkish, seed: L.seed,
    skin: L.skin, hair: L.hair, hairStyle: L.hairStyle, beard: L.beard,
    coat: L.coat,
    cloak: me2?.equipment?.body?.item ? undefined : undefined,
    cape: me2 ? capeOf(me2) : null,
    step: Math.sin(faceTurn) * .5, breath: faceTurn * 2,
    lean: Math.sin(faceTurn) * 2.2, swing: -0.5 + Math.sin(faceTurn * .7) * .12,
    lantern: true,
  })
  const gl = document.getElementById('glook')
  if (gl) gl.textContent = 'appearance ' + (n + 1) + ' of ' + LOOK_COUNT
}
// AN APPEARANCE IS RECONCILED, NOT ANNOUNCED.
//
// This used to be `setTimeout(() => send(look), 900)` from enterWorld, which
// is a race and lost it: every input is judged against the state at its tick,
// and the first thing a new citizen does is `spawn`. `if (!p) return false` --
// the player must exist. Nine hundred milliseconds after the click is one and
// a half ticks, so the look was routinely judged against a world the citizen
// had not appeared in yet, refused once, and never tried again. It looked
// exactly like the verb not existing.
//
// So it is not an announcement. It is a standing difference between what the
// citizen wants and what the world records, and the window keeps closing it
// until they agree. Every tick, cheaply, and it stops the moment it lands.
let lookSentAt = -99
function reconcileLook(s) {
  if (pickLook === null || !entered || !myId) return
  const me = s?.players?.[myId]
  if (!me) return                       // not spawned yet: there is nobody to dress
  if (me.look === pickLook) return      // agreed
  if ((s.tick ?? 0) - lookSentAt < 3) return
  lookSentAt = s.tick ?? 0
  send({ do: 'look', look: pickLook })
}

function nudgeLook(d) {
  const me = myId && curState?.players?.[myId]
  const cur = pickLook ?? (Number.isInteger(me?.look) ? me.look
    : (hash32(String(myId ?? 'x')) & 255))
  pickLook = (cur + d + LOOK_COUNT) % LOOK_COUNT
  localStorage.setItem('interval-look', String(pickLook))
  drawFace()
}
document.getElementById('gprev')?.addEventListener('click', () => nudgeLook(-1))
document.getElementById('gnext')?.addEventListener('click', () => nudgeLook(1))

function enterWorld() {
  const n = gName.value.trim().toLowerCase()
  if (n && !/^[a-z0-9-]{1,12}$/.test(n)) { gWhy.textContent = 'Names are 1\u201312 of a\u2013z, 0\u20139 and the hyphen.'; return }
  if (n && (n.startsWith('-') || n.endsWith('-'))) { gWhy.textContent = 'A name cannot begin or end with a hyphen.'; return }
  // §0e: A CROSSING IS AN ACT AND IS NOT COMPLETED ON A SINGLE PRESS. The
  // first press arms it and says what is about to happen; the second does it.
  // This window used to send `spawn` from inside the door-opening, which made
  // the one irreversible thing in the world a side effect of pressing Enter.
  if (inNought && crossingOpen) {
    const w0 = myWait(curState)
    if (!w0 || !w0.ripe || !keyExported()) { updateNoughtGate(curState); return }
    if (!crossArmed) { crossArmed = true; updateNoughtGate(curState); return }
    pendingName = n
    crossSentAt = curState.tick
    send({ do: 'spawn' })
    updateNoughtGate(curState)
    say('You draw from the fountain in Anchor.', 'good')
    return                       // Nought does not end until the world says so
  }
  if (inNought) {
    pendingName = n
    entered = true
    gate.classList.add('gone')
    SFX.ctx(); fadeMusicOut(2200)
    say('You are in Nought: Tallyholm before anyone walked it.', 'good')
    say('Nothing you do here is in the world. Return to the fountain when you are ready.', 'dim')
    return
  }
  pendingName = n
  entered = true
  gate.classList.add('gone')
  SFX.ctx()
  fadeMusicOut(2200)
  say('You wake in Interval.', 'good')
  const already = myId && curState?.players?.[myId]?.name
  if (n && !already) setTimeout(() => send({ do: 'name', name: n }), 1400)
  // The appearance is NOT sent from here. See reconcileLook: a timer racing
  // the spawn is exactly how this failed.
}
gEnter.addEventListener('click', enterWorld)
gName.addEventListener('keydown', (e) => { if (e.key === 'Enter') enterWorld() })

// ===========================================================================
// BOOT
// ===========================================================================
resize()
configure({ worldW: 320, worldH: 200, generator: 'interval-expanse-v3', seed: '' })
say('Listening for the world\u2026', 'dim')
connect()
startMusic()          // some browsers allow this outright; the rest wait for a gesture
requestAnimationFrame(frame)

// ---------------------------------------------------------------------------
// THE WAYS
// ---------------------------------------------------------------------------
// `p.attuned` has been an array of up to sixty-four since the constitution was
// written, and recall accepts any stone in it -- from anywhere that is not the
// Wilds. The window only ever offered the one you were standing next to, which
// made a list of sixty-four places into a list of one.
//
// So: every stone you have stood on, by the name of the country it stands in,
// with how far away it is. It is not a map and not a menu of powers; it is the
// set of places this citizen has been and can get back to.
// 6ch: THE WAYS pane is gone with the ways. A drawer listing the stones a
// citizen had attuned to, and offering to fold the road, describes nothing
// that exists: there are no stones and there is no recall. The key that
// opened it and the tab that named it go with it.

// ---------------------------------------------------------------------------
// THE STALL
// ---------------------------------------------------------------------------
// One trade, a short list, and the price on the board. No haggling, no stock
// to run out, no shelf of other people's leavings -- everything a general
// store is, this deliberately is not. A citizen should be able to read the
// whole of it in a second and know whether they can afford it.
let stallNode = null
function openStall(n) { stallNode = n; togglePane('stall'); SFX.pane() }
function drawStall(g) {
  const s = curState; if (!s) return
  const n = stallNode && s.nodes?.[stallNode.id ?? '']
    ? s.nodes[stallNode.id] : stallNode
  if (!n) { paneModal = null; return }
  const kind = n.kind ?? 'lumber'
  const stock = Object.entries(STALL_STOCK[kind] ?? {})
  const me = myId && s.players[myId]
  const W2 = Math.min(330, VW - 40)
  const H2 = 108 + stock.length * 34
  const x = (VW - W2) / 2, y = Math.max(12, (VH - PANEL_H - H2) / 2)
  regions.push({ x, y, w: W2, h: H2, act: { t: 'panebg' } })
  carve(g, x, y, W2, H2)
  g.textAlign = 'center'
  g.save(); g.letterSpacing = '3px'; g.font = '700 13px Cinzel, Georgia, serif'
  g.fillStyle = '#e8d199'
  g.fillText((STALL_NAME[kind] ?? 'a trader').toUpperCase(), x + W2 / 2, y + 26); g.restore()
  g.font = 'italic 11.5px Georgia, serif'; g.fillStyle = '#8a7f68'
  g.fillText('dearer than the store, and always here', x + W2 / 2, y + 44)
  regions.push({ x: x + W2 - 34, y: y + 12, w: 24, h: 24, act: { t: 'close', which: 'modal' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + W2 - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + W2 - 22, y + 25); g.textBaseline = 'alphabetic'
  g.textAlign = 'left'
  let ry = y + 60
  for (const [item, price] of stock) {
    const canAfford = (me?.gold ?? 0) >= price
    const hot = inRect(mouse, x + 14, ry, W2 - 28, 30)
    g.fillStyle = hot && canAfford ? 'rgba(70,58,26,.85)' : 'rgba(24,20,16,.7)'
    g.fillRect(x + 14, ry, W2 - 28, 30)
    g.strokeStyle = hot && canAfford ? '#e8d199' : '#4a3c20'; g.lineWidth = 1
    g.strokeRect(x + 14.5, ry + .5, W2 - 29, 29)
    // itemIcon RETURNS a sprite, it does not draw one. Calling it as though it
    // painted meant the context was passed as the item name: no error, no
    // icon, and a row that looked empty.
    g.drawImage(itemIcon(item), x + 22, ry + 6, 22, 22)
    g.font = '12.5px Georgia, serif'
    g.fillStyle = canAfford ? '#cdbb99' : '#6f6250'
    g.fillText(wordy(item), x + 50, ry + 19)
    g.textAlign = 'right'
    g.fillStyle = canAfford ? '#d8b45a' : '#6a5a34'
    g.fillText(price + 'g', x + W2 - 24, ry + 19); g.textAlign = 'left'
    if (canAfford) regions.push({ x: x + 14, y: ry, w: W2 - 28, h: 30,
      act: { t: 'buystall', item }, tip: { title: wordy(item), sub: price + ' gold' } })
    ry += 34
  }
  g.textAlign = 'center'; g.font = '11.5px Georgia, serif'; g.fillStyle = '#8a7340'
  g.fillText('you have ' + (me?.gold ?? 0) + ' gold', x + W2 / 2, y + H2 - 16)
  g.textAlign = 'left'
}
