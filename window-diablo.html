// ---------------------------------------------------------------------------
function drawCitizen(g, now) {
  const s = curState, me = myId && s?.players?.[myId]
  const x = 14, y = Math.max(12, VH - PANEL_H - PANE_H - 8)
  carve(g, x, y, PANE_W, PANE_H)
  plate(g, x + 14, y + 14, PANE_W - 28, 'The Citizen')
  regions.push({ x: x + PANE_W - 34, y: y + 12, w: 24, h: 24, act: { t: 'close', which: 'left' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + PANE_W - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + PANE_W - 22, y + 25)
  if (!me) return

  // name, calling, standing
  g.textAlign = 'center'
  g.font = '900 19px Cinzel, Georgia, serif'; g.fillStyle = '#e8d199'
  g.fillText(me.name || 'unnamed', x + PANE_W / 2, y + 58)
  g.font = '600 10px Cinzel, Georgia, serif'; g.fillStyle = '#8d7d63'
  g.save(); g.letterSpacing = '2.5px'
  g.fillText((callingOf(me) + '  \u00b7  standing ' + standingOf(me)).toUpperCase(), x + PANE_W / 2, y + 76)
  g.restore()

  // ---- the paperdoll: three slots and a body ------------------------------
  const dy = y + 92, dh = 96
  const gear = [['head', x + 26, dy + 6], ['weapon', x + 26, dy + 54], ['body', x + PANE_W - 70, dy + 30]]
  for (const [slot, sx2, sy2] of gear) {
    const it = me.equipment?.[slot]?.item
    const hot = inRect(mouse, sx2, sy2, 44, 44)
    slotFrame(g, sx2, sy2, 44, hot && it)
    if (it) {
      g.drawImage(itemIcon(it), sx2 + 5, sy2 + 5, 34, 34)
      regions.push({ x: sx2, y: sy2, w: 44, h: 44, act: { t: 'unequip', slot },
                     tip: { title: wordy(it), sub: 'Click to take off', col: rarityOf(it) } })
    } else {
      g.font = '600 8px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
      g.fillStyle = 'rgba(106,82,32,.6)'
      g.fillText(slot.toUpperCase(), sx2 + 22, sy2 + 22)
    }
  }
  // the citizen themself, standing between their gear
  g.save(); g.translate(0, 0)
  const bItem = me.equipment?.body?.item, bStar = bItem?.startsWith('star-')
  humanoid(g, x + PANE_W / 2 - 4, dy + dh, {
    scale: 1.25, bulk: 1, cloak: '#6e1f19', coat: '#4a1512', cape: capeOf(me),
    plate: bStar ? ['#9db4cc', '#4a5a70'] : bItem ? ['#8a6a34', '#3f2f14'] : ['#4a4034', '#251f18'],
    tunic: bItem ? (bStar ? '#7d90a8' : '#6a5230') : '#3a3226',
    boots: '#241d16', hair: '#2e2418',
    helm: me.equipment?.head?.item ? (me.equipment.head.item.startsWith('star-') ? '#9db4cc' : '#8a6a34') : null,
    step: 0, swing: -0.55, lantern: true, breath: performance.now() / 700,
    weapon: me.equipment?.weapon?.item
      ? (gg, hx, hy, a, sc) => drawWeapon(gg, hx, hy, a, sc, me.equipment.weapon.item) : null,
  })
  g.restore()

  // ---- every trade, and how far into it you are ---------------------------
  const ly = dy + dh + 14
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  const colW = (PANE_W - 44) / 2
  SKILL_ORDER.forEach((sk, i) => {
    const col = i % 2, row = (i / 2) | 0
    const sx2 = x + 22 + col * colW, sy2 = ly + row * 24
    const xp = me.skills?.[sk] ?? 0
    const pr = progressAt(xp), lv = pr.lv, f = pr.frac
    g.drawImage(skillGlyph(sk, 13, pr.mastered ? 'bright' : 'gold'), sx2, sy2 - 3)
    g.font = '10.5px Georgia, serif'
    g.fillStyle = pr.mastered ? '#e8d199' : '#a2957c'
    g.fillText(sk, sx2 + 18, sy2 + 8)
    g.textAlign = 'right'
    g.font = '700 11px Cinzel, Georgia, serif'
    g.fillStyle = pr.mastered ? '#e8d199' : '#cdbb99'
    g.fillText(String(lv), sx2 + colW - 12, sy2 + 8)
    g.textAlign = 'left'
    g.fillStyle = 'rgba(6,5,5,.85)'; g.fillRect(sx2 + 18, sy2 + 12, colW - 30, 3)
    g.fillStyle = pr.mastered ? '#b0913f' : '#4a6f8c'
    g.fillRect(sx2 + 18, sy2 + 12, (colW - 30) * f, 3)
    // A SKILL ROW OPENS ITS GUIDE. It was `noop` -- the one thing in the pane
    // that looked clickable and did nothing.
    const has = (SKILL_UNLOCKS[sk] ?? []).length
    regions.push({ x: sx2, y: sy2 - 4, w: colW - 12, h: 22,
                   act: has ? { t: 'guide', skill: sk } : { t: 'noop' },
                   tip: { title: sk + ' \u00b7 level ' + lv + (pr.mastered ? '  \u00b7  mastered' : ''),
                          sub: has ? 'click to see what it buys'
                             : pr.toNext.toLocaleString() + ' xp to ' + (lv + 1) } })
  })
}

// ---------------------------------------------------------------------------
// A CITIZEN'S OWN STALL
// ---------------------------------------------------------------------------
// Stocking, pricing, collecting and pulling it down. Stock is ONE WAY -- there
// is no button to take it back, because there is no verb to take it back, and
// a pane that implied otherwise would be lying about the rules.
function drawMyStall(g) {
  const s = curState, me = myId && s?.players?.[myId]
  const mk = myStallId && s?.nodes?.[myStallId]
  if (!mk) { paneModal = null; return }
  const good = mk.shelf ? Object.keys(mk.shelf)[0] : null
  const qty = good ? mk.shelf[good] : 0
  const W2 = 420, H2 = 300
  const x = Math.round((VW - W2) / 2), y = Math.max(12, (VH - PANEL_H - H2) / 2)
  regions.push({ x, y, w: W2, h: H2, act: { t: 'panebg' } })
  carve(g, x, y, W2, H2)
  plate(g, x + 14, y + 14, W2 - 28, 'Your Stall')
  regions.push({ x: x + W2 - 34, y: y + 12, w: 24, h: 24, act: { t: 'close', which: 'modal' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + W2 - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + W2 - 22, y + 25)

  g.textAlign = 'left'
  g.font = '12px Georgia, serif'; g.fillStyle = '#cdbb99'
  g.fillText(good ? qty + ' \u00d7 ' + wordy(good) : 'Nothing on the shelf', x + 26, y + 56)
  g.fillStyle = mk.ask > 0 ? '#b0913f' : '#7a6a52'
  g.fillText(mk.ask > 0 ? 'asking ' + mk.ask + ' gold each'
    : 'unpriced \u2014 nothing is for sale until you name a price', x + 26, y + 76)
  g.fillStyle = '#8a7d68'
  g.fillText('taken so far: ' + (mk.coin ?? 0) + ' gold', x + 26, y + 96)

  // stocking: every slot that may go on this shelf
  g.font = 'italic 11px Georgia, serif'; g.fillStyle = '#7a7263'
  g.fillText(good ? 'add more ' + wordy(good).toLowerCase() + ':' : 'put something on it:', x + 26, y + 124)
  let bx = x + 26, by = y + 138, put = 0
  for (let i = 0; i < (me?.inventory?.length ?? 0) && put < 12; i++) {
    const sl = me.inventory[i]
    if (!sl || sl.item === 'dragonbow') continue
    if (good && sl.item !== good) continue
    if (qty + (sl.qty ?? 1) > 200) continue
    regions.push({ x: bx, y: by, w: 30, h: 30, act: { t: 'stall_put', slot: i },
                   tip: { title: wordy(sl.item), sub: 'onto the shelf' } })
    g.drawImage(itemIcon(sl.item), bx - 2, by - 2)
    bx += 34; put++
    if (bx > x + W2 - 60) { bx = x + 26; by += 34 }
  }
  if (!put) { g.fillStyle = '#6a6152'; g.fillText(good ? 'nothing of that kind in your pack' : 'your pack is empty', x + 26, y + 150) }

  // the price, the takings, and pulling it down
  const btn = (bx2, by2, w2, label, act, on) => {
    regions.push({ x: bx2, y: by2, w: w2, h: 26, act })
    const hot = inRect(mouse, bx2, by2, w2, 26)
    g.fillStyle = on ? (hot ? '#3a3020' : '#2a2418') : '#211c14'
    g.fillRect(bx2, by2, w2, 26)
    g.strokeStyle = on ? '#6a5220' : '#3a3226'; g.lineWidth = 1
    g.strokeRect(bx2 + .5, by2 + .5, w2 - 1, 25)
    g.font = '700 11px Cinzel, Georgia, serif'; g.textAlign = 'center'
    g.fillStyle = on ? (hot ? '#e8d199' : '#b0913f') : '#5a5346'
    g.fillText(label, bx2 + w2 / 2, by2 + 14)
    g.textAlign = 'left'
  }
  const ry = y + H2 - 96
  g.font = '11px Georgia, serif'; g.fillStyle = '#8a7d68'
  g.fillText('price:', x + 26, ry + 13)
  for (const [dx2, d] of [[70, -100], [122, -10], [174, -1], [226, 1], [278, 10], [330, 100]])
    btn(x + dx2, ry, 46, (d > 0 ? '+' : '') + d, { t: 'stall_ask', by: d }, true)
  g.font = '700 13px Cinzel, Georgia, serif'; g.fillStyle = '#e8d199'
  g.fillText('\u2192 ' + askDraft + ' gold', x + 26, ry + 40)
  btn(x + 160, ry + 28, 110, 'SET THE PRICE', { t: 'stall_price' }, askDraft !== (mk.ask ?? 0))
  btn(x + 26, ry + 62, 170, 'TAKE ' + (mk.coin ?? 0) + ' GOLD', { t: 'stall_take' }, (mk.coin ?? 0) > 0)
  btn(x + 210, ry + 62, 184, 'PULL IT DOWN (stock spills)', { t: 'stall_down' }, true)
}

// ---------------------------------------------------------------------------
// WHAT A LEVEL BUYS
// ---------------------------------------------------------------------------
// The thresholds are scattered through the rules by nature -- a vein here, a
// recipe there -- and a citizen had no way to learn any of them except by
// arriving at one. The engine gathers them; this shows them, with what you
// have already passed marked off.
function drawGuide(g) {
  const s = curState, me = myId && s?.players?.[myId]
  const sk = guideSkill
  const list = SKILL_UNLOCKS[sk] ?? []
  const W2 = 460, H2 = Math.min(VH - PANEL_H - 40, 96 + list.length * 20)
  const x = Math.round((VW - W2) / 2), y = Math.max(12, (VH - PANEL_H - H2) / 2)
  regions.push({ x, y, w: W2, h: H2, act: { t: 'panebg' } })
  carve(g, x, y, W2, H2)
  plate(g, x + 14, y + 14, W2 - 28, titleCase(sk))
  regions.push({ x: x + W2 - 34, y: y + 12, w: 24, h: 24, act: { t: 'close', which: 'modal' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + W2 - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + W2 - 22, y + 25)
  const lv = XP_TO_LVL(me?.skills?.[sk] ?? 0)
  g.textAlign = 'center'
  g.font = 'italic 11px Georgia, serif'; g.fillStyle = '#8a7d68'
  g.fillText('you are level ' + lv, x + W2 / 2, y + 46)
  g.textAlign = 'left'
  let ry = y + 66
  for (const u of list) {
    if (ry > y + H2 - 16) break
    const past = lv >= u.level
    g.font = '700 12px Cinzel, Georgia, serif'
    g.fillStyle = past ? '#b0913f' : '#6a6152'
    g.fillText(String(u.level), x + 26, ry)
    g.font = '11.5px Georgia, serif'
    g.fillStyle = past ? '#cdbb99' : '#7a7263'
    g.fillText(u.text, x + 64, ry)
    if (past) {                              // a small mark against what you have
      g.strokeStyle = '#4a6f4a'; g.lineWidth = 1.6; g.lineCap = 'round'
      g.beginPath(); g.moveTo(x + 46, ry); g.lineTo(x + 49, ry + 3.5)
      g.lineTo(x + 54, ry - 4); g.stroke()
    }
    ry += 20
  }
}

// ---------------------------------------------------------------------------
// THE ANVIL
// ---------------------------------------------------------------------------
// Every recipe, always shown, and the important part is not the list but WHY a
// row is shut to you. A row that greys out teaches nothing; a row that says
// `smithing 28 (you have 22)` teaches the whole progression.
// THE ANVIL'S OWN TABLE, copied from the engine.
//
// This had drifted badly: it said a star-sword asked smithing 34 where the
// engine asks 45 AND magic 25, and it checked no magic requirement at all --
// so the pane offered work the world would refuse, with no explanation of
// why. A window that promises what the engine will not do is worse than a
// window that says nothing.
const FORGE = {
  'iron-dagger': { ore: 1 }, 'iron-hatchet': { ore: 1, logs: 1 },
  'iron-pickaxe': { ore: 1, logs: 1 }, 'iron-spear': { ore: 1, logs: 1 },
  'iron-helm': { ore: 1 }, 'iron-sword': { ore: 2 },
  'iron-maul': { ore: 2, logs: 1 }, 'iron-plate': { ore: 3 },
  'crossbow': { ore: 2, logs: 2 }, 'sigil-bow': { 'horn-bow': 1, sigil: 3 },
  'star-hatchet': { 'magic-stone': 2, ore: 1, logs: 1 },
  'star-pickaxe': { 'magic-stone': 2, ore: 1, logs: 1 },
  'star-helm': { 'magic-stone': 2, ore: 1 }, 'star-spear': { 'magic-stone': 2, ore: 1, logs: 1 },
  'star-dagger': { 'magic-stone': 2, ore: 1 }, 'star-sword': { 'magic-stone': 3, ore: 2 },
  'star-maul': { 'magic-stone': 3, ore: 2, logs: 1 }, 'star-flail': { 'magic-stone': 3, ore: 2, logs: 1 },
  'star-plate': { 'magic-stone': 4, ore: 3 },
  'handgonne': { 'magic-stone': 4, ore: 3, logs: 1 }, 'shot': { ore: 1 },
}
// smithing AND magic, exactly as SMITH_REQS has them -- and no more and no
// less. This once carried a iron ladder the engine did not have, so the
// anvil greyed out work the world would have done; the answer was not to
// delete the ladder but to put it where a rule belongs. A window may not
// legislate, but it must report.
const FORGE_REQ = {
  'iron-dagger': { smithing: 1 }, 'iron-hatchet': { smithing: 1 },
  'iron-pickaxe': { smithing: 1 }, 'iron-spear': { smithing: 5 },
  'iron-helm': { smithing: 7 }, 'iron-sword': { smithing: 10 },
  'iron-maul': { smithing: 14 }, 'iron-plate': { smithing: 20 },
  'crossbow': { smithing: 18 }, 'sigil-bow': { smithing: 12, magic: 25 },
  'star-hatchet': { smithing: 42, magic: 22 }, 'star-pickaxe': { smithing: 42, magic: 22 },
  'star-helm': { smithing: 40, magic: 20 }, 'star-spear': { smithing: 46, magic: 26 },
  'star-dagger': { smithing: 45, magic: 28 }, 'star-sword': { smithing: 45, magic: 25 },
  'star-maul': { smithing: 52, magic: 30 }, 'star-flail': { smithing: 50, magic: 29 },
  'star-plate': { smithing: 50, magic: 30 },
  'handgonne': { smithing: 90, magic: 40 }, 'shot': { smithing: 50 },
}
function have(me, item) {
  return (me?.inventory ?? []).reduce((a, sl) =>
    !sl ? a : (sl.item === item || (item === 'logs' && sl.item === 'heartwood')) ? a + (sl.qty ?? 1) : a, 0)
}
function forgeBlockers(me, recipe) {
  const out = []
  for (const [it, n] of Object.entries(FORGE[recipe])) {
    const got = have(me, it)
    if (got < n) out.push({ kind: 'mat', text: n + ' ' + wordy(it) + ' (you have ' + got + ')' })
  }
  for (const [sk, need] of Object.entries(FORGE_REQ[recipe] ?? { smithing: 1 })) {
    const lv = XP_TO_LVL(me?.skills?.[sk] ?? 0)
    if (lv < need) out.push({ kind: 'skill', text: sk + ' ' + need + ' (you have ' + lv + ')' })
  }
  if (!(me?.inventory ?? []).some(sl => !sl)) out.push({ kind: 'room', text: 'your pack is full' })
  return out
}
function drawForge(g, now) {
  const me = myId && curState?.players?.[myId]
  const W2 = 420, H2 = Math.min(VH - PANEL_H - 40, 520)
  const x = Math.round((VW - W2) / 2), y = Math.max(12, (VH - PANEL_H - H2) / 2)
  regions.push({ x, y, w: W2, h: H2, act: { t: 'panebg' } })
  carve(g, x, y, W2, H2)
  plate(g, x + 14, y + 14, W2 - 28, 'The Anvil')
  regions.push({ x: x + W2 - 34, y: y + 12, w: 24, h: 24, act: { t: 'close', which: 'modal' } })
  g.font = '700 13px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.fillStyle = inRect(mouse, x + W2 - 34, y + 12, 24, 24) ? '#e8d199' : '#6a5220'
  g.fillText('\u2715', x + W2 - 22, y + 25)
  if (!me) return
  let ry = y + 50
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
  for (const recipe of Object.keys(FORGE)) {
    if (ry > y + H2 - 34) break
    const bl = forgeBlockers(me, recipe)
    const ok = !bl.length
    const rh = ok ? 24 : 36
    const hot = inRect(mouse, x + 16, ry, W2 - 32, rh)
    g.fillStyle = ok ? (hot ? 'rgba(70,58,26,.85)' : 'rgba(30,26,16,.8)') : 'rgba(16,13,12,.7)'
    g.fillRect(x + 16, ry, W2 - 32, rh)
    g.strokeStyle = ok ? (hot ? '#e8d199' : '#6a5220') : 'rgba(60,50,42,.7)'; g.lineWidth = 1
    g.strokeRect(x + 16.5, ry + .5, W2 - 33, rh - 1)
    g.drawImage(itemIcon(recipe), x + 20, ry + 1, 22, 22)
    g.font = '12.5px Georgia, serif'
    g.fillStyle = ok ? '#e8d199' : '#7a7062'
    g.fillText(wordy(recipe), x + 48, ry + 16)
    g.textAlign = 'right'; g.font = '11px Georgia, serif'; g.fillStyle = '#8d7d63'
    g.fillText(Object.entries(FORGE[recipe]).map(([i, n]) => n + ' ' + wordy(i)).join(' + '), x + W2 - 24, ry + 16)
    g.textAlign = 'left'
    if (!ok) {
      g.font = '10.5px Georgia, serif'
      let bx = x + 48
      for (const b of bl) {
        g.fillStyle = b.kind === 'skill' ? '#c98b5a' : b.kind === 'room' ? '#a8446a' : '#7a7062'
        g.fillText(b.text, bx, ry + 30); bx += g.measureText(b.text).width + 14
      }
    } else regions.push({ x: x + 16, y: ry, w: W2 - 32, h: rh, act: { t: 'smith', recipe } })
    ry += rh + 4
  }
}

// ---- the hand -------------------------------------------------------------
// A drawn cursor, because a system arrow in the corner of a dark frame is the
// fastest way to remind someone they are looking at a web page.
function drawCursor(g) {
  const { x, y } = mouse
  const over = hover && (hover.kind === 'mob')
  const grab = hover && (hover.kind === 'ground' || hover.kind === 'node')
  g.save()
  if (over) {                                  // a ring, for something that will bleed
    g.strokeStyle = 'rgba(207,42,24,.95)'; g.lineWidth = 2
    g.beginPath(); g.arc(x, y, 11, 0, 7); g.stroke()
    g.strokeStyle = 'rgba(240,180,150,.8)'; g.lineWidth = 1.4
    for (const a of [0, 1.57, 3.14, 4.71]) {
      g.beginPath(); g.moveTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6)
      g.lineTo(x + Math.cos(a) * 15, y + Math.sin(a) * 15); g.stroke()
    }
  } else {
    const c = grab ? '#e8d199' : '#cdbb99'
    poly(g, [[x, y], [x, y + 17], [x + 4.6, y + 12.6], [x + 7.6, y + 19], [x + 10.6, y + 17.6],
             [x + 7.6, y + 11.4], [x + 13, y + 11]], c, 'rgba(4,3,5,.9)', 1.6)
    poly(g, [[x, y], [x, y + 17], [x + 4.6, y + 12.6], [x + 7.6, y + 19], [x + 10.6, y + 17.6],
             [x + 7.6, y + 11.4], [x + 13, y + 11]], c)
  }
  g.restore()
}

const inRect = (p, x, y, w, h) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h

// ---------------------------------------------------------------------------
// THE LEVEL
// ---------------------------------------------------------------------------
// A level is the largest thing that happens to a citizen in an ordinary hour,
// and it used to be a grey line in the log. It gets the middle of the screen:
// a burst of rays, the trade in full caps, the number, and then it goes away
// on its own without asking to be dismissed.
function drawLevelBanner(g, now) {
  if (!levelBanner) return
  const age = (now - levelBanner.at) / 3400
  if (age > 1) { levelBanner = null; return }
  // A PLAQUE, NOT A FIREWORK.
  //
  // This was sixteen rotating sunburst rays and a two-hundred-pixel bloom with
  // LEVEL UP in the middle of it -- a mobile-game reward screen dropped into a
  // world lit by one lantern. Everything else here is carved, hung or struck:
  // the panel is a slab, the gate is a plate, a stall's mark is engraved. A
  // level should arrive the same way.
  //
  // So: a plaque slides in from the dark, holds, and withdraws. Cut edges,
  // the trade's own engraved glyph, and one line of light passing across the
  // metal as it settles. No rays, no rotation, nothing that glows for its own
  // sake.
  const inK = clamp(age / .18, 0, 1)
  const outK = age > .80 ? 1 - (age - .80) / .20 : 1
  const ease = (k) => 1 - Math.pow(1 - k, 3)
  const cx2 = VW / 2
  const cy2 = VH * .30 + (1 - ease(inK)) * -18 + (1 - outK) * 10
  const W2 = Math.min(420, VW - 60), H2 = 96
  const x = cx2 - W2 / 2, y = cy2 - H2 / 2
  g.save()
  g.globalAlpha = outK * ease(inK)

  // the slab, carved out of the dark the way every other pane here is
  const bg = g.createLinearGradient(0, y, 0, y + H2)
  bg.addColorStop(0, 'rgba(28,22,16,.96)'); bg.addColorStop(1, 'rgba(12,9,8,.96)')
  g.fillStyle = bg; g.fillRect(x, y, W2, H2)
  g.strokeStyle = 'rgba(0,0,0,.9)'; g.lineWidth = 3; g.strokeRect(x - 1.5, y - 1.5, W2 + 3, H2 + 3)
  g.strokeStyle = '#7a6330'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, W2 - 1, H2 - 1)
  g.strokeStyle = 'rgba(255,240,214,.10)'; g.lineWidth = 1
  g.beginPath(); g.moveTo(x + 1, y + 1.5); g.lineTo(x + W2 - 1, y + 1.5); g.stroke()
  // a nail in each corner, like the gate's plate
  g.fillStyle = '#5a4620'
  for (const [nx, ny] of [[x + 9, y + 9], [x + W2 - 9, y + 9], [x + 9, y + H2 - 9], [x + W2 - 9, y + H2 - 9]]) {
    g.beginPath(); g.arc(nx, ny, 2.6, 0, 7); g.fill()
  }
  // one line of light crossing the metal as it settles, and then gone
  if (age < .55) {
    const sweep = age / .55
    g.save()
    g.beginPath(); g.rect(x, y, W2, H2); g.clip()
    g.globalCompositeOperation = 'lighter'
    const lx = x - 120 + sweep * (W2 + 240)
    const lg = g.createLinearGradient(lx - 60, 0, lx + 60, 0)
    lg.addColorStop(0, 'rgba(255,236,190,0)')
    lg.addColorStop(.5, 'rgba(255,236,190,' + (.16 * (1 - sweep)).toFixed(3) + ')')
    lg.addColorStop(1, 'rgba(255,236,190,0)')
    g.fillStyle = lg; g.fillRect(x, y, W2, H2)
    g.restore()
  }

  g.textAlign = 'left'; g.textBaseline = 'middle'
  // the trade's mark, engraved, at the left where a seal would be
  const G3 = 40
  g.drawImage(skillGlyph(levelBanner.skill, G3, 'bright'), x + 20, y + (H2 - G3) / 2)
  // and the words, set like an inscription rather than shouted
  g.save(); g.letterSpacing = '3.5px'
  g.font = '600 10px Cinzel, Georgia, serif'
  g.fillStyle = '#8a7340'
  g.fillText(levelBanner.skill.toUpperCase(), x + 76, y + 30)
  g.restore()
  g.font = '900 30px Cinzel, Georgia, serif'
  const tg = g.createLinearGradient(0, y + 40, 0, y + 70)
  tg.addColorStop(0, '#fbeec4'); tg.addColorStop(.55, '#e2b63e'); tg.addColorStop(1, '#8a6524')
  g.lineWidth = 3.5; g.strokeStyle = 'rgba(4,3,6,.9)'
  g.strokeText('LEVEL ' + levelBanner.lv, x + 76, y + 58)
  g.fillStyle = tg; g.fillText('LEVEL ' + levelBanner.lv, x + 76, y + 58)
  if (levelBanner.note) {
    g.textAlign = 'right'
    g.save(); g.letterSpacing = '2px'
    g.font = '600 10px Cinzel, Georgia, serif'
    g.fillStyle = 'rgba(226,182,62,.85)'
    g.fillText(levelBanner.note.toUpperCase(), x + W2 - 20, y + 30)
    g.restore()
  }
  g.restore()
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'
}

// ---------------------------------------------------------------------------
// THE MENU
// ---------------------------------------------------------------------------
// Seventeen of this constitution's forty verbs had no way in. A left click can
// only ever mean the obvious thing, so everything else needs somewhere to
// live, and the lineage this window comes from already solved it: right click
// the thing and it tells you what it will do for you. On a phone, hold.
function drawMenu(g) {
  if (!menu) return
  g.font = '12.5px Georgia, serif'
  let w = 96
  for (const it of menu.items) w = Math.max(w, g.measureText(it.label).width + 30)
  const rowH = 24, headH = 20
  const h = headH + menu.items.length * rowH + 6
  const x = clamp(menu.x, 4, VW - w - 4), y = clamp(menu.y, 4, VH - h - 4)
  menu.rect = { x, y, w, h }
  g.fillStyle = 'rgba(5,4,7,.96)'; g.fillRect(x, y, w, h)
  g.strokeStyle = 'rgba(0,0,0,.9)'; g.lineWidth = 2; g.strokeRect(x - 1, y - 1, w + 2, h + 2)
  const bd = g.createLinearGradient(x, y, x + w, y + h)
  bd.addColorStop(0, '#d8b463'); bd.addColorStop(.5, '#6a5220'); bd.addColorStop(1, '#c39a44')
  g.strokeStyle = bd; g.lineWidth = 1.6; g.strokeRect(x + .8, y + .8, w - 1.6, h - 1.6)
  g.textAlign = 'center'; g.textBaseline = 'middle'
  g.font = '700 9px Cinzel, Georgia, serif'
  g.save(); g.letterSpacing = '2px'
  g.fillStyle = 'rgba(141,125,99,.95)'
  g.fillText((menu.title || 'choose').toUpperCase(), x + w / 2, y + headH / 2 + 2)
  g.restore()
  g.strokeStyle = 'rgba(106,82,32,.55)'; g.lineWidth = 1
  g.beginPath(); g.moveTo(x + 6, y + headH); g.lineTo(x + w - 6, y + headH); g.stroke()
  // THE BACKDROP GOES DOWN FIRST.
  //
  // hitRegion walks `regions` BACKWARDS, so the last thing pushed is the first
  // thing found. This backdrop used to be pushed after the rows, which meant it
  // won every hit test and swallowed every click on the menu -- walk here,
  // light a fire, fletch a bow, all of it, silently. One line in the wrong
  // order took out seventeen verbs.
  regions.push({ x, y, w, h, act: { t: 'menubg' } })
  g.textAlign = 'left'
  menu.items.forEach((it, i) => {
    const ry = y + headH + i * rowH
    const hot = !it.dim && inRect(mouse, x, ry, w, rowH)
    if (hot) {
      const hg = g.createLinearGradient(x, ry, x + w, ry)
      hg.addColorStop(0, 'rgba(106,82,32,.65)'); hg.addColorStop(1, 'rgba(106,82,32,.15)')
      g.fillStyle = hg; g.fillRect(x + 3, ry, w - 6, rowH)
    }
    g.font = '12.5px Georgia, serif'
    g.fillStyle = it.dim ? '#5f574a' : hot ? '#fbeec4' : '#cdbb99'
    g.fillText(it.label, x + 13, ry + rowH / 2 + 1)
    if (!it.dim) regions.push({ x, y: ry, w, h: rowH, act: { t: 'menu', i } })
  })
  g.textBaseline = 'alphabetic'
}

  g.restore()
  g.font = '900 ' + (26 * (1 + (1 - inK) * .25)).toFixed(1) + 'px Cinzel, Georgia, serif'
  g.save(); g.letterSpacing = '3px'
  g.lineWidth = 4; g.strokeStyle = 'rgba(4,3,6,.85)'
  g.strokeText(placeBanner.locale.toUpperCase(), cx2, cy2 + 4)
  const tg = g.createLinearGradient(0, cy2 - 10, 0, cy2 + 16)
  tg.addColorStop(0, '#fbeec4'); tg.addColorStop(.6, '#d8b463'); tg.addColorStop(1, '#8a6524')
  g.fillStyle = tg
  g.fillText(placeBanner.locale.toUpperCase(), cx2, cy2 + 4)

    g.font = '600 9px Cinzel, Georgia, serif'

    g.fillStyle = 'rgba(141,125,99,.85)'

  g.restore()
  g.textBaseline = 'alphabetic'
